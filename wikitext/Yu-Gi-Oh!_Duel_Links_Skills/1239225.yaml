title: A World of Ice and Water
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Monde de Glace et d'Eau
  | ja_name               = 
  | text                  = You can only use this Skill's second and third effects once per Duel.<br/>1: Any effect damage your cards would inflict to your opponent becomes 0, except for effect damage from "[[Icejade Curse (Duel Links)|Icejade Curse]]".<br/>2: Reveal 1 Level 7 [[WATER]] [[Tuner]] in your hand and send 1 card from your hand to the Graveyard. Add up to 2 "[[Icejade]]" cards from your Deck to your hand. Then, Set 1 "[[Icejade Cenote Enion Cradle (Duel Links)|Icejade Cenote Enion Cradle]]" from outside your Deck to your field.<br/>3: If there is a Level 10 [[Synchro Monster]] on the field or your opponent controls a monster, choose 1 "Icejade" monster from your Deck that does not have the same name as any monster you control, and play it in face-down Defense Position. (Its battle position can be changed.) Then, Set 1 "Icejade" Spell/Trap Card from your hand or Deck to your field. (This card can be activated the same turn.)
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br/>1 : Tous les dommages d'effets que vos cartes infligeraient normalement à votre adversaire tombent à zéro, excepté les dommages d'effets de "Malédiction Jadeglace".<br/>2 : Révélez 1 Syntoniseur EAU de Niveau 7 dans votre main et envoyez 1 carte depuis votre main au Cimetière. Ajoutez jusqu'à 2 cartes "Jadeglace" de votre Deck à votre main. Puis, Posez 1 "Berceau Enion de Cénote Jadeglace" depuis l'extérieur de votre Deck sur votre Terrain.<br/>3 : S'il y a un Monstre Synchro de Niveau 10 sur le Terrain ou si votre adversaire contrôle un monstre, choisissez 1 monstre "Jadeglace" depuis votre Deck qui n'a pas le même nom qu'un monstre que vous contrôlez, et jouez-le en Position de Défense face verso (sa position de combat peut être modifiée). Puis, Posez 1 Carte Magie/Piège "Jadeglace" de votre main ou Deck sur votre Terrain (cette carte peut être activée durant le même tour).
