title: Eyes of Sovereign Defiance
wikitext: |-
  {{Duel Links Skill
  | fr_name     = Yeux de la Défiance Souveraine
  | text        = You can only use each of this Skill's second and third effects once per Duel.<br />1: Any effect damage your cards would inflict to your opponent becomes 0, and during your Main Phase, you cannot Normal or Special Summon (excluding Special Summons from the Extra Deck) any monsters, except [[FIRE]] monsters and "[[Diabellstar the Black Witch (Duel Links)|Diabellstar the Black Witch]]".<br />2: Can be activated by revealing 1 Level 1 "[[Snake-Eye]]" monster or 1 "Diabellstar the Black Witch" in your hand. Add up to 2 cards from your Deck to your hand, choosing from "[[Sinful Spoils]]" Spell/Trap Cards and "[[Divine Temple of the Snake-Eye (Duel Links)|Divine Temple of the Snake-Eye]]".<br />3: Can be activated if only your opponent controls a monster. Send 1 "[[Sinful Spoils of Betrayal - Silvera (Duel Links)|Sinful Spoils of Betrayal - Silvera]]" from your Deck to the Graveyard, and Set 1 "[[WANTED: Seeker of Sinful Spoils (Duel Links)|WANTED: Seeker of Sinful Spoils]]" from your Deck. (This card can be activated the same turn.)
  | fr_text     = Vous pouvez utiliser les deuxième et troisième effets de cette Compétence une fois Duel.<br />1 : Tous les dommages d'effets que vos cartes infligeraient normalement à votre adversaire tombent à zéro, et pendant votre Main Phase, vous ne pouvez Invoquer Normalement ou Spécialement de monstres, excepté des monstres FEU et "Diabellstar la Sorcière Sombre" (hors Invocations Spéciales depuis l'Extra Deck).<br />2 : Peut être activée en révélant 1 monstre "Œil de Serpent" de Niveau 1 ou 1 "Diabellstar la Sorcière Sombre" dans votre main. Ajoutez jusqu'à 2 cartes de votre Deck à votre main, en choisissant entre des Cartes Magie/Piège "Butin du Péché" et "Temple Divin de l'Œil de Serpent".<br />3 : Peut être activée si seul votre adversaire contrôle un monstre. Envoyez 1 "Butin du Péché de la Trahison - Silvera" depuis votre Deck au Cimetière, et Posez 1 "RECHERCHÉE : Chercheuse du Butin du Péché" depuis votre Deck (cette carte peut être activée durant le même tour.)
