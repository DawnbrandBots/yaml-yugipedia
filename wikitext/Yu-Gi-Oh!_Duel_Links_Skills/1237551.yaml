title: Thorns of Hatred in Full Bloom
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Épines de la Haine en Pleine Floraison
  | ja_name               = 
  | text                  = You can only use this [[Skill]]'s second and third effects once per [[Duel]].<br/>1: At the beginning of the Duel, add 2 [[Synchro Monster]]s to your [[Extra Deck]]. (You can only have at most 3 copies of each card.) During this Duel, any [[effect damage]] your cards would inflict to your opponent becomes 0, except for effect damage from "[[Black Rose Garden (Duel Links)|Black Rose Garden]]" and "[[Bramble Rose Dragon (Duel Links)|Bramble Rose Dragon]]".<br/>2: Reveal 1 "[[Twilight Rose Black Knight (Duel Links)|Twilight Rose Black Knight]]" or "[[Vengeful Witch (Duel Links)|Vengeful Witch]]" in your hand. Add 2 cards that mention "[[Black Rose Dragon (Duel Links)|Black Rose Dragon]]" from your [[Deck]] to your hand. Then, return 1 card from your hand to your Deck.<br/>3: If you control "Bramble Rose Dragon" or your opponent controls a monster, play 1 "[[Rage Rose Witch (Duel Links)|Rage Rose Witch]]" from your Extra Deck or [[Graveyard]] and send 1 "[[Glow-Up Bulb (Duel Links)|Glow-Up Bulb]]" from outside your Deck to the Graveyard.
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br/>1 : Au début du Duel, ajoutez 2 Monstres Synchro à votre Extra Deck (vous ne pouvez avoir que 3 exemplaires maximum de chaque carte). Lors de ce Duel, tous les dommages d'effets que vos cartes infligeraient normalement à votre adversaire tombent à 0, excepté les dommages d'effets de "Jardin des Roses Noires" et "Dragon Rose Ronces".<br/>2 : Révélez 1 "Chevalier Noir de la Rose du Crépuscule" ou "Sorcière Vengeresse" dans votre main. Ajoutez 2 cartes qui mentionnent "Dragon Rose Noire" de votre Deck à votre main. Puis, renvoyez 1 carte de votre main dans votre Deck.<br/>3 : Si vous contrôlez "Dragon Rose Ronces" ou si votre adversaire contrôle un monstre, jouez 1 "Sorcière de la Rose Rageuse" depuis votre Extra Deck ou Cimetière et envoyez 1 "Bulbe Luisant" depuis l'extérieur de votre Deck au Cimetière.
