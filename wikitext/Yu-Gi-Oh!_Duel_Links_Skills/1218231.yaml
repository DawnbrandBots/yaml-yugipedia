title: Mathmech Slicer
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Trancheur Mathmech
  | ja_name               = 
  | text                  = You can only use this Skill's second effect once per turn.<br />1: At the beginning of the Duel, add 2 "[[Primathmech Alembertian (Duel Links)|Primathmech Alembertian]]" and 3 "[[Mathmech Circular (Duel Links)|Mathmech Circular]]" from outside your Deck to your Deck or Extra Deck. During this Duel, you cannot Normal or Special Summon (excluding Special Summons from the Extra Deck) any monsters, except "[[Mathmech]]" monsters, any effect damage your cards would inflict to your opponent becomes 0, and if your "Mathmech" Synchro Monster attacks a Defense Position monster, and the attacking monster's ATK is higher than the defense of the target, inflict battle damage equal to the difference between the attacking monster's ATK and the target's DEF.<br />2: Reveal 1 "Mathmech" Tuner from your hand and send 1 card from your hand or field to the Graveyard, then add 2 "Mathmech" monsters from your Deck to your hand. If it is turn 2 onward, you can also set 1 "Mathmech" Spell/Trap Card from your hand or Deck. (This card can be activated the same turn.)
  | fr_text               = Vous ne pouvez utiliser le deuxième effet de cette Compétence qu'une fois par tour.<br />1 : Au début du Duel, ajoutez 2 "Alembertien Primathmech" et 3 "Circulaire Mathmech" depuis l'extérieur de votre Deck à votre Deck ou Extra Deck. Lors de ce Duel, vous ne pouvez pas Invoquer Normalement ou Spécialement de monstres, excepté des monstres "Mathmech" (hors Invocations Spéciales depuis l'Extra Deck), tous les dommages d'effets que vos cartes infligeraient normalement à votre adversaire tombent à zéro, et si votre Monstre Synchro "Mathmech" ataque un monstre en Position de Défense et que l'ATK du monstre attaquant est supérieure à la DEF de la cible, vous infligez des dommages de combat égaux à la différence entre l'ATK du monstre attaquant et la DEF de la cible.<br />2 : Révélez 1 monstre Syntoniseur "Mathmech" dans votre main et envoyez 1 carte depuis votre main ou Terrain au Cimetière, puis ajoutez 2 monstres "Mathmech" de votre Deck à votre main. À partir du 2e tour, vous pouvez aussi Poser 1 Carte Magie/Piège "Mathmech" depuis votre main ou Deck (cette carte peut être activée durant le même tour).
