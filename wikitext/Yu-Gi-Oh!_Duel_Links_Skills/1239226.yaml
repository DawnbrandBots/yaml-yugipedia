title: Goblin Bikers on a Rampage
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Saccage des Gobelins Motards
  | ja_name               = 
  | text                  = You can only use this Skill's second and third effects once per Duel.<br/>1: Any effect damage your cards would inflict to your opponent becomes 0, and you can only Special Summon [[Xyz Monster]]s from your Extra Deck.<br/>2: Reveal 1 "[[Goblin Biker Dugg Charger (Duel Links)|Goblin Biker Dugg Charger]]" or "[[Goblin Biker Grand Entrance (Duel Links)|Goblin Biker Grand Entrance]]" in your hand. Add up to 2 "[[Goblin Biker]]" monsters from your Deck to your hand. Then, you can Set 1 "[[Goblin Biker Grand Bash (Duel Links)|Goblin Biker Grand Bash]]" from your Deck to your field.<br/>3: If you control "[[Goblin Biker Big Gabonga (Duel Links)|Goblin Biker Big Gabonga]]" or only your opponent controls a monster, Set 1 "Goblin Biker" Trap Card from your Deck to your field. (This card can be activated the same turn.)
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br/>1 : Tous les dommages d'effets que vos cartes infligeraient normalement à votre adversaire tombent à zéro, et vous pouvez seulement Invoquer Spécialement des Monstres Xyz depuis votre Extra Deck.<br/>2 : Révélez 1 "Dugg le Chargeur des Gobelins Motards" ou "Entrée Fracassante des Gobelins Motards" dans votre main. Ajoutez jusqu'à 2 monstres "Gobelins Motards" de votre Deck à votre main. Puis, vous pouvez Poser 1 "Teuf Fracassante des Gobelins Motards" de votre Deck sur votre Terrain.<br/>3 : Si vous contrôlez "Grand Gabonga des Gobelins Motards" ou si seul votre adversaire contrôle un monstre, Posez 1 Carte Piège "Gobelins Motards" depuis votre Deck sur votre Terrain (cette carte peut être activée durant le même tour).
