title: Miracle Neos Contact
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Contact Néos Miracle
  | ja_name               = 
  | text                  = You can only use this Skill's second and third effects once per Duel.<br />1: At the beginning of the Duel, add 12 Fusion Monsters to your Extra Deck. During this Duel, you can only Special Summon "[[Neos]]", "[[Elemental HERO]]", and "[[Neo-Spacian]]" monsters, and you can activate "[[Super Polymerization (Duel Links)|Super Polymerization]]" and "[[Favorite Contact (Duel Links)|Favorite Contact]]" the turn they are Set.<br />2: Reveal 1 "[[Elemental HERO Spirit of Neos (Duel Links)|Elemental HERO Spirit of Neos]]" or "[[Miracle Ejector (Duel Links)|Miracle Ejector]]" from your hand. Add 1 "Elemental HERO" monster from your Deck and 1 "[[Polymerization (Duel Links)|Polymerization]]" from outside of your Deck to your hand.<br />3: If you control "Elemental HERO Spirit of Neos" or your opponent controls a monster, Set up to 1 "Super Polymerization" and up to 1 "[[E - Emergency Call (Duel Links)|E - Emergency Call]]" from your Deck to your field.
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br />1 : Au début du Duel, ajoutez 12 Monstres Fusion depuis votre Extra Deck. Lors de ce Duel, vous ne pouvez Invoquer Spécialement que des monstres "Néos", "HÉROS Élémentaire" et "Néo-Spacien", et vous pouvez activer "Super Polymérisation" et "Contact Favori" durant le tour où ils sont Posés.<br />2 : Révélez 1 "Esprit de Néos, HÉROS Élémentaire" ou "Éjecte Miracle" dans votre main. Ajoutez à votre main 1 monstre "HÉROS Élémentaire" depuis votre Deck et 1 "Polymérisation" depuis l'extérieur de votre Deck.<br />3 : Si vous contrôlez "Esprit de Néos, HÉROS Élémentaire" ou si votre adversaire contrôle un monstre, Posez jusqu'à 1 "Super Polymérisation" et jusqu'à 1 "E - Appel de Détresse" de votre Deck sur votre Terrain.
