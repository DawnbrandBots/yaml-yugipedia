  | fr_name               = Les Liens qui Lient
  | ja_name               = 
  | text                  = You can only use this Skill's second and third effects once per Duel.<br />1: At the beginning of the Duel, add 1 "[[Shining Sarcophagus (Duel Links)|Shining Sarcophagus]]" and 1 "[[Silent Swordsman Zero (Duel Links)|Silent Swordsman Zero]]" to your Deck. (You can only have at most 3 copies of each card.)<br />2: Can be used before your normal draw. One of the cards from your normal draw this turn will be "Shining Sarcophagus" from your Deck.<br />3: Reveal 1 monster that mentions "Shining Sarcophagus" from your hand, then either place that card on the bottom of your Deck or send it to the Graveyard. Then, draw 2 cards.
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br />1 : Au début du Duel, ajoutez 1 "Sarcophage Brillant" et 1 "Spadassin Silencieux Zéro" à votre Deck (vous ne pouvez avoir que 3 exemplaires maximum de chaque carte).<br />2 : Peut être utilisée avant votre pioche normale. L'une des cartes de votre pioche normale de ce tour sera "Sarcophage Brillant" depuis votre Deck.<br />3 : Révélez 1 monstre qui mentionne "Sarcophage Brillant" depuis votre main. Puis, placez cette carte au-dessous de votre Deck ou envoyez-la au Cimetière. Puis, piochez 2 cartes.
