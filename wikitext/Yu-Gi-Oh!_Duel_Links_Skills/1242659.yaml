  | text                = You can only use this [[Skill]]'s first and second effects once per [[Duel]].<br/>1: Can be used before your normal draw. Your normal draw this turn will be 1 [[Level 4 Monster Cards|Level 4]] or lower "[[Rokket]]" monster or "[[Quick Launch (Duel Links)|Quick Launch]]" from your [[Deck]].<br/>2: Reveal 1 of the following cards in your hand: 1 Level 4 or lower "Rokket" monster, "[[Rapid Trigger (Duel Links)|Rapid Trigger]]", "[[Heavy Interlock (Duel Links)|Heavy Interlock]]", or "[[Double Interlock (Duel Links)|Double Interlock]]". Either place that card on the bottom of your Deck or send it to the [[Graveyard]]. Then, draw 2 cards.
  | fr_text             = Vous ne pouvez utiliser le premier et le deuxième effet de cette Compétence qu'une seule fois par Duel.<br/>1 : Peut être utilisée avant votre pioche normale. Votre pioche normale de ce tour sera 1 monstre "Rokkette" de max. Niveau 4 ou "Lancement Rapide" de votre Deck.<br/>2 : Révélez 1 des cartes suivantes dans votre main : 1 monstre "Rokkette" de max. Niveau 4, "Amorce Rapide", "Interverrouillage Lourd", ou "Interverrouillage Double". Placez cette carte au-dessous de votre Deck ou envoyez-la au Cimetière. Puis, piochez 2 cartes.
