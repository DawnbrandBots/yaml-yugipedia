title: I'll Show You Perfection!
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Vous allez voir ce qu'est la perfection !
  | ja_name               = 
  | text                  = You can only use this Skill's second and third effects once per Duel.<br />1: At the start of your first turn, send 1 "[[Cyber Dragon (Duel Links)|Cyber Dragon]]" from your Deck to the Graveyard. During this Duel, any effect damage your cards would inflict to your opponent becomes 0.<br />2: Reveal 1 "Cyber Dragon" or "[[Cyber Jormungardr (Duel Links)|Cyber Jormungardr]]" from your hand. Add up to 2 Level 2 or lower "[[Cyber Dragon (archetype)|Cyber Dragon]]" monsters from your Deck to your hand. Then, Set 1 "[[Cybernetic Overflow (Duel Links)|Cybernetic Overflow]]" from outside of your Deck to your field. (This card can be activated the same turn.)<br />3: From turn 2 onward, add up to 3 "Cyber Dragon" from your Deck and/or Graveyard to your hand. During this Duel, unless you successfully Special Summon "[[Cyber End Dragon (Duel Links)|Cyber End Dragon]]", you cannot activate the effects of Spell Cards other than "[[Polymerization (Duel Links)|Polymerization]]" and "[[Power Bond (Duel Links)|Power Bond]]".
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br />1 : Au début de votre premier tour, envoyez 1 "Cyber Dragon" depuis votre Deck au Cimetière. Lors de ce Duel, tous les dommages d'effets que vos cartes infligeraient normalement à votre adversaire tombent à zéro.<br />2 : Révélez 1 "Cyber Dragon" ou "Cyber Jörmungandr" dans votre main. Ajoutez jusqu'à 2 monstres "Cyber Dragon" de max. Niveau 2 de votre Deck à votre main. Puis, Posez 1 "Débordement Cybernétique" depuis l'extérieur de votre Deck sur votre Terrain (cette carte peut être activée durant le même tour).<br />3 : À prtir du 2e tour, ajoutez jusqu'à 3 "Cyber Dragon" de votre Deck et/ou Cimetière à votre main. Lors de ce Duel, à moins que vous n'arriviez à Invoquer Spécialement "Dragon Cyber Ultime", vous ne pouvez pas activer les effets de Cartes Magie autres que "Polymérisation" et "Lien de Puissance".
