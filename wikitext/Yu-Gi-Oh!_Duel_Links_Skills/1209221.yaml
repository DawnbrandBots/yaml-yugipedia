title: Cynet Extended
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Cynet étendu
  | text                  = You can use each of this Skill's second and third effects once per Duel if your Extra Deck contains 5 or more "[[Code Talker]]" monsters with different names.<br />1: Link Monsters on your field gain 500 ATK, and you cannot Special Summon from the Extra Deck, except [[Cyberse]] Link Monsters.<br />2: Can be activated by revealing 1 Level 3 or lower Cyberse monster or 1 "[[Cynet Codec (Duel Links)|Cynet Codec]]" in your hand, and shuffling 1 card from your hand to the Deck. Add up to 2 cards from your Deck to your hand, choosing from "[[Cyberse Gadget (Duel Links)|Cyberse Gadget]]" and "[[Cynet]]" Spell/Trap Cards.<br />3: Can be activated if you control "[[Decode Talker (Duel Links)|Decode Talker]]", or if your opponent controls a monster. Play 1 "Code Talker" monster from your Extra Deck, and add 1 "[[Cynet Crosswipe (Duel Links)|Cynet Crosswipe]]" from outside your Deck to your hand.
  | fr_text               = Vous ne pouvez utiliser le deuxième et le troisième effet de cette Compétence qu'une seule fois par Duel si votre Extra Deck contient min. 5 monstres "Codeur Bavard" avec des noms différents.<br />1 : Les Monstres Lien sur votre Terrain gagnent 500 ATK, et vous ne pouvez pas Invoquer Spécialement depuis l'Extra Deck, excepté des Monstres Lien Cyberse.<br />2 : Peut être activée en révélant 1 monstre Cyberse de max. Niveau 3 ou 1 "Cynet Codec" dans votre main, et en mélangeant 1 carte de votre main dans le Deck. Ajoutez jusqu'à 2 cartes de votre Deck à votre main, en choisissant parmi "Cyberse Gadget" et les Cartes Magie/Piège "Cynet".<br />3 : Peut être activée si vous contrôlez "Décodeur Bavard", ou si votre adversaire contrôle un monstre. Jouez 1 monstre "Codeur Bavard" depuis votre Extra Deck, et ajoutez 1 "Cynet Colisicroisé" depuis l'extérieur de votre Deck à votre main.
