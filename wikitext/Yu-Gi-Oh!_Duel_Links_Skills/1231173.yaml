title: Light the Way to the Future
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Illuminer la voie vers l'avenir
  | ja_name               = 
  | text                  = You can only use this Skill's second and third effects once per Duel.<br />1: Any effect damage your cards would inflict to your opponent becomes 0, except for effect damage from cards that mention "[[Shining Sarcophagus (Duel Links)|Shining Sarcophagus]]".<br />2: Reveal 1 [[Spellcaster]] monster that mentions "Shining Sarcophagus" from your hand. Add up to 2 cards from your Deck to your hand, choosing from "Shining Sarcophagus" and monsters that mention it. If only your opponent controls a card, you can also play 1 "[[Silent Swordsman Zero (Duel Links)|Silent Swordsman Zero]]" from your hand or Deck.<br />3: From turn 2 onward, send 1 "Silent Swordsman Zero" from your field to the Graveyard, then play 1 "[[Silent Swordsman LV7 (Duel Links)|Silent Swordsman LV7]]" from outside of your Deck in face-down Defense Position. (Its battle position can be changed.) If you control "Shining Sarcophagus", add 1 "[[Silent Sword Slash (Duel Links)|Silent Sword Slash]]" from outside of your Deck to your hand.
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br />1 : Tous les dommages d'effets que vos cartes infligeraient normalement à votre adversaire tombent à zéro, excepté les dommages d'effets de cartes qui mentionnent "Sarcophage Brillant".<br />2 : Révélez 1 monstre Magicien qui mentionne "Sarcophage Brillant" dans votre main. Ajoutez jusqu'à 2 cartes de votre Deck à votre main, choisissant parmi la carte "Sarcophage Brillant" et des monstres qui la mentionnent. Si seul votre adversaire contrôle une carte, vous pouvez aussi jouer 1 "Spadassin Silencieux Zéro" depuis votre main ou Deck.<br />3 : À prtir du 2e tour, envoyez 1 "Spadassin Silencieux Zéro" depuis votre Terrain au Cimetière, puis jouez 1 "Spadassin Silencieux LV7" depuis l'extérieur de votre Deck en Position de Défense face verso (sa position de combat peut être modifiée). Si vous contrôlez "Sarcophage Brillant", ajoutez 1 "Coup d'Épée Silencieuse" depuis l'extérieur de votre Deck à votre main.
