title: Speed Spell - Crossover Acceleration (Fusion)
wikitext: |-
  {{Duel Links Skill
  | name        = Speed Spell - Crossover Acceleration (Fusion)
  | fr_name     = Magie de Vitesse - Accélération de crossover (Fusion)
  | ja_name     = 
  | text        = Can be used by removing [[Speed Counter]]s. Effects vary depending on how many Speed Counters you remove.<br/>When you select this [[Duel Runner]], Speed Counters will not increase even if you Synchro Summon, but they will increase by 2 if you Fusion Summon.<hr />Remove 3<br />Add 1 "[[Fusion Substitute (Duel Links)|Fusion Substitute]]" to your Graveyard from outside of the Deck.<hr />Remove 3<br />Add 1 "[[Polymerization (archetype)|Polymerization]]" Normal Spell Card or "[[Fusion (archetype)|Fusion]]" Normal Spell Card from your Graveyard to your hand.<hr />Remove 3<br />All Fusion Monsters you control gain 300 ATK.<hr />Remove 9<br />Add 1 Level 4 or lower [[LIGHT]] [[Fairy]] monster from your Deck or Graveyard to your hand.
  | fr_text     = Peut être utilisée en retirant des compteurs de vitesse. Les effets varient en fonction du nombre de compteurs de vitesse retirés.<br />Lorsque vous sélectionnez ce Duel Runner, les compteurs de vitesse n'augmenteront pas, même si vous Invoquerez par Synchro, mais ils augmenteront de 2 si vous Invoquez par Fusion.<hr />3 retirés<br />Ajoutez 1 "Fusion Alternative" à votre Cimetière depuis l'extérieur du Deck.<hr />3 retirés<br />Ajoutez 1 Carte Magie Normale "Polymérisation" ou "Fusion" à votre main depuis votre Cimetière.<hr />3 retirés<br />Tous les Monstres Fusion que vous contrôlez gagnent 300 ATK.<hr />9 supprimés<br />Ajoutez 1 monstre Elfe LUMIÈRE de max. Niveau 4 depuis votre Deck ou Cimetière à votre main.
