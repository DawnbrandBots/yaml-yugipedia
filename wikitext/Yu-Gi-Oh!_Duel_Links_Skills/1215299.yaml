  {{Duel Links Skill
  | fr_name               = Bleu profond de la Mer
  | ja_name               = 
  | text                  = You can use each of this Skill's second and third effects once per Duel if your Deck (excluding the Extra Deck) contains 10 or more "[[Marincess]]" cards.<br />1: You cannot Normal or Special Summon any monsters, except [[WATER]] monsters, and any effect damage your cards would inflict to your opponent becomes 0, except effect damage of "Marincess" cards.<br />2: Reveal 1 [[Level 4 Monster Cards|Level 4]] "Marincess" monster or "Marincess" [[Spell Card]] from your hand, then add up to 2 "Marincess" monsters from your Deck to your hand. Then, send 1 card from your hand to the Graveyard or shuffle it into the Deck.<br />3: If your opponent controls a monster, or you control a [[Link 4 Monster Cards|Link 4]] monster, add 1 "Marincess" Spell/[[Trap Card]] from your Deck to your hand, then place 1 "[[Marincess Wonder Heart (Duel Links)|Marincess Wonder Heart]]" from your Extra Deck in your Extra Monster Zone.
  | fr_text               = Vous pouvez utiliser les deuxième et troisième effets de cette Compétence une fois par Duel si votre Deck (hors Extra Deck) contient min. 10 cartes "Marincesse".<br />1 : Vous ne pouvez pas Invoquer Normalement ou Spécialement de monstres, excepté des monstres EAU, et les dommages d'effets que vos cartes infligeraient à votre adversaire tombent à zéro, excepté les dommages d'effets des cartes "Marincesse".<br />2 : Révélez 1 monstre "Marincesse" de Niveau 4 ou Carte Magie "Marincesse" dans votre main, puis ajoutez jusqu'à 2 monstres "Marincesse" de votre Deck à votre main. Puis, envoyez 1 carte depuis votre main au Cimetière ou mélangez-la dans le Deck.<br />3 : Si votre adversaire contrôle un monstre, ou si vous contrôlez 1 monstre Lien 4, ajoutez 1 Carte Magie/Piège "Marincesse" de votre Deck à votre main, puis placez 1 "Cœur de Merveille Marincesse" depuis votre Extra Deck dans votre Zone Monstre Extra.
