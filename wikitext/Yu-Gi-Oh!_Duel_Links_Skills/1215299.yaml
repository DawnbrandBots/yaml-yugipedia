  | text                  = You can use each of this Skill's second and third effects once per Duel if your Deck (excluding the Extra Deck) contains 10 or more "[[Marincess]]" cards.<br />1: You cannot Normal or Special Summon any monsters, except [[WATER]] monsters, and any effect damage your cards would inflict to your opponent becomes 0, except effect damage of "Marincess" cards.<br />2: Reveal 1 [[Level 4 Monster Cards|Level 4]] "Marincess" monster or "Marincess" [[Spell Card]] from your hand, then add up to 2 "Marincess" monsters from your Deck to your hand. Then, send 1 card from your hand to the Graveyard or shuffle it into the Deck.<br />3: If your opponent controls a monster, or you control a [[Link 4 Monster Cards|Link 4]] monster, add 1 "Marincess" Spell/[[Trap Card]] from your Deck to your hand, then place 1 "[[Marincess Wonder Heart (Duel Links)|Marincess Wonder Heart]]" from your Extra Deck in your Extra Monster Zone.
