  | text                  = You can use 1 of the following effects once per turn. Each effect can only be used once per Duel.<br />●Play 1 "[[Elemental HERO Flame Wingman (Duel Links)|Elemental HERO Flame Wingman]]" (treated as a Fusion Summon) from outside your Deck to your field, then add 1 "[[Skyscraper (Duel Links)|Skyscraper]]" from outside your Deck to your hand.<br />●All monsters you control gain ATK equal to the number of Fusion Monsters on your field, in your Graveyard, or banished x 500.<br />●All Fusion Monsters you control have their ATK tripled until the end of this turn. Afterward, choose one of these monsters and increase its ATK by 16000 until the end of the turn.
  | fr_text               = Vous pouvez utiliser l'un des effets suivants une fois par tour. Chaque effet ne peut être utilisé qu'une fois par Duel.<br />●Jouez 1 "Homme-Oiseau de Feu, HÉROS Élémentaire" (traité comme une Invocation Fusion) depuis l'extérieur de votre Deck sur votre Terrain, puis ajoutez 1 "Gratte-Ciel" depuis l'extérieur de votr Deck à votre main.<br />● Tous les monstres que vous contrôlez gagnent une ATK égale au nombre de Monstres Fusion sur votre Terrain, dans votre Cimetière ou bannis x 500.<br />●L'ATK de tous les Monstres Fusion que vous contrôlez est triplée jusqu'à la fin de ce tour. Après, choisissez l'un de ces monstres et augmentez son ATK de 16000 jusqu'à la fin de ce tour.
