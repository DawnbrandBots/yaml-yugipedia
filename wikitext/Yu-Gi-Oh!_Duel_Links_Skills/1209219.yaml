title: Wings to the Heavens
wikitext: |-
  {{For|the Skill used by NPCs in Tag Duel Tournament events|""Wings to the Heavens"" (event Skill)}}
  {{Duel Links Skill
  | fr_name               = Vol vers les cieux
  | text                  = You can only use this Skill's second and third effects once per Duel.<br />1: At the beginning of the Duel, add 1 "[[Black-Winged Dragon (Duel Links)|Black-Winged Dragon]]" and 1 "[[Blackwing Armor Master (Duel Links)|Blackwing Armor Master]]" to your Extra Deck. During this Duel, you cannot Normal or Special Summon Effect Monsters, except "[[Blackwing]]" monsters and Level 10 or lower [[DARK]] [[Dragon]] or [[Winged Beast]] Synchro Monsters.<br />2: Reveal 1 monster in your hand that mentions "Black-Winged Dragon". Add 2 "Blackwing" monsters from your Deck to your hand, then send 1 card from your hand to the Graveyard.<br />3: If you control a "Blackwing" Synchro Monster, or if your opponent controls a monster. Play 1 "Blackwing Armor Master" from your Extra Deck or Graveyard in face-down Defense Position. (Its battle position can be changed.) Then, add 1 "[[Blackbird Close (Duel Links)|Blackbird Close]]" from outside your Deck to your hand.
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br />1 : Au début du Duel, ajoutez 1 "Dragon Ailes Sombres" et 1 "Aile Noire - Maître des Armures" à votre Extra Deck. Lors de ce Duel, vous ne pouvez pas Invoquer Normalement ou Spécialement de Monstres à Effet, excepté des monstres "Aile Noire" et des Monstres Synchro Dragon TÉNÈBRES de max. Niveau 10 ou Bête Ailée.<br />2 : Révélez 1 monstre dans votre main qui mentionne "Dragon Ailes Sombres". Ajoutez 2 monstres "Aile Noire" de votre Deck à votre main, puis envoyez 1 carte depuis votre main au Cimetière.<br />3 : Si vous contrôlez un Monstre Synchro "Aile Noire" ou si votre adversaire contrôle un monstre. Jouez 1 "Aile Noire - Maître des Armures" depuis votre Extra Deck ou Compétence en Position de Défense face verso (sa position de combat peut être modifiée). Puis, ajoutez 1 "Oiseau Noir Achevé" depuis l'extérieur de votre Deck à votre main.
