title: Infernity Revival
wikitext: |-
  {{Duel Links Skill
  | fr_name               = Renaissance Enfernité
  | text                  = You can only use this Skill's second and third effects once per Duel if your Deck (excluding the Extra Deck) contains 10 or more "[[Infernity]]" monsters.<br />1: Any effect damage your cards would inflict to your opponent becomes 0, you can only Special Summon 1 monster with an original Level of 9 or higher once per turn, and once per turn, you can activate 1 "Infernity" Trap Card during the turn it was Set.<br />2: Shuffle up to 3 cards from your hand that are "[[This Creepy Little Punk (Duel Links)|This Creepy Little Punk]]" or "Infernity" monsters into the Deck. Send "Infernity" monsters from your Deck to the Graveyard equal to the number shuffled, and if you do, add 1 "Infernity" card from your Deck to your hand.<br />3: Can be activated from turn 2 onward. Play 3 "Infernity" monsters (1 Level 2, 1 Level 3, 1 Level 4) from your hand and/or Deck in face-down Defense Position. (Their battle positions can be changed.) While a monster played by this effect is on your field, you cannot Special Summon from the Extra Deck, except Synchro Monsters.
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel si votre Deck (hors Extra Deck) contient min. 10 monstres "Enfernité".<br />1 : Tous les dommages d'effets que vos cartes infligeraient normalement à votre adversaire tombent à zéro ; vous ne pouvez Invoquer Spécialement 1 monstre avec un Niveau d'origine de min. 9 qu'une fois par tour ; et une fois par tour, vous pouvez activer 1 Carte Piège "Enfernité" durant le tour où elle a été Posée.<br />2 : Mélangez jusqu'à 3 cartes qui sont des monstres "Ce Sinistre Petit Vaurien" ou "Enfernité" de votre main dans le Deck. Envoyez un nombre de monstres "Enfernité" depuis votre Deck au Cimetière, égal au nombre mélangé, et si vous le faites, ajoutez 1 carte "Enfernité" depuis votre Deck à votre main.<br />3 : Peut être activée à partir du 2e tour. Jouez 3 monstres "Enfernité" (1 de Niveau 2, 1 de Niveau 3, 1 de Niveau 4) depuis votre main et/ou Deck en Position de Défense face verso (leur position de combat peut être modifiée). Tant qu'un monstre joué par cet effet est sur votre Terrain, vous ne pouvez pas Invoquer Spécialement depuis l'Extra Deck, excepté des Monstres Synchro.
