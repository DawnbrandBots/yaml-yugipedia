title: Beasts from the Abyss
wikitext: |-
  {{Duel Links Skill
  | fr_name             = Bêtes de l'Abysse
  | text                = You can only use this Skill's second and third effects once per Duel.<br />1: You cannot Special Summon from the Extra Deck, except [[LIGHT]] or [[DARK]] monsters that are Level 8 or higher.<br />2: Reveal 1 "[[Bystial]]" monster or 1 "[[Blazing Cartesia, the Virtuous (Duel Links)|Blazing Cartesia, the Virtuous]]" in your hand. Send 1 "[[Fallen of Albaz (Duel Links)|Fallen of Albaz]]" from your Deck to the Graveyard, and add 1 "Bystial" monster and 1 monster that mentions "Fallen of Albaz", except "Fallen of Albaz", from your Deck to your hand.<br />3: Can be activated if only your opponent controls a monster. Send 1 "[[The Bystial Alba Los (Duel Links)|The Bystial Alba Los]]" from outside your Deck to the Graveyard. Then, you can add 1 "Bystial" monster from your Deck to your hand.
  | fr_text             = Vous ne pouvez utiliser le deuxième et le troisième effet de cette Compétence qu'une seule fois par Duel.<br />1 : Vous ne pouvez pas Invoquer Spécialement depuis l'Extra Deck, excepté des monstres LUMIÈRE ou TÉNÈBRES de min. Niveau 8.<br />2 : Révélez 1 monstre "Bystial" ou 1 "Éclatante Cartésia, la Vertueuse" dans votre main. Envoyez 1 "Albaz le Déchu" depuis votre Deck au Cimetière, et ajoutez 1 monstre "Bystial" et 1 monstre qui mentionne "Albaz le Déchu", excepté "Albaz le Déchu", de votre Deck à votre main.<br />3 : Peut être activée seulement si votre adversaire contrôle un monstre. Envoyez 1 "Le Bystial Alba Los" depuis l'extérieur de votre Deck au Cimetière. Puis, vous pouvez ajouter 1 monstre "Bystial" de votre Deck à votre main.
