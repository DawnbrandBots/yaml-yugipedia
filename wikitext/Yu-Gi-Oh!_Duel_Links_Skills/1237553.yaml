  | text                  = You can only use this [[Skill]]'s second and third effects once per [[Duel]].<br/>1: During this Duel, you can only [[Normal Summon|Normal]] or [[Special Summon]] "[[Crimson Dragon (Duel Links)|Crimson Dragon]]", [[WIND]] [[Dragon]] [[Synchro Monster]]s, "[[Stardust (archetype)|Stardust]]" monsters, and [[Tuner]]s.<br/>2: Return 2 cards from your hand to your [[Deck]], including a [[Level 1]] [[LIGHT]] monster with 0 [[ATK]] and [[DEF]]. Play 2 [[Level 4]] "Stardust" monsters from your Deck, and [[Set]] up to 2 [[Spell]]/[[Trap]] Cards that mention "[[Stardust Dragon (Duel Links)|Stardust Dragon]]" from your Deck to your field.<br/>3: If you control "Stardust Dragon", or your opponent controls a monster, choose up to 3 Level 1 LIGHT Dragon monsters from your Deck. Add 1 of them to your hand and send the rest to the [[Graveyard]].
  | fr_text               = Vous ne pouvez utiliser les deuxième et troisième effets de cette Compétence qu'une fois par Duel.<br/>1 : Lors de ce Duel, vous pouvez seulement Invoquer Normalement ou Spécialement "Dragon Cramoisi", des Monstres Synchro Dragon VENT, des monstres "Poussière d'Étoile", et des Syntoniseurs.<br/>2 : Renvoyez 2 cartes de votre main à votre Deck, dont un monstre LUMIÈRE de Niveau 1 avec 0 ATK et DEF. Jouez 2 monstres "Poussière d'Étoile" de Niveau 4 depuis votre Deck, et Posez jusqu'à 2 Cartes Magie/Piège qui mentionnent "Dragon Poussière d'Étoile" de votre Deck sur votre Terrain.<br/>3 : Si vous contrôlez "Dragon Poussière d'Étoile", ou si votre adversaire contrôle un monstre, choisissez jusqu'à 3 monstres Dragon LUMIÈRE de Niveau 1 depuis votre Deck. Ajoutez l'un d'entre eux à votre main et envoyez-le reste au Cimetière.
