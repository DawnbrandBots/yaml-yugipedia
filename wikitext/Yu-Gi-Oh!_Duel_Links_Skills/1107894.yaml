  '''[REQUIREMENT]''' Can be activated from Turn 2 onward if all of the monsters in your constructed Deck are [[Machine]] Type and none are Level 7.<br/>'''[EFFECT]''' Choose 1 face-up monster on your field with 1100/2100/2400 ATK, and it gains 700 ATK until the end of the turn. You can shuffle 1 card from your hand into the Deck, and if you do, add 1 "[[Proto-Cyber Dragon (Duel Links Rush Duel)|Proto-Cyber Dragon]]" or 1 "[[Fusion (Duel Links)|Fusion]]" from your Deck or Graveyard to your hand.
