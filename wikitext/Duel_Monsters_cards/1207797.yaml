  | text                  = If this card is in your [[hand]]: You can [[send]] 1 "[[Speedroid]]" card from your [[Main Deck|Deck]] to the [[GY]], except "Speedroid Darumaknocker"; [[Special Summon]] this card, also you cannot Special Summon for the rest of this [[turn]], except [[WIND]] monsters. If this card is sent from the [[field]] to the GY: You can [[Add a card|add]] 1 "Speedroid" [[Spell]]/[[Trap]] from your Deck to your hand, then if you control a "[[Clear Wing]]" monster, you can [[destroy]] 1 monster on the field. You can only use each effect of "Speedroid Darumaknocker" once per turn.
  | fr_text               = Si cette carte est dans votre main : vous pouvez envoyer 1 carte "Vitesseroid" ("Frappeur de Daruma Vitesseroid" exclu) depuis votre Deck au Cimetière ; Invoquez Spécialement cette carte, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres VENT exclus) le reste de ce tour. Si cette carte est envoyée depuis le Terrain au Cimetière : vous pouvez ajouter 1 Magie/Piège "Vitesseroid" depuis votre Deck à votre main, puis si vous contrôlez un monstre "Aile Claire", vous pouvez détruire 1 monstre sur le Terrain. Vous ne pouvez utiliser chaque effet de "Frappeur de Daruma Vitesseroid" qu'une fois par tour.
  | de_text               = Falls sich diese Karte in deiner Hand befindet: Du kannst 1 „Geschwindigkeitsroid“-Karte von deinem Deck auf den Friedhof legen, außer „Geschwindigkeitsroid Daruma-Klopfer“; beschwöre diese Karte als Spezialbeschwörung, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von WIND Monstern. Falls diese Karte vom Spielfeld auf den Friedhof gelegt wird: Du kannst deiner Hand 1 „Geschwindigkeitsroid“-Zauber/Falle von deinem Deck hinzufügen, dann, falls du ein „Glasflügel“-Monster kontrollierst, kannst du 1 Monster auf dem Spielfeld zerstören. Du kannst jeden Effekt von „Geschwindigkeitsroid Daruma-Klopfer“ nur einmal pro Spielzug verwenden.
  | it_text               = Se questa carta è nella tua mano: puoi mandare 1 carta "Velociroid" dal tuo Deck al Cimitero, eccetto "Velociroid Darumabbattitore"; Evoca Specialmente questa carta, inoltre non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri VENTO. Se questa carta viene mandata dal Terreno al Cimitero: puoi aggiungere 1 Magia/Trappola "Velociroid" dal tuo Deck alla tua mano, poi se controlli un mostro "Ala Chiara", puoi distruggere 1 mostro sul Terreno. Puoi utilizzare ogni effetto di "Velociroid Darumabbattitore" una sola volta per turno.
  | pt_text               = Se este card estiver na sua mão: você pode enviar 1 card "Velocidaroide" do seu Deck para o Cemitério, exceto "Velocidaroide Batedaruma"; Invoque este card por Invocação-Especial e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros de VENTO. Se este card for enviado do campo para o Cemitério: você pode adicionar 1 Magia/Armadilha "Velocidaroide" do seu Deck à sua mão e, depois, se você controlar um monstro "Asas Transparentes", você pode destruir 1 monstro no campo. Você só pode usar cada efeito de "Velocidaroide Batedaruma" uma vez por turno.
  | es_text               = Si esta carta está en tu mano: puedes mandar al Cementerio 1 carta "Velociroid" en tu Deck, excepto "Velociroid Llamadaruma"; Invoca esta carta de Modo Especial, y además no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos de VIENTO. Si esta carta es mandada del Campo al Cementerio: puedes añadir a tu mano 1 Mágica/Trampa "Velociroid" en tu Deck, y después si controlas un monstruo "Ala Transparente", puedes destruir 1 monstruo en el Campo. Sólo puedes usar cada efecto de "Velociroid Llamadaruma" una vez por turno.
