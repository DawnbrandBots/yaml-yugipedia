  | fr_text               = 2+ monstres (un Monstre Fusion, Synchro, Xyz ou Lien inclus)<br />Gagne ces effets selon le nombre de monstres qu'elle pointe.<br />● 1+ : Une fois par tour, durant votre Main Phase : vous pouvez annuler les effets de tous les monstres face recto actuellement contrôlés par votre adversaire, et aussi, leur ATK sera divisée par deux jusqu'à la fin de ce tour.<br />● 2+ : Non affectée par les effets activés de votre adversaire.<br />● 3 : Une fois par tour de l'adversaire (Effet Rapide) : vous pouvez bannir cette carte, et aussi toutes les cartes contrôlées par votre adversaire.
  | de_text               = 2+ Monster, darunter ein Fusions-, Synchro-, Xyz- oder Linkmonster<br />Diese Karte erhält diese Effekte, basierend auf der Anzahl der Monster, auf die sie zeigt.<br />● 1+: Einmal pro Spielzug, während deiner Main Phase: Du kannst die Effekte aller offenen Monster annullieren, die dein Gegner derzeit kontrolliert, zusätzlich werden ihre ATK bis zum Ende dieses Spielzugs halbiert.<br />● 2+: Bleibt von aktivierten Effekten deines Gegners unberührt.<br />● 3: Einmal pro Spielzug des Gegners (Schnelleffekt): Du kannst diese Karte verbannen, zusätzlich alle Karten, die dein Gegner kontrolliert.
  | it_text               = 2+ mostri, compreso un Mostro Fusione, Synchro, Xyz o Link<br />Guadagna questi effetti a seconda del numero di mostri a cui punta.<br />● 1+: Una volta per turno, durante la tua Main Phase: puoi annullare gli effetti di tutti i mostri scoperti attualmente controllati dal tuo avversario, inoltre fino alla fine di questo turno, i loro ATK vengono dimezzati.<br />● 2+: Immune agli effetti attivati del tuo avversario.<br />● 3: Una volta per turno dell'avversario (Effetto Rapido): puoi bandire questa carta, inoltre tutte le carte controllate dal tuo avversario.
  | pt_text               = 2+ monstros, incluindo um Monstro de Fusão, Sincro, Xyz ou Link<br />Ganha esses efeitos de acordo com o número de monstros para os quais apontar.<br />● 1+: Uma vez por turno, durante sua Fase Principal: você pode negar os efeitos de todos os monstros com a face para cima que seu oponente controla atualmente e, além disso, até o final deste turno, o ATK deles é diminuído pela metade.<br />● 2+: Não é afetado pelos efeitos ativados do seu oponente.<br />● 3: Uma vez por turno do oponente (Efeito Rápido): você pode banir este card e, além disso, todos os cards que seu oponente controla.
  | es_text               = 2+ monstruos, incluyendo un Monstruo de Fusión, Sincronía, Xyz o Enlace<br />Gana estos efectos basados en el número de monstruos a los que apunte.<br />● 1+: Una vez por turno, durante tu Main Phase: puedes negar los efectos de todos los monstruos boca arriba que controle tu adversario en este momento y además, hasta el final de este turno, su ATK se divide a la mitad.<br />● 2+: No es afectado por los efectos activados de tu adversario.<br />● 3: Una vez por turno del adversario (Efecto Rápido): puedes desterrar esta carta, y además todas las cartas que controle tu adversario.
  | ja_text               = 融合・Ｓ・Ｘ・Ｌモンスターを含むモンスター２体以上<br />①：このカードのリンク先のモンスターの数によって、このカードは以下の効果を得る。●１体以上：１ターンに１度、自分メインフェイズに発動できる。相手フィールドの全ての表側表示モンスターの効果は無効化され、その攻撃力はターン終了時まで半分になる。●２体以上：このカードは相手が発動した効果を受けない。●３体：相手ターンに１度、発動できる。このカード及び相手フィールドのカードを全て除外する。
