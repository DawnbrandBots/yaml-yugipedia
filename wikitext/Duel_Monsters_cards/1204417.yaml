  | text                  = While you [[control]] "[[Umi]]", your opponent cannot [[target]] [[WATER]] [[Link Monster]]s you control with card [[effect]]s. If this card is [[Add a card|added]] to your [[hand]], except by drawing it: You can [[reveal]] this card and 1 WATER [[monster]] in your hand; [[Special Summon]] both, also you cannot Special Summon for the rest of this [[turn]], except WATER monsters. You can only use this effect of "Coralianectes, the Luminous Cradle Dragon" once per turn.
  | fr_text               = Tant que vous contrôlez "Umi", votre adversaire ne peut pas cibler de Monstres Lien EAU que vous contrôlez avec des effets de carte. Si cette carte est ajoutée à votre main, sauf en la piochant : vous pouvez révéler cette carte et 1 monstre EAU dans votre main ; Invoquez-les Spécialement tous les deux, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres EAU exclus) le reste de ce tour. Vous ne pouvez utiliser cet effet de "Coralianectes, le Dragon du Berceau Lumineux" qu'une fois par tour.
  | de_text               = Solange du „Umi“ kontrollierst, kann dein Gegner WASSER Linkmonster, die du kontrollierst, nicht als Ziel für Karteneffekte wählen. Falls diese Karte deiner Hand hinzugefügt wird, außer durch Ziehen: Du kannst diese Karte und 1 WASSER Monster in deiner Hand vorzeigen; beschwöre beide als Spezialbeschwörung, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von WASSER Monstern. Du kannst diesen Effekt von „Coralianectes, der leuchtende Wiegendrache“ nur einmal pro Spielzug verwenden.
  | it_text               = Mentre controlli "Umi", il tuo avversario non può scegliere come bersaglio i Mostri Link ACQUA che controlli con gli effetti delle carte. Se questa carta viene aggiunta alla tua mano, eccetto pescandola: puoi rivelare questa carta e 1 mostro ACQUA nella tua mano; Evoca Specialmente entrambi, inoltre non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri ACQUA. Puoi utilizzare questo effetto di "Coralianectes, il Drago Culla Luminosa" una sola volta per turno.
  | pt_text               = Enquanto você controlar "Umi", seu oponente não pode escolher Monstros Link de ÁGUA que você controla como alvo de efeitos de card. Se este card for adicionado à sua mão, exceto ao comprá-lo: você pode revelar este card e 1 monstro de ÁGUA na sua mão; Invoque os dois por Invocação-Especial e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros de ÁGUA. Você só pode usar este efeito de "Coralianectes, o Dragão do Berço Reluzente" uma vez por turno.
  | es_text               = Mientras controlas "Umi", tu adversario no puede seleccionar con efectos de cartas Monstruos de Enlace de AGUA que controles. Si esta carta es añadida a tu mano, excepto robándola: puedes mostrar esta carta y 1 monstruo de AGUA en tu mano; Invoca ambos de Modo Especial, y además no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos de AGUA. Sólo puedes usar este efecto de "Coralianectes, el Dragón Original Brillante" una vez por turno.
  | ja_text               = このカード名の①の効果は１ターンに１度しか使用できない。①：このカードがドロー以外の方法で手札に加わった場合、このカードと手札の水属性モンスター１体を相手に見せて発動できる。その２体を特殊召喚する。この効果の発動後、ターン終了時まで自分は水属性モンスターしか特殊召喚できない。②：自分フィールドに「海」が存在する限り、自分フィールドの水属性Ｌモンスターを相手は効果の対象にできない。
  | ko_text               = 
  | sc_text               = 此卡名的①效果1回合仅可使用1次。①：此卡以抽牌以外的方法加入手牌的情况下，将此卡和手牌的1只水属性怪兽出示给对手可以发动。将该2只特殊召唤。此效果发动后，直至回合结束时为止自己仅可特殊召唤水属性怪兽。②：只要自己场上存在“海”，对手不可将自己场上的水属性连接怪兽作为效果的对象。
