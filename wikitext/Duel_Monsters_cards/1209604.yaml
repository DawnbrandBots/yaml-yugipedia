  | text                 = [[Face-down]] cards in your [[Spell & Trap Zone]] cannot be [[destroy]]ed by card [[effect]]s. You can only use each of the following effects of "Dominusteer Rosepamela" once per turn. During your opponent's [[turn]] ([[Quick Effect]]): You can [[reveal]] this card in your [[hand]]; [[Add a card|add]] 1 "[[Dominus Purge (archetype)|Dominus Purge]]" card from your [[Main Deck|Deck]] to your hand, then [[discard]] 1 card. If this card is [[Normal Summon|Normal]] or [[Special Summon]]ed: You can [[Set]] 1 "[[Dominators]]" or "Dominus Purge" [[Trap]] from your Deck or [[GY]]. It can be [[activate]]d this turn.
