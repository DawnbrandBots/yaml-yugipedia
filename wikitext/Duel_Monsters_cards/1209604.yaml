  | ja_text              = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：相手ターンに、手札のこのカードを相手に見せて発動できる。デッキから「ドミナス・パージ」カード１枚を手札に加える。その後、自分の手札を１枚選んで捨てる。②：このカードが召喚・特殊召喚した場合に発動できる。自分のデッキ・墓地から「列王」罠カードか「ドミナス・パージ」罠カード１枚を自分フィールドにセットする。この効果でセットしたカードはセットしたターンでも発動できる。③：自分の魔法＆罠ゾーンの裏側表示カードは効果では破壊されない。
  | ko_text              = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 상대 턴에, 패의 이 카드를 상대에게 보여주고 발동할 수 있다. 덱에서 "도미나스 퍼지" 카드 1장을 패에 넣는다. 그 후, 자신의 패를 1장 고르고 버린다. ②: 이 카드를 일반 소환 / 특수 소환했을 경우에 발동할 수 있다. 자신의 덱 / 묘지에서 "열왕" 함정 카드나 "도미나스 퍼지" 함정 카드 1장을 자신 필드에 세트한다. 이 효과로 세트한 카드는 세트한 턴에도 발동할 수 있다. ③: 자신의 마법 & 함정 존의 뒷면 표시 카드는 효과로는 파괴되지 않는다.
  | sc_text              = 此卡名的①②效果1回合仅可各使用1次。①：在对手回合中，向对手出示手牌的此卡可以发动。从牌组将1张“圣主王之粉碎”卡加入手牌。然后，挑选自己的1张手牌舍弃。②：此卡召唤・特殊召唤的情况下可以发动。从自己牌组・墓地将1张“列王”陷阱卡或“圣主王之粉碎”陷阱卡放置在自己场上。以此效果放置的卡在放置的回合也可以发动。③：自己的魔法与陷阱区域的里侧表示卡不会因效果被破坏。
