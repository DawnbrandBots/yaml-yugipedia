  | text                  = 3 [[WATER]] [[monsters]]<br />This card's name becomes "[[Umi]]" while on the [[field]]. You can only use each of the following effects of "Levia-Dragoon - Daedalus" [[once per turn]]. If this card is [[Link Summon]]ed: You can [[Special Summon]] 1 monster that mentions "[[Atlantis, City of the Sea Dragon]]" from your [[Main Deck|Deck]]. During the [[Main Phase]] ([[Quick Effect]]): You can [[send]] 1 [[face-up]] "Umi" you [[control]] to the [[GY]]; [[discard]] your opponent's entire [[hand]], and if you do, they [[Draw a card|draw]] the same number of cards. Neither player can activate cards or effects in response to this effect's activation.
  | fr_text               = 3 monstres EAU<br />Le nom de cette carte devient "Umi" tant qu'elle est sur le Terrain. Vous ne pouvez utiliser chacun des effets suivants de "Soldat Dragon-Levia - Dédale" qu'une fois par tour. Si cette carte est Invoquée par Lien : vous pouvez Invoquer Spécialement 1 monstre qui mentionne "Atlantis, Cité du Dragon des Mers" depuis votre Deck. Durant la Main Phase (Effet Rapide) : vous pouvez envoyer 1 "Umi" face recto que vous contrôlez au Cimetière ; défaussez toute la main de votre adversaire, et si vous le faites, il pioche le même nombre de cartes. Aucun joueur ne peut activer ni de cartes ni d'effets en réponse à l'activation de cet effet.
  | de_text               = 3 WASSER Monster<br />Der Name dieser Karte wird zu „Umi“, solange sie auf dem Spielfeld liegt. Du kannst jeden der folgenden Effekte von „Leviadragoner - Daedalus“ nur einmal pro Spielzug verwenden. Falls diese Karte als Linkbeschwörung beschworen wird: Du kannst 1 Monster, das „Atlantis, Stadt des Seedrachen“ erwähnt, als Spezialbeschwörung von deinem Deck beschwören. Während der Main Phase (Schnelleffekt): Du kannst 1 offenes „Umi“, das du kontrollierst, auf den Friedhof legen; wirf die gesamte Hand deines Gegners ab und falls du dies tust, zieht er dieselbe Anzahl Karten. Kein Spieler kann Karten oder Effekte als Reaktion auf die Aktivierung dieses Effekts aktivieren.
  | it_text               = 3 mostri ACQUA<br />Il nome di questa carta diventa "Umi" mentre è sul Terreno. Puoi utilizzare ognuno dei seguenti effetti di "Levia-Dragones - Dedalo" una sola volta per turno. Se questa carta viene Evocata Link: puoi Evocare Specialmente 1 mostro che menziona "Atlantide, Città del Drago del Mare" dal tuo Deck. Durante la Main Phase (Effetto Rapido): puoi mandare 1 "Umi" scoperto che controlli al Cimitero; scarta tutta la mano del tuo avversario e, se lo fai, lui pesca lo stesso numero di carte. Nessun giocatore può attivare carte o effetti in risposta all'attivazione di questo effetto.
  | pt_text               = 3 monstros de ÁGUA<br />O nome deste card se torna "Umi" enquanto estiver no campo. Você só pode usar cada um dos seguintes efeitos de "Levia-Dragoon - Daedalus" uma vez por turno. Se este card for Invocado por Invocação-Link: você pode Invocar por Invocação-Especial 1 monstro que mencione "Atlântida, a Cidade do Dragão Marinho" do seu Deck. Durante a Fase Principal (Efeito Rápido): você pode enviar 1 "Umi" com a face para cima que você controla para o Cemitério; descarte toda a mão do seu oponente e, se isso acontecer, ele compra o mesmo número de cards. Nenhum duelista pode ativar cards ou efeitos em resposta à ativação deste efeito.
  | es_text               = 3 monstruos de AGUA<br />El nombre de esta carta se convierte en "Umi" mientras esté en el Campo. Sólo puedes usar cada uno de los siguientes efectos de "Levia-Dragoon - Dédalo" una vez por turno. Si esta carta es Invocada por Enlace: puedes Invocar de Modo Especial 1 monstruo que mencione "Atlántida, Ciudad del Dragón Marino" desde tu Deck. Durante la Main Phase (Efecto Rápido): puedes mandar al Cementerio 1 "Umi" boca arriba que controles; descarta la mano entera de tu adversario y, si lo haces, él roba el mismo número de cartas. Ningún jugador puede activar cartas o efectos en respuesta a la activación de este efecto.
  | ja_text               = 水属性モンスター３体<br />このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードがＬ召喚した場合に発動できる。デッキから「竜都アトランティス」のカード名が記されたモンスター１体を特殊召喚する。②：このカードはモンスターゾーンに存在する限り、カード名を「海」として扱う。③：自分・相手のメインフェイズに、自分フィールドの表側表示の「海」１枚を墓地へ送って発動できる（この発動に対してお互いは効果を発動できない）。相手の手札を全て捨て、その数だけ相手はドローする。
  | ko_text               = 
  | sc_text               = 水属性怪兽3只<br />此卡名的①③效果1回合仅可各使用1次。①：此卡连接召唤的情况下可以发动。从牌组将1只记载有“龙都 亚特兰蒂斯”卡名的怪兽特殊召唤。②：此卡只要存在于怪兽区域，卡名视为“海”。③：在自己・对手的主要阶段，将自己场上的1张表侧表示的“海”送至墓地可以发动（应对此发动，双方不可发动效果）。将对手的手牌全部舍弃，对手依其数量抽牌。
