  | text                  = Each player can [[Special Summon]] 1 [[DARK]] [[Spellcaster]] [[monster]] from their [[hand]] or [[Main Deck|Deck]] (but neither player can [[activate]] their [[effect]]s this [[turn]]), then if you Special Summoned a monster whose original name is "[[Dark Magician]]" or "[[Dark Magician Girl]]", you can [[Add a card|add]] 1 [[Spell]]/[[Trap]] that mentions "Dark Magician" from your Deck to your [[hand]], except "Dark Magical Curtain". You can only activate 1 "Dark Magical Curtain" per turn.
  | fr_text               = Chaque joueur peut Invoquer Spécialement 1 monstre TÉNÈBRES Magicien depuis sa main ou Deck (mais aucun joueur ne peut activer leurs effets ce tour), puis si vous avez Invoqué Spécialement un monstre dont le nom d'origine est "Magicien Sombre" ou "Magicienne des Ténèbres", vous pouvez ajouter 1 Magie/Piège qui mentionne "Magicien Sombre" ("Rideau Magique Sombre" exclu) depuis votre Deck à votre main. Vous ne pouvez activer qu'1 "Rideau Magique Sombre" par tour.
  | de_text               = Jeder Spieler kann 1 FINSTERNIS Hexer-Monster als Spezialbeschwörung von seiner Hand oder seinem Deck beschwören (aber kein Spieler kann in diesem Spielzug ihre Effekte aktivieren), dann, falls du ein Monster, dessen Grund-Name „Dunkler Magier“ oder „Dunkles Magier-Mädchen“ ist, als Spezialbeschwörung beschworen hast, kannst du deiner Hand 1 Zauber/Falle, der oder die „Dunkler Magier“ erwähnt, von deinem Deck hinzufügen, außer „Dunkler Magievorhang“. Du kannst nur 1 „Dunkler Magievorhang“ pro Spielzug aktivieren.
  | it_text               = Ogni giocatore può Evocare Specialmente 1 mostro OSCURITÀ Incantatore dalla sua mano o Deck (ma nessun giocatore può attivare i loro effetti in questo turno), poi se hai Evocato Specialmente un mostro il cui nome originale è "Mago Nero" o "Ragazza Maga Nera", puoi aggiungere 1 Magia/Trappola che menziona "Mago Nero" dal tuo Deck alla tua mano, eccetto "Sipario Magico Oscuro". Puoi attivare solo 1 "Sipario Magico Oscuro" per turno.
  | pt_text               = Cada duelista pode Invocar por Invocação-Especial 1 monstro Mago de TREVAS da mão ou do Deck dele (mas nenhum duelista pode ativar seus efeitos neste turno) e, depois, se você Invocou por Invocação-Especial um monstro cujo nome original seja "Mago Negro" ou "Pequena Maga Negra", você pode adicionar 1 Magia/Armadilha que mencione "Mago Negro" do seu Deck à sua mão, exceto "Cortina Mágica Negra". Você só pode ativar 1 "Cortina Mágica Negra" por turno.
  | es_text               = Cada jugador puede Invocar de Modo Especial, desde su mano o Deck, 1 monstruo Lanzador de Conjuros de OSCURIDAD (pero ningún jugador puede activar sus efectos este turno) y después, si Invocaste de Modo Especial un monstruo cuyo nombre original es "Mago Oscuro" o "Chica Maga Oscura", puedes añadir a tu mano 1 Mágica/Trampa en tu Deck que mencione "Mago Oscuro", excepto "Cortina Mágica Oscura". Sólo puedes activar 1 "Cortina Mágica Oscura" por turno.
  | ja_text               = このカード名のカードは１ターンに１枚しか発動できない。①：お互いはそれぞれ自身の手札・デッキから魔法使い族・闇属性モンスター１体を特殊召喚できる。この効果で自分が特殊召喚したモンスターの元々のカード名が「ブラック・マジシャン」か「ブラック・マジシャン・ガール」の場合、さらに自分は「黒魔導のカーテン」を除く、「ブラック・マジシャン」のカード名が記された魔法・罠カード１枚をデッキから手札に加える事ができる。このターン、この効果で特殊召喚したモンスターの効果は発動できない。
  | ko_text               = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 양쪽 플레이어는 각각 자신의 패 / 덱에서 마법사족 / 어둠 속성 몬스터 1장을 특수 소환할 수 있다. 이 효과로 자신이 특수 소환한 몬스터의 원래의 카드명이 "블랙 매지션"이나 "블랙 매지션 걸"일 경우, 추가로 자신은 "흑마도의 커튼"이 아닌, "블랙 매지션"의 카드명이 쓰여진 마법 / 함정 카드 1장을 덱에서 패에 넣을 수 있다. 이 턴에, 이 효과로 특수 소환한 몬스터의 효과는 발동할 수 없다.
  | sc_text               = 此卡名的卡1回合仅可发动1张。①：双方可各自从自身手牌・牌组将1只魔法师族・暗属性怪兽特殊召唤。自己以此效果特殊召唤的怪兽原本卡名为“黑魔导”或“黑魔导女孩”的情况下，自己进而可从牌组将除“黑之魔导的帘布”以外的、1张记载有“黑魔导”卡名的魔法・陷阱卡加入手牌。此回合，以此效果特殊召唤的怪兽的效果不可发动。
