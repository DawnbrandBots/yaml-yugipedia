  | text                 = If this card is [[Special Summon]]ed from the [[Main Deck|Deck]]: You can [[Add a card|add]] 1 [[Level]] 4 or lower [[Rock]] monster from your Deck to your [[hand]], except "Half Slice of Nickeline". If this card is [[sent]] to the [[GY]] as [[Synchro Material]], you can (except during the [[Damage Step]]): Immediately after this effect [[resolve]]s, [[Normal Summon]] 1 Rock monster. You can only use each [[effect]] of "Half Slice of Nickeline" once per turn.
  | fr_text              = Si cette carte est Invoquée Spécialement depuis le Deck : vous pouvez ajouter 1 monstre Rocher de max. Niveau 4 ("Demi-Tranche de Nickéline" exclu) depuis votre Deck à votre main. Si cette carte est envoyée au Cimetière comme Matériel Synchro, vous pouvez (sauf durant la Damage Step) : immédiatement après la résolution de cet effet, Invoquez Normalement 1 monstre Rocher. Vous ne pouvez utiliser chaque effet de "Demi-Tranche de Nickéline" qu'une fois par tour.
  | de_text              = Falls diese Karte als Spezialbeschwörung vom Deck beschworen wird: Du kannst deiner Hand 1 Fels-Monster der Stufe 4 oder niedriger von deinem Deck hinzufügen, außer „Halbe Scheibe Nickelin“. Falls diese Karte als Synchromaterial auf den Friedhof gelegt wird, kannst du (außer während des Damage Steps): Sofort nachdem dieser Effekt aufgelöst wurde, beschwöre 1 Fels-Monster als Normalbeschwörung. Du kannst jeden Effekt von „Halbe Scheibe Nickelin“ nur einmal pro Spielzug verwenden.
  | it_text              = Se questa carta viene Evocata Specialmente dal Deck: puoi aggiungere 1 mostro Roccia di Livello 4 o inferiore dal tuo Deck alla tua mano, eccetto "Mezzo Trancio di Niccolite". Se questa carta viene mandata al Cimitero come Materiale Synchro, puoi (eccetto durante il Damage Step): immediatamente dopo che questo effetto si è risolto, Evoca Normalmente 1 mostro Roccia. Puoi utilizzare ogni effetto di "Mezzo Trancio di Niccolite" una sola volta per turno.
  | pt_text              = Se este card for Invocado por Invocação-Especial do Deck: você pode adicionar 1 monstro Rocha de Nível 4 ou menos do seu Deck à sua mão, exceto "Meia Fatia de Nicolita". Se este card for enviado para o Cemitério como Matéria Sincro, você pode (exceto durante a Etapa de Dano): imediatamente depois que este efeito resolver, Invoque por Invocação-Normal 1 monstro Rocha. Você só pode usar cada efeito de "Meia Fatia de Nicolita" uma vez por turno.
  | es_text              = Si esta carta es Invocada de Modo Especial desde el Deck: puedes añadir a tu mano 1 monstruo Roca de Nivel 4 o menor en tu Deck, excepto "Media Lámina de Niquelina". Si esta carta es mandada al Cementerio como Material de Sincronía, puedes (excepto durante el Damage Step): inmediatamente después de que se resuelva este efecto, Invocar de Modo Normal 1 monstruo Roca. Sólo puedes usar cada efecto de "Media Lámina de Niquelina" una vez por turno.
