  | text            = [[Send]] the top cards of your [[Main Deck|Deck]] to the [[GY]], up to the number of [[Traps]] with different names from each other in the GYs +1 (max. 4), then you can apply 1 of these effects.<br />● [[Special Summon]] 1 [[monster]] from among those cards.<br />● [[Set]] 1 [[Spell]]/[[Trap]] from among those cards, except "Crow, the Carrion Cutpurse". If you Set a Trap or [[Quick-Play Spell]], it can be activated this [[turn]].
  | fr_text         = Envoyez un nombre de cartes du dessus de votre Deck au Cimetière, inférieur ou égal au nombre de Pièges de noms différents les uns des autres dans les Cimetières +1 (max. 4), puis vous pouvez appliquer 1 de ces effets.<br />● Invoquez Spécialement 1 monstre parmi ces cartes.<br />● Posez 1 Magie/Piège parmi ces cartes ("Crow, le Voleur Charognard" exclu). Si vous avez Posé un Piège ou une Magie Jeu-Rapide, il peut être activé ce tour.
  | de_text         = Lege die obersten Karten deines Decks bis zur Anzahl der Fallen mit unterschiedlichen Namen voneinander in den Friedhöfen +1 (max. 4) auf den Friedhof, dann kannst du 1 dieser Effekte ausführen.<br />● Beschwöre 1 Monster von jenen Karten als Spezialbeschwörung.<br />● Setze 1 Zauber/Falle von jenen Karten, außer „Crow, der Leichen-Beutelschneider“. Falls du eine Falle oder einen Schnellzauber setzt, kann sie oder er in diesem Spielzug aktiviert werden.
  | it_text         = Manda carte dalla cima del tuo Deck al Cimitero, fino al numero di Trappole con nomi diversi l'una dall'altra nei Cimiteri +1 (massimo 4), poi puoi applicare 1 di questi effetti.<br />● Evoca Specialmente 1 mostro tra quelle carte.<br />● Posiziona 1 Magia/Trappola tra quelle carte, eccetto "Crow, il Tagliaborse Carcassa". Se Posizioni una Trappola o Magia Rapida, essa può essere attivata in questo turno.
  | pt_text         = Envie cards do topo do seu Deck para o Cemitério, até o número de Armadilhas com nomes diferentes umas das outras nos Cemitérios +1 (máx. 4) e, depois, você pode aplicar 1 desses efeitos.<br />● Invoque por Invocação-Especial 1 monstro dentre esses cards.<br />● Baixe 1 Magia/Armadilha dentre esses cards, exceto "Corvo, o Ladrão de Carcaças". Se você Baixar uma Armadilha ou Magia Rápida, ela pode ser ativada neste turno.
  | es_text         = Manda al Cementerio las cartas de la parte superior de tu Deck, hasta el número de Trampas con nombres diferentes entre sí que haya en los Cementerios +1 (máx. 4), y después puedes aplicar 1 de estos efectos.<br />● Invoca de Modo Especial 1 monstruo de entre esas cartas.<br />● Coloca 1 Mágica/Trampa de entre esas cartas, excepto "Cuervo, el Ladrón de Carroña". Si Colocas una Trampa o una Mágica de Juego Rápido, puede ser activada este turno.
  | ja_text         = ①：お互いの墓地の罠カードの種類の数＋１枚まで自分のデッキの上からカードを墓地へ送る（最大４枚まで）。その後、以下の効果から１つを選んで適用できる。<br />●墓地へ送ったカードの中からモンスター１体を特殊召喚する。<br />●墓地へ送ったカードの中から「躯売りのカラス」以外の魔法・罠カード１枚を自分フィールドにセットする。速攻魔法・罠カードをセットした場合、そのカードはセットしたターンでも発動できる。
