  | text                  = This card's name becomes "[[Umi]]" while on the [[field]]. You can only use each of the following effects of "Warchief of Atlantis" [[once per turn]]. You can [[discard]] this card; [[Add a card|add]] 1 [[Spell]]/[[Trap]] that mentions "[[Atlantis, City of the Sea Dragon]]" from your [[Main Deck|Deck]] to your [[hand]]. If you control "Umi" and this card is in your [[GY]]: You can [[Special Summon]] this card.
  | fr_text               = Le nom de cette carte devient "Umi" tant qu'elle est sur le Terrain. Vous ne pouvez utiliser chacun des effets suivants de "Chef de Guerre d'Atlantis" qu'une fois par tour. Vous pouvez défausser cette carte ; ajoutez 1 Magie/Piège qui mentionne "Atlantis, Cité du Dragon des Mers" depuis votre Deck à votre main. Si vous contrôlez "Umi" et que cette carte est dans votre Cimetière : vous pouvez Invoquer Spécialement cette carte.
  | de_text               = Der Name dieser Karte wird zu „Umi“, solange sie auf dem Spielfeld liegt. Du kannst jeden der folgenden Effekte von „Kriegshäuptling von Atlantis“ nur einmal pro Spielzug verwenden. Du kannst diese Karte abwerfen; füge deiner Hand 1 Zauber/Falle, der oder die „Atlantis, Stadt des Seedrachen“ erwähnt, von deinem Deck hinzu. Falls du „Umi“ kontrollierst und sich diese Karte in deinem Friedhof befindet: Du kannst diese Karte als Spezialbeschwörung beschwören.
  | it_text               = Il nome di questa carta diventa "Umi" mentre è sul Terreno. Puoi utilizzare ognuno dei seguenti effetti di "Capoguerra di Atlantide" una sola volta per turno. Puoi scartare questa carta; aggiungi 1 Magia/Trappola che menziona "Atlantide, Città del Drago del Mare" dal tuo Deck alla tua mano. Se controlli "Umi" e questa carta è nel tuo Cimitero: puoi Evocare Specialmente questa carta.
  | pt_text               = O nome deste card se torna "Umi" enquanto estiver no campo. Você só pode usar cada um dos seguintes efeitos de "Chefe Guerreiro da Atlântida" uma vez por turno. Você pode descartar este card; adicione 1 Magia/Armadilha que mencione "Atlântida, a Cidade do Dragão Marinho" do seu Deck à sua mão. Se você controlar "Umi" e este card estiver no seu Cemitério: você pode Invocar este card por Invocação-Especial.
  | es_text               = El nombre de esta carta se convierte en "Umi" mientras esté en el Campo. Sólo puedes usar cada uno de los siguientes efectos de "Jefe de Guerra de Atlántida" una vez por turno. Puedes descartar esta carta; añade a tu mano 1 Mágica/Trampa en tu Deck que mencione "Atlántida, Ciudad del Dragón Marino". Si controlas "Umi" y esta carta está en tu Cementerio: puedes Invocar esta carta de Modo Especial.
  | ja_text               = このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを手札から捨てて発動できる。デッキから「竜都アトランティス」のカード名が記された魔法・罠カード１枚を手札に加える。②：このカードはモンスターゾーンに存在する限り、カード名を「海」として扱う。③：このカードが墓地に存在し、自分フィールドに「海」が存在する場合に発動できる。このカードを特殊召喚する。
  | ko_text               = 
  | sc_text               = 此卡名的①③效果1回合仅可各使用1次。①：从手牌将此卡舍弃可以发动。从牌组将1张记载有“龙都 亚特兰蒂斯”卡名的魔法・陷阱卡加入手牌。②：此卡只要存在于怪兽区域，卡名视为“海”。③：此卡存在于墓地，且自己场上存在“海”的情况下可以发动。将此卡特殊召唤。
