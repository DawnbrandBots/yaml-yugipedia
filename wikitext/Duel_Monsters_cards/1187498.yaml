  | text                  = If this card [[battle]]s a [[monster]], neither can be [[destroyed by battle|destroyed by that battle]]. You can [[discard]] this card, then [[activate]] 1 of these [[effect]]s (but you can only use each effect of "Dark-Eyes Illusionist Faceless Mage" [[once per turn]]);<br />● Place 1 "[[Mind Scan (card)|Mind Scan]]" from your [[hand]] or [[Main Deck|Deck]], [[face-up]] on your [[field]].<br />● [[Add]] 1 other monster that [[mention]]s "[[Toon World]]" from your [[GY]] to your hand, then you can [[Special Summon]] it, [[ignoring its Summoning conditions]].
  | fr_text               = Si cette carte combat un monstre, aucun de ces 2 monstres ne peut être détruit par ce combat. Vous pouvez défausser cette carte, puis activez 1 de ces effets (mais vous ne pouvez utiliser chaque effet de "Mage Illusionniste Anonyme aux Yeux Noirs" qu'une fois par tour) ;<br />● Placez face recto 1 "Télépathie" depuis votre main ou Deck sur votre Terrain.<br />● Ajoutez 1 autre monstre qui mentionne "Monde des Toons" depuis votre Cimetière à votre main, puis vous pouvez l'Invoquer Spécialement en ignorant ses conditions d'Invocation.
  | de_text               = Falls diese Karte gegen ein Monster kämpft, können beide durch jenen Kampf nicht zerstört werden. Du kannst diese Karte abwerfen und dann 1 dieser Effekte aktivieren (aber du kannst jeden Effekt von „Dunkeläugiger gesichtsloser Illusionist“ nur einmal pro Spielzug verwenden);<br />● Lege 1 „Gedankenlesen“ von deiner Hand oder deinem Deck offen auf deine Spielfeldseite.<br />● Füge deiner Hand 1 anderes Monster, das „Toon-Welt“ erwähnt, von deinem Friedhof hinzu, dann kannst du es als Spezialbeschwörung beschwören, ungeachtet seiner Beschwörungsbedingungen.
  | it_text               = Se questa carta combatte con un mostro, nessuno dei due può essere distrutto in quella battaglia. Puoi scartare questa carta, poi attivare 1 di questi effetti (ma puoi utilizzare ogni effetto di "Mago Senza Volto Illusionista dagli Occhi Oscuri" una sola volta per turno);<br />● Metti 1 "Scansione Mentale" dalla tua mano o Deck, scoperta sul tuo Terreno.<br />● Aggiungi 1 altro mostro che menziona "Mondo Toon" dal tuo Cimitero alla tua mano, poi puoi Evocarlo Specialmente, ignorando le sue condizioni di Evocazione.
  | pt_text               = Se este card batalhar um monstro, nenhum dos dois pode ser destruído nessa batalha. Você pode descartar este card e, depois, ative 1 desses efeitos (mas você só pode usar cada efeito de "Ilusionista de Olhos Negros Sem Rosto" uma vez por turno);<br />● Coloque 1 "Sondagem Mental" da sua mão ou do Deck, com a face para cima no seu campo.<br />● Adicione 1 outro monstro que mencione "Mundo Toon" do seu Cemitério à sua mão e, depois, você pode Invocá-lo por Invocação-Especial, ignorando suas condições de Invocação.
  | es_text               = Si esta carta batalla con un monstruo, ninguno puede ser destruido en esa batalla. Puedes descartar esta carta, y después activa 1 de estos efectos (pero sólo puedes usar cada efecto de "Mago Ilusionista de Ojos Oscuros sin Rostro" una vez por turno);<br />● Pon boca arriba en tu Campo 1 "Escaneo Mental" en tu mano o Deck.<br />● Añade a tu mano otro monstruo que mencione "Mundo Toon" en tu Cementerio, y después puedes Invocarlo de Modo Especial, ignorando sus condiciones de Invocación.
  | ja_text               = ①：このカードを手札から捨て、以下の効果から１つを選択して発動できる（このカード名の以下の効果はそれぞれ１ターンに１度しか選択できない）。●手札・デッキから「心を見通す眼」１枚を自分フィールドに表側表示で置く。●このカードを除く、「トゥーン・ワールド」のカード名が記されたモンスター１体を自分の墓地から手札に加える。その後、そのモンスターを手札から召喚条件を無視して特殊召喚できる。②：このカードがモンスターと戦闘を行う場合、その２体はその戦闘では破壊されない。
  | ko_text               = ①: 이 카드를 패에서 버리고, 이하의 효과에서 1개를 선택하여 발동할 수 있다(이 카드명의 이하의 효과는 각각 1턴에 1번밖에 선택할 수 없다). ●패 / 덱에서 "마인드 스캔" 1장을 자신 필드에 앞면 표시로 놓는다. ●이 카드가 아닌, "툰 월드"의 카드명이 쓰여진 몬스터 1장을 자신 묘지에서 패에 넣는다. 그 후, 그 몬스터를 패에서 소환 조건을 무시하고 특수 소환할 수 있다. ②: 이 카드가 몬스터와 전투를 실행할 경우, 그 2장은 그 전투로는 파괴되지 않는다.
  | sc_text               = ①：从手牌将此卡舍弃，可从以下效果中选择1个发动（此卡名的以下效果1回合仅可各选择1次）。<br />●从手牌・牌组将1张“心灵透视眼”以表侧表示放在自己场上。<br />●从自己墓地将除此卡以外的、1只记载有“卡通世界”卡名的怪兽加入手牌。然后，可从手牌将该怪兽无视召唤条件特殊召唤。<br />②：此卡与怪兽进行战斗的情况下，该2只不会因该战斗被破坏。
