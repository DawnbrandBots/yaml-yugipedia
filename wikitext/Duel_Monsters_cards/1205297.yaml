  | sc_text                  = 此卡名在规则上也视为“狱神”卡。此卡名的①②效果1回合仅可各使用1次。①：场上存在“狱神”卡的情况下可以发动。从手牌将此卡特殊召唤。然后，可从牌组将1张“预幻”魔法・陷阱卡加入手牌。②：有怪兽以表侧被除外的情况下，可从以下效果中选择1个发动。<br />●从牌组将1张“奥艺”卡加入手牌。<br />●将此卡除外，从额外牌组将1只“迪亚克特罗斯”怪兽特殊召唤。
