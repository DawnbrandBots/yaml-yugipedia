  | text                     = (This card is always treated as a "[[Power Patron]]" card.)<br />If a "Power Patron" card is on the [[field]]: You can [[Special Summon]] this card from your [[hand]], then you can [[Add a card|add]] 1 "[[Theorealize (archetype)|Theorealize]]" [[Spell]]/[[Trap]] from your [[Main Deck|Deck]] to your hand. If a [[monster]] is [[banish]]ed [[face-up]] (except during the [[Damage Step]]): You can [[activate]] 1 of these [[effect]]s;<br />● Add 1 "[[Ars Magna]]" card from your Deck to your hand.<br />● Banish this card, and if you do, Special Summon 1 "[[Diactorus]]" monster from your [[Extra Deck]].<br />You can only use each effect of "Theorealized Medius" once per turn.
  | fr_text                  = (Cette carte est toujours traitée comme carte "Mécène du Pouvoir".)<br />Si une carte "Mécène du Pouvoir" est sur le Terrain : vous pouvez Invoquer Spécialement cette carte depuis votre main, puis vous pouvez ajouter 1 Magie/Piège "Théoréalisation" depuis votre Deck à votre main. Si un monstre est banni face recto (sauf durant la Damage Step) : vous pouvez activer 1 de ces effets ;<br />● Ajoutez 1 carte "Ars Magna" depuis votre Deck à votre main.<br />● Bannissez cette carte, et si vous le faites, Invoquez Spécialement 1 monstre "Diactorus" depuis votre Extra Deck.<br />Vous ne pouvez utiliser chaque effet de "Théoréalisation Medius" qu'une fois par tour.
  | de_text                  = (Diese Karte wird immer als „Machtpatron“-Karte behandelt.)<br />Falls sich eine „Machtpatron“-Karte auf dem Spielfeld befindet: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören, dann kannst du deiner Hand 1 „Theorealisier“-Zauber/Falle von deinem Deck hinzufügen. Falls ein Monster offen verbannt wird (außer während des Damage Steps): Du kannst 1 dieser Effekte aktivieren;<br />● Füge deiner Hand 1 „Ars Magna“-Karte von deinem Deck hinzu.<br />● Verbanne diese Karte und falls du dies tust, beschwöre 1 „Diactorus“-Monster als Spezialbeschwörung von deinem Extra Deck.<br />Du kannst jeden Effekt von „Theorealisierter Medius“ nur einmal pro Spielzug verwenden.
  | it_text                  = (Questa carta viene sempre considerata come una carta "Patrono Potente".)<br />Se una carta "Patrono Potente" è sul Terreno: puoi Evocare Specialmente questa carta dalla tua mano, poi puoi aggiungere 1 Magia/Trappola "Teorealizzare" dal tuo Deck alla tua mano. Se un mostro viene bandito scoperto (eccetto durante il Damage Step): puoi attivare 1 di questi effetti;<br />● Aggiungi 1 carta "Ars Magna" dal tuo Deck alla tua mano.<br />● Bandisci questa carta e, se lo fai, Evoca Specialmente 1 mostro "Diactorus" dal tuo Extra Deck.<br />Puoi utilizzare ogni effetto di "Teorealizzare Medius" una sola volta per turno.
  | pt_text                  = (Este card deve ser sempre considerado como um card "Patrono(a) do Poder".)<br />Se um card "Patrono(a) do Poder" estiver no campo: você pode Invocar este card por Invocação-Especial da sua mão e, depois, você pode adicionar 1 Magia/Armadilha "Teorealizar" do seu Deck à sua mão. Se um monstro for banido com a face para cima (exceto durante a Etapa de Dano): você pode ativar 1 desses efeitos;<br />● Adicione 1 card "Ars Magna" do seu Deck à sua mão.<br />● Bana este card e, se isso acontecer, Invoque por Invocação-Especial 1 monstro "Diactorus" do seu Deck Adicional.<br />Você só pode usar cada efeito de "Teorealizar Medius" uma vez por turno.
  | es_text                  = (Esta carta se trata siempre como una carta "Modelo de Poder").<br />Si una carta "Modelo de Poder" está en el Campo: puedes Invocar esta carta de Modo Especial desde tu mano, y después puedes añadir a tu mano 1 Mágica/Trampa "Teoresaber" en tu Deck. Si un monstruo es desterrado boca arriba (excepto durante el Damage Step): puedes activar 1 de estos efectos;<br />● Añade a tu mano 1 carta "Ars Magna" en tu Deck.<br />● Destierra esta carta y, si lo haces, Invoca de Modo Especial 1 monstruo "Diactorus" desde tu Deck Extra.<br />Sólo puedes usar cada efecto de "Teoresaber Anterior Medius" una vez por turno.
  | ja_text                  = このカード名はルール上「獄神」カードとしても扱う。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：フィールドに「獄神」カードが存在する場合に発動できる。このカードを手札から特殊召喚する。その後、デッキから「テオリアライズ」魔法・罠カード１枚を手札に加える事ができる。②：モンスターが表側で除外された場合、以下から１つを選択して発動できる。●デッキから「アルス＝マグナ」カード１枚を手札に加える。●このカードを除外し、ＥＸデッキから「ディアクトロス」モンスター１体を特殊召喚する。
