  | text                  = This card's name becomes "[[Umi]]" while on the [[field]]. You can only use each of the following effects of "Siren Vortex of Atlantis" [[once per turn]]. If this card is [[Normal Summon|Normal]] or [[Special Summon]]ed: You can [[send]] 1 card that mentions "[[Atlantis, City of the Sea Dragon]]" from your [[Main Deck|Deck]] to the [[GY]], except "Siren Vortex of Atlantis". If this card is [[sent]] to the GY and you [[control]] "Umi": You can Special Summon 1 [[WATER]] monster from your [[hand]].
  | fr_text               = Le nom de cette carte devient "Umi" tant qu'elle est sur le Terrain. Vous ne pouvez utiliser chacun des effets suivants de "Vortex Sirène d'Atlantis" qu'une fois par tour. Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez envoyer 1 carte qui mentionne "Atlantis, Cité du Dragon des Mers" ("Vortex Sirène d'Atlantis" exclu) depuis votre Deck au Cimetière. Si cette carte est envoyée au Cimetière et que vous contrôlez "Umi" : vous pouvez Invoquer Spécialement 1 monstre EAU depuis votre main.
  | de_text               = Der Name dieser Karte wird zu „Umi“, solange sie auf dem Spielfeld liegt. Du kannst jeden der folgenden Effekte von „Sirenenstrudel von Atlantis“ nur einmal pro Spielzug verwenden. Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 Karte, die „Atlantis, Stadt des Seedrachen“ erwähnt, von deinem Deck auf den Friedhof legen, außer „Sirenenstrudel von Atlantis“. Falls diese Karte auf den Friedhof gelegt wird und du „Umi“ kontrollierst: Du kannst 1 WASSER Monster als Spezialbeschwörung von deiner Hand beschwören.
  | it_text               = Il nome di questa carta diventa "Umi" mentre è sul Terreno. Puoi utilizzare ognuno dei seguenti effetti di "Vortice Sirena di Atlantide" una sola volta per turno. Se questa carta viene Evocata Normalmente o Specialmente: puoi mandare 1 carta che menziona "Atlantide, Città del Drago del Mare" dal tuo Deck al Cimitero, eccetto "Vortice Sirena di Atlantide". Se questa carta viene mandata al Cimitero e tu controlli "Umi": puoi Evocare Specialmente 1 mostro ACQUA dalla tua mano.
  | pt_text               = O nome deste card se torna "Umi" enquanto estiver no campo. Você só pode usar cada um dos seguintes efeitos de "Sereia Vórtice da Atlântida" uma vez por turno. Se este card for Invocado por Invocação-Normal ou Especial: você pode enviar 1 card que mencione "Atlântida, a Cidade do Dragão Marinho" do seu Deck para o Cemitério, exceto "Sereia Vórtice da Atlântida". Se este card for enviado para o Cemitério e você controlar "Umi": você pode Invocar por Invocação-Especial 1 monstro de ÁGUA da sua mão.
  | es_text               = El nombre de esta carta se convierte en "Umi" mientras esté en el Campo. Sólo puedes usar cada uno de los siguientes efectos de "Vórtice Sirena de Atlántida" una vez por turno. Si esta carta es Invocada de Modo Normal o Especial: puedes mandar al Cementerio 1 carta en tu Deck que mencione "Atlántida, Ciudad del Dragón Marino", excepto "Vórtice Sirena de Atlántida". Si esta carta es mandada al Cementerio y controlas "Umi": puedes Invocar de Modo Especial, desde tu mano, 1 monstruo de AGUA.
  | ja_text               = このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが召喚・特殊召喚した場合に発動できる。「アトランティスの妖渦」を除く、「竜都アトランティス」のカード名が記されたカード１枚をデッキから墓地へ送る。②：このカードはモンスターゾーンに存在する限り、カード名を「海」として扱う。③：このカードが墓地へ送られた場合、自分フィールドに「海」が存在していれば発動できる。手札から水属性モンスター１体を特殊召喚する。
  | ko_text               = 
  | sc_text               = 此卡名的①③效果1回合仅可各使用1次。①：此卡召唤・特殊召唤的情况下可以发动。从牌组将除“亚特兰蒂斯的妖涡”以外的、1张记载有“龙都 亚特兰蒂斯”卡名的卡送至墓地。②：此卡只要存在于怪兽区域，卡名视为“海”。③：此卡被送至墓地的情况下，如果自己场上存在“海”则可以发动。从手牌将1只水属性怪兽特殊召唤。
