  | text                 = This card gains the following [[effect]]s, based on the number of "[[Angelechy]]" [[Monster Card]]s in your [[Spell & Trap Zone]].<br />● 1+: [[Once per turn]], during your opponent's [[Standby Phase]]: You can [[Draw a card|draw]] 1 card.<br />● 2+: When your opponent would [[Special Summon]] a monster(s), you choose the [[zone]](s) to place it.<br />● 3+: Once per turn, you can activate 1 "Angelechy" [[Trap Card]] the [[turn]] it was [[Set]].<br />● 4+: Once per turn, when your opponent Special Summons a monster(s) (except during the [[Damage Step]]): You can [[banish]] that monster(s).<br />● 5: Once per turn: You can Special Summon 1 "Angelechy" monster from your [[Extra Deck]].
  | fr_text              = Cette carte gagne les effets suivants, selon le nombre de Cartes Monstre "Angetélité" dans votre Zone Magie & Piège.<br />● 1+ : Une fois par tour, durant la Standby Phase de votre adversaire : vous pouvez piocher 1 carte.<br />● 2+ : Lorsque votre adversaire va Invoquer Spécialement un ou plusieurs monstres, vous choisissez les zones dans lesquelles les placer.<br />● 3+ : Une fois par tour, vous pouvez activer 1 Carte Piège "Angetélité" le tour où elle a été Posée.<br />● 4+ : Une fois par tour, lorsque votre adversaire Invoque Spécialement un ou plusieurs monstres (sauf durant la Damage Step) : vous pouvez bannir ces monstres.<br />● 5 : Une fois par tour : vous pouvez Invoquer Spécialement 1 monstre "Angetélité" depuis votre Extra Deck.
  | de_text              = Diese Karte erhält die folgenden Effekte, basierend auf der Anzahl der „Engelechy“-Monsterkarten in deiner Zauber- & Fallenzone.<br />● 1+: Einmal pro Spielzug, während der Standby Phase deines Gegners: Du kannst 1 Karte ziehen.<br />● 2+: Wenn dein Gegner ein oder mehr Monster als Spezialbeschwörung beschwören würde, bestimmst du die Zonen, in die sie gelegt werden.<br />● 3+: Einmal pro Spielzug kannst du 1 „Engelechy“-Fallenkarte in dem Spielzug aktivieren, in dem sie gesetzt wurde.<br />● 4+: Einmal pro Spielzug, wenn dein Gegner ein oder mehr Monster als Spezialbeschwörung beschwört (außer während des Damage Steps): Du kannst jene Monster verbannen.<br />● 5: Einmal pro Spielzug: Du kannst 1 „Engelechy“-Monster als Spezialbeschwörung von deinem Extra Deck beschwören.
  | it_text              = Questa carta guadagna i seguenti effetti, a seconda del numero di Carte Mostro "Angelechy" nella tua Zona Magie & Trappole.<br />● 1+: Una volta per turno, durante la Standby Phase del tuo avversario: puoi pescare 1 carta.<br />● 2+: Quando il tuo avversario sta per Evocare Specialmente uno o più mostri, tu selezioni le zone in cui metterli.<br />● 3+: Una volta per turno, puoi attivare 1 Carta Trappola "Angelechy" nel turno in cui è stata Posizionata.<br />● 4+: Una volta per turno, quando il tuo avversario Evoca Specialmente uno o più mostri (eccetto durante il Damage Step): puoi bandire quei mostri.<br />● 5: Una volta per turno: puoi Evocare Specialmente 1 mostro "Angelechy" dal tuo Extra Deck.
  | pt_text              = Este card ganha os seguintes efeitos, de acordo com o número de Cards de Monstro "Anjoléquia" na sua Zona de Magias & Armadilhas.<br />● 1+: Uma vez por turno, durante a Fase de Apoio do seu oponente: você pode comprar 1 card.<br />● 2+: Quando seu oponente Invocaria um ou mais monstros por Invocação-Especial, você seleciona a(s) zona(s) onde colocá-lo(s).<br />● 3+: Uma vez por turno, você pode ativar 1 Card de Armadilha "Anjoléquia" no turno em que ele foi Baixado.<br />● 4+: Uma vez por turno, quando seu oponente Invocar um ou mais monstros por Invocação-Especial (exceto durante a Etapa de Dano): você pode banir esse(s) monstro(s).<br />● 5: Uma vez por turno: você pode Invocar por Invocação-Especial 1 monstro "Anjoléquia" do seu Deck Adicional.
  | es_text              = Esta carta gana los siguientes efectos, basados en el número de Cartas de Monstruo "Angelequia" en tu Zona de Magia y Trampas.<br />● 1+: Una vez por turno, durante la Standby Phase de tu adversario: puedes robar 1 carta.<br />● 2+: Cuando tu adversario fuera a Invocar uno o más monstruos de Modo Especial, tú eliges a la o las zonas donde ponerlos.<br />● 3+: Una vez por turno, puedes activar 1 Carta de Trampa "Angelequia" el turno en el que fue Colocada.<br />● 4+: Una vez por turno, cuando tu adversario Invoca uno o más monstruos de Modo Especial (excepto durante el Damage Step): puedes desterrar ese o esos monstruos.<br />● 5: Una vez por turno: puedes Invocar de Modo Especial 1 monstruo "Angelequia" desde tu Deck Extra.
