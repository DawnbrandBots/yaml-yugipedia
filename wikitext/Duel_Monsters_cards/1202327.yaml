  | text                  = 2 [[Machine]] [[monsters]]<br />If this card is [[Link Summon]]ed: You can [[target]] 1 monster your opponent controls; [[destroy]] that monster, also this card, then you can [[Special Summon]] 1 non-[[WATER]] Machine monster with 1600 or less [[ATK]] from your [[GY]]. If this card is [[banish]]ed: You can [[Add a card|add]] 1 Machine monster whose ATK equals its own [[DEF]] from your [[Main Deck|Deck]] to your hand. You can only use each effect of "Helping Robo for Underwater Combat" [[once per turn]], also you cannot Special Summon the turn you activate either of this card's effects, except Machine monsters.
  | fr_text               = 2 monstres Machine<br />Si cette carte est Invoquée par Lien : vous pouvez cibler 1 monstre contrôlé par votre adversaire ; détruisez le monstre et cette carte aussi, puis vous pouvez Invoquer Spécialement 1 monstre non-EAU Machine avec max. 1600 ATK depuis votre Cimetière. Si cette carte est bannie : vous pouvez ajouter 1 monstre Machine dont l'ATK est égale à sa propre DEF depuis votre Deck à votre main. Vous ne pouvez utiliser chaque effet de "Drone d'Assistance au Combat Sous-Marin" qu'une fois par tour, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres Machine exclus) le tour où vous activez un effet de cette carte.
  | de_text               = 2 Maschine-Monster<br />Falls diese Karte als Linkbeschwörung beschworen wird: Du kannst 1 Monster wählen, das dein Gegner kontrolliert; zerstöre jenes Monster, zusätzlich diese Karte, dann kannst du 1 Nicht-WASSER Maschine-Monster mit 1600 oder weniger ATK als Spezialbeschwörung von deinem Friedhof beschwören. Falls diese Karte verbannt wird: Du kannst deiner Hand 1 Maschine-Monster, dessen ATK seinen eigenen DEF entsprechen, von deinem Deck hinzufügen. Du kannst jeden Effekt von „Unter Wasser kämpfender Hilfsroboter“ nur einmal pro Spielzug verwenden, zusätzlich kannst du in dem Spielzug, in dem du einen der Effekte dieser Karte aktivierst, keine Spezialbeschwörungen durchführen, außer von Maschine-Monstern.
  | it_text               = 2 mostri Macchina<br />Se questa carta viene Evocata Link: puoi scegliere come bersaglio 1 mostro controllato dal tuo avversario; distruggi quel mostro, inoltre questa carta, poi puoi Evocare Specialmente 1 mostro Macchina non-ACQUA con ATK 1600 o inferiore dal tuo Cimitero. Se questa carta viene bandita: puoi aggiungere 1 mostro Macchina con ATK pari al suo stesso DEF dal tuo Deck alla tua mano. Puoi utilizzare ogni effetto di "Robot Soccorritore per il Combattimento Subacqueo" una sola volta per turno, inoltre non puoi Evocare Specialmente nel turno in cui attivi uno dei due effetti di questa carta, eccetto mostri Macchina.
  | pt_text               = 2 monstros Máquina<br />Se este card for Invocado por Invocação-Link: você pode escolher 1 monstro que seu oponente controla; destrua esse monstro e, além disso, este card e, depois, você pode Invocar por Invocação-Especial 1 monstro Máquina que não seja de ÁGUA com 1600 ou menos de ATK do seu Cemitério. Se este card for banido: você pode adicionar 1 monstro Máquina cujo ATK seja igual à sua própria DEF do seu Deck à sua mão. Você só pode usar cada efeito de "Robô Ajudante de Combate Subaquático" uma vez por turno e, além disso, você não pode Invocar por Invocação-Especial no turno em que ativar qualquer um dos efeitos deste card, exceto monstros Máquina.
  | es_text               = 2 Monstruos Máquina<br />Si esta carta es Invocada por Enlace: puedes seleccionar 1 monstruo que controle tu adversario; destruye ese monstruo, y además esta carta, y después puedes Invocar de Modo Especial, desde tu Cementerio, 1 monstruo Máquina que no sea de AGUA con 1600 ATK o menos. Si esta carta es desterrada: puedes añadir a tu mano 1 monstruo Máquina en tu Deck cuyo ATK sea igual a su propia DEF. Sólo puedes usar cada efecto de "Robot de Ayuda para el Combate Subacuático" una vez por turno, y además no puedes Invocar de Modo Especial el turno en el que activas cualquiera de los efectos de esta carta, excepto monstruos Máquina.
  | ja_text               = 機械族モンスター２体<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できず、この効果を発動するターン、自分は機械族モンスターしか特殊召喚できない。①：このカードがＬ召喚した場合、相手フィールドのモンスター１体を対象として発動できる。そのモンスター及びこのカードを破壊する。その後、水属性モンスターを除く、攻撃力１６００以下の機械族モンスター１体を自分の墓地から特殊召喚できる。②：このカードが除外された場合に発動できる。攻撃力と守備力の数値が同じ機械族モンスター１体をデッキから手札に加える。
  | ko_text               = 
  | sc_text               = 机械族怪兽2只<br />此卡名的①②效果1回合仅可各使用1次，发动此效果的回合中，自己仅可特殊召唤机械族怪兽。①：此卡连接召唤的情况下，以对手场上的1只怪兽为对象可以发动。将该怪兽及此卡破坏。然后，可从自己墓地将除水属性怪兽以外的、1只攻击力1600以下的机械族怪兽特殊召唤。②：此卡被除外的情况下可以发动。从牌组将1只攻击力和守备力的数值相同的机械族怪兽加入手牌。
