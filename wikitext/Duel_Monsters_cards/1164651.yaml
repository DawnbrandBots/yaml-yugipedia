  | text                  = 3 [[Machine]] [[monster]]s with 2100 or more [[ATK]]<br />Must be [[Fusion Summon]]ed. If this card is Fusion Summoned using only [[LIGHT]] monsters: You can [[pay]] 4000 [[LP]]; [[add]] 1 "[[Limiter Removal]]" from your [[Deck]] to your [[hand]]. You can only use this [[effect]] of "Cyber End Dragon, the Final Strike Dragon" [[once per turn]]. If this card [[attack]]s a [[Defense Position]] monster, inflict [[piercing]] [[battle damage]] to your opponent. While its ATK is higher than its [[original ATK]], this card can make up to 3 attacks during each [[Battle Phase]].
  | fr_text               = 3 monstres Machine avec min. 2100 ATK<br />Uniquement Invocable par Fusion. Si cette carte est Invoquée par Fusion en utilisant uniquement des monstres LUMIÈRE : vous pouvez payer 4000 LP ; ajoutez 1 "Limiter Removal" depuis votre Deck à votre main. Vous ne pouvez utiliser cet effet de "Dragon Cyber Ultime, le Dragon de l'Assaut Final" qu'une fois par tour. Si cette carte attaque un monstre en Position de Défense, infligez des dommages de combat perçants à votre adversaire. Tant que son ATK est supérieure à son ATK d'origine, cette carte peut faire max. 3 attaques durant chaque Battle Phase.
  | de_text               = 3 Maschine-Monster mit 2100 oder mehr ATK<br />Muss als Fusionsbeschwörung beschworen werden. Falls diese Karte als Fusionsbeschwörung beschworen wird, indem nur LICHT Monster verwendet werden: Du kannst 4000 LP zahlen; füge deiner Hand 1 „Begrenzer-Entferner“ von deinem Deck hinzu. Du kannst diesen Effekt von „Cyber End-Drache, der Drache des letzten Schlags“ nur einmal pro Spielzug verwenden. Falls diese Karte ein Monster in Verteidigungsposition angreift, füge deinem Gegner durchschlagenden Kampfschaden zu. Solange die ATK dieser Karte höher sind als ihre Grund-ATK, kann sie während jeder Battle Phase bis zu 3 Angriffe durchführen.
  | it_text               = 3 mostri Macchina con ATK 2100 o superiore<br />Deve essere Evocato tramite Fusione. Se questa carta viene Evocata tramite Fusione utilizzando solo mostri LUCE: puoi pagare 4000 LP; aggiungi 1 "Rimozione di Limite" dal tuo Deck alla tua mano. Puoi utilizzare questo effetto di "Drago Cyber Finale, il Drago Colpo Finale" una sola volta per turno. Se questa carta attacca un mostro in Posizione di Difesa, infliggi danno da combattimento perforante al tuo avversario. Mentre il suo ATK è superiore al suo ATK originale, questa carta può effettuare fino a 3 attacchi durante ogni Battle Phase.
  | pt_text               = 3 monstros Máquina com 2100 ou mais de ATK<br />Deve ser Invocado por Invocação-Fusão. Se este card for Invocado por Invocação-Fusão usando apenas monstros de LUZ: você pode pagar 4000 PV; adicione 1 "Remover Limites" do seu Deck à sua mão. Você só pode usar este efeito de "Dragão Final Cibernético, o Dragão do Golpe Final" uma vez por turno. Se este card atacar um monstro em Posição de Defesa, cause dano de batalha perfurante ao seu oponente. Enquanto seu ATK for maior que seu ATK original, este card pode realizar até 3 ataques durante cada Fase de Batalha.
  | es_text               = 3 monstruos Máquina con 2100 ATK o más<br />Debe ser Invocado por Fusión. Si esta carta es Invocada por Fusión usando sólo monstruos de LUZ: puedes pagar 4000 LP; añade a tu mano 1 "Quitar el Limitador" en tu Deck. Sólo puedes usar este efecto de "Dragón Ciber Final, el Dragón del Último Golpe" una vez por turno. Si esta carta ataca a un monstruo en Posición de Defensa, inflige daño de batalla de penetración a tu adversario. Mientras su ATK sea mayor que su ATK original, esta carta puede hacer hasta 3 ataques durante cada Battle Phase.
  | ja_text               = 攻撃力２１００以上の機械族モンスター×３<br />このカードは融合召喚でしか特殊召喚できない。このカード名の①の効果は１ターンに１度しか使用できない。①：光属性モンスターのみを素材としてこのカードが融合召喚した場合、４０００ＬＰを払って発動できる。デッキから「リミッター解除」１枚を手札に加える。②：このカードが守備表示モンスターを攻撃した場合、その守備力を攻撃力が超えた分だけ相手に戦闘ダメージを与える。③：元々の攻撃力より高い攻撃力を持つこのカードは１度のバトルフェイズ中に３回攻撃できる。
  | ko_text               = 공격력 2100 이상인 기계족 몬스터 × 3<br />이 카드는 융합 소환으로밖에 특수 소환할 수 없다. 이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 빛 속성 몬스터만을 소재로서 이 카드를 융합 소환했을 경우, 4000 LP를 지불하고 발동할 수 있다. 덱에서 "리미터 해제" 1장을 패에 넣는다. ②: 이 카드가 수비 표시 몬스터를 공격했을 경우, 그 수비력을 공격력이 넘은 만큼만 상대에게 전투 데미지를 준다. ③: 원래 공격력보다 높은 공격력을 가지는 이 카드는 1번의 배틀 페이즈 중에 3회 공격할 수 있다.
  | sc_text               = 攻击力2100以上的机械族怪兽×3<br />此卡仅可以融合召唤方式特殊召唤。此卡名的①效果1回合仅可使用1次。①：仅以光属性怪兽作为素材的此卡融合召唤的情况下，支付4000LP可以发动。从牌组将1张“限制解除”加入手牌。②：此卡攻击守备表示怪兽的情况下，依攻击力超出该怪兽守备力的数值来给予对手战斗伤害。③：攻击力高于原本攻击力的此卡在1次战斗阶段中可攻击3次。
