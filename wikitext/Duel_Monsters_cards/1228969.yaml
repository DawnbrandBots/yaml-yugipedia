  | text                 = [[Return]] 1 "[[Angelechy]]" [[Monster Card]] you [[own]] from your [[Spell & Trap Zone]] to the [[Extra Deck]], then you can [[Special Summon]] it. You can [[banish]] this card from your [[GY]], then [[send]] 1 "Angelechy" card from your [[hand]] or [[face-up]] [[field]] to the GY; Special Summon 1 "Angelechy" monster from your Extra Deck. You can only use each [[effect]] of "Angelechy Brilliant Move" [[once per turn]].
  | fr_text              = Renvoyez 1 Carte Monstre "Angetélité" que vous possédez depuis votre Zone Magie & Piège à l'Extra Deck, puis vous pouvez l'Invoquer Spécialement. Vous pouvez bannir cette carte depuis votre Cimetière, puis envoyez 1 carte "Angetélité" depuis votre main ou Terrain face recto au Cimetière ; Invoquez Spécialement 1 monstre "Angetélité" depuis votre Extra Deck. Vous ne pouvez utiliser chaque effet de "Coup Brillant Angetélité" qu'une fois par tour.
  | de_text              = Lege 1 „Engelechy“-Monsterkarte, die du besitzt, von deiner Zauber- & Fallenzone ins Extra Deck zurück, dann kannst du sie als Spezialbeschwörung beschwören. Du kannst diese Karte von deinem Friedhof verbannen und dann 1 „Engelechy“-Karte von deiner Hand oder offen von deiner Spielfeldseite auf den Friedhof legen; beschwöre 1 „Engelechy“-Monster als Spezialbeschwörung von deinem Extra Deck. Du kannst jeden Effekt von „Brillanter Engelechy-Zug“ nur einmal pro Spielzug verwenden.
  | it_text              = Fai ritornare 1 Carta Mostro "Angelechy" che possiedi dalla tua Zona Magie & Trappole nell'Extra Deck, poi puoi Evocarla Specialmente. Puoi bandire questa carta dal tuo Cimitero, poi mandare 1 carta "Angelechy" dalla tua mano o Terreno scoperto al Cimitero; Evoca Specialmente 1 mostro "Angelechy" dal tuo Extra Deck. Puoi utilizzare ogni effetto di "Mossa Brillante Angelechy" una sola volta per turno.
  | pt_text              = Devolva 1 Card de Monstro "Anjoléquia" do qual você é dono da sua Zona de Magias & Armadilhas para o Deck Adicional e, depois, você pode Invocá-lo por Invocação-Especial. Você pode banir este card do seu Cemitério e, depois, envie 1 card "Anjoléquia" da sua mão ou do campo com a face para cima para o Cemitério; Invoque por Invocação-Especial 1 monstro "Anjoléquia" do seu Deck Adicional. Você só pode usar cada efeito de "Movimento Brilhante de Anjoléquia" uma vez por turno.
  | es_text              = Devuelve al Deck Extra 1 Carta de Monstruo "Angelequia" que poseas en tu Zona de Magia y Trampas, y después puedes Invocarla de Modo Especial. Puedes desterrar esta carta en tu Cementerio, y después manda al Cementerio 1 carta "Angelequia" en tu mano o Campo boca arriba; Invoca de Modo Especial 1 monstruo "Angelequia" desde tu Deck Extra. Sólo puedes usar cada efecto de "Movimiento Brillante Angelequia" una vez por turno.
