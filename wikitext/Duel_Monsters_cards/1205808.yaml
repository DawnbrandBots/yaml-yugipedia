  | text                  = 3 [[Level]] 4 [[monsters]]<br />[[Once per turn]]: You can [[detach]] 1 [[material]] from this card; [[Add a card|add]] 1 "[[Barian's]]" [[Spell]]/[[Trap]] from your [[Main Deck|Deck]] to your [[hand]]. You can only use the following effect of "Number 104: Masquerade V" [[once per turn]]. An [[Xyz Monster]] that was [[Summon]]ed using this card on the [[field]] as [[material]] gains this [[effect]].<br />● If this card is Xyz Summoned: [[Activate]] this effect; your opponent can [[banish]] 4 monsters with different [[Attribute]]s and 1 [[Spell]] from their Deck. If they did not, you banish the top 10 cards of their Deck.
  | fr_text               = 3 monstres de Niveau 4<br />Une fois par tour : vous pouvez détacher 1 Matériel de cette carte ; ajoutez 1 Magie/Piège "de Barian" depuis votre Deck à votre main. Vous ne pouvez utiliser l'effet suivant de "Numéro 104 : Mascarade V" qu'une fois par tour. Un Monstre Xyz qui a été Invoqué en utilisant cette carte sur le Terrain comme Matériel gagne cet effet.<br />● Si cette carte est Invoquée par Xyz : activez cet effet ; votre adversaire peut bannir 4 monstres d'Attributs différents et 1 Magie depuis son Deck. S'il ne l'a pas fait, vous bannissez les 10 cartes du dessus de son Deck.
  | de_text               = 3 Monster der Stufe 4<br />Einmal pro Spielzug: Du kannst 1 Material von dieser Karte abhängen; füge deiner Hand 1 „Barians“-Zauber/Falle von deinem Deck hinzu. Du kannst den folgenden Effekt von „Nummer 104: Maskerade V“ nur einmal pro Spielzug verwenden. Ein Xyz-Monster, das beschworen wurde, indem diese Karte auf dem Spielfeld als Material verwendet wurde, erhält diesen Effekt.<br />● Falls diese Karte als Xyz-Beschwörung beschworen wird: Aktiviere diesen Effekt; dein Gegner kann 4 Monster mit unterschiedlichen Eigenschaften und 1 Zauber von seinem Deck verbannen. Falls er dies nicht tut, verbannst du die obersten 10 Karten von seinem Deck.
  | it_text               = 3 mostri di Livello 4<br />Una volta per turno: puoi staccare 1 materiale da questa carta; aggiungi 1 Magia/Trappola "di Barian" dal tuo Deck alla tua mano. Puoi utilizzare il seguente effetto di "Numero 104: Masquerade V" una sola volta per turno. Un Mostro Xyz che è stato Evocato utilizzando questa carta sul Terreno come materiale guadagna questo effetto.<br />● Se questa carta viene Evocata Xyz: attiva questo effetto; il tuo avversario può bandire 4 mostri con Attributi diversi e 1 Magia dal suo Deck. Se non lo fa, tu bandisci le prime 10 carte del suo Deck.
  | pt_text               = 3 monstros de Nível 4<br />Uma vez por turno: você pode desassociar 1 matéria deste card; adicione 1 Magia/Armadilha "de Barian" do seu Deck à sua mão. Você só pode usar o seguinte efeito de "Número 104: Mascarado V" uma vez por turno. Um Monstro Xyz que foi Invocado usando este card no campo como matéria ganha este efeito.<br />● Se este card for Invocado por Invocação-Xyz: ative este efeito; seu oponente pode banir 4 monstros com Atributos diferentes e 1 Magia do seu Deck. Se ele não o fizer, bana os 10 cards do topo do Deck dele.
  | es_text               = 3 monstruos de Nivel 4<br />Una vez por turno: puedes desacoplar 1 material de esta carta; añade a tu mano 1 Mágica/Trampa "de Barian" en tu Deck. Sólo puedes usar el siguiente efecto de "Número 104: Mascarada V" una vez por turno. Un Monstruo Xyz que fue Invocado usando esta carta en el Campo como material gana este efecto.<br />● Si esta carta es Invocada Xyz: activa este efecto; tu adversario puede desterrar 4 monstruos con Atributos diferentes y 1 Mágica en su Deck. Si no lo hace, tú destierras las 10 cartas de la parte superior de su Deck.
  | ja_text               = レベル４モンスター×３<br />このカード名の②の効果は１ターンに１度しか使用できない。①：１ターンに１度、このカードのＸ素材を１つ取り除いて発動できる。デッキから「バリアンズ」魔法・罠カード１枚を手札に加える。②：フィールドのこのカードを素材としてＸ召喚したモンスターは以下の効果を得る。●このカードがＸ召喚した場合に発動する。相手は自身のデッキからモンスター４体（同じ属性は１体まで）と魔法カード１枚を除外できる。除外しなかった場合、自分は相手のデッキの上からカードを１０枚除外する。
