  | sc_pendulum_effect    = 此卡名的灵摆效果1回合仅可使用1次。①：自己另一方的灵摆区域有卡存在的情况下，可从以下效果中选择1个发动。<br />●将此卡特殊召唤。<br />●将此卡破坏，将自己灵摆区域的1张等级5以下的灵摆怪兽卡特殊召唤。
  | sc_text               = 此卡名的②怪兽效果1回合仅可使用1次。①：只要灵摆召唤的此卡存在于怪兽区域，此卡不会因对手的效果被破坏，对手不可将此卡作为效果的对象。②：在自己・对手回合中，以自己场上的1张灵摆怪兽卡和对手场上的1张卡为对象可以发动。将该卡放回手牌。
