  | fr_text             = Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez révéler 1 monstre Zombie dans votre main, et envoyez 1 monstre Zombie TERRE depuis votre Deck au Cimetière ; envoyez le monstre révélé au Cimetière, et si vous le faites, cette carte gagne 500 ATK jusqu'à la fin de ce tour. Vous ne pouvez utiliser cet effet de "Cheval Noir à Longue Queue" qu'une fois par tour.
  | de_text             = Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 Zombie-Monster in deiner Hand vorzeigen und 1 ERDE Zombie-Monster von deinem Deck auf den Friedhof legen; lege das vorgezeigte Monster auf den Friedhof und falls du dies tust, erhält diese Karte bis zum Ende dieses Spielzugs 500 ATK. Du kannst diesen Effekt von „Langschwänziges schwarzes Pferd“ nur einmal pro Spielzug verwenden.
