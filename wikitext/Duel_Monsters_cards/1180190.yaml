  | es_text             = Si esta carta es Invocada de Modo Normal o Especial: puedes mostrar 1 monstruo Zombi en tu mano y mandar al Cementerio 1 monstruo Zombi de TIERRA en tu Deck; manda al Cementerio el monstruo mostrado y, si lo haces, esta carta gana 500 ATK hasta el final de este turno. Sólo puedes usar este efecto de "Caballo Negro Colilargo" una vez por turno.
