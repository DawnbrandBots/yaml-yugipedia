  | text                  = You can [[banish]] this card from your [[hand]]; [[Special Summon]] 1 non-[[Spellcaster]] "[[Ars Magna]]" [[monster]] from your [[GY]] or [[banish]]ment, also your "[[Power Patron]]" [[Link Monster]]s can make up to 3 [[attack]]s on monsters during each [[Battle Phase]] this [[turn]]. If a [[Synchro Monster|Synchro]] or [[Link Monster]](s) is Special Summoned, while this card is banished (except during the [[Damage Step]]): You can Special Summon this card. You can banish 1 "Ars Magna" card from your GY; [[Draw a card|draw]] 1 card. You can only use each effect of "Ars Magna the Division and the Union" once per turn.
  | fr_text               = Vous pouvez bannir cette carte depuis votre main ; Invoquez Spécialement 1 monstre "Ars Magna" non-Magicien depuis votre Cimetière ou bannissement, et aussi, vos Monstres Lien "Mécène du Pouvoir" peuvent faire max. 3 attaques sur des monstres durant chaque Battle Phase ce tour. Si un ou plusieurs Monstres Synchro ou Lien sont Invoqués Spécialement, tant que cette carte est bannie (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte. Vous pouvez bannir 1 carte "Ars Magna" depuis votre Cimetière ; piochez 1 carte. Vous ne pouvez utiliser chaque effet de "Ars Magna la Division et l'Union" qu'une fois par tour.
  | de_text               = Du kannst diese Karte von deiner Hand verbannen; beschwöre 1 „Ars Magna“-Nichthexer-Monster als Spezialbeschwörung von deinem Friedhof oder deinen verbannten Karten, zusätzlich können deine „Machtpatron“-Linkmonster in diesem Spielzug während jeder Battle Phase bis zu 3 Angriffe auf Monster durchführen. Falls ein oder mehr Synchro- oder Linkmonster als Spezialbeschwörung beschworen werden, solange diese Karte verbannt ist (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung beschwören. Du kannst 1 „Ars Magna“-Karte von deinem Friedhof verbannen; ziehe 1 Karte. Du kannst jeden Effekt von „Ars Magna der Teilung und der Vereinigung“ nur einmal pro Spielzug verwenden.
  | it_text               = Puoi bandire questa carta dalla tua mano; Evoca Specialmente 1 mostro "Ars Magna" non-Incantatore dal tuo Cimitero o carte bandite, inoltre i tuoi Mostri Link "Patrono Potente" possono effettuare fino a 3 attacchi su mostri durante ogni Battle Phase in questo turno. Se uno o più Mostri Synchro o Link vengono Evocati Specialmente, mentre questa carta è bandita (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta. Puoi bandire 1 carta "Ars Magna" dal tuo Cimitero; pesca 1 carta. Puoi utilizzare ogni effetto di "Ars Magna la Divisione e l'Unione" una sola volta per turno.
  | pt_text               = Você pode banir este card da sua mão; Invoque por Invocação-Especial 1 monstro "Ars Magna" não-Mago do seu Cemitério ou banimento e, além disso, seus Monstros Link "Patrono(a) do Poder" podem realizar até 3 ataques contra monstros durante cada Fase de Batalha neste turno. Se um ou mais Monstros Sincro ou Link forem Invocados por Invocação-Especial, enquanto este card estiver banido (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial. Você pode banir 1 card "Ars Magna" do seu Cemitério; compre 1 card. Você só pode usar cada efeito de "Ars Magna, a Divisão e a União" uma vez por turno.
  | es_text               = Puedes desterrar esta carta en tu mano; Invoca de Modo Especial 1 monstruo "Ars Magna" que no sea Lanzador de Conjuros desde tu Cementerio o destierro, y además tus Monstruos de Enlace "Modelo de Poder" pueden hacer hasta 3 ataques a monstruos durante cada Battle Phase este turno. Si uno o más Monstruos de Sincronía o Enlace son Invocados de Modo Especial, mientras esta carta está desterrada (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial. Puedes desterrar 1 carta "Ars Magna" en tu Cementerio; roba 1 carta. Sólo puedes usar cada efecto de "Ars Magna la División y la Unión" una vez por turno.
  | ja_text               = このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを手札から除外して発動できる。自分の墓地・除外状態から魔法使い族以外の「アルス＝マグナ」モンスター１体を特殊召喚する。このターン中、自分の「獄神」Ｌモンスターは１度のバトルフェイズ中に３回までモンスターに攻撃できる。②：このカードが除外状態で、Ｓ・Ｌモンスターが特殊召喚された場合に発動できる。このカードを特殊召喚する。③：自分の墓地から「アルス＝マグナ」カード１枚を除外して発動できる。自分は１枚ドローする。
  | ko_text               = 
  | sc_text               = 此卡名的①②③效果1回合仅可各使用1次。①：从手牌将此卡除外可以发动。从自己墓地・除外状态将1只魔法师族以外的“奥艺”怪兽特殊召唤。此回合中，自己的“狱神”连接怪兽在1次战斗阶段中最多可攻击怪兽3次。②：此卡为除外状态，且同步・连接怪兽被特殊召唤的情况下可以发动。将此卡特殊召唤。③：从自己墓地将1张“奥艺”卡除外可以发动。自己抽1张。
