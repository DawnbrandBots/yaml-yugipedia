  | text                  = 2 [[Level]] 3 [[monsters]]<br />Cannot be used as [[material]] for an [[Xyz Summon]]. [[Once per turn]], you can also Xyz Summon "Crowned Siclavee" by using 1 [[Beast]] [[monster]] you [[control]] with 2000 or less [[ATK]] ([[transfer]] its [[material]]s). If this card [[destroy]]s a monster by battle: Place 1 [[Crown Counter]] on this card, then apply this [[effect]] based on the number of Crown Counters on this card.<br />● 1: It gains 400 [[ATK]]. ● 2: It gains 600 ATK. ● 3: [[Return]] it to the [[Extra Deck]], and if you do, [[Draw a card|draw]] 3 cards.
  | fr_text               = 2 monstres de Niveau 3<br />Non utilisable comme Matériel pour une Invocation Xyz. Une fois par tour, vous pouvez aussi Invoquer par Xyz "Siclavee à Couronne" en utilisant 1 monstre Bête que vous contrôlez avec max. 2000 ATK (transférez ses Matériels). Si cette carte détruit un monstre au combat : placez 1 Compteur Couronne sur cette carte, puis appliquez cet effet selon le nombre de Compteurs Couronne sur cette carte.<br />● 1 : Elle gagne 400 ATK.<br />● 2 : Elle gagne 600 ATK.<br />● 3 : Renvoyez-la à l'Extra Deck, et si vous le faites, piochez 3 cartes.
  | de_text               = 2 Monster der Stufe 3<br />Kann nicht als Material für eine Xyz-Beschwörung verwendet werden. Einmal pro Spielzug kannst du „Gekrönter Siclavee“ auch als Xyz-Beschwörung beschwören, indem du 1 Ungeheuer-Monster mit 2000 oder weniger ATK verwendest, das du kontrollierst (transferiere sein Material). Falls diese Karte ein Monster durch Kampf zerstört: Lege 1 Krone-Zählmarke auf diese Karte, dann führe diesen Effekt aus, basierend auf der Anzahl der Krone-Zählmarken auf dieser Karte.<br />● 1: Sie erhält 400 ATK.<br />● 2: Sie erhält 600 ATK.<br />● 3: Lege sie ins Extra Deck zurück und falls du dies tust, ziehe 3 Karten.
  | it_text               = 2 mostri di Livello 3<br />Non può essere utilizzato come materiale per un'Evocazione Xyz. Una volta per turno, puoi anche Evocare Xyz "Siclavee Incoronato" utilizzando 1 mostro Bestia che controlli con ATK 2000 o inferiore (trasferisci i suoi materiali). Se questa carta distrugge un mostro in battaglia: metti 1 Segnalino Corona su questa carta, poi applica questo effetto a seconda del numero di Segnalini Corona su questa carta.<br />● 1: Essa guadagna 400 ATK.<br />● 2: Essa guadagna 600 ATK.<br />● 3: Falla ritornare nell'Extra Deck e, se lo fai, pesca 3 carte.
  | pt_text               = 2 monstros de Nível 3<br />Não pode ser usado como matéria para uma Invocação-Xyz. Uma vez por turno, você também pode Invocar "Siclavee Coroado" por Invocação-Xyz ao usar 1 monstro Besta que você controla com 2000 ou menos de ATK (transfira as matérias dele). Se este card destruir um monstro em batalha: coloque 1 Marcador de Coroa neste card e, depois, aplique este efeito de acordo com o número de Marcadores de Coroa neste card.<br />● 1: Ele ganha 400 de ATK.<br />● 2: Ele ganha 600 de ATK.<br />● 3: Devolva-o para o Deck Adicional e, se isso acontecer, compre 3 cards.
  | es_text               = 2 monstruos de Nivel 3<br />No puede ser usado como material para una Invocación Xyz. Una vez por turno, puedes también Invocar Xyz "Siclavee Coronado" usando 1 monstruo Bestia que controles con 2000 ATK o menos (transfiere sus materiales). Si esta carta destruye un monstruo en batalla: pon 1 Contador Corona en esta carta, y después aplica este efecto basado en el número de Contadores Corona en esta carta.<br />● 1: Ésta gana 400 ATK.<br />● 2: Ésta gana 600 ATK.<br />● 3: Devuélvela al Deck Extra y, si lo haces, roba 3 cartas.
  | ja_text               = レベル３モンスター×２<br />「燦冠乗騎シックラヴィー」は１ターンに１度、自分フィールドの攻撃力２０００以下の獣族モンスターの上に重ねてＸ召喚する事もできる。このカードはＸ召喚の素材にできない。①：このカードが戦闘でモンスターを破壊した場合に発動する。このカードに冠カウンターを１つ置く。その後、このカードの冠カウンターの数によって以下の効果を適用する。●１つ：このカードの攻撃力は４００アップする。●２つ：このカードの攻撃力は６００アップする。●３つ：このカードをＥＸデッキに戻し、自分は３枚ドローする。
