  | text                  = If this card is [[Normal Summon|Normal]] or [[Special Summon]]ed: You can [[target]] 1 [[monster]] your opponent [[control]]s; [[banish]] it until the next [[Standby Phase]]. You can [[send]] 1 "[[Destiny HERO]]" monster from your [[Main Deck|Deck]] to the [[GY]]; [[Add a card|add]] 1 "[[Clock Tower Prison]]" or "[[Dark City at Midnight]]" from your Deck or GY to your [[hand]], also you cannot Special Summon for the rest of this [[turn]], except [[DARK]] "[[HERO]]" monsters. You can only use each effect of "Destiny HERO - Doom Overlord" [[once per turn]].
  | fr_text               = Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez cibler 1 monstre contrôlé par votre adversaire ; jusqu'à la prochaine Standby Phase, bannissez-le. Vous pouvez envoyer 1 monstre "HÉROS de la Destinée" depuis votre Deck au Cimetière ; ajoutez 1 "Prison de la Tour de l'Horloge" ou "Ville Ténébreuse à Minuit" depuis votre Deck ou Cimetière à votre main, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres "HÉROS" TÉNÈBRES exclus) le reste de ce tour. Vous ne pouvez utiliser chaque effet de "Seigneur Suprême de la Damnation - HÉROS de la Destinée" qu'une fois par tour.
  | de_text               = Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 Monster wählen, das dein Gegner kontrolliert; verbanne es bis zur nächsten Standby Phase. Du kannst 1 „Schicksals-HELD“-Monster von deinem Deck auf den Friedhof legen; füge deiner Hand 1 „Gefängnisuhrturm“ oder „Finstere Stadt um Mitternacht“ von deinem Deck oder Friedhof hinzu, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von FINSTERNIS „HELD“-Monstern. Du kannst jeden Effekt von „Schicksals-HELD - Doom Overlord“ nur einmal pro Spielzug verwenden.
  | it_text               = Se questa carta viene Evocata Normalmente o Specialmente: puoi scegliere come bersaglio 1 mostro controllato dal tuo avversario; bandiscilo fino alla prossima Standby Phase. Puoi mandare 1 mostro "EROE del Destino" dal tuo Deck al Cimitero; aggiungi 1 "Prigione della Torre dell'Orologio" o "Città Oscura a Mezzanotte" dal tuo Deck o Cimitero alla tua mano, inoltre non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri OSCURITÀ "EROE". Puoi utilizzare ogni effetto di "Sovrano del Fato - EROE del Destino" una sola volta per turno.
  | pt_text               = Se este card for Invocado por Invocação-Normal ou Especial: você pode escolher 1 monstro que seu oponente controla; bana-o até a próxima Fase de Apoio. Você pode enviar 1 monstro "HERÓI do Destino" do seu Deck para o Cemitério; adicione 1 "Prisão da Torre do Relógio" ou "Cidade de Trevas à Meia-Noite" do seu Deck ou Cemitério à sua mão e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros "HERÓI" de TREVAS. Você só pode usar cada efeito de "HERÓI do Destino - Suserano da Condenação" uma vez por turno.
  | es_text               = Si esta carta es Invocada de Modo Normal o Especial: puedes seleccionar 1 monstruo que controle tu adversario; destiérralo hasta la próxima Standby Phase. Puedes mandar al Cementerio 1 monstruo "HÉROE del Destino" en tu Deck; añade a tu mano 1 "Prisión de la Torre del Reloj" o "Ciudad Oscura a Medianoche" en tu Deck o Cementerio, y además no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos "HÉROE" de OSCURIDAD. Sólo puedes usar cada efecto de "HÉROE del Destino - Doom Overlord" una vez por turno.
  | ja_text               = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが召喚・特殊召喚した場合、相手フィールドのモンスター１体を対象として発動できる。そのモンスターを次のスタンバイフェイズまで除外する。②：デッキから「Ｄ－ＨＥＲＯ」モンスター１体を墓地へ送って発動できる。自分のデッキ・墓地から「幽獄の時計塔」か「幽獄の時計都市－ダーク・シティ」１枚を手札に加える。この効果の発動後、ターン終了時まで自分は闇属性の「ＨＥＲＯ」モンスターしか特殊召喚できない。
  | ko_text               = 
  | sc_text               = 此卡名的①②效果1回合仅可各使用1次。①：此卡召唤・特殊召唤的情况下，以对手场上的1只怪兽为对象可以发动。将该怪兽直至下个准备阶段为止除外。②：从牌组将1只“命运－英雄”怪兽送至墓地可以发动。从自己牌组・墓地将1张“幽狱时钟塔”或“幽狱时钟都市－黑暗城市”加入手牌。此效果发动后，直至回合结束时为止，自己仅可特殊召唤暗属性的“－英雄”怪兽。
