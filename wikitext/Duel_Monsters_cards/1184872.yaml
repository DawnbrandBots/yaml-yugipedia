  | ja_text               = 「ウィッチクラフトマスター・ヴェール」＋魔法使い族モンスター×２<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが融合召喚した場合に発動できる。手札・デッキからレベル７以下の「ウィッチクラフト」モンスターを３体まで特殊召喚する（同じ属性は１体まで）。このターン、自分は融合モンスターしかＥＸデッキから特殊召喚できない。②：このカードが墓地に存在する場合、自分エンドフェイズに、手札の魔法カード１枚を相手に見せて発動できる。このカードを守備表示で特殊召喚する。
  | ko_text               = "위치크래프트마스터 베르" ＋ 마법사족 몬스터 × 2<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 융합 소환했을 경우에 발동할 수 있다. 패 / 덱에서 레벨 7 이하의 "위치크래프트" 몬스터를 3장까지 특수 소환한다(같은 속성은 1장까지). 이 턴에, 자신은 융합 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다. ②: 이 카드가 묘지에 존재할 경우, 자신 엔드 페이즈에, 패의 마법 카드 1장을 상대에게 보여주고 발동할 수 있다. 이 카드를 수비 표시로 특수 소환한다.
  | sc_text               = “魔女工艺掌门・玻璃匠薇儿”＋魔法师族怪兽×2<br />此卡名的①②效果1回合仅可各使用1次。①：此卡融合召唤的情况下可以发动。从手牌・牌组将最多3只等级7以下的“魔女工艺”怪兽特殊召唤（同属性最多1只）。此回合，自己从额外牌组仅可特殊召唤融合怪兽。②：此卡存在于墓地的情况下，在自己的结束阶段，向对手出示手牌的1张魔法卡可以发动。将此卡以守备表示特殊召唤。
