  | text                 = 1 [[Level]] 8 or higher [[DARK]] [[monster]] + 1 [[Warrior]] monster<br />If this card is [[Fusion Summon]]ed: You can [[equip]] 1 Warrior monster from your [[GY]] or [[banish]]ment, or 1 monster from your opponent's GY or banishment, to this card as an [[Equip Spell]] that gives it 500 [[ATK]]/[[DEF]]. When your opponent [[activate]]s a [[Spell]]/[[Trap Card]] or effect ([[Quick Effect]]): You can [[send]] 1 [[Equip Card]] you [[control]] to the GY; [[negate]] the activation. You can only use each effect of "Skyborne Blue Cularsaw" once per turn.
  | fr_text              = 1 monstre TÉNÈBRES de min. Niveau 8 + 1 monstre Guerrier<br />Si cette carte est Invoquée par Fusion : vous pouvez équiper 1 monstre Guerrier depuis votre Cimetière ou bannissement, ou 1 monstre depuis le Cimetière ou bannissement de votre adversaire, à cette carte comme Magie d'Équipement qui lui donne 500 ATK/DEF. Lorsque votre adversaire active une Carte Magie/Piège ou effet de Magie/Piège (Effet Rapide) : vous pouvez envoyer 1 Carte d'Équipement que vous contrôlez au Cimetière ; annulez l'activation. Vous ne pouvez utiliser chaque effet de "Cularsaw Bleu du Ciel" qu'une fois par tour.
  | de_text              = 1 FINSTERNIS Monster der Stufe 8 oder höher + 1 Krieger-Monster<br />Falls diese Karte als Fusionsbeschwörung beschworen wird: Du kannst diese Karte mit 1 Krieger-Monster von deinem Friedhof oder deinen verbannten Karten oder 1 Monster vom Friedhof oder den verbannten Karten deines Gegners als Ausrüstungszauber ausrüsten, der ihr 500 ATK/DEF gibt. Wenn dein Gegner eine Zauber-/Fallenkarte oder einen Zauber-/Falleneffekt aktiviert (Schnelleffekt): Du kannst 1 Ausrüstungskarte, die du kontrollierst, auf den Friedhof legen; annulliere die Aktivierung. Du kannst jeden Effekt von „Fliegender blauer Cularsaw“ nur einmal pro Spielzug verwenden.
  | it_text              = 1 mostro OSCURITÀ di Livello 8 o superiore + 1 mostro Guerriero<br />Se questa carta viene Evocata tramite Fusione: puoi equipaggiare 1 mostro Guerriero dal tuo Cimitero o carte bandite, o 1 mostro dal Cimitero o carte bandite del tuo avversario, a questa carta come una Magia Equipaggiamento che le dà 500 ATK/DEF. Quando il tuo avversario attiva una Carta Magia/Trappola o un suo effetto (Effetto Rapido): puoi mandare 1 Carta Equipaggiamento che controlli al Cimitero; annulla l'attivazione. Puoi utilizzare ogni effetto di "Cularsaw Blu Aviotrasportato" una sola volta per turno.
  | pt_text              = 1 monstro de TREVAS de Nível 8 ou mais + 1 monstro Guerreiro<br />Se este card for Invocado por Invocação-Fusão: você pode equipar 1 monstro Guerreiro do seu Cemitério ou banimento, ou 1 monstro do Cemitério ou do banimento do seu oponente, a este card como uma Magia de Equipamento que concede a ele 500 de ATK/DEF. Quando seu oponente ativar um Card de Magia/Armadilha ou seus efeitos (Efeito Rápido): você pode enviar 1 Card de Equipamento que você controla para o Cemitério; negue a ativação. Você só pode usar cada efeito de "Cularsaw Azul Cularsaw" uma vez por turno.
  | es_text              = 1 monstruo de OSCURIDAD de Nivel 8 o mayor + 1 monstruo Guerrero<br />Si esta carta es Invocada por Fusión: puedes equipar a esta carta 1 monstruo Guerrero en tu Cementerio o destierro, o 1 monstruo en el Cementerio o destierro de tu adversario, como una Mágica de Equipo que le da 500 ATK/DEF. Cuando tu adversario activa una Carta Mágica/de Trampa o su efecto (Efecto Rápido): puedes mandar al Cementerio 1 Carta de Equipo que controles; niega la activación. Sólo puedes usar cada efecto de "Cularsaw Azul Nacido en el Cielo" una vez por turno.
