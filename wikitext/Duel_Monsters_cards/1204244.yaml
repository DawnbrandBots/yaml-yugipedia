  | text            = [[Target]] 1 [[monster]] you [[control]] and 1 [[face-up]] card your opponent controls; [[destroy]] your monster, and if you do, [[negate]] the [[effect]]s of that opponent's card until the end of this [[turn]]. If this [[Set]] card is [[sent]] to the [[GY]]: You can target 1 face-up card your opponent controls; negate its effects. You can only use each effect of "Revenge of the Paper Dolls" once per turn.
  | fr_text         = Ciblez 1 monstre que vous contrôlez et 1 carte face recto contrôlée par votre adversaire ; détruisez votre monstre, et si vous le faites, annulez les effets de la carte de l'adversaire jusqu'à la fin de ce tour. Si cette carte Posée est envoyée au Cimetière : vous pouvez cibler 1 carte face recto contrôlée par votre adversaire ; annulez ses effets. Vous ne pouvez utiliser chaque effet de "Revanche des Marionnettes en Papier" qu'une fois par tour.
  | de_text         = Wähle 1 Monster, das du kontrollierst, und 1 offene Karte, die dein Gegner kontrolliert; zerstöre dein Monster und falls du dies tust, annulliere bis zum Ende dieses Spielzugs die Effekte jener Karte des Gegners. Falls diese gesetzte Karte auf den Friedhof gelegt wird: Du kannst 1 offene Karte wählen, die dein Gegner kontrolliert; annulliere ihre Effekte. Du kannst jeden Effekt von „Rache der Papierpuppen“ nur einmal pro Spielzug verwenden.
  | it_text         = Scegli come bersaglio 1 mostro che controlli e 1 carta scoperta controllata dal tuo avversario; distruggi il tuo mostro e, se lo fai, annulla gli effetti di quella carta dell'avversario fino alla fine di questo turno. Se questa carta Posizionata viene mandata al Cimitero: puoi scegliere come bersaglio 1 carta scoperta controllata dal tuo avversario; annulla i suoi effetti. Puoi utilizzare ogni effetto di "Vendetta delle Bambole di Carta" una sola volta per turno.
  | pt_text         = Escolha 1 monstro que você controla e 1 card com a face para cima que seu oponente controla; destrua o seu monstro e, se isso acontecer, negue os efeitos desse card do oponente até o final deste turno. Se este card Baixado for enviado para o Cemitério: você pode escolher 1 card com a face para cima que seu oponente controla; negue seus efeitos. Você só pode usar cada efeito de "Vingança das Bonecas de Papel" uma vez por turno.
  | es_text         = Selecciona 1 monstruo que controles y 1 carta boca arriba que controle tu adversario; destruye tu monstruo y, si lo haces, niega los efectos de esa carta del adversario hasta el final de este turno. Si esta carta Colocada es mandada al Cementerio: puedes seleccionar 1 carta boca arriba que controle tu adversario; niega sus efectos. Sólo puedes usar cada efecto de "Venganza de los Muñecos de Papel" una vez por turno.
  | ja_text         = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドのモンスター１体と相手フィールドの表側表示カード１枚を対象として発動できる。その自分のモンスターを破壊し、その相手のカードの効果をターン終了時まで無効にする。②：セットされているこのカードが墓地へ送られた場合、相手フィールドの表側表示カード１枚を対象として発動できる。そのカードの効果を無効にする。
