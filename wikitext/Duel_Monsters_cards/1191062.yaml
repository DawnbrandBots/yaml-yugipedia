  | text                  = [[Activate]] 1 of these [[effect]]s (but you can only use each effect of "Dark Time Wizard" [[once per turn]]);<br />● [[Add a card|Add]] 1 card that mentions "Dark Time Wizard" from your [[Main Deck|Deck]] to your [[hand]], except "Dark Time Wizard", also during the [[End Phase]] of this turn, add 1 "Dark Time Wizard" from your GY to your hand.<br />● Toss a coin and call it. If you call it right, [[destroy]] as many monsters your opponent [[control]]s as possible, and if you do, inflict damage to your opponent equal to half the combined [[original ATK]] of those destroyed monsters. If you call it wrong, destroy all monsters you control.
  | fr_text               = Activez 1 de ces effets (mais vous ne pouvez utiliser chaque effet de "Magicien du Temps des Ténèbres" qu'une fois par tour) ;<br />● Ajoutez 1 carte qui mentionne "Magicien du Temps des Ténèbres" ("Magicien du Temps des Ténèbres" exclu) depuis votre Deck à votre main, et aussi, durant la End Phase de ce tour, ajoutez 1 "Magicien du Temps des Ténèbres" depuis votre Cimetière à votre main.<br />● Jouez à pile ou face. Si vous gagnez, détruisez autant de monstres contrôlés par votre adversaire que possible, et si vous le faites, infligez des dommages à votre adversaire égaux à la moitié de la somme des ATK d'origine de ces monstres détruits. Si vous perdez, détruisez tous les monstres que vous contrôlez.
  | de_text               = Aktiviere 1 dieser Effekte (aber du kannst jeden Effekt von „Dunkler Zeitzauberer“ nur einmal pro Spielzug verwenden);<br />● Füge deiner Hand 1 Karte, die „Dunkler Zeitzauberer“ erwähnt, von deinem Deck hinzu, außer „Dunkler Zeitzauberer“, zusätzlich füge deiner Hand während der End Phase dieses Spielzugs 1 „Dunkler Zeitzauberer“ von deinem Friedhof hinzu.<br />● Wirf eine Münze und sage das Ergebnis voraus. Falls du richtig vorausgesagt hast, zerstöre so viele Monster, die dein Gegner kontrolliert, wie möglich und falls du dies tust, füge deinem Gegner Schaden in Höhe der Hälfte der kombinierten Grund-ATK jener zerstörten Monster zu. Falls du falsch vorausgesagt hast, zerstöre alle Monster, die du kontrollierst.
  | it_text               = Attiva 1 di questi effetti (ma puoi utilizzare ogni effetto di "Stregone del Tempo Oscuro" una sola volta per turno);<br />● Aggiungi 1 carta che menziona "Stregone del Tempo Oscuro" dal tuo Deck alla tua mano, eccetto "Stregone del Tempo Oscuro", inoltre durante la End Phase di questo turno, aggiungi 1 "Stregone del Tempo Oscuro" dal tuo Cimitero alla tua mano.<br />● Lancia una moneta e scegli testa o croce. Se indovini, distruggi tanti mostri controllati dal tuo avversario quanti possibile e, se lo fai, infliggi al tuo avversario danno pari alla metà della somma degli ATK originali di quei mostri distrutti. Se sbagli, distruggi tutti i mostri che controlli.
  | pt_text               = Ative 1 desses efeitos (mas você só pode usar cada efeito de "Mago do Tempo Negro" uma vez por turno);<br />● Adicione 1 card que mencione "Mago do Tempo Negro" do seu Deck à sua mão, exceto "Mago do Tempo Negro" e, além disso, durante a Fase Final deste turno, adicione 1 "Mago do Tempo Negro" do seu Cemitério à sua mão.<br />● Lance uma moeda e escolha cara ou coroa. Se você ganhar, destrua tantos monstros que seu oponente controla quanto possível e, se isso acontecer, cause dano ao seu oponente igual à metade do ATK original combinado desses monstros destruídos. Se você perder, destrua todos os monstros que você controla.
  | es_text               = Activa 1 de estos efectos (pero sólo puedes usar cada efecto de "Mago del Tiempo Oscuro" una vez por turno);<br />● Añade a tu mano 1 carta en tu Deck que mencione "Mago del Tiempo Oscuro", excepto "Mago del Tiempo Oscuro" y además, durante la End Phase de este turno, añade a tu mano 1 "Mago del Tiempo Oscuro" en tu Cementerio.<br />● Lanza una moneda y elige Cara o Cruz. Si aciertas, destruye tantos monstruos que controle tu adversario como sea posible y, si lo haces, inflige daño a tu adversario igual a la mitad del ATK original combinado de esos monstruos destruidos. Si fallas, destruye todos los monstruos que controlas.
  | ja_text               = ①：以下の効果から１つを選択して発動できる（このカード名の以下の効果はそれぞれ１ターンに１度しか選択できない）。●「時の黒魔術師」を除く、「時の黒魔術師」のカード名が記されたカード１枚をデッキから手札に加える。このターンのエンドフェイズに、自分の墓地から「時の黒魔術師」１枚を手札に加える。●コイントスを１回行い、裏表を当てる。当たった場合、相手フィールドのモンスターを全て破壊し、その元々の攻撃力を合計した数値の半分のダメージを相手に与える。ハズレの場合、自分フィールドのモンスターを全て破壊する。
  | ko_text               = 
  | sc_text               = ①：可从以下效果中选择1个发动（此卡名的以下效果1回合仅可各选择1次）。<br />●从牌组将除“时间黑魔术师”以外的、1张记载有“时间黑魔术师”卡名的卡加入手牌。在此回合的结束阶段，从自己墓地将1张“时间黑魔术师”加入手牌。<br />●掷1次硬币，猜正反。猜对的情况下，将对手场上的怪兽全部破坏，给予对手相当于其原本攻击力的合计数值的一半的伤害。猜错的情况下，将自己场上的怪兽全部破坏。
