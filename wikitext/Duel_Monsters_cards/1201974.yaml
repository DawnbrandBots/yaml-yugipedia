  | it_text         = Fai ritornare fino a 2 carte dal Terreno nella mano, poi ogni giocatore mette carte dalla sua mano in fondo al suo Deck, in qualsiasi ordine, pari al numero di carte fatte ritornare nella sua mano. Puoi attivare solo 1 "Ehi, Ritorno Spaziale!" per turno.
  | pt_text         = Devolva até 2 cards do campo para a mão e, depois, cada duelista coloca cards da sua mão no fundo do Deck dele, em qualquer ordem, igual ao número devolvido para a mão dele. Você só pode ativar 1 "Ei, Trunade Espacial!" por turno.
  | es_text         = Devuelve a la mano hasta 2 cartas en el Campo, y después cada jugador pone cartas de su mano en la parte inferior de su Deck, en cualquier orden, iguales al número de devueltas a su mano. Sólo puedes activar 1 "¡Hola, Tornado Espacial!" por turno.
  | ja_text         = このカード名のカードは１ターンに１枚しか発動できない。①：フィールドのカードを２枚まで手札に戻す。その後、お互いはそれぞれ、自身の手札に戻った数だけ自身の手札を選び、好きな順番でデッキの下に戻す。
  | translated_text = Return up to 2 cards from the field to the hand, then each player places cards from their hand on the bottom of the Deck, in any order, equal to the number returned to their hand. You can only activate 1 "Hey, Space Trunade!" per turn.
