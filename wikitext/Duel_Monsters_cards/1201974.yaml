  | fr_text         = Renvoyez max. 2 cartes depuis le Terrain à la main, puis chaque joueur place un nombre de cartes depuis sa main au-dessous de son Deck dans l'ordre de son choix, égal au nombre renvoyé à sa main. Vous ne pouvez activer qu'1 "Hé, Espace Trunade !" par tour.
