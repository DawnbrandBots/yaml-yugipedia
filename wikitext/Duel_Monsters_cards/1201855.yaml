  | fr_text               = 1 Syntoniseur + 1+ non-Syntoniseur<br />Si cette carte est Invoquée par Synchronisation : vous pouvez bannir un nombre de votre choix de Pièges depuis votre Cimetière ; bannissez autant de cartes depuis le Terrain. Durant la End Phase : vous pouvez cibler max. 2 monstres "Ashtra" et/ou Pièges "Ashtra" dans votre Cimetière et/ou bannissement ; ajoutez à votre main ou Posez chaque carte, puis si vous avez ciblé 2 cartes, renvoyez cette carte à l'Extra Deck. Vous ne pouvez utiliser chaque effet de "Susanoo Ashtraja" qu'une fois par tour.
  | de_text               = 1 Empfänger + 1+ Nicht-Empfänger<br />Falls diese Karte als Synchrobeschwörung beschworen wird: Du kannst eine beliebige Anzahl Fallen von deinem Friedhof verbannen; verbanne ebenso viele Karten vom Spielfeld. Während der End Phase: Du kannst bis zu 2 „Ashtra“-Monster und/oder „Ashtra“-Fallen in deinem Friedhof und/oder von deinen verbannten Karten wählen; füge jede Karte deiner Hand hinzu oder setze sie, dann, falls du 2 Karten als Ziel gewählt hast, lege diese Karte ins Extra Deck zurück. Du kannst jeden Effekt von „Ashtraja Susanoo“ nur einmal pro Spielzug verwenden.
  | it_text               = 1 Tuner + 1+ non-Tuner<br />Se questa carta viene Synchro Evocata: puoi bandire un qualsiasi numero di Trappole dal tuo Cimitero; bandisci quel numero di carte dal Terreno. Durante la End Phase: puoi scegliere come bersaglio fino a 2 mostri "Ashtra" e/o Trappole "Ashtra" nel tuo Cimitero e/o carte bandite; aggiungi alla tua mano o Posiziona ogni carta, poi se hai scelto come bersaglio 2 carte, fai ritornare questa carta nell'Extra Deck. Puoi utilizzare ogni effetto di "Ashtraja Susanoo" una sola volta per turno.
  | pt_text               = 1 Regulador + 1+ não-Reguladores<br />Se este card for Invocado por Invocação-Sincro: você pode banir qualquer número de Armadilhas do seu Cemitério; bana esse número de cards do campo. Durante a Fase Final: você pode escolher até 2 monstros "Ashtra" e/ou Armadilhas "Ashtra" no seu Cemitério e/ou banimento; adicione à sua mão ou Baixe cada card e, depois, se você escolheu 2 cards, devolva este card para o Deck Adicional. Você só pode usar cada efeito de "Ashtraja Susanoo" uma vez por turno.
  | es_text               = 1 Cantante + 1+ no Cantantes<br />Si esta carta es Invocada por Sincronía: puedes desterrar cualquier número de Trampas en tu Cementerio; destierra ese número de cartas en el Campo. Durante la End Phase: puedes seleccionar hasta 2 monstruos "Ashtra" y/o Trampas "Ashtra" en tu Cementerio y/o destierro; añade a tu mano o Coloca cada carta y después, si seleccionaste 2 cartas, devuelve esta carta al Deck Extra. Sólo puedes usar cada efecto de "Susanoo Ashtraja" una vez por turno.
  | ja_text               = チューナー＋チューナー以外のモンスター１体以上<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードがＳ召喚した場合、自分の墓地から罠カードを任意の数だけ除外して発動できる。その数だけフィールドのカードを除外する。②：自分・相手のエンドフェイズに、自分の墓地・除外状態の「アシュトラ」モンスター・罠カードを２枚まで対象として発動できる。そのカードをそれぞれ手札に加えるか自分フィールドにセットする。カード２枚を対象として発動した場合、さらにこのカードをＥＸデッキに戻す。
