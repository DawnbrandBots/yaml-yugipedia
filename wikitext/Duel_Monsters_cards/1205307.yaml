  | text                 = (This card is always treated as an "[[Artmage]]", "[[DoomZ]]", and "[[Elfnote]]" card.)<br />While you [[control]] a "[[Power Patron]]" [[Link Monster]], you can [[activate]] the [[effect]]s of [[monsters]] you [[control]] with "[[Ars Magna]]" in their original names, as [[Quick Effect]]s. Once, while this card is [[face-up]] on the [[field]], during your [[Main Phase]]: You can [[Add a card|add]] 1 "[[Medius]]" or "Ars Magna" monster from your [[Main Deck|Deck]] to your [[hand]]. You can only use this effect of "Ars Magna "Citrinitas"" once per turn.
  | fr_text              = (Cette carte est toujours traitée comme carte "Artmage", "DoomZ" et "Notes Elfiques".)<br />Tant que vous contrôlez un Monstre Lien "Mécène du Pouvoir", vous pouvez activer les effets des monstres que vous contrôlez avec "Ars Magna" dans leur nom d'origine, comme Effets Rapides. Une fois, tant que cette carte est face recto sur le Terrain, durant votre Main Phase : vous pouvez ajouter 1 monstre "Medius" ou "Ars Magna" depuis votre Deck à votre main. Vous ne pouvez utiliser cet effet de "Ars Magna "Citrinitas"" qu'une fois par tour.
  | de_text              = (Diese Karte wird immer als „Kunstmagus“-, „UntergangZ“- und „Elfnote“-Karte behandelt.)<br />Solange du ein „Machtpatron“-Linkmonster kontrollierst, kannst du die Effekte von Monstern mit „Ars Magna“ in ihren Grund-Namen, die du kontrollierst, als Schnelleffekte aktivieren. Einmal, solange diese Karte offen auf dem Spielfeld liegt, während deiner Main Phase: Du kannst deiner Hand 1 „Medius“- oder „Ars Magna“-Monster von deinem Deck hinzufügen. Du kannst diesen Effekt von „Ars Magna „Citrinitas““ nur einmal pro Spielzug verwenden.
  | it_text              = (Questa carta viene sempre considerata come una carta "Artmage", "DoomZ" e "Elfnote".)<br />Mentre controlli un Mostro Link "Patrono Potente", puoi attivare gli effetti dei mostri che controlli con "Ars Magna" nei loro nomi originali, come Effetti Rapidi. Una volta, mentre questa carta è scoperta sul Terreno, durante la tua Main Phase: puoi aggiungere 1 mostro "Medius" o "Ars Magna" dal tuo Deck alla tua mano. Puoi utilizzare questo effetto di "Ars Magna "Citrinitas"" una sola volta per turno.
  | pt_text              = (Este card deve ser sempre considerado como um card "Artmage", "DoomZ" e "Elfnota".)<br />Enquanto você controlar um Monstro Link "Patrono(a) do Poder", você pode ativar os efeitos de monstros que você controla com "Ars Magna" em seus nomes originais, como Efeitos Rápidos. Uma vez, enquanto este card estiver com a face para cima no campo, durante sua Fase Principal: você pode adicionar 1 monstro "Medius" ou "Ars Magna" do seu Deck à sua mão. Você só pode usar este efeito de "Ars Magna "Citrinitas"" uma vez por turno.
  | es_text              = (Esta carta se trata siempre como una carta "Artmagia", "DoomZ" y "Elfnota").<br />Mientras controlas un Monstruo de Enlace "Modelo de Poder", puedes activar los efectos de los monstruos que controlas con "Ars Magna" en sus nombres originales, como Efectos Rápidos. Una vez, mientras esta carta está boca arriba en el Campo, durante tu Main Phase: puedes añadir a tu mano 1 monstruo "Medius" o "Ars Magna" en tu Deck. Sólo puedes usar este efecto de "Ars Magna "Citrinitas"" una vez por turno.
  | ja_text              = このカード名はルール上「アルトメギア」、「ドゥームズ」、「エルフェンノーツ」カードとしても扱う。このカード名の②の効果は１ターンに１度しか使用できない。①：自分フィールドに「獄神」Ｌモンスターが存在する限り、元々のカード名に「アルス＝マグナ」を含む、自分フィールドのモンスターが発動する効果は、相手ターンでも発動できる効果になる。②：このカードが表側表示で存在する限り１度だけ、自分メインフェイズに発動できる。デッキから「メディウス」モンスターか「アルス＝マグナ」モンスター１体を手札に加える。
  | ko_text              = 
  | sc_text              = 此卡名在规则上也视为“神艺”、“终刻”、“耀圣”卡。此卡名的②效果1回合仅可使用1次。①：只要自己场上存在“狱神”连接怪兽，原本卡名包含“奥艺”在内的、自己场上的怪兽发动的效果，变为在对手回合也可以发动的效果。②：只要此卡以表侧表示存在，仅限1次，在自己的主要阶段可以发动。从牌组将1只“墨迪乌斯”怪兽或“奥艺”怪兽加入手牌。
