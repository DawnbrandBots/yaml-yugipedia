  | fr_text             = Invoquez Spécialement 1 monstre "Horreur de l'Ombre" ou 1 Monstre Xyz "Mascarade" depuis votre main ou Cimetière, puis vous pouvez faire devenir le Niveau de tous les monstres "Horreur de l'Ombre" que vous contrôlez le même qu'1 monstre "Horreur de l'Ombre" dans votre Terrain ou Cimetière. Vous pouvez bannir cette carte depuis votre Cimetière, puis ciblez 1 Monstre Xyz que vous contrôlez ; attachez-lui 1 Monstre Xyz "Numéro" depuis votre Extra Deck ou Cimetière. Vous ne pouvez utiliser chaque effet de "Espoir de Barian" qu'une fois par tour.
  | de_text             = Beschwöre 1 „Schattenhorror“-Monster oder 1 „Maskerade“-Xyz-Monster als Spezialbeschwörung von deiner Hand oder deinem Friedhof, dann kannst du die Stufen aller „Schattenhorror“-Monster, die du kontrollierst, dieselbe wie die von 1 „Schattenhorror“-Monster auf deiner Spielfeldseite oder in deinem Friedhof werden lassen. Du kannst diese Karte von deinem Friedhof verbannen und dann 1 Xyz-Monster wählen, das du kontrollierst; hänge 1 „Nummer“-Xyz-Monster von deinem Extra Deck oder Friedhof daran an. Du kannst jeden Effekt von „Barians Hoffnung“ nur einmal pro Spielzug verwenden.
  | it_text             = Evoca Specialmente 1 mostro "Orrore Umbral" o 1 Mostro Xyz "Masquerade" dalla tua mano o Cimitero, poi puoi far diventare i Livelli di tutti i mostri "Orrore Umbral" che controlli lo stesso di 1 mostro "Orrore Umbral" nel tuo Terreno o Cimitero. Puoi bandire questa carta dal tuo Cimitero, poi scegliere come bersaglio 1 Mostro Xyz che controlli; attacca 1 Mostro Xyz "Numero" dal tuo Extra Deck o Cimitero a esso. Puoi utilizzare ogni effetto di "Speranza di Barian" una sola volta per turno.
  | pt_text             = Invoque por Invocação-Especial 1 monstro "Terror Umbral" ou 1 Monstro Xyz "Mascarado(a)" da sua mão ou do Cemitério e, depois, você pode tornar os Níveis de todos os monstros "Terror Umbral" que você controla o mesmo que o de 1 monstro "Terror Umbral" no seu campo ou Cemitério. Você pode banir este card do seu Cemitério e, depois, escolha 1 Monstro Xyz que você controla; associe 1 Monstro Xyz "Número" do seu Deck Adicional ou Cemitério a ele. Você só pode usar cada efeito de "Esperança de Barian" uma vez por turno.
  | es_text             = Invoca de Modo Especial 1 monstruo "Horror de las Sombras" o 1 Monstruo Xyz "Mascarada" desde tu mano o Cementerio, y después puedes hacer que los Niveles de todos los monstruos "Horror de las Sombras" que controlas sean el mismo que el de 1 monstruo "Horror de las Sombras" en tu Campo o Cementerio. Puedes desterrar esta carta en tu Cementerio, y después selecciona 1 Monstruo Xyz que controles; acóplale 1 Monstruo Xyz "Número" en tu Deck Extra o Cementerio. Sólo puedes usar cada efecto de "Esperanza de Barian" una vez por turno.
  | ja_text             = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の手札・墓地から「アンブラル」モンスターか「仮面魔踏士」Ｘモンスター１体を特殊召喚する。その後、自分フィールドの全ての「アンブラル」モンスターのレベルを、自分のフィールド・墓地の「アンブラル」モンスター１体のレベルと同じにできる。②：墓地のこのカードを除外し、自分フィールドのＸモンスター１体を対象として発動できる。自分のＥＸデッキ・墓地から「Ｎｏ．」Ｘモンスター１体を対象のモンスターのＸ素材にする。
