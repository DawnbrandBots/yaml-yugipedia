  | text                 = Neither player can [[Special Summon]] from the [[Extra Deck]] more than 2 times per [[turn]], except "[[Number]]" monsters. You can only use each of the following effects of "Barian's Seventh Untopia" [[once per turn]]. During your [[Main Phase]]: You can [[Add a card|add]] 1 "[[Umbral Horror]]" monster from your [[Main Deck|Deck]] to your [[hand]], then [[discard]] 1 card. During the [[End Phase]]: Each player takes [[Effect damage|damage]] equal to the number of [[Xyz Monster]]s on the field x 400.
  | fr_text              = Aucun joueur ne peut Invoquer Spécialement (monstres "Numéro" exclus) depuis l'Extra Deck plus de 2 fois par tour. Vous ne pouvez utiliser chacun des effets suivants de "Septième Antopie de Barian" qu'une fois par tour. Durant votre Main Phase : vous pouvez ajouter 1 monstre "Horreur de l'Ombre" depuis votre Deck à votre main, puis défaussez 1 carte. Durant la End Phase : chaque joueur reçoit des dommages égaux au nombre de Monstres Xyz sur le Terrain x 400.
  | de_text              = Kein Spieler kann mehr als 2 Spezialbeschwörungen vom Extra Deck pro Spielzug durchführen, außer von „Nummer“-Monstern. Du kannst jeden der folgenden Effekte von „Barians siebentes Untopia“ nur einmal pro Spielzug verwenden. Während deiner Main Phase: Du kannst deiner Hand 1 „Schattenhorror“-Monster von deinem Deck hinzufügen, dann wirf 1 Karte ab. Während der End Phase: Jeder Spieler erhält Schaden in Höhe der Anzahl der Xyz-Monster auf dem Spielfeld x 400.
  | it_text              = Nessun giocatore può Evocare Specialmente dall'Extra Deck più di 2 volte per turno, eccetto mostri "Numero". Puoi utilizzare ognuno dei seguenti effetti di "Untopia Settima di Barian" una sola volta per turno. Durante la tua Main Phase: puoi aggiungere 1 mostro "Orrore Umbral" dal tuo Deck alla tua mano, poi scartare 1 carta. Durante la End Phase: ogni giocatore subisce danno pari al numero di Mostri Xyz sul Terreno x 400.
  | pt_text              = Nenhum duelista pode Invocar por Invocação-Especial do Deck Adicional mais de 2 vezes por turno, exceto monstros "Número". Você só pode usar cada um dos seguintes efeitos de "Untopia de Barian do Sétimo" uma vez por turno. Durante sua Fase Principal: você pode adicionar 1 monstro "Terror Umbral" do seu Deck à sua mão e, depois, descarte 1 card. Durante a Fase Final: cada duelista sofre dano igual ao número de Monstros Xyz no campo x 400.
  | es_text              = Ningún jugador puede Invocar de Modo Especial desde el Deck Extra más de 2 veces por turno, excepto monstruos "Número". Sólo puedes usar cada uno de los siguientes efectos de "Intopía Séptima de Barian" una vez por turno. Durante tu Main Phase: puedes añadir a tu mano 1 monstruo "Horror de las Sombras" en tu Deck, y después descarta 1 carta. Durante la End Phase: cada jugador recibe daño igual al número de Monstruos Xyz en el Campo x 400.
  | ja_text              = このカード名の②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードがフィールドゾーンに存在する限り、その間はお互いに１ターンに２回までしか「Ｎｏ．」モンスター以外のモンスターをＥＸデッキから特殊召喚できない。②：自分メインフェイズに発動できる。デッキから「アンブラル」モンスター１体を手札に加える。その後、自分の手札を１枚選んで捨てる。③：自分・相手のエンドフェイズに発動する。お互いにフィールドのＸモンスターの数×４００ダメージを受ける。
  | translated_text      = Neither player can Special Summon from the Extra Deck more than 2 times per turn, except "Number" monsters, <ins>while this card is face-up on the field</ins>. You can only use each of the following effects of "Barian's Seventh Untopia" once per turn. During your Main Phase: You can add 1 "Umbral Horror" monster from your Deck to your hand, then discard 1 card. During the End Phase: Each player takes damage equal to the number of Xyz Monsters on the field x 400.
  | ko_text              = 
  | sc_text              = 此卡名的②③效果1回合仅可各使用1次。①：只要此卡存在于场地区域，在此期间，双方1回合仅可从额外牌组特殊召唤“编号”怪兽以外的怪兽最多2次。②：在自己的主要阶段可以发动。从牌组将1只“黑影”怪兽加入手牌。然后，挑选自己的1张手牌舍弃。③：在自己・对手的结束阶段发动。双方受到场上的超量怪兽的数量×400的伤害。
