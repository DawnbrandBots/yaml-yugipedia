  | ja_text               = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分が戦闘・効果ダメージを受けた場合に発動できる。このカードを手札から特殊召喚し、自分は２０００ＬＰ回復する。その後、以下の効果から１つを選んで適用できる。●自分の手札・デッキ・墓地から「冥府よりの使者」１体を特殊召喚する。●相手フィールドの攻撃表示モンスターを２体まで破壊する。②：このカードが特殊召喚したターンのエンドフェイズに、自分の墓地の罠カード１枚を対象として発動できる。そのカードを自分フィールドにセットする。
  | ko_text               = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신이 전투 / 효과 데미지를 받았을 경우에 발동할 수 있다. 이 카드를 패에서 특수 소환하고, 자신은 2000 LP 회복한다. 그 후, 이하의 효과에서 1개를 골라 적용할 수 있다. ●자신의 패 / 덱 / 묘지에서 "저승에서 온 사자" 1장을 특수 소환한다. ●상대 필드의 공격 표시 몬스터를 2장까지 파괴한다. ②: 이 카드를 특수 소환한 턴의 엔드 페이즈에, 자신 묘지의 함정 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 자신 필드에 세트한다.
  | sc_text               = 此卡名的①②效果1回合仅可各使用1次。①：自己受到战斗・效果伤害的情况下可以发动。从手牌将此卡特殊召唤，自己恢复2000LP。然后，可从以下效果中挑选1个适用。●从自己手牌・牌组・墓地将1只“来自冥府的使者”特殊召唤。●将对手场上最多2只攻击表示的怪兽破坏。②：在此卡特殊召唤的回合的结束阶段，以自己墓地的1张陷阱卡为对象可以发动。将该卡放置在自己场上。
