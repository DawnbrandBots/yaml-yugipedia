  | text               = You can [[Special Summon]] this card (from your [[hand]]) by [[Tributing]] 2 [[Fiend]] and/or [[Fairy]] monsters. Cannot be [[destroyed by battle]]. [[Once per turn]]: You can [[activate]] this [[effect]]; Special Summon as many "[[Lord of Darkness Token]]s" (Fiend/[[DARK]]/[[Level]] 10/[[ATK]] 3000/[[DEF]] 1000) as possible to your [[field]], but they cannot [[attack directly]] or be destroyed by battle, and are [[destroy]]ed when this card is destroyed, also you cannot Special Summon other monsters for the rest of this turn. If a monster is destroyed by battle: Inflict 700 [[effect damage|damage]] to your opponent.
  | fr_text            = Vous pouvez Invoquer Spécialement cette carte (depuis votre main) en Sacrifiant 2 monstres Démon et/ou Elfe. Non destructible au combat. Une fois par tour : vous pouvez activer cet effet ; Invoquez Spécialement autant de "Jeton Dieu des Ténèbres" (Démon/TÉNÈBRES/Niveau 10/ATK 3000/DEF 1000) que possible sur votre Terrain, mais ils ne peuvent ni attaquer directement ni être détruits au combat, et ils sont détruits lorsque cette carte est détruite, et aussi, vous ne pouvez pas Invoquer Spécialement d'autres monstres le reste de ce tour. Si un monstre est détruit au combat : infligez 700 points de dommages à votre adversaire.
  | de_text            = Du kannst diese Karte als Spezialbeschwörung (von deiner Hand) beschwören, indem du 2 Unterweltler- und/oder Fee-Monster als Tribut anbietest. Kann nicht durch Kampf zerstört werden. Einmal pro Spielzug: Du kannst diesen Effekt aktivieren; beschwöre so viele „Dunkler-Schöpfer-Spielmarken“ (Unterweltler/FINSTERNIS/Stufe 10/ATK 3000/DEF 1000) wie möglich als Spezialbeschwörung auf deine Spielfeldseite, aber sie können weder direkt angreifen noch durch Kampf zerstört werden und werden zerstört, wenn diese Karte zerstört wird, zusätzlich kannst du für den Rest dieses Spielzugs keine anderen Monster als Spezialbeschwörung beschwören. Falls ein Monster durch Kampf zerstört wird: Füge deinem Gegner 700 Schaden zu.
  | it_text            = Puoi Evocare Specialmente questa carta (dalla tua mano) offrendo come Tributo 2 mostri Demone e/o Fata. Non può essere distrutto in battaglia. Una volta per turno: puoi attivare questo effetto; Evoca Specialmente tanti "Segna-Creatore Oscuro" (Demone/OSCURITÀ/Livello 10/ATK 3000/DEF 1000) quanti possibile sul tuo Terreno, ma essi non possono attaccare direttamente o essere distrutti in battaglia, e vengono distrutti quando questa carta viene distrutta, inoltre non puoi Evocare Specialmente altri mostri per il resto di questo turno. Se un mostro viene distrutto in battaglia: infliggi 700 danni al tuo avversario.
  | pt_text            = Você pode Invocar este card por Invocação-Especial (da sua mão) ao oferecer como Tributo 2 monstros Demônio e/ou Fada. Não pode ser destruído em batalha. Uma vez por turno: você pode ativar este efeito; Invoque por Invocação-Especial tantas "Ficha de Senhor das Trevas" (Demônio/TREVAS/Nível 10/ATK 3000/DEF 1000) quanto possível no seu campo, mas elas não podem atacar diretamente ou ser destruídas em batalha e são destruídas quando este card for destruído e, além disso, você não pode Invocar outros monstros por Invocação-Especial pelo resto deste turno. Se um monstro for destruído em batalha: cause 700 de dano ao seu oponente.
  | es_text            = Puedes Invocar esta carta de Modo Especial (desde tu mano) Sacrificando 2 monstruos Demonio y/o Hada. No puede ser destruida en batalla. Una vez por turno: puedes activar este efecto; Invoca de Modo Especial tantas "Ficha Señor de la Oscuridad" (Demonio/OSCURIDAD/Nivel 10/ATK 3000/DEF 1000) como sea posible a tu Campo, pero no pueden atacar directamente o ser destruidas en batalla, y son destruidas cuando esta carta es destruida, y además no puedes Invocar otros monstruos de Modo Especial por el resto de este turno. Si un monstruo es destruido en batalla: inflige 700 puntos de daño a tu adversario.
  | ja_text            = ①：このカードは自分フィールドの悪魔族・天使族モンスター２体をリリースして手札から特殊召喚できる。②：このカードは戦闘では破壊されない。③：１ターンに１度、発動できる。自分フィールドに「ダークゴッド・トークン」（悪魔族・闇・星１０・攻３０００／守１０００）を可能な限り特殊召喚する。このトークンは、直接攻撃できず、戦闘では破壊されず、このカードが破壊される時に破壊される。このターン、自分はモンスターを特殊召喚できない。④：モンスターが戦闘で破壊された場合に発動する。相手に７００ダメージを与える。
  | ko_text            = ①: 이 카드는 자신 필드의 악마족 / 천사족 몬스터 2장을 릴리스하고 패에서 특수 소환할 수 있다. ②: 이 카드는 전투로는 파괴되지 않는다. ③: 1턴에 1번, 발동할 수 있다. 자신 필드에 "다크갓 토큰"(악마족 / 어둠 / 레벨 10 / 공 3000 / 수 1000)을 가능한 한 특수 소환한다. 이 토큰은, 직접 공격할 수 없으며, 전투로는 파괴되지 않고, 이 카드가 파괴될 때에 파괴된다. 이 턴에, 자신은 몬스터를 특수 소환할 수 없다. ④: 몬스터가 전투로 파괴되었을 경우에 발동한다. 상대에게 700 데미지를 준다.
  | sc_text            = ①：此卡可解放自己场上的2只恶魔族・天使族怪兽来从手牌特殊召唤。②：此卡不会因战斗被破坏。③：1回合1次，可以发动。将“暗之神衍生物”（恶魔族・暗・星10・攻3000/守1000）尽可能地特殊召唤至自己场上。此衍生物不可直接攻击，不会因战斗被破坏，在此卡被破坏时将被破坏。此回合，自己不可特殊召唤怪兽。
  ④：有怪兽因战斗被破坏的情况下发动。给予对手700伤害。
