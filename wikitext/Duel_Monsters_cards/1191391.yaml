  | text                  = Each time you [[Special Summon]] a [[Level]] 8 or higher "[[Destiny HERO]]" [[monster]](s): [[Warrior]] monsters you [[control]] gain 300 [[ATK]]. You can only use each of the following effects of "Dark City at Midnight" once per turn. During your [[Main Phase]], if this card was [[activate]]d this turn: You can [[Add a card|add]] 1 "Destiny HERO" monster or 1 card that mentions a "Destiny HERO" monster by name from your [[Main Deck|Deck]] to your [[hand]]. If this card is [[destroy]]ed: You can Special Summon 1 "Destiny HERO" monster from your Deck (this is treated as a Special Summon with "[[Clock Tower Prison]]").
  | fr_text               = Chaque fois que vous Invoquez Spécialement un ou plusieurs monstres "HÉROS de la Destinée" de min. Niveau 8 : les monstres Guerrier que vous contrôlez gagnent 300 ATK. Vous ne pouvez utiliser chacun des effets suivants de "Ville Ténébreuse à Minuit" qu'une fois par tour. Durant votre Main Phase, si cette carte a été activée ce tour : vous pouvez ajouter 1 monstre "HÉROS de la Destinée" ou 1 carte qui mentionne nommément un monstre "HÉROS de la Destinée" depuis votre Deck à votre main. Si cette carte est détruite : vous pouvez Invoquer Spécialement 1 monstre "HÉROS de la Destinée" depuis votre Deck (ceci est traité comme Invocation Spéciale avec "Prison de la Tour de l'Horloge").
  | de_text               = Jedes Mal, wenn du ein oder mehr „Schicksals-HELD“-Monster der Stufe 8 oder höher als Spezialbeschwörung beschwörst: Krieger-Monster, die du kontrollierst, erhalten 300 ATK. Du kannst jeden der folgenden Effekte von „Finstere Stadt um Mitternacht“ nur einmal pro Spielzug verwenden. Während deiner Main Phase, falls diese Karte in diesem Spielzug aktiviert wurde: Du kannst deiner Hand 1 „Schicksals-HELD“-Monster oder 1 Karte, die den Namen eines „Schicksals-HELD“-Monsters erwähnt, von deinem Deck hinzufügen. Falls diese Karte zerstört wird: Du kannst 1 „Schicksals-HELD“-Monster als Spezialbeschwörung von deinem Deck beschwören (dies wird als Spezialbeschwörung durch „Gefängnisuhrturm“ behandelt).
  | it_text               = Ogni volta che Evochi Specialmente uno o più mostri "EROE del Destino" di Livello 8 o superiore: i mostri Guerriero che controlli guadagnano 300 ATK. Puoi utilizzare ognuno dei seguenti effetti di "Città Oscura a Mezzanotte" una sola volta per turno. Durante la tua Main Phase, se questa carta è stata attivata in questo turno: puoi aggiungere 1 mostro "EROE del Destino" o 1 carta che menziona un mostro "EROE del Destino" per nome dal tuo Deck alla tua mano. Se questa carta viene distrutta: puoi Evocare Specialmente 1 mostro "EROE del Destino" dal tuo Deck (questa viene considerata come un'Evocazione Speciale con "Prigione della Torre dell'Orologio").
  | pt_text               = Sempre que você Invocar por Invocação-Especial um ou mais monstros "HERÓI do Destino" de Nível 8 ou mais: monstros Guerreiro que você controla ganham 300 de ATK. Você só pode usar cada um dos seguintes efeitos de "Cidade de Trevas à Meia-Noite" uma vez por turno. Durante sua Fase Principal, se este card foi ativado neste turno: você pode adicionar 1 monstro "HERÓI do Destino" ou 1 card que mencione um monstro "HERÓI do Destino" pelo nome do seu Deck à sua mão. Se este card for destruído: você pode Invocar por Invocação-Especial 1 monstro "HERÓI do Destino" do seu Deck (isso é considerado uma Invocação-Especial com "Prisão da Torre do Relógio").
  | es_text               = Cada vez que Invocas de Modo Especial uno o más monstruos "HÉROE del Destino" de Nivel 8 o mayor: los monstruos Guerrero que controlas ganan 300 ATK. Sólo puedes usar cada uno de los siguientes efectos de "Ciudad Oscura a Medianoche" una vez por turno. Durante tu Main Phase, si esta carta fue activada este turno: puedes añadir a tu mano, de tu Deck, 1 monstruo "HÉROE del Destino" o 1 carta que mencione un monstruo "HÉROE del Destino" por nombre. Si esta carta es destruida: puedes Invocar de Modo Especial 1 monstruo "HÉROE del Destino" desde tu Deck (esto se trata como una Invocación Especial con "Prisión de la Torre del Reloj").
  | ja_text               = このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを発動したターンの自分メインフェイズに発動できる。「Ｄ－ＨＥＲＯ」モンスター１体またはそのカード名が記されたカード１枚をデッキから手札に加える。②：自分がレベル８以上の「Ｄ－ＨＥＲＯ」モンスターを特殊召喚する度に発動する。自分フィールドの全ての戦士族モンスターの攻撃力は３００アップする。③：このカードが破壊された場合に発動できる。デッキから「Ｄ－ＨＥＲＯ」モンスター１体を「幽獄の時計塔」の効果扱いで特殊召喚する。
  | ko_text               = 
  | sc_text               = 此卡名的①③效果1回合仅可各使用1次。①：在发动了此卡的回合的自己的主要阶段可以发动。从牌组将1只“命运－英雄”怪兽或1张记载有该卡名的卡加入手牌。②：每当自己特殊召唤等级8以上的“命运－英雄”怪兽则发动。自己场上所有战士族怪兽的攻击力上升300。③：此卡被破坏的情况下可以发动。从牌组将1只“命运－英雄”怪兽视为以“幽狱时钟塔”的效果特殊召唤。
