  | pendulum_effect       = During your [[Main Phase]]: You can [[return]] this card to the [[Extra Deck]], then you can [[add]] 1 [[Level]] 7 [[Pendulum Monster]] from your [[Deck]] or [[face-up]] Extra Deck to your [[hand]]. You can only use this [[effect]] of "Master Spirit Tech Force - Pendulum Ruler" [[once per turn]].
  | text                  = 1 [[Level]] 7 or higher [[Pendulum Monster]] + 1 Pendulum Monster<br />Cannot be [[destroy]]ed by [[card effect]]s. Your opponent's monsters cannot [[attack]], except Pendulum Monsters without a Level. You can [[Tribute]] 1 [[monster]], then [[target]] 1 card your opponent [[control]]s; [[destroy]] it, and if you do, inflict 1600 [[effect damage|damage]] to your opponent. You can use this effect of "Master Spirit Tech Force - Pendulum Ruler" twice per [[turn]]. [[Once per turn]]: You can place this card in your [[Pendulum Zone]].
  | fr_pendulum_effect    = Durant votre Main Phase : vous pouvez renvoyer cette carte à l'Extra Deck, puis vous pouvez ajouter 1 Monstre Pendule de Niveau 7 depuis votre Deck ou Extra Deck face recto à votre main. Vous ne pouvez utiliser cet effet de "Force Tech Spirit Maîtresse - Souverain Pendule" qu'une fois par tour.
  | fr_text               = 1 Monstre Pendule de min. Niveau 7 + 1 Monstre Pendule<br />Non destructible par des effets de carte. Les monstres de votre adversaire (Monstres Pendule sans Niveau exclus) ne peuvent pas attaquer. Vous pouvez Sacrifier 1 monstre, puis ciblez 1 carte contrôlée par votre adversaire ; détruisez-la, et si vous le faites, infligez 1600 points de dommages à votre adversaire. Vous pouvez utiliser cet effet de "Force Tech Spirit Maîtresse - Souverain Pendule" deux fois par tour. Une fois par tour : vous pouvez placer cette carte dans votre Zone Pendule.
  | de_pendulum_effect    = Während deiner Main Phase: Du kannst diese Karte ins Extra Deck zurücklegen, dann kannst du deiner Hand 1 Pendelmonster der Stufe 7 von deinem Deck oder offen von deinem Extra Deck hinzufügen. Du kannst diesen Effekt von „Meistergeist-Technikkraft - Pendelherrscher“ nur einmal pro Spielzug verwenden.
  | de_text               = 1 Pendelmonster der Stufe 7 oder höher + 1 Pendelmonster<br />Kann nicht durch Karteneffekte zerstört werden. Monster deines Gegners können nicht angreifen, außer Pendelmonster ohne Stufe. Du kannst 1 Monster als Tribut anbieten und dann 1 Karte wählen, die dein Gegner kontrolliert; zerstöre sie und falls du dies tust, füge deinem Gegner 1600 Schaden zu. Du kannst diesen Effekt von „Meistergeist-Technikkraft - Pendelherrscher“ zweimal pro Spielzug verwenden. Einmal pro Spielzug: Du kannst diese Karte in deine Pendelzone legen.
  | it_pendulum_effect    = Durante la tua Main Phase: puoi far ritornare questa carta nell'Extra Deck, poi puoi aggiungere 1 Mostro Pendulum di Livello 7 dal tuo Deck o Extra Deck scoperto alla tua mano. Puoi utilizzare questo effetto di "Maestro Forza Tech Spirito - Sovrano Pendulum" una sola volta per turno.
  | it_text               = 1 Mostro Pendulum di Livello 7 o superiore + 1 Mostro Pendulum<br />Non può essere distrutto dagli effetti delle carte. I mostri del tuo avversario non possono attaccare, eccetto i Mostri Pendulum senza un Livello. Puoi offrire come Tributo 1 mostro, poi scegliere come bersaglio 1 carta controllata dal tuo avversario; distruggila e, se lo fai, infliggi 1600 danni al tuo avversario. Puoi utilizzare questo effetto di "Maestro Forza Tech Spirito - Sovrano Pendulum" due volte per turno. Una volta per turno: puoi mettere questa carta nella tua Zona Pendulum.
  | pt_pendulum_effect    = Durante sua Fase Principal: você pode devolver este card para o Deck Adicional e, depois, você pode adicionar 1 Monstro Pêndulo de Nível 7 do seu Deck ou Deck Adicional com a face para cima à sua mão. Você só pode usar este efeito de "Força Tech Espiritual Mestre - Governante Pêndulo" uma vez por turno.
  | pt_text               = 1 Monstro Pêndulo de Nível 7 ou mais + 1 Monstro Pêndulo<br />Não pode ser destruído por efeitos de card. Os monstros do seu oponente não podem atacar, exceto Monstros Pêndulo sem um Nível. Você pode oferecer 1 monstro como Tributo e, depois, escolha 1 card que seu oponente controla; destrua-o e, se isso acontecer, cause 1600 de dano ao seu oponente. Você pode usar este efeito de "Força Tech Espiritual Mestre - Governante Pêndulo" duas vezes por turno. Uma vez por turno: você pode colocar este card na sua Zona de Pêndulo.
  | es_pendulum_effect    = Durante tu Main Phase: puedes devolver esta carta al Deck Extra, y después puedes añadir a tu mano 1 Monstruo de Péndulo de Nivel 7 en tu Deck o Deck Extra boca arriba. Sólo puedes usar este efecto de "Fuerza Tecno Espiritual Maestra - Señor del Péndulo" una vez por turno.
  | es_text               = 1 Monstruo de Péndulo de Nivel 7 o mayor + 1 Monstruo de Péndulo<br />No puede ser destruido por efectos de cartas. Los monstruos de tu adversario no pueden atacar, excepto Monstruos de Péndulo sin un Nivel. Puedes Sacrificar 1 monstruo, y después selecciona 1 carta que controle tu adversario; destrúyela y, si lo haces, inflige 1600 puntos de daño a tu adversario. Puedes usar este efecto de "Fuerza Tecno Espiritual Maestra - Señor del Péndulo" dos veces por turno. Una vez por turno: puedes poner esta carta en tu Zona de Péndulo.
  | ja_pendulum_effect    = このカード名のＰ効果は１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。このカードをＥＸデッキに戻す。その後、自分のデッキ・ＥＸデッキ（表側）からレベル７のＰモンスター１体を手札に加える事ができる。
  | ja_text               = レベル７以上のＰモンスター＋Ｐモンスター<br />このカード名の③のモンスター効果は１ターンに２度まで使用できる。①：フィールドのこのカードは効果では破壊されない。②：このカードがモンスターゾーンに存在する限り、レベルを持たないＰモンスターを除き、相手モンスターは攻撃できない。③：自分フィールドのモンスター１体をリリースし、相手フィールドのカード１枚を対象として発動できる。そのカードを破壊し、相手に１６００ダメージを与える。④：１ターンに１度、自分メインフェイズに発動できる。このカードを自分のＰゾーンに置く。
  | ko_pendulum_effect    = 이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신 메인 페이즈에 발동할 수 있다. 이 카드를 엑스트라 덱으로 되돌린다. 그 후, 자신의 덱 / 엑스트라 덱(앞면)에서 레벨 7 의 펜듈럼 몬스터 1장을 패에 넣을 수 있다.
  | ko_text               = 레벨 7 이상의 펜듈럼 몬스터 ＋ 펜듈럼 몬스터<br />이 카드명의 ③의 몬스터 효과는 1턴에 2번까지 사용할 수 있다. ①: 필드의 이 카드는 효과로는 파괴되지 않는다. ②: 이 카드가 몬스터 존에 존재하는 한, 레벨을 가지지 않는 펜듈럼 몬스터가 아닌, 상대 몬스터는 공격할 수 없다. ③: 자신 필드의 몬스터 1장을 릴리스하고, 상대 필드의 카드 1장을 대상으로 하여 발동할 수 있다. 그 카드를 파괴하고, 상대에게 1600 데미지를 준다. ④: 1턴에 1번, 자신 메인 페이즈에 발동할 수 있다. 이 카드를 자신의 펜듈럼 존에 놓는다.
  | sc_pendulum_effect    = 此卡名的灵摆效果1回合仅可使用1次。①：在自己的主要阶段可以发动。将此卡放回额外牌组。然后，可从自己牌组・额外牌组（表侧）将1只等级7的灵摆怪兽加入手牌。
  | sc_text               = 等级7以上的灵摆怪兽＋灵摆怪兽<br />此卡名的③怪兽效果1回合最多可使用2次。①：场上的此卡不会因效果被破坏。②：只要此卡存在于怪兽区域，除了不拥有等级的灵摆怪兽以外，对手怪兽不可攻击。③：解放自己场上的1只怪兽，以对手场上的1张卡为对象可以发动。将该卡破坏，给予对手1600伤害。④：1回合1次，在自己的主要阶段可以发动。将此卡放在自己的灵摆区域。
