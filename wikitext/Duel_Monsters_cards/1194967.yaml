  | ja_text             = このカード名のカードは１ターンに１枚しか発動できない。①：このカードの発動時の効果処理として、デッキから「破械転生」以外の「破械」魔法カードか「雙王の械」１枚を手札に加える事ができる。②：１ターンに１度、「破械転生」以外の自分の墓地の「破械」カードを３枚まで対象として発動できる。そのカードをデッキに戻す。その後、戻した数まで自分フィールドの他のカードを破壊できる。
  | ko_text             = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 이 카드의 발동시의 효과 처리로서, 덱에서 "언체인드 전생" 이외의 "언체인드" 마법 카드나 "쌍왕의 계" 1장을 패에 넣을 수 있다. ②: 1턴에 1번, "언체인드 전생" 이외의 자신 묘지의 "언체인드" 카드를 3장까지 대상으로 하고 발동할 수 있다. 그 카드를 덱으로 되돌린다. 그 후, 되돌린 수까지 자신 필드의 다른 카드를 파괴할 수 있다.
  | sc_text             = 此卡名的卡1回合仅可发动1张。①：作为此卡发动时的效果处理，可从牌组将“破械转生”以外的、1张“破械”魔法卡或“双王之械”加入手牌。②：1回合1次，以“破械转生”以外的、自己墓地的最多3张“破械”卡为对象可以发动。将该卡放回牌组。然后，依所放回的数量为上限，可将自己场上的其他卡破坏。
