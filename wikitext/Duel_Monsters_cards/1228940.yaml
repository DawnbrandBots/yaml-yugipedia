  | fr_text              = Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez cibler 1 Magie/Piège contrôlé par votre adversaire ; détruisez la carte lorsque cette carte quitte le Terrain. Si cette carte est envoyée depuis la main ou Terrain au Cimetière : vous pouvez envoyer 1 Magie/Piège que vous contrôlez au Cimetière ; Invoquez Spécialement cette carte, mais bannissez-la lorsqu'elle quitte le Terrain. Vous ne pouvez utiliser chaque effet de "Tigresse au Repos Silencieux" qu'une fois par tour.
  | de_text              = Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 Zauber/Falle wählen, den oder die dein Gegner kontrolliert; zerstöre jene Karte, wenn diese Karte das Spielfeld verlässt. Falls diese Karte von der Hand oder dem Spielfeld auf den Friedhof gelegt wird: Du kannst 1 Zauber/Falle, den oder die du kontrollierst, auf den Friedhof legen; beschwöre diese Karte als Spezialbeschwörung, aber verbanne sie, wenn sie das Spielfeld verlässt. Du kannst jeden Effekt von „Tigerin in lautlosem Schlaf“ nur einmal pro Spielzug verwenden.
  | it_text              = Se questa carta viene Evocata Normalmente o Specialmente: puoi scegliere come bersaglio 1 Magia/Trappola controllata dal tuo avversario; distruggi quella carta quando questa carta lascia il Terreno. Se questa carta viene mandata dalla mano o Terreno al Cimitero: puoi mandare 1 Magia/Trappola che controlli al Cimitero; Evoca Specialmente questa carta, ma bandiscila quando lascia il Terreno. Puoi utilizzare ogni effetto di "Tigressa in Riposo Silenzioso" una sola volta per turno.
  | pt_text              = Se este card for Invocado por Invocação-Normal ou Especial: você pode escolher 1 Magia/Armadilha que seu oponente controla; destrua esse card quando este card deixar o campo. Se este card for enviado da mão ou do campo para o Cemitério: você pode enviar 1 Magia/Armadilha que você controla para o Cemitério; Invoque este card por Invocação-Especial, mas bana-o quando ele deixar o campo. Você só pode usar cada efeito de "Tigresa em Repouso Silencioso" uma vez por turno.
  | es_text              = Si esta carta es Invocada de Modo Normal o Especial: puedes seleccionar 1 Mágica/Trampa que controle tu adversario; destruye esa carta cuando esta carta deje el Campo. Si esta carta es mandada de la mano o Campo al Cementerio: puedes mandar al Cementerio 1 Mágica/Trampa que controles; Invoca esta carta de Modo Especial, pero destiérrala cuando deje el Campo. Sólo puedes usar cada efecto de "Tigresa en Reposo Silencioso" una vez por turno.
