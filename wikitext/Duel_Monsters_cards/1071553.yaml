  | text                  = 1 [[Tuner]] + 1+ non-Tuners<br />If this card is [[Special Summon]]ed: You can Special Summon 1 [[face-up]] [[Pendulum Monster]] from your [[Extra Deck]], but you cannot Special Summon, except Pendulum Monsters, while you [[control]] that face-up monster. If this card is in your [[GY]]: You can [[banish]] 2 other monsters ([[Fusion Monster|Fusion]]/[[Synchro Monster|Synchro]]/[[Xyz Monster|Xyz]]/Pendulum) from your GY; Special Summon this card. You can only use 1 "Odd-Eyes Solblaze Dragon" effect per turn, and only once that turn.
  | fr_text               = 1 Syntoniseur + 1+ non-Syntoniseur<br />Si cette carte est Invoquée Spécialement : vous pouvez Invoquer Spécialement 1 Monstre Pendule face recto depuis votre Extra Deck, mais vous ne pouvez pas Invoquer Spécialement (Monstres Pendule exclus) tant que vous contrôlez le monstre face recto. Si cette carte est dans votre Cimetière : vous pouvez bannir 2 autres monstres (Fusion/Synchro/Xyz/Pendule) depuis votre Cimetière ; Invoquez Spécialement cette carte. Vous ne pouvez utiliser qu'1 effet de "Dragon Embrasolaire aux Yeux Impairs" par tour, et uniquement une fois le tour.
  | de_text               = 1 Empfänger + 1+ Nicht-Empfänger<br />Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst 1 offenes Pendelmonster als Spezialbeschwörung von deinem Extra Deck beschwören, aber du kannst keine Spezialbeschwörungen durchführen, außer von Pendelmonstern, solange du jenes offene Monster kontrollierst. Falls sich diese Karte in deinem Friedhof befindet: Du kannst 2 andere Monster (Fusion/Synchro/Xyz/Pendel) von deinem Friedhof verbannen; beschwöre diese Karte als Spezialbeschwörung. Du kannst nur 1 Effekt von „Buntäugiger Sonnenfeuer-Drache“ pro Spielzug verwenden und in jenem Spielzug nur einmal.
  | it_text               = 1 Tuner + 1+ non-Tuner<br />Se questa carta viene Evocata Specialmente: puoi Evocare Specialmente 1 Mostro Pendulum scoperto dal tuo Extra Deck, ma non puoi Evocare Specialmente, eccetto Mostri Pendulum, mentre controlli quel mostro scoperto. Se questa carta è nel tuo Cimitero: puoi bandire 2 altri mostri (Fusione/Synchro/Xyz/Pendulum) dal tuo Cimitero; Evoca Specialmente questa carta. Puoi utilizzare solo 1 effetto di "Drago Solfiammata Occhi Diversi" per turno, e solo una volta in quel turno.
  | pt_text               = 1 Regulador + 1+ não-Reguladores<br />Se este card for Invocado por Invocação-Especial: você pode Invocar por Invocação-Especial 1 Monstro Pêndulo com a face para cima do seu Deck Adicional, mas você não pode Invocar por Invocação-Especial, exceto Monstros Pêndulo, enquanto você controlar esse monstro com a face para cima. Se este card estiver no seu Cemitério: você pode banir 2 outros monstros (Fusão/Sincro/Xyz/Pêndulo) do seu Cemitério; Invoque este card por Invocação-Especial. Você só pode usar 1 efeito de "Dragão Chama Solar de Olhos Anômalos" por turno e apenas uma vez por turno.
  | es_text               = 1 Cantante + 1+ no Cantantes<br />Si esta carta es Invocada de Modo Especial: puedes Invocar de Modo Especial 1 Monstruo de Péndulo boca arriba desde tu Deck Extra, pero no puedes Invocar de Modo Especial mientras controlas ese monstruo boca arriba, excepto Monstruos de Péndulo. Si esta carta está en tu Cementerio: puedes desterrar otros 2 monstruos (Fusión/Sincronía/Xyz/Péndulo) en tu Cementerio; Invoca esta carta de Modo Especial. Sólo puedes usar 1 efecto de "Dragón Estallidosolar de Ojos Anómalos" por turno, y sólo una vez ese turno.
  | ja_text               = チューナー＋チューナー以外のモンスター１体以上<br />このカード名の①②の効果は１ターンに１度、いずれか１つしか使用できない。①：このカードが特殊召喚した場合に発動できる。自分のＥＸデッキ（表側）からＰモンスター１体を特殊召喚する。この効果で特殊召喚したモンスターが自分フィールドに表側表示で存在する限り、自分はＰモンスターしか特殊召喚できない。②：このカードが墓地に存在する場合、自分の墓地から他の融合・Ｓ・Ｘ・Ｐモンスター２体を除外して発動できる。このカードを特殊召喚する。
  | ko_text               = 튜너 ＋ 튜너 이외의 몬스터 1장 이상<br />이 카드명의 ①②의 효과는 1턴에 1번, 어느 쪽이든 1개밖에 사용할 수 없다. ①: 이 카드를 특수 소환했을 경우에 발동할 수 있다. 자신의 엑스트라 덱(앞면)에서 펜듈럼 몬스터 1장을 특수 소환한다. 이 효과로 특수 소환한 몬스터가 자신 필드에 앞면 표시로 존재하는 한, 자신은 펜듈럼 몬스터밖에 특수 소환할 수 없다. ②: 이 카드가 묘지에 존재할 경우, 자신 묘지에서 다른 융합 / 싱크로 / 엑시즈 / 펜듈럼 몬스터 2장을 제외하고 발동할 수 있다. 이 카드를 특수 소환한다.
  | sc_text               = 协调＋协调以外的怪兽1只以上<br />此卡名的①②效果1回合1次，仅可使用其中1个。①：此卡特殊召唤的情况下可以发动。从自己额外牌组（表侧）将1只灵摆怪兽特殊召唤。只要以此效果特殊召唤的怪兽以表侧表示存在于自己场上，自己仅可特殊召唤灵摆怪兽。②：此卡存在于墓地的情况下，从自己墓地将2只其他的融合・同步・超量・灵摆怪兽除外可以发动。将此卡特殊召唤。
