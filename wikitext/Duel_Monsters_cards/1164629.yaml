  | text                  = 2 [[Level]] 4 [[monster]]s<br />Cannot be [[destroy]]ed by [[battle]], except with a "[[Number]]" monster. ([[Quick Effect]]): You can [[detach]] 1 [[Xyz Material|material]] from this card, then [[target]] 1 monster you [[control]]; the first time it would be destroyed by battle or [[card effect]] this [[turn]], it is not destroyed. When the second [[attack]] of each turn is [[declare]]d: You can make this card gain 2500 [[ATK]], and if you do, it gains this effect.<br />● When this card destroys a monster by battle and [[send]]s it to the [[GY]]: You can [[Special Summon]] it to your [[field]].
  | fr_text               = 2 monstres de Niveau 4<br />Non destructible au combat, sauf avec un monstre "Numéro". (Effet Rapide) : vous pouvez détacher 1 Matériel de cette carte, puis ciblez 1 monstre que vous contrôlez ; la première fois qu'il va être détruit au combat ou par un effet de carte ce tour, il n'est pas détruit. Lorsque la seconde attaque de chaque tour est déclarée : vous pouvez faire gagner 2500 ATK à cette carte, et si vous le faites, elle gagne cet effet.<br />● Lorsque cette carte détruit un monstre au combat et l'envoie au Cimetière : vous pouvez l'Invoquer Spécialement sur votre Terrain.
  | de_text               = 2 Monster der Stufe 4<br />Kann nicht durch Kampf zerstört werden, außer mit einem „Nummer“-Monster. (Schnelleffekt): Du kannst 1 Material von dieser Karte abhängen und dann 1 Monster wählen, das du kontrollierst; das erste Mal, dass es in diesem Spielzug durch Kampf oder einen Karteneffekt zerstört würde, wird es nicht zerstört. Wenn der zweite Angriff jedes Spielzugs deklariert wird: Du kannst diese Karte 2500 ATK erhalten lassen und falls du dies tust, erhält sie diesen Effekt.<br />● Wenn diese Karte ein Monster durch Kampf zerstört und auf den Friedhof legt: Du kannst es als Spezialbeschwörung auf deine Spielfeldseite beschwören.
  | it_text               = 2 mostri di Livello 4<br />Non può essere distrutto in battaglia, eccetto con un mostro "Numero". (Effetto Rapido): puoi staccare 1 materiale da questa carta, poi scegliere come bersaglio 1 mostro che controlli; la prima volta che esso sta per essere distrutto in battaglia o dall'effetto di una carta in questo turno, non viene distrutto. Quando viene dichiarato il secondo attacco di ogni turno: puoi far guadagnare a questa carta 2500 ATK e, se lo fai, essa guadagna questo effetto.<br />● Quando questa carta distrugge un mostro in battaglia e lo manda al Cimitero: puoi Evocarlo Specialmente sul tuo Terreno.
  | pt_text               = 2 monstros de Nível 4<br />Não pode ser destruído em batalha, exceto com um monstro "Número". (Efeito Rápido): você pode desassociar 1 matéria deste card e, depois, escolha 1 monstro que você controla; na primeira vez que ele seria destruído em batalha ou por um efeito de card neste turno, ele não é destruído. Quando o segundo ataque de cada turno for declarado: você pode fazer com que este card ganhe 2500 de ATK e, se isso acontecer, ele ganha este efeito.<br />● Quando este card destruir um monstro em batalha e enviá-lo para o Cemitério: você pode Invocá-lo por Invocação-Especial no seu campo.
  | es_text               = 2 monstruos de Nivel 4<br />No puede ser destruido en batalla, excepto por un monstruo "Número". (Efecto Rápido): puedes desacoplar 1 material de esta carta, y después seleccionar 1 monstruo que controles; la primera vez que fuera a ser destruido en batalla o por el efecto de una carta en este turno, no es destruido. Cuando el segundo ataque de cada turno es declarado: puedes hacer que esta carta gane 2500 ATK y, si lo haces, gana este efecto.<br />● Cuando esta carta destruye un monstruo en batalla y lo manda al Cementerio: puedes Invocarlo de Modo Especial a tu Campo.
  | ja_text               = レベル４モンスター×２<br />①：このカードは「Ｎｏ．」モンスター以外のモンスターとの戦闘では破壊されない。②：自分・相手ターンに、このカードのＸ素材を１つ取り除き、自分フィールドのモンスター１体を対象として発動できる。そのモンスターはこのターンに１度だけ戦闘・効果では破壊されない。③：このターンの２回目の攻撃宣言時に発動できる。このカードは攻撃力が２５００アップし、以下の効果を得る。●このカードが戦闘でモンスターを破壊し墓地へ送った時に発動できる。そのモンスターを自分フィールドに特殊召喚する。
  | ko_text               = 레벨 4 몬스터 × 2<br />①: 이 카드는 "No." 몬스터 이외의 몬스터와의 전투로는 파괴되지 않는다. ②: 자신 / 상대 턴에, 이 카드의 엑시즈 소재를 1개 제거하고, 자신 필드의 몬스터 1장을 대상으로 하여 발동할 수 있다. 그 몬스터는 이 턴에 1번만 전투 / 효과로는 파괴되지 않는다. ③: 이 턴의 2회째의 공격 선언시에 발동할 수 있다. 이 카드는 공격력을 2500 올리고, 이하의 효과를 얻는다. ●이 카드가 전투로 몬스터를 파괴하고 묘지로 보냈을 때에 발동할 수 있다. 그 몬스터를 자신 필드에 특수 소환한다.
  | sc_text               = 等级4怪兽×2<br />①：此卡不会因与“编号”怪兽以外的怪兽的战斗被破坏。②：在自己・对手回合中，去除此卡的1个超量素材，以自己场上的1只怪兽为对象可以发动。该怪兽在此回合仅1次，不会因战斗・效果被破坏。③：此回合的第2次攻击宣言时可以发动。此卡的攻击力上升2500，获得以下效果。●此卡战斗破坏怪兽并将其送至墓地时可以发动。将该怪兽特殊召唤至自己场上。
