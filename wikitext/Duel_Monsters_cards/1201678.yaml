  | text                  = 4 [[monsters]]<br />This card's name becomes "[[Umi]]" while on the [[field]]. If this card is [[Link Summon]]ed: You can [[Special Summon]] up to 3 monsters that mention "[[Atlantis, City of the Sea Dragon]]" from your [[GY]] to your [[zone]] this card [[points to]], also you cannot Special Summon for the rest of this [[turn]]. [[Once per turn]] ([[Quick Effect]]): You can [[send]] 1 face-up "Umi" you [[control]] to the [[GY]]; send all cards on the [[field]] to the GY, except "Umi".
  | fr_text               = 4 monstres<br />Le nom de cette carte devient "Umi" tant qu'elle est sur le Terrain. Si cette carte est Invoquée par Lien : vous pouvez Invoquer Spécialement max. 3 monstres qui mentionnent "Atlantis, Cité du Dragon des Mers" depuis votre Cimetière dans votre zone pointée par cette carte, et aussi, vous ne pouvez pas Invoquer Spécialement le reste de ce tour. Une fois par tour (Effet Rapide) : vous pouvez envoyer 1 "Umi" face recto que vous contrôlez au Cimetière ; envoyez toutes les cartes ("Umi" exclu) sur le Terrain au Cimetière.
  | de_text               = 4 Monster<br />Der Name dieser Karte wird zu „Umi“, solange sie auf dem Spielfeld liegt. Falls diese Karte als Linkbeschwörung beschworen wird: Du kannst bis zu 3 Monster, die „Atlantis, Stadt des Seedrachen“ erwähnen, als Spezialbeschwörung von deinem Friedhof in deine Zone beschwören, auf die diese Karte zeigt, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen. Einmal pro Spielzug (Schnelleffekt): Du kannst 1 offenes „Umi“, das du kontrollierst, auf den Friedhof legen; lege alle Karten vom Spielfeld auf den Friedhof, außer „Umi“.
  | it_text               = 4 mostri<br />Il nome di questa carta diventa "Umi" mentre è sul Terreno. Se questa carta viene Evocata Link: puoi Evocare Specialmente fino a 3 mostri che menzionano "Atlantide, Città del Drago del Mare" dal tuo Cimitero in una tua zona puntata da questa carta, inoltre non puoi Evocare Specialmente per il resto di questo turno. Una volta per turno (Effetto Rapido): puoi mandare 1 "Umi" scoperto che controlli al Cimitero; manda al Cimitero tutte le carte sul Terreno, eccetto "Umi".
  | pt_text               = 4 monstros<br />O nome deste card se torna "Umi" enquanto estiver no campo. Se este card for Invocado por Invocação-Link: você pode Invocar por Invocação-Especial até 3 monstros que mencionem "Atlântida, a Cidade do Dragão Marinho" do seu Cemitério em uma zona sua para a qual este card apontar e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno. Uma vez por turno (Efeito Rápido): você pode enviar 1 "Umi" com a face para cima que você controla para o Cemitério; envie todos os cards no campo para o Cemitério, exceto "Umi".
  | es_text               = 4 monstruos<br />El nombre de esta carta se convierte en "Umi" mientras esté en el Campo. Si esta carta es Invocada por Enlace: puedes Invocar de Modo Especial hasta 3 monstruos que mencionen "Atlántida, Ciudad del Dragón Marino" desde tu Cementerio a tu zona a la que apunte esta carta, y además no puedes Invocar de Modo Especial por el resto de este turno. Una vez por turno (Efecto Rápido): puedes mandar al Cementerio 1 "Umi" boca arriba que controles; manda al Cementerio todas las cartas en el Campo, excepto "Umi".
  | ja_text               = モンスター４体<br />①：このカードがＬ召喚した場合に発動できる。自分の墓地から「竜都アトランティス」のカード名が記されたモンスターを３体まで、このカードのリンク先となる自分フィールドに特殊召喚する。この効果の発動後、ターン終了時まで自分はモンスターを特殊召喚できない。②：このカードはモンスターゾーンに存在する限り、カード名を「海」として扱う。③：自分・相手ターンに１度、自分フィールドの表側表示の「海」１枚を墓地へ送って発動できる。「海」を除く、フィールドのカードを全て墓地へ送る。
  | ko_text               = 
  | sc_text               = 怪兽4只<br />①：此卡连接召唤的情况下可以发动。从自己墓地将最多3只记载有“龙都 亚特兰蒂斯”卡名的怪兽特殊召唤至此卡连接端的自己场上。此效果发动后，直至回合结束时为止自己不可特殊召唤怪兽。②：此卡只要存在于怪兽区域，卡名视为“海”。③：在每个自己・对手回合中1次，将自己场上的1张表侧表示的“海”送至墓地可以发动。将除“海”以外的、场上的卡全部送至墓地。
