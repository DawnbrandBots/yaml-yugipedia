  | fr_text             = 1 Syntoniseur + 1+ non-Syntoniseur<br />Durant votre Main Phase : vous pouvez bannir autant de monstres "Chaîne de Fer" que possible depuis votre Cimetière, et si vous le faites, cette carte gagne 200 ATK pour chaque monstre banni, jusqu'à la fin de ce tour. Si cette carte inflige des dommages de combat à votre adversaire : envoyez les 3 cartes du dessus du Deck de votre adversaire au Cimetière.
  | de_text             = 1 Empfänger + 1+ Nicht-Empfänger<br />Während deiner Main Phase: Du kannst so viele „Eisenketten“-Monster von deinem Friedhof verbannen wie möglich und falls du dies tust, erhält diese Karte bis zum Ende dieses Spielzugs für jedes verbannte Monster 200 ATK. Falls diese Karte deinem Gegner Kampfschaden zufügt: Lege die obersten 3 Karten des Decks deines Gegners auf den Friedhof.
  | it_text             = 1 Tuner + 1+ non-Tuner<br />Durante la tua Main Phase: puoi bandire tanti mostri "Catena di Ferro" quanti possibile dal tuo Cimitero e, se lo fai, questa carta guadagna 200 ATK per ogni mostro bandito, fino alla fine di questo turno. Se questa carta infligge danno da combattimento al tuo avversario: manda le prime 3 carte del Deck del tuo avversario al Cimitero.
  | pt_text             = 1 Regulador + 1+ não-Reguladores<br />Durante sua Fase Principal: você pode banir tantos monstros "Corrente de Ferro" quanto possível do seu Cemitério e, se isso acontecer, até o final deste turno, este card ganha 200 de ATK para cada monstro banido. Se este card causar dano de batalha ao seu oponente: envie os 3 cards do topo do Deck do seu oponente para o Cemitério.
  | es_text             = 1 Cantante + 1+ no Cantantes<br />Durante tu Main Phase: puedes desterrar de tu Cementerio tantos monstruos "Cadena de Hierro" como sea posible y, si lo haces, esta carta gana 200 ATK por cada monstruo desterrado, hasta el final de este turno. Si esta carta inflige daño de batalla a tu adversario: manda al Cementerio las 3 cartas de la parte superior del Deck de tu adversario.
  | ja_text             = チューナー＋チューナー以外のモンスター１体以上<br />自分のメインフェイズ時に発動できる。自分の墓地の「Ｃ」と名のついたモンスターを全てゲームから除外する。このカードの攻撃力はエンドフェイズ時まで、この効果で除外したモンスターの数×２００ポイントアップする。また、このカードが相手ライフに戦闘ダメージを与えた時、相手のデッキの上からカードを３枚墓地へ送る。
  | ko_text             = 튜너＋튜너 이외의 몬스터 1장 이상<br />자신의 묘지에 존재하는 "C(체인)"이라는 이름이 붙은 몬스터를 전부 게임에서 제외할 수 있다. 이 효과로 제외한 몬스터 1장당, 이 카드의 공격력은 이 턴의 엔드 페이즈시까지 200포인트 올린다. 이 카드가 상대 라이프에 전투 데미지를 줄 때마다, 상대의 덱 위에서 카드를 3장 묘지로 보낸다.
