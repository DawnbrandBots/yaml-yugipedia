  | text                  = If this card is in your [[hand]]: You can place 1 other "[[Adamancipator]]" card from your [[hand]] on top of the [[Main Deck|Deck]]; [[Special Summon]] this card. During your [[Main Phase]]: You can excavate the top 5 cards of your Deck, and if you do, you can [[Special Summon]] 1 excavated [[Level]] 4 or lower [[Rock]] monster, also place the rest on the bottom of your Deck in any order. You can only use each effect of "Adamancipator Conductor" [[once per turn]].
  | fr_text               = Si cette carte est dans votre main : vous pouvez placer 1 autre carte "Inflexcipateur" depuis votre main au-dessus du Deck ; Invoquez Spécialement cette carte. Durant votre Main Phase : vous pouvez dévoiler les 5 cartes du dessus de votre Deck, et si vous le faites, vous pouvez Invoquer Spécialement 1 monstre Rocher de max. Niveau 4 dévoilé, et aussi, placez les cartes restantes au-dessous de votre Deck dans l'ordre de votre choix. Vous ne pouvez utiliser chaque effet de "Conductrice Inflexcipateur" qu'une fois par tour.
  | de_text               = Falls sich diese Karte in deiner Hand befindet: Du kannst 1 andere „Steinbefreier“-Karte von deiner Hand aufs Deck legen; beschwöre diese Karte als Spezialbeschwörung. Während deiner Main Phase: Du kannst die obersten 5 Karten deines Decks ausgraben und falls du dies tust, kannst du 1 ausgegrabenes Fels-Monster der Stufe 4 oder niedriger als Spezialbeschwörung beschwören, zusätzlich lege die restlichen Karten in beliebiger Reihenfolge unter dein Deck. Du kannst jeden Effekt von „Steinbefreierin Leiterin“ nur einmal pro Spielzug verwenden.
  | it_text               = Se questa carta è nella tua mano: puoi mettere 1 altra carta "Irremovibilatore" dalla tua mano in cima al Deck; Evoca Specialmente questa carta. Durante la tua Main Phase: puoi dissotterrare le prime 5 carte del tuo Deck e, se lo fai, puoi Evocare Specialmente 1 mostro Roccia di Livello 4 o inferiore dissotterrato, inoltre metti il resto in fondo al tuo Deck in qualsiasi ordine. Puoi utilizzare ogni effetto di "Irremovibilatrice Conduttrice" una sola volta per turno.
  | pt_text               = Se este card estiver na sua mão: você pode colocar 1 outro card "Adamancipador" da sua mão no topo do Deck; Invoque este card por Invocação-Especial. Durante sua Fase Principal: você pode escavar os 5 cards do topo do seu Deck e, se isso acontecer, você pode Invocar por Invocação-Especial 1 monstro Rocha escavado de Nível 4 ou menos e, além disso, coloque o resto no fundo do seu Deck em qualquer ordem. Você só pode usar cada efeito de "Condutora Adamancipador" uma vez por turno.
  | es_text               = Si esta carta está en tu mano: puedes poner en la parte superior del Deck otra carta "Adamancipador" en tu mano; Invoca esta carta de Modo Especial. Durante tu Main Phase: puedes excavar las 5 cartas de la parte superior de tu Deck y, si lo haces, puedes Invocar de Modo Especial 1 monstruo Roca excavado de Nivel 4 o menor, y además pon el resto en la parte inferior de tu Deck en cualquier orden. Sólo puedes usar cada efecto de "Revisora Adamancipador" una vez por turno.
  | ja_text               = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが手札に存在する場合、手札から他の「アダマシア」カード１枚をデッキの一番上に戻して発動できる。このカードを特殊召喚する。②：自分メインフェイズに発動できる。自分のデッキの上からカードを５枚めくる。その中からレベル４以下の岩石族モンスター１体を選んで特殊召喚できる。残りを好きな順番でデッキの下に戻す。
