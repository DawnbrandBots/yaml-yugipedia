  | text                 = [[Add]] 1 "[[Angelechy]]" [[Spell]]/[[Trap]] from your [[Main Deck|Deck]] to your [[hand]], except "Angelechy Strategy Score", also for the rest of this [[turn]] after this card [[resolve]]s, you cannot [[Special Summon]] from the [[Extra Deck]], except [[LIGHT]] or [[DARK]] [[Synchro Monster]]s. If this card is in your [[GY]], except the turn it was [[send|sent]] there: You can [[banish]] it; [[return]] 1 "Angelechy" [[Monster Card]] you [[own]] from your [[Spell & Trap Zone]] to the [[Extra Deck]], then you can Special Summon it. You can only use each [[effect]] of "Angelechy Strategy Score" [[once per turn]].
  | fr_text              = Ajoutez 1 Magie/Piège "Angetélité" ("Score Stratégique Angetélité" exclu) depuis votre Deck à votre main, et aussi, vous ne pouvez pas Invoquer Spécialement (Monstres Synchro LUMIÈRE ou TÉNÈBRES exclus) depuis l'Extra Deck le reste de ce tour après la résolution de cette carte. Si cette carte est dans votre Cimetière, sauf le tour où elle y a été envoyée : vous pouvez la bannir ; renvoyez 1 Carte Monstre "Angetélité" que vous possédez depuis votre Zone Magie & Piège à l'Extra Deck, puis vous pouvez l'Invoquer Spécialement. Vous ne pouvez utiliser chaque effet de "Score Stratégique Angetélité" qu'une fois par tour.
  | de_text              = Füge deiner Hand 1 „Engelechy“-Zauber/Falle von deinem Deck hinzu, außer „Engelechy-Strategiebewertung“, zusätzlich kannst du für den Rest dieses Spielzugs, nachdem diese Karte aufgelöst wurde, keine Spezialbeschwörungen vom Extra Deck durchführen, außer von LICHT und FINSTERNIS Synchromonstern. Falls sich diese Karte in deinem Friedhof befindet, außer in dem Spielzug, in dem sie dorthin gelegt wurde: Du kannst sie verbannen; lege 1 „Engelechy“-Monsterkarte, die du besitzt, von deiner Zauber- & Fallenzone ins Extra Deck zurück, dann kannst du sie als Spezialbeschwörung beschwören. Du kannst jeden Effekt von „Engelechy-Strategiebewertung“ nur einmal pro Spielzug verwenden.
  | it_text              = Aggiungi 1 Magia/Trappola "Angelechy" dal tuo Deck alla tua mano, eccetto "Strategia di Punteggio Angelechy", inoltre per il resto di questo turno dopo che questa carta si è risolta, non puoi Evocare Specialmente dall'Extra Deck, eccetto Mostri Synchro LUCE o OSCURITÀ. Se questa carta è nel tuo Cimitero, eccetto nel turno in cui è stata mandata lì: puoi bandirla; fai ritornare 1 Carta Mostro "Angelechy" che possiedi dalla tua Zona Magie & Trappole nell'Extra Deck, poi puoi Evocarla Specialmente. Puoi utilizzare ogni effetto di "Strategia di Punteggio Angelechy" una sola volta per turno.
  | pt_text              = Adicione 1 Magia/Armadilha "Anjoléquia" do seu Deck à sua mão, exceto "Pontuação Estratégica de Anjoléquia" e, além disso, pelo resto deste turno depois que este card resolver, você não pode Invocar por Invocação-Especial do Deck Adicional, exceto Monstros Sincro de LUZ ou de TREVAS. Se este card estiver no seu Cemitério, exceto no turno em que foi enviado para lá: você pode bani-lo; devolva 1 Card de Monstro "Anjoléquia" do qual você é dono da sua Zona de Magias & Armadilhas para o Deck Adicional e, depois, você pode Invocá-lo por Invocação-Especial. Você só pode usar cada efeito de "Pontuação Estratégica de Anjoléquia" uma vez por turno.
  | es_text              = Añade a tu mano 1 Mágica/Trampa "Angelequia" en tu Deck, excepto "Puntuación de Estrategia Angelequia" y además, por el resto de este turno después de que esta carta se resuelva, no puedes Invocar de Modo Especial desde el Deck Extra, excepto Monstruos de Sincronía de LUZ u OSCURIDAD. Si esta carta está en tu Cementerio, excepto en el turno en el que ésta fue mandada allí: puedes desterrarla; devuelve al Deck Extra 1 Carta de Monstruo "Angelequia" que poseas en tu Zona de Magia y Trampas, y después puedes Invocarla de Modo Especial. Sólo puedes usar cada efecto de "Puntuación de Estrategia Angelequia" una vez por turno.
