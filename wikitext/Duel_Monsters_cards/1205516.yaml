  | sc_text               = 此卡名的卡1回合仅可发动1张。①：可从以下效果中选择1个发动。<br />●对手连锁自己的“三幻魔”怪兽的效果的发动，来发动效果时可以发动。将该对手的效果无效。<br />●向对手出示手牌的1只等级10的“三幻魔”怪兽可以发动。挑选自己的1张手牌舍弃，从牌组将1张“幻魔之扉”加入手牌。<br />●将自己墓地・除外状态的3张“三幻魔”陷阱卡放回牌组，以对手场上的1张卡为对象可以发动。将该卡破坏。
