  | text                  = [[Activate]] 1 of these [[effect]]s;<br />● When your opponent activates a card or [[effect]] in response to your "[[Sacred Beast (archetype)|Sacred Beast]]" monster's effect activation: [[Negate]] that effect.<br />● [[Reveal]] 1 [[Level]] 10 "Sacred Beast" monster in your [[hand]]; [[discard]] 1 card, and if you do, [[Add a card|add]] 1 "[[Illusion Gate]]" from your [[Main Deck|Deck]] to your hand.<br />● [[Shuffle]] 3 "Sacred Beast" [[Traps]] from your [[GY]] and/or [[banish]]ment into the Deck, then [[target]] 1 card your opponent [[control]]s; [[destroy]] it.<br />You can only activate 1 "Sacred Beasts Skyfall" per turn.
  | fr_text               = Activez 1 de ces effets ;<br />● Lorsque votre adversaire active une carte ou un effet en réponse à l'activation d'effet de votre monstre "Bêtes Sacrées" : annulez l'effet.<br />● Révélez 1 monstre "Bêtes Sacrées" de Niveau 10 dans votre main ; défaussez 1 carte, et si vous le faites, ajoutez 1 "Porte des Illusions" depuis votre Deck à votre main.<br />● Mélangez 3 Pièges "Bêtes Sacrées" depuis votre Cimetière et/ou bannissement dans le Deck, puis ciblez 1 carte contrôlée par votre adversaire ; détruisez-la.<br />Vous ne pouvez activer qu'1 "Chute Céleste des Bêtes Sacrées" par tour.
  | de_text               = Aktiviere 1 dieser Effekte;<br />● Wenn dein Gegner eine Karte oder einen Effekt als Reaktion auf die Aktivierung eines Effekts deines „Heiligen Ungeheuer“-Monsters aktiviert: Annulliere jenen Effekt.<br />● Zeige 1 „Heiligen Ungeheuer“-Monster der Stufe 10 in deiner Hand vor; wirf 1 Karte ab und falls du dies tust, füge deiner Hand 1 „Illusionstor“ von deinem Deck hinzu.<br />● Mische 3 „Heiligen Ungeheuer“-Fallen von deinem Friedhof und/oder deinen verbannten Karten ins Deck, dann wähle 1 Karte, die dein Gegner kontrolliert; zerstöre sie.<br />Du kannst nur 1 „Himmelssturz der heiligen Ungeheuer“ pro Spielzug aktivieren.
  | it_text               = Attiva 1 di questi effetti;<br />● Quando il tuo avversario attiva una carta o un effetto in risposta all'attivazione dell'effetto di un tuo mostro "Bestia Sacra": annulla quell'effetto.<br />● Rivela 1 mostro "Bestia Sacra" di Livello 10 nella tua mano; scarta 1 carta e, se lo fai, aggiungi 1 "Cancello Illusione" dal tuo Deck alla tua mano.<br />● Mischia 3 Trappole "Bestia Sacra" dal tuo Cimitero e/o carte bandite nel Deck, poi scegli come bersaglio 1 carta controllata dal tuo avversario; distruggila.<br />Puoi attivare solo 1 "Disastro Improvviso Bestie Sacre" per turno.
  | pt_text               = Ative 1 desses efeitos;<br />● Quando seu oponente ativar um card ou efeito em resposta à ativação do efeito do seu monstro "Bestas Sagradas": negue o efeito.<br />● Revele 1 monstro "Bestas Sagradas" de Nível 10 na sua mão; descarte 1 card e, se isso acontecer, adicione 1 "Portão da Ilusão" do seu Deck à sua mão.<br />● Embaralhe no Deck 3 Armadilhas "Bestas Sagradas" do seu Cemitério e/ou banimento e, depois, escolha 1 card que seu oponente controla; destrua-o.<br />Você só pode ativar 1 "Queda Celeste das Bestas Sagradas" por turno.
  | es_text               = Activa 1 de estos efectos;<br />● Cuando tu adversario activa una carta o efecto en respuesta a la activación del efecto de tu monstruo "Bestias Sagradas": niega ese efecto.<br />● Muestra 1 monstruo "Bestias Sagradas" de Nivel 10 en tu mano; descarta 1 carta y, si lo haces, añade a tu mano 1 "Puerta de las Ilusiones" en tu Deck.<br />● Baraja al Deck 3 Trampas "Bestias Sagradas" en tu Cementerio y/o destierro, y después selecciona 1 carta que controle tu adversario; destrúyela.<br />Sólo puedes activar 1 "Caída del Cielo de las Bestias Sagradas" por turno.
  | ja_text               = このカード名のカードは１ターンに１枚しか発動できない。①：以下の効果から１つを選択して発動できる。<br />●自分の「三幻魔」モンスターの効果の発動にチェーンして、相手が効果を発動した時に発動できる。その相手の効果を無効にする。<br />●手札のレベル１０の「三幻魔」モンスター１体を相手に見せて発動できる。自分の手札を１枚選んで捨て、デッキから「幻魔の扉」１枚を手札に加える。<br />●自分の墓地・除外状態の「三幻魔」罠カード３枚をデッキに戻し、相手フィールドのカード１枚を対象として発動できる。そのカードを破壊する。
