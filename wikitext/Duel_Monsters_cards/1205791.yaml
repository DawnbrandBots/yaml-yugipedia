  | sc_text              = 此卡名的①②效果1回合仅可各使用1次。①：此卡召唤・特殊召唤的情况下可以发动。从牌组将“V黑影”以外的1只“黑影”怪兽加入手牌。②：将墓地的此卡除外，以自己场上的1只“假面魔蹈士”超量怪兽为对象可以发动。从额外牌组将1只阶级比该自己的怪兽高1的“编号”怪兽重叠在对象怪兽上面，视为超量召唤特殊召唤。
