  | text                  = (This card is always treated as a "[[Blue-Eyes]]" card.)<br />You can [[discard]] this card; [[Add a card|add]] 1 [[Level]] 1 [[LIGHT]] [[Tuner]] from your [[Main Deck|Deck]] to your [[hand]]. If a "Blue-Eyes" [[Ritual Monster]] or "[[Blue-Eyes White Dragon]]" is [[sent]] to your [[GY]] (except during the [[Damage Step]]): You can [[target]] 1 of them in the GY; [[Special Summon]] this card from your GY (if it was there when the monster was sent) or hand (even if not), and if you do, its [[ATK]] becomes that target's, also [[banish]] it when it [[leaves the field]]. You can only use each [[effect]] of "Deep-Eyes White Dragon, the Blue Abyss" [[once per turn]].
  | fr_text               = (Cette carte est toujours traitée comme carte "Yeux Bleus".)<br />Vous pouvez défausser cette carte ; ajoutez 1 Syntoniseur LUMIÈRE de Niveau 1 depuis votre Deck à votre main. Si "Dragon Blanc aux Yeux Bleus" ou un Monstre Rituel "Yeux Bleus" est envoyé à votre Cimetière (sauf durant la Damage Step) : vous pouvez en cibler 1 dans le Cimetière ; Invoquez Spécialement cette carte depuis votre Cimetière (si elle y était lorsque le monstre a été envoyé) ou la main (même si elle n'y était pas), et si vous le faites, son ATK devient celle de la cible, et aussi, bannissez-la lorsqu'elle quitte le Terrain. Vous ne pouvez utiliser chaque effet de "Dragon Blanc aux Yeux Profonds, les Abysses Bleus" qu'une fois par tour.
  | de_text               = (Diese Karte wird immer als „Blauäugig“-Karte behandelt.)<br />Du kannst diese Karte abwerfen; füge deiner Hand 1 LICHT Empfänger der Stufe 1 von deinem Deck hinzu. Falls ein „Blauäugig“-Ritualmonster oder „Blauäugiger w. Drache“ auf deinen Friedhof gelegt wird (außer während des Damage Steps): Du kannst 1 von ihnen im Friedhof wählen; beschwöre diese Karte als Spezialbeschwörung von deinem Friedhof (falls sie dort lag, als das Monster gelegt wurde) oder deiner Hand (selbst falls nicht) und falls du dies tust, werden ihre ATK gleich denen jenes gewählten Ziels, zusätzlich verbanne sie, wenn sie das Spielfeld verlässt. Du kannst jeden Effekt von „Tiefäugiger weißer Drache, der blaue Abgrund“ nur einmal pro Spielzug verwenden.
  | it_text               = (Questa carta viene sempre considerata come una carta "Occhi Blu".)<br />Puoi scartare questa carta; aggiungi 1 Tuner LUCE di Livello 1 dal tuo Deck alla tua mano. Se un Mostro Rituale "Occhi Blu" o un "Drago Bianco Occhi Blu" viene mandato al tuo Cimitero (eccetto durante il Damage Step): puoi scegliere 1 di essi come bersaglio nel Cimitero; Evoca Specialmente questa carta dal tuo Cimitero (se era lì quando il mostro è stato mandato) o mano (anche se non era lì) e, se lo fai, il suo ATK diventa quello di quel bersaglio, inoltre bandiscilo quando lascia il Terreno. Puoi utilizzare ogni effetto di "Drago Bianco Occhi Profondi, l'Abisso Blu" una sola volta per turno.
  | pt_text               = (Este card deve ser sempre considerado como um card "Olhos Azuis".)<br />Você pode descartar este card; adicione 1 Regulador de LUZ de Nível 1 do seu Deck à sua mão. Se um Monstro de Ritual "Olhos Azuis" ou "Dragão Branco de Olhos Azuis" for enviado para o seu Cemitério (exceto durante a Etapa de Dano): você pode escolher 1 deles no Cemitério; Invoque este card por Invocação-Especial do seu Cemitério (se ele estava lá quando o monstro foi enviado) ou da mão (mesmo se ele não estava) e, se isso acontecer, seu ATK se torna o do alvo e, além disso, bana-o quando ele deixar o campo. Você só pode usar cada efeito de "Dragão Branco de Olhos Profundos, o Abismo Azul" uma vez por turno.
  | es_text               = (Esta carta se trata siempre como una carta "Ojos Azules").<br />Puedes descartar esta carta; añade a tu mano 1 Cantante de LUZ de Nivel 1 en tu Deck. Si un Monstruo de Ritual "Ojos Azules" o "Dragón Blanco de Ojos Azules" es mandado a tu Cementerio (excepto durante el Damage Step): puedes seleccionar 1 de ellos en el Cementerio; Invoca esta carta de Modo Especial desde tu Cementerio (si estaba allí cuando el monstruo fue mandado) o mano (aun si no lo estaba) y, si lo haces, su ATK se convierte en el de ese objetivo, y además destiérrala cuando deje el Campo. Sólo puedes usar cada efecto de "Dragón Blanco de Ojos Profundos, el Abismo Azul" una vez por turno.
  | ja_text               = このカード名はルール上「ブルーアイズ」カードとしても扱う。このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードを手札から捨てて発動できる。デッキから光属性・レベル１チューナー１体を手札に加える。②：「ブルーアイズ」儀式モンスターか「青眼の白龍」が自分の墓地へ送られた場合、その内の１体を対象として発動できる。このカードを手札・墓地から特殊召喚する。この効果で特殊召喚したこのカードは、攻撃力が対象のモンスターと同じになり、フィールドから離れた場合に除外される。
  | ko_text               = 이 카드명은 룰상 "푸른 눈" 카드로도 취급한다. 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 패에서 버리고 발동할 수 있다. 덱에서 빛 속성 / 레벨 1 튜너 1장을 패에 넣는다. ②: "푸른 눈" 의식 몬스터나 "푸른 눈의 백룡"이 자신 묘지로 보내졌을 경우, 그 중의 1장을 대상으로 하고 발동할 수 있다. 이 카드를 패 / 묘지에서 특수 소환한다. 이 효과로 특수 소환한 이 카드는, 공격력이 대상 몬스터와 같아지고, 필드에서 벗어났을 경우에 제외된다.
  | sc_text               = 此卡名在规则上也视为“青眼”卡。此卡名的①②效果1回合仅可各使用1次。①：从手牌将此卡舍弃可以发动。从牌组将1只光属性・等级1协调加入手牌。②：有“青眼”仪式怪兽或“青眼白龙”被送至自己墓地的情况下，以其中1只为对象可以发动。从手牌・墓地将此卡特殊召唤。以此效果特殊召唤的此卡，攻击力变为与对象怪兽相同、从场上离开的情况下，将其除外。
