  | sc_text               = 等级5以上的“命运－英雄”怪兽×2<br />“命运－英雄 无惧魔侠”1回合1次，仅可通过融合召唤及以下方法特殊召唤。●解放自己场上的1只“命运－英雄 恐惧魔侠”的情况下，可从额外牌组特殊召唤。①：此卡特殊召唤的情况下可以发动。从牌组将“命运－英雄”怪兽或记载有该卡名的卡合计2张加入手牌。②：此卡的攻击力变为自己场上・墓地的其他“命运－英雄”怪兽的原本攻击力的合计值。
