  | text                  = 2 [[Level]] 5 or higher "[[Destiny HERO]]" [[monsters]]<br />Must be either [[Fusion Summon]]ed, or [[Special Summon]]ed (from your [[Extra Deck]]) by [[Tributing]] 1 "[[Destiny HERO - Dreadmaster]]". You can only Special Summon "Destiny HERO - Dreadnought Master" [[once per turn]] this way, no matter which method you use. If this card is Special Summoned: You can [[Add a card|add]] 2 cards from your [[Main Deck|Deck]] to your [[hand]], that are "Destiny HERO" monsters and/or mention a "Destiny HERO" monster by name. This card's ATK becomes the total [[original ATK]] of other "Destiny HERO" monsters in your [[field]] and [[GY]].
  | fr_text               = 2 monstres "HÉROS de la Destinée" de min. Niveau 5<br />Uniquement soit Invocable par Fusion, soit Invocable Spécialement (depuis votre Extra Deck) en Sacrifiant 1 "Maître de l'Effroi - HÉROS de la Destinée". Vous ne pouvez Invoquer Spécialement "Maître Sans Effroi - HÉROS de la Destinée" qu'une fois par tour de cette façon, peu importe la méthode que vous utilisez. Si cette carte est Invoquée Spécialement : vous pouvez ajouter 2 cartes depuis votre Deck à votre main, qui sont des monstres "HÉROS de la Destinée" et/ou qui mentionnent nommément un monstre "HÉROS de la Destinée". L'ATK de cette carte devient la somme des ATK d'origine des autres monstres "HÉROS de la Destinée" dans votre Terrain et Cimetière.
  | de_text               = 2 „Schicksals-HELD“-Monster der Stufe 5 oder höher<br />Muss entweder als Fusionsbeschwörung beschworen werden oder als Spezialbeschwörung (von deinem Extra Deck) beschworen werden, indem du 1 „Schicksals-HELD - Dreadmaster“ als Tribut anbietest. Du kannst „Schicksals-HELD - Dreadnought Master“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören, egal welche Methode du verwendest. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst deiner Hand 2 Karten, die „Schicksals-HELD“-Monster sind und/oder den Namen eines „Schicksals-HELD“-Monsters erwähnen, von deinem Deck hinzufügen. Die ATK dieser Karte werden gleich der Summe der Grund-ATK der anderen „Schicksals-HELD“-Monster auf deiner Spielfeldseite und in deinem Friedhof.
  | it_text               = 2 mostri "EROE del Destino" di Livello 5 o superiore<br />Deve essere Evocato tramite Fusione, oppure Evocato Specialmente (dal tuo Extra Deck) offrendo come Tributo 1 "Maestro del Terrore - EROE del Destino". Puoi Evocare Specialmente "Maestro della Corazzata - EROE del Destino" una sola volta per turno in questo modo, indipendentemente da quale metodo utilizzi. Se questa carta viene Evocata Specialmente: puoi aggiungere dal tuo Deck alla tua mano 2 carte che sono mostri "EROE del Destino" e/o che menzionano un mostro "EROE del Destino" per nome. L'ATK di questa carta diventa la somma degli ATK originali degli altri mostri "EROE del Destino" nel tuo Terreno e Cimitero.
  | pt_text               = 2 monstros "HERÓI do Destino" de Nível 5 ou mais<br />Deve ser Invocado por Invocação-Fusão, ou por Invocação-Especial (do seu Deck Adicional) ao oferecer como Tributo 1 "HERÓI do Destino - Mestre do Horror". Você só pode Invocar "HERÓI do Destino - Mestre Couraçado" por Invocação-Especial uma vez por turno desta forma, não importa o método que usar. Se este card for Invocado por Invocação-Especial: você pode adicionar 2 cards do seu Deck à sua mão, que sejam monstros "HERÓI do Destino" e/ou mencionem um monstro "HERÓI do Destino" pelo nome. O ATK deste card se torna a soma do ATK original de outros monstros "HERÓI do Destino" no seu campo e Cemitério.
  | es_text               = 2 monstruos "HÉROE del Destino" de Nivel 5 o mayor<br />Debe ser ya sea Invocado por Fusión, o Invocado de Modo Especial (desde tu Deck Extra) Sacrificando 1 "HÉROE del Destino - Dreadmaster". Sólo puedes Invocar de Modo Especial "HÉROE del Destino - Dreadnought Master" una vez por turno de esta forma, sin importar el método que uses. Si esta carta es Invocada de Modo Especial: puedes añadir a tu mano 2 cartas en tu Deck, que sean monstruos "HÉROE del Destino" y/o mencionen un monstruo "HÉROE del Destino" por nombre. El ATK de esta carta se convierte en el ATK original total de los otros monstruos "HÉROE del Destino" en tu Campo y Cementerio.
  | ja_text               = レベル５以上の「Ｄ－ＨＥＲＯ」モンスター×２<br />「Ｄ－ＨＥＲＯ ドレッドノートガイ」は１ターンに１度、融合召喚及び以下の方法でのみ特殊召喚できる。●自分フィールドの「Ｄ－ＨＥＲＯ ドレッドガイ」１体をリリースした場合にＥＸデッキから特殊召喚できる。①：このカードが特殊召喚した場合に発動できる。「Ｄ－ＨＥＲＯ」モンスターまたはそのカード名が記されたカードを合計２枚デッキから手札に加える。②：このカードの攻撃力は、自分のフィールド・墓地の他の「Ｄ－ＨＥＲＯ」モンスターの元々の攻撃力の合計値になる。
