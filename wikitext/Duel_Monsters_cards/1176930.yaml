  | pendulum_effect       = During your [[Main Phase]]: You can [[destroy]] this card, and if you do, place 1 [[Pendulum Scale|Scale]] 1 [[Pendulum Monster]] from your [[hand]] or [[Main Deck|Deck]] in your [[Pendulum Zone]], except "Astrograph Sorcerer, the Starfrost Magician", but neither player can [[activate]] its [[Pendulum Effect]]s this turn. You can only use this [[effect]] of "Astrograph Sorcerer, the Starfrost Magician" once per turn.
  | text                  = If a [[face-up]] [[Monster Card]](s) you [[control]] is [[destroyed by battle]] or card [[effect]]: You can [[Special Summon]] this card from your [[hand]], then you can Special Summon 1 of those destroyed monsters from your face-up [[Extra Deck]] or [[GY]]. During the [[Main Phase]] ([[Quick Effect]]): You can [[Tribute]] this card, then you can [[Fusion Summon]] 1 [[Dragon]] [[Fusion Monster]] from your Extra Deck, by shuffling its materials from your [[field]] and/or face-up Extra Deck into the [[Main Deck|Deck]]. You can only use each effect of "Astrograph Sorcerer, the Starfrost Magician" once per turn.
  | fr_pendulum_effect    = Durant votre Main Phase : vous pouvez détruire cette carte, et si vous le faites, placez 1 Monstre Pendule d'Échelle 1 ("Sorcier Astrographe, le Magicien du Gel Stellaire" exclu) depuis votre main ou Deck dans votre Zone Pendule, mais aucun joueur ne peut activer ses Effets Pendule ce tour. Vous ne pouvez utiliser cet effet de "Sorcier Astrographe, le Magicien du Gel Stellaire" qu'une fois par tour.
  | fr_text               = Si une ou plusieurs Cartes Monstre face recto que vous contrôlez sont détruites au combat ou par un effet de carte : vous pouvez Invoquer Spécialement cette carte depuis votre main, puis vous pouvez Invoquer Spécialement 1 de ces monstres détruits depuis votre Extra Deck face recto ou Cimetière. Durant la Main Phase (Effet Rapide) : vous pouvez Sacrifier cette carte, puis vous pouvez Invoquer par Fusion 1 Monstre Fusion Dragon depuis votre Extra Deck, en mélangeant ses Matériels depuis votre Terrain et/ou Extra Deck face recto dans le Deck. Vous ne pouvez utiliser chaque effet de "Sorcier Astrographe, le Magicien du Gel Stellaire" qu'une fois par tour.
  | de_pendulum_effect    = Während deiner Main Phase: Du kannst diese Karte zerstören und falls du dies tust, lege 1 Pendelmonster mit Pendelbereich 1 von deiner Hand oder deinem Deck in deine Pendelzone, außer „Astrografzauberer, Sternfrost-Magier“, aber kein Spieler kann in diesem Spielzug seine Pendeleffekte aktivieren. Du kannst diesen Effekt von „Astrografzauberer, Sternfrost-Magier“ nur einmal pro Spielzug verwenden.
  | de_text               = Falls eine oder mehr offene Monsterkarten, die du kontrollierst, durch Kampf oder einen Karteneffekt zerstört werden: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören, dann kannst du 1 jener zerstörten Monster als Spezialbeschwörung offen von deinem Extra Deck oder von deinem Friedhof beschwören. Während der Main Phase (Schnelleffekt): Du kannst diese Karte als Tribut anbieten, dann kannst du 1 Drache-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du sein Material von deiner Spielfeldseite und/oder offen von deinem Extra Deck ins Deck mischst. Du kannst jeden Effekt von „Astrografzauberer, Sternfrost-Magier“ nur einmal pro Spielzug verwenden.
  | it_pendulum_effect    = Durante la tua Main Phase: puoi distruggere questa carta e, se lo fai, metti 1 Mostro Pendulum di Valore 1 dalla tua mano o Deck nella tua Zona Pendulum, eccetto "Stregone Astrografo, il Mago Gelidestelle", ma nessun giocatore può attivare i suoi Effetti Pendulum in questo turno. Puoi utilizzare questo effetto di "Stregone Astrografo, il Mago Gelidestelle" una sola volta per turno.
  | it_text               = Se una o più Carte Mostro scoperte che controlli vengono distrutte in battaglia o dall'effetto di una carta: puoi Evocare Specialmente questa carta dalla tua mano, poi puoi Evocare Specialmente 1 di quei mostri distrutti dal tuo Extra Deck scoperto o Cimitero. Durante la Main Phase (Effetto Rapido): puoi offrire come Tributo questa carta, poi puoi Evocare tramite Fusione 1 Mostro Fusione Drago dal tuo Extra Deck, mischiando i suoi materiali dal tuo Terreno e/o Extra Deck scoperto nel Deck. Puoi utilizzare ogni effetto di "Stregone Astrografo, il Mago Gelidestelle" una sola volta per turno.
  | pt_pendulum_effect    = Durante sua Fase Principal: você pode destruir este card e, se isso acontecer, coloque 1 Monstro Pêndulo de Escala 1 da sua mão ou do Deck na sua Zona de Pêndulo, exceto "Feiticeiro Astrógrafo, o Mago Starfrost", mas nenhum duelista pode ativar seus Efeitos de Pêndulo neste turno. Você só pode usar este efeito de "Feiticeiro Astrógrafo, o Mago Starfrost" uma vez por turno.
  | pt_text               = Se um ou mais Cards de Monstro com a face para cima que você controla forem destruídos em batalha ou por um efeito de card: você pode Invocar este card por Invocação-Especial da sua mão e, depois, você pode Invocar por Invocação-Especial 1 desses monstros destruídos do seu Deck Adicional com a face para cima ou Cemitério. Durante a Fase Principal (Efeito Rápido): você pode oferecer este card como Tributo e, depois, você pode Invocar por Invocação-Fusão 1 Monstro de Fusão Dragão do seu Deck Adicional, ao embaralhar suas matérias do seu campo e/ou Deck Adicional com a face para cima no Deck. Você só pode usar cada efeito de "Feiticeiro Astrógrafo, o Mago Starfrost" uma vez por turno.
  | es_pendulum_effect    = Durante tu Main Phase: puedes destruir esta carta y, si lo haces, pon en tu Zona de Péndulo 1 Monstruo de Péndulo de Escala 1 en tu mano o Deck, excepto "Hechicero del Astrógrafo, el Mago Congelaestrellas", pero ningún jugador puede activar sus Efectos de Péndulo este turno. Sólo puedes usar este efecto de "Hechicero del Astrógrafo, el Mago Congelaestrellas" una vez por turno.
  | es_text               = Si una o más Cartas de Monstruo boca arriba que controles son destruidas en batalla o por el efecto de una carta: puedes Invocar esta carta de Modo Especial desde tu mano, y después puedes Invocar de Modo Especial, desde tu Deck Extra boca arriba o Cementerio, 1 de esos monstruos destruidos. Durante la Main Phase (Efecto Rápido): puedes Sacrificar esta carta, y después puedes Invocar por Fusión 1 Monstruo de Fusión Dragón desde tu Deck Extra, barajando al Deck sus materiales en tu Campo y/o Deck Extra boca arriba. Sólo puedes usar cada efecto de "Hechicero del Astrógrafo, el Mago Congelaestrellas" una vez por turno.
  | ja_pendulum_effect    = このカード名のＰ効果は１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。このカードを破壊し、手札・デッキから「星霜の魔術師－アストログラフ・マジシャン」以外のＰスケールが１のＰモンスター１体を自分のＰゾーンに置く。この効果で置いたカードのＰ効果はこのターン発動できない。
  | ja_text               = このカード名の①②のモンスター効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドの表側表示のモンスターカードが戦闘・効果で破壊された場合に発動できる。このカードを手札から特殊召喚する。その後、その破壊されたモンスターの内１体を自分のＥＸデッキ（表側）・墓地から特殊召喚できる。②：自分・相手のメインフェイズに発動できる。このカードをリリースする。その後、自分のＥＸデッキ（表側）・フィールドのモンスターを融合素材としてデッキに戻し、ドラゴン族の融合モンスター１体を融合召喚できる。
  | ko_pendulum_effect    = 이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신 메인 페이즈에 발동할 수 있다. 이 카드를 파괴하고, 패 / 덱에서 "성상의 마술사－아스트로그래프 매지션" 이외의 펜듈럼 스케일이 1 인 펜듈럼 몬스터 1장을 자신의 펜듈럼 존에 놓는다. 이 효과로 놓은 카드의 펜듈럼 효과는 이 턴에 발동할 수 없다.
  | ko_text               = 이 카드명의 ①②의 몬스터 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드의 앞면 표시 몬스터 카드가 전투 / 효과로 파괴되었을 경우에 발동할 수 있다. 이 카드를 패에서 특수 소환한다. 그 후, 그 파괴된 몬스터 중 1장을 자신의 엑스트라 덱(앞면) / 묘지에서 특수 소환할 수 있다. ②: 자신 / 상대의 메인 페이즈에 발동할 수 있다. 이 카드를 릴리스한다. 그 후, 자신의 엑스트라 덱(앞면) / 필드의 몬스터를 융합 소재로서 덱으로 되돌리고, 드래곤족인 융합 몬스터 1장을 융합 소환할 수 있다.
  | sc_pendulum_effect    = 此卡名的灵摆效果1回合仅可使用1次。①：在自己的主要阶段可以发动。将此卡破坏，从手牌・牌组将“星霜的魔术师－宙读阵魔术士”以外的、1只灵摆刻度为1的灵摆怪兽放在自己的灵摆区域。以此效果所放的卡的灵摆效果此回合不可发动。
  | sc_text               = 此卡名的①②怪兽效果1回合仅可各使用1次。①：自己场上的表侧表示怪兽卡因战斗・效果被破坏的情况下可以发动。从手牌将此卡特殊召唤。然后，可从自己额外牌组（表侧）・墓地将该被破坏的怪兽中的1只特殊召唤。②：在自己・对手的主要阶段可以发动。解放此卡。然后，可将自己额外牌组（表侧）・场上的怪兽作为融合素材放回牌组，将1只龙族融合怪兽融合召唤。
