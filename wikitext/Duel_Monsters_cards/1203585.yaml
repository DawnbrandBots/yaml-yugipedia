  | text                  = When this card is [[destroyed by battle]] and [[sent]] to the [[GY]]: You can [[Special Summon]] 1 [[Level]] 4 [[monster]] with 1400 [[ATK]] from your [[Main Deck|Deck]], or if you have 2 or more Level 4 monsters with 1400 ATK in your GY, you can Special Summon 1 [[Normal Monster]] instead. When your opponent [[activate]]s a [[monster effect]], while you [[control]] a [[face-up]] [[non-Effect Monster]] ([[Quick Effect]]): You can [[banish]] this card from your GY; [[negate]] the activation, and if you do, [[destroy]] that card. You can only use this effect of "Father Grizzly" once per turn.
  | fr_text               = Lorsque cette carte est détruite au combat et envoyée au Cimetière : vous pouvez Invoquer Spécialement 1 monstre de Niveau 4 avec 1400 ATK depuis votre Deck, ou si vous avez min. 2 monstres de Niveau 4 avec 1400 ATK dans votre Cimetière, vous pouvez Invoquer Spécialement 1 Monstre Normal à la place. Lorsque votre adversaire active un effet de monstre, tant que vous contrôlez un monstre face recto (Monstres à Effet exclus) (Effet Rapide) : vous pouvez bannir cette carte depuis votre Cimetière ; annulez l'activation, et si vous le faites, détruisez la carte. Vous ne pouvez utiliser cet effet de "Père Grizzly" qu'une fois par tour.
  | de_text               = Wenn diese Karte durch Kampf zerstört und auf den Friedhof gelegt wird: Du kannst 1 Monster der Stufe 4 mit 1400 ATK als Spezialbeschwörung von deinem Deck beschwören oder falls du 2 oder mehr Monster der Stufe 4 mit 1400 ATK in deinem Friedhof hast, kannst du stattdessen 1 Normales Monster als Spezialbeschwörung beschwören. Wenn dein Gegner einen Monstereffekt aktiviert, solange du ein offenes Nichteffekt-Monster kontrollierst (Schnelleffekt): Du kannst diese Karte von deinem Friedhof verbannen; annulliere die Aktivierung und falls du dies tust, zerstöre jene Karte. Du kannst diesen Effekt von „Vater Grizzly“ nur einmal pro Spielzug verwenden.
  | it_text               = Quando questa carta viene distrutta in battaglia e mandata al Cimitero: puoi Evocare Specialmente 1 mostro di Livello 4 con 1400 ATK dal tuo Deck o, se hai 2 o più mostri di Livello 4 con 1400 ATK nel tuo Cimitero, puoi invece Evocare Specialmente 1 Mostro Normale. Quando il tuo avversario attiva l'effetto di un mostro, mentre controlli un Mostro non-con Effetto scoperto (Effetto Rapido): puoi bandire questa carta dal tuo Cimitero; annulla l'attivazione e, se lo fai, distruggi quella carta. Puoi utilizzare questo effetto di "Padre Grizzly" una sola volta per turno.
  | pt_text               = Quando este card for destruído em batalha e enviado para o Cemitério: você pode Invocar por Invocação-Especial 1 monstro de Nível 4 com 1400 de ATK do seu Deck, ou se você tiver 2 ou mais monstros de Nível 4 com 1400 de ATK no seu Cemitério, em vez disso, você pode Invocar 1 Monstro Normal por Invocação-Especial. Quando seu oponente ativar um efeito de monstro, enquanto você controlar um Monstro que não seja de Efeito com a face para cima (Efeito Rápido): você pode banir este card do seu Cemitério; negue a ativação e, se isso acontecer, destrua esse card. Você só pode usar este efeito de "Pai Urso Pardo" uma vez por turno.
  | es_text               = Cuando esta carta es destruida en batalla y mandada al Cementerio: puedes Invocar de Modo Especial 1 monstruo de Nivel 4 con 1400 ATK desde tu Deck o, si tienes 2 o más monstruos de Nivel 4 con 1400 ATK en tu Cementerio, puedes Invocar de Modo Especial 1 Monstruo Normal en su lugar. Cuando tu adversario activa un efecto de monstruo, mientras controlas un Monstruo boca arriba que no sea de Efecto (Efecto Rápido): puedes desterrar esta carta en tu Cementerio; niega la activación y, si lo haces, destruye esa carta. Sólo puedes usar este efecto de "Padre Oso Pardo" una vez por turno.
  | ja_text               = このカード名の②の効果は１ターンに１度しか使用できない。①：このカードが戦闘で破壊され墓地へ送られた時に発動できる。デッキから攻撃力１４００のレベル４モンスター１体を特殊召喚する。自分の墓地に攻撃力１４００のレベル４モンスターが２体以上存在する場合、代わりに通常モンスター１体を特殊召喚する事もできる。②：自分フィールドに効果モンスター以外の表側表示モンスターが存在し、相手がモンスターの効果を発動した時、墓地のこのカードを除外して発動できる。その発動を無効にし破壊する。
  | ko_text               = 
  | sc_text               = 此卡名的②效果1回合仅可使用1次。①：此卡因战斗被破坏并被送至墓地时可以发动。从牌组将1只攻击力1400的等级4怪兽特殊召唤。自己墓地存在2只以上攻击力1400的等级4怪兽的情况下，作为代替也可将1只通常怪兽特殊召唤。②：自己场上存在效果怪兽以外的表侧表示怪兽，且对手发动怪兽的效果时，将墓地的此卡除外可以发动。将该发动无效并破坏。
