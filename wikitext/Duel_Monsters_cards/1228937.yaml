  | text                 = If a [[face-up]] card(s) you [[control]] is [[destroy]]ed by an opponent's [[card effect]]: You can toss a coin and call it. If you call it right, [[Special Summon]] 1 [[monster]] from your [[GY]]. If you call it wrong, [[Set]] 1 [[Trap]] from your GY. If this card in your [[possess]]ion is destroyed by an opponent's card effect: You can [[activate]] 1 of these effects;<br />● Special Summon 1 monster from your GY.<br />● Set 1 Trap from your GY.<br />You can only use each [[effect]] of "Just Flip a Coin" [[once per turn]].
  | fr_text              = Si une ou plusieurs cartes face recto que vous contrôlez sont détruites par un effet de carte de l'adversaire : vous pouvez jouer à pile ou face. Si vous gagnez, Invoquez Spécialement 1 monstre depuis votre Cimetière. Si vous perdez, Posez 1 Piège depuis votre Cimetière. Si cette carte en votre possession est détruite par un effet de carte de l'adversaire : vous pouvez activer 1 de ces effets ;<br />● Invoquez Spécialement 1 monstre depuis votre Cimetière.<br />● Posez 1 Piège depuis votre Cimetière.<br />Vous ne pouvez utiliser chaque effet de "Pile ou Face ?" qu'une fois par tour.
  | de_text              = Falls eine oder mehr offene Karten, die du kontrollierst, durch einen Karteneffekt eines Gegners zerstört werden: Du kannst eine Münze werfen und das Ergebnis voraussagen. Falls du richtig vorausgesagt hast, beschwöre 1 Monster als Spezialbeschwörung von deinem Friedhof. Falls du falsch vorausgesagt hast, setze 1 Falle von deinem Friedhof. Falls diese Karte, die dir gehört, durch einen Karteneffekt eines Gegners zerstört wird: Du kannst 1 dieser Effekte aktivieren;<br />● Beschwöre 1 Monster als Spezialbeschwörung von deinem Friedhof.<br />● Setze 1 Falle von deinem Friedhof.<br />Du kannst jeden Effekt von „Wirf einfach eine Münze“ nur einmal pro Spielzug verwenden.
  | it_text              = Se una o più carte scoperte che controlli vengono distrutte dall'effetto di una carta dell'avversario: puoi lanciare una moneta e scegliere testa o croce. Se indovini, Evoca Specialmente 1 mostro dal tuo Cimitero. Se sbagli, Posiziona 1 Trappola dal tuo Cimitero. Se questa carta sotto il tuo comando viene distrutta dall'effetto di una carta dell'avversario: puoi attivare 1 di questi effetti;<br />● Evoca Specialmente 1 mostro dal tuo Cimitero.<br />● Posiziona 1 Trappola dal tuo Cimitero.<br />Puoi utilizzare ogni effetto di "Semplicemente Lancia una Moneta" una sola volta per turno.
  | pt_text              = Se um ou mais cards com a face para cima que você controla forem destruídos por um efeito de card do oponente: você pode lançar uma moeda e escolher cara ou coroa. Se você ganhar, Invoque por Invocação-Especial 1 monstro do seu Cemitério. Se você perder, Baixe 1 Armadilha do seu Cemitério. Se este card em sua posse for destruído por um efeito de card do oponente: você pode ativar 1 desses efeitos;<br />● Invoque por Invocação-Especial 1 monstro do seu Cemitério.<br />● Baixe 1 Armadilha do seu Cemitério.<br />Você só pode usar cada efeito de "Apenas Lance uma Moeda" uma vez por turno.
  | es_text              = Si una o más cartas boca arriba que controlas son destruidas por el efecto de una carta del adversario: puedes lanzar una moneda y elegir Cara o Cruz. Si aciertas, Invoca de Modo Especial 1 monstruo desde tu Cementerio. Si fallas, Coloca 1 Trampa desde tu Cementerio. Si esta carta en tu posesión es destruida por el efecto de una carta del adversario: puedes activar 1 de estos efectos;<br />● Invoca de Modo Especial 1 monstruo desde tu Cementerio.<br />● Coloca 1 Trampa desde tu Cementerio.<br />Sólo puedes usar cada efecto de "Sólo Lanza una Moneda" una vez por turno.
