  | text                = [[Fusion Summon]] 1 [[EARTH]] [[Warrior]] [[Fusion Monster]] from your [[Extra Deck]], using Warrior [[Monster Card|monsters]] from your [[hand]] or [[field]], then if you [[activate]]d this card during the [[Battle Phase]], you can choose monsters your opponent [[control]]s, up to the number of [[Fusion Material|materials]] used from the hand for this Fusion Summon, and their [[ATK]] become halved until the end of the Battle Phase. You cannot [[declare]] [[attack]]s the [[turn]] you activate this card, except with EARTH Warrior monsters. You can only activate 1 "Hunting Horn" per turn.
  | fr_text             = Invoquez par Fusion 1 Monstre Fusion TERRE Guerrier depuis votre Extra Deck, en utilisant des monstres Guerrier depuis votre main ou Terrain, puis si vous avez activé cette carte durant la Battle Phase, vous pouvez choisir un nombre de monstres contrôlés par votre adversaire, inférieur ou égal au nombre de Matériels utilisés depuis la main pour cette Invocation Fusion, et leur ATK sera divisée par deux jusqu'à la fin de la Battle Phase. Vous ne pouvez pas déclarer d'attaques le tour où vous activez cette carte, sauf avec des monstres TERRE Guerrier. Vous ne pouvez activer qu'1 "Corne de Chasse" par tour.
  | de_text             = Beschwöre 1 ERDE Krieger-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck, indem du Krieger-Monster von deiner Hand oder Spielfeldseite verwendest, dann, falls du diese Karte während der Battle Phase aktiviert hast, kannst du Monster, die dein Gegner kontrolliert, bis zu Anzahl des Materials bestimmen, das von der Hand für diese Fusionsbeschwörung verwendet wurde, und ihre ATK werden bis zum Ende der Battle Phase halbiert. Du kannst in dem Spielzug, in dem du diese Karte aktivierst, keine Angriffe deklarieren, außer mit ERDE Krieger-Monstern. Du kannst nur 1 „Jagdhorn“ pro Spielzug aktivieren.
  | it_text             = Evoca tramite Fusione 1 Mostro Fusione TERRA Guerriero dal tuo Extra Deck, utilizzando mostri Guerriero dalla tua mano o Terreno, poi se hai attivato questa carta durante la Battle Phase, puoi selezionare mostri controllati dal tuo avversario, fino al numero di materiali utilizzati dalla mano per questa Evocazione tramite Fusione, e i loro ATK vengono dimezzati fino alla fine della Battle Phase. Non puoi dichiarare attacchi nel turno in cui attivi questa carta, eccetto con mostri TERRA Guerriero. Puoi attivare solo 1 "Corno da Caccia" per turno.
  | pt_text             = Invoque por Invocação-Fusão 1 Monstro de Fusão Guerreiro de TERRA do seu Deck Adicional, usando monstros Guerreiro da sua mão ou do campo e, depois, se você ativou este card durante a Fase de Batalha, você pode selecionar monstros que seu oponente controla, até o número de matérias usadas da mão para esta Invocação-Fusão, e o ATK deles é diminuído pela metade até o final da Fase de Batalha. Você não pode declarar ataques no turno em que ativar este card, exceto com monstros Guerreiro de TERRA. Você só pode ativar 1 "Chifre de Caça" por turno.
  | es_text             = Invoca por Fusión 1 Monstruo de Fusión Guerrero de TIERRA desde tu Deck Extra, usando monstruos Guerrero en tu mano o Campo y después, si activaste esta carta durante la Battle Phase, puedes elegir monstruos que controle tu adversario hasta el número de materiales usados desde la mano para esta Invocación por Fusión, y su ATK se divide a la mitad hasta el final de la Battle Phase. No puedes declarar ataques el turno en el que activas esta carta, excepto con monstruos Guerrero de TIERRA. Sólo puedes activar 1 "Cuerno de Caza" por turno.
  | ja_text             = このカード名のカードは１ターンに１枚しか発動できず、このカードを発動するターン、自分は戦士族・地属性モンスターでしか攻撃宣言できない。①：自分の手札・フィールドの戦士族モンスターを融合素材とし、戦士族・地属性の融合モンスター１体を融合召喚する。このカードをバトルフェイズに発動した場合、さらにこの効果で手札から融合素材とした数まで相手フィールドのモンスターを選ぶ事ができる。選んだモンスターの攻撃力はバトルフェイズ終了時まで半分になる。
  | ko_text             = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없으며, 이 카드를 발동하는 턴에, 자신은 전사족 / 땅 속성 몬스터로밖에 공격 선언할 수 없다. ①: 자신의 패 / 필드의 전사족 몬스터를 융합 소재로 하고, 전사족 / 땅 속성 융합 몬스터 1장을 융합 소환한다. 이 카드를 배틀 페이즈에 발동했을 경우, 추가로 이 효과로 패에서 융합 소재로 한 수까지 상대 필드의 몬스터를 고를 수 있다. 고른 몬스터의 공격력은 배틀 페이즈 종료시까지 절반이 된다.
