  | sc_text             = 等级9怪兽×2<br />“银河眼反物质龙”1回合1次，也可重叠在持有3个以上超量素材的、自己的超量怪兽上面来超量召唤。①：持有超量素材的此卡给予对手的战斗伤害变为一半。②：去除此卡的1个超量素材可以发动。此回合，此卡在1次战斗阶段中最多可攻击怪兽2次。去除的超量素材为怪兽的情况下，进而可从牌组将1只与该怪兽种族相同的怪兽送至墓地。
