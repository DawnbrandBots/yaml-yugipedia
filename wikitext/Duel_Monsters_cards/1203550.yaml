  | text                 = [[Once per turn]], during the [[End Phase]]: You can [[pay]] 100 [[LP]]; place 1 [[Myriaday Counter]] on this card. Once per turn, during your [[Main Phase]]: You can place 1 Myriaday Counter on this card for every 1000 points difference between your LP and your opponent's. Gains 10000 [[ATK]]/[[DEF]] while this card has 10 or more Myriaday Counters. If this card would be [[destroyed by battle]] or card [[effect]], remove 1 Myriaday Counter from this card instead.
  | fr_text              = Une fois par tour, durant la End Phase : vous pouvez payer 100 LP ; placez 1 Compteur Myriajour sur cette carte. Une fois par tour, durant votre Main Phase : vous pouvez placer 1 Compteur Myriajour sur cette carte pour chaque écart de 1000 points entre vos LP et ceux de votre adversaire. Gagne 10000 ATK/DEF tant que cette carte a min. 10 Compteurs Myriajour. Si cette carte va être détruite au combat ou par un effet de carte, retirez 1 Compteur Myriajour de cette carte à la place.
  | de_text              = Einmal pro Spielzug, während der End Phase: Du kannst 100 LP zahlen; lege 1 Myriadtag-Zählmarke auf diese Karte. Einmal pro Spielzug, während deiner Main Phase: Du kannst für je 1000 Punkte Differenz zwischen deinen LP und denen deines Gegners 1 Myriadtag-Zählmarke auf diese Karte legen. Erhält 10000 ATK/DEF, solange diese Karte 10 oder mehr Myriadtag-Zählmarken hat. Falls diese Karte durch Kampf oder einen Karteneffekt zerstört würde, entferne stattdessen 1 Myriadtag-Zählmarke von dieser Karte.
  | it_text              = Una volta per turno, durante la End Phase: puoi pagare 100 LP; metti 1 Segnalino Miriagiorno su questa carta. Una volta per turno, durante la tua Main Phase: puoi mettere 1 Segnalino Miriagiorno su questa carta per ogni 1000 punti di differenza tra i tuoi LP e quelli del tuo avversario. Guadagna 10000 ATK/DEF mentre questa carta ha 10 o più Segnalini Miriagiorno. Se questa carta sta per essere distrutta in battaglia o dall'effetto di una carta, rimuovi invece 1 Segnalino Miriagiorno da questa carta.
  | pt_text              = Uma vez por turno, durante a Fase Final: você pode pagar 100 PV; coloque 1 Marcador de Miriadia neste card. Uma vez por turno, durante sua Fase Principal: você pode colocar 1 Marcador de Miriadia neste card para cada 1000 pontos de diferença entre os seus PV e os do seu oponente. Ganha 10000 de ATK/DEF enquanto este card tiver 10 ou mais Marcadores de Miriadia. Se este card seria destruído em batalha ou por um efeito de card, em vez disso, remova 1 Marcador de Miriadia deste card.
  | es_text              = Una vez por turno, durante la End Phase: puedes pagar 100 LP; pon 1 Contador Miriadía en esta carta. Una vez por turno, durante tu Main Phase: puedes poner 1 Contador Miriadía en esta carta por cada 1000 puntos de diferencia entre tus LP y los de tu adversario. Gana 10000 ATK/DEF mientras esta carta tenga 10 o más Contadores Miriadía. Si esta carta fuera a ser destruida en batalla o por el efecto de una carta, retira 1 Contador Miriadía de esta carta en su lugar.
  | ja_text              = ①：自分・相手のエンドフェイズに、１００ＬＰを払って発動できる。このカードに万倍カウンターを１つ置く。②：１ターンに１度、自分メインフェイズに発動できる。お互いのＬＰの差１０００につき１つ、このカードに万倍カウンターを置く。③：このカードの万倍カウンターの数が１０以上である限り、このカードの攻撃力・守備力は１００００アップする。④：このカードが戦闘・効果で破壊される場合、代わりにこのカードの万倍カウンターを１つ取り除く。
