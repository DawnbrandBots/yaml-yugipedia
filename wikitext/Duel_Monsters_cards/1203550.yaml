  | sc_text              = ①：在自己・对手的结束阶段，支付100LP可以发动。在此卡上放1个万倍计数物。②：1回合1次，在自己的主要阶段可以发动。双方的LP之差每有1000，就在此卡上放1个万倍计数物。③：只要此卡的万倍计数物的数量在10以上，此卡的攻击力・守备力上升10000。④：此卡将被战斗・效果破坏的情况下，作为代替去除此卡的1个万倍计数物。
