  | sc_text               = 此卡名的②效果1回合仅可使用1次。①：以场上的1张表侧表示卡为对象可以发动。将该卡破坏。此回合，自己不可从手牌以外的地方特殊召唤效果怪兽。②：此卡存在于墓地的状态下，以自己的“雷盟”卡的效果破坏了卡的情况下可以发动。将此卡加入手牌。
