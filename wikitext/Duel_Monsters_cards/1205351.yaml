  | text                  = [[Target]] 1 [[face-up]] card on the [[field]]; [[destroy]] it, also for the rest of this [[turn]], you cannot [[Special Summon]] [[Effect Monster]]s, except from the [[hand]]. If a card(s) is destroyed by your "[[Blitzclique]]" card's effect, while this card is in your [[GY]] (except during the [[Damage Step]]): You can [[Add a card|add]] this card to your [[hand]]. You can only use this effect of "Blitzclique Overvolt" [[once per turn]].
  | fr_text               = Ciblez 1 carte face recto sur le Terrain ; détruisez-la, et aussi, vous ne pouvez pas Invoquer Spécialement de Monstres à Effet, sauf depuis la main, le reste de ce tour. Si une ou plusieurs cartes sont détruites par un effet de votre carte "Blitzclique", tant que cette carte est dans votre Cimetière (sauf durant la Damage Step) : vous pouvez ajouter cette carte à votre main. Vous ne pouvez utiliser cet effet de "Surtension de la Blitzclique" qu'une fois par tour.
  | de_text               = Wähle 1 offene Karte auf dem Spielfeld; zerstöre sie, zusätzlich kannst du für den Rest dieses Spielzugs keine Effektmonster als Spezialbeschwörung beschwören, außer von der Hand. Falls eine oder mehr Karten durch einen Effekt deiner „Blitzclique“-Karte zerstört werden, solange sich diese Karte in deinem Friedhof befindet (außer während des Damage Steps): Du kannst diese Karte deiner Hand hinzufügen. Du kannst diesen Effekt von „Blitzcliquen-Überspannung“ nur einmal pro Spielzug verwenden.
  | it_text               = Scegli come bersaglio 1 carta scoperta sul Terreno; distruggila, inoltre per il resto di questo turno, non puoi Evocare Specialmente Mostri con Effetto, eccetto dalla mano. Se una o più carte vengono distrutte dall'effetto di una tua carta "Blitzclique", mentre questa carta è nel tuo Cimitero (eccetto durante il Damage Step): puoi aggiungere questa carta alla tua mano. Puoi utilizzare questo effetto di "Sovratensione Blitzclique" una sola volta per turno.
  | pt_text               = Escolha 1 card com a face para cima no campo; destrua-o e, além disso, pelo resto deste turno, você não pode Invocar Monstros de Efeito por Invocação-Especial, exceto da mão. Se um ou mais cards forem destruídos por um efeito de card "Blitzclique" seu, enquanto este card estiver no seu Cemitério (exceto durante a Etapa de Dano): você pode adicionar este card à sua mão. Você só pode usar este efeito de "Sobretensão Blitzclique" uma vez por turno.
  | es_text               = Selecciona 1 carta boca arriba en el Campo; destrúyela y además, por el resto de este turno, no puedes Invocar de Modo Especial Monstruos de Efecto, excepto desde la mano. Si una o más cartas son destruidas por el efecto de tu carta "Blitzclique", mientras esta carta está en tu Cementerio (excepto durante el Damage Step): puedes añadir esta carta a tu mano. Sólo puedes usar este efecto de "Sobrevoltaje Blitzclique" una vez por turno.
  | ja_text               = このカード名の②の効果は１ターンに１度しか使用できない。①：フィールドの表側表示カード１枚を対象として発動できる。そのカードを破壊する。このターン、自分は手札からしか効果モンスターを特殊召喚できない。②：このカードが墓地に存在する状態で、自分の「ブリッツクリーク」カードの効果でカードを破壊した場合に発動できる。このカードを手札に加える。
