  | text                  = 2+ [[monsters]], including a [[Pendulum Monster]]<br />You can [[target]] 1 other card you [[control]]; [[destroy]] it, and if you do, [[Draw a card|draw]] 1 card. During your [[turn]], when your opponent [[activate]]s a card or [[effect]] ([[Quick Effect]]): You can [[discard]] 1 card; [[negate]] that effect. You can only use each of the preceding effects of "Odd-Eyes Override Dragon" once per turn. If you destroyed a [[Pendulum Monster Card]] by this card's first effect, during your [[Main Phase]] this turn, you can conduct 1 [[Pendulum Summon]] of a "[[Performapal]]" monster(s), "[[Magician]]" Pendulum Monster(s), and/or "[[Odd-Eyes]]" monster(s), in addition to your Pendulum Summon (you can only [[gain this effect once per turn]]).
  | fr_text               = 2+ monstres (un Monstre Pendule inclus)<br />Vous pouvez cibler 1 autre carte que vous contrôlez ; détruisez-la, et si vous le faites, piochez 1 carte. Durant votre tour, lorsque votre adversaire active une carte ou un effet (Effet Rapide) : vous pouvez défausser 1 carte ; annulez l'effet. Vous ne pouvez utiliser chacun des effets précédents de "Dragon Forçage aux Yeux Impairs" qu'une fois par tour. Si vous avez détruit une Carte Monstre Pendule par le premier effet de cette carte, durant votre Main Phase ce tour, vous pouvez mener 1 Invocation Pendule d'un ou plusieurs monstres "Potartiste", d'un ou plusieurs Monstres Pendule "Magicien" et/ou d'un ou plusieurs monstres "Yeux Impairs", en plus de votre Invocation Pendule (vous ne pouvez gagner cet effet qu'une fois par tour).
  | de_text               = 2+ Monster, darunter ein Pendelmonster<br />Du kannst 1 andere Karte wählen, die du kontrollierst; zerstöre sie und falls du dies tust, ziehe 1 Karte. Während deines Spielzugs, wenn dein Gegner eine Karte oder einen Effekt aktiviert (Schnelleffekt): Du kannst 1 Karte abwerfen; annulliere jenen Effekt. Du kannst jeden der vorherigen Effekte von „Buntäugiger Überschreibdrache“ nur einmal pro Spielzug verwenden. Falls du eine Pendelmonsterkarte durch den ersten Effekt dieser Karte zerstört hast, kannst du in diesem Spielzug während deiner Main Phase zusätzlich zu deiner Pendelbeschwörung 1 Pendelbeschwörung von einem oder mehr „Künstlerkumpel“-Monstern, „Magier“-Pendelmonstern und/oder „Buntäugig“-Monstern durchführen (du kannst diesen Effekt nur einmal pro Spielzug erhalten).
  | it_text               = 2+ mostri, compreso un Mostro Pendulum<br />Puoi scegliere come bersaglio 1 altra carta che controlli; distruggila e, se lo fai, pesca 1 carta. Durante il tuo turno, quando il tuo avversario attiva una carta o un effetto (Effetto Rapido): puoi scartare 1 carta; annulla quell'effetto. Puoi utilizzare ognuno dei precedenti effetti di "Drago Sovrascrittura Occhi Diversi" una sola volta per turno. Se hai distrutto una Carta Mostro Pendulum con il primo effetto di questa carta, durante la tua Main Phase in questo turno, puoi effettuare 1 Evocazione Pendulum di uno o più mostri "Artistamico", uno o più Mostri Pendulum "Mago" e/o uno o più mostri "Occhi Diversi", in aggiunta alla tua Evocazione Pendulum (puoi guadagnare questo effetto una sola volta per turno).
  | pt_text               = 2+ monstros, incluindo um Monstro Pêndulo<br />Você pode escolher 1 outro card que você controla; destrua-o e, se isso acontecer, compre 1 card. Durante o seu turno, quando seu oponente ativar um card ou efeito (Efeito Rápido): você pode descartar 1 card; negue esse efeito. Você só pode usar cada um dos efeitos anteriores de "Dragão de Substituição de Olhos Anômalos" uma vez por turno. Se você destruiu um Card de Monstro Pêndulo com o primeiro efeito deste card, durante sua Fase Principal neste turno, você pode conduzir 1 Invocação-Pêndulo de um ou mais monstros "Camarartista", um ou mais Monstros Pêndulo "Mago" e/ou um ou mais monstros "Olhos Anômalos", em adição à sua Invocação-Pêndulo (padrão) (você só pode se aproveitar deste efeito uma vez por turno).
  | es_text               = 2+ monstruos, incluyendo un Monstruo de Péndulo<br />Puedes seleccionar otra carta que controles; destrúyela y, si lo haces, roba 1 carta. Durante tu turno, cuando tu adversario active una carta o efecto (Efecto Rápido): puedes descartar 1 carta; niega ese efecto. Sólo puedes usar cada uno de los previos efectos de "Dragón de Invalidación de Ojos Anómalos" una vez por turno. Si destruiste una Carta de Monstruo de Péndulo con el primer efecto de esta carta, durante tu Main Phase de este turno, puedes realizar 1 Invocación por Péndulo de uno o más monstruos "Artistamigo", Monstruos de Péndulo "Mago/a" y/o monstruos "Ojos Anómalos", además de tu Invocación por Péndulo (sólo puedes ganar este efecto una vez por turno).
