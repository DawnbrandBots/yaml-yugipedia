  | fr_text         = Une fois par Chaîne, durant un tour où votre adversaire a Invoqué min. 3 monstres (Effet Rapide) : vous pouvez Invoquer Spécialement cette carte depuis votre main, et si vous le faites, elle n'est pas affectée par les effets d'autres cartes, mais elle perd 500 DEF durant chaque Standby Phase.
  | de_text         = Einmal pro Kette, während eines Spielzugs, in dem dein Gegner 3 oder mehr Monster beschworen hat (Schnelleffekt): Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören und falls du dies tust, bleibt sie von Effekten anderer Karten unberührt, aber verliert während jeder Standby Phase 500 DEF.
  | it_text         = Una volta per Catena, durante un turno in cui il tuo avversario ha Evocato 3 o più mostri (Effetto Rapido): puoi Evocare Specialmente questa carta dalla tua mano e, se lo fai, essa è immune agli effetti delle altre carte, ma perde 500 DEF durante ogni Standby Phase.
  | pt_text         = Uma vez por Corrente, durante um turno em que seu oponente Invocou 3 ou mais monstros (Efeito Rápido): você pode Invocar este card por Invocação-Especial da sua mão e, se isso acontecer, ele não é afetado por outros efeitos de card, mas perde 500 de DEF durante cada Fase de Apoio.
  | es_text         = Una vez por Cadena, durante un turno en el que tu adversario Invocó 3 o más monstruos (Efecto Rápido): puedes Invocar esta carta de Modo Especial desde tu mano y, si lo haces, no es afectada por efectos de otras cartas, pero pierde 500 DEF durante cada Standby Phase.
  | ja_text         = ①：相手が３体以上のモンスターの召喚・反転召喚・特殊召喚に成功したターンに発動できる。このカードを手札から特殊召喚する。この効果で特殊召喚したこのカードは、他のカードの効果を受けず、お互いのスタンバイフェイズ毎に守備力が５００ダウンする。この効果は相手ターンでも発動できる。
  | ko_text         = ①: 상대가 3장 이상의 몬스터의 일반 소환 / 반전 소환 / 특수 소환에 성공한 턴에 발동할 수 있다. 이 카드를 패에서 특수 소환한다. 이 효과로 특수 소환한 이 카드는, 다른 카드의 효과를 받지 않으며, 서로의 스탠바이 페이즈마다 수비력을 500 내린다. 이 효과는 상대 턴에도 발동할 수 있다.
  | tc_text         = 对手成功召唤、反转召唤、特殊召唤3只或以上怪兽的回合可发动。从手牌特殊召唤此卡。此效果也可于对手回合发动。以此效果特殊召唤的此卡，不受此卡以外的卡牌效果影响，每次双方的准备阶段守备力下降500点。
