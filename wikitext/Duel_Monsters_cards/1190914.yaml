  | text                = 2+ [[monsters]], including an "[[Unchained Soul]]" monster<br />During your [[End Phase]]: You can [[target]] up to 2 [[Fiend]] monsters in your [[GY]] that were [[destroy]]ed this [[turn]]; [[Special Summon]] them, but for each one, as long as it remains [[face-up]] in your Monster Zone, you cannot Special Summon, except Fiend monsters. If this card on the [[field]] would be [[destroyed by battle]] or card effect, you can destroy 1 other face-up card on either [[field]] instead. You can only use each effect of "Unchained Firelord of Yama" [[once per turn]].
  | fr_text             = 2+ monstres (un monstre "Âme Désenchaînée" inclus)<br />Durant votre End Phase : vous pouvez cibler max. 2 monstres Démon dans votre Cimetière qui ont été détruits ce tour ; Invoquez-les Spécialement, mais pour chacun d'eux, tant qu'il reste face recto dans votre Zone Monstre, vous ne pouvez pas Invoquer Spécialement (monstres Démon exclus). Si cette carte sur le Terrain va être détruite au combat ou par un effet de carte, vous pouvez détruire 1 autre carte face recto sur l'un des Terrains à la place. Vous ne pouvez utiliser chaque effet de "Feu Désenchaîné du Seigneur de Yama" qu'une fois par tour.
  | de_text             = 2+ Monster, darunter ein „Losgekettete Seele“-Monster<br />Während deiner End Phase: Du kannst bis zu 2 Unterweltler-Monster in deinem Friedhof wählen, die in diesem Spielzug zerstört wurden; beschwöre sie als Spezialbeschwörung, aber für jedes, solange es offen in deiner Monsterzone verbleibt, kannst du keine Spezialbeschwörungen durchführen, außer von Unterweltler-Monstern. Falls diese Karte auf dem Spielfeld durch Kampf oder einen Karteneffekt zerstört würde, kannst du stattdessen 1 andere offene Karte auf einer beliebigen Spielfeldseite zerstören. Du kannst jeden Effekt von „Losgeketteter Feuerlord von Yama“ nur einmal pro Spielzug verwenden.
  | it_text             = 2+ mostri, compreso un mostro "Anima Svincolata"<br />Durante la tua End Phase: puoi scegliere come bersaglio fino a 2 mostri Demone nel tuo Cimitero che sono stati distrutti in questo turno; Evocali Specialmente, ma per ognuno, fino a quando rimane scoperto nella tua Zona Mostri, non puoi Evocare Specialmente, eccetto mostri Demone. Se questa carta sul Terreno sta per essere distrutta in battaglia o dall'effetto di una carta, puoi invece distruggere 1 altra carta scoperta su qualsiasi Terreno. Puoi utilizzare ogni effetto di "Signore di Fuoco Svincolato di Yama" una sola volta per turno.
  | pt_text             = 2+ monstros, incluindo um monstro "Alma Desacorrentada"<br />Durante sua Fase Final: você pode escolher até 2 monstros Demônio no seu Cemitério que foram destruídos neste turno; Invoque-os por Invocação-Especial, mas para cada um, enquanto ele permanecer com a face para cima em sua Zona de Monstros, você não pode Invocar por Invocação-Especial, exceto monstros Demônio. Se este card no campo seria destruído em batalha ou por um efeito de card, em vez disso, você pode destruir 1 outro card com a face para cima em qualquer campo. Você só pode usar cada efeito de "Senhor do Fogo Desacorrentado de Yama" uma vez por turno.
  | es_text             = 2+ monstruos, incluyendo un monstruo "Alma Desencadenada"<br />Durante tu End Phase: puedes seleccionar hasta 2 monstruos Demonio en tu Cementerio que fueran destruidos este turno; Invócalos de Modo Especial, pero por cada uno, mientras permanezca boca arriba en tu Zona de Monstruos, no puedes Invocar de Modo Especial, excepto monstruos Demonio. Si esta carta en el Campo fuera a ser destruida en batalla o por el efecto de una carta, puedes destruir otra carta boca arriba en cualquier Campo en su lugar. Sólo puedes usar cada efecto de "Señor del Fuego Desencadenado de Yama" una vez por turno.
  | ja_text             = 「破械神」モンスターを含むモンスター２体以上<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分エンドフェイズに、このターンに破壊された自分の墓地の悪魔族モンスターを２体まで対象として発動できる。そのモンスターを特殊召喚する。この効果で特殊召喚したモンスターが自分フィールドに表側表示で存在する限り、自分は悪魔族モンスターしか特殊召喚できない。②：フィールドのこのカードが戦闘・効果で破壊される場合、代わりに自分か相手のフィールドの表側表示カード１枚を破壊できる。
  | ko_text             = "언체인드소울" 몬스터를 포함하는 몬스터 2장 이상<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 엔드 페이즈에, 이 턴에 파괴된 자신 묘지의 악마족 몬스터를 2장까지 대상으로 하고 발동할 수 있다. 그 몬스터를 특수 소환한다. 이 효과로 특수 소환한 몬스터가 자신 필드에 앞면 표시로 존재하는 한, 자신은 악마족 몬스터밖에 특수 소환할 수 없다. ②: 필드의 이 카드가 전투 / 효과로 파괴될 경우, 대신에 자신이나 상대의 필드의 앞면 표시 카드 1장을 파괴할 수 있다.
  | sc_text             = 包含“破械神”怪兽在内的怪兽2只以上<br />此卡名的①②效果1回合仅可各使用1次。①：在自己的结束阶段，以在此回合被破坏的、自己墓地的最多2只恶魔族怪兽为对象可以发动。将该怪兽特殊召唤。只要以此效果特殊召唤的怪兽以表侧表示存在于自己场上，自己仅可特殊召唤恶魔族怪兽。②：场上的此卡将被战斗・效果破坏的情况下，作为代替可将自己或对手场上的1张表侧表示卡破坏。
