  | sc_text               = 此卡名的①②效果1回合仅可各使用1次。①：从牌组将除“愚蠢的盗墓者”以外的、1张记载有“时间黑魔术师”卡名的卡送至墓地。然后，可将自己或对手墓地的1只怪兽特殊召唤至自己场上。②：将墓地的此卡除外可以发动。将以下的任意1张卡放置在自己场上。<br />●除“愚蠢的盗墓者”以外的、记载有“时间黑魔术师”卡名的自己墓地的魔法・陷阱卡<br />●对手墓地的魔法・陷阱卡
