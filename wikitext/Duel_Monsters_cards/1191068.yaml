  | text                  = [[Send]] 1 card that mentions "[[Dark Time Wizard]]" from your [[Main Deck|Deck]] to the [[GY]], except "Foolish Graverobber", then you can [[Special Summon]] 1 [[monster]] from either GY to your [[field]]. You can [[banish]] this card from your GY; [[Set]] 1 of the following cards to your field.<br />● [[Spell]]/[[Trap]] that mentions "Dark Time Wizard" in your GY, except "Foolish Graverobber"<br />● Spell/Trap in your opponent's GY<br />You can only use each effect of "Foolish Graverobber" [[once per turn]].
  | fr_text               = Envoyez 1 carte qui mentionne "Magicien du Temps des Ténèbres" ("Profanateur de Tombes Inutile" exclu) depuis votre Deck au Cimetière, puis vous pouvez Invoquer Spécialement 1 monstre depuis l'un des Cimetières sur votre Terrain. Vous pouvez bannir cette carte depuis votre Cimetière ; Posez 1 des cartes suivantes sur votre Terrain.<br />● Magie/Piège qui mentionne "Magicien du Temps des Ténèbres" ("Profanateur de Tombes Inutile" exclu) dans votre Cimetière<br />● Magie/Piège dans le Cimetière de votre adversaire<br />Vous ne pouvez utiliser chaque effet de "Profanateur de Tombes Inutile" qu'une fois par tour.
  | de_text               = Lege 1 Karte, die „Dunkler Zeitzauberer“ erwähnt, von deinem Deck auf den Friedhof, außer „Törichter Grabräuber“, dann kannst du 1 Monster als Spezialbeschwörung von einem beliebigen Friedhof auf deine Spielfeldseite beschwören. Du kannst diese Karte von deinem Friedhof verbannen; setze 1 der folgenden Karten auf deine Spielfeldseite.<br />● Zauber/Falle, der oder die „Dunkler Zeitzauberer“ erwähnt, in deinem Friedhof, außer „Törichter Grabräuber“<br />● Zauber/Falle im Friedhof deines Gegners<br />Du kannst jeden Effekt von „Törichter Grabräuber“ nur einmal pro Spielzug verwenden.
  | it_text               = Manda 1 carta che menziona "Stregone del Tempo Oscuro" dal tuo Deck al Cimitero, eccetto "Predatore delle Tombe Sciocco", poi puoi Evocare Specialmente 1 mostro da qualsiasi Cimitero sul tuo Terreno. Puoi bandire questa carta dal tuo Cimitero; Posiziona 1 delle seguenti carte sul tuo Terreno.<br />● Magia/Trappola che menziona "Stregone del Tempo Oscuro" nel tuo Cimitero, eccetto "Predatore delle Tombe Sciocco"<br />● Magia/Trappola nel Cimitero del tuo avversario<br />Puoi utilizzare ogni effetto di "Predatore delle Tombe Sciocco" una sola volta per turno.
  | pt_text               = Envie 1 card que mencione "Mago do Tempo Negro" do seu Deck para o Cemitério, exceto "Ladrão de Túmulos Tolo" e, depois, você pode Invocar por Invocação-Especial 1 monstro de qualquer Cemitério no seu campo. Você pode banir este card do seu Cemitério; Baixe 1 dos seguintes cards no seu campo.<br />● Magia/Armadilha que mencione "Mago do Tempo Negro" no seu Cemitério, exceto "Ladrão de Túmulos Tolo"<br />● Magia/Armadilha no Cemitério do seu oponente<br />Você só pode usar cada efeito de "Ladrão de Túmulos Tolo" uma vez por turno.
  | es_text               = Manda al Cementerio 1 carta que mencione "Mago del Tiempo Oscuro" en tu Deck, excepto "Ladrón de Tumbas Insensato", y después puedes Invocar de Modo Especial 1 monstruo desde cualquier Cementerio a tu Campo. Puedes desterrar esta carta en tu Cementerio; Coloca 1 de las siguientes cartas a tu Campo.<br />● Mágica/Trampa en tu Cementerio que mencione "Mago del Tiempo Oscuro", excepto "Ladrón de Tumbas Insensato"<br />● Mágica/Trampa en el Cementerio de tu adversario<br />Sólo puedes usar cada efecto de "Ladrón de Tumbas Insensato" una vez por turno.
  | ja_text               = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：「おろかな墓荒らし」を除く、「時の黒魔術師」のカード名が記されたカード１枚をデッキから墓地へ送る。その後、自分か相手の墓地のモンスター１体を自分フィールドに特殊召喚できる。②：墓地のこのカードを除外して発動できる。以下のいずれかのカード１枚を自分フィールドにセットする。<br />●「おろかな墓荒らし」を除く、「時の黒魔術師」のカード名が記された自分の墓地の魔法・罠カード<br />●相手の墓地の魔法・罠カード
