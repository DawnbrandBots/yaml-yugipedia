  | text                 = Choose 2 "[[Angelechy]]" [[monster]]s in your [[Extra Deck]], with different names than the cards in your [[Spell & Trap Zone]], [[Special Summon]] 1 of them in your opponent's [[Main Monster Zone]], and place the other in your Spell & Trap Zone as a [[face-up]] [[Continuous Spell]]. You can [[banish]] this card from your [[GY]]; [[shuffle]] up to 5 "Angelechy" cards into the [[Main Deck|Deck]] from your GY and/or banishment, except "Angelechy Opposition". You cannot Special Summon from the Extra Deck the turn you [[activate]] this card, except [[LIGHT]] or [[DARK]] [[Synchro Monster]]s. You can only activate 1 "Angelechy Opposition" [[once per turn|per turn]].
  | fr_text              = Choisissez 2 monstres "Angetélité" dans votre Extra Deck de noms différents des cartes dans votre Zone Magie & Piège, Invoquez-en Spécialement 1 dans la Zone Monstre Main de votre adversaire, et placez l'autre dans votre Zone Magie & Piège comme Magie Continue face recto. Vous pouvez bannir cette carte depuis votre Cimetière ; mélangez max. 5 cartes "Angetélité" ("Opposition Angetélité" exclu) dans le Deck depuis votre Cimetière et/ou bannissement. Vous ne pouvez pas Invoquer Spécialement (Monstres Synchro LUMIÈRE ou TÉNÈBRES exclus) depuis l'Extra Deck le tour où vous activez cette carte. Vous ne pouvez activer qu'1 "Opposition Angetélité" par tour.
  | de_text              = Bestimme 2 „Engelechy“-Monster mit unterschiedlichen Namen als die Karten in deiner Zauber- & Fallenzone in deinem Extra Deck, beschwöre 1 von ihnen als Spezialbeschwörung in die Main-Monsterzone deines Gegners und lege das andere als offenen Permanenten Zauber in deine Zauber- & Fallenzone. Du kannst diese Karte von deinem Friedhof verbannen; mische bis zu 5 „Engelechy“-Karten von deinem Friedhof und/oder deinen verbannten Karten ins Deck, außer „Engelechy-Widerstand“. Du kannst in dem Spielzug, in dem du diese Karte aktivierst, keine Spezialbeschwörungen vom Extra Deck durchführen, außer von LICHT und FINSTERNIS Synchromonstern. Du kannst nur 1 „Engelechy-Widerstand“ pro Spielzug aktivieren.
  | it_text              = Seleziona 2 mostri "Angelechy" nel tuo Extra Deck con nomi diversi dalle carte nella tua Zona Magie & Trappole, Evoca Specialmente 1 di essi nella Zona Mostri Main del tuo avversario e metti l'altro nella tua Zona Magie & Trappole come una Magia Continua scoperta. Puoi bandire questa carta dal tuo Cimitero; mischia nel Deck fino a 5 carte "Angelechy" dal tuo Cimitero e/o carte bandite, eccetto "Opposizione Angelechy". Non puoi Evocare Specialmente dall'Extra Deck nel turno in cui attivi questa carta, eccetto Mostri Synchro LUCE o OSCURITÀ. Puoi attivare solo 1 "Opposizione Angelechy" per turno.
  | pt_text              = Selecione 2 monstros "Anjoléquia" no seu Deck Adicional, com nomes diferentes que o dos cards na sua Zona de Magias & Armadilhas, Invoque 1 deles por Invocação-Especial na Zona de Monstros Principal do seu oponente, e coloque o outro na sua Zona de Magias & Armadilhas como uma Magia Contínua com a face para cima. Você pode banir este card do seu Cemitério; embaralhe no Deck até 5 cards "Anjoléquia" do seu Cemitério e/ou banimento, exceto "Oposição de Anjoléquia". Você não pode Invocar por Invocação-Especial do Deck Adicional no turno em que ativar este card, exceto Monstros Sincro de LUZ ou de TREVAS. Você só pode ativar 1 "Oposição de Anjoléquia" por turno.
  | es_text              = Elige 2 monstruos "Angelequia" en tu Deck Extra, con nombres diferentes a los de las cartas en tu Zona de Magia y Trampas, Invoca de Modo Especial 1 de ellos en la Zona de Monstruos Principal de tu adversario, y pon el otro en tu Zona de Magia y Trampas como una Mágica Continua boca arriba. Puedes desterrar esta carta en tu Cementerio; baraja al Deck hasta 5 cartas "Angelequia" en tu Cementerio y/o destierro, excepto "Oposición Angelequia". No puedes Invocar de Modo Especial desde el Deck Extra el turno en el que activas esta carta, excepto Monstruos de Sincronía de LUZ u OSCURIDAD. Sólo puedes activar 1 "Oposición Angelequia" por turno.
