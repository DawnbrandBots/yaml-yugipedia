  | text            = The [[equip]]ped [[monster]]'s [[effect]]s are [[negate]]d. You can only use the following effect of "Orichalcos Sword of Sealing" [[once per turn]]. If you [[control]] a card in your [[Field Zone]]: You can [[target]] 1 [[Effect Monster]] you control; that Effect Monster gains this effect until the end of your opponent's [[turn]].<br />● Once per turn ([[Quick Effect]]): You can [[send]] 1 card from your [[hand]] to the [[GY]], then target 1 [[face-up]] card on the field; [[destroy]] that target.
  | fr_text         = Les effets du monstre équipé sont annulés. Vous ne pouvez utiliser l'effet suivant de "Épée Scelleuse d'Orichalque" qu'une fois par tour. Si vous contrôlez une carte dans votre Zone Terrain : vous pouvez cibler 1 Monstre à Effet que vous contrôlez ; jusqu'à la fin du tour de votre adversaire, le Monstre à Effet gagne cet effet.<br />● Une fois par tour (Effet Rapide) : vous pouvez envoyer 1 carte depuis votre main au Cimetière, puis ciblez 1 carte face recto sur le Terrain ; détruisez la cible.
  | de_text         = Die Effekte des ausgerüsteten Monsters werden annulliert. Du kannst den folgenden Effekt von „Orichalcos-Schwert des Versiegelns“ nur einmal pro Spielzug verwenden. Falls du eine Karte in deiner Spielfeldzone kontrollierst: Du kannst 1 Effektmonster wählen, das du kontrollierst; jenes Effektmonster erhält bis zum Ende des Spielzugs deines Gegners diesen Effekt.<br />● Einmal pro Spielzug (Schnelleffekt): Du kannst 1 Karte von deiner Hand auf den Friedhof legen und dann 1 offene Karte auf dem Spielfeld wählen; zerstöre jenes gewählte Ziel.
  | it_text         = Gli effetti del mostro equipaggiato sono annullati. Puoi utilizzare il seguente effetto di "Spada Sigillante di Orichalcos" una sola volta per turno. Se controlli una carta nella tua Zona Terreno: puoi scegliere come bersaglio 1 Mostro con Effetto che controlli; quel Mostro con Effetto guadagna questo effetto fino alla fine del turno del tuo avversario.<br />● Una volta per turno (Effetto Rapido): puoi mandare 1 carta dalla tua mano al Cimitero, poi scegliere come bersaglio 1 carta scoperta sul Terreno; distruggi quel bersaglio.
  | pt_text         = Os efeitos do monstro equipado são negados. Você só pode usar o seguinte efeito de "Espada de Selamento de Orichalcos" uma vez por turno. Se você controlar um card na sua Zona do Campo: você pode escolher 1 Monstro de Efeito que você controla; esse Monstro de Efeito ganha este efeito até o final do turno do seu oponente.<br />● Uma vez por turno (Efeito Rápido): você pode enviar 1 card da sua mão para o Cemitério e, depois, escolha 1 card com a face para cima no campo; destrua o alvo.
  | es_text         = Los efectos del monstruo equipado son negados. Sólo puedes usar el siguiente efecto de "Espada de Sellado de Oricalcos" una vez por turno. Si controlas una carta en tu Zona del Campo: puedes seleccionar 1 Monstruo de Efecto que controles; ese Monstruo de Efecto gana este efecto hasta el final del turno de tu adversario.<br />● Una vez por turno (Efecto Rápido): puedes mandar al Cementerio 1 carta en tu mano, y después seleccionar 1 carta boca arriba en el Campo; destruye ese objetivo.
  | ja_text         = このカード名の②の効果は１ターンに１度しか使用できない。①：装備モンスターの効果は無効化される。②：自分のフィールドゾーンにカードが存在する場合、自分フィールドの効果モンスター１体を対象として発動できる。その効果モンスターは相手ターン終了時まで以下の効果を得る。●自分・相手ターンに１度、手札を１枚墓地へ送り、フィールドの表側表示カード１枚を対象として発動できる。その表側表示カードを破壊する。
  | ko_text         = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 장착 몬스터의 효과는 무효화된다. ②: 자신의 필드 존에 카드가 존재할 경우, 자신 필드의 효과 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 효과 몬스터는 상대 턴 종료시까지 이하의 효과를 얻는다. ●자신 / 상대 턴에 1번, 패를 1장 묘지로 보내고, 필드의 앞면 표시 카드 1장을 대상으로 하여 발동할 수 있다. 그 앞면 표시 카드를 파괴한다.
  | sc_text         = 此卡名的②效果1回合仅可使用1次。①：装备怪兽的效果无效化。②：自己的场地区域存在卡的情况下，以自己场上的1只效果怪兽为对象可以发动。该效果怪兽直至对手回合结束时为止获得以下效果。<br />●在每个自己・对手回合中1次，将1张手牌送至墓地，以场上的1张表侧表示卡为对象可以发动。将该表侧表示卡破坏。
