  | text                  = 1 [[Fusion Monster]] + 1 [[face-up]] [[monster]] on the [[field]]<br />(This card is always treated as an "[[Elemental HERO]]" card.)<br />If this card is [[Special Summon]]ed from the [[Extra Deck]]: You can [[shuffle]] 5 monsters from your [[GY]] into the [[Deck]], then [[draw a card|draw]] 2 cards, and if you do, this card gains 1000 [[ATK]]. You can only use this [[effect]] of "Favorite HERO Shining Flare Wingman" [[once per turn]]. If this card [[destroy]]s a monster by [[battle]]: Inflict [[effect damage|damage]] to your opponent equal to that monster's [[original ATK]].
  | fr_text               = 1 Monstre Fusion + 1 monstre face recto sur le Terrain<br />(Cette carte est toujours traitée comme carte "HÉROS Élémentaire".)<br />Si cette carte est Invoquée Spécialement depuis l'Extra Deck : vous pouvez mélanger 5 monstres depuis votre Cimetière dans le Deck, puis piochez 2 cartes, et si vous le faites, cette carte gagne 1000 ATK. Vous ne pouvez utiliser cet effet de "Homme-Oiseau à l'Éclat Lumineux, HÉROS Favori" qu'une fois par tour. Si cette carte détruit un monstre au combat : infligez des dommages à votre adversaire égaux à l'ATK d'origine du monstre.
  | de_text               = 1 Fusionsmonster + 1 offenes Monster auf dem Spielfeld<br />(Diese Karte wird immer als „Elementar-HELD“-Karte behandelt.)<br />Falls diese Karte als Spezialbeschwörung vom Extra Deck beschworen wird: Du kannst 5 Monster von deinem Friedhof ins Deck mischen, dann ziehe 2 Karten und falls du dies tust, erhält diese Karte 1000 ATK. Du kannst diesen Effekt von „Lieblings-HELD Glänzender Flügelmann“ nur einmal pro Spielzug verwenden. Falls diese Karte ein Monster durch Kampf zerstört: Füge deinem Gegner Schaden in Höhe der Grund-ATK jenes Monsters zu.
  | it_text               = 1 Mostro Fusione + 1 mostro scoperto sul Terreno<br />(Questa carta viene sempre considerata come una carta "EROE Elementale".)<br />Se questa carta viene Evocata Specialmente dall'Extra Deck: puoi mischiare 5 mostri dal tuo Cimitero nel Deck, poi pescare 2 carte e, se lo fai, questa carta guadagna 1000 ATK. Puoi utilizzare questo effetto di "Uomo Alato della Fiammata Lucente EROE Preferito" una sola volta per turno. Se questa carta distrugge un mostro in battaglia: infliggi al tuo avversario danno pari all'ATK originale di quel mostro.
  | pt_text               = 1 Monstro de Fusão + 1 monstro com a face para cima no campo<br />(Este card deve ser sempre considerado como um card "HERÓI do Elemento".)<br />Se este card for Invocado por Invocação-Especial do Deck Adicional: você pode embaralhar no Deck 5 monstros do seu Cemitério e, depois, compre 2 cards e, se isso acontecer, este card ganha 1000 de ATK. Você só pode usar este efeito de "Homem-Alado da Chama Brilhante, o HERÓI Favorito" uma vez por turno. Se este card destruir um monstro em batalha: cause dano ao seu oponente igual ao ATK original desse monstro.
  | es_text               = 1 Monstruo de Fusión + 1 monstruo boca arriba en el Campo<br />(Esta carta se trata siempre como una carta "HÉROE Elemental").<br />Si esta carta es Invocada de Modo Especial desde el Deck Extra: puedes barajar al Deck 5 monstruos en tu Cementerio, y después roba 2 cartas y, si lo haces, esta carta gana 1000 ATK. Sólo puedes usar este efecto de "HÉROE Favorito Shining Flare Wingman" una vez por turno. Si esta carta destruye un monstruo en batalla: inflige daño a tu adversario igual al ATK original de ese monstruo.
  | ja_text               = 融合モンスター＋フィールドの表側表示モンスター<br />このカード名はルール上「Ｅ・ＨＥＲＯ」カードとしても扱う。このカード名の①の効果は１ターンに１度しか使用できない。①：このカードがＥＸデッキから特殊召喚した場合に発動できる。自分の墓地からモンスター５体をデッキに戻す。その後、自分は２枚ドローし、このカードの攻撃力は１０００アップする。②：このカードが戦闘でモンスターを破壊した場合に発動する。そのモンスターの元々の攻撃力分のダメージを相手に与える。
  | ko_text               = 융합 몬스터 ＋ 필드의 앞면 표시 몬스터<br />이 카드명은 룰상 "엘리멘틀 히어로" 카드로도 취급한다. 이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 엑스트라 덱에서 특수 소환했을 경우에 발동할 수 있다. 자신 묘지에서 몬스터 5장을 덱으로 되돌린다. 그 후, 자신은 2장 드로우하고, 이 카드의 공격력은 1000 올린다. ②: 이 카드가 전투로 몬스터를 파괴했을 경우에 발동한다. 그 몬스터의 원래 공격력만큼의 데미지를 상대에게 준다.
  | sc_text               = 融合怪兽＋场上表侧表示的怪兽<br />此卡名在规则上也视为“元素－英雄”卡。此卡名的①效果1回合仅可使用1次。①：此卡从额外牌组特殊召唤的情况下可以发动。从自己墓地将5只怪兽放回牌组。然后，自己抽2张，此卡的攻击力上升1000。②：此卡战斗破坏怪兽的情况下发动。给予对手相当于该怪兽的原本攻击力数值的伤害。
