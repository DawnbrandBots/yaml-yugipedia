  | text                  = 1 [[Tuner monster|Tuner]] + 1+ non-Tuners<br />When your opponent [[activate]]s a card or [[effect]] in [[response]] to your card or effect activation ([[Quick Effect]]): You can [[Tribute]] this card; [[negate]] the activation of your opponent's card or effect, and if you do, [[destroy]] that card. If a [[monster]](s) in your [[possession]] was Tributed this [[turn]] (Quick Effect): You can [[banish]] this card from your [[GY]]; [[Special Summon]] 1 "[[Stardust (archetype)|Stardust]]" [[Synchro Monster]] from your [[Extra Deck]]. You can only use each effect of "Stardust Dragon - Victim Sanctuary" [[once per turn]], and cannot activate more than 1 in the same [[Chain]].
  | fr_text               = 1 Syntoniseur + 1+ non-Syntoniseur<br />Lorsque votre adversaire active une carte ou un effet en réponse à l'activation de votre carte ou effet (Effet Rapide) : vous pouvez Sacrifier cette carte ; annulez l'activation de la carte ou effet de votre adversaire, et si vous le faites, détruisez la carte. Si un ou plusieurs monstres en votre possession ont été Sacrifiés ce tour (Effet Rapide) : vous pouvez bannir cette carte depuis votre Cimetière ; Invoquez Spécialement 1 Monstre Synchro "Poussière d'Étoile" depuis votre Extra Deck. Vous ne pouvez utiliser chaque effet de "Dragon Poussière d'Étoile - Sanctuaire de Victimes" qu'une fois par tour, et ne pouvez en activer que max. 1 dans la même Chaîne.
  | de_text               = 1 Empfänger + 1+ Nicht-Empfänger<br />Wenn dein Gegner eine Karte oder einen Effekt als Reaktion auf die Aktivierung deiner Karte oder deines Effekts aktiviert (Schnelleffekt): Du kannst diese Karte als Tribut anbieten; annulliere die Aktivierung der Karte oder des Effekts deines Gegners und falls du dies tust, zerstöre jene Karte. Falls ein oder mehr Monster, die dir gehört haben, in diesem Spielzug als Tribut angeboten wurden (Schnelleffekt): Du kannst diese Karte von deinem Friedhof verbannen; beschwöre 1 „Sternenstaub“-Synchromonster als Spezialbeschwörung von deinem Extra Deck. Du kannst jeden Effekt von „Sternenstaubdrache - Opferzuflucht“ nur einmal pro Spielzug verwenden und du kannst nicht mehr als 1 in derselben Kette aktivieren.
  | it_text               = 1 Tuner + 1+ non-Tuner<br />Quando il tuo avversario attiva una carta o un effetto in risposta all'attivazione di una tua carta o effetto (Effetto Rapido): puoi offrire come Tributo questa carta; annulla l'attivazione della carta o effetto del tuo avversario e, se lo fai, distruggi quella carta. Se uno o più mostri sotto il tuo comando sono stati offerti come Tributo in questo turno (Effetto Rapido): puoi bandire questa carta dal tuo Cimitero; Evoca Specialmente 1 Mostro Synchro "Polvere di Stelle" dal tuo Extra Deck. Puoi utilizzare ogni effetto di "Drago Polvere di Stelle - Vittima Sacrificale" una sola volta per turno, e non puoi attivarne più di 1 nella stessa Catena.
  | pt_text               = 1 Regulador + 1+ não-Reguladores<br />Quando seu oponente ativar um card ou efeito em resposta à ativação de um dos seus cards ou efeitos (Efeito Rápido): você pode oferecer este card como Tributo; negue a ativação do card ou efeito do seu oponente e, se isso acontecer, destrua esse card. Se um ou mais monstros em sua posse foram oferecidos como Tributo neste turno (Efeito Rápido): você pode banir este card do seu Cemitério; Invoque por Invocação-Especial 1 Monstro Sincro "Poeira Estelar" do seu Deck Adicional. Você só pode usar cada efeito de "Dragão da Poeira Estelar - Santuário das Vítimas" uma vez por turno e não pode ativar mais que 1 na mesma Corrente.
  | es_text               = 1 Cantante + 1+ no Cantantes<br />Cuando tu adversario active una carta o efecto en respuesta a tu activación de una carta o efecto (Efecto Rápido): puedes Sacrificar esta carta; niega la activación de la carta o efecto de tu adversario y, si lo haces, destruye esa carta. Si uno o más monstruos en tu posesión fueron Sacrificados este turno (Efecto Rápido): puedes desterrar esta carta en tu Cementerio; Invoca de Modo Especial 1 Monstruo de Sincronía "Polvo de Estrellas" desde tu Deck Extra. Sólo puedes usar cada efecto de "Dragón de Polvo de Estrellas - Santuario de Víctimas" una vez por turno, y no puedes activar más de 1 en la misma Cadena.
  | ja_text               = チューナー＋チューナー以外のモンスター１体以上<br />このカード名の①②の効果は、それぞれ１ターンに１度しか使用できず、同一チェーン上では発動できない。①：自分の効果の発動にチェーンして、相手が魔法・罠・モンスターの効果を発動した時、このカードをリリースして発動できる。その相手の効果の発動を無効にし破壊する。②：自分のモンスターがリリースされた自分・相手ターンに、墓地のこのカードを除外して発動できる。ＥＸデッキから「スターダスト」Ｓモンスター１体を特殊召喚する。
  | ko_text               = 튜너 ＋ 튜너 이외의 몬스터 1장 이상<br />이 카드명의 ①②의 효과는, 각각 1턴에 1번밖에 사용할 수 없으며, 동일한 체인 위에서는 발동할 수 없다. ①: 자신의 효과의 발동에 체인하여, 상대가 마법 / 함정 / 몬스터의 효과를 발동했을 때, 이 카드를 릴리스하고 발동할 수 있다. 그 상대의 효과의 발동을 무효로 하고 파괴한다. ②: 자신의 몬스터가 릴리스된 자신 / 상대 턴에, 묘지의 이 카드를 제외하고 발동할 수 있다. 엑스트라 덱에서 "스타더스트" 싱크로 몬스터 1장을 특수 소환한다.
  | sc_text               = 协调＋协调以外的怪兽1只以上<br />此卡名的①②效果1回合仅可各使用1次，不可在同一连锁上发动。①：应对自己的效果的发动，对手连锁发动魔法・陷阱・怪兽的效果时，解放此卡可以发动。将该对手的效果的发动无效并破坏。②：在自己的怪兽被解放的自己・对手回合中，将墓地的此卡除外可以发动。从额外牌组将1只“星尘”同步怪兽特殊召唤。
