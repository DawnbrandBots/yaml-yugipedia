  | text                = This card's name becomes "[[Toon World]]" while in the [[Field Zone]]. [[Once per turn]]: You can [[Add a card|add]] 1 "[[Toon]]" card, or 1 card that mentions a "Toon" card's name, from your [[Main Deck|Deck]] to your [[hand]]. You can only use this effect of "Toon World the Perfect World" thrice per turn. Before resolving another activated card or [[effect]], you can [[banish]] 1 [[Toon monster]] you [[control]] until immediately after that card/effect [[resolve]]s, also you cannot [[banish]] monsters with that same original name with this effect of "Toon World the Perfect World" for the rest of this turn.
