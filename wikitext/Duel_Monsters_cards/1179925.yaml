  | ja_text             = このカード名の②の効果は１ターンに３度まで使用できる。①：このカードはフィールドゾーンに存在する限り、カード名を「トゥーン・ワールド」として扱う。②：１ターンに１度、自分メインフェイズに発動できる。「トゥーン」カードまたはそのカード名が記されたカード１枚をデッキから手札に加える。③：他のカードが発動した効果が適用される際に、自分フィールドのトゥーンモンスター１体をその効果処理後まで除外できる（このターン、このカード名のこの効果で元々のカード名が同じモンスターを除外できない）。
  | ko_text             = 이 카드명의 ②의 효과는 1턴에 3번까지 사용할 수 있다. ①: 이 카드는 필드 존에 존재하는 한, 카드명을 "툰 월드"로 취급한다. ②: 1턴에 1번, 자신 메인 페이즈에 발동할 수 있다. "툰" 카드 또는 그 카드명이 쓰여진 카드 1장을 덱에서 패에 넣는다. ③: 다른 카드가 발동한 효과가 적용될 시기에, 자신 필드의 툰 몬스터 1장을 그 효과 처리 후까지 제외할 수 있다(이 턴에, 이 카드명의 이 효과로 원래의 카드명이 같은 몬스터를 제외할 수 없다).
  | sc_text             = 此卡名的②效果1回合最多可使用3次。①：此卡只要存在于场地区域，卡名视为“卡通世界”。②：1回合1次，在自己的主要阶段可以发动。从牌组将1张“卡通”卡或记载有该卡名的卡加入手牌。③：其他卡发动的效果将被适用之际，可将自己场上的1只卡通怪兽直至该效果处理后为止除外（此回合，不可以此卡名的此效果除外原本卡名相同的怪兽）。
