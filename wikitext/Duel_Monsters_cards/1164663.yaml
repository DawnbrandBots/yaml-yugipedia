  | text                  = During your [[Main Phase]]: You can [[Special Summon]] 1 [[Fiend]] [[monster]] from your [[hand]]. If you have no cards in your hand ([[Quick Effect]]): You can [[banish]] this card from your [[GY]]; your opponent chooses 1 of these [[effect]]s for you to apply.<br />● [[Reveal]] the top card of your [[Deck]], and if it is a monster, your opponent takes any [[effect damage]] you would have taken this [[turn]] instead. If it isn't, you take 4000 damage.<br />● You take no effect damage this turn.<br />You can only use each effect of "Infernity Doom Slinger" [[once per turn]].
  | fr_text               = Durant votre Main Phase : vous pouvez Invoquer Spécialement 1 monstre Démon depuis votre main. Si vous n'avez aucune carte dans votre main (Effet Rapide) : vous pouvez bannir cette carte depuis votre Cimetière ; votre adversaire choisit 1 de ces effets pour vous à appliquer.<br />● Révélez la carte du dessus de votre Deck, et si c'est un monstre, votre adversaire reçoit les dommages d'effet que vous auriez dû recevoir ce tour à la place. Si ce n'en est pas un, vous recevez 4000 points de dommages.<br />● Ce tour, vous ne recevez aucun dommage d'effet.<br />Vous ne pouvez utiliser chaque effet de "Tireur d'Élite de la Catastrophe Enfernité" qu'une fois par tour.
  | de_text               = Während deiner Main Phase: Du kannst 1 Unterweltler-Monster als Spezialbeschwörung von deiner Hand beschwören. Falls du keine Karten in deiner Hand hast (Schnelleffekt): Du kannst diese Karte von deinem Friedhof verbannen; dein Gegner bestimmt 1 dieser Effekte, den du ausführst.<br />● Zeige die oberste Karte deines Decks vor und falls es ein Monster ist, erhält in diesem Spielzug den Effektschaden, den du erhalten hättest, stattdessen dein Gegner. Falls nicht, erhältst du 4000 Schaden.<br />● Du erhältst in diesem Spielzug keinen Effektschaden.<br />Du kannst jeden Effekt von „Ewig infernaler Verdammnisschütze“ nur einmal pro Spielzug verwenden.
  | it_text               = Durante la tua Main Phase: puoi Evocare Specialmente 1 mostro Demone dalla tua mano. Se non hai carte nella tua mano (Effetto Rapido): puoi bandire questa carta dal tuo Cimitero; il tuo avversario seleziona 1 di questi effetti da farti applicare.<br />● Rivela la prima carta del tuo Deck e, se è un mostro, il tuo avversario subisce invece qualsiasi danno da effetto che avresti subito tu in questo turno. Se non lo è, tu subisci 4000 danni.<br />● Non subisci danno da effetto in questo turno.<br />Puoi utilizzare ogni effetto di "Pistolero Dannato Demoneterno" una sola volta per turno.
  | pt_text               = Durante sua Fase Principal: você pode Invocar por Invocação-Especial 1 monstro Demônio da sua mão. Se você não tiver cards na sua mão (Efeito Rápido): você pode banir este card do seu Cemitério; seu oponente seleciona 1 desses efeitos para que você aplique.<br />● Revele o card do topo do seu Deck e, se for um monstro, seu oponente sofre qualquer dano de efeito que você teria sofrido neste turno, em vez de você. Se não for, você sofre 4000 de dano.<br />● Você não sofre dano de efeito neste turno.<br />Você só pode usar cada efeito de "Pistoleiro da Condenação Inférnico" uma vez por turno.
  | es_text               = Durante tu Main Phase: puedes Invocar de Modo Especial 1 monstruo Demonio desde tu mano. Si no tienes cartas en tu mano (Efecto Rápido): puedes desterrar esta carta en tu Cementerio; tu adversario elige 1 de estos efectos para que lo apliques.<br />● Muestra la carta de la parte superior de tu Deck y, si es un monstruo, tu adversario recibe cualquier daño de efecto que tú hubieras recibido este turno en tu lugar. Si no lo es, recibes 4000 puntos de daño.<br />● No recibes daño de efecto este turno.<br />Sólo puedes usar cada efecto de "Tirador Inférnico de la Perdición" una vez por turno.
  | ja_text               = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。手札から悪魔族モンスター１体を特殊召喚する。②：自分・相手ターンに、自分の手札が０枚の場合、墓地のこのカードを除外して発動できる。相手は以下から１つを選び、自分はそれを適用する。●自分のデッキの一番上のカードをお互いに確認し、モンスターだった場合、このターン、自分が受ける効果ダメージは代わりに相手が受ける。違った場合、自分は４０００ダメージを受ける。●このターン、自分が受ける効果ダメージは０になる。
  | ko_text               = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 메인 페이즈에 발동할 수 있다. 패에서 악마족 몬스터 1장을 특수 소환한다. ②: 자신 / 상대 턴에, 자신의 패가 0장일 경우, 묘지의 이 카드를 제외하고 발동할 수 있다. 상대는 이하에서 1개를 고르고, 자신은 그것을 적용한다. ●자신의 덱 맨 위의 카드를 서로 확인하고, 몬스터였을 경우, 이 턴에, 자신이 받는 효과 데미지는 대신에 상대가 받는다. 다를 경우, 자신은 4000 데미지를 받는다. ●이 턴에, 자신이 받는 효과 데미지는 0 이 된다.
  | sc_text               = 此卡名的①②效果1回合仅可各使用1次。①：在自己的主要阶段可以发动。从手牌将1只恶魔族怪兽特殊召唤。②：在自己・对手回合中，自己手牌为0张的情况下，将墓地的此卡除外可以发动。对手从以下挑选1个，自己适用其效果。●双方确认自己牌组最上面的卡，是怪兽的情况下，此回合，自己受到的效果伤害由对手代为承受。不是的情况下，自己受到4000伤害。●此回合，自己所受到的效果伤害变为0。
