  | text            = Choose 1 [[monster]] in a [[column]] with cards in all its zones, and destroy as many of those cards as possible, except this card, then each player [[Draw a card|draws]] 1 card. You can [[banish]] this card from your [[GY]], then [[activate]] 1 of these [[effect]]s;<br />● Destroy 5 monsters in your [[Main Monster Zone]], or 5 cards in your [[Spell & Trap Zone]], then draw 2 cards.<br />● Destroy 5 monsters in your opponent's Main Monster Zone, or 5 cards in their Spell & Trap Zone, then your opponent draws 2 cards.
  | fr_text         = Choisissez 1 monstre dans une colonne avec des cartes dans toutes ses zones, et détruisez autant de ces cartes que possible (cette carte exclue), puis chaque joueur pioche 1 carte. Vous pouvez bannir cette carte depuis votre Cimetière, puis activez 1 de ces effets ;<br />● Détruisez 5 monstres dans votre Zone Monstre Main, ou 5 cartes dans votre Zone Magie & Piège, puis piochez 2 cartes.<br />● Détruisez 5 monstres dans la Zone Monstre Main de votre adversaire, ou 5 cartes dans sa Zone Magie & Piège, puis votre adversaire pioche 2 cartes.
  | de_text         = Bestimme 1 Monster in einer Spalte mit Karten in allen ihren Zonen und zerstöre so viele jener Karten wie möglich, außer dieser Karte, dann zieht jeder Spieler 1 Karte. Du kannst diese Karte von deinem Friedhof verbannen und dann 1 dieser Effekte aktivieren;<br />● Zerstöre 5 Monster in deiner Main-Monsterzone oder 5 Karten in deiner Zauber- & Fallenzone, dann ziehe 2 Karten.<br />● Zerstöre 5 Monster in der Main-Monsterzone deines Gegners oder 5 Karten in seiner Zauber- & Fallenzone, dann zieht dein Gegner 2 Karten.
  | it_text         = Seleziona 1 mostro in una colonna con carte in tutte le sue zone, e distruggi tante di quelle carte quante possibile, eccetto questa carta, poi ogni giocatore pesca 1 carta. Puoi bandire questa carta dal tuo Cimitero, poi attivare 1 di questi effetti;<br />● Distruggi 5 mostri nella tua Zona Mostri Main, o 5 carte nella tua Zona Magie & Trappole, poi pesca 2 carte.<br />● Distruggi 5 mostri nella Zona Mostri Main del tuo avversario, o 5 carte nella sua Zona Magie & Trappole, poi il tuo avversario pesca 2 carte.
  | pt_text         = Selecione 1 monstro em uma coluna com cards em todas as suas zonas, e destrua tantos desses cards quanto possível, exceto este card e, depois, cada duelista compra 1 card. Você pode banir este card do seu Cemitério e, depois, ative 1 desses efeitos;<br />● Destrua 5 monstros na sua Zona de Monstros Principal, ou 5 cards na sua Zona de Magias & Armadilhas e, depois, compre 2 cards.<br />● Destrua 5 monstros na Zona de Monstros Principal do seu oponente, ou 5 cards na Zona de Magias & Armadilhas dele e, depois, seu oponente compra 2 cards.
  | es_text         = Elige 1 monstruo en una columna con cartas en todas sus zonas y destruye tantas de esas cartas como sea posible, excepto esta carta, y después cada jugador roba 1 carta. Puedes desterrar esta carta en tu Cementerio, y después activa 1 de estos efectos;<br />● Destruye 5 monstruos en tu Zona de Monstruos Principal, o 5 cartas en tu Zona de Magia y Trampas, y después roba 2 cartas.<br />● Destruye 5 monstruos en la Zona de Monstruos Principal de tu adversario, o 5 cartas en su Zona de Magia y Trampas, y después tu adversario roba 2 cartas.
  | ja_text         = ①：同じ縦列全てにカードが存在するモンスター１体を選び、その縦列のカードを全て破壊する。その後、お互いはそれぞれ１枚ドローする。②：墓地のこのカードを除外し、以下の効果から１つを選択して発動できる。<br />●自分のメインモンスターゾーンのモンスター５体または自分の魔法＆罠ゾーンのカード５枚を破壊する。その後、自分は２枚ドローする。<br />●相手のメインモンスターゾーンのモンスター５体または相手の魔法＆罠ゾーンのカード５枚を破壊する。その後、相手は２枚ドローする。
