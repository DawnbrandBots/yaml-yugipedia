  | fr_text               = Ne peut pas déclarer d'attaque sauf si un monstre a été Sacrifié ce tour. Durant la Main Phase, si cette carte est sur le Terrain (Effet Rapide) : vous pouvez Sacrifier 1 autre monstre depuis votre main ou Terrain, puis activez 1 de ces effets ;<br />● Invoquez Spécialement 1 monstre qui mentionne "Magicien du Temps des Ténèbres" ("Guerrier Panthère du Vent Rapide" exclu) depuis votre main ou Deck.<br />● Envoyez 1 Magie/Piège qui mentionne "Magicien du Temps des Ténèbres" depuis votre Deck au Cimetière.<br />Vous ne pouvez utiliser cet effet de "Guerrier Panthère du Vent Rapide" qu'une fois par tour.
  | de_text               = Kann keinen Angriff deklarieren, es sei denn, in diesem Spielzug wurde ein Monster als Tribut angeboten. Während der Main Phase, falls sich diese Karte auf dem Spielfeld befindet (Schnelleffekt): Du kannst 1 anderes Monster von deiner Hand oder Spielfeldseite als Tribut anbieten und dann 1 dieser Effekte aktivieren;<br />● Beschwöre 1 Monster, das „Dunkler Zeitzauberer“ erwähnt, als Spezialbeschwörung von deiner Hand oder deinem Deck, außer „Starkwind-Panter-Krieger“.<br />● Lege 1 Zauber/Falle, der oder die „Dunkler Zeitzauberer“ erwähnt, von deinem Deck auf den Friedhof.<br />Du kannst diesen Effekt von „Starkwind-Panter-Krieger“ nur einmal pro Spielzug verwenden.
  | it_text               = Non può dichiarare un attacco a meno che un mostro sia stato offerto come Tributo in questo turno. Durante la Main Phase, se questa carta è sul Terreno (Effetto Rapido): puoi offrire come Tributo 1 altro mostro dalla tua mano o Terreno, poi attivare 1 di questi effetti;<br />● Evoca Specialmente 1 mostro che menziona "Stregone del Tempo Oscuro" dalla tua mano o Deck, eccetto "Pantera Guerriera Ventoveloce".<br />● Manda 1 Magia/Trappola che menziona "Stregone del Tempo Oscuro" dal tuo Deck al Cimitero.<br />Puoi utilizzare questo effetto di "Pantera Guerriera Ventoveloce" una sola volta per turno.
  | pt_text               = Não pode declarar um ataque a não ser que um monstro tenha sido oferecido como Tributo neste turno. Durante a Fase Principal, se este card estiver no campo (Efeito Rápido): você pode oferecer como Tributo 1 outro monstro da sua mão ou do campo e, depois, ative 1 desses efeitos;<br />● Invoque por Invocação-Especial 1 monstro que mencione "Mago do Tempo Negro" da sua mão ou do Deck, exceto "Guerreiro Pantera Vento Veloz".<br />● Envie 1 Magia/Armadilha que mencione "Mago do Tempo Negro" do seu Deck para o Cemitério.<br />Você só pode usar este efeito de "Guerreiro Pantera Vento Veloz" uma vez por turno.
  | es_text               = No puede declarar un ataque a menos que un monstruo fuera Sacrificado este turno. Durante la Main Phase, si esta carta está en el Campo (Efecto Rápido): puedes Sacrificar otro monstruo en tu mano o Campo, y después activa 1 de estos efectos;<br />● Invoca de Modo Especial, desde tu mano o Deck, 1 monstruo que mencione "Mago del Tiempo Oscuro", excepto "Guerrero Pantera Viento Veloz".<br />● Manda al Cementerio 1 Mágica/Trampa en tu Deck que mencione "Mago del Tiempo Oscuro".<br />Sólo puedes usar este efecto de "Guerrero Pantera Viento Veloz" una vez por turno.
  | ja_text               = このカード名の①の効果は１ターンに１度しか使用できない。①：自分・相手のメインフェイズに、フィールドのこのカード以外の自分の手札・フィールドのモンスター１体をリリースし、以下の効果から１つを選択して発動できる。●「疾風の豹戦士パンサーウォリアー」を除く、「時の黒魔術師」のカード名が記されたモンスター１体を手札・デッキから特殊召喚する。●デッキから「時の黒魔術師」のカード名が記された魔法・罠カード１枚を墓地へ送る。②：このカードはモンスターがリリースされたターンでなければ攻撃宣言できない。
