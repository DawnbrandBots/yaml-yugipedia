  | text                 = You cannot [[Special Summon]] from the [[Extra Deck]], except "[[Number]]" [[Xyz Monster]]s. You can only use each of the following [[effect]]s of "Gorgonic Umbral Horror" [[once per turn]]. If you [[control]] no [[monsters]], or all monsters you control are "[[Umbral Horror]]" monsters: You can Special Summon this card from your [[hand]], and if you do, [[Add a card|add]] 1 non-[[Rock]] "Umbral Horror" monster from your [[Main Deck|Deck]] to your hand. Can be treated as 2 [[material]]s for the [[Xyz Summon]] of a "[[Number]]" [[Xyz Monster]] that requires 3 or more materials.
  | fr_text              = Vous ne pouvez pas Invoquer Spécialement (Monstres Xyz "Numéro" exclus) depuis l'Extra Deck. Vous ne pouvez utiliser chacun des effets suivants de "Horreur de l'Ombre Gorgonique" qu'une fois par tour. Si vous ne contrôlez aucun monstre, ou si tous les monstres que vous contrôlez sont des monstres "Horreur de l'Ombre" : vous pouvez Invoquer Spécialement cette carte depuis votre main, et si vous le faites, ajoutez 1 monstre "Horreur de l'Ombre" non-Rocher depuis votre Deck à votre main. Peut être traitée comme 2 Matériels pour l'Invocation Xyz d'un Monstre Xyz "Numéro" qui nécessite min. 3 Matériels.
  | de_text              = Du kannst keine Spezialbeschwörungen vom Extra Deck durchführen, außer von „Nummer“-Xyz-Monstern. Du kannst jeden der folgenden Effekte von „Gorgonischer Schattenhorror“ nur einmal pro Spielzug verwenden. Falls du keine Monster kontrollierst oder alle Monster, die du kontrollierst, „Schattenhorror“-Monster sind: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören und falls du dies tust, füge deiner Hand 1 „Schattenhorror“-Nichtfels-Monster von deinem Deck hinzu. Kann als 2 Material für die Xyz-Beschwörung eines „Nummer“-Xyz-Monsters verwendet werden, das 3 oder mehr Material erfordert.
  | it_text              = Non puoi Evocare Specialmente dall'Extra Deck, eccetto Mostri Xyz "Numero". Puoi utilizzare ognuno dei seguenti effetti di "Orrore Umbral Gorgonico" una sola volta per turno. Se non controlli nessun mostro, o tutti i mostri che controlli sono mostri "Orrore Umbral": puoi Evocare Specialmente questa carta dalla tua mano e, se lo fai, aggiungi 1 mostro "Orrore Umbral" non-Roccia dal tuo Deck alla tua mano. Può essere considerato come 2 materiali per l'Evocazione Xyz di un Mostro Xyz "Numero" che richiede 3 o più materiali.
  | pt_text              = Você não pode Invocar por Invocação-Especial do Deck Adicional, exceto Monstros Xyz "Número". Você só pode usar cada um dos seguintes efeitos de "Terror Umbral Gorgônico" uma vez por turno. Se você não controlar nenhum monstro, ou todos os monstros que você controla forem monstros "Terror Umbral": você pode Invocar este card por Invocação-Especial da sua mão e, se isso acontecer, adicione 1 monstro "Terror Umbral" não-Rocha do seu Deck à sua mão. Pode ser considerado como 2 matérias para a Invocação-Xyz de um Monstro Xyz "Número" que requer 3 ou mais matérias.
  | es_text              = No puedes Invocar de Modo Especial desde el Deck Extra, excepto Monstruos Xyz "Número". Sólo puedes usar cada uno de los siguientes efectos de "Horror de las Sombras Gorgónico" una vez por turno. Si no controlas monstruos, o todos los monstruos que controlas son monstruos "Horror de las Sombras": puedes Invocar esta carta de Modo Especial desde tu mano y, si lo haces, añade a tu mano 1 monstruo "Horror de las Sombras" que no sea Roca en tu Deck. Puede ser tratado como 2 materiales para la Invocación Xyz de un Monstruo Xyz "Número" que requiera 3 o más materiales.
  | ja_text              = このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドのモンスターが、存在しない場合または「アンブラル」モンスターのみの場合に発動できる。このカードを手札から特殊召喚し、デッキから岩石族以外の「アンブラル」モンスター１体を手札に加える。②：このカードがモンスターゾーンに存在する限り、自分は「Ｎｏ．」ＸモンスターしかＥＸデッキから特殊召喚できない。③：モンスター３体以上を素材とする「Ｎｏ．」ＸモンスターをＸ召喚する場合、このカードは２体分のＸ素材にできる。
  | ko_text              = 
  | sc_text              = 此卡名的①③效果1回合仅可各使用1次。①：自己场上的怪兽，不存在的情况下或均为“黑影”怪兽的情况下可以发动。从手牌将此卡特殊召唤，从牌组将岩石族以外的1只“黑影”怪兽加入手牌。②：只要此卡存在于怪兽区域，自己从额外牌组仅可特殊召唤“编号”超量怪兽。③：要超量召唤需以3只以上怪兽作为素材的“编号”超量怪兽的情况下，此卡可作为2只的超量素材。
