  | text                  = 2 [[Effect Monster]]s, including a [[Synchro Monster]]<br />If this card is [[Link Summon]]ed, or a [[monster]](s) is [[Special Summon]]ed to a [[zone]](s) this card [[points to]]: You can [[target]] 1 monster in your [[face-up]] [[field]] or [[GY]]; Special Summon 1 "[[Dwimmered Stone Token]]" ([[Rock]]/[[LIGHT]]/[[ATK]] 0/[[DEF]] 0) with the same Level as that monster. When an [[effect]] of another monster on the field is [[activate]]d ([[Quick Effect]]): You can place that monster on top of the [[Main Deck|Deck]]. You can only use each effect of "Adamancipator Luminous" [[once per turn]].
  | fr_text               = 2 Monstres à Effet (un Monstre Synchro inclus)<br />Si cette carte est Invoquée par Lien, ou un ou plusieurs monstres sont Invoqués Spécialement dans des zones pointées par cette carte : vous pouvez cibler 1 monstre dans votre Terrain face recto ou Cimetière ; Invoquez Spécialement 1 "Jeton Pierre Illusien" (Rocher/LUMIÈRE/ATK 0/DEF 0) du même Niveau que le monstre. Lorsqu'un effet d'un autre monstre sur le Terrain est activé (Effet Rapide) : vous pouvez placer le monstre au-dessus du Deck. Vous ne pouvez utiliser chaque effet de "Lumineuse Inflexcipateur" qu'une fois par tour.
  | de_text               = 2 Effektmonster, darunter ein Synchromonster<br />Falls diese Karte als Linkbeschwörung beschworen wird oder ein oder mehr Monster als Spezialbeschwörung in eine oder mehr Zonen, auf die diese Karte zeigt, beschworen werden: Du kannst 1 Monster offen auf deiner Spielfeldseite oder in deinem Friedhof wählen; beschwöre 1 „Verwunschener-Stein-Spielmarke“ (Fels/LICHT/ATK 0/DEF 0) mit derselben Stufe wie jenes Monster als Spezialbeschwörung. Wenn ein Effekt eines anderen Monsters auf dem Spielfeld aktiviert wird (Schnelleffekt): Du kannst jenes Monster aufs Deck legen. Du kannst jeden Effekt von „Steinbefreierin Luminous“ nur einmal pro Spielzug verwenden.
  | it_text               = 2 Mostri con Effetto, compreso un Mostro Synchro<br />Se questa carta viene Evocata Link, o uno o più mostri vengono Evocati Specialmente in una o più zone puntate da questa carta: puoi scegliere come bersaglio 1 mostro nel tuo Terreno scoperto o Cimitero; Evoca Specialmente 1 "Segna-Pietra Dwimmerata" (Roccia/LUCE/ATK 0/DEF 0) con lo stesso Livello di quel mostro. Quando viene attivato l'effetto di un altro mostro sul Terreno (Effetto Rapido): puoi mettere quel mostro in cima al Deck. Puoi utilizzare ogni effetto di "Irremovibilatrice Luminosa" una sola volta per turno.
  | pt_text               = 2 Monstros de Efeito, incluindo um Monstro Sincro<br />Se este card for Invocado por Invocação-Link, ou um ou mais monstros forem Invocados por Invocação-Especial em uma ou mais zonas para as quais este card apontar: você pode escolher 1 monstro no seu campo com a face para cima ou Cemitério; Invoque por Invocação-Especial 1 "Ficha de Pedra Afundada" (Rocha/LUZ/ATK 0/DEF 0) com o mesmo Nível que o desse monstro. Quando um efeito de outro monstro no campo for ativado (Efeito Rápido): você pode colocar esse monstro no topo do Deck. Você só pode usar cada efeito de "Resplandecente Adamancipador" uma vez por turno.
  | es_text               = 2 Monstruos de Efecto, incluyendo un Monstruo de Sincronía<br />Si esta carta es Invocada por Enlace, o uno o más monstruos son Invocados de Modo Especial a una o más zonas a las que apunta esta carta: puedes seleccionar 1 monstruo en tu Campo boca arriba o Cementerio; Invoca de Modo Especial 1 "Ficha Roca Alucinada" (Roca/LUZ/ATK 0/DEF 0) con el mismo Nivel que ese monstruo. Cuando es activado un efecto de otro monstruo en el Campo (Efecto Rápido): puedes poner ese monstruo en la parte superior del Deck. Sólo puedes usar cada efecto de "Brillante Adamancipador" una vez por turno.
  | ja_text               = Ｓモンスターを含む効果モンスター２体<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードがＬ召喚した場合、またはこのカードのリンク先にモンスターが特殊召喚された場合、自分のフィールド・墓地のモンスター１体を対象として発動できる。そのモンスターと同じレベルを持つ「奇石トークン」（岩石族・光・攻／守０）１体を自分フィールドに特殊召喚する。②：このカード以外のフィールドのモンスターの効果が発動した時に発動できる。そのモンスターをデッキの一番上に戻す。
  | ko_text               = 싱크로 몬스터를 포함하는 효과 몬스터 2장<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 링크 소환했을 경우, 또는 이 카드의 링크 앞에 몬스터가 특수 소환되었을 경우, 자신의 필드 / 묘지의 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터와 같은 레벨을 가지는 "기석 토큰"(암석족 / 빛 / 공 0 / 수 0) 1장을 자신 필드에 특수 소환한다. ②: 이 카드 이외의 필드의 몬스터의 효과가 발동했을 때에 발동할 수 있다. 그 몬스터를 덱 맨 위로 되돌린다.
  | sc_text               = 包含同步怪兽在内的效果怪兽2只<br />此卡名的①②效果1回合仅可各使用1次。①：此卡连接召唤的情况下，或怪兽被特殊召唤至此卡连接端的情况下，以自己场上・墓地的1只怪兽为对象可以发动。将1只与该怪兽等级相同的“奇石衍生物”（岩石族・光・攻/守0）特殊召唤至自己场上。②：此卡以外的场上的怪兽的效果发动时可以发动。将该怪兽放回牌组最上面。
