  | text                  = This card is treated as a [[Toon monster]] while "[[Toon World]]" is on the [[field]]. During the [[Main Phase]] ([[Quick Effect]]): You can [[Tribute]] 1 monster (if you [[control]] "Toon World", you can Tribute 1 monster your opponent controls instead), and if you do, [[Special Summon]] 1 monster that mentions "Toon World" from your [[hand]] or [[Main Deck|Deck]], [[ignoring its Summoning conditions]]. You can only use this effect of "Animimicat" [[once per turn]].
  | fr_text               = Cette carte est traitée comme monstre Toon tant que "Monde des Toons" est sur le Terrain. Durant la Main Phase (Effet Rapide) : vous pouvez Sacrifier 1 monstre (si vous contrôlez "Monde des Toons", vous pouvez Sacrifier 1 monstre contrôlé par votre adversaire à la place), et si vous le faites, Invoquez Spécialement 1 monstre qui mentionne "Monde des Toons" depuis votre main ou Deck, en ignorant ses conditions d'Invocation. Vous ne pouvez utiliser cet effet de "Doppelganger le Comique" qu'une fois par tour.
  | de_text               = Diese Karte wird als Toon-Monster behandelt, solange „Toon-Welt“ auf dem Spielfeld liegt. Während der Main Phase (Schnelleffekt): Du kannst 1 Monster als Tribut anbieten (falls du „Toon-Welt“ kontrollierst, kannst du stattdessen 1 Monster als Tribut anbieten, das dein Gegner kontrolliert) und falls du dies tust, beschwöre 1 Monster, das „Toon-Welt“ erwähnt, als Spezialbeschwörung von deiner Hand oder deinem Deck, ungeachtet seiner Beschwörungsbedingungen. Du kannst diesen Effekt von „Animimikatze“ nur einmal pro Spielzug verwenden.
  | it_text               = Questa carta viene considerata come un mostro Toon mentre "Mondo Toon" è sul Terreno. Durante la Main Phase (Effetto Rapido): puoi offrire come Tributo 1 mostro (se controlli "Mondo Toon", puoi invece offrire come Tributo 1 mostro controllato dal tuo avversario) e, se lo fai, Evoca Specialmente 1 mostro che menziona "Mondo Toon" dalla tua mano o Deck, ignorando le sue condizioni di Evocazione. Puoi utilizzare questo effetto di "Doppelgangerfumetto" una sola volta per turno.
  | pt_text               = Este card é considerado como um monstro Toon enquanto "Mundo Toon" estiver no campo. Durante a Fase Principal (Efeito Rápido): você pode oferecer 1 monstro como Tributo (se você controlar "Mundo Toon", em vez disso, você pode oferecer como Tributo 1 monstro que seu oponente controla) e, se isso acontecer, Invoque por Invocação-Especial 1 monstro que mencione "Mundo Toon" da sua mão ou do Deck, ignorando suas condições de Invocação. Você só pode usar este efeito de "Sosianimado" uma vez por turno.
  | es_text               = Esta carta se trata como un monstruo Toon mientras "Mundo Toon" esté en el Campo. Durante la Main Phase (Efecto Rápido): puedes Sacrificar 1 monstruo (si controlas "Mundo Toon", puedes Sacrificar 1 monstruo que controle tu adversario en su lugar) y, si lo haces, Invoca de Modo Especial, desde tu mano o Deck, 1 monstruo que mencione "Mundo Toon", ignorando sus condiciones de Invocación. Sólo puedes usar este efecto de "Animimigato" una vez por turno.
  | ja_text               = このカード名の②の効果は１ターンに１度しか使用できない。①：フィールドに「トゥーン・ワールド」が存在する限り、このカードはトゥーンモンスターとして扱う。②：自分・相手のメインフェイズに発動できる。自分フィールドのモンスター１体をリリースし、手札・デッキから「トゥーン・ワールド」のカード名が記されたモンスター１体を召喚条件を無視して特殊召喚する。自分フィールドに「トゥーン・ワールド」が存在する場合、リリースするモンスターを相手フィールドから選ぶ事もできる。
  | ko_text               = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 필드에 "툰 월드"가 존재하는 한, 이 카드는 툰 몬스터로 취급한다. ②: 자신 / 상대의 메인 페이즈에 발동할 수 있다. 자신 필드의 몬스터 1장을 릴리스하고, 패 / 덱에서 "툰 월드"의 카드명이 쓰여진 몬스터 1장을 소환 조건을 무시하고 특수 소환한다. 자신 필드에 "툰 월드"가 존재할 경우, 릴리스할 몬스터를 상대 필드에서 고를 수도 있다.
  | sc_text               = 此卡名的②效果1回合仅可使用1次。①：只要场上存在“卡通世界”，此卡就视为卡通怪兽。②：在自己・对手的主要阶段可以发动。解放自己场上的1只怪兽，从手牌・牌组将1只记载有“卡通世界”卡名的怪兽无视召唤条件特殊召唤。自己场上存在“卡通世界”的情况下，要解放的怪兽也可从对手场上挑选。
