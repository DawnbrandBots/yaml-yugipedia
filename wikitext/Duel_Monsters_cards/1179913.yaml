  | ja_text               = このカード名の②の効果は１ターンに１度しか使用できない。①：フィールドに「トゥーン・ワールド」が存在する限り、このカードはトゥーンモンスターとして扱う。②：自分・相手のメインフェイズに発動できる。自分フィールドのモンスター１体をリリースし、手札・デッキから「トゥーン・ワールド」のカード名が記されたモンスター１体を召喚条件を無視して特殊召喚する。自分フィールドに「トゥーン・ワールド」が存在する場合、リリースするモンスターを相手フィールドから選ぶ事もできる。
  | ko_text               = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 필드에 "툰 월드"가 존재하는 한, 이 카드는 툰 몬스터로 취급한다. ②: 자신 / 상대의 메인 페이즈에 발동할 수 있다. 자신 필드의 몬스터 1장을 릴리스하고, 패 / 덱에서 "툰 월드"의 카드명이 쓰여진 몬스터 1장을 소환 조건을 무시하고 특수 소환한다. 자신 필드에 "툰 월드"가 존재할 경우, 릴리스할 몬스터를 상대 필드에서 고를 수도 있다.
  | sc_text               = 此卡名的②效果1回合仅可使用1次。①：只要场上存在“卡通世界”，此卡就视为卡通怪兽。②：在自己・对手的主要阶段可以发动。解放自己场上的1只怪兽，从手牌・牌组将1只记载有“卡通世界”卡名的怪兽无视召唤条件特殊召唤。自己场上存在“卡通世界”的情况下，要解放的怪兽也可从对手场上挑选。
