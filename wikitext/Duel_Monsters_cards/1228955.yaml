  | text                 = 1 [[Tuner]] + 1+ non-Tuners<br />You can [[target]] 1 opponent's [[monster]] in this card's adjacent [[column]], or 1 card in your opponent's [[Spell & Trap Zone]] that is 2 columns away from this card's; [[banish]] that card. If this card is placed in the Spell & Trap Zone as a [[Continuous Spell]]: You can [[send]] 1 "[[Angelechy]]" card from your [[Main Deck|Deck]] to the [[GY]]. You can only use each of the preceding [[effect]]s of "Angelechy Castellan" [[once per turn]]. While this card is treated as a Continuous Spell, each player can only [[activate]] 1 card or effect per [[Chain]].
  | fr_text              = 1 Syntoniseur + 1+ non-Syntoniseur<br />Vous pouvez cibler 1 monstre de l'adversaire dans la colonne adjacente à cette carte, ou 1 carte dans la Zone Magie & Piège de votre adversaire qui est située à 2 colonnes de cette carte ; bannissez la carte. Si cette carte est placée dans la Zone Magie & Piège comme Magie Continue : vous pouvez envoyer 1 carte "Angetélité" depuis votre Deck au Cimetière. Vous ne pouvez utiliser chacun des effets précédents de "Châtelain Angetélité" qu'une fois par tour. Tant que cette carte est traitée comme Magie Continue, chaque joueur ne peut activer qu'1 carte ou effet par Chaîne.
  | de_text              = 1 Empfänger + 1+ Nicht-Empfänger<br />Du kannst 1 Monster des Gegners in einer benachbarten Spalte dieser Karte oder 1 Karte in der Zauber- & Fallenzone deines Gegners, die 2 Spalten von dieser Karte entfernt ist, wählen; verbanne jene Karte. Falls diese Karte als Permanenter Zauber in die Zauber- & Fallenzone gelegt wird: Du kannst 1 „Engelechy“-Karte von deinem Deck auf den Friedhof legen. Du kannst jeden der vorherigen Effekte von „Engelechy Schlossvogt“ nur einmal pro Spielzug verwenden. Solange diese Karte als Permanenter Zauber behandelt wird, kann jeder Spieler nur 1 Karte oder 1 Effekt pro Kette aktivieren.
  | it_text              = 1 Tuner + 1+ non-Tuner<br />Puoi scegliere come bersaglio 1 mostro dell'avversario nella colonna adiacente a questa carta, o 1 carta nella Zona Magie & Trappole del tuo avversario che è a 2 colonne di distanza da questa carta; bandisci quella carta. Se questa carta viene messa nella Zona Magie & Trappole come una Magia Continua: puoi mandare 1 carta "Angelechy" dal tuo Deck al Cimitero. Puoi utilizzare ognuno dei precedenti effetti di "Angelechy Castellano" una sola volta per turno. Mentre questa carta viene considerata come una Magia Continua, ogni giocatore può attivare solo 1 carta o effetto per Catena.
  | pt_text              = 1 Regulador + 1+ não-Reguladores<br />Você pode escolher 1 monstro do oponente na coluna adjacente a este card, ou 1 card na Zona de Magias & Armadilhas do seu oponente que esteja a 2 colunas de distância deste card; bana esse card. Se este card for colocado na Zona de Magias & Armadilhas como uma Magia Contínua: você pode enviar 1 card "Anjoléquia" do seu Deck para o Cemitério. Você só pode usar cada um dos efeitos anteriores de "Castelão de Anjoléquia" uma vez por turno. Enquanto este card for considerado como uma Magia Contínua, cada duelista só pode ativar 1 card ou efeito por Corrente.
  | es_text              = 1 Cantante + 1+ no Cantantes<br />Puedes seleccionar 1 monstruo del adversario en la columna adyacente a la de esta carta, o 1 carta en la Zona de Magia y Trampas de tu adversario que esté 2 columnas más allá de la de esta carta; destierra esa carta. Si esta carta es puesta en la Zona de Magia y Trampas como una Mágica Continua: puedes mandar al Cementerio 1 carta "Angelequia" en tu Deck. Sólo puedes usar cada uno de los efectos previos de "Castellan Angelequia" una vez por turno. Mientras esta carta sea tratada como una Mágica Continua, cada jugador sólo puede activar 1 carta o efecto por Cadena.
