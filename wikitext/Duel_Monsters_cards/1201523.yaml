  | sc_text               = 协调＋协调以外的怪兽1只以上<br />此卡名的①②效果1回合仅可各使用1次。①：自己墓地存在暗属性怪兽的情况下可以发动。从牌组将1张“魔救”魔法・陷阱卡加入手牌。②：对手发动场上的怪兽的效果时可以发动。从自己牌组上面翻开5张卡。可最多依其中岩石族怪兽的数量，将对手场上的卡放回手牌。将翻开的卡以喜欢的顺序放回牌组下面。
