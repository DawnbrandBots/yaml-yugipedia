  | text                  = 1 [[Tuner]] + 1+ non-Tuners<br />If you have a [[DARK]] monster in your [[GY]]: You can [[Add a card|add]] 1 "[[Adamancipator]]" [[Spell]]/[[Trap]] from your [[Main Deck|Deck]] to your [[hand]]. When your opponent [[activate]]s a [[monster effect]] on the [[field]] ([[Quick Effect]]): You can [[excavate]] the top 5 cards of your Deck, and if you do, you can [[return]] cards your opponent controls to the hand, up to the number of excavated Rock monsters, also place the excavated cards on the bottom of your Deck in any order. You can only use each effect of "Adamancipator Risen - Tiamite" [[once per turn]].
  | fr_text               = 1 Syntoniseur + 1+ non-Syntoniseur<br />Si vous avez un monstre TÉNÈBRES dans votre Cimetière : vous pouvez ajouter 1 Magie/Piège "Inflexcipateur" depuis votre Deck à votre main. Lorsque votre adversaire active un effet de monstre sur le Terrain (Effet Rapide) : vous pouvez dévoiler les 5 cartes du dessus de votre Deck, et si vous le faites, vous pouvez renvoyer un nombre de cartes contrôlées par votre adversaire à la main, inférieur ou égal au nombre de monstres Rocher dévoilés, et aussi, placez les cartes dévoilées au-dessous de votre Deck dans l'ordre de votre choix. Vous ne pouvez utiliser chaque effet de "Éveillé Inflexcipateur - Tiamite" qu'une fois par tour.
  | de_text               = 1 Empfänger + 1+ Nicht-Empfänger<br />Falls du ein FINSTERNIS Monster in deinem Friedhof hast: Du kannst deiner Hand 1 „Steinbefreier“-Zauber/Falle von deinem Deck hinzufügen. Wenn dein Gegner einen Monstereffekt auf dem Spielfeld aktiviert (Schnelleffekt): Du kannst die obersten 5 Karten deines Decks ausgraben und falls du dies tust, kannst du Karten, die dein Gegner kontrolliert, bis zur Anzahl der ausgegrabenen Fels-Monster auf die Hand zurückgeben, zusätzlich lege die ausgegrabenen Karten in beliebiger Reihenfolge unter dein Deck. Du kannst jeden Effekt von „Steinbefreier-Entstiegener - Tiamit“ nur einmal pro Spielzug verwenden.
  | it_text               = 1 Tuner + 1+ non-Tuner<br />Se hai un mostro OSCURITÀ nel tuo Cimitero: puoi aggiungere 1 Magia/Trappola "Irremovibilatore" dal tuo Deck alla tua mano. Quando il tuo avversario attiva l'effetto di un mostro sul Terreno (Effetto Rapido): puoi dissotterrare le prime 5 carte del tuo Deck e, se lo fai, puoi far ritornare nella mano carte controllate dal tuo avversario, fino al numero di mostri Roccia dissotterrati, inoltre metti le carte dissotterrate in fondo al tuo Deck in qualsiasi ordine. Puoi utilizzare ogni effetto di "Irremovibilatore Risvegliato - Tiamite" una sola volta per turno.
  | pt_text               = 1 Regulador + 1+ não-Reguladores<br />Se você tiver um monstro de TREVAS no seu Cemitério: você pode adicionar 1 Magia/Armadilha "Adamancipador" do seu Deck à sua mão. Quando seu oponente ativar um efeito de monstro no campo (Efeito Rápido): você pode escavar os 5 cards do topo do seu Deck e, se isso acontecer, você pode devolver cards que seu oponente controla para a mão, até o número de monstros Rocha escavados e, além disso, coloque os cards escavados no fundo do seu Deck em qualquer ordem. Você só pode usar cada efeito de "Ressurgido Adamancipador - Tiamita" uma vez por turno.
  | es_text               = 1 Cantante + 1+ no Cantantes<br />Si tienes un monstruo de OSCURIDAD en tu Cementerio: puedes añadir a tu mano 1 Mágica/Trampa "Adamancipador" en tu Deck. Cuando tu adversario activa el efecto de un monstruo en el Campo (Efecto Rápido): puedes excavar las 5 cartas de la parte superior de tu Deck y, si lo haces, puedes devolver a la mano cartas que controle tu adversario, hasta el número de monstruos Roca excavados, y además pon las cartas excavadas en la parte inferior de tu Deck en cualquier orden. Sólo puedes usar cada efecto de "Despertado Adamancipador - Tiamita" una vez por turno.
  | ja_text               = チューナー＋チューナー以外のモンスター１体以上<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分の墓地に闇属性モンスターが存在する場合に発動できる。デッキから「アダマシア」魔法・罠カード１枚を手札に加える。②：相手がフィールドのモンスターの効果を発動した時に発動できる。自分のデッキの上からカードを５枚めくる。その中の岩石族モンスターの数まで相手フィールドのカードを手札に戻す事ができる。めくったカードを好きな順番でデッキの下に戻す。
