  | text                  = Roll a six-sided die twice, and apply these effects for the rest of this [[turn]].<br />● All [[monsters]] you [[control]] that mention "[[Dark Time Wizard]]" gain [[ATK]]/[[DEF]] equal to the total x 200.<br />● All monsters your opponent controls lose ATK/DEF equal to the total x 200.<br />If your opponent [[Normal Summon|Normal]] or [[Special Summon]]s a monster(s), while this card is in your [[GY]] (except during the [[Damage Step]]): You can [[banish]] this card, then [[target]] 1 of those monsters; roll a six-sided die twice, and if the total was 6 or higher, [[destroy]] that monster.
  | fr_text               = Lancez deux fois un dé à six faces, et appliquez ces effets le reste de ce tour.<br />● Tous les monstres que vous contrôlez qui mentionnent "Magicien du Temps des Ténèbres" gagnent une ATK/DEF égales au total x 200.<br />● Tous les monstres contrôlés par votre adversaire perdent une ATK/DEF égales au total x 200.<br />Si votre adversaire Invoque Normalement ou Spécialement un ou plusieurs monstres, tant que cette carte est dans votre Cimetière (sauf durant la Damage Step) : vous pouvez bannir cette carte, puis ciblez 1 de ces monstres ; lancez deux fois un dé à six faces, et si le total était min. 6, détruisez le monstre.
  | de_text               = Wirf zweimal einen sechsseitigen Würfel und wende für den Rest dieses Spielzugs diese Effekte an.<br />● Alle Monster, die du kontrollierst und die „Dunkler Zeitzauberer“ erwähnen, erhalten ATK/DEF in Höhe der Summe x 200.<br />● Alle Monster, die dein Gegner kontrolliert, verlieren ATK/DEF in Höhe der Summe x 200.<br />Falls dein Gegner ein oder mehr Monster als Normal- oder Spezialbeschwörung beschwört, solange sich diese Karte in deinem Friedhof befindet (außer während des Damage Steps): Du kannst diese Karte verbannen und dann 1 jener Monster wählen; wirf zweimal einen sechsseitigen Würfel und falls die Summe 6 oder höher ist, zerstöre jenes Monster.
  | it_text               = Tira un dado a sei facce due volte, e applica questi effetti per il resto di questo turno.<br />● Tutti i mostri che controlli che menzionano "Stregone del Tempo Oscuro" guadagnano ATK/DEF pari alla somma x 200.<br />● Tutti i mostri controllati dal tuo avversario perdono ATK/DEF pari alla somma x 200.<br />Se il tuo avversario Evoca Normalmente o Specialmente uno o più mostri, mentre questa carta è nel tuo Cimitero (eccetto durante il Damage Step): puoi bandire questa carta, poi scegliere come bersaglio 1 di quei mostri; tira un dado a sei facce due volte e, se la somma era 6 o superiore, distruggi quel mostro.
  | pt_text               = Lance um dado de seis faces duas vezes e aplique esses efeitos pelo resto deste turno.<br />● Todos os monstros que você controla que mencionem "Mago do Tempo Negro" ganham ATK/DEF igual à soma deles x 200.<br />● Todos os monstros que seu oponente controla perdem ATK/DEF igual à soma deles x 200.<br />Se seu oponente Invocar um ou mais monstros por Invocação-Normal ou Especial, enquanto este card estiver no seu Cemitério (exceto durante a Etapa de Dano): você pode banir este card e, depois, escolha 1 desses monstros; lance um dado de seis faces duas vezes e, se o total foi 6 ou mais, destrua esse monstro.
  | es_text               = Lanza un dado de seis caras dos veces, y aplica estos efectos por el resto de este turno.<br />● Todos los monstruos que controlas que mencionen "Mago del Tiempo Oscuro" ganan ATK/DEF igual al total x 200.<br />● Todos los monstruos que controla tu adversario pierden ATK/DEF igual al total x 200.<br />Si tu adversario Invoca de Modo Normal o Especial uno o más monstruos, mientras esta carta está en tu Cementerio (excepto durante el Damage Step): puedes desterrar esta carta, y después selecciona 1 de esos monstruos; lanza un dado de seis caras dos veces, y si el total fue 6 o mayor, destruye ese monstruo.
  | ja_text               = ①：サイコロを２回振り、このターン中、以下の効果をそれぞれ適用する。●「時の黒魔術師」のカード名が記された自分フィールドのモンスターの攻撃力・守備力は、出た目の合計×２００アップする。●相手フィールドのモンスターの攻撃力・守備力は、出た目の合計×２００ダウンする。②：このカードが墓地に存在する状態で、相手がモンスターを召喚・特殊召喚した場合、このカードを除外し、その内の１体を対象として発動できる。サイコロを２回振り、出た目の合計が６以上だった場合、対象のモンスターを破壊する。
  | ko_text               = 
  | sc_text               = ①：掷2次骰子，此回合中，分别适用以下效果。<br />●记载有“时间黑魔术师”卡名的、自己场上的怪兽的攻击力・守备力上升掷出的数字合计×200的数值。<br />●对手场上的怪兽的攻击力・守备力下降掷出的数字合计×200的数值。<br />②：此卡存在于墓地的状态下，对手将怪兽召唤・特殊召唤的情况下，将此卡除外，以其中1只为对象可以发动。掷2次骰子，掷出的数字合计在6以上的情况下，将对象怪兽破坏。
