  | text                 = Apply this effect based on the number of "[[Angelechy]]" [[Monster Card]]s on the [[field]].<br />● 1 to 4: [[Negate]] the [[effect]]s of 1 [[face-up]] card your opponent [[control]]s.<br />● 5+: [[Banish]] all cards your opponent controls.<br />You can banish this card from your [[GY]]; [[send]] 1 "Angelechy" card from your [[hand]] or [[face-up]] [[field]] to the GY, then you can place 1 "Angelechy" monster with a different name than the cards in your [[Spell & Trap Zone]], from your [[Extra Deck]] in your Spell & Trap Zone as a face-up [[Continuous Spell]]. You can only use each [[effect]] of "Angelechy Verdict" [[once per turn]].
  | fr_text              = Appliquez cet effet selon le nombre de Cartes Monstre "Angetélité" sur le Terrain.<br />● 1 à 4 : Annulez les effets d'1 carte face recto contrôlée par votre adversaire.<br />● 5+ : Bannissez toutes les cartes contrôlées par votre adversaire.<br />Vous pouvez bannir cette carte depuis votre Cimetière ; envoyez 1 carte "Angetélité" depuis votre main ou Terrain face recto au Cimetière, puis vous pouvez placer 1 monstre "Angetélité" de nom différent des cartes dans votre Zone Magie & Piège, depuis votre Extra Deck dans votre Zone Magie & Piège comme Magie Continue face recto. Vous ne pouvez utiliser chaque effet de "Verdict Angetélité" qu'une fois par tour.
  | de_text              = Führe diesen Effekt aus, basierend auf der Anzahl der „Engelechy“-Monsterkarten auf dem Spielfeld.<br />● 1 bis 4: Annulliere die Effekte von 1 offenen Karte, die dein Gegner kontrolliert.<br />● 5+: Verbanne alle Karten, die dein Gegner kontrolliert.<br />Du kannst diese Karte von deinem Friedhof verbannen; lege 1 „Engelechy“-Karte von deiner Hand oder offen von deiner Spielfeldseite auf den Friedhof, dann kannst du 1 „Engelechy“-Monster mit einem unterschiedlichen Namen als die Karten in deiner Zauber- & Fallenzone von deinem Extra Deck als offenen Permanenten Zauber in deine Zauber- & Fallenzone legen. Du kannst jeden Effekt von „Engelechy-Verdikt“ nur einmal pro Spielzug verwenden.
  | it_text              = Applica questo effetto a seconda del numero di Carte Mostro "Angelechy" sul Terreno.<br />● Da 1 a 4: Annulla gli effetti di 1 carta scoperta controllata dal tuo avversario.<br />● 5+: Bandisci tutte le carte controllate dal tuo avversario.<br />Puoi bandire questa carta dal tuo Cimitero; manda 1 carta "Angelechy" dalla tua mano o Terreno scoperto al Cimitero, poi puoi mettere 1 mostro "Angelechy" con un nome diverso dalle carte nella tua Zona Magie & Trappole, dal tuo Extra Deck nella tua Zona Magie & Trappole come una Magia Continua scoperta. Puoi utilizzare ogni effetto di "Verdetto Angelechy" una sola volta per turno.
  | pt_text              = Aplique este efeito de acordo com o número de Cards de Monstro "Anjoléquia" no campo.<br />● 1 a 4: Negue os efeitos de 1 card com a face para cima que seu oponente controla.<br />● 5+: Bana todos os cards que seu oponente controla.<br />Você pode banir este card do seu Cemitério; envie 1 card "Anjoléquia" da sua mão ou do campo com a face para cima para o Cemitério e, depois, você pode colocar 1 monstro "Anjoléquia" com um nome diferente que o dos cards na sua Zona de Magias & Armadilhas, do seu Deck Adicional na sua Zona de Magias & Armadilhas como uma Magia Contínua com a face para cima. Você só pode usar cada efeito de "Veredito de Anjoléquia" uma vez por turno.
  | es_text              = Aplica este efecto basado en el número de Cartas de Monstruo "Angelequia" en el Campo.<br />● 1 a 4: Niega los efectos de 1 carta boca arriba que controle tu adversario.<br />● 5+: Destierra todas las cartas que controle tu adversario.<br />Puedes desterrar esta carta en tu Cementerio; manda al Cementerio 1 carta "Angelequia" en tu mano o Campo boca arriba, y después puedes poner en tu Zona de Magia y Trampas 1 monstruo "Angelequia" en tu Deck Extra con un nombre diferente al de las cartas en tu Zona de Magia y Trampas, como una Mágica Continua boca arriba. Sólo puedes usar cada efecto de "Veredicto Angelequia" una vez por turno.
