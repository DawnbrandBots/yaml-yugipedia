  | ja_text               = このカード名のカードは１ターンに１枚しか発動できない。①：以下の効果から１つを選択して発動できる。<br />●このカードは通常モンスター（昆虫族・チューナー・闇・星１・攻／守０）となり、モンスターゾーンに特殊召喚する（罠カードとしては扱わない）。その後、Ｓモンスター１体のＳ召喚を行う事ができる。<br />●自分の墓地の「アシュトラ」モンスター１体を対象として発動できる。そのモンスターを特殊召喚する。
  | ko_text               = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 이하의 효과에서 1개를 선택하고 발동할 수 있다.<br />●이 카드는 일반 몬스터(곤충족 / 튜너 / 어둠 / 레벨 1 / 공 0 / 수 0)가 되고, 몬스터 존에 특수 소환한다(함정 카드로는 취급하지 않는다). 그 후, 싱크로 몬스터 1장의 싱크로 소환을 실행할 수 있다.<br />●자신 묘지의 "아슈트라" 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 특수 소환한다.
  | sc_text               = 此卡名的卡1回合仅可发动1张。①：可从以下效果中选择1个发动。<br />●此卡变为通常怪兽（昆虫族・协调・暗・星1・攻/守0），特殊召唤至怪兽区域（不视为陷阱卡）。然后，可进行1只同步怪兽的同步召唤。<br />●以自己墓地的1只“艮鬼”怪兽为对象可以发动。将该怪兽特殊召唤。
