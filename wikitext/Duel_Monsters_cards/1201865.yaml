  | fr_text               = Activez 1 de ces effets ;<br />● Invoquez Spécialement cette carte comme Monstre Normal (Insecte/Syntoniseur/TÉNÈBRES/Niveau 1/ATK 0/DEF 0) (cette carte N'EST PAS traitée comme Piège), puis immédiatement après la résolution de cet effet, vous pouvez Invoquer par Synchronisation 1 Monstre Synchro.<br />● Ciblez 1 monstre "Ashtra" dans votre Cimetière ; Invoquez-le Spécialement.<br />Vous ne pouvez activer qu'1 "Toile d'Ashtra" par tour.
  | de_text               = Aktiviere 1 dieser Effekte;<br />● Beschwöre diese Karte als Spezialbeschwörung als Normales Monster (Insekt/Empfänger/FINSTERNIS/Stufe 1/ATK 0/DEF 0) (diese Karte wird NICHT als Falle behandelt), dann, sofort nachdem dieser Effekt aufgelöst wurde, kannst du 1 Synchromonster als Synchrobeschwörung beschwören.<br />● Wähle 1 „Ashtra“-Monster in deinem Friedhof; beschwöre es als Spezialbeschwörung.<br />Du kannst nur 1 „Ashtras Netz“ pro Spielzug aktivieren.
  | it_text               = Attiva 1 di questi effetti;<br />● Evoca Specialmente questa carta come Mostro Normale (Insetto/Tuner/OSCURITÀ/Livello 1/ATK 0/DEF 0) (questa carta NON viene considerata come una Trappola), poi immediatamente dopo che questo effetto si è risolto, puoi Synchro Evocare 1 Mostro Synchro.<br />● Scegli come bersaglio 1 mostro "Ashtra" nel tuo Cimitero; Evocalo Specialmente.<br />Puoi attivare solo 1 "Ragnatela di Ashtra" per turno.
