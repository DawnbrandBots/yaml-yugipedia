  | text                  = [[Add a card|Add]] 1 card that mentions "[[Spell Counter]]" in its effect text from your [[Main Deck|Deck]] or [[GY]] to your hand, except "Spell Power Attainment", then if you [[control]] a [[Level]] 7 or higher "[[Endymion]]" [[Monster Card]], you can apply this effect.<br />● [[Remove]] any number of Spell Counters from your [[field]], and if you do, [[negate]] the effects of that many [[face-up]] cards your opponent controls, and if you do that, [[destroy]] those cards.<br />You can only activate 1 "Spell Power Attainment" per turn.
  | fr_text               = Ajoutez 1 carte qui mentionne "Compteur Magie" ("Atteinte de Puissance Magique" exclu) dans son texte d'effet depuis votre Deck ou Cimetière à votre main, puis si vous contrôlez une Carte Monstre "Endymion" de min. Niveau 7, vous pouvez appliquer cet effet.<br />● Retirez un nombre de votre choix de Compteurs Magie depuis votre Terrain, et si vous le faites, annulez les effets d'autant de cartes face recto contrôlées par votre adversaire, et si vous faites ça, détruisez ces cartes.<br />Vous ne pouvez activer qu'1 "Atteinte de Puissance Magique" par tour.
  | de_text               = Füge deiner Hand 1 Karte, die „Zauberzählmarke“ in ihrem Effekttext erwähnt, von deinem Deck oder Friedhof hinzu, außer „Erlangung der Zauberkraft“, dann, falls du eine „Endymion“-Monsterkarte der Stufe 7 oder höher kontrollierst, kannst du diesen Effekt ausführen.<br />● Entferne eine beliebige Anzahl Zauberzählmarken von deiner Spielfeldseite und falls du dies tust, annulliere die Effekte von ebenso vielen offenen Karten, die dein Gegner kontrolliert, und falls du dies tust, zerstöre jene Karten.<br />Du kannst nur 1 „Erlangung der Zauberkraft“ pro Spielzug aktivieren.
  | it_text               = Aggiungi 1 carta che menziona "Segnalino Magia" nel testo del suo effetto dal tuo Deck o Cimitero alla tua mano, eccetto "Raggiungimento del Potere Magico", poi se tu controlli una Carta Mostro "Endymion" di Livello 7 o superiore, puoi applicare questo effetto.<br />● Rimuovi un qualsiasi numero di Segnalini Magia dal tuo Terreno e, se lo fai, annulla gli effetti di quel numero di carte scoperte controllate dal tuo avversario e, se fai quello, distruggi quelle carte.<br />Puoi attivare solo 1 "Raggiungimento del Potere Magico" per turno.
  | pt_text               = Adicione 1 card que mencione "Marcador de Magia" em seu texto de efeito do seu Deck ou Cemitério à sua mão, exceto "Obtenção do Poder Mágico" e, depois, se você controlar um Card de Monstro "Endymion" de Nível 7 ou mais, você pode aplicar este efeito.<br />● Remova qualquer número de Marcadores de Magia do seu campo e, se isso acontecer, negue os efeitos desse número de cards com a face para cima que seu oponente controla e, se isso acontecer, destrua esses cards.<br />Você só pode ativar 1 "Obtenção do Poder Mágico" por turno.
  | es_text               = Añade a tu mano 1 carta en tu Deck o Cementerio que mencione "Contador Mágico" en su texto de efecto, excepto "Logro del Poder Mágico" y después, si controlas una Carta de Monstruo "Endimión" de Nivel 7 o mayor, puedes aplicar este efecto.<br />● Retira de tu Campo cualquier número de Contadores Mágicos y, si lo haces, niega los efectos de ese número de cartas boca arriba que controle tu adversario y, si haces eso, destruye esas cartas.<br />Sólo puedes activar 1 "Logro del Poder Mágico" por turno.
  | ja_text               = このカード名のカードは１ターンに１枚しか発動できない。①：「魔力到達」を除く、効果テキストに「魔力カウンター」と記されたカード１枚を自分のデッキ・墓地から手札に加える。自分フィールドにレベル７以上の「エンディミオン」モンスターカードが存在する場合、さらに以下の効果を適用できる。●自分フィールドの魔力カウンターを任意の数だけ取り除き、その数だけ相手フィールドの表側表示カードの効果を無効にし破壊する。
