  | text                 = [[Activate]] 1 of these [[effect]]s;<br />● [[Destroy]] all [[face-up]] [[Spell]]s your opponent [[control]]s.<br />● [[Target]] 1 face-up [[monster]] your opponent controls; show 1 "[[Light and Darkness Ritual]]" in your [[hand]] or [[GY]], then that monster's [[ATK]] becomes 0, also its effects are [[negate]]d.<br /> If this card in its [[owner]]'s [[possession]] is [[destroy]]ed by an opponent's card: You can destroy 1 card in your opponent's hand (at random) or their [[field]]. You can only activate 1 "Spell Shattering Sword" [[once per turn|per turn]].
  | fr_text              = Activez 1 de ces effets ;<br />● Détruisez toutes les Magies face recto contrôlées par votre adversaire.<br />● Ciblez 1 monstre face recto contrôlé par votre adversaire ; montrez 1 "Rituel de la Lumière et des Ténèbres" dans votre main ou Cimetière, puis l'ATK du monstre devient 0, et aussi, ses effets sont annulés.<br />Si cette carte en possession de son propriétaire est détruite par une carte de l'adversaire : vous pouvez détruire 1 carte dans la main de votre adversaire (au hasard) ou son Terrain. Vous ne pouvez activer qu'1 "Épée Brise-Sort" par tour.
  | de_text              = Aktiviere 1 dieser Effekte;<br />● Zerstöre alle offenen Zauber, die dein Gegner kontrolliert.<br />● Wähle 1 offenes Monster, das dein Gegner kontrolliert; zeige 1 „Ritual von Licht und Finsternis“ in deiner Hand oder deinem Friedhof, dann werden die ATK jenes Monsters zu 0, zusätzlich werden seine Effekte annulliert.<br />Falls diese Karte, die ihrem Besitzer gehört, durch eine Karte eines Gegners zerstört wird: Du kannst 1 Karte in der Hand deines Gegners (zufällig) oder auf seiner Spielfeldseite zerstören. Du kannst nur 1 „Zauberbrechendes Schwert“ pro Spielzug aktivieren.
  | it_text              = Attiva 1 di questi effetti;<br />● Distruggi tutte le Magie scoperte controllate dal tuo avversario.<br />● Scegli come bersaglio 1 mostro scoperto controllato dal tuo avversario; mostra 1 "Rituale di Luce e Oscurità" nella tua mano o Cimitero, poi l'ATK di quel mostro diventa 0, inoltre i suoi effetti sono annullati.<br />Se questa carta sotto il comando del suo proprietario viene distrutta da una carta dell'avversario: puoi distruggere 1 carta nella mano del tuo avversario (a caso) o nel suo Terreno. Puoi attivare solo 1 "Spada Spezza-Magia" per turno.
  | pt_text              = Ative 1 desses efeitos;<br />● Destrua todas as Magias com a face para cima que seu oponente controla.<br />● Escolha 1 monstro com a face para cima que seu oponente controla; mostre 1 "Ritual da Luz e das Trevas" na sua mão ou no Cemitério e, depois, o ATK desse monstro se torna 0 e, além disso, seus efeitos são negados.<br />Se este card em posse do seu dono for destruído por um card do oponente: você pode destruir 1 card na mão do seu oponente (aleatoriamente) ou no campo dele. Você só pode ativar 1 "Espada Destruidora de Magia" por turno.
  | es_text              = Activa 1 de estos efectos;<br />● Destruye todas las Mágicas boca arriba que controle tu adversario.<br />● Selecciona 1 monstruo boca arriba que controle tu adversario; enseña 1 "Ritual de la Luz y la Oscuridad" en tu mano o Cementerio, y después el ATK de ese monstruo se convierte en 0, y además sus efectos son negados.<br />Si esta carta en posesión de su dueño es destruida por una carta del adversario: puedes destruir 1 carta en la mano de tu adversario (al azar) o su Campo. Sólo puedes activar 1 "Espada Rompedora de Hechizos" por turno.
  | ja_text              = このカード名のカードは１ターンに１枚しか発動できない。①：以下の効果から１つを選択して発動できる。<br />●相手フィールドの表側表示の魔法カードを全て破壊する。<br />●相手フィールドの表側表示モンスター１体を対象として発動できる。自分の手札・墓地の「光と闇の儀式」１枚を選び、お互いに確認する。その後、対象のモンスターの攻撃力は０になり、効果は無効化される。<br />②：このカードが相手によって破壊された場合に発動できる。相手の手札・フィールドのカード１枚を破壊する（手札からはランダムに選ぶ）。
