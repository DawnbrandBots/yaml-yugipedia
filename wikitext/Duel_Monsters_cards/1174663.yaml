  | text                  = (This card is not treated as a "[[Rainbow Bridge (archetype)|Rainbow Bridge]]" card.)<br />[[Banish]] 3 [[Level]] 10 or higher [[monsters]] from your [[Extra Deck]], including a [[LIGHT]] [[Synchro Monster]]; [[Add a card|add]] 1 [[Field Spell]] from your [[Main Deck|Deck]] to your [[hand]]. You can only [[activate]] 1 "Rainbow Bridge Bifrost" per turn.
  | fr_text               = (Cette carte n'est pas traitée comme carte "Pont Arc-en-Ciel".)<br />Bannissez 3 monstres de min. Niveau 10 (un Monstre Synchro LUMIÈRE inclus) depuis votre Extra Deck ; ajoutez 1 Magie de Terrain depuis votre Deck à votre main. Vous ne pouvez activer qu'1 "Pont Arc-en-Ciel du Bifröst" par tour.
  | de_text               = (Diese Karte wird nicht als „Regenbogenbrücke“-Karte behandelt.)<br />Verbanne 3 Monster der Stufe 10 oder höher von deinem Extra Deck, darunter ein LICHT Synchromonster; füge deiner Hand 1 Spielfeldzauber von deinem Deck hinzu. Du kannst nur 1 „Regenbogenbrücke Bifröst“ pro Spielzug aktivieren.
  | it_text               = (Questa carta non viene considerata come una carta "Ponte Arcobaleno".)<br />Bandisci 3 mostri di Livello 10 o superiore dal tuo Extra Deck, compreso un Mostro Synchro LUCE; aggiungi 1 Magia Terreno dal tuo Deck alla tua mano. Puoi attivare solo 1 "Ponte Arcobaleno Bifrost" per turno.
  | pt_text               = Bana 3 monstros de Nível 10 ou mais do seu Deck Adicional, incluindo um Monstro Sincro de LUZ; adicione 1 Magia de Campo do seu Deck à sua mão. Você só pode ativar 1 "Ponte do Arco-Íris Bifrost" por turno.
  | es_text               = (Esta carta no se trata como una carta "Puente de Arco Iris").<br />Destierra 3 monstruos de Nivel 10 o mayor en tu Deck Extra, incluyendo un Monstruo de Sincronía de LUZ; añade a tu mano 1 Mágica de Campo en tu Deck. Sólo puedes activar 1 "Puente de Arco Iris Bifrost" por turno.
  | ja_text               = このカード名のカードは１ターンに１枚しか発動できない。①：光属性Ｓモンスターを含むレベル１０以上のモンスター３体をＥＸデッキから除外して発動できる。デッキからフィールド魔法カード１枚を手札に加える。
  | ko_text               = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. ①: 빛 속성 싱크로 몬스터를 포함하는 레벨 10 이상의 몬스터 3장을 엑스트라 덱에서 제외하고 발동할 수 있다. 덱에서 필드 마법 카드 1장을 패에 넣는다.
