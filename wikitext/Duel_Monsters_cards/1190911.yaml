  | text                = If this card is [[Normal Summon]]ed: You can [[Special Summon]] 1 [[Level]] 4 or lower "[[Unchained]]" [[monster]] from your [[Main Deck|Deck]], except "Unchained Oni of Shyma", then [[destroy]] 1 card you [[control]], also you cannot Special Summon for the rest of this [[turn]], except [[Fiend]] monsters. If this card on the [[field]] is destroyed by card [[effect]], except "Unchained Oni of Shyma", or by battle: You can Special Summon 1 "Unchained" monster from your [[hand]] or Deck, except "Unchained Oni of Shyma". You can only use each effect of "Unchained Oni of Shyma" [[once per turn]].
  | fr_text             = Si cette carte est Invoquée Normalement : vous pouvez Invoquer Spécialement 1 monstre "Désenchaîné" de max. Niveau 4 ("Oni Désenchaîné de Shyma" exclu) depuis votre Deck, puis détruisez 1 carte que vous contrôlez, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres Démon exclus) le reste de ce tour. Si cette carte sur le Terrain est détruite par un effet de carte ("Oni Désenchaîné de Shyma" exclu) ou au combat : vous pouvez Invoquer Spécialement 1 monstre "Désenchaîné" ("Oni Désenchaîné de Shyma" exclu) depuis votre main ou Deck. Vous ne pouvez utiliser chaque effet de "Oni Désenchaîné de Shyma" qu'une fois par tour.
  | de_text             = Falls diese Karte als Normalbeschwörung beschworen wird: Du kannst 1 „Losgekettet“-Monster der Stufe 4 oder niedriger als Spezialbeschwörung von deinem Deck beschwören, außer „Losgeketteter Oni von Shyma“, dann zerstöre 1 Karte, die du kontrollierst, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von Unterweltler-Monstern. Falls diese Karte auf dem Spielfeld durch einen Karteneffekt, außer den Effekt von „Losgeketteter Oni von Shyma“, oder durch Kampf zerstört wird: Du kannst 1 „Losgekettet“-Monster als Spezialbeschwörung von deiner Hand oder deinem Deck beschwören, außer „Losgeketteter Oni von Shyma“. Du kannst jeden Effekt von „Losgeketteter Oni von Shyma“ nur einmal pro Spielzug verwenden.
  | it_text             = Se questa carta viene Evocata Normalmente: puoi Evocare Specialmente 1 mostro "Svincolato" di Livello 4 o inferiore dal tuo Deck, eccetto "Oni Svincolata dello Shyma", poi distruggere 1 carta che controlli, inoltre non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri Demone. Se questa carta sul Terreno viene distrutta dall'effetto di una carta, eccetto "Oni Svincolata dello Shyma", o in battaglia: puoi Evocare Specialmente 1 mostro "Svincolato" dalla tua mano o Deck, eccetto "Oni Svincolata dello Shyma". Puoi utilizzare ogni effetto di "Oni Svincolata dello Shyma" una sola volta per turno.
  | pt_text             = Se este card for Invocado por Invocação-Normal: você pode Invocar por Invocação-Especial 1 monstro "Desacorrentado(a)" de Nível 4 ou menos do seu Deck, exceto "Oni Desacorrentado de Shyma" e, depois, destrua 1 card que você controla e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros Demônio. Se este card no campo for destruído por um efeito de card, exceto "Oni Desacorrentado de Shyma", ou em batalha: você pode Invocar por Invocação-Especial 1 monstro "Desacorrentado(a)" da sua mão ou do Deck, exceto "Oni Desacorrentado de Shyma". Você só pode usar cada efeito de "Oni Desacorrentado de Shyma" uma vez por turno.
  | es_text             = Si esta carta es Invocada de Modo Normal: puedes Invocar de Modo Especial 1 monstruo "Desencadenado/a" de Nivel 4 o menor desde tu Deck, excepto "Oni Desencadenado de Shyma", y después destruye 1 carta que controles, y además no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos Demonio. Si esta carta en el Campo es destruida por el efecto de una carta, excepto "Oni Desencadenado de Shyma", o en batalla: puedes Invocar de Modo Especial 1 monstruo "Desencadenado/a" desde tu mano o Deck, excepto "Oni Desencadenado de Shyma". Sólo puedes usar cada efecto de "Oni Desencadenado de Shyma" una vez por turno.
  | ja_text             = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：このカードが召喚した場合に発動できる。「破械式鬼シュマ」を除く、レベル４以下の「破械」モンスター１体をデッキから特殊召喚する。その後、自分フィールドのカード１枚を破壊する。このターン、自分は悪魔族モンスターしか特殊召喚できない。②：フィールドのこのカードが戦闘または「破械式鬼シュマ」以外のカードの効果で破壊された場合に発動できる。手札・デッキから「破械式鬼シュマ」以外の「破械」モンスター１体を特殊召喚する。
  | ko_text             = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 일반 소환했을 경우에 발동할 수 있다. "언체인드식귀 슈마"가 아닌, 레벨 4 이하의 "언체인드" 몬스터 1장을 덱에서 특수 소환한다. 그 후, 자신 필드의 카드 1장을 파괴한다. 이 턴에, 자신은 악마족 몬스터밖에 특수 소환할 수 없다. ②: 필드의 이 카드가 전투 또는 "언체인드식귀 슈마" 이외의 카드의 효과로 파괴되었을 경우에 발동할 수 있다. 패 / 덱에서 "언체인드식귀 슈마" 이외의 "언체인드" 몬스터 1장을 특수 소환한다.
  | sc_text             = 此卡名的①②效果1回合仅可各使用1次。①：此卡召唤的情况下可以发动。从牌组将“破械式鬼 修摩”以外的、1只等级4以下的“破械”怪兽特殊召唤。然后，将自己场上的1张卡破坏。此回合，自己仅可特殊召唤恶魔族怪兽。②：场上的此卡因战斗或“破械式鬼 修摩”以外的卡的效果被破坏的情况下可以发动。从手牌・牌组将“破械式鬼 修摩”以外的1只“破械”怪兽特殊召唤。
