  | text                 = If this card is in your [[hand]], and you have 3 or more different [[Attribute]]s among the [[monsters]] in your [[GY]]: You can [[target]] 1 monster in your GY; [[Special Summon]] both it and this card. If you have 3 or more different Attributes among the monsters in your GY: You can Special Summon 1 monster from your [[Main Deck|Deck]] with a different Attribute from the monsters in your [[field]] or GY. You can only use each effect of "Elemental Saga Doriado" [[once per turn]], also neither player can [[activate]] cards or [[effect]]s in response to either of these effect activations.
  | fr_text              = Si cette carte est dans votre main, et que vous avez min. 3 Attributs différents parmi les monstres dans votre Cimetière : vous pouvez cibler 1 monstre dans votre Cimetière ; Invoquez-le Spécialement ainsi que cette carte. Si vous avez min. 3 Attributs différents parmi les monstres dans votre Cimetière : vous pouvez Invoquer Spécialement 1 monstre depuis votre Deck d'Attribut différent des monstres dans votre Terrain ou Cimetière. Vous ne pouvez utiliser chaque effet de "Doriado, Saga Élémentaire" qu'une fois par tour, et aussi, aucun joueur ne peut activer ni de cartes ni d'effets en réponse à ces activations d'effet.
  | de_text              = Falls sich diese Karte in deiner Hand befindet und du 3 oder mehr unterschiedliche Eigenschaften unter den Monstern in deinem Friedhof hast: Du kannst 1 Monster in deinem Friedhof wählen; beschwöre sowohl es als auch diese Karte als Spezialbeschwörung. Falls du 3 oder mehr unterschiedliche Eigenschaften unter den Monstern in deinem Friedhof hast: Du kannst 1 Monster mit einer unterschiedlichen Eigenschaft als die Monster auf deiner Spielfeldseite und in deinem Friedhof als Spezialbeschwörung von deinem Deck beschwören. Du kannst jeden Effekt von „Elementarsage Doriado“ nur einmal pro Spielzug verwenden, zusätzlich kann kein Spieler Karten oder Effekte als Reaktion auf die Aktivierung dieser Effekte aktivieren.
  | it_text              = Se questa carta è nella tua mano, e tu hai 3 o più Attributi diversi tra i mostri nel tuo Cimitero: puoi scegliere come bersaglio 1 mostro nel tuo Cimitero; Evoca Specialmente sia esso che questa carta. Se hai 3 o più Attributi diversi tra i mostri nel tuo Cimitero: puoi Evocare Specialmente dal tuo Deck 1 mostro con un Attributo diverso dai mostri nel tuo Terreno o Cimitero. Puoi utilizzare ogni effetto di "Doriado Saga Elementale" una sola volta per turno, inoltre nessun giocatore può attivare carte o effetti in risposta all'attivazione di qualsiasi di questi due effetti.
  | pt_text              = Se este card estiver na sua mão e você tiver 3 ou mais Atributos diferentes entre os monstros no seu Cemitério: você pode escolher 1 monstro no seu Cemitério; Invoque por Invocação-Especial tanto ele quanto este card. Se você tiver 3 ou mais Atributos diferentes entre os monstros no seu Cemitério: você pode Invocar por Invocação-Especial 1 monstro do seu Deck com um Atributo diferente que o dos monstros no seu campo ou Cemitério. Você só pode usar cada efeito de "Doriado, Saga dos Elementos" uma vez por turno e, além disso, nenhum duelista pode ativar cards ou efeitos em resposta à ativação de qualquer um desses efeitos.
  | es_text              = Si esta carta está en tu mano y tienes 3 o más Atributos diferentes entre los monstruos en tu Cementerio: puedes seleccionar 1 monstruo en tu Cementerio; Invoca ambos de Modo Especial, ése y esta carta. Si tienes 3 o más Atributos diferentes entre los monstruos en tu Cementerio: puedes Invocar de Modo Especial 1 monstruo desde tu Deck con un Atributo diferente al de los monstruos en tu Campo o Cementerio. Sólo puedes usar cada efecto de "Saga Elemental Doriado" una vez por turno, y además ningún jugador puede activar cartas o efectos en respuesta a cualquiera de estas activaciones de efecto.
  | ja_text              = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できず、この効果の発動に対して魔法・罠・モンスターの効果は発動できない。①：このカードが手札に存在し、自分の墓地のモンスターの属性が３種類以上の場合、自分の墓地のモンスター１体を対象として発動できる。そのモンスターとこのカードを特殊召喚する。②：自分の墓地のモンスターの属性が３種類以上の場合に発動できる。同じ属性のモンスターが自分のフィールド・墓地に存在しないモンスター１体をデッキから特殊召喚する。
  | ko_text              = 
  | sc_text              = 此卡名的①②效果1回合仅可各使用1次，应对此效果的发动，魔法・陷阱・怪兽的效果不可发动。①：此卡存在于手牌，且自己墓地的怪兽的属性为3种以上的情况下，以自己墓地的1只怪兽为对象可以发动。将该怪兽和此卡特殊召唤。②：自己墓地的怪兽的属性为3种以上的情况下可以发动。从牌组将自己场上・墓地不存在相同属性怪兽的1只怪兽特殊召唤。
