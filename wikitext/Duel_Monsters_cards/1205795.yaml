  | text                 = ([[Quick Effect]]): You can [[send]] this card from your [[hand]] or [[field]] to the [[GY]]; place 1 "[[Barian's Seventh Untopia]]" from your hand or [[Main Deck|Deck]], [[face-up]] in your [[Field Zone]], also you cannot [[Special Summon]] from the [[Extra Deck]] until the end of your next [[turn]] after this [[effect]] [[resolve]]s, except [[Xyz Monster]]s. If an Xyz Monster(s) is Special Summoned, while this card is in your [[GY]] (except during the [[Damage Step]]): You can Special Summon this card, also you take no [[effect damage]] from your card [[effect]]s this [[turn]]. You can only use each effect of "Thousand Umbral Horror" [[once per turn]].
  | fr_text              = (Effet Rapide) : vous pouvez envoyer cette carte depuis votre main ou Terrain au Cimetière ; placez face recto 1 "Septième Antopie de Barian" depuis votre main ou Deck dans votre Zone Terrain, et aussi, vous ne pouvez pas Invoquer Spécialement (Monstres Xyz exclus) depuis l'Extra Deck jusqu'à la fin de votre prochain tour après la résolution de cet effet. Si un ou plusieurs Monstres Xyz sont Invoqués Spécialement, tant que cette carte est dans votre Cimetière (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte, et aussi, vous ne recevez aucun dommage d'effet de vos effets de carte ce tour. Vous ne pouvez utiliser chaque effet de "Horreur de l'Ombre Mille" qu'une fois par tour.
  | de_text              = (Schnelleffekt): Du kannst diese Karte von deiner Hand oder Spielfeldseite auf den Friedhof legen; lege 1 „Barians siebentes Untopia“ von deiner Hand oder deinem Deck offen in deine Spielfeldzone, zusätzlich kannst du bis zum Ende deines nächsten Spielzugs, nachdem dieser Effekt aufgelöst wurde, keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Xyz-Monstern. Falls ein oder mehr Xyz-Monster als Spezialbeschwörung beschworen werden, solange sich diese Karte in deinem Friedhof befindet (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung beschwören, zusätzlich erhältst du in diesem Spielzug keinen Effektschaden von deinen Karteneffekten. Du kannst jeden Effekt von „Tausend-Schattenhorror“ nur einmal pro Spielzug verwenden.
  | it_text              = (Effetto Rapido): puoi mandare questa carta dalla tua mano o Terreno al Cimitero; metti 1 "Untopia Settima di Barian" dalla tua mano o Deck, scoperta nella tua Zona Terreno, inoltre non puoi Evocare Specialmente dall'Extra Deck fino alla fine del tuo prossimo turno dopo che questo effetto si è risolto, eccetto Mostri Xyz. Se uno o più Mostri Xyz vengono Evocati Specialmente, mentre questa carta è nel tuo Cimitero (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta, inoltre non subisci danno da effetto dai tuoi effetti delle carte in questo turno. Puoi utilizzare ogni effetto di "Orrore Umbral Thousand" una sola volta per turno.
  | pt_text              = (Efeito Rápido): você pode enviar este card da sua mão ou do campo para o Cemitério; coloque 1 "Untopia de Barian do Sétimo" da sua mão ou do Deck, com a face para cima na sua Zona do Campo e, além disso, você não pode Invocar por Invocação-Especial do Deck Adicional até o final do seu próximo turno depois que este efeito resolver, exceto Monstros Xyz. Se um ou mais Monstros Xyz forem Invocados por Invocação-Especial enquanto este card estiver no seu Cemitério (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial e, além disso, você não sofre dano de efeito dos seus efeitos de card neste turno. Você só pode usar cada efeito de "Terror Umbral Mil" uma vez por turno.
  | es_text              = (Efecto Rápido): puedes mandar al Cementerio esta carta en tu mano o Campo; pon boca arriba en tu Zona del Campo 1 "Intopía Séptima de Barian" en tu mano o Deck, y además no puedes Invocar de Modo Especial desde el Deck Extra hasta el final de tu próximo turno después de que se resuelva este efecto, excepto Monstruos Xyz. Si uno o más Monstruos Xyz son Invocados de Modo Especial, mientras esta carta está en tu Cementerio (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial, y además no recibes daño de efecto de los efectos de tus cartas este turno. Sólo puedes usar cada efecto de "Horror de las Sombras a Miles" una vez por turno.
  | ja_text              = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分・相手ターンに、手札・フィールドのこのカードを墓地へ送って発動できる。手札・デッキから「七皇の冀望郷」１枚を自分のフィールドゾーンに表側表示で置く。この効果の発動後、次の自分ターンの終了時まで、自分はＸモンスターしかＥＸデッキから特殊召喚できない。②：このカードが墓地に存在する状態で、Ｘモンスターが特殊召喚された場合に発動できる。このカードを特殊召喚する。このターン、自分の効果で発生する自分への効果ダメージは０になる。
  | ko_text              = 
  | sc_text              = 此卡名的①②效果1回合仅可各使用1次。①：在自己・对手回合中，将手牌・场上的此卡送至墓地可以发动。从手牌・牌组将1张“巴利安之七皇冀望乡”以表侧表示放在自己的场地区域。此效果发动后，直至下个自己回合结束时为止自己从额外牌组仅可特殊召唤超量怪兽。②：此卡存在于墓地的状态下，超量怪兽被特殊召唤的情况下可以发动。将此卡特殊召唤。此回合，因自己的效果对自己造成的效果伤害变为0。
