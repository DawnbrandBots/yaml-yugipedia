  | text                = 1 [[Tuner]] + 1+ non-Tuners<br />If this card is [[Synchro Summon]]ed using a "[[Blackwing]]" [[monster]] as [[material]], it is treated as a [[Tuner]] while [[face-up]] on the [[field]]. After this card is Synchro Summoned, it gains [[ATK]] equal to the total [[original ATK]] of the [[Synchro Monster]]s used as material, until the end of this [[turn]]. Can [[attack]] all your opponent's monsters, once each. If this card attacks a [[Defense Position]] monster, inflict [[piercing]] [[battle damage]] to your opponent.
  | fr_text             = 1 Syntoniseur + 1+ non-Syntoniseur<br />Si cette carte est Invoquée par Synchronisation en utilisant un monstre "Aile Noire" comme Matériel, elle est traitée comme Syntoniseur tant qu'elle est face recto sur le Terrain. Après que cette carte est Invoquée par Synchronisation, elle gagne une ATK égale à la somme des ATK d'origine des Monstres Synchro utilisés comme Matériel, jusqu'à la fin de ce tour. Peut attaquer une fois tous les monstres de votre adversaire. Si cette carte attaque un monstre en Position de Défense, infligez des dommages de combat perçants à votre adversaire.
  | de_text             = 1 Empfänger + 1+ Nicht-Empfänger<br />Falls diese Karte als Synchrobeschwörung beschworen wird, indem ein „Schwarzflügel“-Monster als Material verwendet wird, wird sie als Empfänger behandelt, solange sie offen auf dem Spielfeld liegt. Nachdem diese Karte als Synchrobeschwörung beschworen wurde, erhält sie bis zum Ende dieses Spielzugs ATK in Höhe der Summe der Grund-ATK der Synchromonster, die als Material verwendet wurden. Kann alle Monster deines Gegners je einmal angreifen. Falls diese Karte ein Monster in Verteidigungsposition angreift, füge deinem Gegner durchschlagenden Kampfschaden zu.
  | it_text             = 1 Tuner + 1+ non-Tuner<br />Se questa carta viene Synchro Evocata utilizzando un mostro "Alanera" come materiale, viene considerata come un Tuner mentre è scoperta sul Terreno. Dopo che questa carta è stata Synchro Evocata, essa guadagna ATK pari alla somma degli ATK originali dei Mostri Synchro utilizzati come materiale, fino alla fine di questo turno. Può attaccare tutti i mostri del tuo avversario, una volta ciascuno. Se questa carta attacca un mostro in Posizione di Difesa, infliggi danno da combattimento perforante al tuo avversario.
  | pt_text             = 1 Regulador + 1+ não-Reguladores<br />Se este card for Invocado por Invocação-Sincro usando um monstro "Asanegra" como matéria, ele é considerado como um Regulador enquanto estiver com a face para cima no campo. Depois que este card for Invocado por Invocação-Sincro, ele ganha ATK igual à soma do ATK original dos Monstros Sincro usados como matéria, até o final deste turno. Pode atacar todos os monstros do seu oponente, uma vez cada. Se este card atacar um monstro em Posição de Defesa, cause dano de batalha perfurante ao seu oponente.
  | es_text             = 1 Cantante + 1+ no Cantantes<br />Si esta carta es Invocada por Sincronía usando un monstruo "Alanegra" como material, mientras esté boca arriba en el Campo se trata como Cantante. Después de que esta carta es Invocada por Sincronía, gana ATK igual al ATK original total de los Monstruos de Sincronía usados como material, hasta el final de este turno. Puede atacar a todos los monstruos de tu adversario, una vez a cada uno. Si esta carta ataca a un monstruo en Posición de Defensa, inflige daño de batalla de penetración a tu adversario.
  | ja_text             = チューナー＋チューナー以外のモンスター１体以上<br />①：「ＢＦ」モンスターを素材としてＳ召喚したこのカードはチューナーとして扱う。②：このカードがＳ召喚した時に適用する。このカードの攻撃力はターン終了時まで、そのＳ素材としたＳモンスターの元々の攻撃力の合計分アップする。③：このカードは相手モンスター全てに１回ずつ攻撃でき、守備表示モンスターを攻撃した場合、その守備力を攻撃力が超えた分だけ相手に戦闘ダメージを与える。
  | ko_text             = 튜너 ＋ 튜너 이외의 몬스터 1장 이상<br />①: "BF(블랙 페더)" 몬스터를 소재로서 싱크로 소환한 이 카드는 튜너로 취급한다. ②: 이 카드를 싱크로 소환했을 때에 적용한다. 이 카드의 공격력은 턴 종료시까지, 그 싱크로 소재로 한 싱크로 몬스터의 원래 공격력의 합계만큼 올린다. ③: 이 카드는 상대 몬스터 전부에 1회씩 공격할 수 있고, 수비 표시 몬스터를 공격했을 경우, 그 수비력을 공격력이 넘은 만큼만 상대에게 전투 데미지를 준다.
  | sc_text             = 协调＋协调以外的怪兽1只以上<br />①：以“黑羽”怪兽作为素材同步召唤的此卡视为协调。②：此卡同步召唤时适用。此卡的攻击力直至回合结束时为止，上升相当于作为其同步素材的同步怪兽的原本攻击力的合计数值。③：此卡可攻击所有对手怪兽各1次，攻击守备表示怪兽的情况下，依攻击力超出该怪兽守备力的数值来给予对手战斗伤害。
