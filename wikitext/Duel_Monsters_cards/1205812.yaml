  | text                 = 4 [[Level]] 5 [[monsters]]<br />[[Once per turn]] ([[Quick Effect]]): You can [[detach]] 1 [[material]] from this card, then [[target]] 1 card your opponent [[control]]s; [[destroy]] it. If this card [[battle]]s an opponent's monster, during [[damage calculation]]: This card's [[ATK]]/[[DEF]] become equal to that opponent's monster's ATK or DEF (whichever is higher) +100, during that damage calculation only. If this card destroys a monster [[destroyed by battle|by battle]]: [[Send]] 1 [[random]] card from your opponent's hand to the [[GY]], and if you do, halve your opponent's [[LP]].
  | fr_text              = 4 monstres de Niveau 5<br />Une fois par tour (Effet Rapide) : vous pouvez détacher 1 Matériel de cette carte, puis ciblez 1 carte contrôlée par votre adversaire ; détruisez-la. Si cette carte combat un monstre de l'adversaire, durant le calcul des dommages : durant ce calcul des dommages uniquement, l'ATK/DEF de cette carte deviennent égales à l'ATK ou DEF du monstre de l'adversaire (la plus haute valeur) +100. Si cette carte détruit un monstre au combat : envoyez 1 carte au hasard depuis la main de votre adversaire au Cimetière, et si vous le faites, divisez par deux les LP de votre adversaire.
  | de_text              = 4 Monster der Stufe 5<br />Einmal pro Spielzug (Schnelleffekt): Du kannst 1 Material von dieser Karte abhängen und dann 1 Karte wählen, die dein Gegner kontrolliert; zerstöre sie. Falls diese Karte gegen ein Monster eines Gegners kämpft, während der Schadensberechnung: Die ATK/DEF dieser Karte werden nur während jener Schadensberechnung gleich den ATK oder DEF jenes Monsters des Gegners (was davon höher ist) +100. Falls diese Karte ein Monster durch Kampf zerstört: Lege 1 zufällige Karte von der Hand deines Gegners auf den Friedhof und falls du dies tust, halbiere die LP deines Gegners.
  | it_text              = 4 mostri di Livello 5<br />Una volta per turno (Effetto Rapido): puoi staccare 1 materiale da questa carta, poi scegliere come bersaglio 1 carta controllata dal tuo avversario; distruggila. Se questa carta combatte con un mostro dell'avversario, durante il calcolo dei danni: gli ATK/DEF di questa carta diventano pari all'ATK o DEF di quel mostro dell'avversario (quello che è più alto) +100, solamente durante quel calcolo dei danni. Se questa carta distrugge un mostro in battaglia: manda 1 carta a caso dalla mano del tuo avversario al Cimitero e, se lo fai, dimezza i LP del tuo avversario.
  | pt_text              = 4 monstros de Nível 5<br />Uma vez por turno (Efeito Rápido): você pode desassociar 1 matéria deste card e, depois, escolha 1 card que seu oponente controla; destrua-o. Se este card batalhar um monstro do oponente, durante o cálculo de dano: o ATK/DEF deste card se tornam iguais ao ATK ou DEF desse monstro do oponente (o que for maior) +100, apenas durante esse cálculo de dano. Se este card destruir um monstro em batalha: envie 1 card aleatório da mão do seu oponente para o Cemitério e, se isso acontecer, diminua pela metade os PV do seu oponente.
  | es_text              = 4 monstruos de Nivel 5<br />Una vez por turno (Efecto Rápido): puedes desacoplar 1 material de esta carta, y después selecciona 1 carta que controle tu adversario; destrúyela. Si esta carta batalla con un monstruo del adversario, durante el cálculo de daño: el ATK/DEF de esta carta se convierten en iguales al ATK o DEF de ese monstruo del adversario (lo que sea mayor) +100, sólo durante ese cálculo de daño. Si esta carta destruye un monstruo en batalla: manda al Cementerio 1 carta al azar en la mano de tu adversario y, si lo haces, divide a la mitad los LP de tu adversario.
  | ja_text              = レベル５モンスター×４<br />①：自分・相手ターンに１度、このカードのＸ素材を１つ取り除き、相手フィールドのカード１枚を対象として発動できる。そのカードを破壊する。②：このカードが相手モンスターと戦闘を行うダメージ計算時に発動する。このカードの攻撃力・守備力はそのダメージ計算時のみ、その相手モンスターの攻撃力と守備力の内、高い方の数値＋１００になる。③：このカードが戦闘でモンスターを破壊した場合に発動する。相手の手札をランダムに１枚墓地へ送り、相手のＬＰを半分にする。
  | ko_text              = 
  | sc_text              = 等级5怪兽×4<br />①：在每个自己・对手回合中1次，去除此卡的1个超量素材，以对手场上的1张卡为对象可以发动。将该卡破坏。②：此卡与对手怪兽进行战斗的伤害计算时发动。此卡的攻击力・守备力仅在该伤害计算时，变为该对手怪兽的攻击力和守备力中较高一方＋100的数值。③：此卡战斗破坏怪兽的情况下发动。随机将对手的1张手牌送至墓地，将对手的LP改成一半。
