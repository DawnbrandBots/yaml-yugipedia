  | effect_types         = Continuous-like, Quick-like, Condition
  | text                 = While you have a "[[Toon]]" card in your [[field]] or [[GY]], your opponent must keep their [[hand]] revealed, also you can look at their [[Set]] cards at any time. If you have a [[Toon monster]] and a "Toon" [[Spell]] in your field and/or GY: You can [[declare]] 1 card name (you cannot declare a name whose effect has been [[activate]]d in a current [[Chain]]); until the end of this [[turn]] while this card is [[face-up]], [[negate]] the activated effects of cards with that original name. You can only use this effect of "Mind Scan" [[once per turn]].
  | fr_text              = Tant que vous avez une carte "Toon" dans votre Terrain ou Cimetière, votre adversaire doit garder sa main révélée, et aussi, vous pouvez regarder ses cartes Posées à tout moment. Si vous avez un monstre Toon et une Magie "Toon" dans votre Terrain et/ou Cimetière : vous pouvez déclarer 1 nom de carte (vous ne pouvez pas déclarer de nom dont l'effet a été activé dans une Chaîne actuelle) ; jusqu'à la fin de ce tour tant que cette carte est face recto, annulez les effets activés des cartes de ce nom d'origine. Vous ne pouvez utiliser cet effet de "Télépathie" qu'une fois par tour.
  | de_text              = Solange du eine „Toon“-Karte auf deiner Spielfeldseite oder in deinem Friedhof hast, muss dein Gegner mit vorgezeigter Hand spielen, zusätzlich kannst du dir seine gesetzten Karten jederzeit ansehen. Falls du ein Toon-Monster und einen „Toon“-Zauber auf deiner Spielfeldseite und/oder in deinem Friedhof hast: Du kannst 1 Kartennamen deklarieren (du kannst keinen Namen deklarieren, dessen Effekt in einer derzeitigen Kette aktiviert wurde); annulliere bis zum Ende dieses Spielzugs, solange diese Karte offen liegt, die aktivierten Effekte von Karten mit jenem Grund-Namen. Du kannst diesen Effekt von „Gedankenlesen“ nur einmal pro Spielzug verwenden.
  | it_text              = Mentre hai una carta "Toon" nel tuo Terreno o Cimitero, il tuo avversario deve tenere la sua mano rivelata, inoltre puoi guardare le sue carte Posizionate in qualsiasi momento. Se hai un mostro Toon e una Magia "Toon" nel tuo Terreno e/o Cimitero: puoi dichiarare il nome di 1 carta (non puoi dichiarare un nome il cui effetto è stato attivato nella Catena attuale); fino alla fine di questo turno mentre questa carta è scoperta, annulla gli effetti attivati delle carte con quel nome originale. Puoi utilizzare questo effetto di "Scansione Mentale" una sola volta per turno.
  | pt_text              = Enquanto você tiver um card "Toon" no seu campo ou Cemitério, seu oponente deve manter sua mão revelada e, além disso, você pode olhar os cards Baixados dele a qualquer momento. Se você tiver um monstro Toon e uma Magia "Toon" no seu campo e/ou Cemitério: você pode declarar o nome de 1 card (você não pode declarar um nome cujo efeito tenha sido ativado na Corrente atual); até o final deste turno enquanto este card estiver com a face para cima, negue os efeitos ativados dos cards com esse nome original. Você só pode usar este efeito de "Sondagem Mental" uma vez por turno.
  | es_text              = Mientras tengas una carta "Toon" en tu Campo o Cementerio, tu adversario debe mantener su mano mostrada, y además puedes mirar sus cartas Colocadas en cualquier momento. Si tienes un monstruo Toon y una Mágica "Toon" en tu Campo y/o Cementerio: puedes declarar 1 nombre de carta (no puedes declarar un nombre cuyo efecto haya sido activado en una Cadena vigente); hasta el final de este turno mientras esta carta esté boca arriba, niega los efectos activados de cartas con ese nombre original. Sólo puedes usar este efecto de "Escaneo Mental" una vez por turno.
  | ja_text              = このカード名の②の効果は１ターンに１度しか使用できない。①：自分のフィールドか墓地に「トゥーン」カードが存在する限り、相手は手札を全て公開し続け、自分は相手フィールドの裏側表示カードをいつでも確認できる。②：自分のフィールド・墓地にトゥーンモンスター及び「トゥーン」魔法カードが存在する場合、同一チェーン上で効果を発動していないカード名を１つ宣言して発動できる。このカードが表側表示で存在する間、ターン終了時まで宣言したカードと元々のカード名が同じカードが発動した効果は無効化される。
  | ko_text              = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신의 필드나 묘지에 "툰" 카드가 존재하는 한, 상대는 패를 전부 계속해서 공개하고, 자신은 상대 필드의 뒷면 표시 카드를 언제든지 확인할 수 있다. ②: 자신의 필드 / 묘지에 툰 몬스터 및 "툰" 마법 카드가 존재할 경우, 동일한 체인 위에서 효과를 발동하고 있지 않은 카드명을 1개 선언하고 발동할 수 있다. 이 카드가 앞면 표시로 존재하는 동안, 턴 종료시까지 선언한 카드와 원래의 카드명이 같은 카드가 발동한 효과는 무효화된다.
  | sc_text              = 此卡名的②效果1回合仅可使用1次。①：只要自己场上或墓地存在“卡通”卡，对手持续公开所有手牌，自己可随时确认对手场上的里侧表示卡。②：自己场上・墓地存在卡通怪兽及“卡通”魔法卡的情况下，宣言1个未在同一连锁上发动效果的卡名可以发动。在此卡以表侧表示存在的期间内，直至回合结束时为止，所宣言的卡及原本卡名相同的卡所发动的效果无效化。
