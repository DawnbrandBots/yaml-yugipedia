  | ja_text              = このカード名の②の効果は１ターンに１度しか使用できない。①：自分のフィールドか墓地に「トゥーン」カードが存在する限り、相手は手札を全て公開し続け、自分は相手フィールドの裏側表示カードをいつでも確認できる。②：自分のフィールド・墓地にトゥーンモンスター及び「トゥーン」魔法カードが存在する場合、同一チェーン上で効果を発動していないカード名を１つ宣言して発動できる。このカードが表側表示で存在する間、ターン終了時まで宣言したカードと元々のカード名が同じカードが発動した効果は無効化される。
  | ko_text              = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신의 필드나 묘지에 "툰" 카드가 존재하는 한, 상대는 패를 전부 계속해서 공개하고, 자신은 상대 필드의 뒷면 표시 카드를 언제든지 확인할 수 있다. ②: 자신의 필드 / 묘지에 툰 몬스터 및 "툰" 마법 카드가 존재할 경우, 동일한 체인 위에서 효과를 발동하고 있지 않은 카드명을 1개 선언하고 발동할 수 있다. 이 카드가 앞면 표시로 존재하는 동안, 턴 종료시까지 선언한 카드와 원래의 카드명이 같은 카드가 발동한 효과는 무효화된다.
  | sc_text              = 此卡名的②效果1回合仅可使用1次。①：只要自己场上或墓地存在“卡通”卡，对手持续公开所有手牌，自己可随时确认对手场上的里侧表示卡。②：自己场上・墓地存在卡通怪兽及“卡通”魔法卡的情况下，宣言1个未在同一连锁上发动效果的卡名可以发动。在此卡以表侧表示存在的期间内，直至回合结束时为止，所宣言的卡及原本卡名相同的卡所发动的效果无效化。
