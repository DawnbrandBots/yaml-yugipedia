  | pendulum_effect       = During your [[Main Phase]]: You can [[destroy]] this card, and if you do, [[add]] 1 [[Pendulum Monster]] with 1500 or less [[ATK]] from your [[Deck]] to your [[hand]], also for the rest of this [[turn]], you cannot [[activate]] monster [[effect]]s on the [[field]] until you [[Pendulum Summon]]. You can only use this effect of "Odd-Eyes Pendulum Dragon, Four Heavenly Dragons" [[once per turn]].
  | text                  = This Pendulum Summoned card gains these effects.<br />● Gains [[ATK]] equal to the difference in the [[Pendulum Scale]]s of the 2 cards in your [[Pendulum Zone]]s x 300.<br />● Any [[battle damage]] your opponent takes from [[battle]]s involving this card is doubled.<br />If this card in the [[Monster Zone]] is [[destroy]]ed by [[battle]] or card effect: You can add this card to your hand, then if it was destroyed by your opponent's card, you can [[Special Summon]] it. You can only use this effect of "Odd-Eyes Pendulum Dragon, Four Heavenly Dragons" once per turn.
  | fr_pendulum_effect    = Durant votre Main Phase : vous pouvez détruire cette carte, et si vous le faites, ajoutez 1 Monstre Pendule avec max. 1500 ATK depuis votre Deck à votre main, et aussi le reste de ce tour, vous ne pouvez pas activer d'effets de monstre sur le Terrain jusqu'à ce que vous Invoquiez par Pendulation. Vous ne pouvez utiliser cet effet de "Dragon Pendule aux Yeux Impairs, Quatre Dragons Divins" qu'une fois par tour.
  | fr_text               = Cette carte Invoquée par Pendulation gagne ces effets.<br />● Gagne une ATK égale à la différence des Échelles Pendule des 2 cartes dans vos Zones Pendule x 300.<br />● Les dommages de combat reçus par votre adversaire de combats impliquant cette carte sont doublés.<br />Si cette carte dans la Zone Monstre est détruite au combat ou par un effet de carte : vous pouvez ajouter cette carte à votre main, puis si elle a été détruite par une carte de votre adversaire, vous pouvez l'Invoquer Spécialement. Vous ne pouvez utiliser cet effet de "Dragon Pendule aux Yeux Impairs, Quatre Dragons Divins" qu'une fois par tour.
  | de_pendulum_effect    = Während deiner Main Phase: Du kannst diese Karte zerstören und falls du dies tust, füge deiner Hand 1 Pendelmonster mit 1500 oder weniger ATK von deinem Deck hinzu, zusätzlich kannst du für den Rest dieses Spielzugs keine Monstereffekte auf dem Spielfeld aktivieren, bis du eine Pendelbeschwörung durchgeführt hast. Du kannst diesen Effekt von „Buntäugiger Pendeldrache, vier himmlische Drachen“ nur einmal pro Spielzug verwenden.
  | de_text               = Diese als Pendelbeschwörung beschworene Karte erhält diese Effekte.<br />● Erhält ATK in Höhe der Differenz der Pendelbereiche der 2 Karten in deinen Pendelzonen x 300.<br />● Kampfschaden, den dein Gegner aus Kämpfen erhält, an denen diese Karte beteiligt ist, wird verdoppelt.<br />Falls diese Karte in der Monsterzone durch Kampf oder einen Karteneffekt zerstört wird: Du kannst diese Karte deiner Hand hinzufügen, dann, falls sie durch eine Karte deines Gegners zerstört wurde, kannst du sie als Spezialbeschwörung beschwören. Du kannst diesen Effekt von „Buntäugiger Pendeldrache, vier himmlische Drachen“ nur einmal pro Spielzug verwenden.
  | it_pendulum_effect    = Durante la tua Main Phase: puoi distruggere questa carta e, se lo fai, aggiungi 1 Mostro Pendulum con ATK 1500 o inferiore dal tuo Deck alla tua mano, inoltre per il resto di questo turno, non puoi attivare effetti di mostri sul Terreno fino a quando Evochi Pendulum. Puoi utilizzare questo effetto di "Drago Pendulum Occhi Diversi, Quattro Draghi Celestiali" una sola volta per turno.
  | it_text               = Questa carta Evocata Pendulum guadagna questi effetti.<br />● Guadagna ATK pari alla differenza tra i Valori Pendulum delle 2 carte nelle tue Zone Pendulum x 300.<br />● Qualsiasi danno da combattimento che il tuo avversario subisce da battaglie che coinvolgono questa carta viene raddoppiato.<br />Se questa carta nella Zona Mostri viene distrutta in battaglia o dall'effetto di una carta: puoi aggiungere questa carta alla tua mano, poi se è stata distrutta da una carta del tuo avversario, puoi Evocarla Specialmente. Puoi utilizzare questo effetto di "Drago Pendulum Occhi Diversi, Quattro Draghi Celestiali" una sola volta per turno.
  | pt_pendulum_effect    = Durante sua Fase Principal: você pode destruir este card e, se isso acontecer, adicione 1 Monstro Pêndulo com 1500 ou menos de ATK do seu Deck à sua mão e, além disso, pelo resto deste turno, você não pode ativar efeitos de monstro no campo até Invocar por Invocação-Pêndulo. Você só pode usar este efeito de "Dragão Pêndulo de Olhos Anômalos, os Quatro Dragões Celestiais" uma vez por turno.
  | pt_text               = Este card Invocado por Invocação-Pêndulo ganha esses efeitos.<br />● Ganha ATK igual à diferença nas Escalas de Pêndulo dos 2 cards nas suas Zonas de Pêndulo x 300.<br />● Qualquer dano de batalha que seu oponente sofrer das batalhas envolvendo este card é dobrado.<br />Se este card na Zona de Monstros for destruído em batalha ou por um efeito de card: você pode adicionar este card à sua mão e, depois, se ele foi destruído por um card do seu oponente, você pode Invocá-lo por Invocação-Especial. Você só pode usar este efeito de "Dragão Pêndulo de Olhos Anômalos, os Quatro Dragões Celestiais" uma vez por turno.
  | es_pendulum_effect    = Durante tu Main Phase: puedes destruir esta carta y, si lo haces, añade a tu mano 1 Monstruo de Péndulo con 1500 ATK o menos en tu Deck, y además por el resto de este turno no puedes activar efectos de monstruos en el Campo hasta que Invoques por Péndulo. Sólo puedes usar este efecto de "Dragón de Péndulo de Ojos Anómalos, Cuatro Dragones Celestiales" una vez por turno.
  | es_text               = Esta carta Invocada por Péndulo gana estos efectos.<br />● Gana ATK igual a la diferencia en las Escalas de Péndulo de las 2 cartas en tus Zonas de Péndulo x 300.<br />● Cualquier daño de batalla que reciba tu adversario de batallas que involucren esta carta se duplica.<br />Si esta carta en la Zona de Monstruos es destruida en batalla o por el efecto de una carta: puedes añadir esta carta a tu mano y después, si fue destruida por una carta de tu adversario, puedes Invocarla de Modo Especial. Sólo puedes usar este efecto de "Dragón de Péndulo de Ojos Anómalos, Cuatro Dragones Celestiales" una vez por turno.
  | ja_pendulum_effect    = このカード名のＰ効果は１ターンに１度しか使用できない。①：自分メインフェイズに発動できる。このカードを破壊し、デッキから攻撃力１５００以下のＰモンスター１体を手札に加える。このターン自分はＰ召喚に成功しない限り、フィールドのモンスターの効果を発動できない。
  | ja_text               = このカード名の②のモンスター効果は１ターンに１度しか使用できない。①：Ｐ召喚したこのカードは以下の効果を得る。●自分のＰゾーンにカードが２枚存在する限り、そのＰスケールの差×３００だけ、このカードの攻撃力はアップする。●このカードの戦闘で発生する相手への戦闘ダメージは倍になる。②：モンスターゾーンのこのカードが戦闘・効果で破壊された場合に発動できる。このカードを手札に加える。このカードが相手によって破壊されていた場合、さらにこのカードを特殊召喚できる。
  | ko_pendulum_effect    = 이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다. ①: 자신 메인 페이즈에 발동할 수 있다. 이 카드를 파괴하고, 덱에서 공격력 1500 이하인 펜듈럼 몬스터 1장을 패에 넣는다. 이 턴에 자신은 펜듈럼 소환에 성공하지 않는 한, 필드의 몬스터의 효과를 발동할 수 없다.
  | ko_text               = 이 카드명의 ②의 몬스터 효과는 1턴에 1번밖에 사용할 수 없다. ①: 펜듈럼 소환한 이 카드는 이하의 효과를 얻는다. ●자신의 펜듈럼 존에 카드가 2장 존재하는 한, 그 펜듈럼 스케일의 차 × 300 만큼, 이 카드의 공격력을 올린다. ●이 카드의 전투로 발생하는 상대에게로의 전투 데미지는 배가 된다. ②: 몬스터 존의 이 카드가 전투 / 효과로 파괴되었을 경우에 발동할 수 있다. 이 카드를 패에 넣는다. 이 카드가 상대에 의해 파괴되어 있었을 경우, 추가로 이 카드를 특수 소환할 수 있다.
  | sc_pendulum_effect    = 此卡名的灵摆效果1回合仅可使用1次。①：在自己的主要阶段可以发动。将此卡破坏，从牌组将1只攻击力1500以下的灵摆怪兽加入手牌。此回合，自己只要未灵摆召唤成功，则不可发动场上怪兽的效果。
  | sc_text               = 此卡名的②怪兽效果1回合仅可使用1次。①：灵摆召唤的此卡获得以下效果。<br />●只要自己的灵摆区域存在2张卡，此卡攻击力上升其灵摆刻度的差值×300的数值。<br />●因此卡的战斗对对手造成的战斗伤害变为两倍。<br />②：怪兽区域的此卡因战斗・效果被破坏的情况下可以发动。将此卡加入手牌。此卡是被对手破坏的情况下，进而可将此卡特殊召唤。
