  | text                = "[[Blue-Eyes Toon Dragon]]" + 2 [[Toon monster]]s<br />Must be [[Special Summon]]ed (from your [[Extra Deck]]) by [[shuffling]] the above cards from your [[hand]], [[field]], and/or [[GY]] into the [[Main Deck|Deck]]/[[Extra Deck]]. Your Toon monsters can [[attack directly]]. [[Once per turn]], during your [[Main Phase]]: You can [[Add a card|add]] 1 "[[Toon]]" card, or 1 card that mentions a "Toon" card by name, from your GY to your hand. If your Toon monster is [[attack]]ed, during [[damage calculation]]: You can [[banish]] it until the end of the [[Damage Step]].
  | fr_text             = "Dragon Toon aux Yeux Bleus" + 2 monstres Toon<br />Uniquement Invocable Spécialement (depuis votre Extra Deck) en mélangeant les cartes ci-dessus depuis votre main, Terrain et/ou Cimetière dans le Deck/Extra Deck. Vos monstres Toon peuvent attaquer directement. Une fois par tour, durant votre Main Phase : vous pouvez ajouter 1 carte "Toon", ou 1 carte qui mentionne nommément une carte "Toon", depuis votre Cimetière à votre main. Si votre monstre Toon est attaqué, durant le calcul des dommages : jusqu'à la fin de la Damage Step, vous pouvez le bannir.
  | de_text             = „Blauäugiger Toon-Drache“ + 2 Toon-Monster<br />Muss als Spezialbeschwörung (von deinem Extra Deck) beschworen werden, indem du die oben aufgeführten Karten von deiner Hand, deiner Spielfeldseite und/oder deinem Friedhof ins Deck / Extra Deck mischst. Deine Toon-Monster können direkt angreifen. Einmal pro Spielzug, während deiner Main Phase: Du kannst deiner Hand 1 „Toon“-Karte oder 1 Karte, die den Namen einer „Toon“-Karte erwähnt, von deinem Friedhof hinzufügen. Falls dein Toon-Monster angegriffen wird, während der Schadensberechnung: Du kannst es bis zum Ende des Damage Steps verbannen.
  | it_text             = "Drago Toon Occhi Blu" + 2 mostri Toon<br />Deve essere Evocato Specialmente (dal tuo Extra Deck) mischiando le carte sopra indicate dalla tua mano, Terreno e/o Cimitero nel Deck/Extra Deck. I tuoi mostri Toon possono attaccare direttamente. Una volta per turno, durante la tua Main Phase: puoi aggiungere 1 carta "Toon", o 1 carta che menziona una carta "Toon" per nome, dal tuo Cimitero alla tua mano. Se un tuo mostro Toon viene attaccato, durante il calcolo dei danni: puoi bandirlo fino alla fine del Damage Step.
  | pt_text             = "Dragão Toon de Olhos Azuis" + 2 monstros Toon<br />Deve ser Invocado por Invocação-Especial (do seu Deck Adicional) ao embaralhar no Deck/Deck Adicional os cards acima da sua mão, do campo e/ou do Cemitério. Seus monstros Toon podem atacar diretamente. Uma vez por turno, durante sua Fase Principal: você pode adicionar 1 card "Toon", ou 1 card que mencione um card "Toon" pelo nome, do seu Cemitério à sua mão. Se um monstro Toon seu for atacado, durante o cálculo de dano: você pode bani-lo até o final da Etapa de Dano.
  | es_text             = "Dragón Toon de Ojos Azules" + 2 monstruos Toon<br />Debe ser Invocado de Modo Especial (desde tu Deck Extra) barajando al Deck/Deck Extra las cartas mencionadas arriba en tu mano, Campo y/o Cementerio. Tus monstruos Toon pueden atacar directamente. Una vez por turno, durante tu Main Phase: puedes añadir a tu mano 1 carta "Toon", o 1 carta que mencione una carta "Toon" por su nombre, en tu Cementerio. Si tu monstruo Toon es atacado, durante el cálculo de daño: puedes desterrarlo hasta el final del Damage Step.
  | ja_text             = 「ブルーアイズ・トゥーン・ドラゴン」＋トゥーンモンスター×２<br />自分の手札・フィールド・墓地の上記のカードをデッキ・ＥＸデッキに戻した場合のみ特殊召喚できる。①：自分のトゥーンモンスターは直接攻撃できる。②：１ターンに１度、自分メインフェイズに発動できる。「トゥーン」カードまたはそのカード名が記されたカード１枚を自分の墓地から手札に加える。③：自分のトゥーンモンスターが攻撃されるダメージ計算時に発動できる。そのモンスターをダメージステップ終了時まで除外する。
  | ko_text             = "푸른 눈의 툰 드래곤" ＋ 툰 몬스터 × 2<br />자신의 패 / 필드 / 묘지의 상기의 카드를 덱 / 엑스트라 덱으로 되돌렸을 경우에만 특수 소환할 수 있다. ①: 자신의 툰 몬스터는 직접 공격할 수 있다. ②: 1턴에 1번, 자신 메인 페이즈에 발동할 수 있다. "툰" 카드 또는 그 카드명이 쓰여진 카드 1장을 자신의 묘지에서 패에 넣는다. ③: 자신의 툰 몬스터가 공격받는 데미지 계산시에 발동할 수 있다. 그 몬스터를 데미지 스텝 종료시까지 제외한다.
  | sc_text             = “青眼卡通龙”＋卡通怪兽×2<br />仅可在将自己手牌・场上・墓地的上述卡放回牌组・额外牌组的情况下特殊召唤。①：自己的卡通怪兽可直接攻击。②：1回合1次，在自己的主要阶段可以发动。从自己墓地将1张“卡通”卡或记载有该卡名的卡加入手牌。③：自己的卡通怪兽被攻击的伤害计算时可以发动。将该怪兽直至伤害步骤结束时为止除外。
