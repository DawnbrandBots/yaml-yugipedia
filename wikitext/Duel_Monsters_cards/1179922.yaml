  | ja_text             = 「ブルーアイズ・トゥーン・ドラゴン」＋トゥーンモンスター×２<br />自分の手札・フィールド・墓地の上記のカードをデッキ・ＥＸデッキに戻した場合のみ特殊召喚できる。①：自分のトゥーンモンスターは直接攻撃できる。②：１ターンに１度、自分メインフェイズに発動できる。「トゥーン」カードまたはそのカード名が記されたカード１枚を自分の墓地から手札に加える。③：自分のトゥーンモンスターが攻撃されるダメージ計算時に発動できる。そのモンスターをダメージステップ終了時まで除外する。
  | ko_text             = "푸른 눈의 툰 드래곤" ＋ 툰 몬스터 × 2<br />자신의 패 / 필드 / 묘지의 상기의 카드를 덱 / 엑스트라 덱으로 되돌렸을 경우에만 특수 소환할 수 있다. ①: 자신의 툰 몬스터는 직접 공격할 수 있다. ②: 1턴에 1번, 자신 메인 페이즈에 발동할 수 있다. "툰" 카드 또는 그 카드명이 쓰여진 카드 1장을 자신의 묘지에서 패에 넣는다. ③: 자신의 툰 몬스터가 공격받는 데미지 계산시에 발동할 수 있다. 그 몬스터를 데미지 스텝 종료시까지 제외한다.
  | sc_text             = “青眼卡通龙”＋卡通怪兽×2<br />仅可在将自己手牌・场上・墓地的上述卡放回牌组・额外牌组的情况下特殊召唤。①：自己的卡通怪兽可直接攻击。②：1回合1次，在自己的主要阶段可以发动。从自己墓地将1张“卡通”卡或记载有该卡名的卡加入手牌。③：自己的卡通怪兽被攻击的伤害计算时可以发动。将该怪兽直至伤害步骤结束时为止除外。
