  | sc_pendulum_effect    = 此卡名的灵摆效果1回合仅可使用1次。①：在自己的主要阶段可以发动。从牌组将灵摆怪兽以外的1张“小丑戏帮”卡送至墓地，将此卡特殊召唤。此效果发动后，直至下个回合结束时为止，自己不可发动被从牌组・额外牌组特殊召唤的怪兽的效果。
  | sc_text               = ①：只要自己场上存在上级召唤的怪兽，对手场上的怪兽的守备力下降1500。②：此卡被解放的情况下，可从以下效果中选择1个发动（此卡名的以下效果1回合仅可各选择1次）。<br />●将双方额外牌组（表侧）・场上的灵摆怪兽全部放回牌组。<br />●从牌组・额外牌组将灵摆怪兽以外的1只“小丑戏帮”怪兽无视召唤条件特殊召唤。
