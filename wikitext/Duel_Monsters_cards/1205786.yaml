  | ja_text               = チューナー＋チューナー以外のモンスター１体以上<br />このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードがＳ召喚した場合、手札を１枚捨てて発動できる。相手のフィールド・墓地からカード２枚を除外する。②：相手がモンスターを特殊召喚した場合、手札を１枚除外して発動できる。自分か相手のフィールド・墓地からカード１枚を手札に戻す。③：Ｓ召喚したこのカードが相手ターンに墓地へ送られた場合に発動できる。相手の手札・フィールド・墓地からカード１枚を除外する（手札からはランダムに選ぶ）。
  | ko_text               = 튜너 ＋ 튜너 이외의 몬스터 1장 이상<br />이 카드명의 ①②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 이 카드를 싱크로 소환했을 경우, 패를 1장 버리고 발동할 수 있다. 상대의 필드 / 묘지에서 카드 2장을 제외한다. ②: 상대가 몬스터를 특수 소환했을 경우, 패를 1장 제외하고 발동할 수 있다. 자신이나 상대의 필드 / 묘지에서 카드 1장을 패로 되돌린다. ③: 싱크로 소환한 이 카드가 상대 턴에 묘지로 보내졌을 경우에 발동할 수 있다. 상대의 패 / 필드 / 묘지에서 카드 1장을 제외한다(패에서는 무작위로 고른다).
  | sc_text               = 协调＋协调以外的怪兽1只以上<br />此卡名的①②③效果1回合仅可各使用1次。①：此卡同步召唤的情况下，舍弃1张手牌可以发动。从对手场上・墓地将2张卡除外。②：对手将怪兽特殊召唤的情况下，将1张手牌除外可以发动。从自己或对手的、场上・墓地将1张卡放回手牌。③：同步召唤的此卡在对手回合中被送至墓地的情况下可以发动。从对手手牌・场上・墓地将1张卡除外（从手牌是随机挑选）。
