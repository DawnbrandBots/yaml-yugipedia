  | text                  = "[[Red-Eyes Black Dragon]]" + 1 [[monster]] that mentions "[[Dark Time Wizard]]"<br />Must be either [[Fusion Summon]]ed, or [[Special Summon]]ed (from your [[Extra Deck]]) by [[Tributing]] 1 [[face-up]] monster on either [[field]] during the [[turn]] a monster was destroyed by the [[effect]] of "[[Dark Time Wizard]]". You can only Special Summon "Red-Eyes Black Dragon Exceed" once per turn this way, no matter which method you use. [[Unaffected]] by your opponent's activated Spell or monster effects. If this card is Special Summoned: You can Special Summon 1 [[Level]] 8 or lower monster from your [[hand]] or [[GY]].
  | fr_text               = "Dragon Noir aux Yeux Rouges" + 1 monstre qui mentionne "Magicien du Temps des Ténèbres"<br />Uniquement soit Invocable par Fusion, soit Invocable Spécialement (depuis votre Extra Deck) en Sacrifiant 1 monstre face recto sur l'un des Terrains durant le tour où un monstre a été détruit par l'effet de "Magicien du Temps des Ténèbres". Vous ne pouvez Invoquer Spécialement "Dragon Noir aux Yeux Rouges du Dépassement" qu'une fois par tour de cette façon, peu importe la méthode que vous utilisez. Non affectée par les effets de Magie ou monstre activés de votre adversaire. Si cette carte est Invoquée Spécialement : vous pouvez Invoquer Spécialement 1 monstre de max. Niveau 8 depuis votre main ou Cimetière.
  | de_text               = „Rotäugiger schwarzer Drache“ + 1 Monster, das „Dunkler Zeitzauberer“ erwähnt<br />Muss entweder als Fusionsbeschwörung beschworen werden oder als Spezialbeschwörung (von deinem Extra Deck) beschworen werden, indem du während des Spielzugs, in dem ein Monster durch den Effekt von „Dunkler Zeitzauberer“ zerstört wurde, 1 offenes Monster von einer beliebigen Spielfeldseite als Tribut anbietest. Du kannst „Rotäugiger schwarzer Drache Überschreiter“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören, egal welche Methode du verwendest. Bleibt von aktivierten Zauber- und Monstereffekten deines Gegners unberührt. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst 1 Monster der Stufe 8 oder niedriger als Spezialbeschwörung von deiner Hand oder deinem Friedhof beschwören.
  | it_text               = "Drago Nero Occhi Rossi" + 1 mostro che menziona "Stregone del Tempo Oscuro"<br />Deve essere Evocato tramite Fusione, oppure Evocato Specialmente (dal tuo Extra Deck) offrendo come Tributo 1 mostro scoperto su qualsiasi Terreno durante un turno in cui un mostro è stato distrutto dall'effetto di "Stregone del Tempo Oscuro". Puoi Evocare Specialmente "Drago Nero Occhi Rossi Exceed" una sola volta per turno in questo modo, indipendentemente da quale metodo utilizzi. Immune agli effetti attivati delle Magie e dei mostri del tuo avversario. Se questa carta viene Evocata Specialmente: puoi Evocare Specialmente 1 mostro di Livello 8 o inferiore dalla tua mano o Cimitero.
  | pt_text               = "Dragão Negro de Olhos Vermelhos" + 1 monstro que mencione "Mago do Tempo Negro"<br />Deve ser Invocado por Invocação-Fusão, ou por Invocação-Especial (do seu Deck Adicional) ao oferecer como Tributo 1 monstro com a face para cima em qualquer campo durante o turno em que um monstro foi destruído pelo efeito de "Mago do Tempo Negro". Você só pode Invocar "Dragão Negro de Olhos Vermelhos Ultrapassado" por Invocação-Especial uma vez por turno desta forma, não importa o método que usar. Não é afetado pelas Magias ativadas ou efeitos de monstro do seu oponente. Se este card for Invocado por Invocação-Especial: você pode Invocar por Invocação-Especial 1 monstro de Nível 8 ou menos da sua mão ou do Cemitério.
  | es_text               = "Dragón Negro de Ojos Rojos" + 1 monstruo que mencione "Mago del Tiempo Oscuro"<br />Debe ser ya sea Invocado por Fusión, o Invocado de Modo Especial (desde tu Deck Extra) Sacrificando 1 monstruo boca arriba en cualquier Campo durante el turno en el que un monstruo fue destruido por el efecto de "Mago del Tiempo Oscuro". Sólo puedes Invocar de Modo Especial "Dragón Negro de Ojos Rojos Superado" una vez por turno de esta forma, sin importar el método que uses. No es afectado por los efectos activados de Mágicas o monstruos de tu adversario. Si esta carta es Invocada de Modo Especial: puedes Invocar de Modo Especial 1 monstruo de Nivel 8 o menor desde tu mano o Cementerio.
  | ja_text               = 「真紅眼の黒竜」＋「時の黒魔術師」のカード名が記されたモンスター<br />「真紅眼の超越黒竜」は１ターンに１度、融合召喚及び以下の方法でのみ特殊召喚できる。●「時の黒魔術師」の効果でモンスターが破壊されたターン、自分・相手フィールドの表側表示モンスター１体をリリースした場合にＥＸデッキから特殊召喚できる。①：このカードが特殊召喚した場合に発動できる。自分の手札・墓地からレベル８以下のモンスター１体を特殊召喚する。②：フィールドのこのカードは相手が発動した魔法・モンスターの効果を受けない。
