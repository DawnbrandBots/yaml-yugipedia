  | text                 = If this card you [[control]] would be used as [[Synchro Material]], you can treat it as a non-[[Tuner]]. If this card is [[Normal Summon|Normal]] or [[Special Summon]]ed: You can Special Summon 1 "Chaospawn Bishop" from your [[hand]], [[Deck]], or [[GY]], and if you do, it becomes [[LIGHT]], also for the rest of this turn, you cannot Special Summon, except LIGHT or [[DARK]] monsters, and you cannot Special Summon from the [[Extra Deck]], except [[Synchro Monster]]s. You can only use this effect of "Chaospawn Bishop" [[once per turn]].
  | fr_text              = Si cette carte que vous contrôlez va être utilisée comme Matériel Synchro, vous pouvez la traiter comme non-Syntoniseur. Si cette carte est Invoquée Normalement ou Spécialement : vous pouvez Invoquer Spécialement 1 "Fou Engendré du Chaos" depuis votre main, Deck ou Cimetière, et si vous le faites, il devient LUMIÈRE, et aussi, le reste de ce tour, vous ne pouvez pas Invoquer Spécialement (monstres LUMIÈRE ou TÉNÈBRES exclus), et vous ne pouvez pas Invoquer Spécialement (Monstres Synchro exclus) depuis l'Extra Deck. Vous ne pouvez utiliser cet effet de "Fou Engendré du Chaos" qu'une fois par tour.
  | de_text              = Falls diese Karte, die du kontrollierst, als Synchromaterial verwendet würde, kannst du sie als Nicht-Empfänger behandeln. Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird: Du kannst 1 „Chaosbrut Läufer“ als Spezialbeschwörung von deiner Hand, deinem Deck oder deinem Friedhof beschwören und falls du dies tust, wird er zu LICHT, zusätzlich, für den Rest dieses Spielzugs, kannst du keine Spezialbeschwörungen durchführen, außer von LICHT und FINSTERNIS Monstern, und du kannst keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Synchromonstern. Du kannst diesen Effekt von „Chaosbrut Läufer“ nur einmal pro Spielzug verwenden.
  | it_text              = Se questa carta che controlli sta per essere utilizzata come Materiale Synchro, puoi considerarla come un non-Tuner. Se questa carta viene Evocata Normalmente o Specialmente: puoi Evocare Specialmente 1 "Alfiere Progenie del Chaos" dalla tua mano, Deck o Cimitero e, se lo fai, esso diventa LUCE, inoltre per il resto di questo turno, non puoi Evocare Specialmente, eccetto mostri LUCE o OSCURITÀ, e non puoi Evocare Specialmente dall'Extra Deck, eccetto Mostri Synchro. Puoi utilizzare questo effetto di "Alfiere Progenie del Chaos" una sola volta per turno.
  | pt_text              = Se este card que você controla seria usado como Matéria Sincro, você pode considerá-lo como um não-Regulador. Se este card for Invocado por Invocação-Normal ou Especial: você pode Invocar por Invocação-Especial 1 "Bispo da Prole do Caos" da sua mão, do Deck ou do Cemitério e, se isso acontecer, ele se torna de LUZ e, além disso, pelo resto deste turno, você não pode Invocar por Invocação-Especial, exceto monstros de LUZ ou de TREVAS, e você não pode Invocar por Invocação-Especial do Deck Adicional, exceto Monstros Sincro. Você só pode usar este efeito de "Bispo da Prole do Caos" uma vez por turno.
  | es_text              = Si esta carta que controlas fuera a ser usada como Material de Sincronía, puedes tratarla como no Cantante. Si esta carta es Invocada de Modo Normal o Especial: puedes Invocar de Modo Especial 1 "Alfil Caosgendro" desde tu mano, Deck o Cementerio y, si lo haces, éste se convierte en de LUZ y además, por el resto de este turno, no puedes Invocar de Modo Especial, excepto monstruos de LUZ u OSCURIDAD, y no puedes Invocar de Modo Especial desde el Deck Extra, excepto Monstruos de Sincronía. Sólo puedes usar este efecto de "Alfil Caosgendro" una vez por turno.
