  | text                 = You can [[Ritual Summon]] this card with an "[[End of the World (archetype)|End of the World]]" card. This card's name becomes "[[Demise, King of Armageddon]]" while in the [[hand]] or on the [[field]]. You can only use each of the following [[effect]]s of "Ruler of the End of the World" [[once per turn]]. You can [[reveal]] this card in your hand, [[pay]] 2000 [[LP]], then [[banish]] 1 [[Ritual Spell]] from your [[Main Deck|Deck]]; apply that card's activation effect that [[Ritual Summon]]s a [[monster]]. You can pay 2000 LP; [[destroy]] all other cards on the field, then this card gains 2900 [[ATK]].
  | fr_text              = Vous pouvez Invoquer Rituellement cette carte avec une carte "Fin du Monde". Le nom de cette carte devient "Peine, Roi de l'Armageddon" tant qu'elle est dans la main ou sur le Terrain. Vous ne pouvez utiliser chacun des effets suivants de "Maître de la Fin du Monde" qu'une fois par tour. Vous pouvez révéler cette carte dans votre main, payez 2000 LP, puis bannissez 1 Magie Rituelle depuis votre Deck ; appliquez l'effet d'activation de la carte qui Invoque Rituellement un monstre. Vous pouvez payer 2000 LP ; détruisez toutes les autres cartes sur le Terrain, puis cette carte gagne 2900 ATK.
  | de_text              = Du kannst diese Karte mit einer „Ende der Welt“-Karte als Ritualbeschwörung beschwören. Der Name dieser Karte wird zu „Demise, König des Jüngsten Tages“, solange sie sich in der Hand oder auf dem Spielfeld befindet. Du kannst jeden der folgenden Effekte von „Herrscher vom Ende der Welt“ nur einmal pro Spielzug verwenden. Du kannst diese Karte in deiner Hand vorzeigen, 2000 LP zahlen und dann 1 Ritualzauber von deinem Deck verbannen; führe den Aktivierungseffekt jener Karte aus, der ein Monster als Ritualbeschwörung beschwört. Du kannst 2000 LP zahlen; zerstöre alle anderen Karten auf dem Spielfeld, dann erhält diese Karte 2900 ATK.
  | it_text              = Puoi Evocare tramite Rituale questa carta con una carta "Fine del Mondo". Il nome di questa carta diventa "Demise, Re dell'Armageddon" mentre è nella mano o sul Terreno. Puoi utilizzare ognuno dei seguenti effetti di "Sovrano della Fine del Mondo" una sola volta per turno. Puoi rivelare questa carta nella tua mano, pagare 2000 LP, poi bandire 1 Magia Rituale dal tuo Deck; applica l'effetto dell'attivazione di quella carta che Evoca tramite Rituale un mostro. Puoi pagare 2000 LP; distruggi tutte le altre carte sul Terreno, poi questa carta guadagna 2900 ATK.
  | pt_text              = Você pode Invocar este card por Invocação-Ritual com um card "Fim do Mundo". O nome deste card se torna "Demise, o Rei do Armagedom" enquanto estiver na mão ou no campo. Você só pode usar cada um dos seguintes efeitos de "Governante do Fim do Mundo" uma vez por turno. Você pode revelar este card na sua mão, pagar 2000 PV e, depois, banir 1 Magia de Ritual do seu Deck; aplique o efeito de ativação desse card que Invoca um monstro por Invocação-Ritual. Você pode pagar 2000 PV; destrua todos os outros cards no campo e, depois, este card ganha 2900 de ATK.
  | es_text              = Puedes Invocar esta carta por Ritual con una carta "Fin del Mundo". El nombre de esta carta se convierte en "Demise, Rey del Armagedón" mientras esté en la mano o en el Campo. Sólo puedes usar cada uno de los siguientes efectos de "Gobernador del Fin del Mundo" una vez por turno. Puedes mostrar esta carta en tu mano, pagar 2000 LP, y después destierra 1 Mágica de Ritual en tu Deck; aplica el efecto de activación de esa carta que Invoca un monstruo por Ritual. Puedes pagar 2000 LP; destruye todas las demás cartas en el Campo, y después esta carta gana 2900 ATK.
  | ja_text              = 「エンド・オブ・ザ・ワールド」カードにより降臨<br />このカード名の②③の効果はそれぞれ１ターンに１度しか使用できない。①：このカードのカード名は、手札・フィールドに存在する限り「終焉の王デミス」として扱う。②：手札のこのカードを相手に見せ、２０００ＬＰを払い、デッキから儀式魔法カード１枚を除外して発動できる。その儀式魔法カード発動時の儀式召喚する効果を適用する。③：２０００ＬＰを払って発動できる。フィールドの他のカードを全て破壊する。その後、このカードの攻撃力は２９００アップする。
  | ko_text              = 
  | sc_text              = 以“世界终灭”卡降临<br />此卡名的②③效果1回合仅可各使用1次。①：此卡只要存在于手牌・场上，卡名视为“终焉之王 迪米斯”。②：向对手出示手牌的此卡，支付2000LP，从牌组将1张仪式魔法卡除外可以发动。适用该仪式魔法卡发动时的仪式召唤的效果。③：支付2000LP可以发动。将场上的其他卡全部破坏。然后，此卡的攻击力上升2900。
