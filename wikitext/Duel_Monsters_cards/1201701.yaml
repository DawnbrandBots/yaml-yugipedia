  | text                  = While a [[monster]] that mentions "Atlantis, City of the Sea Dragon" is on the [[field]], the [[Level]]s of all monsters in both players' [[hand]]s and on the [[field]] are reduced by 1. When you [[Link Summon]] a "[[Daedalus]]" [[Link Monster]], you can reduce the total number of [[material]]s by 1 (from [[Link Rating]] and from mentioned materials). If this card is in your [[GY]] and you [[control]] "[[Umi]]": You can place this card [[face-up]] on your field. You can only use this effect of "Atlantis, City of the Sea Dragon" once per turn.
  | fr_text               = Tant qu'un monstre qui mentionne "Atlantis, Cité du Dragon des Mers" est sur le Terrain, le Niveau de tous les monstres dans la main de chaque joueur et sur le Terrain est réduit de 1. Lorsque vous Invoquez par Lien un Monstre Lien "Dédale", vous pouvez réduire de 1 le nombre total de Matériels (par sa Classification Lien et par les Matériels mentionnés). Si cette carte est dans votre Cimetière et que vous contrôlez "Umi" : vous pouvez placer face recto cette carte sur votre Terrain. Vous ne pouvez utiliser cet effet de "Atlantis, Cité du Dragon des Mers" qu'une fois par tour.
  | de_text               = Solange ein Monster, das „Atlantis, Stadt des Seedrachen“ erwähnt, auf dem Spielfeld liegt, werden die Stufen aller Monster in den Händen beider Spieler und auf dem Spielfeld um 1 verringert. Wenn du ein „Daedalus“-Linkmonster als Linkbeschwörung beschwörst, kannst du die Gesamtanzahl des Materials um 1 verringern (von Linkzahl und vom erwähnten Material). Falls sich diese Karte in deinem Friedhof befindet und du „Umi“ kontrollierst: Du kannst diese Karte offen auf deine Spielfeldseite legen. Du kannst diesen Effekt von „Atlantis, Stadt des Seedrachen“ nur einmal pro Spielzug verwenden.
  | it_text               = Mentre un mostro che menziona "Atlantide, Città del Drago del Mare" è sul Terreno, i Livelli di tutti i mostri nelle mani di entrambi i giocatori e sul Terreno sono ridotti di 1. Quando Evochi Link un Mostro Link "Dedalo", puoi ridurre il numero totale di materiali di 1 (dalla Classificazione Link e dai materiali menzionati). Se questa carta è nel tuo Cimitero e tu controlli "Umi": puoi mettere questa carta scoperta sul tuo Terreno. Puoi utilizzare questo effetto di "Atlantide, Città del Drago del Mare" una sola volta per turno.
  | pt_text               = Enquanto um monstro que mencione "Atlântida, a Cidade do Dragão Marinho" estiver no campo, os Níveis de todos os monstros nas mãos dos dois duelistas e no campo são reduzidos em 1. Quando você Invocar por Invocação-Link um Monstro Link "Daedalus", você pode reduzir em 1 o número total de matérias (do Valor Link e das matérias necessárias mencionadas). Se este card estiver no seu Cemitério e você controlar "Umi": você pode colocar este card com a face para cima no seu campo. Você só pode usar este efeito de "Atlântida, a Cidade do Dragão Marinho" uma vez por turno.
  | es_text               = Mientras un monstruo que mencione "Atlántida, Ciudad del Dragón Marino" esté en el Campo, los Niveles de todos los monstruos en el Campo y en las manos de ambos jugadores se reducen en 1. Cuando Invocas por Enlace un Monstruo de Enlace "Dédalo", puedes reducir el número total de materiales en 1 (del Rating de Enlace y de los materiales mencionados). Si esta carta está en tu Cementerio y controlas "Umi": puedes poner esta carta boca arriba en tu Campo. Sólo puedes usar este efecto de "Atlántida, Ciudad del Dragón Marino" una vez por turno.
  | ja_text               = このカード名の③の効果は１ターンに１度しか使用できない。①：フィールドに「竜都アトランティス」のカード名が記されたモンスターが存在する限り、お互いの手札・フィールドのモンスターのレベルは１つ下がる。②：このカードがフィールドゾーンに存在する限り、自分が「ダイダロス」ＬモンスターをＬ召喚する場合に必要なＬ素材の数を１つ分、Ｌ素材の条件を１体分少なくできる。③：このカードが墓地に存在し、自分フィールドに「海」が存在する場合に発動できる。このカードを自分フィールドに表側表示で置く。
  | ko_text               = 
  | sc_text               = 此卡名的③效果1回合仅可使用1次。①：只要场上存在记载有“龙都 亚特兰蒂斯”卡名的怪兽，双方手牌・场上的怪兽的等级下降1。②：只要此卡存在于场地区域，自己要连接召唤“代达罗斯”连接怪兽的情况下，所需要的连接素材的数量可减少1、记载的连接素材的条件可减少1只。③：此卡存在于墓地，且自己场上存在“海”的情况下可以发动。将此卡以表侧表示放在自己场上。
