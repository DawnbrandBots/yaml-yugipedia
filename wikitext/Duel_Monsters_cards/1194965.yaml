  | text                = If this card is in your [[hand]]: You can [[target]] up to 3 cards you [[control]]; [[destroy]] them, [[Special Summon]] this card, then you can apply any of these effects in sequence (once each), based on the original types of those destroyed cards.<br />● Monster: [[Draw a card|Draw]] 1 card.<br />● Spell: Change 1 monster's [[battle position]].<br />● Trap: Destroy 1 other card on the field.<br />If this card on the field is destroyed by card effect: You can destroy all monsters on the field. You can only use each effect of "Unchained Zealot - Kamra" [[once per turn]].
  | fr_text             = Si cette carte est dans votre main : vous pouvez cibler max. 3 cartes que vous contrôlez ; détruisez-les, Invoquez Spécialement cette carte, puis vous pouvez appliquer n'importe lequel de ces effets dans l'ordre (une fois chacun), selon les types d'origine de ces cartes détruites.<br />● Monstre : Piochez 1 carte.<br />● Magie : Changez la position de combat d'1 monstre.<br />● Piège : Détruisez 1 autre carte sur le Terrain.<br />Si cette carte sur le Terrain est détruite par un effet de carte : vous pouvez détruire tous les monstres sur le Terrain. Vous ne pouvez utiliser chaque effet de "Zélote Désenchaîné - Kamra" qu'une fois par tour.
  | de_text             = Falls sich diese Karte in deiner Hand befindet: Du kannst bis zu 3 Karten wählen, die du kontrollierst; zerstöre sie, beschwöre diese Karte als Spezialbeschwörung, dann kannst du eine beliebige Anzahl dieser Effekte nacheinander ausführen (je einmal), basierend auf den Grund-Typen jener zerstörten Karten.<br />● Monster: Ziehe 1 Karte.<br />● Zauber: Ändere die Kampfposition von 1 Monster.<br />● Falle: Zerstöre 1 andere Karte auf dem Spielfeld.<br />Falls diese Karte auf dem Spielfeld durch einen Karteneffekt zerstört wird: Du kannst alle Monster auf dem Spielfeld zerstören. Du kannst jeden Effekt von „Losgeketteter Zelot - Kamra“ nur einmal pro Spielzug verwenden.
  | it_text             = Se questa carta è nella tua mano: puoi scegliere come bersaglio fino a 3 carte che controlli; distruggile, Evoca Specialmente questa carta, poi puoi applicare qualsiasi di questi effetti in ordine (una volta ciascuno), a seconda dei tipi originali di quelle carte distrutte.<br />● Mostro: Pesca 1 carta.<br />● Magia: Cambia la posizione di 1 mostro.<br />● Trappola: Distruggi 1 altra carta sul Terreno.<br />Se questa carta sul Terreno viene distrutta dall'effetto di una carta: puoi distruggere tutti i mostri sul Terreno. Puoi utilizzare ogni effetto di "Zelota Svincolato - Kamra" una sola volta per turno.
  | pt_text             = Se este card estiver na sua mão: você pode escolher até 3 cards que você controla; destrua-os, Invoque este card por Invocação-Especial e, depois, você pode aplicar qualquer um desses efeitos em sequência (uma vez cada), de acordo com os tipos originais desses cards destruídos.<br />● Monstro: Compre 1 card.<br />● Magia: Mude a posição de batalha de 1 monstro.<br />● Armadilha: Destrua 1 outro card no campo.<br />Se este card no campo for destruído por um efeito de card: você pode destruir todos os monstros no campo. Você só pode usar cada efeito de "Fanático Desacorrentado - Kamra" uma vez por turno.
  | es_text             = Si esta carta está en tu mano: puedes seleccionar hasta 3 cartas que controles; destrúyelas, Invoca esta carta de Modo Especial, y después puedes aplicar cualquiera de estos efectos en secuencia (una vez cada uno), basados en los tipos originales de esas cartas destruidas.<br />● Monstruo: Roba 1 carta.<br />● Mágica: Cambia la posición de batalla de 1 monstruo.<br />● Trampa: Destruye otra carta en el Campo.<br />Si esta carta en el Campo es destruida por el efecto de una carta: puedes destruir todos los monstruos en el Campo. Sólo puedes usar cada efecto de "Fanático Desencadenado - Kamra" una vez por turno.
  | ja_text             = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。①：自分フィールドのカードを３枚まで対象として発動できる。そのカードを破壊し、このカードを手札から特殊召喚する。その後、破壊したカードの元々の種類によって以下の効果をそれぞれ適用できる。●モンスター：自分は１枚ドローする。●魔法：フィールドのモンスター１体の表示形式を変更する。●罠：フィールドの他のカード１枚を破壊する。②：フィールドのこのカードが効果で破壊された場合に発動できる。フィールドのモンスターを全て破壊する。
  | ko_text             = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다. ①: 자신 필드의 카드를 3장까지 대상으로 하고 발동할 수 있다. 그 카드를 파괴하고, 이 카드를 패에서 특수 소환한다. 그 후, 파괴한 카드의 원래의 종류에 따라 이하의 효과를 각각 적용할 수 있다. ●몬스터: 자신은 1장 드로우한다. ●마법: 필드의 몬스터 1장의 표시 형식을 변경한다. ●함정: 필드의 다른 카드 1장을 파괴한다. ②: 필드의 이 카드가 효과로 파괴되었을 경우에 발동할 수 있다. 필드의 몬스터를 전부 파괴한다.
  | sc_text             = 此卡名的①②效果1回合仅可各使用1次。①：以自己场上的最多3张卡为对象可以发动。将该卡破坏，从手牌将此卡特殊召唤。然后，根据所破坏的卡的原本的种类，可分别适用以下效果。●怪兽：自己抽1张。●魔法：变更场上的1只怪兽的表示形式。●陷阱：将场上的1张其他卡破坏。②：场上的此卡因效果被破坏的情况下可以发动。将场上的怪兽全部破坏。
