  | text                  = Cannot be [[Normal Summon]]ed/[[Set]]. Must be [[Special Summon]]ed (from your [[hand]] or [[GY]]) by [[banish]]ing 3 [[Warrior]] and/or [[DARK]] [[monsters]] from your GY. You can only Special Summon "Destiny HERO - Destro-Dogma" [[once per turn]] this way. If Summoned this way: You can [[activate]] this [[effect]]; during the next [[Standby Phase]], inflict 2000 [[Effect damage|damage]] to your opponent. Once per turn, when your opponent activates a card or effect ([[Quick Effect]]): You can [[Fusion Summon]] 1 Warrior or DARK [[Fusion Monster]] from your [[Extra Deck]], by [[shuffling]] its [[material]]s from your hand, [[field]], and/or GY into the [[Main Deck|Deck]].
  | fr_text               = Ni Invocable Normalement ni Posable Normalement. Uniquement Invocable Spécialement (depuis votre main ou Cimetière) en bannissant 3 monstres Guerrier et/ou TÉNÈBRES depuis votre Cimetière. Vous ne pouvez Invoquer Spécialement "Destro-Dogma - HÉROS de la Destinée" qu'une fois par tour de cette façon. Si elle est Invoquée de cette façon : vous pouvez activer cet effet ; durant la prochaine Standby Phase, infligez 2000 points de dommages à votre adversaire. Une fois par tour, lorsque votre adversaire active une carte ou un effet (Effet Rapide) : vous pouvez Invoquer par Fusion 1 Monstre Fusion Guerrier ou TÉNÈBRES depuis votre Extra Deck, en mélangeant ses Matériels depuis votre main, Terrain et/ou Cimetière dans le Deck.
  | de_text               = Kann nicht als Normalbeschwörung beschworen/gesetzt werden. Muss als Spezialbeschwörung (von deiner Hand oder deinem Friedhof) beschworen werden, indem du 3 Krieger- und/oder FINSTERNIS Monster von deinem Friedhof verbannst. Du kannst „Schicksals-HELD - Destro-Dogma“ nur einmal pro Spielzug auf diese Art als Spezialbeschwörung beschwören. Falls diese Karte auf diese Art beschworen wird: Du kannst diesen Effekt aktivieren; füge deinem Gegner während der nächsten Standby Phase 2000 Schaden zu. Einmal pro Spielzug, wenn dein Gegner eine Karte oder einen Effekt aktiviert (Schnelleffekt): Du kannst 1 Krieger- oder FINSTERNIS Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du sein Material von deiner Hand, deiner Spielfeldseite und/oder deinem Friedhof ins Deck mischst.
  | it_text               = Non può essere Evocato Normalmente/Posizionato. Deve essere Evocato Specialmente (dalla tua mano o Cimitero) bandendo 3 mostri Guerriero e/o OSCURITÀ dal tuo Cimitero. Puoi Evocare Specialmente "Distro-Dogma - EROE del Destino" una sola volta per turno in questo modo. Se viene Evocato in questo modo: puoi attivare questo effetto; durante la prossima Standby Phase, infliggi 2000 danni al tuo avversario. Una volta per turno, quando il tuo avversario attiva una carta o un effetto (Effetto Rapido): puoi Evocare tramite Fusione 1 Mostro Fusione Guerriero o OSCURITÀ dal tuo Extra Deck, mischiando i suoi materiali dalla tua mano, Terreno e/o Cimitero nel Deck.
  | pt_text               = Não pode ser Invocado por Invocação-Normal/Baixado. Deve ser Invocado por Invocação-Especial (da sua mão ou do Cemitério) ao banir 3 monstros Guerreiros e/ou de TREVAS do seu Cemitério. Você só pode Invocar "HERÓI do Destino - Dogma Destro" por Invocação-Especial uma vez por turno desta forma. Se Invocado desta forma: você pode ativar este efeito; durante a próxima Fase de Apoio, cause 2000 de dano ao seu oponente. Uma vez por turno, quando seu oponente ativar um card ou efeito (Efeito Rápido): você pode Invocar por Invocação-Fusão 1 Monstro de Fusão Guerreiro ou de TREVAS do seu Deck Adicional, ao embaralhar no Deck suas matérias da sua mão, do campo e/ou do Cemitério.
  | es_text               = No puede ser Invocado de Modo Normal/Colocado. Debe ser Invocado de Modo Especial (desde tu mano o Cementerio) desterrando 3 monstruos Guerrero y/o de OSCURIDAD en tu Cementerio. Sólo puedes Invocar de Modo Especial "HÉROE del Destino - Destro-Dogma" una vez por turno de esta forma. Si es Invocado de esta forma: puedes activar este efecto; durante la próxima Standby Phase, inflige 2000 puntos de daño a tu adversario. Una vez por turno, cuando tu adversario activa una carta o efecto (Efecto Rápido): puedes Invocar por Fusión 1 Monstruo de Fusión Guerrero o de OSCURIDAD desde tu Deck Extra, barajando al Deck sus materiales en tu mano, Campo y/o Cementerio.
  | ja_text               = このカードは通常召喚できない。「Ｄ－ＨＥＲＯ デスドグマガイ」は１ターンに１度、戦士族か闇属性のモンスターを合計３体、自分の墓地から除外した場合のみ手札・墓地から特殊召喚できる。①：この方法でこのカードが特殊召喚した場合に発動できる。次のスタンバイフェイズに相手に２０００ダメージを与える。②：１ターンに１度、相手が効果を発動した時に発動できる。自分の手札・フィールド・墓地のモンスターを融合素材としてデッキに戻し、戦士族か闇属性の融合モンスター１体を融合召喚する。
  | ko_text               = 
  | sc_text               = 此卡不可通常召唤。“命运－英雄 死亡教义魔侠”1回合1次，仅可在从自己墓地将合计3只战士族或暗属性怪兽除外的情况下，从手牌・墓地特殊召唤。①：此卡以此方法特殊召唤的情况下可以发动。在下个准备阶段给予对手2000伤害。②：1回合1次，对手发动效果时可以发动。将自己手牌・场上・墓地的怪兽作为融合素材放回牌组，将1只战士族或暗属性的融合怪兽融合召唤。
