  | sc_text              = 等级7怪兽×3只以上<br />此卡也可重叠在自己场上的“混沌编号101”～“混沌编号107”中的任一“混沌编号”怪兽上面来超量召唤。①：此卡的攻击力上升此卡超量素材的数量×1000的数值。②：只要此卡持有“混沌编号”怪兽作为超量素材，对手不可用抽牌以外的方法从牌组将卡加入手牌。③：1回合1次，去除此卡的1个超量素材可以发动。从对手牌组上面将2张卡作为此卡的超量素材。
