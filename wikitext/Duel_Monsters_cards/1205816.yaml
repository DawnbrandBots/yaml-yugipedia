  | text                 = 3+ [[Level]] 7 [[monster]]s<br />You can also [[Xyz Summon]] this card by using 1 monster you [[control]] with [[Number C10X|"Number C101" through "Number C107" in its name]] ([[transfer]] its [[material]]s). Gains 1000 [[ATK]] for each material [[attach]]ed to it. While this card has a "Number C" monster as material, cards cannot be [[Add a card|added]] from the [[Main Deck]] to your opponent's hand except by [[draw a card|drawing]] them. [[Once per turn]]: You can [[detach]] 1 material from this card; attach the top 2 cards of your opponent's Deck to this card.
  | fr_text              = 3+ monstres de Niveau 7<br />Vous pouvez aussi Invoquer par Xyz cette carte en utilisant 1 monstre que vous contrôlez avec "Numéro C101" à "Numéro C107" dans son nom (transférez ses Matériels). Gagne 1000 ATK pour chaque Matériel qui lui est attaché. Tant que cette carte a un monstre "Numéro C" comme Matériel, les cartes ne peuvent pas être ajoutées depuis le Main Deck à la main de votre adversaire, sauf en les piochant. Une fois par tour : vous pouvez détacher 1 Matériel de cette carte ; attachez les 2 cartes du dessus du Deck de votre adversaire à cette carte.
  | de_text              = 3+ Monster der Stufe 7<br />Du kannst diese Karte auch als Xyz-Beschwörung beschwören, indem du 1 Monster, das du kontrollierst, mit „Nummer C101“ bis „Nummer C107“ in seinem Namen verwendest (transferiere sein Material). Diese Karte erhält für jedes an sie angehängte Material 1000 ATK. Solange diese Karte ein „Nummer C“-Monster als Material hat, können der Hand deines Gegners keine Karten vom Main Deck hinzugefügt werden, außer durch Ziehen. Einmal pro Spielzug: Du kannst 1 Material von dieser Karte abhängen; hänge die obersten 2 Karten des Decks deines Gegners an diese Karte an.
  | it_text              = 3+ mostri di Livello 7<br />Puoi anche Evocare Xyz questa carta utilizzando 1 mostro che controlli con "Numero C101" fino a "Numero C107" nel suo nome (trasferisci i suoi materiali). Guadagna 1000 ATK per ogni materiale attaccato a essa. Mentre questa carta ha un mostro "Numero C" come materiale, le carte non possono essere aggiunte dal Main Deck alla mano del tuo avversario eccetto pescandole. Una volta per turno: puoi staccare 1 materiale da questa carta; attacca le prime 2 carte del Deck del tuo avversario a questa carta.
  | pt_text              = 3+ monstros de Nível 7<br />Você também pode Invocar este card por Invocação-Xyz ao usar 1 monstro que você controla com "Número C101" até "Número C107" em seu nome (transfira as matérias dele). Ganha 1000 de ATK para cada matéria associada a ele. Enquanto este card tiver um monstro "Número C" como matéria, cards não podem ser adicionados do Deck Principal à mão do seu oponente exceto ao serem comprados. Uma vez por turno: você pode desassociar 1 matéria deste card; associe os 2 cards do topo do Deck do seu oponente a este card.
  | es_text              = 3+ monstruos de Nivel 7<br />También puedes Invocar Xyz esta carta usando 1 monstruo que controles cuyo nombre vaya de "Número C101" a "Número C107" (transfiere sus materiales). Gana 1000 ATK por cada material acoplado a él. Mientras esta carta tenga un monstruo "Número C" como material, no se pueden añadir cartas a la mano de tu adversario desde el Deck Principal, excepto robándolas. Una vez por turno: puedes desacoplar 1 material de esta carta; acopla a esta carta las 2 cartas de la parte superior del Deck de tu adversario.
  | ja_text              = レベル７モンスター×３体以上<br />このカードは自分フィールドの「ＣＮｏ．１０１」～「ＣＮｏ．１０７」のいずれかの「ＣＮｏ．」モンスターの上に重ねてＸ召喚する事もできる。①：このカードの攻撃力は、このカードのＸ素材の数×１０００アップする。②：このカードが「ＣＮｏ．」モンスターをＸ素材としている限り、相手はドロー以外の方法でデッキからカードを手札に加える事ができない。③：１ターンに１度、このカードのＸ素材を１つ取り除いて発動できる。相手のデッキの上からカード２枚をこのカードのＸ素材にする。
  | translated_text      = 3+ Level 7 monsters<br />You can also Xyz Summon this card by using 1 monster you control with "Number C101" through "Number C107" in its name (transfer its materials). Gains 1000 ATK for each material attached to it. While this card has a "Number C" monster as material, your opponent cannot add cards from the Main Deck to the hand except by drawing them. Once per turn: You can detach 1 material from this card; attach the top 2 cards of your opponent's Deck to this card.
