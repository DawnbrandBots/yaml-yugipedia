  | text            = [[Target]] 1 [[Spell Card|Spell]]/[[Trap]] on the [[field]]; [[destroy]] it. Once per [[Chain]], when a Trap Card is [[activate]]d while this card is in your [[GY]]: [[Special Summon]] this card as a [[Normal Monster]] ([[Aqua]]/[[WATER]]/[[Level]] 2/[[ATK]] 1200/[[DEF]] 0) (this card is NOT treated as a Trap). If [[Summon]]ed this way, this card is [[unaffected]] by [[monster effect]]s, also [[banish]] it when it [[leaves the field]].
  | fr_text         = Ciblez 1 Magie/Piège sur le Terrain ; détruisez-le. Une fois par Chaîne, lorsqu'une Carte Piège est activée tant que cette carte est dans votre Cimetière : Invoquez Spécialement cette carte comme Monstre Normal (Aqua/EAU/Niveau 2/ATK 1200/DEF 0) (cette carte N'EST PAS traitée comme Piège). Si elle est Invoquée de cette façon, cette carte n'est pas affectée par des effets de monstre, et aussi, bannissez-la lorsqu'elle quitte le Terrain.
  | de_text         = Wähle 1 Zauber/Falle auf dem Spielfeld; zerstöre ihn oder sie. Einmal pro Kette, wenn eine Fallenkarte aktiviert wird, solange sich diese Karte in deinem Friedhof befindet: Beschwöre diese Karte als Spezialbeschwörung als Normales Monster (Aqua/WASSER/Stufe 2/ATK 1200/DEF 0) (diese Karte wird NICHT als Falle behandelt.) Falls diese Karte auf diese Art beschworen wird, bleibt sie von Monstereffekten unberührt, zusätzlich verbanne sie, wenn sie das Spielfeld verlässt.
  | it_text         = Scegli come bersaglio 1 Magia/Trappola sul Terreno; distruggila. Una volta per Catena, quando viene attivata una Carta Trappola mentre questa carta è nel tuo Cimitero: Evoca Specialmente questa carta come Mostro Normale (Acqua/ACQUA/Livello 2/ATK 1200/DEF 0) (questa carta NON viene considerata come una Trappola). Se viene Evocata in questo modo, questa carta è immune agli effetti dei mostri, inoltre bandiscila quando lascia il Terreno.
  | pt_text         = Escolha 1 Magia/Armadilha no campo; destrua-a. Uma vez por Corrente, quando um Card de Armadilha for ativado enquanto este card estiver no seu Cemitério: Invoque este card por Invocação-Especial como um Monstro Normal (Aqua/ÁGUA/Nível 2/ATK 1200/DEF 0) (este card NÃO é considerado como uma Armadilha). Se Invocado desta forma, este card não é afetado por efeitos de monstro e, além disso, bana-o quando ele deixar o campo.
  | es_text         = Selecciona 1 Mágica/Trampa en el Campo; destrúyela. Una vez por Cadena, cuando una Carta de Trampa es activada mientras esta carta esté en tu Cementerio: Invoca esta carta de Modo Especial como un Monstruo Normal (Aqua/AGUA/Nivel 2/ATK 1200/DEF 0) (esta carta NO se trata como una Trampa). Si es Invocada de esta forma, esta carta no es afectada por efectos de monstruos, y además destiérrala cuando deje el Campo.
  | ja_text         = ①：フィールドの魔法・罠カード１枚を対象として発動できる。そのカードを破壊する。②：このカードが墓地に存在し、罠カードが発動した時に発動できる（同一チェーン上では１度まで）。このカードは通常モンスター（水族・水・星２・攻１２００／守０）となり、モンスターゾーンに特殊召喚する（罠カードとしては扱わない）。この効果で特殊召喚したこのカードはモンスターの効果を受けず、フィールドから離れた場合に除外される。
  | ko_text         = ①: 필드의 마법 / 함정 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 파괴한다. ②: 필드의 함정 카드가 발동했을 때, 그 발동에 체인하고 이 효과를 묘지에서 발동할 수 있다. 이 카드는 일반 몬스터(물족 / 물 / 레벨 2 / 공 1200 / 수 0)가 되고, 몬스터 존에 특수 소환한다(함정 카드로는 취급하지 않는다). 이 효과로 특수 소환한 이 카드는 몬스터의 효과를 받지 않으며, 필드에서 벗어났을 경우에 제외된다.
  | sc_text         = ①：以场上的1张魔法・陷阱卡为对象可以发动。将该卡破坏。②：此卡存在于墓地，且陷阱卡发动时可以发动（同一连锁上最多1次）。此卡变为通常怪兽（水族・水・星2・攻1200/守0），特殊召唤至怪兽区域（不视为陷阱卡）。以此效果特殊召唤的此卡不受怪兽效果影响，从场上离开的情况下将被除外。
