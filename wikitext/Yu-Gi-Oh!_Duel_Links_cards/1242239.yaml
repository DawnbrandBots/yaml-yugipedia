  | text         = If you [[control]] "[[King's Sarcophagus (Duel Links)|King's Sarcophagus]]", you can [[Special Summon]] this card (from your [[Graveyard]]). You can only Special Summon "Duamutef, Blessing of Horus" [[once per turn]] this way. Gains 1200 [[ATK]]/[[DEF]] for each "[[Horus]]" [[monster]] you control. If another card(s) you control [[leaves the field]] by an opponent's card [[effect]], while this card is in your [[Monster Zone]] (except during the [[Damage Step]]): You can [[Draw a card|draw]] cards equal to the number of monsters with different names in your [[Main Monster Zone]]. You can only use this effect of "Duamutef, Blessing of Horus" once per turn.
  | fr_text      = Si vous contrôlez "Sarcophage du Roi", vous pouvez Invoquer Spécialement cette carte (depuis votre Cimetière). Vous ne pouvez Invoquer Spécialement "Douamoutef, Bénédiction d'Horus" qu'une fois par tour de cette façon. Gagne 1200 ATK/DEF pour chaque monstre "Horus" que vous contrôlez. Si une ou plusieurs autres cartes que vous contrôlez quittent le Terrain par un effet de carte de l'adversaire, tant que cette carte est dans votre Zone Monstre (sauf durant la Damage Step) : vous pouvez piocher un nombre de cartes égal au nombre de monstres de noms différents dans votre Zone Monstre Main. Vous ne pouvez utiliser cet effet de "Douamoutef, Bénédiction d'Horus" qu'une fois par tour.
