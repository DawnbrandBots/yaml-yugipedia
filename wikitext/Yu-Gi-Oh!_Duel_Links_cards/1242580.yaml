  | text         = If you [[control]] "[[King's Sarcophagus (Duel Links)|King's Sarcophagus]]", you can [[Special Summon]] this card (from your [[Graveyard]]). You can only Special Summon "Imsety, Glory of Horus" [[once per turn]] this way. You can only use each of the following [[effect]]s of "Imsety, Glory of Horus" once per turn. You can [[send]] 2 cards from your [[hand]] to the Graveyard, including this card; [[Add a card|add]] 1 "King's Sarcophagus" from your [[Main Deck|Deck]] to your hand, then you can [[Draw a card|draw]] 1 card. If another card(s) you control [[leaves the field]] by an opponent's card effect, while this card is in your [[Monster Zone]] (except during the [[Damage Step]]): You can send 1 card on the field to the Graveyard.
  | fr_text      = Si vous contrôlez "Sarcophage du Roi", vous pouvez Invoquer Spécialement cette carte (depuis votre Cimetière). Vous ne pouvez Invoquer Spécialement "Amset, Gloire d'Horus" qu'une fois par tour de cette façon. Vous ne pouvez utiliser chacun des effets suivants de "Amset, Gloire d'Horus" qu'une fois par tour. Vous pouvez envoyer 2 cartes (cette carte incluse) depuis votre main au Cimetière ; ajoutez 1 "Sarcophage du Roi" depuis votre Deck à votre main, puis vous pouvez piocher 1 carte. Si une ou plusieurs autres cartes que vous contrôlez quittent le Terrain par un effet de carte de l'adversaire, tant que cette carte est dans votre Zone Monstre (sauf durant la Damage Step) : vous pouvez envoyer 1 carte sur le Terrain au Cimetière.
