  | text      = ''The youngest member of the [[Vi-FRND (Duel Links)|band]], she's often teased by [[Romic n' Roller (Duel Links)|Romic n' Roller]], but everyone recognizes her talents. She dreams of the day she'll [[Back Beat (Duel Links)|play on stage with her bandmates as a quintet]].''
  | fr_text   = ''Cadette du groupe, elle est souvent taquinée par Romickeuse, mais tout le monde reconnaît son talent. Elle rêve du jour où elle pourra jouer sur scène avec les autres membres du groupe en formant un quintette.''
  | de_text   = ''Als jüngstes Mitglied der Band wird sie oft von Romik-and-Roller aufgezogen. Jeder weiß aber, welches Talent sie hat. Sie träumt davon, eines Tages mit ihren Bandkollegen im Quintett aufzutreten.''
  | it_text   = ''Membro più giovane della band, spesso viene stuzzicata da Romic n' Roll, ma tutti riconoscono il suo talento. Sogna di suonare un giorno sul palco con i suoi compagni di band come quintetto.''
  | es_text   = ''La miembro más joven de la banda, de quien a menudo se burla Romic n' Roller, aunque todos reconocen su talento. Sueña con el día en que tocará en el escenario con sus compañeros de banda en un quinteto.''
  | ja_text   = バンドグループの最年少。いつもロミックンローラーたちにからかわれているが、その実力は誰もが認めている。５人全員で大舞台でライブをすることが夢。
