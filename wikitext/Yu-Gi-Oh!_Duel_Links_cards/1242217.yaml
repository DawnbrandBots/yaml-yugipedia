  | text         = Gains 300 [[ATK]] for each [[banish]]ed card. You can only use each of the following [[effect]]s of "Gandora-G the Dragon of Destruction" [[once per turn]]. If you [[control]] "[[Shining Sarcophagus (Duel Links)|Shining Sarcophagus]]": You can [[Special Summon]] this card from your [[hand]]. You can pay half your [[LP]]; [[destroy]] as many other cards on the [[field]] as possible, and if you do, [[banish]] them, then Special Summon 1 [[Level]] 7 or lower monster that mentions "Shining Sarcophagus" from your [[Main Deck|Deck]], and increase its Level by the number of cards destroyed by this effect.
  | fr_text      = Gagne 300 ATK pour chaque carte bannie. Vous ne pouvez utiliser chacun des effets suivants de "Gandora-G le Dragon de la Destruction" qu'une fois par tour. Si vous contrôlez "Sarcophage Brillant" : vous pouvez Invoquer Spécialement cette carte depuis votre main. Vous pouvez payer la moitié de vos LP ; détruisez autant d'autres cartes sur le Terrain que possible, et si vous le faites, bannissez-les, puis Invoquez Spécialement 1 monstre de max. Niveau 7 qui mentionne "Sarcophage Brillant" depuis votre Deck, et augmentez son Niveau du nombre de cartes détruites par cet effet.
