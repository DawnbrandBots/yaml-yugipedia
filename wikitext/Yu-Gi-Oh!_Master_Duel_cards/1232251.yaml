title: Invocation - "Grail" (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | card_type          = Spell
  | property           = Normal
  | text               = If you have an "Aleister" monster in your field, GY, or banishment: Activate 1 of these effects;<br />●Fusion Summon 1 "Invoked" Fusion Monster from your Extra Deck, by banishing 1 monster in your hand or field and 1 monster in your Deck as material.<br />●Fusion Summon 1 "Invoked" Fusion Monster from your Extra Deck, by banishing 1 monster you control and 1 face-up monster your opponent controls as material.<br />You can only activate 1 "Invocation - "Grail"" per turn.

  | fr_name            = Invokhation - "Graal"
  | fr_text            = Si vous avez un monstre "Aleister" dans votre Terrain, Cimetière ou bannissement : activez 1 de ces effets ;<br />●Invoquez par Fusion 1 Monstre Fusion "Invokhé" depuis votre Extra Deck, en bannissant 1 monstre dans votre main ou Terrain et 1 monstre dans votre Deck comme Matériel.<br />●Invoquez par Fusion 1 Monstre Fusion "Invokhé" depuis votre Extra Deck, en bannissant 1 monstre que vous contrôlez et 1 monstre face recto contrôlé par votre adversaire comme Matériel.<br />Vous ne pouvez activer qu'1 "Invokhation - "Graal"" par tour.
  | de_name            = Beschwörung - „Gral“
  | de_text            = Falls du ein „Aleister“-Monster auf deiner Spielfeldseite, in deinem Friedhof oder unter deinen verbannten Karten hast: Aktiviere 1 dieser Effekte;<br />●Beschwöre 1 „Beschworen“-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck, indem du 1 Monster von deiner Hand oder Spielfeldseite und 1 Monster von deinem Deck als Material verbannst.<br />●Beschwöre 1 „Beschworen“-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck, indem du 1 Monster, das du kontrollierst, und 1 offenes Monster, das dein Gegner kontrolliert, als Material verbannst.<br />Du kannst nur 1 „Beschwörung - „Gral““ pro Spielzug aktivieren.
  | it_name            = Invokazione - "Graal"
  | it_text            = Se hai un mostro "Aleister" nel tuo Terreno, Cimitero o carte bandite: attiva 1 di questi effetti;<br />●Evoca tramite Fusione 1 Mostro Fusione "Invokato" dal tuo Extra Deck, bandendo 1 mostro nella tua mano o Terreno e 1 mostro nel tuo Deck come materiale.<br />●Evoca tramite Fusione 1 Mostro Fusione "Invokato" dal tuo Extra Deck, bandendo 1 mostro che controlli e 1 mostro scoperto controllato dal tuo avversario come materiale.<br />Puoi attivare solo 1 "Invokazione - "Graal"" per turno.
  | pt_name            = Invokação - "Cálice"
  | pt_text            = Se você tiver um monstro "Aleister" no seu campo, Cemitério ou banimento: ative 1 desses efeitos;<br />●Invoque por Invocação-Fusão 1 Monstro de Fusão "Invokado(a)" do seu Deck Adicional, banindo 1 monstro na sua mão ou do campo e 1 monstro no seu Deck como matéria.<br />●Invoque por Invocação-Fusão 1 Monstro de Fusão "Invokado(a)" do seu Deck Adicional, banindo 1 monstro que você controla e 1 monstro com a face para cima que seu oponente controla como matéria.<br />Você só pode ativar 1 "Invokação - "Cálice"" por turno.
  | es_name            = Invokación - "Grial"
  | es_text            = Si tienes un monstruo "Aleister" en tu Campo, Cementerio o destierro: activa 1 de estos efectos;<br />●Invoca por Fusión 1 Monstruo de Fusión "Invokado/a" desde tu Deck Extra, desterrando 1 monstruo en tu mano o Campo y 1 monstruo en tu Deck como material.<br />●Invoca por Fusión 1 Monstruo de Fusión "Invokado/a" desde tu Deck Extra, desterrando 1 monstruo que controlas y 1 monstruo boca arriba que controle tu adversario como material.<br />Sólo puedes activar 1 "Invokación - "Grial"" por turno.
  | ja_text            = このカード名のカードは１ターンに１枚しか発動できない。<br />①：自分のフィールドか墓地か除外状態に「アレイスター」モンスターが存在する場合、以下の効果から１つを選択して発動できる。<br />●自分の手札・フィールドのモンスター１体と自分のデッキのモンスター１体を融合素材として除外し、「召喚獣」融合モンスター１体を融合召喚する。<br />●自分フィールドのモンスター１体と相手フィールドの表側表示モンスター１体を融合素材として除外し、「召喚獣」融合モンスター１体を融合召喚する。
  | ko_name            = 소환마술－「잔」
  | ko_text            = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다.<br />①: 자신의 필드나 묘지나 제외 상태에 "알레이스터" 몬스터가 존재할 경우, 이하의 효과에서 1개를 선택하고 발동할 수 있다.<br />●자신의 패 / 필드의 몬스터 1장과 자신의 덱의 몬스터 1장을 융합 소재로서 제외하고, "소환수" 융합 몬스터 1장을 융합 소환한다.<br />●자신 필드의 몬스터 1장과 상대 필드의 앞면 표시 몬스터 1장을 융합 소재로서 제외하고, "소환수" 융합 몬스터 1장을 융합 소환한다.
  | tc_name            = 召喚魔術－「杯」
  | tc_text            = 此卡名的卡1回合僅可發動1張。<br />①：自己場上、墓地或除外狀態存在「阿萊斯特」怪獸的情況下，可從以下效果中選擇1個發動。<br />●將自己手牌・場上的1隻怪獸和自己牌組的1隻怪獸作為融合素材除外，將1隻「召喚獸」融合怪獸融合召喚。<br />●將自己場上的1隻怪獸和對手場上的1隻表側表示怪獸作為融合素材除外，將1隻「召喚獸」融合怪獸融合召喚。
  | sc_name            = 召唤魔术－“杯”
  | sc_text            = 此卡名的卡1回合仅可发动1张。<br />①：自己场上、墓地或除外状态存在“阿莱斯特”怪兽的情况下，可从以下效果中选择1个发动。<br />●将自己手牌・场上的1只怪兽和自己牌组的1只怪兽作为融合素材除外，将1只“召唤兽”融合怪兽融合召唤。<br />●将自己场上的1只怪兽和对手场上的1只表侧表示怪兽作为融合素材除外，将1只“召唤兽”融合怪兽融合召唤。
  }}
