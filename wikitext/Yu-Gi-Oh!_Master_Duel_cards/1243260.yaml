  | de_name            = S-Kraft Mystify
  | de_text            = 2+ Monster, darunter ein „S-Kraft“-Monster<br />Solange dein Gegner ein Monster in der Spalte dieser Karte kontrolliert, kann er weder diese Karte als Ziel für Karteneffekte wählen noch Spezialbeschwörungen durch einen aktivierten Monstereffekt durchführen. (Schnelleffekt): Du kannst 1 Monster auf dem Spielfeld wählen; bewege es in eine andere Main-Monsterzone auf der Spielfeldseite seines Beherrschers. Du kannst diesen Effekt von „S-Kraft Mystify“ nur einmal pro Spielzug verwenden.
  | it_name            = S-Forza Mystify
  | it_text            = 2+ mostri, compreso un mostro "S-Forza"<br />Mentre il tuo avversario controlla un mostro nella colonna di questa carta, non può scegliere questa carta come bersaglio con gli effetti delle carte, né Evocare Specialmente con l'effetto attivato di un mostro. (Effetto Rapido): puoi scegliere come bersaglio 1 mostro sul Terreno; spostalo in un'altra Zona Mostri Main sul Terreno del suo controllore. Puoi utilizzare questo effetto di "S-Forza Mystify" una sola volta per turno.
  | pt_name            = Força-S Mistify
  | pt_text            = 2+ monstros, incluindo um monstro "Força-S"<br />Enquanto seu oponente controlar um monstro na coluna deste card, ele não pode escolher este card como alvo de efeitos de card, nem Invocar por Invocação-Especial com um efeito de monstro ativado. (Efeito Rápido): você pode escolher 1 monstro no campo; mova-o para outra Zona de Monstros Principal no campo do seu controlador. Você só pode usar este efeito de "Força-S Mistify" uma vez por turno.
  | es_name            = Fuerza-S Mystify
  | es_text            = 2+ monstruos, incluyendo un monstruo "Fuerza-S"<br />Mientras tu adversario controle un monstruo en la columna de esta carta, no puede seleccionar esta carta con efectos de cartas, ni Invocar de Modo Especial por un efecto de monstruo activado. (Efecto Rápido): puedes seleccionar 1 monstruo en el Campo; muévelo a otra Zona de Monstruos Principal en el Campo de su controlador. Sólo puedes usar este efecto de "Fuerza-S Mystify" una vez por turno.
  | ja_text            = 「Ｓ－Ｆｏｒｃｅ」モンスターを含むモンスター２体以上<br />このカード名の②の効果は１ターンに１度しか使用できない。<br />①：このカードの正面に相手モンスターが存在する限り、相手は、このカードを効果の対象にできず、モンスターが発動した効果でモンスターを特殊召喚できない。<br />②：自分・相手ターンに、フィールドのモンスター１体を対象として発動できる。そのモンスターの位置をそのコントローラーの他のメインモンスターゾーンに移動する。
  | ko_name            = S－Force 미스티파이
  | ko_text            = "S－Force(시큐리티 포스)" 몬스터를 포함하는 몬스터 2장 이상<br />이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드의 정면에 상대 몬스터가 존재하는 한, 상대는, 이 카드를 효과의 대상으로 할 수 없으며, 몬스터가 발동한 효과로 몬스터를 특수 소환할 수 없다.<br />②: 자신 / 상대 턴에, 필드의 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터의 위치를 그 컨트롤러의 다른 메인 몬스터 존으로 이동한다.
  | tc_name            = 超元特防隊 詭義
  | tc_text            = 包含「超元特防隊」怪獸在內的怪獸2隻以上<br />此卡名的②效果1回合僅可使用1次。<br />①：只要此卡的正面存在對手怪獸，對手不可將此卡作為效果的對象，也不可透過怪獸發動的效果來特殊召喚怪獸。<br />②：在自己・對手回合中，以場上的1隻怪獸為對象可以發動。將該怪獸的位置移動至其控制者的其他主要怪獸區域。
  | sc_name            = 超元特防队 诡义
  | sc_text            = 包含“超元特防队”怪兽在内的怪兽2只以上<br />此卡名的②效果1回合仅可使用1次。<br />①：只要此卡的正面存在对手怪兽，对手不可将此卡作为效果的对象，也不可通过怪兽发动的效果来特殊召唤怪兽。<br />②：在自己・对手回合中，以场上的1只怪兽为对象可以发动。将该怪兽的位置移动至其控制者的其他主要怪兽区域。
