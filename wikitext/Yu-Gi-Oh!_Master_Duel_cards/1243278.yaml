title: Imposter Shift (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | card_type          = Spell
  | property           = Continuous
  | text               = When a monster effect that was activated on your opponent's field by targeting a card(s) on the field resolves, if any of those targets are in a different column than that opponent's monster, they can banish 1 card from their GY. If they did not, negate the activated effect. You can banish 1 monster from your GY; Special Summon 1 "Imposter Token" (Psychic/EARTH/ATK 800/DEF 800) with the same Level as that monster. You can only use this effect of "Imposter Shift" once per turn.

  | fr_name            = Imposteur-Morphe
  | fr_text            = Lorsqu'un effet de monstre qui a été activé sur le Terrain de votre adversaire en ciblant une ou plusieurs cartes sur le Terrain est résolu, si une des cibles est dans une colonne différente du monstre de l'adversaire, il peut bannir 1 carte depuis son Cimetière. S'il ne l'a pas fait, annulez l'effet activé. Vous pouvez bannir 1 monstre depuis votre Cimetière ; Invoquez Spécialement 1 "Jeton Imposteur" (Psychique/TERRE/ATK 800/DEF 800) du même Niveau que le monstre. Vous ne pouvez utiliser cet effet de "Imposteur-Morphe" qu'une fois par tour.
  | de_name            = Hochstaplerverschiebung
  | de_text            = Wenn ein Monstereffekt aufgelöst wird, der auf der Spielfeldseite deines Gegners aktiviert wurde, indem eine oder mehr Karten auf dem Spielfeld gewählt wurden, falls eins jener gewählten Ziele in einer unterschiedlichen Spalte als jenes Monster des Gegners liegt, kann er 1 Karte von seinem Friedhof verbannen. Falls er dies nicht tut, annulliere den aktivierten Effekt. Du kannst 1 Monster von deinem Friedhof verbannen; beschwöre 1 „Hochstapler-Spielmarke“ (Psi/ERDE/ATK 800/DEF 800) mit derselben Stufe wie jenes Monster als Spezialbeschwörung. Du kannst diesen Effekt von „Hochstaplerverschiebung“ nur einmal pro Spielzug verwenden.
  | it_name            = Mutamento Impostore
  | it_text            = Quando l'effetto di un mostro che è stato attivato sul Terreno del tuo avversario scegliendo come bersaglio una o più carte sul Terreno si risolve, se qualsiasi di quei bersagli sono in una colonna diversa da quel mostro dell'avversario, lui può bandire 1 carta dal suo Cimitero. Se non lo fa, annulla l'effetto attivato. Puoi bandire 1 mostro dal tuo Cimitero; Evoca Specialmente 1 "Segna-Impostore" (Psichico/TERRA/ATK 800/DEF 800) con lo stesso Livello di quel mostro. Puoi utilizzare questo effetto di "Mutamento Impostore" una sola volta per turno.
  | pt_name            = Troca do Impostor
  | pt_text            = Quando um efeito de monstro que foi ativado no campo do seu oponente ao escolher como alvo um ou mais cards no campo resolver, se qualquer desses alvos estava em uma coluna diferente da do monstro do oponente, ele pode banir 1 card do Cemitério dele. Se ele não o fez, negue o efeito ativado. Você pode banir 1 monstro do seu Cemitério; Invoque por Invocação-Especial 1 "Ficha de Impostor" (Psíquico/TERRA/ATK 800/DEF 800) com o mesmo Nível que o desse monstro. Você só pode usar este efeito de "Troca do Impostor" uma vez por turno.
  | es_name            = Cambio Impostor
  | es_text            = Cuando se resuelve un efecto de monstruo que fue activado en el Campo de tu adversario seleccionando una o más cartas en el Campo, si alguno de esos objetivos está en una columna diferente a la de ese monstruo del adversario, puede desterrar 1 carta en su Cementerio. Si no lo hace, niega el efecto activado. Puedes desterrar 1 monstruo en tu Cementerio; Invoca de Modo Especial 1 "Ficha Impostor" (Psíquico/TIERRA/ATK 800/DEF 800) con el mismo Nivel que ese monstruo. Sólo puedes usar este efecto de "Cambio Impostor" una vez por turno.
  | ja_text            = このカード名の②の効果は１ターンに１度しか使用できない。<br />①：相手フィールドのモンスターがフィールドのカードを対象として発動した効果の処理時に、その相手フィールドのモンスターとは異なる縦列に対象のカードが存在する場合、相手は自身の墓地からカード１枚を除外できる。除外しなかった場合、その発動した効果は無効化される。<br />②：自分の墓地からモンスター１体を除外して発動できる。そのモンスターのレべルと同じレベルを持つ「インポスタートークン」（サイキック族・地・攻／守８００）１体を自分フィールドに特殊召喚する。
  | ko_name            = 임포스터 시프트
  | ko_text            = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 상대 필드의 몬스터가 필드의 카드를 대상으로 하고 발동한 효과의 처리시에, 그 상대 필드의 몬스터와는 다른 세로열에 대상의 카드가 존재할 경우, 상대는 자신 묘지에서 카드 1장을 제외할 수 있다. 제외하지 않았을 경우, 그 발동한 효과는 무효화된다.<br />②: 자신 묘지에서 몬스터 1장을 제외하고 발동할 수 있다. 그 몬스터의 레벨과 같은 레벨을 가지는 "임포스터 토큰"(사이킥족 / 땅 / 공 800 / 수 800) 1장을 자신 필드에 특수 소환한다.
  | tc_name            = 冒名者替換
  | tc_text            = 此卡名的②效果1回合僅可使用1次。<br />①：對手場上的怪獸以場上的卡為對象發動效果的處理時，該對手場上的怪獸不同縱列的對象卡存在的情況下，對手可從自身墓地將1張卡除外。未除外的情況下，該發動的效果無效化。<br />②：從自己墓地將1隻怪獸除外可以發動。將與該怪獸相同等級的1隻「冒名者衍生物」（念動力族・地・攻/守800）特殊召喚至自己場上。
  | sc_name            = 冒名者替换
  | sc_text            = 此卡名的②效果1回合仅可使用1次。<br />①：对手场上的怪兽以场上的卡为对象发动效果的处理时，该对手场上的怪兽不同纵列的对象卡存在的情况下，对手可从自身墓地将1张卡除外。未除外的情况下，该发动的效果无效化。<br />②：从自己墓地将1只怪兽除外可以发动。将与该怪兽相同等级的1只“冒名者衍生物”（念动力族・地・攻/守800）特殊召唤至自己场上。
  }}
