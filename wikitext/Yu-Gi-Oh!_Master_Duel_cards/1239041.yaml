title: Rikka Moonlit Waters (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | card_type          = Spell
  | property           = Normal
  | text               = When you activate this card, you can also Tribute 1 Plant monster; take 2 "Rikka" monsters with the same Level but different names from your Deck, add 1 of them to your hand, and send the other to the GY. If you Tributed a monster at activation, your opponent cannot target "Rikka" monsters you control with card effects this turn. For the rest of this turn after this card resolves, you cannot Special Summon from the Extra Deck, except Plant Xyz Monsters. You can only activate 1 "Rikka Moonlit Waters" per turn.

  | fr_name            = Eaux Éclairées par la Lune Rikka
  | fr_text            = Lorsque vous activez cette carte, vous pouvez aussi Sacrifier 1 monstre Plante ; prenez 2 monstres "Rikka" du même Niveau mais de noms différents depuis votre Deck, ajoutez-en 1 à votre main, et envoyez l'autre au Cimetière. Si vous avez Sacrifié un monstre à l'activation, votre adversaire ne peut pas cibler de monstres "Rikka" que vous contrôlez avec des effets de carte ce tour. Le reste de ce tour après la résolution de cette carte, vous ne pouvez pas Invoquer Spécialement (Monstres Xyz Plante exclus) depuis l'Extra Deck. Vous ne pouvez activer qu'1 "Eaux Éclairées par la Lune Rikka" par tour.
  | de_name            = Mondbeschienene Rikka-Gewässer
  | de_text            = Wenn du diese Karte aktivierst, kannst du zusätzlich 1 Pflanze-Monster als Tribut anbieten; nimm 2 „Rikka“-Monster mit derselben Stufe, aber unterschiedlichen Namen von deinem Deck, füge 1 von ihnen deiner Hand hinzu und lege das andere auf den Friedhof. Falls du bei der Aktivierung ein Monster als Tribut angeboten hast, kann dein Gegner in diesem Spielzug „Rikka“-Monster, die du kontrollierst, nicht als Ziel für Karteneffekte wählen. Für den Rest dieses Spielzugs, nachdem diese Karte aufgelöst wurde, kannst du keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Pflanze-Xyz-Monstern. Du kannst nur 1 „Mondbeschienene Rikka-Gewässer“ pro Spielzug aktivieren.
  | it_name            = Acque Illuminate dalla Luna Rikka
  | it_text            = Quando attivi questa carta, puoi anche offrire come Tributo 1 mostro Pianta; prendi 2 mostri "Rikka" con lo stesso Livello ma nomi diversi dal tuo Deck, aggiungi 1 di essi alla tua mano e manda l'altro al Cimitero. Se hai offerto come Tributo un mostro all'attivazione, il tuo avversario non può scegliere come bersaglio i mostri "Rikka" che controlli con gli effetti delle carte in questo turno. Per il resto di questo turno dopo che questa carta si è risolta, non puoi Evocare Specialmente dall'Extra Deck, eccetto Mostri Xyz Pianta. Puoi attivare solo 1 "Acque Illuminate dalla Luna Rikka" per turno.
  | pt_name            = Águas ao Luar de Rikka
  | pt_text            = Quando você ativar este card, você também pode oferecer 1 monstro Planta como Tributo; pegue 2 monstros "Rikka" com o mesmo Nível, mas nomes diferentes do seu Deck, adicione 1 deles à sua mão e envie o outro para o Cemitério. Se você ofereceu como Tributo um monstro na ativação, seu oponente não pode escolher monstros "Rikka" que você controla como alvo de efeitos de card neste turno. Pelo resto deste turno depois que este card resolver, você não pode Invocar por Invocação-Especial do Deck Adicional, exceto Monstros Xyz Planta. Você só pode ativar 1 "Águas ao Luar de Rikka" por turno.
  | es_name            = Aguas a la Luz de la Luna Rikka
  | es_text            = Cuando activas esta carta, también puedes Sacrificar 1 monstruo Planta; toma 2 monstruos "Rikka" con el mismo Nivel pero nombres diferentes en tu Deck, añade 1 de ellos a tu mano y manda el otro al Cementerio. Si Sacrificaste un monstruo en la activación, este turno tu adversario no puede seleccionar con efectos de cartas monstruos "Rikka" que controles. Por el resto de este turno después de que esta carta se resuelva, no puedes Invocar de Modo Especial desde el Deck Extra, excepto Monstruos Xyz Planta. Sólo puedes activar 1 "Aguas a la Luz de la Luna Rikka" por turno.
  | ja_text            = このカード名のカードは１ターンに１枚しか発動できない。<br />このカードは自分フィールドの植物族モンスター１体をリリースして発動する事もできる。<br />①：デッキからレベルが同じでカード名が異なる「六花」モンスター２体を選び、その内の１体を手札に加え、もう１体を墓地へ送る。モンスターをリリースしてこのカードを発動した場合、このターン中、自分フィールドの「六花」モンスターを相手は効果の対象にできない。このカードの発動後、ターン終了時まで自分は植物族ＸモンスターしかＥＸデッキから特殊召喚できない。
  | ko_name            = 육화수월
  | ko_text            = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다.<br />이 카드는 자신 필드의 식물족 몬스터 1장을 릴리스하고 발동할 수도 있다.<br />①: 덱에서 레벨이 같고 카드명이 다른 "육화" 몬스터 2장을 골라, 그 중의 1장을 패에 넣고, 나머지 1장을 묘지로 보낸다. 몬스터를 릴리스하고 이 카드를 발동했을 경우, 이 턴 중에, 자신 필드의 "육화" 몬스터를 상대는 효과의 대상으로 할 수 없다. 이 카드의 발동 후, 턴 종료시까지 자신은 식물족 엑시즈 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다.
  | tc_name            = 六花水月
  | tc_text            = 此卡名的卡1回合僅可發動1張。<br />此卡也可以透過解放自己場上的1隻植物族怪獸來發動。<br />①：從牌組挑選等級相同、卡名不同的2隻「六花」怪獸，將其中1隻加入手牌，另1隻送至墓地。解放怪獸來發動此卡的情況下，此回合中，對手不可將自己場上的「六花」怪獸作為效果的對象。此卡發動後，直至回合結束時為止，自己從額外牌組僅可特殊召喚植物族超量怪獸。
  | sc_name            = 六花水月
  | sc_text            = 此卡名的卡1回合仅可发动1张。<br />此卡也可以通过解放自己场上的1只植物族怪兽来发动。<br />①：从牌组挑选等级相同、卡名不同的2只“六花”怪兽，将其中1只加入手牌，另1只送至墓地。解放怪兽来发动此卡的情况下，此回合中，对手不可将自己场上的“六花”怪兽作为效果的对象。此卡发动后，直至回合结束时为止，自己从额外牌组仅可特殊召唤植物族超量怪兽。
  }}
