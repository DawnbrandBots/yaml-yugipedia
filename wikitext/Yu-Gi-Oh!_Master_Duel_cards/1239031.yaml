  | text               = 2 monsters with different Types (Fiend, Illusion, or Spellcaster)<br />Gains ATK equal to the combined ATK of the monsters equipped to this card by its effect. If this card battles a monster, neither can be destroyed by that battle. Your opponent's monsters cannot attack any monsters, except this one. If this card is Special Summoned, or at the end of the Battle Phase, if this card battled: You can equip 1 monster your opponent controls to this card as an Equip Spell. You can only use this effect of "Nightmare-Eyes Restrict" once per turn.

  | fr_name            = Le Renoncé aux Yeux Cauchemardesques
  | fr_text            = 2 monstres de Types différents (Démon, Illusion ou Magicien)<br />Gagne une ATK égale à la somme des ATK des monstres qui sont équipés à cette carte par son effet. Si cette carte combat un monstre, aucun de ces 2 monstres ne peut être détruit par ce combat. Les monstres de votre adversaire ne peuvent pas attaquer de monstres (celui-ci exclu). Si cette carte est Invoquée Spécialement, ou à la fin de la Battle Phase, si cette carte a combattu : vous pouvez équiper 1 monstre contrôlé par votre adversaire à cette carte comme Magie d'Équipement. Vous ne pouvez utiliser cet effet de "Le Renoncé aux Yeux Cauchemardesques" qu'une fois par tour.
  | de_name            = Albtraumäugiges Opfer
  | de_text            = 2 Monster mit unterschiedlichen Typen (Unterweltler, Illusion oder Hexer)<br />Diese Karte erhält ATK in Höhe der kombinierten ATK der Monster, mit denen sie durch ihren Effekt ausgerüstet ist. Falls diese Karte gegen ein Monster kämpft, können beide durch jenen Kampf nicht zerstört werden. Monster deines Gegners können keine Monster angreifen, außer diesem. Falls diese Karte als Spezialbeschwörung beschworen wird oder am Ende der Battle Phase, falls diese Karte gekämpft hat: Du kannst diese Karte mit 1 Monster, das dein Gegner kontrolliert, als Ausrüstungszauber ausrüsten. Du kannst diesen Effekt von „Albtraumäugiges Opfer“ nur einmal pro Spielzug verwenden.
  | it_name            = Limite degli Occhi dell'Incubo
  | it_text            = 2 mostri con Tipi diversi (Demone, Illusione o Incantatore)<br />Guadagna ATK pari alla somma degli ATK dei mostri equipaggiati a questa carta dal suo effetto. Se questa carta combatte con un mostro, nessuno dei due può essere distrutto in quella battaglia. I mostri del tuo avversario non possono attaccare nessun mostro, eccetto questo. Se questa carta viene Evocata Specialmente, o alla fine della Battle Phase, se questa carta ha combattuto: puoi equipaggiare 1 mostro controllato dal tuo avversario a questa carta come una Magia Equipaggiamento. Puoi utilizzare questo effetto di "Limite degli Occhi dell'Incubo" una sola volta per turno.
  | pt_name            = Restrição do Olho do Pesadelo
  | pt_text            = 2 monstros com Tipos diferentes (Demônio, Ilusão ou Mago)<br />Ganha ATK igual ao ATK combinado dos monstros equipados a este card por seu efeito. Se este card batalhar um monstro, nenhum dos dois pode ser destruído nessa batalha. Os monstros do seu oponente não podem atacar nenhum monstro, exceto este. Se este card for Invocado por Invocação-Especial, ou no final da Fase de Batalha, se este card batalhou: você pode equipar 1 monstro que seu oponente controla a este card como uma Magia de Equipamento. Você só pode usar este efeito de "Restrição do Olho do Pesadelo" uma vez por turno.
  | es_name            = Límite de los Ojos de Pesadilla
  | es_text            = 2 monstruos con Tipos diferentes (Demonio, Ilusión o Lanzador de Conjuros)<br />Gana ATK igual al ATK combinado de los monstruos equipados a esta carta por su efecto. Si esta carta batalla con un monstruo, ninguno puede ser destruido en esa batalla. Los monstruos de tu adversario no pueden atacar monstruos, excepto a éste. Si esta carta es Invocada de Modo Especial o, al final de la Battle Phase, si esta carta batalló: puedes equipar a esta carta 1 monstruo que controle tu adversario como una Mágica de Equipo. Sólo puedes usar este efecto de "Límite de los Ojos de Pesadilla" una vez por turno.
  | ja_text            = 種族が異なる悪魔族・幻想魔族・魔法使い族モンスター×２<br />このカード名の①の効果は１ターンに１度しか使用できない。<br />①：このカードが特殊召喚した場合、またはこのカードが戦闘を行ったバトルフェイズ終了時に発動できる。相手フィールドのモンスター１体を装備魔法カード扱いでこのカードに装備する。<br />②：このカードの攻撃力は、このカードの効果で装備しているモンスターの攻撃力分アップする。<br />③：このカードがモンスターと戦闘を行う場合、その２体はその戦闘では破壊されない。<br />④：相手モンスターは他のモンスターを攻撃できない。
  | ko_name            = 나이트메어 아이즈 새크리파이스
  | ko_text            = 종족이 다른 악마족 / 환상마족 / 마법사족 몬스터 × 2<br />이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 특수 소환했을 경우, 또는 이 카드가 전투를 실행한 배틀 페이즈 종료시에 발동할 수 있다. 상대 필드의 몬스터 1장을 장착 마법 카드로 취급하고 이 카드에 장착한다.<br />②: 이 카드의 공격력은, 이 카드의 효과로 장착하고 있는 몬스터의 공격력만큼 올린다.<br />③: 이 카드가 몬스터와 전투를 실행할 경우, 그 2장은 그 전투로는 파괴되지 않는다.<br />④: 상대 몬스터는 다른 몬스터를 공격할 수 없다.
  | tc_name            = 幻惑眼納祭魔
  | tc_text            = 種族不同的惡魔族・幻想魔族・魔法使族怪獸×2<br />此卡名的①效果1回合僅可使用1次。<br />①：此卡特殊召喚的情況下，或此卡進行過戰鬥的戰鬥階段結束時可以發動。將對手場上的1隻怪獸視為裝備魔法卡裝備於此卡。<br />②：此卡的攻擊力上升相當於以此卡的效果裝備中的怪獸的攻擊力數值。<br />③：此卡與怪獸進行戰鬥的情況下，該2隻不會因該戰鬥被破壞。<br />④：對手怪獸不可攻擊其他怪獸。
  | sc_name            = 幻惑眼纳祭魔
  | sc_text            = 种族不同的恶魔族・幻想魔族・魔法师族怪兽×2<br />此卡名的①效果1回合仅可使用1次。<br />①：此卡特殊召唤的情况下，或此卡进行过战斗的战斗阶段结束时可以发动。将对手场上的1只怪兽视为装备魔法卡装备于此卡。<br />②：此卡的攻击力上升相当于以此卡的效果装备中的怪兽的攻击力数值。<br />③：此卡与怪兽进行战斗的情况下，该2只不会因该战斗被破坏。<br />④：对手怪兽不可攻击其他怪兽。
