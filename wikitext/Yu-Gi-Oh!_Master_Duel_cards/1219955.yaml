title: Clown Crew Cappello (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = LIGHT
  | types              = Beast-Warrior / Pendulum / Effect
  | level              = 5
  | pendulum_scale     = 7
  | atk                = 1900
  | def                = 800
  | pendulum_effect    = During your Main Phase: You can send 1 non-Pendulum "Clown Crew" card from your Deck to the GY, and if you do, Special Summon this card, also until the end of the next turn after this effect resolves, you cannot activate the effect of monsters Special Summoned from the Deck or Extra Deck. You can only use this effect of "Clown Crew Cappello" once per turn.
  | text               = Monsters your opponent controls lose 1500 DEF while you control a Tribute Summoned monster. If this card is Tributed: You can activate 1 of these effects (but you can only use each effect of "Clown Crew Cappello" once per turn);<br />●Shuffle all Pendulum Monsters from the face-up Extra Decks and the field into the Deck.<br />●Special Summon 1 non-Pendulum "Clown Crew" monster from your Deck or Extra Deck, ignoring its Summoning conditions.

  | fr_name            = Cappello, Troupe des Clowns
  | fr_pendulum_effect = Durant votre Main Phase : vous pouvez envoyer 1 carte non-Pendule "Troupe des Clowns" depuis votre Deck au Cimetière, et si vous le faites, Invoquez Spécialement cette carte, et aussi, jusqu'à la fin du prochain tour après la résolution de cet effet, vous ne pouvez pas activer les effets des monstres Invoqués Spécialement depuis le Deck ou Extra Deck. Vous ne pouvez utiliser cet effet de "Cappello, Troupe des Clowns" qu'une fois par tour.
  | fr_text            = Les monstres contrôlés par votre adversaire perdent 1500 DEF tant que vous contrôlez un monstre Invoqué par Sacrifice. Si cette carte est Sacrifiée : vous pouvez activer 1 de ces effets (mais vous ne pouvez utiliser chaque effet de "Cappello, Troupe des Clowns" qu'une fois par tour) ;<br />●Mélangez tous les Monstres Pendule depuis les Extra Decks face recto et le Terrain dans le Deck.<br />●Invoquez Spécialement 1 monstre non-Pendule "Troupe des Clowns" depuis votre Deck ou Extra Deck, en ignorant ses conditions d'Invocation.
  | de_name            = Clowntrupp Cappello
  | de_pendulum_effect = Während deiner Main Phase: Du kannst 1 „Clowntrupp“-Nichtpendel-Karte von deinem Deck auf den Friedhof legen und falls du dies tust, beschwöre diese Karte als Spezialbeschwörung, zusätzlich kannst du bis zum Ende des nächsten Spielzugs, nachdem dieser Effekt aufgelöst wurde, keine Effekte von Monstern aktivieren, die als Spezialbeschwörung vom Deck oder Extra Deck beschworen wurden. Du kannst diesen Effekt von „Clowntrupp Cappello“ nur einmal pro Spielzug verwenden.
  | de_text            = Monster, die dein Gegner kontrolliert, verlieren 1500 DEF, solange du ein als Tributbeschwörung beschworenes Monster kontrollierst. Falls diese Karte als Tribut angeboten wird: Du kannst 1 dieser Effekte aktivieren (aber du kannst jeden Effekt von „Clowntrupp Cappello“ nur einmal pro Spielzug verwenden);<br />●Mische alle Pendelmonster vom Spielfeld und offen von den Extra Decks ins Deck.<br />●Beschwöre 1 „Clowntrupp“-Nichtpendel-Monster als Spezialbeschwörung von deinem Deck oder Extra Deck, ungeachtet seiner Beschwörungsbedingungen.
  | it_name            = Compagnia di Clown Cappello
  | it_pendulum_effect = Durante la tua Main Phase: puoi mandare 1 carta "Compagnia di Clown" non-Pendulum dal tuo Deck al Cimitero e, se lo fai, Evoca Specialmente questa carta, inoltre fino alla fine del prossimo turno dopo che questo effetto si è risolto, non puoi attivare gli effetti dei mostri Evocati Specialmente dal Deck o Extra Deck. Puoi utilizzare questo effetto di "Compagnia di Clown Cappello" una sola volta per turno.
  | it_text            = I mostri controllati dal tuo avversario perdono 1500 DEF mentre controlli un mostro Evocato tramite Tributo. Se questa carta viene offerta come Tributo: puoi attivare 1 di questi effetti (ma puoi utilizzare ogni effetto di "Compagnia di Clown Cappello" una sola volta per turno);<br />●Mischia tutti i Mostri Pendulum dagli Extra Deck scoperti e dal Terreno nel Deck.<br />●Evoca Specialmente 1 mostro "Compagnia di Clown" non-Pendulum dal tuo Deck o Extra Deck, ignorando le sue condizioni di Evocazione.
  | pt_name            = Companhia de Palhaços Cappello
  | pt_pendulum_effect = Durante sua Fase Principal: você pode enviar 1 card "Companhia de Palhaços" que não seja Pêndulo do seu Deck para o Cemitério e, se isso acontecer, Invoque este card por Invocação-Especial e, além disso, até o final do próximo turno depois que este efeito resolver, você não pode ativar os efeitos de monstros Invocados por Invocação-Especial do Deck ou Deck Adicional. Você só pode usar este efeito de "Companhia de Palhaços Cappello" uma vez por turno.
  | pt_text            = Monstros que seu oponente controla perdem 1500 de DEF enquanto você controlar um monstro Invocado por Invocação-Tributo. Se este card for oferecido como Tributo: você pode ativar 1 desses efeitos (mas você só pode usar cada efeito de "Companhia de Palhaços Cappello" uma vez por turno);<br />●Embaralhe no Deck todos os Monstros Pêndulo dos Decks Adicionais com a face para cima e do campo.<br />●Invoque por Invocação-Especial 1 monstro "Companhia de Palhaços" que não seja Pêndulo do seu Deck ou Deck Adicional, ignorando suas condições de Invocação.
  | es_name            = Cappello de la Compañía de Payasos
  | es_pendulum_effect = Durante tu Main Phase: puedes mandar al Cementerio 1 carta "Compañía de Payasos" que no sea de Péndulo en tu Deck y, si lo haces, Invoca esta carta de Modo Especial y además, hasta el final del próximo turno después de que se resuelva este efecto, no puedes activar el efecto de los monstruos Invocados de Modo Especial desde el Deck o Deck Extra. Sólo puedes usar este efecto de "Cappello de la Compañía de Payasos" una vez por turno.
  | es_text            = Los monstruos que controla tu adversario pierden 1500 DEF mientras controles un monstruo Invocado por Sacrificio. Si esta carta es Sacrificada: puedes activar 1 de estos efectos (pero sólo puedes usar cada efecto de "Cappello de la Compañía de Payasos" una vez por turno);<br />●Baraja al Deck todos los Monstruos de Péndulo en los Decks Extra boca arriba y el Campo.<br />●Invoca de Modo Especial 1 monstruo "Compañía de Payasos" que no sea de Péndulo desde tu Deck o Deck Extra, ignorando sus condiciones de Invocación.
  | ja_pendulum_effect = このカード名のＰ効果は１ターンに１度しか使用できない。<br />①：自分メインフェイズに発動できる。デッキからＰモンスター以外の「道化の一座」カード１枚を墓地へ送り、このカードを特殊召喚する。この効果の発動後、次のターンの終了時まで自分はデッキ・ＥＸデッキから特殊召喚されたモンスターの効果を発動できない。
  | ja_text            = ①：Ａ召喚したモンスターが自分フィールドに存在する限り、相手フィールドのモンスターの守備力は１５００ダウンする。<br />②：このカードがリリースされた場合、以下の効果から１つを選択して発動できる（このカード名の以下の効果はそれぞれ１ターンに１度しか選択できない）。<br />●お互いのＥＸデッキ（表側）・フィールドのＰモンスターを全てデッキに戻す。<br />●デッキ・ＥＸデッキからＰモンスター以外の「道化の一座」モンスター１体を召喚条件を無視して特殊召喚する。
  | ko_name            = 크라운 클랜 햇
  | ko_pendulum_effect = 이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 자신 메인 페이즈에 발동할 수 있다. 덱에서 펜듈럼 몬스터 이외의 "크라운 클랜" 카드 1장을 묘지로 보내고, 이 카드를 특수 소환한다. 이 효과의 발동 후, 다음 턴의 종료시까지 자신은 덱 / 엑스트라 덱에서 특수 소환된 몬스터의 효과를 발동할 수 없다.
  | ko_text            = ①: 어드밴스 소환한 몬스터가 자신 필드에 존재하는 한, 상대 필드의 몬스터의 수비력은 1500 내린다.<br />②: 이 카드가 릴리스되었을 경우, 이하의 효과에서 1개를 선택하고 발동할 수 있다(이 카드명의 이하의 효과는 각각 1턴에 1번밖에 선택할 수 없다).<br />●서로의 엑스트라 덱(앞면 표시) / 필드의 펜듈럼 몬스터를 전부 덱으로 되돌린다.<br />●덱 / 엑스트라 덱에서 펜듈럼 몬스터 이외의 "크라운 클랜" 몬스터 1장을 소환 조건을 무시하고 특수 소환한다.
  | tc_name            = 小丑戲幫 哈特
  | tc_pendulum_effect = 此卡名的鐘擺效果1回合僅可使用1次。<br />①：在自己的主要階段可以發動。從牌組將鐘擺怪獸以外的1張「小丑戲幫」卡送至墓地，將此卡特殊召喚。此效果發動後，直至下個回合結束時為止自己不可發動從牌組・額外牌組被特殊召喚的怪獸的效果。
  | tc_text            = ①：只要上級召喚的怪獸存在於自己場上，對手場上的怪獸的守備力下降1500。<br />②：此卡被解放的情況下，可從以下效果中選擇1個發動（此卡名的以下效果1回合僅可各選擇1次）。<br />●將雙方的額外牌組（表側）・場上的鐘擺怪獸全部放回牌組。<br />●從牌組・額外牌組將鐘擺怪獸以外的1隻「小丑戲幫」怪獸無視召喚條件特殊召喚。
  | sc_name            = 小丑戏帮 哈特
  | sc_pendulum_effect = 此卡名的灵摆效果1回合仅可使用1次。<br />①：在自己的主要阶段可以发动。从牌组将灵摆怪兽以外的1张“小丑戏帮”卡送至墓地，将此卡特殊召唤。此效果发动后，直至下个回合结束时为止自己不可发动从牌组・额外牌组被特殊召唤的怪兽的效果。
  | sc_text            = ①：只要上级召唤的怪兽存在于自己场上，对手场上的怪兽的守备力下降1500。<br />②：此卡被解放的情况下，可从以下效果中选择1个发动（此卡名的以下效果1回合仅可各选择1次）。<br />●将双方的额外牌组（表侧）・场上的灵摆怪兽全部放回牌组。<br />●从牌组・额外牌组将灵摆怪兽以外的1只“小丑戏帮”怪兽无视召唤条件特殊召唤。
  }}
