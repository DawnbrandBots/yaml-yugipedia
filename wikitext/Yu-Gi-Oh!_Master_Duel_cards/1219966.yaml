title: Cursed Copycat Noble Arms (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | card_type          = Spell
  | property           = Equip
  | text               = The equipped monster gains 200 ATK/DEF for each Equip Spell in your field and GY. While this card is equipped to a Warrior monster: You can activate this effect; you cannot Special Summon for the rest of this turn, except Warrior monsters, also Special Summon 1 Warrior monster with the same Attribute and Level as the equipped monster but a different name from your Deck, and if you do, equip it with this card, then destroy the monster this card was equipped to. You can only use this effect of "Cursed Copycat Noble Arms" once per turn.

  | fr_name            = Armes Nobles Imitées Maudites
  | fr_text            = Le monstre équipé gagne 200 ATK/DEF pour chaque Magie d'Équipement dans votre Terrain et Cimetière. Tant que cette carte est équipée à un monstre Guerrier : vous pouvez activer cet effet ; vous ne pouvez pas Invoquer Spécialement (monstres Guerrier exclus) le reste de ce tour, et aussi, Invoquez Spécialement 1 monstre Guerrier du même Attribut et Niveau que le monstre équipé mais de nom différent depuis votre Deck, et si vous le faites, équipez-le avec cette carte, puis détruisez le monstre qui était équipé avec cette carte. Vous ne pouvez utiliser cet effet de "Armes Nobles Imitées Maudites" qu'une fois par tour.
  | de_name            = Verfluchte nachgeahmte edle Waffen
  | de_text            = Das ausgerüstete Monster erhält für jeden Ausrüstungszauber auf deiner Spielfeldseite und in deinem Friedhof 200 ATK/DEF. Solange diese Karte ein Krieger-Monster ausrüstet: Du kannst diesen Effekt aktivieren; du kannst für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von Krieger-Monstern, zusätzlich beschwöre 1 Krieger-Monster mit derselben Eigenschaft und Stufe wie das ausgerüstete Monster, aber einem unterschiedlichen Namen als Spezialbeschwörung von deinem Deck und falls du dies tust, rüste es mit dieser Karte aus, dann zerstöre das Monster, das mit dieser Karte ausgerüstet war. Du kannst diesen Effekt von „Verfluchte nachgeahmte edle Waffen“ nur einmal pro Spielzug verwenden.
  | it_name            = Nobili Armi Imitatore Maledetto
  | it_text            = Il mostro equipaggiato guadagna 200 ATK/DEF per ogni Magia Equipaggiamento nel tuo Terreno e Cimitero. Mentre questa carta è equipaggiata a un mostro Guerriero: puoi attivare questo effetto; non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri Guerriero, inoltre Evoca Specialmente 1 mostro Guerriero con lo stesso Attributo e Livello del mostro equipaggiato ma con un nome diverso dal tuo Deck e, se lo fai, equipaggialo con questa carta, poi distruggi il mostro a cui questa carta era equipaggiata. Puoi utilizzare questo effetto di "Nobili Armi Imitatore Maledetto" una sola volta per turno.
  | pt_name            = Armas Nobres do Imitador Amaldiçoado
  | pt_text            = O monstro equipado ganha 200 de ATK/DEF para cada Magia de Equipamento no seu campo e Cemitério. Enquanto este card estiver equipado a um monstro Guerreiro: você pode ativar este efeito; você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros Guerreiro e, além disso, Invoque por Invocação-Especial do seu Deck 1 monstro Guerreiro com o mesmo Atributo e Nível que o do monstro equipado, mas um nome diferente e, se isso acontecer, equipe-o com este card e, depois, destrua o monstro ao qual este card estava equipado. Você só pode usar este efeito de "Armas Nobres do Imitador Amaldiçoado" uma vez por turno.
  | es_name            = Armas Nobles de Imitación Maldita
  | es_text            = El monstruo equipado gana 200 ATK/DEF por cada Mágica de Equipo en tu Campo y Cementerio. Mientras esta carta está equipada a un monstruo Guerrero: puedes activar este efecto; no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos Guerrero, y además Invoca de Modo Especial, desde tu Deck, 1 monstruo Guerrero con el mismo Atributo y Nivel que los del monstruo equipado, pero un nombre diferente y, si lo haces, equípalo con esta carta, y después destruye el monstruo al que esta carta estaba equipada. Sólo puedes usar este efecto de "Armas Nobles de Imitación Maldita" una vez por turno.
  | ja_text            = このカード名の②の効果は１ターンに１度しか使用できない。<br />①：装備モンスターの攻撃力・守備力は、自分のフィールド・墓地の装備魔法カードの数×２００アップする。<br />②：このカードが戦士族モンスターに装備されている場合に発動できる。装備モンスターとはカード名が異なり、属性・レベルが同じ戦士族モンスター１体をデッキから特殊召喚し、このカードをそのモンスターに装備する。その後、このカードを装備していたモンスターを破壊する。この効果の発動後、ターン終了時まで自分は戦士族モンスターしか特殊召喚できない。
  | ko_name            = 천마복성검
  | ko_text            = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 장착 몬스터의 공격력 / 수비력은, 자신의 필드 / 묘지의 장착 마법 카드의 수 × 200 올린다.<br />②: 이 카드가 전사족 몬스터에 장착되어 있을 경우에 발동할 수 있다. 장착 몬스터와는 카드명이 다르고, 속성 / 레벨이 같은 전사족 몬스터 1장을 덱에서 특수 소환하여, 이 카드를 그 몬스터에 장착한다. 그 후, 이 카드를 장착하고 있던 몬스터를 파괴한다. 이 효과의 발동 후, 턴 종료시까지 자신은 전사족 몬스터밖에 특수 소환할 수 없다.
  | tc_name            = 天魔伏聖劍
  | tc_text            = 此卡名的②效果1回合僅可使用1次。<br />①：裝備怪獸的攻擊力・守備力上升自己場上・墓地的裝備魔法卡的數量×200的數值。<br />②：此卡裝備於戰士族怪獸的情況下可以發動。從牌組將與裝備怪獸卡名不同、屬性・等級相同的1隻戰士族怪獸特殊召喚，將此卡裝備於該怪獸。然後，將原先裝備此卡的怪獸破壞。此效果發動後，直至回合結束時為止自己僅可特殊召喚戰士族怪獸。
  | sc_name            = 天魔伏圣剑
  | sc_text            = 此卡名的②效果1回合仅可使用1次。<br />①：装备怪兽的攻击力・守备力上升自己场上・墓地的装备魔法卡的数量×200的数值。<br />②：此卡装备于战士族怪兽的情况下可以发动。从牌组将与装备怪兽卡名不同、属性・等级相同的1只战士族怪兽特殊召唤，将此卡装备于该怪兽。然后，将原先装备此卡的怪兽破坏。此效果发动后，直至回合结束时为止自己仅可特殊召唤战士族怪兽。
  }}
