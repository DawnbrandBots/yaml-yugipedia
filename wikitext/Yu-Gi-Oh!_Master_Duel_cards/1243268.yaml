title: Horoscope Sorcerer, the Stargazer Magician (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = DARK
  | types              = Spellcaster / Pendulum / Effect
  | level              = 5
  | pendulum_scale     = 1
  | atk                = 1200
  | def                = 2400
  | pendulum_effect    = When a Spell Card or effect activated by your opponent resolves, if you control a "Magician" Pendulum Monster or an "Odd-Eyes" monster, you can negate that effect, then destroy this card. You can only use this effect of "Horoscope Sorcerer, the Stargazer Magician" once per turn.
  | text               = If this card is in your hand: You can discard 1 other "Magician" Pendulum Monster, "Performapal" monster, or "Odd-Eyes" monster; Special Summon this card. If this card is Special Summoned: You can add 1 Pendulum Monster with 2500 ATK from your Deck to your hand. You can target 1 Pendulum Monster Card you control; destroy it, then you can add 1 face-up Pendulum Monster from your Extra Deck to your hand. You can only use each effect of "Horoscope Sorcerer, the Stargazer Magician" once per turn.

  | fr_name            = Sorcier Horoscopique, le Magicien Observateur des Étoiles
  | fr_pendulum_effect = Lorsqu'une Carte Magie ou effet de Magie activé par votre adversaire est résolu, si vous contrôlez un Monstre Pendule "Magicien" ou monstre "Yeux Impairs", vous pouvez annuler l'effet, puis détruisez cette carte. Vous ne pouvez utiliser cet effet de "Sorcier Horoscopique, le Magicien Observateur des Étoiles" qu'une fois par tour.
  | fr_text            = Si cette carte est dans votre main : vous pouvez défausser 1 autre Monstre Pendule "Magicien", monstre "Potartiste" ou monstre "Yeux Impairs" ; Invoquez Spécialement cette carte. Si cette carte est Invoquée Spécialement : vous pouvez ajouter 1 Monstre Pendule avec 2500 ATK depuis votre Deck à votre main. Vous pouvez cibler 1 Carte Monstre Pendule que vous contrôlez ; détruisez-la, puis vous pouvez ajouter 1 Monstre Pendule face recto depuis votre Extra Deck à votre main. Vous ne pouvez utiliser chaque effet de "Sorcier Horoscopique, le Magicien Observateur des Étoiles" qu'une fois par tour.
  | de_name            = Horoskopzauberer, sterndeutender Magier
  | de_pendulum_effect = Wenn eine Zauberkarte oder ein Zaubereffekt aufgelöst wird, die oder der von deinem Gegner aktiviert wurde, falls du ein „Magier“-Pendelmonster oder ein „Buntäugig“-Monster kontrollierst, kannst du jenen Effekt annullieren, dann zerstöre diese Karte. Du kannst diesen Effekt von „Horoskopzauberer, sterndeutender Magier“ nur einmal pro Spielzug verwenden.
  | de_text            = Falls sich diese Karte in deiner Hand befindet: Du kannst 1 anderes „Magier“-Pendelmonster, „Künstlerkumpel“-Monster oder „Buntäugig“-Monster abwerfen; beschwöre diese Karte als Spezialbeschwörung. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst deiner Hand 1 Pendelmonster mit 2500 ATK von deinem Deck hinzufügen. Du kannst 1 Pendelmonsterkarte wählen, die du kontrollierst; zerstöre sie, dann kannst du deiner Hand 1 offenes Pendelmonster von deinem Extra Deck hinzufügen. Du kannst jeden Effekt von „Horoskopzauberer, sterndeutender Magier“ nur einmal pro Spielzug verwenden.
  | it_name            = Stregone Oroscopo, il Mago Mirastelle
  | it_pendulum_effect = Quando una Carta Magia o un suo effetto che il tuo avversario ha attivato si risolve, se controlli un Mostro Pendulum "Mago" o un mostro "Occhi Diversi", puoi annullare quell'effetto, poi distruggere questa carta. Puoi utilizzare questo effetto di "Stregone Oroscopo, il Mago Mirastelle" una sola volta per turno.
  | it_text            = Se questa carta è nella tua mano: puoi scartare 1 altro Mostro Pendulum "Mago", mostro "Artistamico" o mostro "Occhi Diversi"; Evoca Specialmente questa carta. Se questa carta viene Evocata Specialmente: puoi aggiungere 1 Mostro Pendulum con 2500 ATK dal tuo Deck alla tua mano. Puoi scegliere come bersaglio 1 Carta Mostro Pendulum che controlli; distruggila, poi puoi aggiungere 1 Mostro Pendulum scoperto dal tuo Extra Deck alla tua mano. Puoi utilizzare ogni effetto di "Stregone Oroscopo, il Mago Mirastelle" una sola volta per turno.
  | pt_name            = Feiticeiro do Horóscopo, o Mago Observador das Estrelas
  | pt_pendulum_effect = Quando um Card de Magia ou efeito ativado pelo seu oponente resolver, se você controlar um Monstro Pêndulo "Mago" ou um monstro "Olhos Anômalos", você pode negar o efeito e, depois, destrua este card. Você só pode usar este efeito de "Feiticeiro do Horóscopo, o Mago Observador das Estrelas" uma vez por turno.
  | pt_text            = Se este card estiver na sua mão: você pode descartar 1 outro Monstro Pêndulo "Mago", monstro "Camarartista" ou monstro "Olhos Anômalos"; Invoque este card por Invocação-Especial. Se este card for Invocado por Invocação-Especial: você pode adicionar 1 Monstro Pêndulo com 2500 de ATK do seu Deck à sua mão. Você pode escolher 1 Card de Monstro Pêndulo que você controla; destrua-o e, depois, você pode adicionar 1 Monstro Pêndulo com a face para cima do seu Deck Adicional à sua mão. Você só pode usar cada efeito de "Feiticeiro do Horóscopo, o Mago Observador das Estrelas" uma vez por turno.
  | es_name            = Hechicero del Horóscopo, el Mago Contemplaestrellas
  | es_pendulum_effect = Cuando se resuelve una Carta Mágica o su efecto activados por tu adversario, si controlas un Monstruo de Péndulo "Mago/a" o un monstruo "Ojos Anómalos", puedes negar ese efecto, y después destruye esta carta. Sólo puedes usar este efecto de "Hechicero del Horóscopo, el Mago Contemplaestrellas" una vez por turno.
  | es_text            = Si esta carta está en tu mano: puedes descartar otro Monstruo de Péndulo "Mago/a", monstruo "Artistamigo" o monstruo "Ojos Anómalos"; Invoca esta carta de Modo Especial. Si esta carta es Invocada de Modo Especial: puedes añadir a tu mano 1 Monstruo de Péndulo con 2500 ATK en tu Deck. Puedes seleccionar 1 Carta de Monstruo de Péndulo que controles; destrúyela, y después puedes añadir a tu mano 1 Monstruo de Péndulo boca arriba en tu Deck Extra. Sólo puedes usar cada efecto de "Hechicero del Horóscopo, el Mago Contemplaestrellas" una vez por turno.
  | ja_pendulum_effect = このカード名のＰ効果は１ターンに１度しか使用できない。<br />①：相手が発動した魔法カードの効果の処理時に、自分フィールドに「魔術師」Ｐモンスターか「オッドアイズ」モンスターが存在する場合、その発動した効果を無効にできる。その後、このカードを破壊する。
  | ja_text            = このカード名の①②③のモンスター効果はそれぞれ１ターンに１度しか使用できない。<br />①：手札から他の「魔術師」Ｐモンスター、「ＥＭ」モンスター、「オッドアイズ」モンスター１体を捨てて発動できる。このカードを手札から特殊召喚する。<br />②：このカードが特殊召喚した場合に発動できる。デッキから攻撃力２５００のＰモンスター１体を手札に加える。<br />③：自分フィールドのＰモンスターカード１枚を対象として発動できる。そのカードを破壊する。その後、自分のＥＸデッキ（表側）からＰモンスター１体を手札に加える事ができる。
  | ko_name            = 별을 읽는 마술사－홀로스코프 매지션
  | ko_pendulum_effect = 이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 상대가 발동한 마법 카드의 효과 처리시에, 자신 필드에 "마술사" 펜듈럼 몬스터나 "오드아이즈" 몬스터가 존재할 경우, 그 발동한 효과를 무효로 할 수 있다. 그 후, 이 카드를 파괴한다.
  | ko_text            = 이 카드명의 ①②③의 몬스터 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 패에서 다른 "마술사" 펜듈럼 몬스터, "EM(엔터메이트)" 몬스터, "오드아이즈" 몬스터 1장을 버리고 발동할 수 있다. 이 카드를 패에서 특수 소환한다.<br />②: 이 카드를 특수 소환했을 경우에 발동할 수 있다. 덱에서 공격력 2500 인 펜듈럼 몬스터 1장을 패에 넣는다.<br />③: 자신 필드의 펜듈럼 몬스터 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 파괴한다. 그 후, 자신의 엑스트라 덱(앞면)에서 펜듈럼 몬스터 1장을 패에 넣을 수 있다.
  | tc_name            = 星讀的魔術師－天宮圖魔術士
  | tc_pendulum_effect = 此卡名的鐘擺效果1回合僅可使用1次。<br />①：對手發動的魔法卡的效果處理時，自己場上存在「魔術師」鐘擺怪獸或「異色眼」怪獸的情況下，可將該發動的效果無效。然後，將此卡破壞。
  | tc_text            = 此卡名的①②③怪獸效果1回合僅可各使用1次。<br />①：從手牌將1隻其他的「魔術師」鐘擺怪獸、「娛樂夥伴」怪獸、「異色眼」怪獸捨棄可以發動。從手牌將此卡特殊召喚。<br />②：此卡特殊召喚的情況下可以發動。從牌組將1隻攻擊力2500的鐘擺怪獸加入手牌。<br />③：以自己場上的1張鐘擺怪獸卡為對象可以發動。將該卡破壞。然後，可從自己額外牌組（表側）將1隻鐘擺怪獸加入手牌。
  | sc_name            = 星读的魔术师－天宫图魔术士
  | sc_pendulum_effect = 此卡名的灵摆效果1回合仅可使用1次。<br />①：对手发动的魔法卡的效果处理时，自己场上存在“魔术师”灵摆怪兽或“异色眼”怪兽的情况下，可将该发动的效果无效。然后，将此卡破坏。
  | sc_text            = 此卡名的①②③怪兽效果1回合仅可各使用1次。<br />①：从手牌将1只其他的“魔术师”灵摆怪兽、“娱乐伙伴”怪兽、“异色眼”怪兽舍弃可以发动。从手牌将此卡特殊召唤。<br />②：此卡特殊召唤的情况下可以发动。从牌组将1只攻击力2500的灵摆怪兽加入手牌。<br />③：以自己场上的1张灵摆怪兽卡为对象可以发动。将该卡破坏。然后，可从自己额外牌组（表侧）将1只灵摆怪兽加入手牌。
  }}
