title: Mischief of the Wolves (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = N
  | card_type          = Spell
  | property           = Quick-Play
  | text               = Apply these effects in sequence.<br />●Reduce the Levels of all monsters your opponent controls by 2.<br />●Increase the Levels of all monsters you control by 2.<br />During your Main Phase, if this card is in the GY because it was sent there this turn: You can target 1 face-up card you control; destroy it, and if you do, add this card to your hand. You can only use this effect of "Mischief of the Wolves" once per turn.

  | fr_name            = Espièglerie des Loups
  | fr_text            = Appliquez ces effets dans l'ordre.<br />●Réduisez le Niveau de tous les monstres contrôlés par votre adversaire de 2.<br />●Augmentez le Niveau de tous les monstres que vous contrôlez de 2.<br />Durant votre Main Phase, si cette carte est dans le Cimetière parce qu'elle y a été envoyée ce tour : vous pouvez cibler 1 carte face recto que vous contrôlez ; détruisez-la, et si vous le faites, ajoutez cette carte à votre main. Vous ne pouvez utiliser cet effet de "Espièglerie des Loups" qu'une fois par tour.
  | de_name            = Übermut der Wölfe
  | de_text            = Führe nacheinander diese Effekte aus.<br />●Verringere die Stufen aller Monster, die dein Gegner kontrolliert, um 2.<br />●Erhöhe die Stufen aller Monster, die du kontrollierst, um 2.<br />Während deiner Main Phase, falls sich diese Karte im Friedhof befindet, weil sie in diesem Spielzug dorthin gelegt wurde: Du kannst 1 offene Karte wählen, die du kontrollierst; zerstöre sie und falls du dies tust, füge diese Karte deiner Hand hinzu. Du kannst diesen Effekt von „Übermut der Wölfe“ nur einmal pro Spielzug verwenden.
  | it_name            = Dispetto dei Lupi
  | it_text            = Applica questi effetti in ordine.<br />●Riduci i Livelli di tutti i mostri controllati dal tuo avversario di 2.<br />●Aumenta i Livelli di tutti i mostri che controlli di 2.<br />Durante la tua Main Phase, se questa carta è nel Cimitero perché è stata mandata lì in questo turno: puoi scegliere come bersaglio 1 carta scoperta che controlli; distruggila e, se lo fai, aggiungi questa carta alla tua mano. Puoi utilizzare questo effetto di "Dispetto dei Lupi" una sola volta per turno.
  | pt_name            = Travessuras dos Lobos
  | pt_text            = Aplique esses efeitos em sequência.<br />●Reduza em 2 os Níveis de todos os monstros que seu oponente controla.<br />●Aumente em 2 os Níveis de todos os monstros que você controla.<br />Durante sua Fase Principal, se este card estiver no Cemitério porque foi enviado para lá neste turno: você pode escolher 1 card com a face para cima que você controla; destrua-o e, se isso acontecer, adicione este card à sua mão. Você só pode usar este efeito de "Travessuras dos Lobos" uma vez por turno.
  | es_name            = Travesuras de los Lobos
  | es_text            = Aplica estos efectos en secuencia.<br />●Reduce los Niveles de todos los monstruos que controle tu adversario en 2.<br />●Aumenta los Niveles de todos los monstruos que controles en 2.<br />Durante tu Main Phase, si esta carta está en el Cementerio porque fue mandada allí este turno: puedes seleccionar 1 carta boca arriba que controles; destrúyela y, si lo haces, añade esta carta a tu mano. Sólo puedes usar este efecto de "Travesuras de los Lobos" una vez por turno.
  | ja_text            = このカード名の②の効果は１ターンに１度しか使用できない。<br />①：以下の効果をそれぞれ適用する。<br />●相手フィールドの全てのモンスターのレベルは２つ下がる。<br />●自分フィールドの全てのモンスターのレベルは２つ上がる。<br />②：このカードが墓地へ送られたターンの自分メインフェイズに、自分フィールドの表側表示カード１枚を対象として発動できる。そのカードを破壊し、このカードを手札に加える。
  | ko_name            = 늑대의 장난
  | ko_text            = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이하의 효과를 각각 적용한다.<br />●상대 필드의 모든 몬스터의 레벨은 2개 내려간다.<br />●자신 필드의 모든 몬스터의 레벨은 2개 올라간다.<br />②: 이 카드가 묘지로 보내진 턴의 자신 메인 페이즈에, 자신 필드의 앞면 표시 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 파괴하고, 이 카드를 패에 넣는다.
  | tc_name            = 大狼的惡作劇
  | tc_text            = 此卡名的②效果1回合僅可使用1次。<br />①：分別適用以下效果。<br />●對手場上的所有怪獸的等級下降2。<br />●自己場上的所有怪獸的等級上升2。<br />②：在此卡被送至墓地的回合的自己主要階段，以自己場上的1張表側表示卡為對象可以發動。將該卡破壞，將此卡加入手牌。
  | sc_name            = 大狼的恶作剧
  | sc_text            = 此卡名的②效果1回合仅可使用1次。<br />①：分别适用以下效果。<br />●对手场上的所有怪兽的等级下降2。<br />●自己场上的所有怪兽的等级上升2。<br />②：在此卡被送至墓地的回合的自己主要阶段，以自己场上的1张表侧表示卡为对象可以发动。将该卡破坏，将此卡加入手牌。
  }}
