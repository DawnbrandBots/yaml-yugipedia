title: Vodnika the Fountain Spirit (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | attribute          = LIGHT
  | types              = Aqua / Effect
  | level              = 10
  | atk                = 2000
  | def                = 2100
  | text               = If a Level 10 monster(s) is sent to the GY, except "Vodnika the Fountain Spirit" (except during the Damage Step): You can Special Summon this card from your GY (if it was there when the monster was sent) or hand (even if not) in Defense Position, but banish it when it leaves the field. You can target 1 Level 10 monster in your GY; Special Summon it to your opponent's field (but negate its effects), then draw 1 card. You can only use each effect of "Vodnika the Fountain Spirit" once per turn.

  | fr_name            = Vodnika l'Esprit de la Fontaine
  | fr_text            = Si un ou plusieurs monstres de Niveau 10 ("Vodnika l'Esprit de la Fontaine" exclu) sont envoyés au Cimetière (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte depuis votre Cimetière (si elle y était lorsque les monstres ont été envoyés) ou la main (même si elle n'y était pas) en Position de Défense, mais bannissez-la lorsqu'elle quitte le Terrain. Vous pouvez cibler 1 monstre de Niveau 10 dans votre Cimetière ; Invoquez-le Spécialement sur le Terrain de votre adversaire (mais annulez ses effets), puis piochez 1 carte. Vous ne pouvez utiliser chaque effet de "Vodnika l'Esprit de la Fontaine" qu'une fois par tour.
  | de_name            = Vodnika der Springbrunnengeist
  | de_text            = Falls ein oder mehr Monster der Stufe 10 auf den Friedhof gelegt werden, außer „Vodnika der Springbrunnengeist“ (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung von deinem Friedhof (falls sie dort lag, als das Monster gelegt wurde) oder deiner Hand (selbst falls nicht) in die Verteidigungsposition beschwören, aber verbanne sie, wenn sie das Spielfeld verlässt. Du kannst 1 Monster der Stufe 10 in deinem Friedhof wählen; beschwöre es als Spezialbeschwörung auf die Spielfeldseite deines Gegners (aber annulliere seine Effekte), dann ziehe 1 Karte. Du kannst jeden Effekt von „Vodnika der Springbrunnengeist“ nur einmal pro Spielzug verwenden.
  | it_name            = Vodnika lo Spirito della Fontana
  | it_text            = Se uno o più mostri di Livello 10 vengono mandati al Cimitero, eccetto "Vodnika lo Spirito della Fontana" (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta dal tuo Cimitero (se era lì quando il mostro è stato mandato) o mano (anche se non era lì) in Posizione di Difesa, ma bandiscila quando lascia il Terreno. Puoi scegliere come bersaglio 1 mostro di Livello 10 nel tuo Cimitero; Evocalo Specialmente sul Terreno del tuo avversario (ma annulla i suoi effetti), poi pesca 1 carta. Puoi utilizzare ogni effetto di "Vodnika lo Spirito della Fontana" una sola volta per turno.
  | pt_name            = Vodnika, o Espírito da Fonte
  | pt_text            = Se um ou mais monstros de Nível 10 forem enviados para o Cemitério, exceto "Vodnika, o Espírito da Fonte" (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial do seu Cemitério (se ele estava lá quando o monstro foi enviado) ou da mão (mesmo se ele não estava) em Posição de Defesa, mas bana-o quando ele deixar o campo. Você pode escolher 1 monstro de Nível 10 no seu Cemitério; Invoque-o por Invocação-Especial no campo do seu oponente (mas negue seus efeitos) e, depois, compre 1 card. Você só pode usar cada efeito de "Vodnika, o Espírito da Fonte" uma vez por turno.
  | es_name            = Vodnika el Espíritu de la Fuente
  | es_text            = Si uno o más monstruos de Nivel 10 son mandados al Cementerio, excepto "Vodnika el Espíritu de la Fuente" (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial desde tu Cementerio (si estaba allí cuando el monstruo fue mandado) o mano (aun si no lo estaba) en Posición de Defensa, pero destiérrala cuando deje el Campo. Puedes seleccionar 1 monstruo de Nivel 10 en tu Cementerio; Invócalo de Modo Especial al Campo de tu adversario (pero niega sus efectos), y después roba 1 carta. Sólo puedes usar cada efecto de "Vodnika el Espíritu de la Fuente" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：「還流の精ヴォドニカ」以外のレベル１０モンスターが墓地へ送られた場合に発動できる。このカードを手札・墓地から守備表示で特殊召喚する。この効果で特殊召喚したこのカードは、フィールドから離れた場合に除外される。<br />②：自分の墓地のレベル１０モンスター１体を対象として発動できる。そのモンスターを効果を無効にして相手フィールドに特殊召喚する。その後、自分は１枚ドローする。
  | ko_name            = 환류의 정령 보드니카
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: "환류의 정령 보드니카" 이외의 레벨 10 몬스터가 묘지로 보내졌을 경우에 발동할 수 있다. 이 카드를 패 / 묘지에서 수비 표시로 특수 소환한다. 이 효과로 특수 소환한 이 카드는, 필드에서 벗어났을 경우에 제외된다.<br />②: 자신 묘지의 레벨 10 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 효과를 무효로 하고 상대 필드에 특수 소환한다. 그 후, 자신은 1장 드로우한다.
  | tc_name            = 還流之精 旺多尼卡
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：「還流之精 旺多尼卡」以外的等級10怪獸被送至墓地的情況下可以發動。從手牌・墓地將此卡以守備表示特殊召喚。以此效果特殊召喚的此卡從場上離開的情況下將被除外。<br />②：以自己墓地的1隻等級10怪獸為對象可以發動。將該怪獸的效果無效並特殊召喚至對手場上。然後，自己抽1張。
  | sc_name            = 还流之精 旺多尼卡
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：“还流之精 旺多尼卡”以外的等级10怪兽被送至墓地的情况下可以发动。从手牌・墓地将此卡以守备表示特殊召唤。以此效果特殊召唤的此卡从场上离开的情况下将被除外。<br />②：以自己墓地的1只等级10怪兽为对象可以发动。将该怪兽的效果无效并特殊召唤至对手场上。然后，自己抽1张。
  }}
