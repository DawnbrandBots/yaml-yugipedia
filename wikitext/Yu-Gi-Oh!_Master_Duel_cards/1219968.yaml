title: Clown Crew Soiree Operations (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | card_type          = Trap
  | property           = Normal
  | text               = Activate 1 of these effects (but you can only use each of these effects of "Clown Crew Soiree Operations" once per turn, also until the end of the next turn after this card resolves, you cannot activate the effects of monsters Special Summoned from the Deck or Extra Deck);<br />●Special Summon up to 2 "Clown Crew" monsters from your Deck and/or Extra Deck, ignoring their Summoning conditions.<br />●Add 1 "Clown Crew" monster from your Deck to your hand.<br />During the Main Phase: You can banish this card from your GY; immediately after this effect resolves, Tribute Summon 1 "Clown Crew" monster face-up.

  | fr_name            = Prestation Vespérale de la Troupe des Clowns
  | fr_text            = Activez 1 de ces effets (mais vous ne pouvez utiliser chacun de ces effets de "Prestation Vespérale de la Troupe des Clowns" qu'une fois par tour, et aussi, jusqu'à la fin du prochain tour après la résolution de cette carte, vous ne pouvez pas activer les effets des monstres Invoqués Spécialement depuis le Deck ou Extra Deck) ;<br />●Invoquez Spécialement max. 2 monstres "Troupe des Clowns" depuis votre Deck et/ou Extra Deck, en ignorant leurs conditions d'Invocation.<br />●Ajoutez 1 monstre "Troupe des Clowns" depuis votre Deck à votre main.<br />Durant la Main Phase : vous pouvez bannir cette carte depuis votre Cimetière ; immédiatement après la résolution de cet effet, Invoquez par Sacrifice face recto 1 monstre "Troupe des Clowns".
  | de_name            = Clowntrupp-Abendvorstellung
  | de_text            = Aktiviere 1 dieser Effekte (aber du kannst jeden dieser Effekte von „Clowntrupp-Abendvorstellung“ nur einmal pro Spielzug verwenden, zusätzlich kannst du bis zum Ende des nächsten Spielzugs, nachdem diese Karte aufgelöst wurde, keine Effekte von Monstern aktivieren, die als Spezialbeschwörung vom Deck oder Extra Deck beschworen wurden);<br />●Beschwöre bis zu 2 „Clowntrupp“-Monster als Spezialbeschwörung von deinem Deck und/oder Extra Deck, ungeachtet ihrer Beschwörungsbedingungen.<br />●Füge deiner Hand 1 „Clowntrupp“-Monster von deinem Deck hinzu.<br />Während der Main Phase: Du kannst diese Karte von deinem Friedhof verbannen; sofort nachdem dieser Effekt aufgelöst wurde, beschwöre 1 „Clowntrupp“-Monster offen als Tributbeschwörung.
  | it_name            = Operazioni Serali Compagnia di Clown
  | it_text            = Attiva 1 di questi effetti (ma puoi utilizzare ognuno di questi effetti di "Operazioni Serali Compagnia di Clown" una sola volta per turno, inoltre fino alla fine del prossimo turno dopo che questa carta si è risolta, non puoi attivare gli effetti dei mostri Evocati Specialmente dal Deck o Extra Deck);<br />●Evoca Specialmente fino a 2 mostri "Compagnia di Clown" dal tuo Deck e/o Extra Deck, ignorando le loro condizioni di Evocazione.<br />●Aggiungi 1 mostro "Compagnia di Clown" dal tuo Deck alla tua mano.<br />Durante la Main Phase: puoi bandire questa carta dal tuo Cimitero; immediatamente dopo che questo effetto si è risolto, Evoca tramite Tributo 1 mostro "Compagnia di Clown" scoperto.
  | pt_name            = Operações Soirée da Companhia de Palhaços
  | pt_text            = Ative 1 desses efeitos (mas você só pode usar cada um desses efeitos de "Operações Soirée da Companhia de Palhaços" uma vez por turno e, além disso, até o final do próximo turno depois que este card resolver, você não pode ativar os efeitos de monstros Invocados por Invocação-Especial do Deck ou Deck Adicional);<br />●Invoque por Invocação-Especial até 2 monstros "Companhia de Palhaços" do seu Deck e/ou Deck Adicional, ignorando suas condições de Invocação.<br />●Adicione 1 monstro "Companhia de Palhaços" do seu Deck à sua mão.<br />Durante a Fase Principal: você pode banir este card do seu Cemitério; imediatamente depois que este efeito resolver, Invoque por Invocação-Tributo 1 monstro "Companhia de Palhaços" com a face para cima.
  | es_name            = Velada de Operaciones de la Compañía de Payasos
  | es_text            = Activa 1 de estos efectos (pero sólo puedes usar cada uno de estos efectos de "Velada de Operaciones de la Compañía de Payasos" una vez por turno, y además hasta el final del próximo turno después de que esta carta se resuelva, no puedes activar los efectos de monstruos Invocados de Modo Especial desde el Deck o Deck Extra);<br />●Invoca de Modo Especial hasta 2 monstruos "Compañía de Payasos" desde tu Deck y/o Deck Extra, ignorando sus condiciones de Invocación.<br />●Añade a tu mano 1 monstruo "Compañía de Payasos" en tu Deck.<br />Durante la Main Phase: puedes desterrar esta carta en tu Cementerio; inmediatamente después de que se resuelva este efecto, Invoca por Sacrificio 1 monstruo "Compañía de Payasos" boca arriba.
  | ja_text            = ①：以下の効果から１つを選択して発動できる（このカード名の以下の効果はそれぞれ１ターンに１度しか選択できない）。このカードの発動後、次のターンの終了時まで自分はデッキ・ＥＸデッキから特殊召喚されたモンスターの効果を発動できない。<br />●デッキ・ＥＸデッキから「道化の一座」モンスターを２体まで召喚条件を無視して特殊召喚する。<br />●デッキから「道化の一座」モンスター１体を手札に加える。<br />②：自分・相手のメインフェイズに、墓地のこのカードを除外して発動できる。「道化の一座」モンスター１体のＡ召喚を表側表示で行う。
  | ko_name            = 크라운 클랜 『스와레』
  | ko_text            = ①: 이하의 효과에서 1개를 선택하고 발동할 수 있다(이 카드명의 이하의 효과는 각각 1턴에 1번밖에 선택할 수 없다). 이 카드의 발동 후, 다음 턴의 종료시까지 자신은 덱 / 엑스트라 덱에서 특수 소환된 몬스터의 효과를 발동할 수 없다.<br />●덱 / 엑스트라 덱에서 "크라운 클랜" 몬스터를 2장까지 소환 조건을 무시하고 특수 소환한다.<br />●덱에서 "크라운 클랜" 몬스터 1장을 패에 넣는다.<br />②: 자신 / 상대의 메인 페이즈에, 묘지의 이 카드를 제외하고 발동할 수 있다. "크라운 클랜" 몬스터 1장의 어드밴스 소환을 앞면 표시로 실행한다.
  | tc_name            = 小丑戲幫《怪演》
  | tc_text            = ①：可從以下效果中選擇1個發動（此卡名的以下效果1回合僅可各選擇1次）。此卡發動後，直至下個回合結束時為止，自己不可發動被從牌組・額外牌組特殊召喚的怪獸的效果。<br />●從牌組・額外牌組將最多2隻「小丑戲幫」怪獸無視召喚條件特殊召喚。<br />●從牌組將1隻「小丑戲幫」怪獸加入手牌。<br />②：在自己・對手的主要階段，將墓地的此卡除外可以發動。以表側表示進行1隻「小丑戲幫」怪獸的上級召喚。
  | sc_name            = 小丑戏帮《怪演》
  | sc_text            = ①：可从以下效果中选择1个发动（此卡名的以下效果1回合仅可各选择1次）。此卡发动后，直至下个回合结束时为止，自己不可发动被从牌组・额外牌组特殊召唤的怪兽的效果。<br />●从牌组・额外牌组将最多2只“小丑戏帮”怪兽无视召唤条件特殊召唤。<br />●从牌组将1只“小丑戏帮”怪兽加入手牌。<br />②：在自己・对手的主要阶段，将墓地的此卡除外可以发动。以表侧表示进行1只“小丑戏帮”怪兽的上级召唤。
  }}
