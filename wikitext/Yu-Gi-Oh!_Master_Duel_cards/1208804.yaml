title: Stare of the Snake Hair (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | attribute          = DARK
  | types              = Zombie / Effect
  | level              = 6
  | atk                = 1500
  | def                = 1200
  | text               = You can discard this card; add 1 "Call of the Haunted" or 1 Spell/Trap that mentions it from your Deck to your hand. If this card is Special Summoned: You can target 1 Attack Position monster your opponent controls; that face-up monster cannot attack, its effects are negated, also it cannot be used as material for a Fusion, Synchro, Xyz, or Link Summon. You can only use each effect of "Stare of the Snake Hair" once per turn.

  | fr_name            = Regard de la Tête Cheveux Serpent
  | fr_text            = Vous pouvez défausser cette carte ; ajoutez 1 "Appel de l'Être Hanté" ou 1 Magie/Piège qui le mentionne depuis votre Deck à votre main. Si cette carte est Invoquée Spécialement : vous pouvez cibler 1 monstre en Position d'Attaque contrôlé par votre adversaire ; le monstre face recto ne peut pas attaquer, ses effets sont annulés, et aussi, il ne peut pas être utilisé comme Matériel pour une Invocation Fusion, Synchro, Xyz ou Lien. Vous ne pouvez utiliser chaque effet de "Regard de la Tête Cheveux Serpent" qu'une fois par tour.
  | de_name            = Blick der Schlangenhaare
  | de_text            = Du kannst diese Karte abwerfen; füge deiner Hand 1 „Ruf der Gejagten“ oder 1 Zauber/Falle, der oder die ihn erwähnt, von deinem Deck hinzu. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst 1 Monster in Angriffsposition wählen, das dein Gegner kontrolliert; jenes offene Monster kann nicht angreifen, seine Effekte werden annulliert, zusätzlich kann es nicht als Material für eine Fusions-, Synchro-, Xyz- oder Linkbeschwörung verwendet werden. Du kannst jeden Effekt von „Blick der Schlangenhaare“ nur einmal pro Spielzug verwenden.
  | it_name            = Sguardo della Capelli di Serpente
  | it_text            = Puoi scartare questa carta; aggiungi 1 "Richiamo del Posseduto" o 1 Magia/Trappola che lo menziona dal tuo Deck alla tua mano. Se questa carta viene Evocata Specialmente: puoi scegliere come bersaglio 1 mostro in Posizione di Attacco controllato dal tuo avversario; quel mostro scoperto non può attaccare, i suoi effetti sono annullati, inoltre esso non può essere utilizzato come materiale per un'Evocazione tramite Fusione, Synchro, Xyz o Link. Puoi utilizzare ogni effetto di "Sguardo della Capelli di Serpente" una sola volta per turno.
  | pt_name            = Olhar dos Cabelos de Cobras
  | pt_text            = Você pode descartar este card; adicione 1 "Chamado dos Assombrados" ou 1 Magia/Armadilha que o mencione do seu Deck à sua mão. Se este card for Invocado por Invocação-Especial: você pode escolher 1 monstro em Posição de Ataque que seu oponente controla; esse monstro com a face para cima não pode atacar, seus efeitos são negados e, além disso, ele não pode ser usado como matéria para uma Invocação-Fusão, Sincro, Xyz ou Link. Você só pode usar cada efeito de "Olhar dos Cabelos de Cobras" uma vez por turno.
  | es_name            = Mirada del Pelo de Serpiente
  | es_text            = Puedes descartar esta carta; añade a tu mano 1 "Llamada de los Condenados" o 1 Mágica/Trampa que la mencione en tu Deck. Si esta carta es Invocada de Modo Especial: puedes seleccionar 1 monstruo en Posición de Ataque que controle tu adversario; ese monstruo boca arriba no puede atacar, sus efectos son negados y además no puede ser usado como material para una Invocación por Fusión, Sincronía, Xyz o Enlace. Sólo puedes usar cada efecto de "Mirada del Pelo de Serpiente" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードを手札から捨てて発動できる。「リビングデッドの呼び声」またはそのカード名が記された魔法・罠カード１枚をデッキから手札に加える。<br />②：このカードが特殊召喚した場合、相手フィールドの攻撃表示モンスター１体を対象として発動できる。その表側表示モンスターは攻撃できず、効果は無効化され、融合・Ｓ・Ｘ・Ｌ召喚の素材にできない。
  | ko_name            = 얼어붙은 눈빛의 메두사
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 패에서 버리고 발동할 수 있다. "리빙 데드가 부르는 소리" 또는 그 카드명이 쓰여진 마법 / 함정 카드 1장을 덱에서 패에 넣는다.<br />②: 이 카드를 특수 소환했을 경우, 상대 필드의 공격 표시 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 앞면 표시 몬스터는 공격할 수 없으며, 효과는 무효화되고, 융합 / 싱크로 / 엑시즈 / 링크 소환의 소재로 할 수 없다.
  | tc_name            = 石化凝視之美杜莎
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：從手牌將此卡捨棄可以發動。從牌組將1張「活死人的呼喚」或記載有該卡名的魔法・陷阱卡加入手牌。<br />②：此卡特殊召喚的情況下，以對手場上1隻攻擊表示的怪獸為對象可以發動。該表側表示怪獸不可攻擊，效果無效化，不可作為融合・同步・超量・連結召喚的素材。
  | sc_name            = 石化凝视之美杜莎
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：从手牌将此卡舍弃可以发动。从牌组将1张“活死人的呼唤”或记载有该卡名的魔法・陷阱卡加入手牌。<br />②：此卡特殊召唤的情况下，以对手场上1只攻击表示的怪兽为对象可以发动。该表侧表示怪兽不可攻击，效果无效化，不可作为融合・同步・超量・连接召唤的素材。
  }}
