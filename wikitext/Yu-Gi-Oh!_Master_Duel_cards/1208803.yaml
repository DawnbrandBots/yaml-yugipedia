title: Army of the Haunted (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | attribute          = DARK
  | types              = Zombie / Effect
  | level              = 6
  | atk                = 2400
  | def                = 0
  | text               = If you control "Call of the Haunted" and this card is in your hand or GY: You can Special Summon this card. If this card is sent to the GY: You can target 1 "Call of the Haunted" in your GY; Set it. You can only use each effect of "Army of the Haunted" once per turn.

  | fr_name            = Armée de l'Être Hanté
  | fr_text            = Si vous contrôlez "Appel de l'Être Hanté" et que cette carte est dans votre main ou Cimetière : vous pouvez Invoquer Spécialement cette carte. Si cette carte est envoyée au Cimetière : vous pouvez cibler 1 "Appel de l'Être Hanté" dans votre Cimetière ; Posez-le. Vous ne pouvez utiliser chaque effet de "Armée de l'Être Hanté" qu'une fois par tour.
  | de_name            = Armee der Gejagten
  | de_text            = Falls du „Ruf der Gejagten“ kontrollierst und sich diese Karte in deiner Hand oder deinem Friedhof befindet: Du kannst diese Karte als Spezialbeschwörung beschwören. Falls diese Karte auf den Friedhof gelegt wird: Du kannst 1 „Ruf der Gejagten“ in deinem Friedhof wählen; setze ihn. Du kannst jeden Effekt von „Armee der Gejagten“ nur einmal pro Spielzug verwenden.
  | it_name            = Armata del Posseduto
  | it_text            = Se controlli "Richiamo del Posseduto" e questa carta è nella tua mano o Cimitero: puoi Evocare Specialmente questa carta. Se questa carta viene mandata al Cimitero: puoi scegliere come bersaglio 1 "Richiamo del Posseduto" nel tuo Cimitero; Posizionalo. Puoi utilizzare ogni effetto di "Armata del Posseduto" una sola volta per turno.
  | pt_name            = Exército dos Assombrados
  | pt_text            = Se você controlar "Chamado dos Assombrados" e este card estiver na sua mão ou no Cemitério: você pode Invocar este card por Invocação-Especial. Se este card for enviado para o Cemitério: você pode escolher 1 "Chamado dos Assombrados" no seu Cemitério; Baixe-o. Você só pode usar cada efeito de "Exército dos Assombrados" uma vez por turno.
  | es_name            = Ejército de los Condenados
  | es_text            = Si controlas "Llamada de los Condenados" y esta carta está en tu mano o Cementerio: puedes Invocar esta carta de Modo Especial. Si esta carta es mandada al Cementerio: puedes seleccionar 1 "Llamada de los Condenados" en tu Cementerio; Colócala. Sólo puedes usar cada efecto de "Ejército de los Condenados" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが手札・墓地に存在し、自分フィールドに「リビングデッドの呼び声」が存在する場合に発動できる。このカードを特殊召喚する。<br />②：このカードが墓地へ送られた場合、自分の墓地の「リビングデッドの呼び声」１枚を対象として発動できる。そのカードを自分フィールドにセットする。
  | ko_name            = 리빙 데드 군단
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드가 패 / 묘지에 존재하고, 자신 필드에 "리빙 데드가 부르는 소리"가 존재할 경우에 발동할 수 있다. 이 카드를 특수 소환한다.<br />②: 이 카드가 묘지로 보내졌을 경우, 자신 묘지의 "리빙 데드가 부르는 소리" 1장을 대상으로 하고 발동할 수 있다. 그 카드를 자신 필드에 세트한다.
  | tc_name            = 活死人軍團
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：此卡存在於手牌・墓地，且自己場上存在「活死人的呼喚」的情況下可以發動。將此卡特殊召喚。<br />②：此卡被送至墓地的情況下，以自己墓地的1張「活死人的呼喚」為對象可以發動。將該卡放置在自己場上。
  | sc_name            = 活死人军团
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：此卡存在于手牌・墓地，且自己场上存在“活死人的呼唤”的情况下可以发动。将此卡特殊召唤。<br />②：此卡被送至墓地的情况下，以自己墓地的1张“活死人的呼唤”为对象可以发动。将该卡放置在自己场上。
  }}
