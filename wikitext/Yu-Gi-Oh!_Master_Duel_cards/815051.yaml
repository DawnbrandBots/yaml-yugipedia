  | ja_text   = ①：相手が３体以上のモンスターを召喚・反転召喚・特殊召喚した自分・相手ターンに発動できる（同一チェーン上では１度まで）。このカードを手札から特殊召喚する。この効果で特殊召喚したこのカードは、他のカードの効果を受けず、お互いのスタンバイフェイズ毎に守備力が５００ダウンする。
  | ko_name   = 기동요서 트리케라이너
