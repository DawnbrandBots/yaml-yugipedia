  | text               = If this card is Special Summoned and you control "Call of the Haunted" or a Zombie monster, except "Great Mammoth of the Netherworld": You can target 1 card on the field; destroy it. You can only use this effect of "Great Mammoth of the Netherworld" once per turn. A Zombie Xyz Monster that has this card as material gains this effect.<br />●Gains 1000 ATK.

  | fr_name            = Grand Mammouth de l'Au-Delà
  | fr_text            = Si cette carte est Invoquée Spécialement et que vous contrôlez "Appel de l'Être Hanté" ou un monstre Zombie ("Grand Mammouth de l'Au-Delà" exclu) : vous pouvez cibler 1 carte sur le Terrain ; détruisez-la. Vous ne pouvez utiliser cet effet de "Grand Mammouth de l'Au-Delà" qu'une fois par tour. Un Monstre Xyz Zombie qui a cette carte comme Matériel gagne cet effet.<br />●Gagne 1000 ATK.
  | de_name            = Großes Mammut von der Niederwelt
  | de_text            = Falls diese Karte als Spezialbeschwörung beschworen wird und du „Ruf der Gejagten“ oder ein Zombie-Monster kontrollierst, außer „Großes Mammut von der Niederwelt“: Du kannst 1 Karte auf dem Spielfeld wählen; zerstöre sie. Du kannst diesen Effekt von „Großes Mammut von der Niederwelt“ nur einmal pro Spielzug verwenden. Ein Zombie-Xyz-Monster, das diese Karte als Material hat, erhält diesen Effekt.<br />●Erhält 1000 ATK.
  | it_name            = Grande Mammuth dell'Oltretomba
  | it_text            = Se questa carta viene Evocata Specialmente e tu controlli "Richiamo del Posseduto" o un mostro Zombie, eccetto "Grande Mammuth dell'Oltretomba": puoi scegliere come bersaglio 1 carta sul Terreno; distruggila. Puoi utilizzare questo effetto di "Grande Mammuth dell'Oltretomba" una sola volta per turno. Un Mostro Xyz Zombie che ha questa carta come materiale guadagna questo effetto.<br />●Guadagna 1000 ATK.
  | pt_name            = Grande Mamute do Mundo Inferior
  | pt_text            = Se este card for Invocado por Invocação-Especial e você controlar "Chamado dos Assombrados" ou um monstro Zumbi, exceto "Grande Mamute do Mundo Inferior": você pode escolher 1 card no campo; destrua-o. Você só pode usar este efeito de "Grande Mamute do Mundo Inferior" uma vez por turno. Um Monstro Xyz Zumbi que tenha este card como matéria ganha este efeito.<br />●Ganha 1000 de ATK.
  | es_name            = Gran Mamut del Inframundo
  | es_text            = Si esta carta es Invocada de Modo Especial y controlas "Llamada de los Condenados" o un monstruo Zombi, excepto "Gran Mamut del Inframundo": puedes seleccionar 1 carta en el Campo; destrúyela. Sólo puedes usar este efecto de "Gran Mamut del Inframundo" una vez por turno. Un Monstruo Xyz Zombi que tenga esta carta como material gana este efecto.<br />●Gana 1000 ATK.
  | ja_text            = このカード名の①の効果は１ターンに１度しか使用できない。<br />①：このカードが特殊召喚した場合、自分フィールドに「冥界の魔象」以外のアンデット族モンスターか「リビングデッドの呼び声」が存在していれば、フィールドのカード１枚を対象として発動できる。そのカードを破壊する。<br />②：このカードをＸ素材としているアンデット族Ｘモンスターは以下の効果を得る。<br />●このカードの攻撃力は１０００アップする。
  | ko_name            = 명계의 마상
  | ko_text            = 이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 특수 소환했을 경우, 자신 필드에 "명계의 마상" 이외의 언데드족 몬스터나 "리빙 데드가 부르는 소리"가 존재하고 있으면, 필드의 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 파괴한다.<br />②: 이 카드를 엑시즈 소재로 하고 있는 언데드족 엑시즈 몬스터는 이하의 효과를 얻는다.<br />●이 카드의 공격력은 1000 올린다.
  | tc_name            = 冥界魔象
  | tc_text            = 此卡名的①效果1回合僅可使用1次。<br />①：此卡特殊召喚的情況下，如果自己場上存在「冥界魔象」以外的不死族怪獸或「活死人的呼喚」，則以場上的1張卡為對象可以發動。將該卡破壞。<br />②：持有此卡作為超量素材的不死族超量怪獸獲得以下效果。<br />●此卡的攻擊力上升1000。
  | sc_name            = 冥界魔象
  | sc_text            = 此卡名的①效果1回合仅可使用1次。<br />①：此卡特殊召唤的情况下，如果自己场上存在“冥界魔象”以外的不死族怪兽或“活死人的呼唤”，则以场上的1张卡为对象可以发动。将该卡破坏。<br />②：持有此卡作为超量素材的不死族超量怪兽获得以下效果。<br />●此卡的攻击力上升1000。
