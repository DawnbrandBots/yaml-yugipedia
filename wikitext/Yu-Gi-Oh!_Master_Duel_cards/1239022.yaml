  | text               = If you control no monsters, or all monsters you control are Plant monsters: You can Special Summon this card from your hand or GY, but banish it when it leaves the field, also you cannot Special Summon for the rest of this turn, except Plant monsters. You can Tribute 1 Plant monster from your hand or field; Special Summon 1 "Rikka" monster from your Deck, except "Rikka Black Princess". You can only use each effect of "Rikka Black Princess" once per turn.

  | fr_name            = Princesse Noire Rikka
  | fr_text            = Si vous ne contrôlez aucun monstre, ou si tous les monstres que vous contrôlez sont des monstres Plante : vous pouvez Invoquer Spécialement cette carte depuis votre main ou Cimetière, mais bannissez-la lorsqu'elle quitte le Terrain, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres Plante exclus) le reste de ce tour. Vous pouvez Sacrifier 1 monstre Plante depuis votre main ou Terrain ; Invoquez Spécialement 1 monstre "Rikka" ("Princesse Noire Rikka" exclu) depuis votre Deck. Vous ne pouvez utiliser chaque effet de "Princesse Noire Rikka" qu'une fois par tour.
  | de_name            = Schwarze Rikka-Prinzessin
  | de_text            = Falls du keine Monster kontrollierst oder alle Monster, die du kontrollierst, Pflanze-Monster sind: Du kannst diese Karte als Spezialbeschwörung von deiner Hand oder deinem Friedhof beschwören, aber verbanne sie, wenn sie das Spielfeld verlässt, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von Pflanze-Monstern. Du kannst 1 Pflanze-Monster von deiner Hand oder Spielfeldseite als Tribut anbieten; beschwöre 1 „Rikka“-Monster als Spezialbeschwörung von deinem Deck, außer „Schwarze Rikka-Prinzessin“. Du kannst jeden Effekt von „Schwarze Rikka-Prinzessin“ nur einmal pro Spielzug verwenden.
  | it_name            = Principessa Nera Rikka
  | it_text            = Se non controlli nessun mostro, o se tutti i mostri che controlli sono mostri Pianta: puoi Evocare Specialmente questa carta dalla tua mano o Cimitero, ma bandiscila quando lascia il Terreno, inoltre non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri Pianta. Puoi offrire come Tributo 1 mostro Pianta dalla tua mano o Terreno; Evoca Specialmente 1 mostro "Rikka" dal tuo Deck, eccetto "Principessa Nera Rikka". Puoi utilizzare ogni effetto di "Principessa Nera Rikka" una sola volta per turno.
  | pt_name            = Princesa Negra Rikka
  | pt_text            = Se você não controlar nenhum monstro, ou todos os monstros que você controla forem monstros Planta: você pode Invocar este card por Invocação-Especial da sua mão ou do Cemitério, mas bana-o quando ele deixar o campo e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros Planta. Você pode oferecer como Tributo 1 monstro Planta da sua mão ou do campo; Invoque por Invocação-Especial 1 monstro "Rikka" do seu Deck, exceto "Princesa Negra Rikka". Você só pode usar cada efeito de "Princesa Negra Rikka" uma vez por turno.
  | es_name            = Princesa Oscura Rikka
  | es_text            = Si no controlas monstruos, o todos los monstruos que controlas son monstruos Planta: puedes Invocar esta carta de Modo Especial desde tu mano o Cementerio, pero destiérrala cuando deje el Campo, y además no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos Planta. Puedes Sacrificar 1 monstruo Planta en tu mano o Campo; Invoca de Modo Especial 1 monstruo "Rikka" desde tu Deck, excepto "Princesa Oscura Rikka". Sólo puedes usar cada efecto de "Princesa Oscura Rikka" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：自分フィールドのモンスターが、存在しない場合または植物族モンスターのみの場合に発動できる。このカードを手札・墓地から特殊召喚する。この効果で特殊召喚したこのカードは、フィールドから離れた場合に除外される。この効果の発動後、ターン終了時まで自分は植物族モンスターしか特殊召喚できない。<br />②：自分の手札・フィールドの植物族モンスター１体をリリースして発動できる。デッキから「六花のくろひめ」以外の「六花」モンスター１体を特殊召喚する。
  | ko_name            = 육화의 검은 공주
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 자신 필드의 몬스터가, 존재하지 않을 경우 또는 식물족 몬스터뿐일 경우에 발동할 수 있다. 이 카드를 패 / 묘지에서 특수 소환한다. 이 효과로 특수 소환한 이 카드는, 필드에서 벗어났을 경우에 제외된다. 이 효과의 발동 후, 턴 종료시까지 자신은 식물족 몬스터밖에 특수 소환할 수 없다.<br />②: 자신의 패 / 필드의 식물족 몬스터 1장을 릴리스하고 발동할 수 있다. 덱에서 "육화의 검은 공주" 이외의 "육화" 몬스터 1장을 특수 소환한다.
  | tc_name            = 六花的黑姬
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：自己場上的怪獸，不存在的情況下或均為植物族怪獸的情況下可以發動。從手牌・墓地將此卡特殊召喚。以此效果特殊召喚的此卡從場上離開的情況下將被除外。此效果發動後，直至回合結束時為止自己僅可特殊召喚植物族怪獸。<br />②：解放自己手牌・場上的1隻植物族怪獸可以發動。從牌組將「六花的黑姬」以外的1隻「六花」怪獸特殊召喚。
  | sc_name            = 六花的黑姬
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：自己场上的怪兽，不存在的情况下或均为植物族怪兽的情况下可以发动。从手牌・墓地将此卡特殊召唤。以此效果特殊召唤的此卡从场上离开的情况下将被除外。此效果发动后，直至回合结束时为止自己仅可特殊召唤植物族怪兽。<br />②：解放自己手牌・场上的1只植物族怪兽可以发动。从牌组将“六花的黑姬”以外的1只“六花”怪兽特殊召唤。
