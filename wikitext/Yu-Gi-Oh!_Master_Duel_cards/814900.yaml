  | text      = If only your opponent controls a monster, you can Special Summon this card (from your hand). Cannot attack the turn it is Summoned. While you control "Toon World" and your opponent controls no Toon monsters, this card can attack directly.

  | fr_name   = Cyber Dragon Toon
  | fr_text   = Si uniquement votre adversaire contrôle un monstre, vous pouvez Invoquer Spécialement cette carte (depuis votre main). Ne peut pas attaquer le tour où elle est Invoquée. Tant que vous contrôlez "Monde des Toons" et que votre adversaire ne contrôle aucun monstre Toon, cette carte peut attaquer directement.
  | de_name   = Toon-Cyber Drache
  | de_text   = Falls nur dein Gegner ein Monster kontrolliert, kannst du diese Karte als Spezialbeschwörung (von deiner Hand) beschwören. Diese Karte kann nicht in dem Spielzug angreifen, in dem sie beschworen wurde. Solange du „Toon-Welt“ kontrollierst und dein Gegner keine Toon-Monster kontrolliert, kann diese Karte direkt angreifen.
  | it_name   = Cyber Drago Toon
  | it_text   = Se solo il tuo avversario controlla un mostro, puoi Evocare Specialmente questa carta (dalla tua mano). Non può attaccare nel turno in cui viene Evocato. Mentre tu controlli "Mondo Toon" e il tuo avversario non controlla nessun mostro Toon, questa carta può attaccare direttamente.
  | pt_name   = Dragão Cibernético Toon
  | pt_text   = Se somente seu oponente controlar um monstro, você pode Invocar este card por Invocação-Especial (da sua mão). Não pode atacar no turno em que for Invocado. Enquanto você controlar "Mundo Toon" e seu oponente não controlar nenhum monstro Toon, este card pode atacar diretamente.
  | es_name   = Ciber Dragón Toon
  | es_text   = Si sólo tu adversario controla un monstruo, puedes Invocar esta carta de Modo Especial (desde tu mano). No puede atacar en el turno en el que es Invocado. Mientras controles "Mundo Toon" y tu adversario no controle monstruos Toon, esta carta puede atacar directamente.
  | ja_text   = ①：相手フィールドにのみモンスターが存在する場合、このカードは手札から特殊召喚できる。<br />②：このカードは召喚・反転召喚・特殊召喚したターンには攻撃できない。<br />③：自分フィールドに「トゥーン・ワールド」が存在し、相手フィールドにトゥーンモンスターが存在しない場合、このカードは直接攻撃できる。
  | ko_name   = 툰 사이버 드래곤
  | ko_text   = ①: 상대 필드에만 몬스터가 존재할 경우, 이 카드는 패에서 특수 소환할 수 있다.<br />②: 이 카드는 일반 소환 / 반전 소환 / 특수 소환한 턴에는 공격할 수 없다.<br />③: 자신 필드에 "툰 월드"가 존재하고, 상대 필드에 툰 몬스터가 존재하지 않을 경우, 이 카드는 직접 공격할 수 있다.
  | tc_name   = 卡通電子龍
  | tc_text   = ①：在對方場上存在怪獸，我方場上不存在怪獸的狀況下，可從手牌特殊召喚此卡。<br />②：此卡在召喚・反轉召喚・特殊召喚的回合無法攻擊。<br />③：在我方場上存在「卡通世界」，對方場上不存在卡通怪獸的狀況下，此卡可直接攻擊。
  | sc_name   = 卡通电子龙
  | sc_text   = ①：对手场上存在有怪兽，且我方场上不存在有怪兽的场合，此卡可从手牌特殊召唤。<br />②：此卡在召唤、反转召唤、特殊召唤回合不可攻击。<br />③：我方场上存在有“卡通世界”，且对手场上不存在有卡通怪兽的场合，此卡可直接攻击。
