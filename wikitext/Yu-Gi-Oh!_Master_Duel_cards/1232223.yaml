title: Charmer Quartet in Bloom (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = UR
  | attribute          = LIGHT
  | types              = Spellcaster / Link / Effect
  | link_arrows        = Middle-Left, Bottom-Left, Bottom-Right, Middle-Right
  | atk                = 1850
  | text               = 2+ monsters<br />Gains 300 ATK for each different Attribute on the field. Once, while this card is face-up on the field, during the Main Phase (Quick Effect): You can target 2 monsters in your GY with the same Attribute but different Types, or with the same Type but different Attributes; Special Summon both, also until the end of the next turn, this card and the Special Summoned monsters cannot be used as material for a Fusion, Synchro, Xyz, or Link Summon. You can only use this effect of "Charmer Quartet in Bloom" once per turn.

  | fr_name            = Quatuor de la Charmeuse en Fleur
  | fr_text            = 2+ monstres<br />Gagne 300 ATK pour chaque Attribut différent sur le Terrain. Une fois, tant que cette carte est face recto sur le Terrain, durant la Main Phase (Effet Rapide) : vous pouvez cibler 2 monstres dans votre Cimetière du même Attribut mais de Types différents, ou du même Type mais d'Attributs différents ; Invoquez-les Spécialement tous les deux, et aussi, cette carte et les monstres Invoqués Spécialement ne peuvent pas être utilisés comme Matériel pour une Invocation Fusion, Synchro, Xyz ou Lien jusqu'à la fin du prochain tour. Vous ne pouvez utiliser cet effet de "Quatuor de la Charmeuse en Fleur" qu'une fois par tour.
  | de_name            = Verzaubererinnen-Quartett in Blüte
  | de_text            = 2+ Monster<br />Erhält für jede unterschiedliche Eigenschaft auf dem Spielfeld 300 ATK. Einmal, solange diese Karte offen auf dem Spielfeld liegt, während der Main Phase (Schnelleffekt): Du kannst 2 Monster mit derselben Eigenschaft, aber unterschiedlichen Typen oder demselben Typ, aber unterschiedlichen Eigenschaften in deinem Friedhof wählen; beschwöre beide als Spezialbeschwörung, zusätzlich können diese Karte und die als Spezialbeschwörung beschworenen Monster bis zum Ende des nächsten Spielzugs nicht als Material für eine Fusions-, Synchro-, Xyz- oder Linkbeschwörung verwendet werden. Du kannst diesen Effekt von „Verzaubererinnen-Quartett in Blüte“ nur einmal pro Spielzug verwenden.
  | it_name            = Quartetto di Ammaliatrici in Fioritura
  | it_text            = 2+ mostri<br />Guadagna 300 ATK per ogni Attributo diverso sul Terreno. Una volta mentre questa carta è scoperta sul Terreno, durante la Main Phase (Effetto Rapido): puoi scegliere come bersaglio 2 mostri nel tuo Cimitero con lo stesso Attributo ma Tipi diversi, o con lo stesso Tipo ma Attributi diversi; Evoca Specialmente entrambi, inoltre fino alla fine del prossimo turno, questa carta e i mostri Evocati Specialmente non possono essere utilizzati come materiale per un'Evocazione tramite Fusione, Synchro, Xyz o Link. Puoi utilizzare questo effetto di "Quartetto di Ammaliatrici in Fioritura" una sola volta per turno.
  | pt_name            = Quarteto Encantador Florescendo
  | pt_text            = 2+ monstros<br />Ganha 300 de ATK para cada Atributo diferente no campo. Uma vez, enquanto este card estiver com a face para cima no campo, durante a Fase Principal (Efeito Rápido): você pode escolher 2 monstros no seu Cemitério com o mesmo Atributo, mas Tipos diferentes, ou com o mesmo Tipo, mas Atributos diferentes; Invoque os dois por Invocação-Especial e, além disso, até o final do próximo turno, este card e os monstros Invocados por Invocação-Especial não podem ser usados como matéria para uma Invocação-Fusão, Sincro, Xyz ou Link. Você só pode usar este efeito de "Quarteto Encantador Florescendo" uma vez por turno.
  | es_name            = Cuarteto de la Encantadora en Flor
  | es_text            = 2+ monstruos<br />Gana 300 ATK por cada Atributo diferente en el Campo. Una vez, mientras esta carta está boca arriba en el Campo, durante la Main Phase (Efecto Rápido): puedes seleccionar 2 monstruos en tu Cementerio con el mismo Atributo pero Tipos diferentes, o con el mismo Tipo pero Atributos diferentes; Invoca ambos de Modo Especial y además, hasta el final del próximo turno, esta carta y los monstruos Invocados de Modo Especial no pueden ser usados como material para una Invocación por Fusión, Sincronía, Xyz o Enlace. Sólo puedes usar este efecto de "Cuarteto de la Encantadora en Flor" una vez por turno.
  | ja_text            = モンスター２体以上<br />このカード名の②の効果は１ターンに１度しか使用できない。<br />①：このカードの攻撃力は、フィールドのモンスターの属性の種類×３００アップする。<br />②：このカードが表側表示で存在する限り１度だけ、自分・相手のメインフェイズに、自分の墓地の、同じ属性で種族が異なるモンスター２体または同じ種族で属性が異なるモンスター２体を対象として発動できる。そのモンスター２体を特殊召喚する。このカード及びこの効果で特殊召喚したモンスターは次のターンの終了時まで融合・Ｓ・Ｘ・Ｌ召喚の素材にできない。
  | ko_name            = 사화요란의 령사
  | ko_text            = 몬스터 2장 이상<br />이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드의 공격력은, 필드의 몬스터의 속성의 종류 × 300 올린다.<br />②: 이 카드가 앞면 표시로 존재하는 한 1번만, 자신 / 상대의 메인 페이즈에, 자신 묘지의, 같은 속성으로 종족이 다른 몬스터 2장 또는 같은 종족으로 속성이 다른 몬스터 2장을 대상으로 하고 발동할 수 있다. 그 몬스터 2장을 특수 소환한다. 이 카드 및 이 효과로 특수 소환한 몬스터는 다음 턴의 종료시까지 융합 / 싱크로 / 엑시즈 / 링크 소환의 소재로 할 수 없다.
  | tc_name            = 四花繚亂之靈使
  | tc_text            = 怪獸2隻以上<br />此卡名的②效果1回合僅可使用1次。<br />①：此卡的攻擊力上升場上的怪獸的屬性種類×300的數值。<br />②：只要此卡以表側表示存在，僅限1次，在自己・對手的主要階段，以自己墓地的，屬性相同而種族不同的2隻怪獸、或是種族相同而屬性不同的2隻怪獸為對象可以發動。將該2隻怪獸特殊召喚。此卡及以此效果特殊召喚的怪獸直至下個回合結束時為止，不可作為融合・同步・超量・連結召喚的素材。
  | sc_name            = 四花缭乱之灵使
  | sc_text            = 怪兽2只以上<br />此卡名的②效果1回合仅可使用1次。<br />①：此卡的攻击力上升场上的怪兽的属性种类×300的数值。<br />②：只要此卡以表侧表示存在，仅限1次，在自己・对手的主要阶段，以自己墓地的，属性相同而种族不同的2只怪兽、或是种族相同而属性不同的2只怪兽为对象可以发动。将该2只怪兽特殊召唤。此卡及以此效果特殊召唤的怪兽直至下个回合结束时为止，不可作为融合・同步・超量・连接召唤的素材。
  }}
