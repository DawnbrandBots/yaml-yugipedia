  | text               = A mysterious dog whose true nature remains unknown. By releasing its life energy, it emits a brief flash of light. Those unfortunate enough to witness it find its adorable appearance forever etched into their minds.
  | releases           = 
  Legacy Pack; November 5, 2026

  | fr_name            = Brise le Lampreyer de la Foudre de Lukunas
  | fr_text            = Un chien mystérieux dont la véritable nature reste inconnue. Il libère son énergie vitale en émettant un bref éclair, et ceux qui ont la malchance d'en être témoins ont son adorable portrait à jamais gravé dans leur mémoire.
  | de_name            = Brise der Blitz-Lampreter von Lukunas
  | de_text            = Ein geheimnisvoller Hund, dessen wahre Natur unbekannt ist. Er kann seine Lebensenergie freisetzen und so einen kurzen Lichtblitz ausstrahlen. Wer das Pech hat, Zeuge davon zu werden, dem bleibt sein bezauberndes Aussehen für immer im Gedächtnis haften.
  | it_name            = Brise il Lampredatore del Fulmine di Lukunas
  | it_text            = Un cane misterioso la cui vera natura rimane ignota. Rilasciando la sua energia vitale, emette un breve lampo di luce. Chi è abbastanza sfortunato da vederlo, si ritrova con il suo aspetto adorabile perennemente inciso nella sua mente.
  | pt_name            = Brise, a Lampreia Relâmpago de Lukunas
  | pt_text            = Um cão misterioso cuja verdadeira natureza permanece desconhecida. Ao liberar sua energia vital, ele emite um breve clarão de luz. Aqueles que têm o azar de presenciar isso guardam sua aparência adorável gravada para sempre em suas mentes.
  | es_name            = Brisé el Lampreador de Relámpagos de Lukunas
  | es_text            = Un perro misterioso cuya verdadera naturaleza permanece desconocida. Dejando salir su energía vital, emite un breve destello de luz. Aquellos desafortunados que lo presencian se encuentran con su adorable aparición grabada para siempre en su mente.
  | ja_text            = 生命エネルギーを放出することで一瞬だけ発光する未解明の犬。目撃してしまったが最後、その愛くるしい姿が脳裏に焼き付いて離れないという。
  | ko_name            = 루크나스의 흡뢰 브리제
  | ko_text            = 생명 에너지를 방출하여 순간적으로 빛을 발하는 정체불명의 개. 한 번이라도 목격하면, 그 사랑스러운 모습이 뇌리에 깊이 새겨져 좀처럼 잊을 수 없다고 한다.
  | tc_name            = 魯庫納斯之吸雷 布利澤
  | tc_text            = 一隻尚未被解析的狗，會藉由釋放生命能量而瞬間發光。據說一旦目擊，其惹人憐愛的模樣便會在腦海中揮之不去。
  | sc_name            = 鲁库纳斯之吸雷 布利泽
  | sc_text            = 通过放出生命能量而瞬间发光的尚未被解析的犬。据说一旦目击，其可爱的样子最终便会在脑海中挥之不去。
  }}
