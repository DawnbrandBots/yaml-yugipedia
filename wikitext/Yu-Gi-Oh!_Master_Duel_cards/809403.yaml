  | text      = Target 1 Spell in your opponent's GY; add it to your hand. If you activate that Spell Card, immediately after it resolves, take 2000 damage. If you do not activate it, send it from your hand or field to the GY during the End Phase.
  | releases  = Legacy Pack

  | fr_name   = Profanateur de Tombes
  | fr_text   = Ciblez 1 Magie dans le Cimetière de votre adversaire ; ajoutez-la à votre main. Si vous activez la Carte Magie, immédiatement après sa résolution, recevez 2000 points de dommages. Si vous ne l'activez pas, envoyez-la depuis votre main ou Terrain au Cimetière durant la End Phase.
  | de_name   = Grabräuber
  | de_text   = Wähle 1 Zauber im Friedhof deines Gegners; füge ihn deiner Hand hinzu. Falls du jene Zauberkarte aktivierst, erhältst du 2000 Schaden, sofort nachdem sie aufgelöst wurde. Falls du sie nicht aktivierst, lege sie während der End Phase von deiner Hand oder Spielfeldseite auf den Friedhof.
  | it_name   = Predatore delle Tombe
  | it_text   = Scegli come bersaglio 1 Magia nel Cimitero del tuo avversario; aggiungila alla tua mano. Se attivi quella Carta Magia, immediatamente dopo che si è risolta, subisci 2000 danni. Se non la attivi, mandala dalla tua mano o Terreno al Cimitero durante la End Phase.
  | pt_name   = Ladrão de Túmulos
  | pt_text   = Escolha 1 Magia no Cemitério do seu oponente; adicione-a à sua mão. Se você ativar esse Card de Magia, imediatamente depois que ele resolver, sofra 2000 de dano. Se você não o ativar, envie-o da sua mão ou do campo para o Cemitério durante a Fase Final.
  | es_name   = Ladrón de Tumbas
  | es_text   = Selecciona 1 Mágica en el Cementerio de tu adversario; añádela a tu mano. Si activas esa Carta Mágica, inmediatamente después de que se resuelva, tú recibes 2000 puntos de daño. Si no la activas, mándala de tu mano o Campo al Cementerio durante la End Phase.
  | ja_text   = ①：相手の墓地の魔法カード１枚を対象として発動できる。その魔法カードを自分の手札に加える。その魔法カードを発動した場合、自分は２０００ダメージを受ける。エンドフェイズにその魔法カードは墓地へ送られる。
  | ko_name   = 도굴꾼
  | ko_text   = 상대의 묘지에 있는 마법 카드 1장을 선택하여, 턴 종료시까지 자신의 패로서 사용할 수 있다. 그 마법 카드를 사용했을 경우, 2000 포인트의 데미지를 받는다.
  | tc_name   = 盜墓
  | tc_text   = 可選擇對方墓地的１張魔法卡，在回合結束前做為我方手牌使用。使用該魔法卡的狀況下，受到２０００傷害。
  | sc_name   = 盗墓
  | sc_text   = 可选择对手墓地中的１张魔法卡，将其作为我方的手牌使用，直到回合结束时。使用了该魔法卡的场合，将受到２０００点伤害。
