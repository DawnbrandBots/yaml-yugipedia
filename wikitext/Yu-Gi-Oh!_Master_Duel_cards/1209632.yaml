title: Returned Dino Daneen (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = WATER
  | types              = Dinosaur / Effect
  | level              = 1
  | atk                = 400
  | def                = 1200
  | text               = If this card is Special Summoned by a monster effect: You can add 1 "GMX" monster from your Deck to your hand. During your Main Phase: You can Fusion Summon 1 Dinosaur Fusion Monster from your Extra Deck, using monsters from your hand or field. If this card is sent to the GY: You can make all Dinosaur monsters you currently control gain 400 ATK. You can only use each effect of "Returned Dino Daneen" once per turn.

  | fr_name            = Daneen le Dino Revenu
  | fr_text            = Si cette carte est Invoquée Spécialement par un effet de monstre : vous pouvez ajouter 1 monstre "GMX" depuis votre Deck à votre main. Durant votre Main Phase : vous pouvez Invoquer par Fusion 1 Monstre Fusion Dinosaure depuis votre Extra Deck, en utilisant des monstres depuis votre main ou Terrain. Si cette carte est envoyée au Cimetière : vous pouvez faire gagner 400 ATK à tous les monstres Dinosaure que vous contrôlez actuellement. Vous ne pouvez utiliser chaque effet de "Daneen le Dino Revenu" qu'une fois par tour.
  | de_name            = Wiedergekehrter Dino Daneen
  | de_text            = Falls diese Karte durch einen Monstereffekt als Spezialbeschwörung beschworen wird: Du kannst deiner Hand 1 „GMX“-Monster von deinem Deck hinzufügen. Während deiner Main Phase: Du kannst 1 Dinosaurier-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du Monster von deiner Hand oder Spielfeldseite verwendest. Falls diese Karte auf den Friedhof gelegt wird: Du kannst alle Dinosaurier-Monster, die du derzeit kontrollierst, 400 ATK erhalten lassen. Du kannst jeden Effekt von „Wiedergekehrter Dino Daneen“ nur einmal pro Spielzug verwenden.
  | it_name            = Daneen Dino Ritornato
  | it_text            = Se questa carta viene Evocata Specialmente dall'effetto di un mostro: puoi aggiungere 1 mostro "GMX" dal tuo Deck alla tua mano. Durante la tua Main Phase: puoi Evocare tramite Fusione 1 Mostro Fusione Dinosauro dal tuo Extra Deck, utilizzando mostri dalla tua mano o Terreno. Se questa carta viene mandata al Cimitero: puoi far guadagnare a tutti i mostri Dinosauro che controlli attualmente 400 ATK. Puoi utilizzare ogni effetto di "Daneen Dino Ritornato" una sola volta per turno.
  | pt_name            = Daneen, o Dino Retornado
  | pt_text            = Se este card for Invocado por Invocação-Especial por um efeito de monstro: você pode adicionar 1 monstro "GMX" do seu Deck à sua mão. Durante sua Fase Principal: você pode Invocar por Invocação-Fusão 1 Monstro de Fusão Dinossauro do seu Deck Adicional, usando monstros da sua mão ou do campo. Se este card for enviado para o Cemitério: você pode fazer com que todos os monstros Dinossauro que você controla atualmente ganhem 400 de ATK. Você só pode usar cada efeito de "Daneen, o Dino Retornado" uma vez por turno.
  | es_name            = Daneen Dino de Regreso
  | es_text            = Si esta carta es Invocada de Modo Especial por un efecto de monstruo: puedes añadir a tu mano 1 monstruo "GMX" en tu Deck. Durante tu Main Phase: puedes Invocar por Fusión 1 Monstruo de Fusión Dinosaurio desde tu Deck Extra, usando monstruos en tu mano o Campo. Si esta carta es mandada al Cementerio: puedes hacer que todos los monstruos Dinosaurio que controles en este momento ganen 400 ATK. Sólo puedes usar cada efecto de "Daneen Dino de Regreso" una vez por turno.
  | ja_text            = このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードがモンスターの効果で特殊召喚した場合に発動できる。デッキから「ＧＭＸ」モンスター１体を手札に加える。<br />②：自分メインフェイズに発動できる。自分の手札・フィールドのモンスターを融合素材とし、恐竜族の融合モンスター１体を融合召喚する。<br />③：このカードが墓地へ送られた場合に発動できる。自分フィールドの全ての恐竜族モンスターの攻撃力は４００アップする。
  | ko_name            = 신세룡 다니안
  | ko_text            = 이 카드명의 ①②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 몬스터의 효과로 특수 소환했을 경우에 발동할 수 있다. 덱에서 "GMX(제노믹스)" 몬스터 1장을 패에 넣는다.<br />②: 자신 메인 페이즈에 발동할 수 있다. 자신의 패 / 필드의 몬스터를 융합 소재로 하고, 공룡족의 융합 몬스터 1장을 융합 소환한다.<br />③: 이 카드가 묘지로 보내졌을 경우에 발동할 수 있다. 자신 필드의 모든 공룡족 몬스터의 공격력은 400 올린다.
  | tc_name            = 新世龍 達尼安
  | tc_text            = 此卡名的①②③效果1回合僅可各使用1次。<br />①：此卡以怪獸的效果特殊召喚的情況下可以發動。從牌組將1隻「GMX」怪獸加入手牌。<br />②：在自己的主要階段可以發動。將自己手牌・場上的怪獸作為融合素材，將1隻恐龍族融合怪獸融合召喚。<br />③：此卡被送至墓地的情況下可以發動。自己場上的所有恐龍族怪獸的攻擊力上升400。
  | sc_name            = 新世龙 达尼安
  | sc_text            = 此卡名的①②③效果1回合仅可各使用1次。<br />①：此卡以怪兽的效果特殊召唤的情况下可以发动。从牌组将1只“GMX”怪兽加入手牌。<br />②：在自己的主要阶段可以发动。将自己手牌・场上的怪兽作为融合素材，将1只恐龙族融合怪兽融合召唤。<br />③：此卡被送至墓地的情况下可以发动。自己场上的所有恐龙族怪兽的攻击力上升400。
  }}
