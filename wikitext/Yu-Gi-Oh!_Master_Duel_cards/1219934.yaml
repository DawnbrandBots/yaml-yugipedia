  | level              = 8
  | atk                = 3000
  | def                = 2500
  | text               = 1 Tuner + 1+ non-Tuner DARK monsters<br />If this card is Synchro Summoned: You can add 1 card that mentions "Red Dragon Archfiend" from your Deck to your hand. When your opponent activates a monster effect (Quick Effect): You can banish this card you control; Special Summon 1 "Red Dragon Archfiend" from your Extra Deck (this is treated as a Synchro Summon), and if you do, its ATK becomes doubled, also it cannot be destroyed by your opponent's card effects. You can only use each effect of "The Crimson King" once per turn.

  | fr_name            = Le Roi Cramoisi
  | fr_text            = 1 Syntoniseur + 1+ monstre non-Syntoniseur TÉNÈBRES<br />Si cette carte est Invoquée par Synchronisation : vous pouvez ajouter 1 carte qui mentionne "Dragon Rouge Archdémon" depuis votre Deck à votre main. Lorsque votre adversaire active un effet de monstre (Effet Rapide) : vous pouvez bannir cette carte que vous contrôlez ; Invoquez Spécialement 1 "Dragon Rouge Archdémon" depuis votre Extra Deck (ceci est traité comme Invocation Synchro), et si vous le faites, son ATK sera doublée, et aussi, il ne peut pas être détruit par des effets de carte de votre adversaire. Vous ne pouvez utiliser chaque effet de "Le Roi Cramoisi" qu'une fois par tour.
  | de_name            = Der blutrote König
  | de_text            = 1 Empfänger + 1+ FINSTERNIS Nicht-Empfänger-Monster<br />Falls diese Karte als Synchrobeschwörung beschworen wird: Du kannst deiner Hand 1 Karte, die „Rotdrachen-Erzunterweltler“ erwähnt, von deinem Deck hinzufügen. Wenn dein Gegner einen Monstereffekt aktiviert (Schnelleffekt): Du kannst diese Karte verbannen, die du kontrollierst; beschwöre 1 „Rotdrachen-Erzunterweltler“ als Spezialbeschwörung von deinem Extra Deck (dies wird als Synchrobeschwörung behandelt) und falls du dies tust, werden seine ATK verdoppelt, zusätzlich kann er nicht durch Karteneffekte deines Gegners zerstört werden. Du kannst jeden Effekt von „Der blutrote König“ nur einmal pro Spielzug verwenden.
  | it_name            = Il Re Cremisi
  | it_text            = 1 Tuner + 1+ mostri OSCURITÀ non-Tuner<br />Se questa carta viene Synchro Evocata: puoi aggiungere 1 carta che menziona "Arcidemone Drago Rosso" dal tuo Deck alla tua mano. Quando il tuo avversario attiva l'effetto di un mostro (Effetto Rapido): puoi bandire questa carta che controlli; Evoca Specialmente 1 "Arcidemone Drago Rosso" dal tuo Extra Deck (questa viene considerata come una Synchro Evocazione) e, se lo fai, il suo ATK viene raddoppiato, inoltre esso non può essere distrutto dagli effetti delle carte del tuo avversario. Puoi utilizzare ogni effetto di "Il Re Cremisi" una sola volta per turno.
  | pt_name            = O Rei Carmesim
  | pt_text            = 1 Regulador + 1+ monstros não-Reguladores de TREVAS<br />Se este card for Invocado por Invocação-Sincro: você pode adicionar 1 card que mencione "Dragão Vermelho Arquidemônio" do seu Deck à sua mão. Quando seu oponente ativar um efeito de monstro (Efeito Rápido): você pode banir este card que você controla; Invoque por Invocação-Especial 1 "Dragão Vermelho Arquidemônio" do seu Deck Adicional (isso é considerado uma Invocação-Sincro) e, se isso acontecer, seu ATK se torna o dobro e, além disso, ele não pode ser destruído pelos efeitos de card do seu oponente. Você só pode usar cada efeito de "O Rei Carmesim" uma vez por turno.
  | es_name            = El Rey Carmesí
  | es_text            = 1 Cantante + 1+ monstruos de OSCURIDAD que no sean Cantantes<br />Si esta carta es Invocada por Sincronía: puedes añadir a tu mano 1 carta que mencione "Dragón Rojo Archidemonio" en tu Deck. Cuando tu adversario activa un efecto de monstruo (Efecto Rápido): puedes desterrar esta carta que controlas; Invoca de Modo Especial 1 "Dragón Rojo Archidemonio" desde tu Deck Extra (esto se trata como una Invocación por Sincronía) y, si lo haces, su ATK se duplica, y además no puede ser destruido por efectos de cartas de tu adversario. Sólo puedes usar cada efecto de "El Rey Carmesí" una vez por turno.
  | ja_text            = チューナー＋チューナー以外の闇属性モンスター１体以上<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードがＳ召喚した場合に発動できる。デッキから「レッド・デーモンズ・ドラゴン」のカード名が記されたカード１枚を手札に加える。<br />②：相手がモンスターの効果を発動した時、フィールドのこのカードを除外して発動できる。ＥＸデッキから「レッド・デーモンズ・ドラゴン」１体をＳ召喚扱いで特殊召喚する。この効果で特殊召喚したモンスターの攻撃力は倍になり、相手の効果では破壊されない。
  | ko_name            = 더 크림즌 킹
  | ko_text            = 튜너 ＋ 튜너 이외의 어둠 속성 몬스터 1장 이상<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 싱크로 소환했을 경우에 발동할 수 있다. 덱에서 "레드 데몬즈 드래곤"의 카드명이 쓰여진 카드 1장을 패에 넣는다.<br />②: 상대가 몬스터의 효과를 발동했을 때, 필드의 이 카드를 제외하고 발동할 수 있다. 엑스트라 덱에서 "레드 데몬즈 드래곤" 1장을 싱크로 소환으로 취급하고 특수 소환한다. 이 효과로 특수 소환한 몬스터의 공격력은 배가 되고, 상대 효과로는 파괴되지 않는다.
  | tc_name            = 紅蓮的王者
  | tc_text            = 協調＋協調以外的闇屬性怪獸1隻以上<br />此卡名的①②效果1回合僅可各使用1次。<br />①：此卡同步召喚的情況下可以發動。從牌組將1張記載有「闇紅惡魔龍」卡名的卡加入手牌。<br />②：對手發動怪獸的效果時，將場上的此卡除外可以發動。從額外牌組將1隻「闇紅惡魔龍」視為同步召喚特殊召喚。以此效果特殊召喚的怪獸的攻擊力變為兩倍，不會因對手的效果被破壞。
  | sc_name            = 红莲的王者
  | sc_text            = 协调＋协调以外的暗属性怪兽1只以上<br />此卡名的①②效果1回合仅可各使用1次。<br />①：此卡同步召唤的情况下可以发动。从牌组将1张记载有“暗红恶魔龙”卡名的卡加入手牌。<br />②：对手发动怪兽的效果时，将场上的此卡除外可以发动。从额外牌组将1只“暗红恶魔龙”视为同步召唤特殊召唤。以此效果特殊召唤的怪兽的攻击力变为两倍，不会因对手的效果被破坏。
