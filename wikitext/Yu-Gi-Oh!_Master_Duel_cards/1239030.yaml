  | text               = 1 Tuner + 1+ non-Tuners<br />During Main Phase 2 (Quick Effect): You can destroy as many face-up monsters on the field as possible, and if you do, inflict damage to your opponent equal to the total original Levels of those destroyed monsters x 200. If this card is destroyed by battle or card effect: You can target 1 Level 5 or lower Machine monster in your GY; Special Summon it in Defense Position. You can only use each effect of "Infernal Strike Fighter" once per turn.

  | fr_name            = Bombardier de Choc Infernal
  | fr_text            = 1 Syntoniseur + 1+ non-Syntoniseur<br />Durant la Main Phase 2 (Effet Rapide) : vous pouvez détruire autant de monstres face recto sur le Terrain que possible, et si vous le faites, infligez des dommages à votre adversaire égaux à la somme des Niveaux d'origine de ces monstres détruits x 200. Si cette carte est détruite au combat ou par un effet de carte : vous pouvez cibler 1 monstre Machine de max. Niveau 5 dans votre Cimetière ; Invoquez-le Spécialement en Position de Défense. Vous ne pouvez utiliser chaque effet de "Bombardier de Choc Infernal" qu'une fois par tour.
  | de_name            = Infernaler Jagdbomber
  | de_text            = 1 Empfänger + 1+ Nicht-Empfänger<br />Während Main Phase 2 (Schnelleffekt): Du kannst so viele offene Monster auf dem Spielfeld zerstören wie möglich und falls du dies tust, füge deinem Gegner Schaden in Höhe der Summe der Grund-Stufen jener zerstörten Monster x 200 zu. Falls diese Karte durch Kampf oder einen Karteneffekt zerstört wird: Du kannst 1 Maschine-Monster der Stufe 5 oder niedriger in deinem Friedhof wählen; beschwöre es als Spezialbeschwörung in die Verteidigungsposition. Du kannst jeden Effekt von „Infernaler Jagdbomber“ nur einmal pro Spielzug verwenden.
  | it_name            = Combattente Colpo Infernale
  | it_text            = 1 Tuner + 1+ non-Tuner<br />Durante la Main Phase 2 (Effetto Rapido): puoi distruggere tanti mostri scoperti sul Terreno quanti possibile e, se lo fai, infliggi al tuo avversario danno pari alla somma dei Livelli originali di quei mostri distrutti x 200. Se questa carta viene distrutta in battaglia o dall'effetto di una carta: puoi scegliere come bersaglio 1 mostro Macchina di Livello 5 o inferiore nel tuo Cimitero; Evocalo Specialmente in Posizione di Difesa. Puoi utilizzare ogni effetto di "Combattente Colpo Infernale" una sola volta per turno.
  | pt_name            = Lutador do Golpe Infernal
  | pt_text            = 1 Regulador + 1+ não-Reguladores<br />Durante a Fase Principal 2 (Efeito Rápido): você pode destruir tantos monstros com a face para cima no campo quanto possível e, se isso acontecer, cause dano ao seu oponente igual à soma dos Níveis originais desses monstros destruídos x 200. Se este card for destruído em batalha ou por um efeito de card: você pode escolher 1 monstro Máquina de Nível 5 ou menos no seu Cemitério; Invoque-o por Invocação-Especial em Posição de Defesa. Você só pode usar cada efeito de "Lutador do Golpe Infernal" uma vez por turno.
  | es_name            = Luchador Golpe Infernal
  | es_text            = 1 Cantante + 1+ no Cantantes<br />Durante la Main Phase 2 (Efecto Rápido): puedes destruir tantos monstruos boca arriba en el Campo como sea posible y, si lo haces, inflige daño a tu adversario igual a los Niveles originales totales de esos monstruos destruidos x 200. Si esta carta es destruida en batalla o por el efecto de una carta: puedes seleccionar 1 monstruo Máquina de Nivel 5 o menor en tu Cementerio; Invócalo de Modo Especial en Posición de Defensa. Sólo puedes usar cada efecto de "Luchador Golpe Infernal" una vez por turno.
  | ja_text            = チューナー＋チューナー以外のモンスター１体以上<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：自分・相手のメインフェイズ２に発動できる。フィールドの表側表示モンスターを全て破壊し、破壊したモンスターの元々のレベルの合計×２００ダメージを相手に与える。<br />②：このカードが戦闘・効果で破壊された場合、自分の墓地のレベル５以下の機械族モンスター１体を対象として発動できる。そのモンスターを守備表示で特殊召喚する。
  | ko_name            = 헬 다이브 봄버
  | ko_text            = 튜너 ＋ 튜너 이외의 몬스터 1장 이상<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 자신 / 상대의 메인 페이즈 2 에 발동할 수 있다. 필드의 앞면 표시 몬스터를 전부 파괴하고, 파괴한 몬스터의 원래의 레벨의 합계 × 200 데미지를 상대에게 준다.<br />②: 이 카드가 전투 / 효과로 파괴되었을 경우, 자신 묘지의 레벨 5 이하의 기계족 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 수비 표시로 특수 소환한다.
  | tc_name            = 地獄俯衝轟炸機
  | tc_text            = 協調＋協調以外的怪獸1隻以上<br />此卡名的①②效果1回合僅可各使用1次。<br />①：在自己・對手的主要階段2可以發動。將場上的表側表示怪獸全部破壞，給予對手所破壞怪獸的原本等級合計×200的傷害。<br />②：此卡因戰鬥・效果被破壞的情況下，以自己墓地的1隻等級5以下的機械族怪獸為對象可以發動。將該怪獸以守備表示特殊召喚。
  | sc_name            = 地狱俯冲轰炸机
  | sc_text            = 协调＋协调以外的怪兽1只以上<br />此卡名的①②效果1回合仅可各使用1次。<br />①：在自己・对手的主要阶段2可以发动。将场上的表侧表示怪兽全部破坏，给予对手所破坏怪兽的原本等级合计×200的伤害。<br />②：此卡因战斗・效果被破坏的情况下，以自己墓地的1只等级5以下的机械族怪兽为对象可以发动。将该怪兽以守备表示特殊召唤。
