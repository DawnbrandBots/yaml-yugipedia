  | text               = 1 "Aleister" monster + 1 monster Special Summoned from the Extra Deck<br />If this card is Special Summoned: You can activate 1 of these effects;<br />●Destroy all monsters your opponent controls that were Special Summoned from the Extra Deck.<br />●Destroy all Spells/Traps your opponent controls.<br />When your opponent activates a card effect in the GY (Quick Effect): You can banish this card you control; Special Summon 1 "Aleister" monster from your Deck, and if you do, negate that activated effect. You can only use each effect of "Invoked De Anima" once per turn.

  | fr_name            = De Anima l'Invokhé
  | fr_text            = 1 monstre "Aleister" + 1 monstre Invoqué Spécialement depuis l'Extra Deck<br />Si cette carte est Invoquée Spécialement : vous pouvez activer 1 de ces effets ;<br />●Détruisez tous les monstres contrôlés par votre adversaire qui ont été Invoqués Spécialement depuis l'Extra Deck.<br />●Détruisez tous les Magies/Pièges contrôlés par votre adversaire.<br />Lorsque votre adversaire active un effet de carte dans le Cimetière (Effet Rapide) : vous pouvez bannir cette carte que vous contrôlez ; Invoquez Spécialement 1 monstre "Aleister" depuis votre Deck, et si vous le faites, annulez l'effet activé. Vous ne pouvez utiliser chaque effet de "De Anima l'Invokhé" qu'une fois par tour.
  | de_name            = Beschworener De Anima
  | de_text            = 1 „Aleister“-Monster + 1 als Spezialbeschwörung vom Extra Deck beschworenes Monster<br />Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst 1 dieser Effekte aktivieren;<br />●Zerstöre alle Monster, die dein Gegner kontrolliert und die als Spezialbeschwörung vom Extra Deck beschworen wurden.<br />●Zerstöre alle Zauber/Fallen, die dein Gegner kontrolliert.<br />Wenn dein Gegner einen Karteneffekt im Friedhof aktiviert (Schnelleffekt): Du kannst diese Karte verbannen, die du kontrollierst; beschwöre 1 „Aleister“-Monster als Spezialbeschwörung von deinem Deck und falls du dies tust, annulliere jenen aktivierten Effekt. Du kannst jeden Effekt von „Beschworener De Anima“ nur einmal pro Spielzug verwenden.
  | it_name            = De Anima Invokato
  | it_text            = 1 mostro "Aleister" + 1 mostro Evocato Specialmente dall'Extra Deck<br />Se questa carta viene Evocata Specialmente: puoi attivare 1 di questi effetti;<br />●Distruggi tutti i mostri controllati dal tuo avversario che sono stati Evocati Specialmente dall'Extra Deck.<br />●Distruggi tutte le Magie/Trappole controllate dal tuo avversario.<br />Quando il tuo avversario attiva l'effetto di una carta nel Cimitero (Effetto Rapido): puoi bandire questa carta che controlli; Evoca Specialmente 1 mostro "Aleister" dal tuo Deck e, se lo fai, annulla quell'effetto attivato. Puoi utilizzare ogni effetto di "De Anima Invokato" una sola volta per turno.
  | pt_name            = De Anima, o Invokado
  | pt_text            = 1 monstro "Aleister" + 1 monstro Invocado por Invocação-Especial do Deck Adicional<br />Se este card for Invocado por Invocação-Especial: você pode ativar 1 desses efeitos;<br />●Destrua todos os monstros que seu oponente controla que foram Invocados por Invocação-Especial do Deck Adicional.<br />●Destrua todas as Magias/Armadilhas que seu oponente controla.<br />Quando seu oponente ativar um efeito de card no Cemitério (Efeito Rápido): você pode banir este card que você controla; Invoque por Invocação-Especial 1 monstro "Aleister" do seu Deck e, se isso acontecer, negue esse efeito ativado. Você só pode usar cada efeito de "De Anima, o Invokado" uma vez por turno.
  | es_name            = De Ánima Invokado
  | es_text            = 1 monstruo "Aleister" + 1 monstruo Invocado de Modo Especial desde el Deck Extra<br />Si esta carta es Invocada de Modo Especial: puedes activar 1 de estos efectos;<br />●Destruye todos los monstruos que controle tu adversario que fueran Invocados de Modo Especial desde el Deck Extra.<br />●Destruye todas las Mágicas/Trampas que controle tu adversario.<br />Cuando tu adversario activa un efecto de carta en el Cementerio (Efecto Rápido): puedes desterrar esta carta que controlas; Invoca de Modo Especial 1 monstruo "Aleister" desde tu Deck y, si lo haces, niega ese efecto activado. Sólo puedes usar cada efecto de "De Ánima Invokado" una vez por turno.
  | ja_text            = 「アレイスター」モンスター＋ＥＸデッキから特殊召喚されたモンスター<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが特殊召喚した場合、以下の効果から１つを選択して発動できる。<br />●ＥＸデッキから特殊召喚された相手フィールドのモンスターを全て破壊する。<br />●相手フィールドの魔法・罠カードを全て破壊する。<br />②：相手が墓地のカードの効果を発動した時、フィールドのこのカードを除外して発動できる。デッキから「アレイスター」モンスター１体を特殊召喚し、その発動した効果を無効にする。
  | ko_name            = 소환수 데 아니마
  | ko_text            = "알레이스터" 몬스터 ＋ 엑스트라 덱에서 특수 소환된 몬스터<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 특수 소환했을 경우, 이하의 효과에서 1개를 선택하고 발동할 수 있다.<br />●엑스트라 덱에서 특수 소환된 상대 필드의 몬스터를 전부 파괴한다.<br />●상대 필드의 마법 / 함정 카드를 전부 파괴한다.<br />②: 상대가 묘지의 카드의 효과를 발동했을 때, 필드의 이 카드를 제외하고 발동할 수 있다. 덱에서 "알레이스터" 몬스터 1장을 특수 소환하고, 그 발동한 효과를 무효로 한다.
  | tc_name            = 召喚獸 迪・阿尼瑪
  | tc_text            = 「阿萊斯特」怪獸＋被從額外牌組特殊召喚的怪獸<br />此卡名的①②效果1回合僅可各使用1次。<br />①：此卡特殊召喚的情況下，可從以下效果中選擇1個發動。<br />●將對手場上的、被從額外牌組特殊召喚的怪獸全部破壞。<br />●將對手場上的魔法・陷阱卡全部破壞。<br />②：對手發動墓地的卡的效果時，將場上的此卡除外可以發動。從牌組將1隻「阿萊斯特」怪獸特殊召喚，將該發動的效果無效。
  | sc_name            = 召唤兽 迪・阿尼玛
  | sc_text            = “阿莱斯特”怪兽＋被从额外牌组特殊召唤的怪兽<br />此卡名的①②效果1回合仅可各使用1次。<br />①：此卡特殊召唤的情况下，可从以下效果中选择1个发动。<br />●将对手场上的、被从额外牌组特殊召唤的怪兽全部破坏。<br />●将对手场上的魔法・陷阱卡全部破坏。<br />②：对手发动墓地的卡的效果时，将场上的此卡除外可以发动。从牌组将1只“阿莱斯特”怪兽特殊召唤，将该发动的效果无效。
  }}
