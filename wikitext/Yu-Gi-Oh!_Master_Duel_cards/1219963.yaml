title: Mechanical Mechanic (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | attribute          = WIND
  | types              = Machine / Tuner / Effect
  | level              = 3
  | atk                = 500
  | def                = 500
  | text               = When an attack is declared involving your other Machine monster: You can increase or decrease the Level of that other monster you control by 1. You can only use each of the following effects of "Mechanical Mechanic" once per turn. If a card is in the Field Zone: You can Special Summon this card from your hand. You can target 1 face-up Spell/Trap you control; destroy it, and if you do, add 1 WIND Machine monster with 0 ATK from your Deck to your hand, also you cannot Special Summon from the Extra Deck for the rest of this turn, except Machine monsters.

  | fr_name            = Mécano Mécanique
  | fr_text            = Lorsqu'une attaque impliquant votre autre monstre Machine est déclarée : vous pouvez augmenter ou réduire le Niveau de l'autre monstre que vous contrôlez de 1. Vous ne pouvez utiliser chacun des effets suivants de "Mécano Mécanique" qu'une fois par tour. Si une carte est dans la Zone Terrain : vous pouvez Invoquer Spécialement cette carte depuis votre main. Vous pouvez cibler 1 Magie/Piège face recto que vous contrôlez ; détruisez-le, et si vous le faites, ajoutez 1 monstre VENT Machine avec 0 ATK depuis votre Deck à votre main, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres Machine exclus) depuis l'Extra Deck le reste de ce tour.
  | de_name            = Mechanischer Mechaniker
  | de_text            = Wenn ein Angriff deklariert wird, an dem dein anderes Maschine-Monster beteiligt ist: Du kannst die Stufe jenes anderen Monsters, das du kontrollierst, um 1 erhöhen oder verringern. Du kannst jeden der folgenden Effekte von „Mechanischer Mechaniker“ nur einmal pro Spielzug verwenden. Falls eine Karte in der Spielfeldzone liegt: Du kannst diese Karte als Spezialbeschwörung von deiner Hand beschwören. Du kannst 1 offene/n Zauber/Falle wählen, den oder die du kontrollierst; zerstöre ihn oder sie und falls du dies tust, füge deiner Hand 1 WIND Maschine-Monster mit 0 ATK von deinem Deck hinzu, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Maschine-Monstern.
  | it_name            = Meccanico Meccanico
  | it_text            = Quando viene dichiarato un attacco che coinvolge un tuo altro mostro Macchina: puoi aumentare o diminuire il Livello di quell'altro mostro che controlli di 1. Puoi utilizzare ognuno dei seguenti effetti di "Meccanico Meccanico" una sola volta per turno. Se una carta è nella Zona Terreno: puoi Evocare Specialmente questa carta dalla tua mano. Puoi scegliere come bersaglio 1 Magia/Trappola scoperta che controlli; distruggila e, se lo fai, aggiungi 1 mostro VENTO Macchina con ATK 0 dal tuo Deck alla tua mano, inoltre non puoi Evocare Specialmente dall'Extra Deck per il resto di questo turno, eccetto mostri Macchina.
  | pt_name            = Mecânico Mecânico
  | pt_text            = Quando um ataque for declarado envolvendo outro monstro Máquina seu: você pode aumentar ou diminuir o Nível desse outro monstro que você controla em 1. Você só pode usar cada um dos seguintes efeitos de "Mecânico Mecânico" uma vez por turno. Se um card estiver na Zona do Campo: você pode Invocar este card por Invocação-Especial da sua mão. Você pode escolher 1 Magia/Armadilha com a face para cima que você controla; destrua-a e, se isso acontecer, adicione 1 monstro Máquina de VENTO com 0 de ATK do seu Deck à sua mão e, além disso, você não pode Invocar por Invocação-Especial do Deck Adicional pelo resto deste turno, exceto monstros Máquina.
  | es_name            = Mecánico Mecánico
  | es_text            = Cuando es declarado un ataque que involucra tu otro monstruo Máquina: puedes aumentar o reducir el Nivel de ese otro monstruo que controlas en 1. Sólo puedes usar cada uno de los siguientes efectos de "Mecánico Mecánico" una vez por turno. Si una carta está en la Zona del Campo: puedes Invocar esta carta de Modo Especial desde tu mano. Puedes seleccionar 1 Mágica/Trampa boca arriba que controles; destrúyela y, si lo haces, añade a tu mano 1 monstruo Máquina de VIENTO con 0 ATK en tu Deck, y además no puedes Invocar de Modo Especial desde el Deck Extra por el resto de este turno, excepto monstruos Máquina.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：フィールドゾーンにカードが存在する場合に発動できる。このカードを手札から特殊召喚する。<br />②：自分フィールドの表側表示の魔法・罠カード１枚を対象として発動できる。そのカードを破壊し、デッキから攻撃力０の機械族・風属性モンスター１体を手札に加える。このターン、自分は機械族モンスターしかＥＸデッキから特殊召喚できない。<br />③：他の自分の機械族モンスターが戦闘を行う攻撃宣言時に発動できる。その自分のモンスターのレベルを１つ上げるか下げる。
  | ko_name            = 기예의 메카튜너
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 필드 존에 카드가 존재할 경우에 발동할 수 있다. 이 카드를 패에서 특수 소환한다.<br />②: 자신 필드의 앞면 표시의 마법 / 함정 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 파괴하고, 덱에서 공격력 0 인 기계족 / 바람 속성 몬스터 1장을 패에 넣는다. 이 턴에, 자신은 기계족 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다.<br />③: 다른 자신의 기계족 몬스터가 전투를 실행하는 공격 선언시에 발동할 수 있다. 그 자신 몬스터의 레벨을 1개 올리거나 내린다.
  | tc_name            = 機睿的機械調整師
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：場地區域存在卡的情況下可以發動。從手牌將此卡特殊召喚。<br />②：以自己場上的1張表側表示的魔法・陷阱卡為對象可以發動。將該卡破壞，從牌組將1隻攻擊力0的機械族・風屬性怪獸加入手牌。此回合，自己從額外牌組僅可特殊召喚機械族怪獸。<br />③：其他自己的機械族怪獸進行戰鬥的攻擊宣言時可以發動。將該自己的怪獸的等級上升或下降1。
  | sc_name            = 机睿的机械调整师
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：场地区域存在卡的情况下可以发动。从手牌将此卡特殊召唤。<br />②：以自己场上的1张表侧表示的魔法・陷阱卡为对象可以发动。将该卡破坏，从牌组将1只攻击力0的机械族・风属性怪兽加入手牌。此回合，自己从额外牌组仅可特殊召唤机械族怪兽。<br />③：其他自己的机械族怪兽进行战斗的攻击宣言时可以发动。将该自己的怪兽的等级上升或下降1。
  }}
