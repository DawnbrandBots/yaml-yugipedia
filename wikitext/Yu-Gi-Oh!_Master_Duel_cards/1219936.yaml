  | text               = 1 Tuner + 1+ non-Tuners<br />Gains ATK equal to the total original ATK of all other Synchro Monsters you control. You can only use each of the following effects of "Crimson Dragon Quetzalcoatl" once per turn. If this card is Synchro Summoned: You can Special Summon as many Dragon Synchro Monsters from your GY as possible, also you cannot Special Summon for the rest of this turn. When your opponent activates a monster effect (Quick Effect): You can return 1 other Dragon Synchro Monster you control to the Extra Deck, and if you do, negate that activation.

  | fr_name            = Quetzalcoatl le Dragon Cramoisi
  | fr_text            = 1 Syntoniseur + 1+ non-Syntoniseur<br />Gagne une ATK égale à la somme des ATK d'origine de tous les autres Monstres Synchro que vous contrôlez. Vous ne pouvez utiliser chacun des effets suivants de "Quetzalcoatl le Dragon Cramoisi" qu'une fois par tour. Si cette carte est Invoquée par Synchronisation : vous pouvez Invoquer Spécialement autant de Monstres Synchro Dragon depuis votre Cimetière que possible, et aussi, vous ne pouvez pas Invoquer Spécialement le reste de ce tour. Lorsque votre adversaire active un effet de monstre (Effet Rapide) : vous pouvez renvoyer 1 autre Monstre Synchro Dragon que vous contrôlez à l'Extra Deck, et si vous le faites, annulez l'activation.
  | de_name            = Feuerroter Drache Quetzalcoatl
  | de_text            = 1 Empfänger + 1+ Nicht-Empfänger<br />Erhält ATK in Höhe der Summe der Grund-ATK aller anderen Synchromonster, die du kontrollierst. Du kannst jeden der folgenden Effekte von „Feuerroter Drache Quetzalcoatl“ nur einmal pro Spielzug verwenden. Falls diese Karte als Synchrobeschwörung beschworen wird: Du kannst so viele Drache-Synchromonster als Spezialbeschwörung von deinem Friedhof beschwören wie möglich, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen. Wenn dein Gegner einen Monstereffekt aktiviert (Schnelleffekt): Du kannst 1 anderes Drache-Synchromonster, das du kontrollierst, ins Extra Deck zurücklegen und falls du dies tust, annulliere jene Aktivierung.
  | it_name            = Quetzalcoatl Drago Cremisi
  | it_text            = 1 Tuner + 1+ non-Tuner<br />Guadagna ATK pari alla somma degli ATK originali di tutti gli altri Mostri Synchro che controlli. Puoi utilizzare ognuno dei seguenti effetti di "Quetzalcoatl Drago Cremisi" una sola volta per turno. Se questa carta viene Synchro Evocata: puoi Evocare Specialmente dal tuo Cimitero tanti Mostri Synchro Drago quanti possibile, inoltre non puoi Evocare Specialmente per il resto di questo turno. Quando il tuo avversario attiva l'effetto di un mostro (Effetto Rapido): puoi far ritornare 1 altro Mostro Synchro Drago che controlli nell'Extra Deck e, se lo fai, annulla quell'attivazione.
  | pt_name            = Dragão Carmesim Quetzalcoatl
  | pt_text            = 1 Regulador + 1+ não-Reguladores<br />Ganha ATK igual à soma do ATK original de todos os outros Monstros Sincro que você controla. Você só pode usar cada um dos seguintes efeitos de "Dragão Carmesim Quetzalcoatl" uma vez por turno. Se este card for Invocado por Invocação-Sincro: você pode Invocar por Invocação-Especial tantos Monstros Sincro Dragão do seu Cemitério quanto possível e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno. Quando seu oponente ativar um efeito de monstro (Efeito Rápido): você pode devolver 1 outro Monstro Sincro Dragão que você controla para o Deck Adicional e, se isso acontecer, negue a ativação.
  | es_name            = Dragón Carmesí Quetzalcoatl
  | es_text            = 1 Cantante + 1+ no Cantantes<br />Gana ATK igual al ATK original total de todos los demás Monstruos de Sincronía que controlas. Sólo puedes usar cada uno de los siguientes efectos de "Dragón Carmesí Quetzalcoatl" una vez por turno. Si esta carta es Invocada por Sincronía: puedes Invocar de Modo Especial tantos Monstruos de Sincronía Dragón desde tu Cementerio como sea posible, y además no puedes Invocar de Modo Especial por el resto de este turno. Cuando tu adversario activa un efecto de monstruo (Efecto Rápido): puedes devolver al Deck Extra otro Monstruo de Sincronía Dragón que controles y, si lo haces, niega esa activación.
  | ja_text            = チューナー＋チューナー以外のモンスター１体以上<br />このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードがＳ召喚した場合に発動できる。自分の墓地からドラゴン族Ｓモンスターを可能な限り特殊召喚する。このターン、自分はモンスターを特殊召喚できない。<br />②：このカードの攻撃力は、自分フィールドの他のＳモンスターの元々の攻撃力の合計分アップする。<br />③：相手がモンスターの効果を発動した時に発動できる。自分フィールドの他のドラゴン族Ｓモンスター１体をＥＸデッキに戻し、その発動を無効にする。
  | ko_name            = 붉은 용 켓차코아틀
  | ko_text            = 튜너 ＋ 튜너 이외의 몬스터 1장 이상<br />이 카드명의 ①③의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 싱크로 소환했을 경우에 발동할 수 있다. 자신 묘지에서 드래곤족 싱크로 몬스터를 가능한 한 특수 소환한다. 이 턴에, 자신은 몬스터를 특수 소환할 수 없다.<br />②: 이 카드의 공격력은, 자신 필드의 다른 싱크로 몬스터의 원래 공격력의 합계만큼 올린다.<br />③: 상대가 몬스터의 효과를 발동했을 때에 발동할 수 있다. 자신 필드의 다른 드래곤족 싱크로 몬스터 1장을 엑스트라 덱으로 되돌리고, 그 발동을 무효로 한다.
  | tc_name            = 赤龍 克察爾科亞特爾
  | tc_text            = 協調＋協調以外的怪獸1隻以上<br />此卡名的①③效果1回合僅可各使用1次。<br />①：此卡同步召喚的情況下可以發動。從自己墓地將龍族同步怪獸盡可能地特殊召喚。此回合，自己不可特殊召喚怪獸。<br />②：此卡的攻擊力上升相當於自己場上其他的同步怪獸原本攻擊力的合計數值。<br />③：對手發動怪獸的效果時可以發動。將自己場上的1隻其他的龍族同步怪獸放回額外牌組，將該發動無效。
  | sc_name            = 赤龙 克察尔科亚特尔
  | sc_text            = 协调＋协调以外的怪兽1只以上<br />此卡名的①③效果1回合仅可各使用1次。<br />①：此卡同步召唤的情况下可以发动。从自己墓地将龙族同步怪兽尽可能地特殊召唤。此回合，自己不可特殊召唤怪兽。<br />②：此卡的攻击力上升相当于自己场上其他的同步怪兽原本攻击力的合计数值。<br />③：对手发动怪兽的效果时可以发动。将自己场上的1只其他的龙族同步怪兽放回额外牌组，将该发动无效。
  }}
