title: Witchcrafter Celebration (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = UR
  | card_type          = Spell
  | property           = Quick-Play
  | text               = Activate 1 of these effects;<br />●Destroy 1 "Witchcrafter" monster you control and 1 card your opponent controls.<br />●Fusion Summon 1 "Witchcrafter" Fusion Monster from your Extra Deck, by shuffling Spellcaster monsters from your GY or banishment into the Deck.<br />During your End Phase, if this card is in your GY and you control a "Witchcrafter" monster: You can add this card to your hand. You can only use 1 "Witchcrafter Celebration" effect per turn, and only once that turn.

  | fr_name            = Célébration Artisanesorcière
  | fr_text            = Activez 1 de ces effets ;<br />●Détruisez 1 monstre "Artisanesorcière" que vous contrôlez et 1 carte contrôlée par votre adversaire.<br />●Invoquez par Fusion 1 Monstre Fusion "Artisanesorcière" depuis votre Extra Deck, en mélangeant des monstres Magicien depuis votre Cimetière ou bannissement dans le Deck.<br />Durant votre End Phase, si cette carte est dans votre Cimetière et que vous contrôlez un monstre "Artisanesorcière" : vous pouvez ajouter cette carte à votre main. Vous ne pouvez utiliser qu'1 effet de "Célébration Artisanesorcière" par tour, et uniquement une fois le tour.
  | de_name            = Hexwerker-Feier
  | de_text            = Aktiviere 1 dieser Effekte;<br />●Zerstöre 1 „Hexwerker“-Monster, das du kontrollierst, und 1 Karte, die dein Gegner kontrolliert.<br />●Beschwöre 1 „Hexwerker“-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck, indem du Hexer-Monster von deinem Friedhof oder deinen verbannten Karten ins Deck mischst.<br />Während deiner End Phase, falls sich diese Karte in deinem Friedhof befindet und du ein „Hexwerker“-Monster kontrollierst: Du kannst diese Karte deiner Hand hinzufügen. Du kannst nur 1 Effekt von „Hexwerker-Feier“ pro Spielzug verwenden und in jenem Spielzug nur einmal.
  | it_name            = Celebrazione Stregartigiana
  | it_text            = Attiva 1 di questi effetti;<br />●Distruggi 1 mostro "Stregartigiana" che controlli e 1 carta controllata dal tuo avversario.<br />●Evoca tramite Fusione 1 Mostro Fusione "Stregartigiana" dal tuo Extra Deck, mischiando mostri Incantatore dal tuo Cimitero o carte bandite nel Deck.<br />Durante la tua End Phase, se questa carta è nel tuo Cimitero e tu controlli un mostro "Stregartigiana": puoi aggiungere questa carta alla tua mano. Puoi utilizzare solo 1 effetto di "Celebrazione Stregartigiana" per turno, e solo una volta in quel turno.
  | pt_name            = Celebração Fazticeira
  | pt_text            = Ative 1 desses efeitos;<br />●Destrua 1 monstro "Fazticeira" que você controla e 1 card que seu oponente controla.<br />●Invoque por Invocação-Fusão 1 Monstro de Fusão "Fazticeira" do seu Deck Adicional, ao embaralhar no Deck monstros Mago do seu Cemitério ou banimento.<br />Durante sua Fase Final, se este card estiver no seu Cemitério e você controlar um monstro "Fazticeira": você pode adicionar este card à sua mão. Você só pode usar 1 efeito de "Celebração Fazticeira" por turno e apenas uma vez por turno.
  | es_name            = Celebración Artibruja
  | es_text            = Activa 1 de estos efectos;<br />●Destruye 1 monstruo "Artibruja" que controles y 1 carta que controle tu adversario.<br />●Invoca por Fusión 1 Monstruo de Fusión "Artibruja" desde tu Deck Extra, barajando al Deck monstruos Lanzador de Conjuros en tu Cementerio o destierro.<br />Durante tu End Phase, si esta carta está en tu Cementerio y controlas un monstruo "Artibruja": puedes añadir esta carta a tu mano. Sólo puedes usar 1 efecto de "Celebración Artibruja" por turno, y sólo una vez ese turno.
  | ja_text            = このカード名の①②の効果は１ターンに１度、いずれか１つしか使用できない。<br />①：以下の効果から１つを選択して発動できる。<br />●自分フィールドの「ウィッチクラフト」モンスター１体と相手フィールドのカード１枚を破壊する。<br />●自分の墓地・除外状態の魔法使い族モンスターを融合素材としてデッキに戻し、「ウィッチクラフト」融合モンスター１体を融合召喚する。<br />②：自分エンドフェイズに、このカードが墓地に存在し、自分フィールドに「ウィッチクラフト」モンスターが存在する場合に発動できる。このカードを手札に加える。
  | ko_name            = 위치크래프트 셀레브레이션
  | ko_text            = 이 카드명의 ①②의 효과는 1턴에 1번, 어느 쪽이든 1개밖에 사용할 수 없다.<br />①: 이하의 효과에서 1개를 선택하고 발동할 수 있다.<br />●자신 필드의 "위치크래프트" 몬스터 1장과 상대 필드의 카드 1장을 파괴한다.<br />●자신의 묘지 / 제외 상태인 마법사족 몬스터를 융합 소재로 하여 덱으로 되돌리고, "위치크래프트" 융합 몬스터 1장을 융합 소환한다.<br />②: 자신 엔드 페이즈에, 이 카드가 묘지에 존재하고, 자신 필드에 "위치크래프트" 몬스터가 존재할 경우에 발동할 수 있다. 이 카드를 패에 넣는다.
  | tc_name            = 魔女工藝・慶典
  | tc_text            = 此卡名的①②效果1回合1次，僅可使用其中1個。<br />①：可從以下效果中選擇1個發動。<br />●將自己場上的1隻「魔女工藝」怪獸和對手場上的1張卡破壞。<br />●將自己墓地・除外狀態的魔法使族怪獸作為融合素材放回牌組，將1隻「魔女工藝」融合怪獸融合召喚。<br />②：在自己的結束階段，此卡存在於墓地，且自己場上存在「魔女工藝」怪獸的情況下可以發動。將此卡加入手牌。
  | sc_name            = 魔女工艺・庆典
  | sc_text            = 此卡名的①②效果1回合1次，仅可使用其中1个。<br />①：可从以下效果中选择1个发动。<br />●将自己场上的1只“魔女工艺”怪兽和对手场上的1张卡破坏。<br />●将自己墓地・除外状态的魔法师族怪兽作为融合素材放回牌组，将1只“魔女工艺”融合怪兽融合召唤。<br />②：在自己的结束阶段，此卡存在于墓地，且自己场上存在“魔女工艺”怪兽的情况下可以发动。将此卡加入手牌。
  }}
