  | fr_name            = Shamanite le Chevalier Shamanique
  | fr_text            = 2+ monstres de Niveau 3<br />Si cette carte est Invoquée par Xyz, ou si un Piège que vous possédez est banni : vous pouvez cibler 1 de vos Pièges bannis ; attachez-le à cette carte. Vous pouvez détacher un nombre de votre choix de Matériels de cette carte, puis ciblez 1 monstre TÉNÈBRES dans votre Cimetière ou bannissement de Niveau égal au nombre détaché ; Invoquez-le Spécialement. Vous ne pouvez utiliser chaque effet de "Shamanite le Chevalier Shamanique" qu'une fois par tour.
  | de_name            = Schamanit-Schamanenritter
  | de_text            = 2+ Monster der Stufe 3<br />Falls diese Karte als Xyz-Beschwörung beschworen wird oder falls eine Falle, die du besitzt, verbannt wird: Du kannst 1 deiner verbannten Fallen wählen; hänge sie an diese Karte an. Du kannst eine beliebige Anzahl Material von dieser Karte abhängen und dann 1 FINSTERNIS Monster mit einer Stufe in Höhe der abgehängten Anzahl in deinem Friedhof oder von deinen verbannten Karten wählen; beschwöre es als Spezialbeschwörung. Du kannst jeden Effekt von „Schamanit-Schamanenritter“ nur einmal pro Spielzug verwenden.
  | it_name            = Shamanite Sciamancavaliere
  | it_text            = 2+ mostri di Livello 3<br />Se questa carta viene Evocata Xyz, o se una Trappola che possiedi viene bandita: puoi scegliere come bersaglio 1 delle tue Trappole bandite; attaccala a questa carta. Puoi staccare un qualsiasi numero di materiali da questa carta, poi scegliere come bersaglio 1 mostro OSCURITÀ nel tuo Cimitero o carte bandite con un Livello pari al numero staccato; Evocalo Specialmente. Puoi utilizzare ogni effetto di "Shamanite Sciamancavaliere" una sola volta per turno.
  | pt_name            = Cavaleiro Xamã Xamanita
  | pt_text            = 2+ monstros de Nível 3<br />Se este card for Invocado por Invocação-Xyz, ou se uma Armadilha da qual você é dono for banida: você pode escolher 1 das suas Armadilhas banidas; associe-a a este card. Você pode desassociar qualquer número de matérias deste card e, depois, escolha 1 monstro de TREVAS no seu Cemitério ou banimento com um Nível igual ao número desassociado; Invoque-o por Invocação-Especial. Você só pode usar cada efeito de "Cavaleiro Xamã Xamanita" uma vez por turno.
  | es_name            = Shamanite Caballero Chamán
  | es_text            = 2+ monstruos de Nivel 3<br />Si esta carta es Invocada Xyz, o si una Trampa que posees es desterrada: puedes seleccionar 1 de tus Trampas desterradas; acóplala a esta carta. Puedes desacoplar cualquier número de materiales de esta carta, y después selecciona 1 monstruo de OSCURIDAD en tu Cementerio o destierro con un Nivel igual al número de desacoplados; Invócalo de Modo Especial. Sólo puedes usar cada efecto de "Shamanite Caballero Chamán" una vez por turno.
  | ja_text            = レベル３モンスター×２体以上<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードがＸ召喚した場合、または元々の持ち主が自分である罠カードが除外された場合、自分の除外状態の罠カード１枚を対象として発動できる。そのカードをこのカードのＸ素材にする。<br />②：このカードのＸ素材を任意の数だけ取り除き、その数と同じレベルを持つ自分の墓地・除外状態の闇属性モンスター１体を対象として発動できる。そのモンスターを特殊召喚する。
  | ko_name            = 마해기사 샤마나이트
  | ko_text            = 레벨 3 몬스터 × 2장 이상<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 엑시즈 소환했을 경우, 또는 원래의 주인이 자신인 함정 카드가 제외되었을 경우, 자신의 제외 상태의 함정 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 이 카드의 엑시즈 소재로 한다.<br />②: 이 카드의 엑시즈 소재를 임의의 수만큼 제거하고, 그 수와 같은 레벨을 가지는 자신의 묘지 / 제외 상태의 어둠 속성 몬스터 1장을 대상으로 하여 발동할 수 있다. 그 몬스터를 특수 소환한다.
  | tc_name            = 魔解騎士 通靈晶簇
  | tc_text            = 等級3怪獸×2隻以上<br />此卡名的①②效果1回合僅可各使用1次。<br />①：此卡超量召喚的情況下，或原本持有者為自己的陷阱卡被除外的情況下，以自己除外狀態的1張陷阱卡為對象可以發動。將該卡作為此卡的超量素材。<br />②：去除此卡的任意數量的超量素材，以與其數量相同等級的、自己墓地・除外狀態的1隻闇屬性怪獸為對象可以發動。將該怪獸特殊召喚。
  | sc_name            = 魔解骑士 通灵晶簇
  | sc_text            = 等级3怪兽×2只以上<br />此卡名的①②效果1回合仅可各使用1次。<br />①：此卡超量召唤的情况下，或原本持有者为自己的陷阱卡被除外的情况下，以自己除外状态的1张陷阱卡为对象可以发动。将该卡作为此卡的超量素材。<br />②：去除此卡的任意数量的超量素材，以与其数量相同等级的、自己墓地・除外状态的1只暗属性怪兽为对象可以发动。将该怪兽特殊召唤。
