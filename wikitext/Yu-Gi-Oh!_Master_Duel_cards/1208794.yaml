title: Fandora, the Flying Fighting Furtress (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | card_type          = Spell
  | property           = Field
  | text               = (This card is always treated as a card "Fur Hire".)<br />Monsters "Fur Hire" you control gain 300 ATK for each monster "Fur Hire" you control with a different name. You can only use each of the following effects of "Fandora, the Flying Fighting Furtress" once per turn. During your Main Phase: You can add 1 monster "Fur Hire" from your Deck to your hand, then discard 1 card. If a face-up monster(s) "Fur Hire" you control is destroyed by an opponent's card effect (except during the Damage Step): You can Special Summon 1 monster "Fur Hire" from your Deck.

  | fr_name            = Fondora, la Fourtoresse de Combat Volante
  | fr_text            = (Cette carte est toujours traitée comme carte "Mercefourrure".)<br />Les monstres "Mercefourrure" que vous contrôlez gagnent 300 ATK pour chaque monstre "Mercefourrure" que vous contrôlez de nom différent. Vous ne pouvez utiliser chacun des effets suivants de "Fondora, la Fourtoresse de Combat Volante" qu'une fois par tour. Durant votre Main Phase : vous pouvez ajouter 1 monstre "Mercefourrure" depuis votre Deck à votre main, puis défaussez 1 carte. Si un ou plusieurs monstres "Mercefourrure" face recto que vous contrôlez sont détruits par un effet de carte de l'adversaire (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement 1 monstre "Mercefourrure" depuis votre Deck.
  | de_name            = Fandora, die fliegende kämpfende Fellstung
  | de_text            = (Diese Karte wird immer als „Fellsöldner“-Karte behandelt.)<br />„Fellsöldner“-Monster, die du kontrollierst, erhalten für jedes „Fellsöldner“-Monster mit einem unterschiedlichen Namen, das du kontrollierst, 300 ATK. Du kannst jeden der folgenden Effekte von „Fandora, die fliegende kämpfende Fellstung“ nur einmal pro Spielzug verwenden. Während deiner Main Phase: Du kannst deiner Hand 1 „Fellsöldner“-Monster von deinem Deck hinzufügen, dann wirf 1 Karte ab. Falls ein oder mehr offene „Fellsöldner“-Monster, die du kontrollierst, durch einen Karteneffekt eines Gegners zerstört werden (außer während des Damage Steps): Du kannst 1 „Fellsöldner“-Monster als Spezialbeschwörung von deinem Deck beschwören.
  | it_name            = Fandore, la Pelicciafortezza Combattente Volante
  | it_text            = (Questa carta viene sempre considerata come una carta "Pelliccia Mercenaria".)<br />I mostri "Pelliccia Mercenaria" che controlli guadagnano 300 ATK per ogni mostro "Pelliccia Mercenaria" che controlli con un nome diverso. Puoi utilizzare ognuno dei seguenti effetti di "Fandore, la Pelicciafortezza Combattente Volante" una sola volta per turno. Durante la tua Main Phase: puoi aggiungere 1 mostro "Pelliccia Mercenaria" dal tuo Deck alla tua mano, poi scartare 1 carta. Se uno o più mostri "Pelliccia Mercenaria" scoperti che controlli vengono distrutti dall'effetto di una carta dell'avversario (eccetto durante il Damage Step): puoi Evocare Specialmente 1 mostro "Pelliccia Mercenaria" dal tuo Deck.
  | pt_name            = Fandora, o Peloforte de Combate Voador
  | pt_text            = (Este card deve ser sempre considerado como um card "de Peluguel".)<br />Monstros "de Peluguel" que você controla ganham 300 de ATK para cada monstro "de Peluguel" que você controla com um nome diferente. Você só pode usar cada um dos seguintes efeitos de "Fandora, o Peloforte de Combate Voador" uma vez por turno. Durante sua Fase Principal: você pode adicionar 1 monstro "de Peluguel" do seu Deck à sua mão e, depois, descarte 1 card. Se um ou mais monstros "de Peluguel" com a face para cima que você controla forem destruídos por um efeito de card do oponente (exceto durante a Etapa de Dano): você pode Invocar por Invocação-Especial 1 monstro "de Peluguel" do seu Deck.
  | es_name            = Fandora, la Mascotafortaleza Voladora Luchadora
  | es_text            = (Esta carta se trata siempre como una carta "Mascota a Sueldo").<br />Los monstruos "Mascota a Sueldo" que controlas ganan 300 ATK por cada monstruo "Mascota a Sueldo" que controles con un nombre diferente. Sólo puedes usar cada uno de los siguientes efectos de "Fandora, la Mascotafortaleza Voladora Luchadora" una vez por turno. Durante tu Main Phase: puedes añadir a tu mano 1 monstruo "Mascota a Sueldo" en tu Deck, y después descarta 1 carta. Si uno o más monstruos "Mascota a Sueldo" boca arriba que controlas son destruidos por el efecto de una carta del adversario (excepto durante el Damage Step): puedes Invocar de Modo Especial 1 monstruo "Mascota a Sueldo" desde tu Deck.
  | ja_text            = このカード名はルール上「空牙団」カードとしても扱う。<br />このカード名の②③の効果はそれぞれ１ターンに１度しか使用できない。<br />①：自分フィールドの「空牙団」モンスターの攻撃力は、自分フィールドの「空牙団」モンスターの種類×３００アップする。<br />②：自分メインフェイズに発動できる。デッキから「空牙団」モンスター１体を手札に加える。その後、自分の手札を１枚選んで捨てる。<br />③：自分フィールドの表側表示の「空牙団」モンスターが相手の効果で破壊された場合に発動できる。デッキから「空牙団」モンスター１体を特殊召喚する。
  | ko_name            = 비룡전정－환드라
  | ko_text            = 이 카드명은 룰상 "공아단" 카드로도 취급한다.<br />이 카드명의 ②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 자신 필드의 "공아단" 몬스터의 공격력은, 자신 필드의 "공아단" 몬스터의 종류 × 300 올린다.<br />②: 자신 메인 페이즈에 발동할 수 있다. 덱에서 "공아단" 몬스터 1장을 패에 넣는다. 그 후, 자신의 패를 1장 고르고 버린다.<br />③: 자신 필드의 앞면 표시의 "공아단" 몬스터가 상대 효과로 파괴되었을 경우에 발동할 수 있다. 덱에서 "공아단" 몬스터 1장을 특수 소환한다.
  | tc_name            = 飛龍戰艇－帆朵拉
  | tc_text            = 此卡名在規則上也視為「空牙團」卡。<br />此卡名的②③效果1回合僅可各使用1次。<br />①：自己場上的「空牙團」怪獸的攻擊力上升相當於自己場上的「空牙團」怪獸的種類×300的數值。<br />②：在自己的主要階段可以發動。從牌組將1隻「空牙團」怪獸加入手牌。然後，挑選自己的1張手牌捨棄。<br />③：自己場上的表側表示「空牙團」怪獸因對手的效果被破壞的情況下可以發動。從牌組將1隻「空牙團」怪獸特殊召喚。
  | sc_name            = 飞龙战艇－帆朵拉
  | sc_text            = 此卡名在规则上也视为“空牙团”卡。<br />此卡名的②③效果1回合仅可各使用1次。<br />①：自己场上的“空牙团”怪兽的攻击力上升相当于自己场上的“空牙团”怪兽的种类×300的数值。<br />②：在自己的主要阶段可以发动。从牌组将1只“空牙团”怪兽加入手牌。然后，挑选自己的1张手牌舍弃。<br />③：自己场上的表侧表示“空牙团”怪兽因对手的效果被破坏的情况下可以发动。从牌组将1只“空牙团”怪兽特殊召唤。
  }}
