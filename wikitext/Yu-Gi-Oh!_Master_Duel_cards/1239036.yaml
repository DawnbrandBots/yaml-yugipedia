title: Witchcrafter Marka (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = DARK
  | types              = Spellcaster / Effect
  | level              = 6
  | atk                = 2500
  | def                = 0
  | text               = You can Tribute this card from your hand or field; add 1 "Witchcrafter" Field or Continuous Spell from your Deck to your hand. If a face-up "Witchcrafter" monster(s) you control leaves the field by an opponent's card effect, while this card is in your GY (except during the Damage Step): You can Special Summon this card (but banish it when it leaves the field), and if you do, Tribute 1 monster your opponent controls. You can only use each effect of "Witchcrafter Marka" once per turn.

  | fr_name            = Marka, Artisanesorcière
  | fr_text            = Vous pouvez Sacrifier cette carte depuis votre main ou Terrain ; ajoutez 1 Magie de Terrain ou Continue "Artisanesorcière" depuis votre Deck à votre main. Si un ou plusieurs monstres "Artisanesorcière" face recto que vous contrôlez quittent le Terrain par un effet de carte de l'adversaire, tant que cette carte est dans votre Cimetière (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte (mais bannissez-la lorsqu'elle quitte le Terrain), et si vous le faites, Sacrifiez 1 monstre contrôlé par votre adversaire. Vous ne pouvez utiliser chaque effet de "Marka, Artisanesorcière" qu'une fois par tour.
  | de_name            = Hexwerkerin Marka
  | de_text            = Du kannst diese Karte von deiner Hand oder Spielfeldseite als Tribut anbieten; füge deiner Hand 1 „Hexwerker“-Spielfeldzauber oder Permanenten „Hexwerker“-Zauber von deinem Deck hinzu. Falls ein oder mehr offene „Hexwerker“-Monster, die du kontrollierst, das Spielfeld durch einen Karteneffekt eines Gegners verlassen, solange sich diese Karte in deinem Friedhof befindet (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung beschwören (aber verbanne sie, wenn sie das Spielfeld verlässt) und falls du dies tust, biete 1 Monster, das dein Gegner kontrolliert, als Tribut an. Du kannst jeden Effekt von „Hexwerkerin Marka“ nur einmal pro Spielzug verwenden.
  | it_name            = Stregartigiana Marka
  | it_text            = Puoi offrire come Tributo questa carta dalla tua mano o Terreno; aggiungi 1 Magia Terreno o Continua "Stregartigiana" dal tuo Deck alla tua mano. Se uno o più mostri "Stregartigiana" scoperti che controlli lasciano il Terreno per l'effetto di una carta dell'avversario, mentre questa carta è nel tuo Cimitero (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta (ma bandiscila quando lascia il Terreno) e, se lo fai, offri come Tributo 1 mostro controllato dal tuo avversario. Puoi utilizzare ogni effetto di "Stregartigiana Marka" una sola volta per turno.
  | pt_name            = Fazticeira Marca
  | pt_text            = Você pode oferecer este card como Tributo da sua mão ou do campo; adicione 1 Magia de Campo ou Contínua "Fazticeira" do seu Deck à sua mão. Se um ou mais monstros "Fazticeira" com a face para cima que você controla deixarem o campo por um efeito de card do oponente, enquanto este card estiver no seu Cemitério (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial (mas bana-o quando ele deixar o campo) e, se isso acontecer, ofereça como Tributo 1 monstro que seu oponente controla. Você só pode usar cada efeito de "Fazticeira Marca" uma vez por turno.
  | es_name            = Marka Artibruja
  | es_text            = Puedes Sacrificar esta carta en tu mano o Campo; añade a tu mano 1 Mágica de Campo o Continua "Artibruja" en tu Deck. Si uno o más monstruos "Artibruja" boca arriba que controlas dejan el Campo por el efecto de una carta del adversario, mientras esta carta está en tu Cementerio (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial (pero destiérrala cuando deje el Campo) y, si lo haces, Sacrifica 1 monstruo que controle tu adversario. Sólo puedes usar cada efecto de "Marka Artibruja" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：手札・フィールドのこのカードをリリースして発動できる。デッキから「ウィッチクラフト」フィールド・永続魔法カード１枚を手札に加える。<br />②：このカードが墓地に存在する状態で、自分フィールドの表側表示の「ウィッチクラフト」モンスターが相手の効果でフィールドから離れた場合に発動できる。このカードを特殊召喚し、相手フィールドのモンスター１体をリリースする。この効果で特殊召喚したこのカードは、フィールドから離れた場合に除外される。
  | ko_name            = 위치크래프트 마르카
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 패 / 필드의 이 카드를 릴리스하고 발동할 수 있다. 덱에서 "위치크래프트" 필드 / 지속 마법 카드 1장을 패에 넣는다.<br />②: 이 카드가 묘지에 존재하는 상태에서, 자신 필드의 앞면 표시의 "위치크래프트" 몬스터가 상대 효과로 필드에서 벗어났을 경우에 발동할 수 있다. 이 카드를 특수 소환하고, 상대 필드의 몬스터 1장을 릴리스한다. 이 효과로 특수 소환한 이 카드는, 필드에서 벗어났을 경우에 제외된다.
  | tc_name            = 魔女工藝・書匠瑪爾卡
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：解放手牌・場上的此卡可以發動。從牌組將1張「魔女工藝」場地・永續魔法卡加入手牌。<br />②：此卡存在於墓地的狀態下，自己場上表側表示的「魔女工藝」怪獸因對手的效果從場上離開的情況下可以發動。將此卡特殊召喚，將對手場上1隻怪獸解放。以此效果特殊召喚的此卡從場上離開的情況下，將其除外。
  | sc_name            = 魔女工艺・书匠玛尔卡
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：解放手牌・场上的此卡可以发动。从牌组将1张“魔女工艺”场地・永续魔法卡加入手牌。<br />②：此卡存在于墓地的状态下，自己场上表侧表示的“魔女工艺”怪兽因对手的效果从场上离开的情况下可以发动。将此卡特殊召唤，将对手场上1只怪兽解放。以此效果特殊召唤的此卡从场上离开的情况下，将其除外。
  }}
