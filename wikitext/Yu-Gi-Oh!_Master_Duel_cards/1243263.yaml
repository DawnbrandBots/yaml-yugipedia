title: Black Rose Dragon/Assault Mode (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = FIRE
  | types              = Dragon / Effect
  | level              = 9
  | atk                = 2900
  | def                = 2300
  | text               = Cannot be Normal Summoned/Set. Must be Special Summoned with "Assault Mode Activate". If this card is destroyed: You can Special Summon 1 "Black Rose Dragon" from your GY. You can only use each of the following effects of "Black Rose Dragon/Assault Mode" once per turn. You can reveal this card in your hand; shuffle it into the Deck, and if you do, change the ATK of 1 monster on the field to 0. If this card is Special Summoned, or if a monster(s) is Special Summoned to your opponent's field: You can destroy all cards on the field.

  | fr_name            = Dragon Rose Noire/Mode Assaut
  | fr_text            = Ni Invocable Normalement ni Posable Normalement. Uniquement Invocable Spécialement avec "Activation Mode Assaut". Si cette carte est détruite : vous pouvez Invoquer Spécialement 1 "Dragon Rose Noire" depuis votre Cimetière. Vous ne pouvez utiliser chacun des effets suivants de "Dragon Rose Noire/Mode Assaut" qu'une fois par tour. Vous pouvez révéler cette carte dans votre main ; mélangez-la dans le Deck, et si vous le faites, changez à 0 l'ATK d'1 monstre sur le Terrain. Si cette carte est Invoquée Spécialement, ou si un ou plusieurs monstres sont Invoqués Spécialement sur le Terrain de votre adversaire : vous pouvez détruire toutes les cartes sur le Terrain.
  | de_name            = Schwarzer Rosendrache/Angriffsmodus
  | de_text            = Kann nicht als Normalbeschwörung beschworen/gesetzt werden. Muss durch „Angriffsmodus aktivieren“ als Spezialbeschwörung beschworen werden. Falls diese Karte zerstört wird: Du kannst 1 „Schwarzer Rosendrache“ als Spezialbeschwörung von deinem Friedhof beschwören. Du kannst jeden der folgenden Effekte von „Schwarzer Rosendrache/Angriffsmodus“ nur einmal pro Spielzug verwenden. Du kannst diese Karte in deiner Hand vorzeigen; mische sie ins Deck und falls du dies tust, ändere die ATK von 1 Monster auf dem Spielfeld zu 0. Falls diese Karte als Spezialbeschwörung beschworen wird oder falls ein oder mehr Monster als Spezialbeschwörung auf die Spielfeldseite deines Gegners beschworen werden: Du kannst alle Karten auf dem Spielfeld zerstören.
  | it_name            = Drago Rosa Nera/Assalto
  | it_text            = Non può essere Evocato Normalmente/Posizionato. Deve essere Evocato Specialmente con "Attivazione Modalità Assalto". Se questa carta viene distrutta: puoi Evocare Specialmente 1 "Drago Rosa Nera" dal tuo Cimitero. Puoi utilizzare ognuno dei seguenti effetti di "Drago Rosa Nera/Assalto" una sola volta per turno. Puoi rivelare questa carta nella tua mano; mischiala nel Deck e, se lo fai, cambia l'ATK di 1 mostro sul Terreno a 0. Se questa carta viene Evocata Specialmente, o se uno o più mostri vengono Evocati Specialmente sul Terreno del tuo avversario: puoi distruggere tutte le carte sul Terreno.
  | pt_name            = Dragão da Rosa Negra/Modo de Ataque
  | pt_text            = Não pode ser Invocado por Invocação-Normal/Baixado. Deve ser Invocado por Invocação-Especial com "Ativar Modo de Ataque". Se este card for destruído: você pode Invocar por Invocação-Especial 1 "Dragão da Rosa Negra" do seu Cemitério. Você só pode usar cada um dos seguintes efeitos de "Dragão da Rosa Negra/Modo de Ataque" uma vez por turno. Você pode revelar este card na sua mão; embaralhe-o no Deck e, se isso acontecer, mude o ATK de 1 monstro no campo para 0. Se este card for Invocado por Invocação-Especial, ou se um ou mais monstros forem Invocados por Invocação-Especial no campo do seu oponente: você pode destruir todos os cards no campo.
  | es_name            = Dragón de la Rosa Negra/Modo de Ataque
  | es_text            = No puede ser Invocado de Modo Normal/Colocado. Debe ser Invocado de Modo Especial con "Activar Modo de Ataque". Si esta carta es destruida: puedes Invocar de Modo Especial 1 "Dragón de la Rosa Negra" desde tu Cementerio. Sólo puedes usar cada uno de los siguientes efectos de "Dragón de la Rosa Negra/Modo de Ataque" una vez por turno. Puedes mostrar esta carta en tu mano; barájala al Deck y, si lo haces, cambia a 0 el ATK de 1 monstruo en el Campo. Si esta carta es Invocada de Modo Especial, o si uno o más monstruos son Invocados de Modo Especial al Campo de tu adversario: puedes destruir todas las cartas en el Campo.
  | ja_text            = このカードは通常召喚できず、「バスター・モード」の効果でのみ特殊召喚できる。<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：手札のこのカードを相手に見せて発動できる。このカードをデッキに戻し、フィールドのモンスター１体の攻撃力を０にする。<br />②：このカードが特殊召喚した場合、または相手フィールドにモンスターが特殊召喚された場合に発動できる。フィールドのカードを全て破壊する。<br />③：このカードが破壊された場合に発動できる。自分の墓地から「ブラック・ローズ・ドラゴン」１体を特殊召喚する。
  | ko_name            = 블랙 로즈 드래곤 / 버스터
  | ko_text            = 이 카드는 통상 소환할 수 없으며, "버스터 모드"의 효과로만 특수 소환할 수 있다.<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 패의 이 카드를 상대에게 보여주고 발동할 수 있다. 이 카드를 덱으로 되돌리고, 필드의 몬스터 1장의 공격력을 0 으로 한다.<br />②: 이 카드를 특수 소환했을 경우, 또는 상대 필드에 몬스터가 특수 소환되었을 경우에 발동할 수 있다. 필드의 카드를 전부 파괴한다.<br />③: 이 카드가 파괴되었을 경우에 발동할 수 있다. 자신 묘지에서 "블랙 로즈 드래곤" 1장을 특수 소환한다.
  | tc_name            = 黑薔薇龍／爆裂
  | tc_text            = 此卡不可通常召喚，僅可透過「爆裂模式」的效果特殊召喚。<br />此卡名的①②效果1回合僅可各使用1次。<br />①：向對手出示手牌的此卡可以發動。將此卡放回牌組，將場上的1隻怪獸的攻擊力改成0。<br />②：此卡特殊召喚的情況下，或有怪獸被特殊召喚至對手場上的情況下可以發動。將場上的卡全部破壞。<br />③：此卡被破壞的情況下可以發動。從自己墓地將1隻「黑薔薇龍」特殊召喚。
  | sc_name            = 黑蔷薇龙／爆裂
  | sc_text            = 此卡不可通常召唤，仅可通过“爆裂模式”的效果特殊召唤。<br />此卡名的①②效果1回合仅可各使用1次。<br />①：向对手出示手牌的此卡可以发动。将此卡放回牌组，将场上的1只怪兽的攻击力改成0。<br />②：此卡特殊召唤的情况下，或有怪兽被特殊召唤至对手场上的情况下可以发动。将场上的卡全部破坏。<br />③：此卡被破坏的情况下可以发动。从自己墓地将1只“黑蔷薇龙”特殊召唤。
  }}
