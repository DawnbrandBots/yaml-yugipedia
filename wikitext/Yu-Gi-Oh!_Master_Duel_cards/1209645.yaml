title: GMX Suppression Squad (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = N
  | attribute          = WIND
  | types              = Beast-Warrior / Effect
  | level              = 4
  | atk                = 1900
  | def                = 0
  | text               = If this card is in your hand and you control a "GMX" monster or a Dinosaur monster: You can Special Summon this card. You can target 1 face-up monster on the field; excavate the top cards of your Deck until you excavate a Dinosaur monster, send that Dinosaur monster to the GY, and if you do, the targeted monster becomes a Dinosaur monster (until the end of this turn), also shuffle the rest into the Deck. You can only use each effect of "GMX Suppression Squad" once per turn.

  | fr_name            = Escouade de Dissimulation GMX
  | fr_text            = Si cette carte est dans votre main et que vous contrôlez un monstre "GMX" ou un monstre Dinosaure : vous pouvez Invoquer Spécialement cette carte. Vous pouvez cibler 1 monstre face recto sur le Terrain ; dévoilez les cartes du dessus de votre Deck jusqu'à dévoiler un monstre Dinosaure, envoyez le monstre Dinosaure au Cimetière, et si vous le faites, le monstre ciblé devient un monstre Dinosaure (jusqu'à la fin de ce tour), et aussi, mélangez les cartes restantes dans le Deck. Vous ne pouvez utiliser chaque effet de "Escouade de Dissimulation GMX" qu'une fois par tour.
  | de_name            = GMX-Kampftrupp
  | de_text            = Falls sich diese Karte in deiner Hand befindet und du ein „GMX“-Monster oder ein Dinosaurier-Monster kontrollierst: Du kannst diese Karte als Spezialbeschwörung beschwören. Du kannst 1 offenes Monster auf dem Spielfeld wählen; grabe die obersten Karten deines Decks aus, bis du ein Dinosaurier-Monster ausgräbst, lege jenes Dinosaurier-Monster auf den Friedhof und falls du dies tust, wird das als Ziel gewählte Monster (bis zum Ende dieses Spielzugs) zu einem Dinosaurier-Monster, zusätzlich mische die restlichen ins Deck. Du kannst jeden Effekt von „GMX-Kampftrupp“ nur einmal pro Spielzug verwenden.
  | it_name            = GMX Squadra di Soppressione
  | it_text            = Se questa carta è nella tua mano e tu controlli un mostro "GMX" o un mostro Dinosauro: puoi Evocare Specialmente questa carta. Puoi scegliere come bersaglio 1 mostro scoperto sul Terreno; dissotterra carte dalla cima del tuo Deck fino a quando dissotterri un mostro Dinosauro, manda quel mostro Dinosauro al Cimitero e, se lo fai, il mostro scelto come bersaglio diventa un mostro Dinosauro (fino alla fine di questo turno), inoltre mischia il resto nel Deck. Puoi utilizzare ogni effetto di "GMX Squadra di Soppressione" una sola volta per turno.
  | pt_name            = Esquadrão de Supressão da GMX
  | pt_text            = Se este card estiver na sua mão e você controlar um monstro "GMX" ou um monstro Dinossauro: você pode Invocar este card por Invocação-Especial. Você pode escolher 1 monstro com a face para cima no campo; escave cards do topo do seu Deck até escavar um monstro Dinossauro, envie esse monstro Dinossauro para o Cemitério e, se isso acontecer, o monstro alvo se torna um monstro Dinossauro (até o final deste turno) e, além disso, embaralhe o resto no Deck. Você só pode usar cada efeito de "Esquadrão de Supressão da GMX" uma vez por turno.
  | es_name            = Escuadrón de Supresión de GMX
  | es_text            = Si esta carta está en tu mano y controlas un monstruo "GMX" o un monstruo Dinosaurio: puedes Invocar esta carta de Modo Especial. Puedes seleccionar 1 monstruo boca arriba en el Campo; excava las cartas de la parte superior de tu Deck hasta que excaves un monstruo Dinosaurio, manda al Cementerio ese monstruo Dinosaurio y, si lo haces, el monstruo seleccionado se convierte en un monstruo Dinosaurio (hasta el final de este turno), y además baraja el resto al Deck. Sólo puedes usar cada efecto de "Escuadrón de Supresión de GMX" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが手札に存在し、「ＧＭＸ」モンスターか恐竜族モンスターが自分フィールドに存在する場合に発動できる。このカードを特殊召喚する。<br />②：フィールドの表側表示モンスター１体を対象として発動できる。恐竜族モンスターが出るまで自分のデッキの上からカードをめくり、その恐竜族モンスターを墓地へ送り、対象のモンスターの種族をターン終了時まで恐竜族にする。残りのめくったカードをデッキに戻す。
  | ko_name            = GMX 진압부대 아프트
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드가 패에 존재하고, "GMX(제노믹스)" 몬스터나 공룡족 몬스터가 자신 필드에 존재할 경우에 발동할 수 있다. 이 카드를 특수 소환한다.<br />②: 필드의 앞면 표시 몬스터 1장을 대상으로 하고 발동할 수 있다. 공룡족 몬스터가 나올 때까지 자신의 덱 위에서 카드를 넘기고, 그 공룡족 몬스터를 묘지로 보내고, 대상 몬스터의 종족을 턴 종료시까지 공룡족으로 한다. 남은 넘긴 카드를 덱으로 되돌린다.
  | tc_name            = GMX鎮壓部隊 阿普特
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：此卡存在於手牌，且自己場上存在「GMX」怪獸或恐龍族怪獸的情況下可以發動。將此卡特殊召喚。<br />②：以場上的1隻表側表示怪獸為對象可以發動。從自己牌組上面翻開卡，直至翻到恐龍族怪獸為止，將該恐龍族怪獸送至墓地，將對象怪獸的種族直至回合結束時為止改成恐龍族。將剩餘的所翻開的卡放回牌組。
  | sc_name            = GMX镇压部队 阿普特
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：此卡存在于手牌，且自己场上存在“GMX”怪兽或恐龙族怪兽的情况下可以发动。将此卡特殊召唤。<br />②：以场上的1只表侧表示怪兽为对象可以发动。从自己牌组上面翻开卡，直至翻到恐龙族怪兽为止，将该恐龙族怪兽送至墓地，将对象怪兽的种族直至回合结束时为止改成恐龙族。将剩余的所翻开的卡放回牌组。
  }}
