  | fr_name   = Nécromancien Enfernité
  | fr_text   = Si cette carte est Invoquée Normalement : changez cette carte en Position de Défense. Une fois par tour, si vous n'avez aucune carte dans votre main : vous pouvez cibler 1 monstre "Enfernité" ("Nécromancien Enfernité" exclu) dans votre Cimetière ; Invoquez-le Spécialement.
  | de_name   = Ewig infernaler Totenbeschwörer
  | de_text   = Falls diese Karte als Normalbeschwörung beschworen wird: Ändere diese Karte in die Verteidigungsposition. Einmal pro Spielzug, falls du keine Karten in deiner Hand hast: Du kannst 1 „Ewig infernal“-Monster in deinem Friedhof wählen, außer „Ewig infernaler Totenbeschwörer“; beschwöre es als Spezialbeschwörung.
  | it_name   = Necromante Demoneterno
  | it_text   = Se questa carta viene Evocata Normalmente: metti questa carta in Posizione di Difesa. Una volta per turno, se non hai nessuna carta nella tua mano: puoi scegliere come bersaglio 1 mostro "Demoneterno" nel tuo Cimitero, eccetto "Necromante Demoneterno"; Evocalo Specialmente.
  | pt_name   = Necromante Inférnico
  | pt_text   = Se este card for Invocado por Invocação-Normal: coloque este card em Posição de Defesa. Uma vez por turno, se você não tiver cards na sua mão: você pode escolher 1 monstro "Inférnico(a)" no seu Cemitério, exceto "Necromante Inférnico"; Invoque-o por Invocação-Especial.
  | es_name   = Nigromante Inférnico
  | es_text   = Si esta carta es Invocada de Modo Normal: cambia esta carta a Posición de Defensa. Una vez por turno, si no tienes cartas en tu mano: puedes seleccionar 1 monstruo "Inférnico/a" en tu Cementerio, excepto "Nigromante Inférnico"; Invócalo de Modo Especial.
  | ja_text   = ①：このカードが召喚した場合に発動する。このカードを守備表示にする。<br />②：１ターンに１度、自分の手札が０枚の場合、「インフェルニティ・ネクロマンサー」以外の自分の墓地の「インフェルニティ」モンスター１体を対象として発動できる。そのモンスターを特殊召喚する。
  | ko_name   = 인페르니티 네크로맨서
  | ko_text   = ①: 이 카드를 일반 소환했을 경우에 발동한다. 이 카드를 수비 표시로 한다.<br />②: 1턴에 1번, 자신의 패가 0장일 경우, "인페르니티 네크로맨서" 이외의 자신 묘지의 "인페르니티" 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 특수 소환한다.
  | tc_name   = 無限獄死靈師
  | tc_text   = 此卡召喚成功時，變為守備表示。此外，１回合１次，在我方手牌為0張的狀況下，可選擇我方墓地的１隻「無限獄死靈師」以外的冠有「無限獄」之名的怪獸發動。可特殊召喚選擇的怪獸。
  | sc_name   = 无限狱死灵师
  | sc_text   = 此卡召唤成功时，变成守备表示。此外，１回合１次，我方手牌是０张的场合，可选择我方墓地１只除“无限狱死灵师”以外冠有“无限狱”之名的怪兽并发动。可特殊召唤被选择怪兽。
