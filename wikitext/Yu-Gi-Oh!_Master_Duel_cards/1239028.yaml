  | text               = 2 Level 9 monsters<br />Once per turn, you can also Xyz Summon "Galaxy-Eyes Antimatter Dragon" by using 1 Xyz Monster you control with 3 or more materials (transfer its materials). Any battle damage this card inflicts to your opponent while it has material is halved. You can detach 1 material from this card; it can make up to 2 attacks on monsters during each Battle Phase this turn, then if the detached material was a monster, you can send 1 monster with the same Type as that monster from your Deck to the GY.

  | fr_name            = Dragon Antimatière aux Yeux Galactiques
  | fr_text            = 2 monstres de Niveau 9<br />Une fois par tour, vous pouvez aussi Invoquer par Xyz "Dragon Antimatière aux Yeux Galactiques" en utilisant 1 Monstre Xyz que vous contrôlez avec min. 3 Matériels (transférez ses Matériels). Les dommages de combat infligés par cette carte à votre adversaire tant qu'elle a du Matériel sont divisés par deux. Vous pouvez détacher 1 Matériel de cette carte ; elle peut faire max. 2 attaques sur des monstres durant chaque Battle Phase ce tour, puis si le Matériel détaché était un monstre, vous pouvez envoyer 1 monstre du même Type que le monstre depuis votre Deck au Cimetière.
  | de_name            = Galaxieaugen-Antimateriedrache
  | de_text            = 2 Monster der Stufe 9<br />Einmal pro Spielzug kannst du „Galaxieaugen-Antimateriedrache“ auch als Xyz-Beschwörung beschwören, indem du 1 Xyz-Monster mit 3 oder mehr Material verwendest, das du kontrollierst (transferiere sein Material). Kampfschaden, den diese Karte deinem Gegner zufügt, solange sie Material hat, wird halbiert. Du kannst 1 Material von dieser Karte abhängen; sie kann in diesem Spielzug während jeder Battle Phase bis zu 2 Angriffe auf Monster durchführen, dann, falls das abgehängte Material ein Monster war, kannst du 1 Monster mit demselben Typ wie jenes Monster von deinem Deck auf den Friedhof legen.
  | it_name            = Drago Antimateria Occhi Galattici
  | it_text            = 2 mostri di Livello 9<br />Una volta per turno, puoi anche Evocare Xyz "Drago Antimateria Occhi Galattici" utilizzando 1 Mostro Xyz che controlli con 3 o più materiali (trasferisci i suoi materiali). Qualsiasi danno da combattimento che questa carta infligge al tuo avversario mentre ha materiale viene dimezzato. Puoi staccare 1 materiale da questa carta; essa può effettuare fino a 2 attacchi su mostri durante ogni Battle Phase in questo turno, poi se il materiale staccato era un mostro, puoi mandare 1 mostro con lo stesso Tipo di quel mostro dal tuo Deck al Cimitero.
  | pt_name            = Dragão da Antimatéria de Olhos das Galáxias
  | pt_text            = 2 monstros de Nível 9<br />Uma vez por turno, você também pode Invocar "Dragão da Antimatéria de Olhos das Galáxias" por Invocação-Xyz ao usar 1 Monstro Xyz que você controla com 3 ou mais matérias (transfira as matérias dele). Qualquer dano de batalha que este card causar ao seu oponente enquanto tiver matérias é diminuído pela metade. Você pode desassociar 1 matéria deste card; ele pode realizar até 2 ataques contra monstros durante cada Fase de Batalha neste turno e, depois, se a matéria desassociada era um monstro, você pode enviar 1 monstro com o mesmo Tipo que o desse monstro do seu Deck para o Cemitério.
  | es_name            = Dragón de Antimateria de Ojos Galácticos
  | es_text            = 2 monstruos de Nivel 9<br />Una vez por turno, también puedes Invocar Xyz "Dragón de Antimateria de Ojos Galácticos" usando 1 Monstruo Xyz que controles con 3 o más materiales (transfiere sus materiales). Cualquier daño de batalla que esta carta inflija a tu adversario mientras tenga material se divide a la mitad. Puedes desacoplar 1 material de esta carta; ésta puede hacer hasta 2 ataques a monstruos durante cada Battle Phase este turno y después, si el material desacoplado era un monstruo, puedes mandar al Cementerio 1 monstruo en tu Deck con el mismo Tipo que ese monstruo.
  | ja_text            = レベル９モンスター×２<br />「ギャラクシーアイズ・アンチマター・ドラゴン」は１ターンに１度、Ｘ素材を３つ以上持っている自分のＸモンスターの上に重ねてＸ召喚する事もできる。<br />①：Ｘ素材を持っているこのカードが相手に与える戦闘ダメージは半分になる。<br />②：このカードのＸ素材を１つ取り除いて発動できる。このターン、このカードは１度のバトルフェイズ中に２回までモンスターに攻撃できる。取り除いたＸ素材がモンスターだった場合、さらにそのモンスターと同じ種族のモンスター１体をデッキから墓地へ送る事ができる。
  | ko_name            = 갤럭시아이즈 안티매터 드래곤
  | ko_text            = 레벨 9 몬스터 × 2<br />"갤럭시아이즈 안티매터 드래곤"은 1턴에 1번, 엑시즈 소재를 3개 이상 가지고 있는 자신의 엑시즈 몬스터 위에 겹쳐 엑시즈 소환할 수도 있다.<br />①: 엑시즈 소재를 가지고 있는 이 카드가 상대에게 주는 전투 데미지는 절반이 된다.<br />②: 이 카드의 엑시즈 소재를 1개 제거하고 발동할 수 있다. 이 턴에, 이 카드는 1번의 배틀 페이즈 중에 2회까지 몬스터에 공격할 수 있다. 제거한 엑시즈 소재가 몬스터였을 경우, 추가로 그 몬스터와 같은 종족의 몬스터 1장을 덱에서 묘지로 보낼 수 있다.
  | tc_name            = 銀河眼反物質龍
  | tc_text            = 等級9怪獸×2<br />「銀河眼反物質龍」1回合1次，也可重疊在持有3個以上超量素材的、自己的超量怪獸上面來超量召喚。<br />①：持有超量素材的此卡給予對手的戰鬥傷害變為一半。<br />②：去除此卡的1個超量素材可以發動。此回合，此卡在1次戰鬥階段中最多可攻擊怪獸2次。去除的超量素材為怪獸的情況下，進而可從牌組將1隻與該怪獸種族相同的怪獸送至墓地。
  | sc_name            = 银河眼反物质龙
  | sc_text            = 等级9怪兽×2<br />“银河眼反物质龙”1回合1次，也可重叠在持有3个以上超量素材的、自己的超量怪兽上面来超量召唤。<br />①：持有超量素材的此卡给予对手的战斗伤害变为一半。<br />②：去除此卡的1个超量素材可以发动。此回合，此卡在1次战斗阶段中最多可攻击怪兽2次。去除的超量素材为怪兽的情况下，进而可从牌组将1只与该怪兽种族相同的怪兽送至墓地。
  }}
