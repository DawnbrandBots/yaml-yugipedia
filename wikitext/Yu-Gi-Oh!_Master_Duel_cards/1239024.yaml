title: Lightning Crash (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = UR
  | card_type          = Spell
  | property           = Normal
  | text               = Add 1 Thunder monster from your Deck to your hand, but you cannot Normal Summon/Set monsters with that name until the end of the next turn after this card resolves. You can only activate 1 "Lightning Crash" per turn.

