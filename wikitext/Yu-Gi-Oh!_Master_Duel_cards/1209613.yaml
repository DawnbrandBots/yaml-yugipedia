title: GMX - VELOX (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = UR
  | attribute          = DARK
  | types              = Dinosaur / Fusion / Effect
  | level              = 8
  | atk                = 2700
  | def                = 1300
  | text               = 1 "GMX" monster + 1 Dinosaur monster<br />Each time your opponent Normal or Special Summons a monster(s), gain 200 LP. During your opponent's turn (Quick Effect): You can target 1 card your opponent controls; excavate the top cards of your Deck until you excavate a "GMX" monster or a Dinosaur monster, lose 400 LP for each excavated card, add that "GMX" or Dinosaur monster to your hand or Special Summon it, and shuffle the rest into the Deck. Also, after that, destroy the targeted card. You can only use this effect of "GMX - VELOX" once per turn.

  | fr_name            = GMX - VELOX
  | fr_text            = 1 monstre "GMX" + 1 monstre Dinosaure<br />Chaque fois que votre adversaire Invoque Normalement ou Spécialement un ou plusieurs monstres, gagnez 200 LP. Durant le tour de votre adversaire (Effet Rapide) : vous pouvez cibler 1 carte contrôlée par votre adversaire ; dévoilez les cartes du dessus de votre Deck jusqu'à dévoiler un monstre "GMX" ou un monstre Dinosaure, perdez 400 LP pour chaque carte dévoilée, ajoutez le monstre "GMX" ou Dinosaure à votre main ou Invoquez-le Spécialement, et mélangez les cartes restantes dans le Deck. Et aussi, après ça, détruisez la carte ciblée. Vous ne pouvez utiliser cet effet de "GMX - VELOX" qu'une fois par tour.
  | de_name            = GMX - VELOX
  | de_text            = 1 „GMX“-Monster + 1 Dinosaurier-Monster<br />Jedes Mal, wenn dein Gegner ein oder mehr Monster als Normal- oder Spezialbeschwörung beschwört, erhältst du 200 LP. Während des Spielzugs deines Gegners (Schnelleffekt): Du kannst 1 Karte wählen, die dein Gegner kontrolliert; grabe die obersten Karten deines Decks aus, bis du ein „GMX“-Monster oder ein Dinosaurier-Monster ausgräbst, du verlierst für jede ausgegrabene Karte 400 LP, füge jenes „GMX“- oder Dinosaurier-Monster deiner Hand hinzu oder beschwöre es als Spezialbeschwörung und mische den Rest ins Deck. Zusätzlich, danach, zerstöre die als Ziel gewählte Karte. Du kannst diesen Effekt von „GMX - VELOX“ nur einmal pro Spielzug verwenden.
  | it_name            = GMX - VELOX
  | it_text            = 1 mostro "GMX" + 1 mostro Dinosauro<br />Ogni volta che il tuo avversario Evoca Normalmente o Specialmente uno o più mostri, guadagni 200 LP. Durante il turno del tuo avversario (Effetto Rapido): puoi scegliere come bersaglio 1 carta controllata dal tuo avversario; dissotterra carte dalla cima del tuo Deck fino a quando dissotterri un mostro "GMX" o un mostro Dinosauro, perdi 400 LP per ogni carta dissotterrata, aggiungi quel mostro "GMX" o Dinosauro alla tua mano o Evocalo Specialmente e mischia il resto nel Deck. Inoltre, dopo averlo fatto, distruggi la carta scelta come bersaglio. Puoi utilizzare questo effetto di "GMX - VELOX" una sola volta per turno.
  | pt_name            = GMX - VELOX
  | pt_text            = 1 monstro "GMX" + 1 monstro Dinossauro<br />Sempre que seu oponente Invocar um ou mais monstros por Invocação-Normal ou Especial, ganhe 200 PV. Durante o turno do seu oponente (Efeito Rápido): você pode escolher 1 card que seu oponente controla; escave cards do topo do seu Deck até escavar um monstro "GMX" ou um monstro Dinossauro, perca 400 PV para cada card escavado, adicione esse monstro "GMX" ou Dinossauro à sua mão ou Invoque-o por Invocação-Especial e embaralhe o resto no Deck. Além disso, depois, destrua o card alvo. Você só pode usar este efeito de "GMX - VELOX" uma vez por turno.
  | es_name            = GMX - VELOX
  | es_text            = 1 monstruo "GMX" + 1 monstruo Dinosaurio<br />Cada vez que tu adversario Invoca de Modo Normal o Especial uno o más monstruos, ganas 200 LP. Durante el turno de tu adversario (Efecto Rápido): puedes seleccionar 1 carta que controle tu adversario; excava las cartas de la parte superior de tu Deck hasta que excaves un monstruo "GMX" o un monstruo Dinosaurio, pierdes 400 LP por cada carta excavada, añade a tu mano o Invoca de Modo Especial ese monstruo "GMX" o Dinosaurio, y baraja el resto al Deck. Además, después de eso, destruye la carta seleccionada. Sólo puedes usar este efecto de "GMX - VELOX" una vez por turno.
  | ja_text            = 「ＧＭＸ」モンスター＋恐竜族モンスター<br />このカード名の②の効果は１ターンに１度しか使用できない。<br />①：相手がモンスターを召喚・特殊召喚する度に、自分は２００ＬＰ回復する。<br />②：相手ターンに、相手フィールドのカード１枚を対象として発動できる。以下の効果を全て適用する。<br />●「ＧＭＸ」モンスターか恐竜族モンスターが出るまで自分のデッキの上からカードをめくり、自分はめくった数×４００ＬＰを失う。そのモンスターを手札に加えるか特殊召喚する。残りをデッキに戻す。<br />●対象のカードを破壊する。
  | ko_name            = GMX－VELOX
  | ko_text            = "GMX(제노믹스)" 몬스터 ＋ 공룡족 몬스터<br />이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 상대가 몬스터를 일반 소환 / 특수 소환할 때마다, 자신은 200 LP 회복한다.<br />②: 상대 턴에, 상대 필드의 카드 1장을 대상으로 하고 발동할 수 있다. 이하의 효과를 전부 적용한다.<br />●"GMX(제노믹스)" 몬스터나 공룡족 몬스터가 나올 때까지 자신의 덱 위에서 카드를 넘기고, 자신은 넘긴 수 × 400 LP를 상실한다. 그 몬스터를 패에 넣거나 특수 소환한다. 나머지를 덱으로 되돌린다.<br />●대상의 카드를 파괴한다.
  | tc_name            = GMX－伶盜種VELOX
  | tc_text            = 「GMX」怪獸＋恐龍族怪獸<br />此卡名的②效果1回合僅可使用1次。<br />①：每當對手將怪獸召喚・特殊召喚，自己就回復200LP。<br />②：在對手回合中，以對手場上的1張卡為對象可以發動。適用以下所有效果。<br />●從自己牌組上面翻開卡，直至翻到「GMX」怪獸或恐龍族怪獸為止，自己失去所翻開的數量×400的LP。將該怪獸加入手牌或特殊召喚。將剩餘的放回牌組。<br />●將對象卡破壞。
  | sc_name            = GMX－伶盗种VELOX
  | sc_text            = “GMX”怪兽＋恐龙族怪兽<br />此卡名的②效果1回合仅可使用1次。<br />①：每当对手将怪兽召唤・特殊召唤，自己就恢复200LP。<br />②：在对手回合中，以对手场上的1张卡为对象可以发动。适用以下所有效果。<br />●从自己牌组上面翻开卡，直至翻到“GMX”怪兽或恐龙族怪兽为止，自己失去所翻开的数量×400的LP。将该怪兽加入手牌或特殊召唤。将剩余的放回牌组。<br />●将对象卡破坏。
  }}
