  | text      = 3 Level 7 monsters<br />If you activate either of this card's effects, your opponent takes no further damage this turn (this is not an effect). Once per turn: You can target 1 monster your opponent controls; equip that target to this card as an Equip Spell that gives it 1000 ATK. If this card has "Number 6: Chronomaly Atlandis" as material: You can detach 3 materials from this card, and send all face-up "Number" Monster Cards you control equipped to this card by its effect to the GY (min. 1); make your opponent's LP 100.

  | fr_name   = Numéro C6 : Atlandis du Chaos Chronomal
  | fr_text   = 3 monstres de Niveau 7<br />Si vous activez un effet de cette carte, votre adversaire ne reçoit pas de dommages complémentaires ce tour (ceci n'est pas un effet). Une fois par tour : vous pouvez cibler 1 monstre contrôlé par votre adversaire ; équipez la cible à cette carte comme Magie d'Équipement qui lui donne 1000 ATK. Si cette carte a "Numéro 6 : Atlandis Chronomal" comme Matériel : vous pouvez détacher 3 Matériels de cette carte, et envoyez toutes les Cartes Monstre "Numéro" face recto que vous contrôlez équipées à cette carte par son effet au Cimetière (min. 1) ; faites devenir 100 les LP de votre adversaire.
  | de_name   = Nummer C6: Chronomales Chaos-Atlandis
  | de_text   = 3 Monster der Stufe 7<br />Falls du einen der Effekte dieser Karte aktivierst, erhält dein Gegner in diesem Spielzug keinen weiteren Schaden (dies ist kein Effekt). Einmal pro Spielzug: Du kannst 1 Monster wählen, das dein Gegner kontrolliert; rüste diese Karte mit jenem gewählten Ziel als Ausrüstungszauber aus, der ihr 1000 ATK gibt. Falls diese Karte „Nummer 6: Chronomales Atlandis“ als Material hat: Du kannst 3 Material von dieser Karte abhängen und alle offenen „Nummer“-Monsterkarten, die du kontrollierst und die diese Karte durch ihren Effekt ausrüsten, auf den Friedhof legen (min. 1); die LP deines Gegners werden zu 100.
  | it_name   = Numero C6: Cronomalia Chaos Atlandis
  | it_text   = 3 mostri di Livello 7<br />Se attivi uno dei due effetti di questa carta, il tuo avversario non subisce ulteriori danni in questo turno (questo non è un effetto). Una volta per turno: puoi scegliere come bersaglio 1 mostro controllato dal tuo avversario; equipaggia quel bersaglio a questa carta come una Magia Equipaggiamento che le dà 1000 ATK. Se questa carta ha "Numero 6: Cronomalia Atlandis" come materiale: puoi staccare 3 materiali da questa carta e mandare al Cimitero tutte le Carte Mostro "Numero" scoperte che controlli equipaggiate a questa carta dal suo effetto (minimo 1); fai diventare i LP del tuo avversario 100.
  | pt_name   = Número C6: Cronomalia Atlande do Caos
  | pt_text   = 3 monstros de Nível 7<br />Se você ativar qualquer um dos efeitos deste card, seu oponente não sofre mais dano neste turno (este não é um efeito). Uma vez por turno: você pode escolher 1 monstro que seu oponente controla; equipe o alvo a este card como uma Magia de Equipamento que concede a ele 1000 de ATK. Se este card tiver "Número 6: Cronomalia Atlande" como matéria: você pode desassociar 3 matérias deste card e enviar para o Cemitério todos os Cards de Monstro "Número" com a face para cima que você controla equipados a este card por seu efeito (mín. 1); transforme os PV do seu oponente em 100.
  | es_name   = Número C6: Atlandis del Caos Cronómala
  | es_text   = 3 monstruos de Nivel 7<br />Si activas cualquiera de los efectos de esta carta, tu adversario no recibe más daño este turno (esto no es un efecto). Una vez por turno: puedes seleccionar 1 monstruo que controle tu adversario; equipa ese objetivo a esta carta como una Mágica de Equipo que le da 1000 ATK. Si esta carta tiene "Número 6: Atlandis Cronómala" como material: puedes desacoplar 3 materiales de esta carta, y mandar al Cementerio todas las Cartas de Monstruo "Número" boca arriba que controles equipadas a esta carta por su efecto (mín. 1); haz que los LP de tu adversario sean 100.
  | ja_text   = レベル７モンスター×３<br />このカード名の①②の効果を発動したターン、相手が受ける全てのダメージは０になる。<br />①：１ターンに１度、相手フィールドのモンスター１体を対象として発動できる。その相手モンスターを攻撃力１０００アップの装備魔法カード扱いでこのカードに装備する。<br />②：このカードが「Ｎｏ．６　先史遺産アトランタル」をＸ素材としている場合、このカードのＸ素材を３つ取り除き、このカードの効果で装備している自分フィールドの表側表示の「Ｎｏ．」モンスターカードを全て墓地へ送って発動できる。相手のＬＰを１００にする。
  | ko_name   = CNo.6 오파츠 카오스 아틀란타르
  | ko_text   = 레벨 7 몬스터 × 3<br />이 카드명의 ①②의 효과를 발동한 턴에, 상대가 받는 모든 데미지는 0 이 된다.<br />①: 1턴에 1번, 상대 필드의 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 상대 몬스터를 공격력 1000 올리는 장착 마법 카드로 취급하고 이 카드에 장착한다.<br />②: 이 카드가 "No.6 오파츠 아틀란타르"를 엑시즈 소재로 하고 있을 경우, 이 카드의 엑시즈 소재를 3개 제거하고, 이 카드의 효과로 장착하고 있는 자신 필드의 앞면 표시의 "No." 몬스터 카드를 전부 묘지로 보내고 발동할 수 있다. 상대의 LP를 100 으로 한다.
  | tc_name   = CNo.6 先史遺產 混沌大西洲巨人
  | tc_text   = 等級7怪獸×3<br />發動了此卡牌名①②效果的回合，對手受到的全部傷害變為0。<br />①：1回合1次，可以對手場上的1隻怪獸為對象並發動。將該對手怪獸視為攻擊上升1000的裝備魔法卡裝備至此卡。<br />②：此卡將「No.6 先史遺產亞特蘭巨人」作為X素材的場合，可移除此卡的3個X素材，並將因此卡效果所裝備的我方場上之表側表示的「No.6 」怪獸全部送入墓地並發動。對手的LP變為100。
  | sc_name   = 混沌编号6 先史遗产 混沌大西洲巨人
  | sc_text   = 等级7怪兽×3<br />发动此卡名的①②效果的回合，对手受到的所有伤害变为0。<br />①：1回合1次，以对手场上的1只怪兽为对象可以发动。将该对手怪兽视为攻击力上升1000的装备魔法卡装备于此卡。<br />②：此卡持有“编号6 先史遗产 亚特兰塔”作为超量素材的情况下，去除此卡的3个超量素材，将以此卡的效果装备中的自己场上的表侧表示的“编号”怪兽卡全部送至墓地可以发动。将对手的LP改成100。
  }}
