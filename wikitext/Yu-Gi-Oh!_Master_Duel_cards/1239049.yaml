title: Thundercrash Snarecrow (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = N
  | attribute          = LIGHT
  | types              = Thunder / Effect
  | level              = 8
  | atk                = 1600
  | def                = 2800
  | text               = Each time a non-Thunder monster(s) is Special Summoned face-up, while this card is in the Monster Zone: That monster(s) cannot attack this turn, also destroy it during the End Phase. If this card is in your GY: You can target 1 face-up card you control; destroy it, and if you do, add this card to your hand. You can only use this effect of "Thundercrash Snarecrow" once per turn.

  | fr_name            = Piègevantail du Tonnerre Fracassant
  | fr_text            = Chaque fois qu'un ou plusieurs monstres non-Tonnerre sont Invoqués Spécialement face recto, tant que cette carte est dans la Zone Monstre : ces monstres ne peuvent pas attaquer ce tour, et aussi, détruisez-les durant la End Phase. Si cette carte est dans votre Cimetière : vous pouvez cibler 1 carte face recto que vous contrôlez ; détruisez-la, et si vous le faites, ajoutez cette carte à votre main. Vous ne pouvez utiliser cet effet de "Piègevantail du Tonnerre Fracassant" qu'une fois par tour.
  | de_name            = Donnerschlag-Strickscheuche
  | de_text            = Jedes Mal, wenn ein oder mehr Nichtdonner-Monster offen als Spezialbeschwörung beschworen werden, solange diese Karte in der Monsterzone liegt: Jene Monster können in diesem Spielzug nicht angreifen, zusätzlich zerstöre sie während der End Phase. Falls sich diese Karte in deinem Friedhof befindet: Du kannst 1 offene Karte wählen, die du kontrollierst; zerstöre sie und falls du dies tust, füge diese Karte deiner Hand hinzu. Du kannst diesen Effekt von „Donnerschlag-Strickscheuche“ nur einmal pro Spielzug verwenden.
  | it_name            = Intrappolapasseri Tuonoschianto
  | it_text            = Ogni volta che uno o più mostri non-Tuono vengono Evocati Specialmente scoperti, mentre questa carta è nella Zona Mostri: quei mostri non possono attaccare in questo turno, inoltre distruggili durante la End Phase. Se questa carta è nel tuo Cimitero: puoi scegliere come bersaglio 1 carta scoperta che controlli; distruggila e, se lo fai, aggiungi questa carta alla tua mano. Puoi utilizzare questo effetto di "Intrappolapasseri Tuonoschianto" una sola volta per turno.
  | pt_name            = Trovão Estrondoso Esbustalho
  | pt_text            = Sempre que um ou mais monstros não-Trovão forem Invocados por Invocação-Especial com a face para cima, enquanto este card estiver na Zona de Monstros: esse(s) monstro(s) não pode(m) atacar neste turno e, além disso, destrua-o(s) durante a Fase Final. Se este card estiver no seu Cemitério: você pode escolher 1 card com a face para cima que você controla; destrua-o e, se isso acontecer, adicione este card à sua mão. Você só pode usar este efeito de "Trovão Estrondoso Esbustalho" uma vez por turno.
  | es_name            = Espantrampájaros del Estallido de Trueno
  | es_text            = Cada vez que uno o más monstruos no Trueno sean Invocados de Modo Especial boca arriba, mientras esta carta está en la Zona de Monstruos: ese monstruo o monstruos no pueden atacar este turno, y además destrúyelos durante la End Phase. Si esta carta está en tu Cementerio: puedes seleccionar 1 carta boca arriba que controles; destrúyela y, si lo haces, añade esta carta a tu mano. Sólo puedes usar este efecto de "Espantrampájaros del Estallido de Trueno" una vez por turno.
  | ja_text            = このカード名の②の効果は１ターンに１度しか使用できない。<br />①：このカードがモンスターゾーンに存在する状態で、雷族以外のモンスターが表側表示で特殊召喚される度に発動する。そのモンスターはこのターン攻撃できず、エンドフェイズに破壊される。<br />②：このカードが墓地に存在する場合、自分フィールドの表側表示カード１枚を対象として発動できる。そのカードを破壊し、このカードを手札に加える。
  | ko_name            = 붕전 스네어크로우
  | ko_text            = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드가 몬스터 존에 존재하는 상태에서, 번개족 이외의 몬스터가 앞면 표시로 특수 소환될 때마다 발동한다. 그 몬스터는 이 턴에 공격할 수 없으며, 엔드 페이즈에 파괴된다.<br />②: 이 카드가 묘지에 존재할 경우, 자신 필드의 앞면 표시 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 파괴하고, 이 카드를 패에 넣는다.
  | tc_name            = 崩電稻草人
  | tc_text            = 此卡名的②效果1回合僅可使用1次。<br />①：此卡存在於怪獸區域的狀態下，每當雷族以外的怪獸以表側表示被特殊召喚則發動。該怪獸在此回合不可攻擊，將在結束階段被破壞。<br />②：此卡存在於墓地的情況下，以自己場上的1張表側表示卡為對象可以發動。將該卡破壞，將此卡加入手牌。
  | sc_name            = 崩电稻草人
  | sc_text            = 此卡名的②效果1回合仅可使用1次。<br />①：此卡存在于怪兽区域的状态下，每当雷族以外的怪兽以表侧表示被特殊召唤则发动。该怪兽在此回合不可攻击，将在结束阶段被破坏。<br />②：此卡存在于墓地的情况下，以自己场上的1张表侧表示卡为对象可以发动。将该卡破坏，将此卡加入手牌。
  }}
