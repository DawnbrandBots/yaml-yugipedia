  | text               = 2 Level 4 DARK monsters<br />(This card is always treated as a "The Phantom Knights" card.)<br />If this card is Special Summoned: You can target an equal number of cards on each field; destroy them. When your opponent activates a card or effect (Quick Effect): You can detach 1 material from this card; Special Summon 1 Rank 4 DARK Xyz Monster from your Extra Deck, using this card you control (this is treated as an Xyz Summon, transfer this card's materials). You can only use each effect of "Dark Rebellion Xyz Dragon, Four Heavenly Dragons" once per turn.

  | fr_name            = Dragon Xyz de la Rébellion des Ténèbres, Quatre Dragons Divins
  | fr_text            = 2 monstres TÉNÈBRES de Niveau 4<br />(Cette carte est toujours traitée comme carte "Les Chevaliers Fantômes".)<br />Si cette carte est Invoquée Spécialement : vous pouvez cibler un nombre égal de cartes sur chaque Terrain ; détruisez-les. Lorsque votre adversaire active une carte ou un effet (Effet Rapide) : vous pouvez détacher 1 Matériel de cette carte ; Invoquez Spécialement 1 Monstre Xyz TÉNÈBRES de Rang 4 depuis votre Extra Deck, en utilisant cette carte que vous contrôlez (ceci est traité comme Invocation Xyz, transférez les Matériels de cette carte). Vous ne pouvez utiliser chaque effet de "Dragon Xyz de la Rébellion des Ténèbres, Quatre Dragons Divins" qu'une fois par tour.
  | de_name            = Finsterer Rebellions-Xyz-Drache, vier himmlische Drachen
  | de_text            = 2 FINSTERNIS Monster der Stufe 4<br />(Diese Karte wird immer als „Die Phantomritter“-Karte behandelt.)<br />Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst dieselbe Anzahl Karten auf jeder Spielfeldseite wählen; zerstöre sie. Wenn dein Gegner eine Karte oder einen Effekt aktiviert (Schnelleffekt): Du kannst 1 Material von dieser Karte abhängen; beschwöre 1 FINSTERNIS Xyz-Monster des Rangs 4 als Spezialbeschwörung von deinem Extra Deck, indem du diese Karte verwendest, die du kontrollierst (dies wird als Xyz-Beschwörung behandelt, transferiere das Material dieser Karte). Du kannst jeden Effekt von „Finsterer Rebellions-Xyz-Drache, vier himmlische Drachen“ nur einmal pro Spielzug verwenden.
  | it_name            = Drago Xyz Ribellione Oscura, Quattro Draghi Celestiali
  | it_text            = 2 mostri OSCURITÀ di Livello 4<br />(Questa carta viene sempre considerata come una carta "I Cavalieri Fantasma".)<br />Se questa carta viene Evocata Specialmente: puoi scegliere come bersaglio un pari numero di carte su ogni Terreno; distruggile. Quando il tuo avversario attiva una carta o un effetto (Effetto Rapido): puoi staccare 1 materiale da questa carta; Evoca Specialmente 1 Mostro Xyz OSCURITÀ di Rango 4 dal tuo Extra Deck, utilizzando questa carta che controlli (questa viene considerata come un'Evocazione Xyz, trasferisci i materiali di questa carta). Puoi utilizzare ogni effetto di "Drago Xyz Ribellione Oscura, Quattro Draghi Celestiali" una sola volta per turno.
  | pt_name            = Dragão Xyz da Rebelião Negra, os Quatro Dragões Celestiais
  | pt_text            = 2 monstros de TREVAS de Nível 4<br />(Este card deve ser sempre considerado como um card "Os Cavaleiros Fantasmas".)<br />Se este card for Invocado por Invocação-Especial: você pode escolher um número igual de cards em cada campo; destrua-os. Quando seu oponente ativar um card ou efeito (Efeito Rápido): você pode desassociar 1 matéria deste card; Invoque por Invocação-Especial 1 Monstro Xyz de Classe 4 de TREVAS do seu Deck Adicional, usando este card que você controla (isso é considerado uma Invocação-Xyz, transfira as matérias deste card). Você só pode usar cada efeito de "Dragão Xyz da Rebelião Negra, os Quatro Dragões Celestiais" uma vez por turno.
  | es_name            = Dragón Xyz Rebelión Oscura, Cuatro Dragones Celestiales
  | es_text            = 2 monstruos de OSCURIDAD de Nivel 4<br />(Esta carta se trata siempre como una carta "Los Caballeros Fantasma").<br />Si esta carta es Invocada de Modo Especial: puedes seleccionar el mismo número de cartas en cada Campo; destrúyelas. Cuando tu adversario activa una carta o efecto (Efecto Rápido): puedes desacoplar 1 material de esta carta; Invoca de Modo Especial, desde tu Deck Extra, 1 Monstruo Xyz de OSCURIDAD de Rango 4, usando esta carta que controlas (esto se trata como una Invocación Xyz, transfiere los materiales de esta carta). Sólo puedes usar cada efecto de "Dragón Xyz Rebelión Oscura, Cuatro Dragones Celestiales" una vez por turno.
  | ja_text            = 闇属性レベル４モンスター×２<br />このカード名はルール上「幻影騎士団」カードとしても扱う。<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが特殊召喚した場合、自分及び相手フィールドのカードをそれぞれ同じ数だけ対象として発動できる。そのカードを破壊する。<br />②：相手が効果を発動した時、このカードのＸ素材を１つ取り除いて発動できる。闇属性・ランク４のＸモンスター１体を自分フィールドのこのカードの上に重ねてＸ召喚扱いでＥＸデッキから特殊召喚する。
  | ko_name            = 사천의 용 다크 리벨리온 엑시즈 드래곤
  | ko_text            = 어둠 속성 레벨 4 몬스터 × 2<br />이 카드명은 룰상 "팬텀 나이츠" 카드로도 취급한다.<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 특수 소환했을 경우, 자신 및 상대 필드의 카드를 각각 같은 수만큼 대상으로 하고 발동할 수 있다. 그 카드를 파괴한다.<br />②: 상대가 효과를 발동했을 때, 이 카드의 엑시즈 소재를 1개 제거하고 발동할 수 있다. 어둠 속성 / 랭크 4 인 엑시즈 몬스터 1장을 자신 필드의 이 카드 위에 겹쳐 엑시즈 소환으로 취급하고 엑스트라 덱에서 특수 소환한다.
  | tc_name            = 四天之龍 暗反叛超量龍
  | tc_text            = 闇屬性等級4怪獸×2<br />此卡名在規則上也視為「魅影騎士團」卡。<br />此卡名的①②效果1回合僅可各使用1次。<br />①：此卡特殊召喚的情況下，以相同數量的自己及對手場上的卡為對象可以發動。將該卡破壞。<br />②：對手發動效果時，去除此卡的1個超量素材可以發動。從額外牌組將1隻闇屬性・階級4的超量怪獸重疊在自己場上的此卡上面，視為超量召喚特殊召喚。
  | sc_name            = 四天之龙 暗反叛超量龙
  | sc_text            = 暗属性等级4怪兽×2<br />此卡名在规则上也视为“魅影骑士团”卡。<br />此卡名的①②效果1回合仅可各使用1次。<br />①：此卡特殊召唤的情况下，以相同数量的自己及对手场上的卡为对象可以发动。将该卡破坏。<br />②：对手发动效果时，去除此卡的1个超量素材可以发动。从额外牌组将1只暗属性・阶级4的超量怪兽重叠在自己场上的此卡上面，视为超量召唤特殊召唤。
