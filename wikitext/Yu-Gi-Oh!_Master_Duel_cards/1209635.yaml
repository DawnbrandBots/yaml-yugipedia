title: GMX 55th Experiment Report (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | card_type          = Spell
  | property           = Quick-Play
  | text               = Fusion Summon 1 Dinosaur Fusion Monster from your Extra Deck using monsters from your hand or field. If your opponent controls a monster, you can also use 1 "GMX" monster in your Deck as material. During your Main Phase: You can banish this card from your GY; excavate the top cards of your Deck until you excavate a "GMX" card, add that "GMX" card to your hand, also shuffle the rest into the Deck. You can only use 1 "GMX 55th Experiment Report" effect per turn, and only once that turn.

  | fr_name            = Rapport de l'Expérience 55 GMX
  | fr_text            = Invoquez par Fusion 1 Monstre Fusion Dinosaure depuis votre Extra Deck en utilisant des monstres depuis votre main ou Terrain. Si votre adversaire contrôle un monstre, vous pouvez aussi utiliser 1 monstre "GMX" dans votre Deck comme Matériel. Durant votre Main Phase : vous pouvez bannir cette carte depuis votre Cimetière ; dévoilez les cartes du dessus de votre Deck jusqu'à dévoiler une carte "GMX", ajoutez la carte "GMX" à votre main, et aussi, mélangez les cartes restantes dans le Deck. Vous ne pouvez utiliser qu'1 effet de "Rapport de l'Expérience 55 GMX" par tour, et uniquement une fois le tour.
  | de_name            = 55. GMX-Experimentbericht
  | de_text            = Beschwöre 1 Dinosaurier-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck, indem du Monster von deiner Hand oder Spielfeldseite verwendest. Falls dein Gegner ein Monster kontrolliert, kannst du auch 1 „GMX“-Monster von deinem Deck als Material verwenden. Während deiner Main Phase: Du kannst diese Karte von deinem Friedhof verbannen; grabe die obersten Karten deines Decks aus, bis du eine „GMX“-Karte ausgräbst, füge jene „GMX“-Karte deiner Hand hinzu, zusätzlich mische die restlichen ins Deck. Du kannst nur 1 Effekt von „55. GMX-Experimentbericht“ pro Spielzug verwenden und in jenem Spielzug nur einmal.
  | it_name            = GMX Rapporto Esperimento 55º
  | it_text            = Evoca tramite Fusione 1 Mostro Fusione Dinosauro dal tuo Extra Deck utilizzando mostri dalla tua mano o Terreno. Se il tuo avversario controlla un mostro, puoi anche utilizzare 1 mostro "GMX" nel tuo Deck come materiale. Durante la tua Main Phase: puoi bandire questa carta dal tuo Cimitero; dissotterra carte dalla cima del tuo Deck fino a quando dissotterri una carta "GMX", aggiungi quella carta "GMX" alla tua mano, inoltre mischia il resto nel Deck. Puoi utilizzare solo 1 effetto di "GMX Rapporto Esperimento 55º" per turno, e solo una volta in quel turno.
  | pt_name            = Relatório do Experimento 55º GMX
  | pt_text            = Invoque por Invocação-Fusão 1 Monstro de Fusão Dinossauro do seu Deck Adicional usando monstros da sua mão ou do campo. Se seu oponente controlar um monstro, você também pode usar 1 monstro "GMX" no seu Deck como matéria. Durante sua Fase Principal: você pode banir este card do seu Cemitério; escave cards do topo do seu Deck até escavar um card "GMX", adicione esse card "GMX" à sua mão e, além disso, embaralhe o resto no Deck. Você só pode usar 1 efeito de "Relatório do Experimento 55º GMX" por turno e apenas uma vez por turno.
  | es_name            = Informe del Experimento de GMX 55.º
  | es_text            = Invoca por Fusión 1 Monstruo de Fusión Dinosaurio desde tu Deck Extra usando monstruos en tu mano o Campo. Si tu adversario controla un monstruo, también puedes usar 1 monstruo "GMX" en tu Deck como material. Durante tu Main Phase: puedes desterrar esta carta en tu Cementerio; excava las cartas de la parte superior de tu Deck hasta que excaves una carta "GMX", añade a tu mano esa carta "GMX", y además baraja el resto al Deck. Sólo puedes usar 1 efecto de "Informe del Experimento de GMX 55.º" por turno, y sólo una vez ese turno.
  | ja_text            = このカード名の①②の効果は１ターンに１度、いずれか１つしか使用できない。<br />①：自分の手札・フィールドのモンスターを融合素材とし、恐竜族の融合モンスター１体を融合召喚する。相手フィールドにモンスターが存在する場合、自分のデッキの「ＧＭＸ」モンスターも１体まで融合素材とする事ができる。<br />②：自分メインフェイズに墓地のこのカードを除外して発動できる。「ＧＭＸ」カードが出るまで自分のデッキの上からカードをめくり、その「ＧＭＸ」カードを手札に加える。残りをデッキに戻す。
  | ko_name            = 제55차 GMX 시험보고
  | ko_text            = 이 카드명의 ①②의 효과는 1턴에 1번, 어느 쪽이든 1개밖에 사용할 수 없다.<br />①: 자신의 패 / 필드의 몬스터를 융합 소재로 하고, 공룡족의 융합 몬스터 1장을 융합 소환한다. 상대 필드에 몬스터가 존재할 경우, 자신의 덱의 "GMX(제노믹스)" 몬스터도 1장까지 융합 소재로 할 수 있다.<br />②: 자신 메인 페이즈에 묘지의 이 카드를 제외하고 발동할 수 있다. "GMX(제노믹스)" 카드가 나올 때까지 자신의 덱 위에서 카드를 넘기고, 그 "GMX(제노믹스)" 카드를 패에 넣는다. 나머지를 덱으로 되돌린다.
  | tc_name            = 第55次GMX實驗報告
  | tc_text            = 此卡名的①②效果1回合1次，僅可使用其中1個。<br />①：將自己手牌・場上的怪獸作為融合素材，將1隻恐龍族融合怪獸融合召喚。對手場上存在怪獸的情況下，可將自己牌組的最多1隻「GMX」怪獸也作為融合素材。<br />②：在自己的主要階段將墓地的此卡除外可以發動。從自己牌組上面翻開卡，直至翻到「GMX」卡為止，將該「GMX」卡加入手牌。將剩餘的放回牌組。
  | sc_name            = 第55次GMX实验报告
  | sc_text            = 此卡名的①②效果1回合1次，仅可使用其中1个。<br />①：将自己手牌・场上的怪兽作为融合素材，将1只恐龙族融合怪兽融合召唤。对手场上存在怪兽的情况下，可将自己牌组的最多1只“GMX”怪兽也作为融合素材。<br />②：在自己的主要阶段将墓地的此卡除外可以发动。从自己牌组上面翻开卡，直至翻到“GMX”卡为止，将该“GMX”卡加入手牌。将剩余的放回牌组。
  }}
