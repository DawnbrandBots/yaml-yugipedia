title: Fleeting Flower of the Magician (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | card_type          = Spell
  | property           = Quick-Play
  | text               = Target 1 face-up Spell/Trap your opponent controls, or 1 Spell/Trap you control; destroy it, then if you targeted a card you control, you can apply 1 of these effects.<br />●Place 1 monster from your GY in your Spell & Trap Zone as a face-up Continuous Spell.<br />●Add 1 Equip or Continuous Spell from your GY to your hand.<br />You can only activate 1 "Fleeting Flower of the Magician" per turn.

  | fr_name            = Fleur Éphémère du Magicien
  | fr_text            = Ciblez 1 Magie/Piège face recto contrôlé par votre adversaire ou 1 Magie/Piège que vous contrôlez ; détruisez-le, puis si vous avez ciblé une carte que vous contrôlez, vous pouvez appliquer 1 de ces effets.<br />●Placez 1 monstre depuis votre Cimetière dans votre Zone Magie & Piège comme Magie Continue face recto.<br />●Ajoutez 1 Magie d'Équipement ou Continue depuis votre Cimetière à votre main.<br />Vous ne pouvez activer qu'1 "Fleur Éphémère du Magicien" par tour.
  | de_name            = Flüchtige Blume des Magiers
  | de_text            = Wähle 1 offene/n Zauber/Falle, den oder die dein Gegner kontrolliert, oder 1 Zauber/Falle, den oder die du kontrollierst; zerstöre ihn oder sie, dann, falls du eine Karte als Ziel gewählt hast, die du kontrollierst, kannst du 1 dieser Effekte ausführen.<br />●Lege 1 Monster von deinem Friedhof als offenen Permanenten Zauber in deine Zauber- & Fallenzone.<br />●Füge deiner Hand 1 Ausrüstungs- oder Permanenten Zauber von deinem Friedhof hinzu.<br />Du kannst nur 1 „Flüchtige Blume des Magiers“ pro Spielzug aktivieren.
  | it_name            = Fiore Effimero del Mago
  | it_text            = Scegli come bersaglio 1 Magia/Trappola scoperta controllata dal tuo avversario, o 1 Magia/Trappola che controlli; distruggila, poi se hai scelto come bersaglio una carta che controlli, puoi applicare 1 di questi effetti.<br />●Metti 1 mostro dal tuo Cimitero nella tua Zona Magie & Trappole come una Magia Continua scoperta.<br />●Aggiungi 1 Magia Equipaggiamento o Continua dal tuo Cimitero alla tua mano.<br />Puoi attivare solo 1 "Fiore Effimero del Mago" per turno.
  | pt_name            = Flor Fugaz do Mago
  | pt_text            = Escolha 1 Magia/Armadilha com a face para cima que seu oponente controla, ou 1 Magia/Armadilha que você controla; destrua-a e, depois, se você escolheu um card que você controla, você pode aplicar 1 desses efeitos.<br />●Coloque 1 monstro do seu Cemitério na sua Zona de Magias & Armadilhas como uma Magia Contínua com a face para cima.<br />●Adicione 1 Magia de Equipamento ou Contínua do seu Cemitério à sua mão.<br />Você só pode ativar 1 "Flor Fugaz do Mago" por turno.
  | es_name            = Flor Fugaz del Mago
  | es_text            = Selecciona 1 Mágica/Trampa boca arriba que controle tu adversario, o 1 Mágica/Trampa que tú controles; destrúyela y después, si seleccionaste una carta que controlas, puedes aplicar 1 de estos efectos.<br />●Pon en tu Zona de Magia y Trampas 1 monstruo en tu Cementerio como una Mágica Continua boca arriba.<br />●Añade a tu mano 1 Mágica de Equipo o Continua en tu Cementerio.<br />Sólo puedes activar 1 "Flor Fugaz del Mago" por turno.
  | ja_text            = このカード名のカードは１ターンに１枚しか発動できない。<br />①：相手フィールドの表側表示の魔法・罠カード１枚、または自分フィールドの魔法・罠カード１枚を対象として発動できる。そのカードを破壊する。自分フィールドのカードを対象として発動した場合、さらに以下の効果から１つを選んで適用できる。<br />●自分の墓地からモンスター１体を永続魔法カード扱いで自分の魔法＆罠ゾーンに表側表示で置く。<br />●自分の墓地から装備・永続魔法カード１枚を手札に加える。
  | ko_name            = 마술사의 공화
  | ko_text            = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다.<br />①: 상대 필드의 앞면 표시의 마법 / 함정 카드 1장, 또는 자신 필드의 마법 / 함정 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 파괴한다. 자신 필드의 카드를 대상으로 하고 발동했을 경우, 추가로 이하의 효과에서 1개를 고르고 적용할 수 있다.<br />●자신 묘지에서 몬스터 1장을 지속 마법 카드로 취급하고 자신의 마법 & 함정 존에 앞면 표시로 놓는다.<br />●자신 묘지에서 장착 / 지속 마법 카드 1장을 패에 넣는다.
  | tc_name            = 魔術師之空華
  | tc_text            = 此卡名的卡1回合僅可發動1張。<br />①：以對手場上的1張表側表示的魔法・陷阱卡，或自己場上的1張魔法・陷阱卡為對象可以發動。將該卡破壞。以自己場上的卡為對象發動的情況下，進而可從以下效果選擇1個適用。<br />●從自己墓地將1隻怪獸視為永續魔法卡以表側表示放在自己的魔法與陷阱區域。<br />●從自己墓地將1張裝備・永續魔法卡加入手牌。
  | sc_name            = 魔术师之空华
  | sc_text            = 此卡名的卡1回合仅可发动1张。<br />①：以对手场上的1张表侧表示的魔法・陷阱卡，或自己场上的1张魔法・陷阱卡为对象可以发动。将该卡破坏。以自己场上的卡为对象发动的情况下，进而可从以下效果选择1个适用。<br />●从自己墓地将1只怪兽视为永续魔法卡以表侧表示放在自己的魔法与陷阱区域。<br />●从自己墓地将1张装备・永续魔法卡加入手牌。
  }}
