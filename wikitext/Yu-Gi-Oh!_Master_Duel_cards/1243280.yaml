title: Distrust Paranoia (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = R
  | card_type          = Trap
  | property           = Normal
  | text               = Take control of all your opponent's monsters in this card's column. If this Set card in its owner's control has left the field by an opponent's effect, and is now in the GY or banished: You can Special Summon this card as an Effect Monster (Fiend/DARK/Level 10/ATK 4000/DEF 4000) with the following effect (this card is NOT treated as a Trap).<br />●Unaffected by your opponent's card effects activated in the same column.<br />You can only activate 1 "Distrust Paranoia" per turn.

  | fr_name            = Paranoïa de Méfiance
  | fr_text            = Prenez le contrôle de tous les monstres de votre adversaire dans la colonne de cette carte. Si cette carte Posée contrôlée par son propriétaire a quitté le Terrain par un effet de l'adversaire, et est maintenant dans le Cimetière ou bannie : vous pouvez Invoquer Spécialement cette carte comme Monstre à Effet (Démon/TÉNÈBRES/Niveau 10/ATK 4000/DEF 4000) avec l'effet suivant (cette carte N'EST PAS traitée comme Piège).<br />●Non affecté par des effets de carte de votre adversaire activés dans la même colonne.<br />Vous ne pouvez activer qu'1 "Paranoïa de Méfiance" par tour.
  | de_name            = Misstrauensparanoia
  | de_text            = Übernimm die Kontrolle über alle Monster deines Gegners in der Spalte dieser Karte. Falls diese gesetzte Karte, die ihr Besitzer kontrolliert, das Spielfeld durch einen Effekt eines Gegners verlassen hat und sich jetzt im Friedhof befindet oder verbannt ist: Du kannst diese Karte als Spezialbeschwörung als Effektmonster (Unterweltler/FINSTERNIS/Stufe 10/ATK 4000/DEF 4000) mit dem folgenden Effekt beschwören (diese Karte wird NICHT als Falle behandelt).<br />●Bleibt von Karteneffekten deines Gegners unberührt, die in derselben Spalte aktiviert werden.<br />Du kannst nur 1 „Misstrauensparanoia“ pro Spielzug aktivieren.
  | it_name            = Paranoia Diffidente
  | it_text            = Prendi il controllo di tutti i mostri del tuo avversario nella colonna di questa carta. Se questa carta Posizionata sotto il controllo del suo proprietario ha lasciato il Terreno per un effetto dell'avversario, e ora è nel Cimitero o bandita: puoi Evocare Specialmente questa carta come un Mostro con Effetto (Demone/OSCURITÀ/Livello 10/ATK 4000/DEF 4000) con il seguente effetto (questa carta NON viene considerata come una Trappola).<br />●Immune agli effetti delle carte del tuo avversario attivati nella stessa colonna.<br />Puoi attivare solo 1 "Paranoia Diffidente" per turno.
  | pt_name            = Desconfiança Paranoia
  | pt_text            = Tome o controle de todos os monstros do seu oponente na coluna deste card. Se este card Baixado sob o controle do seu dono deixou o campo devido a um efeito do oponente e agora estiver no Cemitério ou banido: você pode Invocar este card por Invocação-Especial como um Monstro de Efeito (Demônio/TREVAS/Nível 10/ATK 4000/DEF 4000) com o seguinte efeito (este card NÃO é considerado como uma Armadilha).<br />●Não é afetado pelos efeitos de card do seu oponente ativados na mesma coluna.<br />Você só pode ativar 1 "Desconfiança Paranoia" por turno.
  | es_name            = Paranoia de Sospecha
  | es_text            = Toma el control de todos los monstruos de tu adversario en la columna de esta carta. Si esta carta Colocada controlada por su dueño dejó el Campo por un efecto del adversario, y ahora está en el Cementerio o desterrada: puedes Invocar esta carta de Modo Especial como un Monstruo de Efecto (Demonio/OSCURIDAD/Nivel 10/ATK 4000/DEF 4000) con el siguiente efecto (esta carta NO se trata como una Trampa).<br />●No es afectado por los efectos de cartas de tu adversario activados en la misma columna.<br />Sólo puedes activar 1 "Paranoia de Sospecha" por turno.
  | ja_text            = このカード名のカードは１ターンに１枚しか発動できない。<br />①：このカードと同じ縦列の全ての相手モンスターのコントロールを得る。<br />②：セットされているこのカードが相手の効果でフィールドから離れ、墓地へ送られた場合または除外された場合に発動できる。このカードは以下の効果を持つ効果モンスター（悪魔族・闇・星１０・攻／守４０００）となり、モンスターゾーンに特殊召喚する（罠カードとしては扱わない）。<br />●このカードはモンスターゾーンに存在する限り、このカードと同じ縦列で相手が発動したカードの効果を受けない。
  | ko_name            = 시의신 파라노이아
  | ko_text            = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다. 이 카드와 같은 세로열인 모든 상대 몬스터의 컨트롤을 얻는다.<br />②: 세트되어 있는 이 카드가 상대 효과로 필드에서 벗어나, 묘지로 보내졌을 경우 또는 제외되었을 경우에 발동할 수 있다. 이 카드는 이하의 효과를 가지는 효과 몬스터(악마족 / 어둠 / 레벨 10 / 공 4000 / 수 4000)가 되고, 몬스터 존에 특수 소환한다(함정 카드로는 취급하지 않는다).<br />●이 카드는 몬스터 존에 존재하는 한, 이 카드와 같은 세로열에서 상대가 발동한 카드의 효과를 받지 않는다.
  | tc_name            = 猜疑神 帕拉諾亞
  | tc_text            = 此卡名的卡1回合僅可發動1張。<br />①：獲得和此卡同一縱列的對手怪獸的控制權。<br />②：被放置的此卡因對手的效果從場上離開，並被送至墓地的情況下或被除外的情況下可以發動。此卡變為擁有以下效果的怪獸（惡魔族・闇・星10・攻/守4000），特殊召喚至怪獸區域（不視為陷阱卡）。<br />●此卡只要存在於怪獸區域，此卡不受對手發動的同一縱列的卡的效果影響。
  | sc_name            = 猜疑神 帕拉诺亚
  | sc_text            = 此卡名的卡1回合仅可发动1张。<br />①：获得和此卡同一纵列的对手怪兽的控制权。<br />②：被放置的此卡因对手的效果从场上离开，并被送至墓地的情况下或被除外的情况下可以发动。此卡变为拥有以下效果的怪兽（恶魔族・暗・星10・攻/守4000），特殊召唤至怪兽区域（不视为陷阱卡）。<br />●此卡只要存在于怪兽区域，此卡不受对手发动的同一纵列的卡的效果影响。
  }}
