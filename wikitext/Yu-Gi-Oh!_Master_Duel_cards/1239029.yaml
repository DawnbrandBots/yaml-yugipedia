  | text               = 2 Level 6 Plant monsters<br />You can detach 2 materials from this card; Special Summon 1 Plant Xyz Monster from your Extra Deck in Defense Position, except "Rikka Sacred Queen Strenna", then if you Special Summoned a "Rikka" Xyz Monster, you can attach 1 "Rikka" monster from your Deck to it. If a monster(s) is Tributed (except during the Damage Step): You can Set 1 "Rikka" Trap from your Deck or GY. You can only use each effect of "Rikka Sacred Queen Strenna" once per turn.

  | fr_name            = Strenna la Reine Sacrée Rikka
  | fr_text            = 2 monstres Plante de Niveau 6<br />Vous pouvez détacher 2 Matériels de cette carte ; Invoquez Spécialement 1 Monstre Xyz Plante ("Strenna la Reine Sacrée Rikka" exclu) depuis votre Extra Deck en Position de Défense, puis si vous avez Invoqué Spécialement un Monstre Xyz "Rikka", vous pouvez lui attacher 1 monstre "Rikka" depuis votre Deck. Si un ou plusieurs monstres sont Sacrifiés (sauf durant la Damage Step) : vous pouvez Poser 1 Piège "Rikka" depuis votre Deck ou Cimetière. Vous ne pouvez utiliser chaque effet de "Strenna la Reine Sacrée Rikka" qu'une fois par tour.
  | de_name            = Heilige Rikka-Königin Strenna
  | de_text            = 2 Pflanze-Monster der Stufe 6<br />Du kannst 2 Material von dieser Karte abhängen; beschwöre 1 Pflanze-Xyz-Monster als Spezialbeschwörung von deinem Extra Deck in die Verteidigungsposition, außer „Heilige Rikka-Königin Strenna“, dann, falls du ein „Rikka“-Xyz-Monster als Spezialbeschwörung beschworen hast, kannst du 1 „Rikka“-Monster von deinem Deck daran anhängen. Falls ein oder mehr Monster als Tribut angeboten werden (außer während des Damage Steps): Du kannst 1 „Rikka“-Falle von deinem Deck oder Friedhof setzen. Du kannst jeden Effekt von „Heilige Rikka-Königin Strenna“ nur einmal pro Spielzug verwenden.
  | it_name            = Regina Sacra Rikka Strenna
  | it_text            = 2 mostri Pianta di Livello 6<br />Puoi staccare 2 materiali da questa carta; Evoca Specialmente 1 Mostro Xyz Pianta dal tuo Extra Deck in Posizione di Difesa, eccetto "Regina Sacra Rikka Strenna", poi se hai Evocato Specialmente un Mostro Xyz "Rikka", puoi attaccare 1 mostro "Rikka" dal tuo Deck a esso. Se uno o più mostri vengono offerti come Tributo (eccetto durante il Damage Step): puoi Posizionare 1 Trappola "Rikka" dal tuo Deck o Cimitero. Puoi utilizzare ogni effetto di "Regina Sacra Rikka Strenna" una sola volta per turno.
  | pt_name            = Strenna, a Rainha Sagrada Rikka
  | pt_text            = 2 monstros Planta de Nível 6<br />Você pode desassociar 2 matérias deste card; Invoque por Invocação-Especial 1 Monstro Xyz Planta do seu Deck Adicional em Posição de Defesa, exceto "Strenna, a Rainha Sagrada Rikka" e, depois, se você Invocou por Invocação-Especial um Monstro Xyz "Rikka", você pode associar 1 monstro "Rikka" do seu Deck a ele. Se um ou mais monstros forem oferecidos como Tributo (exceto durante a Etapa de Dano): você pode Baixar 1 Armadilha "Rikka" do seu Deck ou Cemitério. Você só pode usar cada efeito de "Strenna, a Rainha Sagrada Rikka" uma vez por turno.
  | es_name            = Sagrada Reina Rikka Strena
  | es_text            = 2 monstruos Planta de Nivel 6<br />Puedes desacoplar 2 materiales de esta carta; Invoca de Modo Especial, desde tu Deck Extra, 1 Monstruo Xyz Planta en Posición de Defensa, excepto "Sagrada Reina Rikka Strena" y después, si Invocaste de Modo Especial un Monstruo Xyz "Rikka", puedes acoplarle 1 monstruo "Rikka" en tu Deck. Si uno o más monstruos son Sacrificados (excepto durante el Damage Step): puedes Colocar 1 Trampa "Rikka" desde tu Deck o Cementerio. Sólo puedes usar cada efecto de "Sagrada Reina Rikka Strena" una vez por turno.
  | ja_text            = 植物族レベル６モンスター×２<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードのＸ素材を２つ取り除いて発動できる。ＥＸデッキから「六花深聖ストレナエ」以外の植物族Ｘモンスター１体を守備表示で特殊召喚する。この効果で「六花」Ｘモンスターを特殊召喚した場合、さらにデッキから「六花」モンスター１体をそのＸ素材にできる。<br />②：モンスターがリリースされた場合に発動できる。自分のデッキ・墓地から「六花」罠カード１枚を自分フィールドにセットする。
  | ko_name            = 육화심성 스트레나에
  | ko_text            = 식물족 레벨 6 몬스터 × 2<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드의 엑시즈 소재를 2개 제거하고 발동할 수 있다. 엑스트라 덱에서 "육화심성 스트레나에" 이외의 식물족 엑시즈 몬스터 1장을 수비 표시로 특수 소환한다. 이 효과로 "육화" 엑시즈 몬스터를 특수 소환했을 경우, 추가로 덱에서 "육화" 몬스터 1장을 그 엑시즈 소재로 할 수 있다.<br />②: 몬스터가 릴리스되었을 경우에 발동할 수 있다. 자신의 덱 / 묘지에서 "육화" 함정 카드 1장을 자신 필드에 세트한다.
  | tc_name            = 六花深聖絲翠娜葉
  | tc_text            = 植物族等級6怪獸×2<br />此卡名的①②效果1回合僅可各使用1次。<br />①：去除此卡的2個超量素材可以發動。從額外牌組將「六花深聖絲翠娜葉」以外的1隻植物族超量怪獸以守備表示特殊召喚。以此效果特殊召喚了「六花」超量怪獸的情況下，進而可從牌組將1隻「六花」怪獸作為其超量素材。<br />②：有怪獸被解放的情況下可以發動。從自己牌組・墓地將1張「六花」陷阱卡放置在自己場上。
  | sc_name            = 六花深圣花环
  | sc_text            = 植物族等级6怪兽×2<br />此卡名的①②效果1回合仅可各使用1次。<br />①：去除此卡的2个超量素材可以发动。从额外牌组将“六花深圣花环”以外的1只植物族超量怪兽以守备表示特殊召唤。以此效果特殊召唤了“六花”超量怪兽的情况下，进而可从牌组将1只“六花”怪兽作为其超量素材。<br />②：有怪兽被解放的情况下可以发动。从自己牌组・墓地将1张“六花”陷阱卡放置在自己场上。
