title: Mirror Barrier (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | card_type          = Trap
  | property           = Normal
  | text               = Target 1 face-up monster you control; equip this card to it with the following effect.<br />●Once per Battle Step, if the equipped monster battles an opponent's monster: You can destroy that opponent's monster.<br />If this card is destroyed: You can add 1 "Armament Reincarnation" from your Deck to your hand. You can only use this effect of "Mirror Barrier" once per turn.
  | releases           = 
  Legacy Pack; October 6, 2026

  | fr_name            = Barrière Miroir
  | fr_text            = Ciblez 1 monstre face recto que vous contrôlez ; équipez-lui cette carte avec l'effet suivant.<br />●Une fois par Battle Step, si le monstre équipé combat un monstre de l'adversaire : vous pouvez détruire le monstre de l'adversaire.<br />Si cette carte est détruite : vous pouvez ajouter 1 "Réincarnation d'Armement" depuis votre Deck à votre main. Vous ne pouvez utiliser cet effet de "Barrière Miroir" qu'une fois par tour.
  | de_name            = Spiegelbarriere
  | de_text            = Wähle 1 offenes Monster, das du kontrollierst; rüste es mit dieser Karte mit dem folgenden Effekt aus.<br />●Einmal pro Battle Step, falls das ausgerüstete Monster gegen ein Monster eines Gegners kämpft: Du kannst jenes Monster des Gegners zerstören.<br />Falls diese Karte zerstört wird: Du kannst deiner Hand 1 „Bewaffnungs-Reinkarnation“ von deinem Deck hinzufügen. Du kannst diesen Effekt von „Spiegelbarriere“ nur einmal pro Spielzug verwenden.
  | it_name            = Barriera Specchio
  | it_text            = Scegli come bersaglio 1 mostro scoperto che controlli; equipaggia questa carta a esso con il seguente effetto.<br />●Una volta per Battle Step, se il mostro equipaggiato combatte con un mostro dell'avversario: puoi distruggere quel mostro dell'avversario.<br />Se questa carta viene distrutta: puoi aggiungere 1 "Armamento Reincarnato" dal tuo Deck alla tua mano. Puoi utilizzare questo effetto di "Barriera Specchio" una sola volta per turno.
  | pt_name            = Barreira de Espelho
  | pt_text            = Escolha 1 monstro com a face para cima que você controla; equipe este card a ele com o seguinte efeito.<br />●Uma vez por Etapa de Batalha, se o monstro equipado batalhar um monstro do oponente: você pode destruir esse monstro do oponente.<br />Se este card for destruído: você pode adicionar 1 "Reencarnação do Armamento" do seu Deck à sua mão. Você só pode usar este efeito de "Barreira de Espelho" uma vez por turno.
  | es_name            = Barrera de Espejo
  | es_text            = Selecciona 1 monstruo boca arriba que controles; equípale esta carta con el siguiente efecto.<br />●Una vez por Battle Step, si el monstruo equipado batalla con un monstruo del adversario: puedes destruir ese monstruo del adversario.<br />Si esta carta es destruida: puedes añadir a tu mano 1 "Armamento Reencarnado" en tu Deck. Sólo puedes usar este efecto de "Barrera de Espejo" una vez por turno.
  | ja_text            = このカード名の②の効果は１ターンに１度しか使用できない。<br />①：自分フィールドの表側表示モンスター１体を対象としてこのカードを発動できる。このカードを以下の効果を持つ装備カード扱いでそのモンスターに装備する。<br />●装備モンスターが相手モンスターと戦闘を行うバトルステップに１度、発動できる。その相手モンスターを破壊する。<br />②：このカードが破壊された場合に発動できる。デッキから「武装転生」１枚を手札に加える。
  | ko_name            = 미러베리어
  | ko_text            = 이 카드명의 ②의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 자신 필드의 앞면 표시 몬스터 1장을 대상으로 하고 이 카드를 발동할 수 있다. 이 카드를 이하의 효과를 가지는 장착 카드로 취급하고 그 몬스터에 장착한다.<br />●장착 몬스터가 상대 몬스터와 전투를 실행하는 배틀 스텝에 1번, 발동할 수 있다. 그 상대 몬스터를 파괴한다.<br />②: 이 카드가 파괴되었을 경우에 발동할 수 있다. 덱에서 "무장전생" 1장을 패에 넣는다.
  | tc_name            = 鏡罩
  | tc_text            = 此卡名的②效果1回合僅可使用1次。<br />①：以自己場上的1隻表側表示怪獸為對象可以發動此卡。將此卡視為擁有以下效果的裝備卡，裝備於該怪獸。<br />●每次裝備怪獸與對手怪獸進行戰鬥的戰鬥步驟可以發動1次。將該對手怪獸破壞。<br />②：此卡被破壞的情況下可以發動。從牌組將1張「武裝轉生」加入手牌。
  | sc_name            = 镜罩
  | sc_text            = 此卡名的②效果1回合仅可使用1次。<br />①：以自己场上的1只表侧表示怪兽为对象可以发动此卡。将此卡视为拥有以下效果的装备卡，装备于该怪兽。<br />●每次装备怪兽与对手怪兽进行战斗的战斗步骤可以发动1次。将该对手怪兽破坏。<br />②：此卡被破坏的情况下可以发动。从牌组将1张“武装转生”加入手牌。
  }}
