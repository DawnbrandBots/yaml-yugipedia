title: Rain of Frogs (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | card_type          = Trap
  | property           = Normal
  | text               = If you control an Aqua monster with 2000 or more ATK: Send all monsters on the field to the GY, except Aqua monsters. If this Set card is destroyed by card effect: You can Set this card. You can only use each effect of "Rain of Frogs" once per turn.

  | fr_name            = Pluie de Grenouilles
  | fr_text            = Si vous contrôlez un monstre Aqua avec min. 2000 ATK : envoyez tous les monstres (monstres Aqua exclus) sur le Terrain au Cimetière. Si cette carte Posée est détruite par un effet de carte : vous pouvez Poser cette carte. Vous ne pouvez utiliser chaque effet de "Pluie de Grenouilles" qu'une fois par tour.
  | de_name            = Froschregen
  | de_text            = Falls du ein Aqua-Monster mit 2000 oder mehr ATK kontrollierst: Lege alle Monster vom Spielfeld auf den Friedhof, außer Aqua-Monstern. Falls diese gesetzte Karte durch einen Karteneffekt zerstört wird: Du kannst diese Karte setzen. Du kannst jeden Effekt von „Froschregen“ nur einmal pro Spielzug verwenden.
  | it_name            = Pioggia di Rane
  | it_text            = Se controlli un mostro Acqua con ATK 2000 o superiore: manda al Cimitero tutti i mostri sul Terreno, eccetto i mostri Acqua. Se questa carta Posizionata viene distrutta dall'effetto di una carta: puoi Posizionare questa carta. Puoi utilizzare ogni effetto di "Pioggia di Rane" una sola volta per turno.
  | pt_name            = Chuva de Sapos
  | pt_text            = Se você controlar um monstro Aqua com 2000 ou mais de ATK: envie todos os monstros no campo para o Cemitério, exceto monstros Aqua. Se este card Baixado for destruído por um efeito de card: você pode Baixar este card. Você só pode usar cada efeito de "Chuva de Sapos" uma vez por turno.
  | es_name            = Lluvia de Ranas
  | es_text            = Si controlas un monstruo Aqua con 2000 ATK o más: manda al Cementerio todos los monstruos en el Campo, excepto monstruos Aqua. Si esta carta Colocada es destruida por el efecto de una carta: puedes Colocar esta carta. Sólo puedes usar cada efecto de "Lluvia de Ranas" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：自分フィールドに攻撃力２０００以上の水族モンスターが存在する場合に発動できる。水族モンスターを除く、フィールドのモンスターを全て墓地へ送る。<br />②：セットされているこのカードが効果で破壊された場合に発動できる。このカードを自分フィールドにセットする。
  | ko_name            = 기묘한 비
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 자신 필드에 공격력 2000 이상의 물족 몬스터가 존재할 경우에 발동할 수 있다. 물족 몬스터가 아닌, 필드의 몬스터를 전부 묘지로 보낸다.<br />②: 세트되어 있는 이 카드가 효과로 파괴되었을 경우에 발동할 수 있다. 이 카드를 자신 필드에 세트한다.
  | tc_name            = 惡怪死之雨
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：自己場上存在攻擊力2000以上的水族怪獸的情況下發動，除水族怪獸以外，將場上的怪獸全部送至墓地。<br />②：被放置的此卡因效果被破壞的情況下可以發動。將此卡放置在自己場上。
  | sc_name            = 恶怪死之雨
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：自己场上存在攻击力2000以上的水族怪兽的情况下发动，除水族怪兽以外，将场上的怪兽全部送至墓地。<br />②：被放置的此卡因效果被破坏的情况下可以发动。将此卡放置在自己场上。
  }}
