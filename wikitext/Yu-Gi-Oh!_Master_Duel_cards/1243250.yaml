  | de_name            = S-Kraft Nightcatcher
  | de_text            = 2 Monster, darunter ein „S-Kraft“-Monster<br />Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst deiner Hand 1 „S-Kraft“-Zauber/Falle von deinem Deck hinzufügen. (Schnelleffekt): Du kannst diese Karte, die du kontrollierst, und 1 „S-Kraft“-Karte von deiner Hand verbannen; beschwöre 1 „S-Kraft“-Monster als Spezialbeschwörung von deinem Deck / Extra Deck, außer „S-Kraft Nightcatcher“. Du kannst jeden Effekt von „S-Kraft Nightcatcher“ nur einmal pro Spielzug verwenden.
  | it_name            = S-Forza Catturanotte
  | it_text            = 2 mostri, compreso un mostro "S-Forza"<br />Se questa carta viene Evocata Specialmente: puoi aggiungere 1 Magia/Trappola "S-Forza" dal tuo Deck alla tua mano. (Effetto Rapido): puoi bandire questa carta che controlli e 1 carta "S-Forza" nella tua mano; Evoca Specialmente 1 mostro "S-Forza" dal tuo Deck/Extra Deck, eccetto "S-Forza Catturanotte". Puoi utilizzare ogni effetto di "S-Forza Catturanotte" una sola volta per turno.
  | pt_name            = Força-S Apanhador Noturno
  | pt_text            = 2 monstros, incluindo um monstro "Força-S"<br />Se este card for Invocado por Invocação-Especial: você pode adicionar 1 Magia/Armadilha "Força-S" do seu Deck à sua mão. (Efeito Rápido): você pode banir este card que você controla e 1 card "Força-S" na sua mão; Invoque por Invocação-Especial 1 monstro "Força-S" do seu Deck/Deck Adicional, exceto "Força-S Apanhador Noturno". Você só pode usar cada efeito de "Força-S Apanhador Noturno" uma vez por turno.
  | es_name            = Fuerza-S Capturadora Nocturna
  | es_text            = 2 monstruos, incluyendo un monstruo "Fuerza-S"<br />Si esta carta es Invocada de Modo Especial: puedes añadir a tu mano 1 Mágica/Trampa "Fuerza-S" en tu Deck. (Efecto Rápido): puedes desterrar esta carta que controlas y 1 carta "Fuerza-S" en tu mano; Invoca de Modo Especial 1 monstruo "Fuerza-S" desde tu Deck/Deck Extra, excepto "Fuerza-S Capturadora Nocturna". Sólo puedes usar cada efecto de "Fuerza-S Capturadora Nocturna" una vez por turno.
  | ja_text            = 「Ｓ－Ｆｏｒｃｅ」モンスターを含むモンスター２体<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが特殊召喚した場合に発動できる。デッキから「Ｓ－Ｆｏｒｃｅ」魔法・罠カード１枚を手札に加える。<br />②：自分・相手ターンに、フィールドのこのカードと手札の「Ｓ－Ｆｏｒｃｅ」カード１枚を除外して発動できる。デッキ・ＥＸデッキから「Ｓ－Ｆｏｒｃｅ　ナイトスレイヤー」以外の「Ｓ－Ｆｏｒｃｅ」モンスター１体を特殊召喚する。
  | ko_name            = S－Force 나이트슬레이어
  | ko_text            = "S－Force(시큐리티 포스)" 몬스터를 포함하는 몬스터 2장<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 특수 소환했을 경우에 발동할 수 있다. 덱에서 "S－Force(시큐리티 포스)" 마법 / 함정 카드 1장을 패에 넣는다.<br />②: 자신 / 상대 턴에, 필드의 이 카드와 패의 "S－Force(시큐리티 포스)" 카드 1장을 제외하고 발동할 수 있다. 덱 / 엑스트라 덱에서 "S－Force(시큐리티 포스) 나이트슬레이어" 이외의 "S－Force(시큐리티 포스)" 몬스터 1장을 특수 소환한다.
  | tc_name            = 超元特防隊 暗夜屠殺者
  | tc_text            = 包含「超元特防隊」怪獸在內的怪獸2隻<br />此卡名的①②效果1回合僅可各使用1次。<br />①：此卡特殊召喚的情況下可以發動。從牌組將1張「超元特防隊」魔法・陷阱卡加入手牌。<br />②：在自己・對手回合中，將場上的此卡與手牌的1張「超元特防隊」卡除外可以發動。從牌組・額外牌組將「超元特防隊 暗夜屠殺者」以外的1隻「超元特防隊」怪獸特殊召喚。
  | sc_name            = 超元特防队 暗夜屠杀者
  | sc_text            = 包含“超元特防队”怪兽在内的怪兽2只<br />此卡名的①②效果1回合仅可各使用1次。<br />①：此卡特殊召唤的情况下可以发动。从牌组将1张“超元特防队”魔法・陷阱卡加入手牌。<br />②：在自己・对手回合中，将场上的此卡与手牌的1张“超元特防队”卡除外可以发动。从牌组・额外牌组将“超元特防队 暗夜屠杀者”以外的1只“超元特防队”怪兽特殊召唤。
