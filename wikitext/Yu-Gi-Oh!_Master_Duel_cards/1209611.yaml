  | text               = 2 Level 6 or higher DARK Fairy monsters<br />Your opponent cannot target this card with card effects. You can only use each of the following effects of "Darklord Eveningstar" once per turn. If this card is Fusion Summoned: You can Set 1 "Darklord" Spell and 1 "Darklord" Trap from your Deck. (Quick Effect): You can pay 1000 LP, then target 1 "Darklord" Spell/Trap in your GY; apply that card's activation effect, then shuffle it into the Deck.

  | fr_name            = Ange Déchu Étoile du Berger
  | fr_text            = 2 monstres TÉNÈBRES Elfe de min. Niveau 6<br />Votre adversaire ne peut pas cibler cette carte avec des effets de carte. Vous ne pouvez utiliser chacun des effets suivants de "Ange Déchu Étoile du Berger" qu'une fois par tour. Si cette carte est Invoquée par Fusion : vous pouvez Poser 1 Magie "Ange Déchu" et 1 Piège "Ange Déchu" depuis votre Deck. (Effet Rapide) : vous pouvez payer 1000 LP, puis ciblez 1 Magie/Piège "Ange Déchu" dans votre Cimetière ; appliquez l'effet d'activation de la carte, puis mélangez-la dans le Deck.
  | de_name            = Finsterlord Abendstern
  | de_text            = 2 FINSTERNIS Fee-Monster der Stufe 6 oder höher<br />Dein Gegner kann diese Karte nicht als Ziel für Karteneffekte wählen. Du kannst jeden der folgenden Effekte von „Finsterlord Abendstern“ nur einmal pro Spielzug verwenden. Falls diese Karte als Fusionsbeschwörung beschworen wird: Du kannst 1 „Finsterlord“-Zauber und 1 „Finsterlord“-Falle von deinem Deck setzen. (Schnelleffekt): Du kannst 1000 LP zahlen und dann 1 „Finsterlord“-Zauber/Falle in deinem Friedhof wählen; führe den Aktivierungseffekt jener Karte aus, dann mische sie ins Deck.
  | it_name            = Signore Oscuro Stella della Sera
  | it_text            = 2 mostri OSCURITÀ Fata di Livello 6 o superiore<br />Il tuo avversario non può scegliere questa carta come bersaglio con gli effetti delle carte. Puoi utilizzare ognuno dei seguenti effetti di "Signore Oscuro Stella della Sera" una sola volta per turno. Se questa carta viene Evocata tramite Fusione: puoi Posizionare 1 Magia "Signore Oscuro" e 1 Trappola "Signore Oscuro" dal tuo Deck. (Effetto Rapido): puoi pagare 1000 LP, poi scegliere come bersaglio 1 Magia/Trappola "Signore Oscuro" nel tuo Cimitero; applica l'effetto dell'attivazione di quella carta, poi mischiala nel Deck.
  | pt_name            = Senhor Obscuro Estrela da Noite
  | pt_text            = 2 monstros Fada de TREVAS de Nível 6 ou mais<br />Seu oponente não pode escolher este card como alvo de efeitos de card. Você só pode usar cada um dos seguintes efeitos de "Senhor Obscuro Estrela da Noite" uma vez por turno. Se este card for Invocado por Invocação-Fusão: você pode Baixar 1 Magia "Senhor(a) Obscuro(a)" e 1 Armadilha "Senhor(a) Obscuro(a)" do seu Deck. (Efeito Rápido): você pode pagar 1000 PV e, depois, escolha 1 Magia/Armadilha "Senhor(a) Obscuro(a)" no seu Cemitério; aplique o efeito de ativação desse card e, depois, embaralhe-o no Deck.
  | es_name            = Señoroscuro Estrella de la Tarde
  | es_text            = 2 monstruos Hada de OSCURIDAD de Nivel 6 o mayor<br />Tu adversario no puede seleccionar esta carta con efectos de cartas. Sólo puedes usar cada uno de los siguientes efectos de "Señoroscuro Estrella de la Tarde" una vez por turno. Si esta carta es Invocada por Fusión: puedes Colocar 1 Mágica "Señoroscuro/a" y 1 Trampa "Señoroscuro/a" desde tu Deck. (Efecto Rápido): puedes pagar 1000 LP, y después selecciona 1 Mágica/Trampa "Señoroscuro/a" en tu Cementerio; aplica el efecto de activación de esa carta, y después barájala al Deck.
  | ja_text            = レベル６以上の天使族・闇属性モンスター×２<br />このカード名の①③の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが融合召喚した場合に発動できる。デッキから「堕天使」魔法カード１枚と「堕天使」罠カード１枚を自分フィールドにセットする。<br />②：相手はフィールドのこのカードを効果の対象にできない。<br />③：自分・相手ターンに、１０００ＬＰを払い、自分の墓地の「堕天使」魔法・罠カード１枚を対象として発動できる。その魔法・罠カード発動時の効果を適用する。その後、そのカードをデッキに戻す。
  | ko_name            = 황혼의 타락천사 루시퍼
  | ko_text            = 레벨 6 이상의 천사족 / 어둠 속성 몬스터 × 2<br />이 카드명의 ①③의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 융합 소환했을 경우에 발동할 수 있다. 덱에서 "타락천사" 마법 카드 1장과 "타락천사" 함정 카드 1장을 자신 필드에 세트한다.<br />②: 상대는 필드의 이 카드를 효과의 대상으로 할 수 없다.<br />③: 자신 / 상대 턴에, 1000 LP를 지불하고, 자신 묘지의 "타락천사" 마법 / 함정 카드 1장을 대상으로 하여 발동할 수 있다. 그 마법 / 함정 카드 발동시의 효과를 적용한다. 그 후, 그 카드를 덱으로 되돌린다.
  | tc_name            = 黃昏的墮天使 路西法
  | tc_text            = 等級6以上的天使族・闇屬性怪獸×2<br />此卡名的①③效果1回合僅可各使用1次。<br />①：此卡融合召喚的情況下可以發動。從牌組將1張「墮天使」魔法卡和1張「墮天使」陷阱卡放置在自己場上。<br />②：對手不可將場上的此卡作為效果的對象。<br />③：在自己・對手回合中，支付1000LP，以自己墓地的1張「墮天使」魔法・陷阱卡為對象可以發動。適用該魔法・陷阱卡發動時的效果。然後，將該卡放回牌組。
  | sc_name            = 黄昏的堕天使 路西法
  | sc_text            = 等级6以上的天使族・暗属性怪兽×2<br />此卡名的①③效果1回合仅可各使用1次。<br />①：此卡融合召唤的情况下可以发动。从牌组将1张“堕天使”魔法卡和1张“堕天使”陷阱卡放置在自己场上。<br />②：对手不可将场上的此卡作为效果的对象。<br />③：在自己・对手回合中，支付1000LP，以自己墓地的1张“堕天使”魔法・陷阱卡为对象可以发动。适用该魔法・陷阱卡发动时的效果。然后，将该卡放回牌组。
  }}
