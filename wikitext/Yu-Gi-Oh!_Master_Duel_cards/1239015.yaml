  | text               = 2 Level 10 Plant monsters<br />You can also Xyz Summon this card by using "Teardrop the Rikka Queen" you control (transfer its materials). (Quick Effect): You can detach up to 6 materials from this card; send that many Spells/Traps from the field to the GY, then you can Tribute 1 monster on either field. You can only use this effect of "Teardrop the Rikka Sacred Queen" once per turn. Each time a monster(s) is Tributed: Attach 1 card from your opponent's GY to 1 Plant Xyz Monster you control.

  | fr_name            = Larme la Reine Sacrée Rikka
  | fr_text            = 2 monstres Plante de Niveau 10<br />Vous pouvez aussi Invoquer par Xyz cette carte en utilisant "Larme la Reine Rikka" que vous contrôlez (transférez ses Matériels). (Effet Rapide) : vous pouvez détacher max. 6 Matériels de cette carte ; envoyez autant de Magies/Pièges depuis le Terrain au Cimetière, puis vous pouvez Sacrifier 1 monstre sur l'un des Terrains. Vous ne pouvez utiliser cet effet de "Larme la Reine Sacrée Rikka" qu'une fois par tour. Chaque fois qu'un ou plusieurs monstres sont Sacrifiés : attachez 1 carte depuis le Cimetière de votre adversaire à 1 Monstre Xyz Plante que vous contrôlez.
  | de_name            = Tränenstrauß die heilige Rikka-Königin
  | de_text            = 2 Pflanze-Monster der Stufe 10<br />Du kannst diese Karte auch als Xyz-Beschwörung beschwören, indem du „Tränenstrauß die Rikka-Königin“ verwendest, die du kontrollierst (transferiere ihr Material). (Schnelleffekt): Du kannst bis zu 6 Material von dieser Karte abhängen; lege ebenso viele Zauber/Fallen vom Spielfeld auf den Friedhof, dann kannst du 1 Monster auf einer beliebigen Spielfeldseite als Tribut anbieten. Du kannst diesen Effekt von „Tränenstrauß die heilige Rikka-Königin“ nur einmal pro Spielzug verwenden. Jedes Mal, wenn ein oder mehr Monster als Tribut angeboten werden: Hänge 1 Karte vom Friedhof deines Gegners an 1 Pflanze-Xyz-Monster an, das du kontrollierst.
  | it_name            = Lacrima la Regina Sacra Rikka
  | it_text            = 2 mostri Pianta di Livello 10<br />Puoi anche Evocare Xyz questa carta utilizzando una "Lacrima la Regina Rikka" che controlli (trasferisci i suoi materiali). (Effetto Rapido): puoi staccare fino a 6 materiali da questa carta; manda quel numero di Magie/Trappole dal Terreno al Cimitero, poi puoi offrire come Tributo 1 mostro su qualsiasi Terreno. Puoi utilizzare questo effetto di "Lacrima la Regina Sacra Rikka" una sola volta per turno. Ogni volta che uno o più mostri vengono offerti come Tributo: attacca 1 carta dal Cimitero del tuo avversario a 1 Mostro Xyz Pianta che controlli.
  | pt_name            = Lágrima, a Rainha Sagrada Rikka
  | pt_text            = 2 monstros Planta de Nível 10<br />Você também pode Invocar este card por Invocação-Xyz ao usar "Lágrima, a Rainha Rikka" que você controla (transfira as matérias dele). (Efeito Rápido): você pode desassociar até 6 matérias deste card; envie esse número de Magias/Armadilhas do campo para o Cemitério e, depois, você pode oferecer como Tributo 1 monstro em qualquer campo. Você só pode usar este efeito de "Lágrima, a Rainha Sagrada Rikka" uma vez por turno. Sempre que um ou mais monstros forem oferecidos como Tributo: associe 1 card do Cemitério do seu oponente a 1 Monstro Xyz Planta que você controla.
  | es_name            = Lágrima la Sagrada Reina Rikka
  | es_text            = 2 monstruos Planta de Nivel 10<br />También puedes Invocar Xyz esta carta usando "Lágrima la Reina Rikka" que controles (transfiere sus materiales). (Efecto Rápido): puedes desacoplar hasta 6 materiales de esta carta; manda al Cementerio ese número de Mágicas/Trampas en el Campo, y después puedes Sacrificar 1 monstruo en cualquier Campo. Sólo puedes usar este efecto de "Lágrima la Sagrada Reina Rikka" una vez por turno. Cada vez que uno o más monstruos sean Sacrificados: acopla 1 carta en el Cementerio de tu adversario a 1 Monstruo Xyz Planta que controles.
  | ja_text            = 植物族レベル１０モンスター×２<br />このカードは自分フィールドの「六花聖ティアドロップ」の上に重ねてＸ召喚する事もできる。<br />このカード名の①の効果は１ターンに１度しか使用できない。<br />①：自分・相手ターンに、このカードのＸ素材を６つまで取り除いて発動できる。その数だけフィールドの魔法・罠カードを墓地へ送る。その後、自分か相手のフィールドのモンスター１体をリリースできる。<br />②：モンスターがリリースされる度に発動する。相手の墓地のカード１枚を自分フィールドの植物族Ｘモンスター１体のＸ素材にする。
  | ko_name            = 육화심성 티어드롭
  | ko_text            = 식물족 레벨 10 몬스터 × 2<br />이 카드는 자신 필드의 "육화성 티어드롭" 위에 겹쳐 엑시즈 소환할 수도 있다.<br />이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 자신 / 상대 턴에, 이 카드의 엑시즈 소재를 6개까지 제거하고 발동할 수 있다. 그 수만큼 필드의 마법 / 함정 카드를 묘지로 보낸다. 그 후, 자신이나 상대의 필드의 몬스터 1장을 릴리스할 수 있다.<br />②: 몬스터가 릴리스될 때마다 발동한다. 상대 묘지의 카드 1장을 자신 필드의 식물족 엑시즈 몬스터 1장의 엑시즈 소재로 한다.
  | tc_name            = 六花深聖淚滴花束
  | tc_text            = 植物族等級10怪獸×2<br />此卡也可重疊在自己場上的「六花聖淚滴花束」上面來超量召喚。<br />此卡名的①效果1回合僅可使用1次。<br />①：在自己・對手回合中，去除此卡的最多6個超量素材可以發動。依其數量將場上的魔法・陷阱卡送至墓地。然後，可解放自己或對手場上的1隻怪獸。<br />②：每當有怪獸被解放則發動。將對手墓地的1張卡作為自己場上1隻植物族超量怪獸的超量素材。
  | sc_name            = 六花深圣泪滴花束
  | sc_text            = 植物族等级10怪兽×2<br />此卡也可重叠在自己场上的“六花圣泪滴花束”上面来超量召唤。<br />此卡名的①效果1回合仅可使用1次。<br />①：在自己・对手回合中，去除此卡的最多6个超量素材可以发动。依其数量将场上的魔法・陷阱卡送至墓地。然后，可解放自己或对手场上的1只怪兽。<br />②：每当有怪兽被解放则发动。将对手墓地的1张卡作为自己场上1只植物族超量怪兽的超量素材。
  }}
