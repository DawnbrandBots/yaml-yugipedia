title: Aiwass, Divine Spirit of the Law (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = UR
  | attribute          = WIND
  | types              = Fiend / Effect
  | level              = 8
  | atk                = 2000
  | def                = 2800
  | text               = You can banish this card from your hand or field; add 1 "Aleister" monster from your Deck to your hand, then if this effect was activated on the field, immediately after this effect resolves, you can Normal Summon 1 Spellcaster monster. If a face-up Fusion Monster(s) you control is sent to the GY, except by battle, while this card is in your GY (except during the Damage Step): You can Special Summon this card, then you can Fusion Summon 1 "Invoked" monster from your Extra Deck, using monsters from your hand or field. You can only use each effect of "Aiwass, Divine Spirit of the Law" once per turn.

  | fr_name            = Aiwass, Esprit Divin de la Loi
  | fr_text            = Vous pouvez bannir cette carte depuis votre main ou Terrain ; ajoutez 1 monstre "Aleister" depuis votre Deck à votre main, puis si cet effet a été activé sur le Terrain, immédiatement après la résolution de cet effet, vous pouvez Invoquer Normalement 1 monstre Magicien. Si un ou plusieurs Monstres Fusion face recto que vous contrôlez sont envoyés au Cimetière, sauf au combat, tant que cette carte est dans votre Cimetière (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte, puis vous pouvez Invoquer par Fusion 1 monstre "Invokhé" depuis votre Extra Deck, en utilisant des monstres depuis votre main ou Terrain. Vous ne pouvez utiliser chaque effet de "Aiwass, Esprit Divin de la Loi" qu'une fois par tour.
  | de_name            = Aiwass, göttlicher Geist des Gesetzes
  | de_text            = Du kannst diese Karte von deiner Hand oder Spielfeldseite verbannen; füge deiner Hand 1 „Aleister“-Monster von deinem Deck hinzu, dann, falls dieser Effekt auf dem Spielfeld aktiviert wurde, kannst du, sofort nachdem dieser Effekt aufgelöst wurde, 1 Hexer-Monster als Normalbeschwörung beschwören. Falls ein oder mehr offene Fusionsmonster, die du kontrollierst, auf den Friedhof gelegt werden, außer durch Kampf, solange sich diese Karte in deinem Friedhof befindet (außer während des Damage Steps): Du kannst diese Karte als Spezialbeschwörung beschwören, dann kannst du 1 „Beschworen“-Monster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du Monster von deiner Hand oder Spielfeldseite verwendest. Du kannst jeden Effekt von „Aiwass, göttlicher Geist des Gesetzes“ nur einmal pro Spielzug verwenden.
  | it_name            = Aiwass, Spirito Divino della Legge
  | it_text            = Puoi bandire questa carta dalla tua mano o Terreno; aggiungi 1 mostro "Aleister" dal tuo Deck alla tua mano, poi se questo effetto è stato attivato sul Terreno, immediatamente dopo che questo effetto si è risolto, puoi Evocare Normalmente 1 mostro Incantatore. Se uno o più Mostri Fusione scoperti che controlli vengono mandati al Cimitero, eccetto in battaglia, mentre questa carta è nel tuo Cimitero (eccetto durante il Damage Step): puoi Evocare Specialmente questa carta, poi puoi Evocare tramite Fusione 1 mostro "Invokato" dal tuo Extra Deck, utilizzando mostri dalla tua mano o Terreno. Puoi utilizzare ogni effetto di "Aiwass, Spirito Divino della Legge" una sola volta per turno.
  | pt_name            = Aiwass, o Espírito Divino da Lei
  | pt_text            = Você pode banir este card da sua mão ou do campo; adicione 1 monstro "Aleister" do seu Deck à sua mão e, depois, se este efeito foi ativado no campo, imediatamente depois que este efeito resolver, você pode Invocar 1 monstro Mago por Invocação-Normal. Se um ou mais Monstros de Fusão com a face para cima que você controla forem enviados para o Cemitério, exceto em batalha, enquanto este card estiver no seu Cemitério (exceto durante a Etapa de Dano): você pode Invocar este card por Invocação-Especial e, depois, você pode Invocar por Invocação-Fusão 1 monstro "Invokado(a)" do seu Deck Adicional, usando monstros da sua mão ou do campo. Você só pode usar cada efeito de "Aiwass, o Espírito Divino da Lei" uma vez por turno.
  | es_name            = Aiwass, Espíritu Divino de la Ley
  | es_text            = Puedes desterrar esta carta en tu mano o Campo; añade a tu mano 1 monstruo "Aleister" en tu Deck y después, si este efecto fue activado en el Campo, inmediatamente después de que se resuelva este efecto, puedes Invocar de Modo Normal 1 monstruo Lanzador de Conjuros. Si uno o más Monstruos de Fusión boca arriba que controlas son mandados al Cementerio, excepto en batalla, mientras esta carta está en tu Cementerio (excepto durante el Damage Step): puedes Invocar esta carta de Modo Especial, y después puedes Invocar por Fusión 1 monstruo "Invokado/a" desde tu Deck Extra, usando monstruos en tu mano o Campo. Sólo puedes usar cada efecto de "Aiwass, Espíritu Divino de la Ley" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：手札・フィールドのこのカードを除外して発動できる。デッキから「アレイスター」モンスター１体を手札に加える。フィールドで発動した場合、さらに魔法使い族モンスター１体の召喚を行う事ができる。<br />②：このカードが墓地に存在する状態で、自分フィールドの表側表示の融合モンスターが戦闘以外で墓地へ送られた場合に発動できる。このカードを特殊召喚する。その後、自分の手札・フィールドのモンスターを融合素材とし、「召喚獣」モンスター１体を融合召喚できる。
  | ko_name            = 법의 신령 아이와스
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 패 / 필드의 이 카드를 제외하고 발동할 수 있다. 덱에서 "알레이스터" 몬스터 1장을 패에 넣는다. 필드에서 발동했을 경우, 추가로 마법사족 몬스터 1장의 일반 소환을 실행할 수 있다.<br />②: 이 카드가 묘지에 존재하는 상태에서, 자신 필드의 앞면 표시의 융합 몬스터가 전투 이외로 묘지로 보내졌을 경우에 발동할 수 있다. 이 카드를 특수 소환한다. 그 후, 자신의 패 / 필드의 몬스터를 융합 소재로 하고, "소환수" 몬스터 1장을 융합 소환할 수 있다.
  | tc_name            = 法之神靈 愛華斯
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：將手牌・場上的此卡除外可以發動。從牌組將1隻「阿萊斯特」怪獸加入手牌。在場上發動的情況下，進而可進行1隻魔法使族怪獸的召喚。<br />②：此卡存在於墓地的狀態下，自己場上的表側表示融合怪獸因戰鬥以外的方法被送至墓地的情況下可以發動。將此卡特殊召喚。然後，可將自己手牌・場上的怪獸作為融合素材，將1隻「召喚獸」怪獸融合召喚。
  | sc_name            = 法之神灵 爱华斯
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：将手牌・场上的此卡除外可以发动。从牌组将1只“阿莱斯特”怪兽加入手牌。在场上发动的情况下，进而可进行1只魔法师族怪兽的召唤。<br />②：此卡存在于墓地的状态下，自己场上的表侧表示融合怪兽因战斗以外的方法被送至墓地的情况下可以发动。将此卡特殊召唤。然后，可将自己手牌・场上的怪兽作为融合素材，将1只“召唤兽”怪兽融合召唤。
  }}
