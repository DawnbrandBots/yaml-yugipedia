  | atk                = 2000
  | text               = 2 monsters, including a LIGHT Fiend monster<br />During either player's turn, you can activate "Magical Musket" Spell/Trap Cards from your hand. If this card is Link Summoned: You can take 2 "Magical Musket" cards from your hand and/or Deck, including a monster, Special Summon 1 monster from it to your field, and Set the other to your opponent's field. You can only use this effect of "Magical Musket Mastermind Caspar" once per turn.

  | fr_name            = Caspar, Cerveau de la Magie de Mousquet
  | fr_text            = 2 monstres (un monstre LUMIÈRE Démon inclus)<br />Durant le tour de chaque joueur, vous pouvez activer des Cartes Magie/Piège "Magie de Mousquet" depuis votre main. Si cette carte est Invoquée par Lien : vous pouvez prendre 2 cartes "Magie de Mousquet" (un monstre inclus) depuis votre main et/ou Deck, Invoquez-en Spécialement 1 monstre sur votre Terrain et Posez l'autre sur le Terrain de votre adversaire. Vous ne pouvez utiliser cet effet de "Caspar, Cerveau de la Magie de Mousquet" qu'une fois par tour.
  | de_name            = Magischer Musketenmeister Caspar
  | de_text            = 2 Monster, darunter ein LICHT Unterweltler-Monster<br />Während des Spielzugs eines beliebigen Spielers kannst du „Magische/r Musket“-Zauber-/Fallenkarten von deiner Hand aktivieren. Falls diese Karte als Linkbeschwörung beschworen wird: Du kannst 2 „Magische/r Musket“-Karten von deiner Hand und/oder deinem Deck nehmen, darunter ein Monster, 1 Monster davon als Spezialbeschwörung auf deine Spielfeldseite beschwören und die andere auf die Spielfeldseite deines Gegners setzen. Du kannst diesen Effekt von „Magischer Musketenmeister Caspar“ nur einmal pro Spielzug verwenden.
  | it_name            = Magico Moschetto Organizzatore Caspar
  | it_text            = 2 mostri, compreso un mostro LUCE Demone<br />Durante il turno di qualsiasi giocatore, puoi attivare le Carte Magia/Trappola "Magico Moschet" dalla tua mano. Se questa carta viene Evocata Link: puoi prendere 2 carte "Magico Moschet" dalla tua mano e/o Deck, compreso un mostro, Evocare Specialmente 1 mostro tra di esse sul tuo Terreno e Posizionare l'altra sul Terreno del tuo avversario. Puoi utilizzare questo effetto di "Magico Moschetto Organizzatore Caspar" una sola volta per turno.
  | pt_name            = Mágico Mosquete Mentor Caspar
  | pt_text            = 2 monstros, incluindo um monstro Demônio de LUZ<br />Durante o turno de qualquer duelista, você pode ativar Cards de Magia/Armadilha "Mágico(a) Mosquete" da sua mão. Se este card for Invocado por Invocação-Link: você pode pegar 2 cards "Mágico(a) Mosquete" da sua mão e/ou do Deck, incluindo um monstro, Invocar por Invocação-Especial 1 monstro daí no seu campo e Baixar o outro no campo do seu oponente. Você só pode usar este efeito de "Mágico Mosquete Mentor Caspar" uma vez por turno.
  | es_name            = Mágico Mosquete Mentemaestra Caspar
  | es_text            = 2 monstruos, incluyendo un monstruo Demonio de LUZ<br />Durante el turno de cualquier jugador, puedes activar Cartas Mágicas/de Trampa "Mágico/a Mosquete" desde tu mano. Si esta carta es Invocada por Enlace: puedes tomar 2 cartas "Mágico/a Mosquete" en tu mano y/o Deck, incluyendo un monstruo, Invoca de Modo Especial 1 monstruo de ellas a tu Campo, y Coloca la otra en el Campo de tu adversario. Sólo puedes usar este efecto de "Mágico Mosquete Mentemaestra Caspar" una vez por turno.
  | ja_text            = 悪魔族・光属性モンスターを含むモンスター２体<br />このカード名の①の効果は１ターンに１度しか使用できない。<br />①：このカードがＬ召喚した場合に発動できる。手札・デッキからモンスターを含む「魔弾」カード２枚を選び、その内のモンスター１体を自分フィールドに特殊召喚し、もう１枚を相手フィールドにセットする。<br />②：このカードがモンスターゾーンに存在する限り、自分・相手ターンに自分は「魔弾」魔法・罠カードを手札から発動できる。
  | ko_name            = 마탄환의 악마 카스파르
  | ko_text            = 악마족 / 빛 속성 몬스터를 포함하는 몬스터 2장<br />이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 링크 소환했을 경우에 발동할 수 있다. 패 / 덱에서 몬스터를 포함하는 "마탄환" 카드 2장을 골라, 그 중의 몬스터 1장을 자신 필드에 특수 소환하고, 나머지 1장을 상대 필드에 세트한다.<br />②: 이 카드가 몬스터 존에 존재하는 한, 자신 / 상대 턴에 자신은 "마탄환" 마법 / 함정 카드를 패에서 발동할 수 있다.
  | tc_name            = 魔彈邪魔 卡斯帕
  | tc_text            = 包含惡魔族・光屬性怪獸在內的怪獸2隻<br />此卡名的①效果1回合僅可使用1次。<br />①：此卡連結召喚的情況下可以發動。從手牌・牌組挑選包含怪獸在內的2張「魔彈」卡，將其中的1隻怪獸特殊召喚至自己場上，另1張放置在對手場上。<br />②：只要此卡存在於怪獸區域，自己可在自己・對手回合中從手牌發動「魔彈」魔法・陷阱卡。
  | sc_name            = 魔弹邪魔 卡斯帕
  | sc_text            = 包含恶魔族・光属性怪兽在内的怪兽2只<br />此卡名的①效果1回合仅可使用1次。<br />①：此卡连接召唤的情况下可以发动。从手牌・牌组挑选包含怪兽在内的2张“魔弹”卡，将其中的1只怪兽特殊召唤至自己场上，另1张放置在对手场上。<br />②：只要此卡存在于怪兽区域，自己可在自己・对手回合中从手牌发动“魔弹”魔法・陷阱卡。
