  | text               = FLIP: You can send 1 Normal Monster from your Deck to the GY.<br />If a face-down Defense Position monster is on the field and this card is in your hand: You can Special Summon this card. You can target up to 3 face-down Defense Position monsters on the field; change them to Attack Position, then if you changed 3 monsters to Attack Position by this effect, inflict 900 damage to your opponent. You can only use each effect of "Treasure Panther" once per turn.
  | releases           = 
  Legacy Pack; September 3, 2026

  | fr_name            = Panthère de Trésors
  | fr_text            = FLIP : Vous pouvez envoyer 1 Monstre Normal depuis votre Deck au Cimetière.<br />Si un monstre en Position de Défense face verso est sur le Terrain et que cette carte est dans votre main : vous pouvez Invoquer Spécialement cette carte. Vous pouvez cibler max. 3 monstres en Position de Défense face verso sur le Terrain ; changez-les en Position d'Attaque, puis si vous avez changé 3 monstres en Position d'Attaque par cet effet, infligez 900 points de dommages à votre adversaire. Vous ne pouvez utiliser chaque effet de "Panthère de Trésors" qu'une fois par tour.
  | de_name            = Schatzpanther
  | de_text            = FLIPP: Du kannst 1 Normales Monster von deinem Deck auf den Friedhof legen.<br />Falls ein Monster in verdeckter Verteidigungsposition auf dem Spielfeld liegt und sich diese Karte in deiner Hand befindet: Du kannst diese Karte als Spezialbeschwörung beschwören. Du kannst bis zu 3 Monster in verdeckter Verteidigungsposition auf dem Spielfeld wählen; ändere sie in die Angriffsposition, dann, falls du durch diesen Effekt 3 Monster in die Angriffsposition geändert hast, füge deinem Gegner 900 Schaden zu. Du kannst jeden Effekt von „Schatzpanther“ nur einmal pro Spielzug verwenden.
  | it_name            = Pantera Tesori
  | it_text            = SCOPRI: Puoi mandare 1 Mostro Normale dal tuo Deck al Cimitero.<br />Se un mostro coperto in Posizione di Difesa è sul Terreno e questa carta è nella tua mano: puoi Evocare Specialmente questa carta. Puoi scegliere come bersaglio fino a 3 mostri coperti in Posizione di Difesa sul Terreno; mettili in Posizione di Attacco, poi se hai messo 3 mostri in Posizione di Attacco con questo effetto, infliggi 900 danni al tuo avversario. Puoi utilizzare ogni effetto di "Pantera Tesori" una sola volta per turno.
  | pt_name            = Pantera Tesouro
  | pt_text            = VIRE: Você pode enviar 1 Monstro Normal do seu Deck para o Cemitério.<br />Se um monstro com a face para baixo em Posição de Defesa estiver no campo e este card estiver na sua mão: você pode Invocar este card por Invocação-Especial. Você pode escolher até 3 monstros com a face para baixo em Posição de Defesa no campo; coloque-os em Posição de Ataque e, depois, se você colocou 3 monstros em Posição de Ataque por este efeito, cause 900 de dano ao seu oponente. Você só pode usar cada efeito de "Pantera Tesouro" uma vez por turno.
  | es_name            = Pantera del Tesoro
  | es_text            = VOLTEO: Puedes mandar al Cementerio 1 Monstruo Normal en tu Deck.<br />Si un monstruo en Posición de Defensa boca abajo está en el Campo y esta carta está en tu mano: puedes Invocar esta carta de Modo Especial. Puedes seleccionar hasta 3 monstruos en Posición de Defensa boca abajo en el Campo; cámbialos a Posición de Ataque y después, si cambiaste 3 monstruos a Posición de Ataque por este efecto, inflige 900 puntos de daño a tu adversario. Sólo puedes usar cada efecto de "Pantera del Tesoro" una vez por turno.
  | ja_text            = このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが手札に存在し、フィールドに裏側守備表示モンスターが存在する場合に発動できる。このカードを特殊召喚する。<br />②：フィールドの裏側守備表示モンスターを３体まで対象として発動できる。そのモンスターを攻撃表示にする。この効果で３体のモンスターを攻撃表示にした場合、さらに相手に９００ダメージを与える。<br />③：このカードがリバースした場合に発動できる。デッキから通常モンスター１体を墓地へ送る。
  | ko_name            = 트레져 팬서
  | ko_text            = 이 카드명의 ①②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드가 패에 존재하고, 필드에 뒷면 수비 표시 몬스터가 존재할 경우에 발동할 수 있다. 이 카드를 특수 소환한다.<br />②: 필드의 뒷면 수비 표시 몬스터를 3장까지 대상으로 하고 발동할 수 있다. 그 몬스터를 공격 표시로 한다. 이 효과로 3장의 몬스터를 공격 표시로 했을 경우, 추가로 상대에게 900 데미지를 준다.<br />③: 이 카드가 리버스했을 경우에 발동할 수 있다. 덱에서 일반 몬스터 1장을 묘지로 보낸다.
  | tc_name            = 尋寶豹
  | tc_text            = 此卡名的①②③效果1回合僅可各使用1次。<br />①：此卡存在於手牌，且場上存在裡側守備表示怪獸的情況下可以發動。將此卡特殊召喚。<br />②：以場上最多3隻裡側守備表示怪獸為對象可以發動。將該怪獸改成攻擊表示。以此效果將3隻怪獸改成了攻擊表示的情況下，進而給予對手900傷害。<br />③：此卡反轉的情況下可以發動。從牌組將1隻通常怪獸送至墓地。
  | sc_name            = 寻宝豹
  | sc_text            = 此卡名的①②③效果1回合仅可各使用1次。<br />①：此卡存在于手牌，且场上存在里侧守备表示怪兽的情况下可以发动。将此卡特殊召唤。<br />②：以场上最多3只里侧守备表示怪兽为对象可以发动。将该怪兽改成攻击表示。以此效果将3只怪兽改成了攻击表示的情况下，进而给予对手900伤害。<br />③：此卡反转的情况下可以发动。从牌组将1只通常怪兽送至墓地。
  }}
