  | fr_name   = Norden, Ancienne Entité
  | fr_text   = 2 monstres (Synchro et/ou Xyz)<br />Lorsque cette carte est Invoquée Spécialement depuis l'Extra Deck : vous pouvez cibler 1 monstre de max. Niveau 4 dans votre Cimetière ; Invoquez-le Spécialement, mais ses effets sont annulés, et aussi, bannissez-le lorsque cette carte quitte le Terrain. Vous ne pouvez utiliser cet effet de "Norden, Ancienne Entité" qu'une fois par tour.
  | de_name   = Ältestes Wesen Norden
  | de_text   = 2 Monster (Synchro und/oder Xyz)<br />Wenn diese Karte als Spezialbeschwörung vom Extra Deck beschworen wird: Du kannst 1 Monster der Stufe 4 oder niedriger in deinem Friedhof wählen; beschwöre es als Spezialbeschwörung, aber seine Effekte werden annulliert, zusätzlich verbanne es, wenn diese Karte das Spielfeld verlässt. Du kannst diesen Effekt von „Ältestes Wesen Norden“ nur einmal pro Spielzug verwenden.
  | it_name   = Entità Maggiore Norden
  | it_text   = 2 mostri (Synchro e/o Xyz)<br />Quando questa carta viene Evocata Specialmente dall'Extra Deck: puoi scegliere come bersaglio 1 mostro di Livello 4 o inferiore nel tuo Cimitero; Evocalo Specialmente, ma i suoi effetti sono annullati, inoltre bandiscilo quando questa carta lascia il Terreno. Puoi utilizzare questo effetto di "Entità Maggiore Norden" una sola volta per turno.
  | pt_name   = Entidade Anciã Norden
  | pt_text   = 2 monstros (Sincro e/ou Xyz)<br />Quando este card for Invocado por Invocação-Especial do Deck Adicional: você pode escolher 1 monstro de Nível 4 ou menos no seu Cemitério; Invoque-o por Invocação-Especial, mas seus efeitos são negados e, além disso, bana-o quando este card deixar o campo. Você só pode usar este efeito de "Entidade Anciã Norden" uma vez por turno.
  | es_name   = Entidad Antigua Norden
  | es_text   = 2 monstruos (de Sincronía y/o Xyz)<br />Cuando esta carta es Invocada de Modo Especial desde el Deck Extra: puedes seleccionar 1 monstruo de Nivel 4 o menor en tu Cementerio; Invócalo de Modo Especial, pero sus efectos son negados, y además destiérralo cuando esta carta deje el Campo. Sólo puedes usar este efecto de "Entidad Antigua Norden" una vez por turno.
  | ja_text   = Ｓ・Ｘモンスター＋Ｓ・Ｘモンスター<br />このカード名の効果は１ターンに１度しか使用できない。<br />①：このカードがＥＸデッキから特殊召喚した時、自分の墓地のレベル４以下のモンスター１体を対象として発動できる。そのモンスターを効果を無効にして特殊召喚する。このカードがフィールドから離れる時にそのモンスターは除外される。
  | ko_name   = 구신 노덴
  | ko_text   = 싱크로 / 엑시즈 몬스터 ＋ 싱크로 / 엑시즈 몬스터<br />이 카드명의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 엑스트라 덱에서 특수 소환했을 때, 자신 묘지의 레벨 4 이하의 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터를 효과를 무효로 하고 특수 소환한다. 이 카드가 필드에서 벗어날 때에 그 몬스터는 제외된다.
  | tc_name   = 舊神 諾登
  | tc_text   = 同步・超量怪獸＋同步・超量怪獸<br />此卡名的效果1回合僅可使用1次。<br />①：此卡從額外牌組特殊召喚時，以自己墓地的1隻等級4以下的怪獸為對象可以發動。將該怪獸的效果無效並特殊召喚。此卡從場上離開時該怪獸將被除外。
  | sc_name   = 旧神 诺登
