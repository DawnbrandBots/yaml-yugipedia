title: Mixousia the Confounder (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = DARK
  | types              = Spellcaster / Fusion / Effect
  | level              = 8
  | atk                = 2700
  | def                = 1500
  | text               = 1 Spellcaster monster + 1 non-Spellcaster monster<br />You can target 1 face-up monster on the field and declare 1 Attribute; it becomes that Attribute. During your opponent's Main Phase (Quick Effect): You can Fusion Summon 1 Fusion Monster from your Extra Deck, by banishing this card you control and monsters from your field or GY as material. If this card is in your GY: You can declare 1 Attribute; this card in the GY becomes that Attribute until the end of this turn. You can only use each effect of "Mixousia the Confounder" once per turn.

  | fr_name            = Mixousia la Déconcerteuse
  | fr_text            = 1 monstre Magicien + 1 monstre non-Magicien<br />Vous pouvez cibler 1 monstre face recto sur le Terrain, et déclarez 1 Attribut ; il devient cet Attribut. Durant la Main Phase de votre adversaire (Effet Rapide) : vous pouvez Invoquer par Fusion 1 Monstre Fusion depuis votre Extra Deck, en bannissant cette carte que vous contrôlez et des monstres depuis votre Terrain ou Cimetière comme Matériel. Si cette carte est dans votre Cimetière : vous pouvez déclarer 1 Attribut ; jusqu'à la fin de ce tour, cette carte dans le Cimetière devient cet Attribut. Vous ne pouvez utiliser chaque effet de "Mixousia la Déconcerteuse" qu'une fois par tour.
  | de_name            = Mixousia die Verwirrende
  | de_text            = 1 Hexer-Monster + 1 Nichthexer-Monster<br />Du kannst 1 offenes Monster auf dem Spielfeld wählen und 1 Eigenschaft deklarieren; es wird zu jener Eigenschaft. Während der Main Phase deines Gegners (Schnelleffekt): Du kannst 1 Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du diese Karte, die du kontrollierst, und Monster von deiner Spielfeldseite oder deinem Friedhof als Material verbannst. Falls sich diese Karte in deinem Friedhof befindet: Du kannst 1 Eigenschaft deklarieren; diese Karte im Friedhof wird bis zum Ende dieses Spielzugs zu jener Eigenschaft. Du kannst jeden Effekt von „Mixousia die Verwirrende“ nur einmal pro Spielzug verwenden.
  | it_name            = Mixousia, la Confonditrice
  | it_text            = 1 mostro Incantatore + 1 mostro non-Incantatore<br />Puoi scegliere come bersaglio 1 mostro scoperto sul Terreno e dichiarare 1 Attributo; esso diventa di quell'Attributo. Durante la Main Phase del tuo avversario (Effetto Rapido): puoi Evocare tramite Fusione 1 Mostro Fusione dal tuo Extra Deck, bandendo questa carta che controlli e mostri dal tuo Terreno o Cimitero come materiale. Se questa carta è nel tuo Cimitero: puoi dichiarare 1 Attributo; questa carta nel Cimitero diventa di quell'Attributo fino alla fine di questo turno. Puoi utilizzare ogni effetto di "Mixousia, la Confonditrice" una sola volta per turno.
  | pt_name            = Mixousia, a Que Confunde
  | pt_text            = 1 monstro Mago + 1 monstro não-Mago<br />Você pode escolher 1 monstro com a face para cima no campo e declarar 1 Atributo; ele se torna desse Atributo. Durante a Fase Principal do seu oponente (Efeito Rápido): você pode Invocar por Invocação-Fusão 1 Monstro de Fusão do seu Deck Adicional, ao banir este card que você controla e monstros do seu campo ou Cemitério como matéria. Se este card estiver no seu Cemitério: você pode declarar 1 Atributo; este card no Cemitério se torna desse Atributo até o final deste turno. Você só pode usar cada efeito de "Mixousia, a Que Confunde" uma vez por turno.
  | es_name            = Mixousia la Confundidora
  | es_text            = 1 monstruo Lanzador de Conjuros + 1 monstruo no Lanzador de Conjuros<br />Puedes seleccionar 1 monstruo boca arriba en el Campo y declarar 1 Atributo; éste se convierte en ese Atributo. Durante la Main Phase de tu adversario (Efecto Rápido): puedes Invocar por Fusión 1 Monstruo de Fusión desde tu Deck Extra, desterrando esta carta que controlas y monstruos en tu Campo o Cementerio como material. Si esta carta está en tu Cementerio: puedes declarar 1 Atributo; hasta el final de este turno, esta carta en el Cementerio se convierte en una carta con ese Atributo. Sólo puedes usar cada efecto de "Mixousia la Confundidora" una vez por turno.
  | ja_text            = 魔法使い族モンスター＋魔法使い族以外のモンスター<br />このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。<br />①：フィールドの表側表示モンスター１体を対象とし、属性を１つ宣言して発動できる。そのモンスターを宣言した属性にする。<br />②：相手メインフェイズに発動できる。フィールドのこのカードを含む自分のフィールド・墓地のモンスターを融合素材として除外し、融合モンスター１体を融合召喚する。<br />③：属性を１つ宣言して発動できる。墓地のこのカードはターン終了時まで宣言した属性になる。
  | ko_name            = 혼효하는 믹시아
  | ko_text            = 마법사족 몬스터 ＋ 마법사족 이외의 몬스터<br />이 카드명의 ①②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 필드의 앞면 표시 몬스터 1장을 대상으로 하고, 속성을 1개 선언하여 발동할 수 있다. 그 몬스터를 선언한 속성으로 한다.<br />②: 상대 메인 페이즈에 발동할 수 있다. 필드의 이 카드를 포함하는 자신의 필드 / 묘지의 몬스터를 융합 소재로서 제외하고, 융합 몬스터 1장을 융합 소환한다.<br />③: 속성을 1개 선언하고 발동할 수 있다. 묘지의 이 카드는 턴 종료시까지 선언한 속성이 된다.
  | tc_name            = 昏淆的米庫西亞
  | tc_text            = 魔法使族怪獸＋魔法使族以外的怪獸<br />此卡名的①②③效果1回合僅可各使用1次。<br />①：以自己場上的1隻表側表示怪獸為對象，宣言1個屬性可以發動。將該怪獸改成所宣言的屬性。<br />②：在對手的主要階段可以發動。將包含場上的此卡在內的自己場上・墓地的怪獸作為融合素材除外，將1隻融合怪獸融合召喚。<br />③：宣言1個屬性可以發動。墓地的此卡直至回合結束時為止變為所宣言的屬性。
  | sc_name            = 昏淆的米库西亚
  | sc_text            = 魔法师族怪兽＋魔法师族以外的怪兽<br />此卡名的①②③效果1回合仅可各使用1次。<br />①：以自己场上的1只表侧表示怪兽为对象，宣言1个属性可以发动。将该怪兽改成所宣言的属性。<br />②：在对手的主要阶段可以发动。将包含场上的此卡在内的自己场上・墓地的怪兽作为融合素材除外，将1只融合怪兽融合召唤。<br />③：宣言1个属性可以发动。墓地的此卡直至回合结束时为止变为所宣言的属性。
  }}
