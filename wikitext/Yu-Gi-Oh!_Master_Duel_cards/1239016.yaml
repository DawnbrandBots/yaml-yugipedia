  | text               = "Witchcrafter Madame Verre" + 2 Spellcaster monsters<br />If this card is Fusion Summoned: You can Special Summon up to 3 Level 7 or lower "Witchcrafter" monsters with different Attributes from your hand and/or Deck, also you cannot Special Summon from the Extra Deck for the rest of this turn, except Fusion Monsters. During your End Phase, if this card is in your GY: You can reveal 1 Spell in your hand; Special Summon this card in Defense Position. You can only use each effect of "Witchcrafter Madame Rilliona" once per turn.

  | fr_name            = Madame Rilliona, Artisanesorcière
  | fr_text            = "Madame Verre, Artisanesorcière" + 2 monstres Magicien<br />Si cette carte est Invoquée par Fusion : vous pouvez Invoquer Spécialement max. 3 monstres "Artisanesorcière" de max. Niveau 7 d'Attributs différents depuis votre main et/ou Deck, et aussi, vous ne pouvez pas Invoquer Spécialement (Monstres Fusion exclus) depuis l'Extra Deck le reste de ce tour. Durant votre End Phase, si cette carte est dans votre Cimetière : vous pouvez révéler 1 Magie dans votre main ; Invoquez Spécialement cette carte en Position de Défense. Vous ne pouvez utiliser chaque effet de "Madame Rilliona, Artisanesorcière" qu'une fois par tour.
  | de_name            = Hexwerkerin Madam Rilliona
  | de_text            = „Hexwerkerin Madam Verre“+ 2 Hexer-Monster<br />Falls diese Karte als Fusionsbeschwörung beschworen wird: Du kannst bis zu 3 „Hexwerker“-Monster der Stufe 7 oder niedriger mit unterschiedlichen Eigenschaften als Spezialbeschwörung von deiner Hand und/oder deinem Deck beschwören, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen vom Extra Deck durchführen, außer von Fusionsmonstern. Während deiner End Phase, falls sich diese Karte in deinem Friedhof befindet: Du kannst 1 Zauber in deiner Hand vorzeigen; beschwöre diese Karte als Spezialbeschwörung in die Verteidigungsposition. Du kannst jeden Effekt von „Hexwerkerin Madam Rilliona“ nur einmal pro Spielzug verwenden.
  | it_name            = Stregartigiana Madame Rilliona
  | it_text            = "Stregartigiana Madame Verre" + 2 mostri Incantatore<br />Se questa carta viene Evocata tramite Fusione: puoi Evocare Specialmente fino a 3 mostri "Stregartigiana" di Livello 7 o inferiore con Attributi diversi dalla tua mano e/o Deck, inoltre non puoi Evocare Specialmente dall'Extra Deck per il resto di questo turno, eccetto Mostri Fusione. Durante la tua End Phase, se questa carta è nel tuo Cimitero: puoi rivelare 1 Magia nella tua mano; Evoca Specialmente questa carta in Posizione di Difesa. Puoi utilizzare ogni effetto di "Stregartigiana Madame Rilliona" una sola volta per turno.
  | pt_name            = Fazticeira Madame Rilliona
  | pt_text            = "Fazticeira Madame Verre" + 2 monstros Mago<br />Se este card for Invocado por Invocação-Fusão: você pode Invocar por Invocação-Especial até 3 monstros "Fazticeira" de Nível 7 ou menos com Atributos diferentes da sua mão e/ou do Deck e, além disso, você não pode Invocar por Invocação-Especial do Deck Adicional pelo resto deste turno, exceto Monstros de Fusão. Durante sua Fase Final, se este card estiver no seu Cemitério: você pode revelar 1 Magia na sua mão; Invoque este card por Invocação-Especial em Posição de Defesa. Você só pode usar cada efeito de "Fazticeira Madame Rilliona" uma vez por turno.
  | es_name            = Madame Rilliona Artibruja
  | es_text            = "Madame Vidria Artibruja" + 2 monstruos Lanzador de Conjuros<br />Si esta carta es Invocada por Fusión: puedes Invocar de Modo Especial, desde tu mano y/o Deck, hasta 3 monstruos "Artibruja" de Nivel 7 o menor con Atributos diferentes, y además no puedes Invocar de Modo Especial desde el Deck Extra por el resto de este turno, excepto Monstruos de Fusión. Durante tu End Phase, si esta carta está en tu Cementerio: puedes mostrar 1 Mágica en tu mano; Invoca esta carta de Modo Especial en Posición de Defensa. Sólo puedes usar cada efecto de "Madame Rilliona Artibruja" una vez por turno.
  | ja_text            = 「ウィッチクラフトマスター・ヴェール」＋魔法使い族モンスター×２<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが融合召喚した場合に発動できる。手札・デッキからレベル７以下の「ウィッチクラフト」モンスターを３体まで特殊召喚する（同じ属性は１体まで）。このターン、自分は融合モンスターしかＥＸデッキから特殊召喚できない。<br />②：このカードが墓地に存在する場合、自分エンドフェイズに、手札の魔法カード１枚を相手に見せて発動できる。このカードを守備表示で特殊召喚する。
  | ko_name            = 위치크래프트마스터 산드리용
  | ko_text            = "위치크래프트마스터 베르" ＋ 마법사족 몬스터 × 2<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 융합 소환했을 경우에 발동할 수 있다. 패 / 덱에서 레벨 7 이하의 "위치크래프트" 몬스터를 3장까지 특수 소환한다(같은 속성은 1장까지). 이 턴에, 자신은 융합 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다.<br />②: 이 카드가 묘지에 존재할 경우, 자신 엔드 페이즈에, 패의 마법 카드 1장을 상대에게 보여주고 발동할 수 있다. 이 카드를 수비 표시로 특수 소환한다.
  | tc_name            = 魔女工藝掌門・大魔女仙杜瑞拉
  | tc_text            = 「魔女工藝掌門・玻璃匠薇兒」＋魔法使族怪獸×2<br />此卡名的①②效果1回合僅可各使用1次。<br />①：此卡融合召喚的情況下可以發動。從手牌・牌組將最多3隻等級7以下的「魔女工藝」怪獸特殊召喚（同屬性最多1隻）。此回合，自己從額外牌組僅可特殊召喚融合怪獸。<br />②：此卡存在於墓地的情況下，在自己的結束階段，向對手出示手牌的1張魔法卡可以發動。將此卡以守備表示特殊召喚。
  | sc_name            = 魔女工艺掌门・大魔女桑德里永
  | sc_text            = “魔女工艺掌门・玻璃匠薇儿”＋魔法师族怪兽×2<br />此卡名的①②效果1回合仅可各使用1次。<br />①：此卡融合召唤的情况下可以发动。从手牌・牌组将最多3只等级7以下的“魔女工艺”怪兽特殊召唤（同属性最多1只）。此回合，自己从额外牌组仅可特殊召唤融合怪兽。<br />②：此卡存在于墓地的情况下，在自己的结束阶段，向对手出示手牌的1张魔法卡可以发动。将此卡以守备表示特殊召唤。
