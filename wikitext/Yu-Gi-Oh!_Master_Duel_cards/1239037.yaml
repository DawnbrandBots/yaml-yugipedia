  | text               = If a monster(s) is Tributed (except during the Damage Step): You can Special Summon in Defense Position, both this card from your hand and 1 "Rikka" monster from your Deck, except "Primrose the Rikka Fairy Duo", also you cannot Special Summon for the rest of this turn, except Plant monsters. You can target 1 Plant monster you control; increase or decrease its Level by 2. During your opponent's Main Phase, you can (Quick Effect): Immediately after this effect resolves, Xyz Summon 1 Plant Xyz Monster. You can only use each effect of "Primrose the Rikka Fairy Duo" once per turn.

  | fr_name            = Primrose le Duo Féérique Rikka
  | fr_text            = Si un ou plusieurs monstres sont Sacrifiés (sauf durant la Damage Step) : vous pouvez Invoquer Spécialement cette carte depuis votre main ainsi qu'1 monstre "Rikka" ("Primrose le Duo Féérique Rikka" exclu) depuis votre Deck en Position de Défense, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres Plante exclus) le reste de ce tour. Vous pouvez cibler 1 monstre Plante que vous contrôlez ; augmentez ou réduisez son Niveau de 2. Durant la Main Phase de votre adversaire, vous pouvez (Effet Rapide) : immédiatement après la résolution de cet effet, Invoquez par Xyz 1 Monstre Xyz Plante. Vous ne pouvez utiliser chaque effet de "Primrose le Duo Féérique Rikka" qu'une fois par tour.
  | de_name            = Primrose das Rikka-Feenduo
  | de_text            = Falls ein oder mehr Monster als Tribut angeboten werden (außer während des Damage Steps): Du kannst sowohl diese Karte von deiner Hand als auch 1 „Rikka“-Monster von deinem Deck, außer „Primrose das Rikka-Feenduo“, als Spezialbeschwörung in die Verteidigungsposition beschwören, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen durchführen, außer von Pflanze-Monstern. Du kannst 1 Pflanze-Monster wählen, das du kontrollierst; erhöhe oder verringere seine Stufe um 2. Während der Main Phase deines Gegners kannst du (Schnelleffekt): Sofort nachdem dieser Effekt aufgelöst wurde, beschwöre 1 Pflanze-Xyz-Monster als Xyz-Beschwörung. Du kannst jeden Effekt von „Primrose das Rikka-Feenduo“ nur einmal pro Spielzug verwenden.
  | it_name            = Primrosa il Duo Fata Rikka
  | it_text            = Se uno o più mostri vengono offerti come Tributo (eccetto durante il Damage Step): puoi Evocare Specialmente in Posizione di Difesa sia questa carta dalla tua mano che 1 mostro "Rikka" dal tuo Deck, eccetto "Primrosa il Duo Fata Rikka", inoltre non puoi Evocare Specialmente per il resto di questo turno, eccetto mostri Pianta. Puoi scegliere come bersaglio 1 mostro Pianta che controlli; aumenta o diminuisci il suo Livello di 2. Durante la Main Phase del tuo avversario, puoi (Effetto Rapido): immediatamente dopo che questo effetto si è risolto, Evoca Xyz 1 Mostro Xyz Pianta. Puoi utilizzare ogni effetto di "Primrosa il Duo Fata Rikka" una sola volta per turno.
  | pt_name            = Primrosa, a Dupla de Fadas Rikka
  | pt_text            = Se um ou mais monstros forem oferecidos como Tributo (exceto durante a Etapa de Dano): você pode Invocar por Invocação-Especial em Posição de Defesa, tanto este card da sua mão quanto 1 monstro "Rikka" do seu Deck, exceto "Primrosa, a Dupla de Fadas Rikka", e, além disso, você não pode Invocar por Invocação-Especial pelo resto deste turno, exceto monstros Planta. Você pode escolher 1 monstro Planta que você controla; aumente ou diminua o Nível dele em 2. Durante a Fase Principal do seu oponente, você pode (Efeito Rápido): imediatamente depois que este efeito resolver, Invocar por Invocação-Xyz 1 Monstro Xyz Planta. Você só pode usar cada efeito de "Primrosa, a Dupla de Fadas Rikka" uma vez por turno.
  | es_name            = Rosaprímula el Dúo de Hadas Rikka
  | es_text            = Si uno o más monstruos son Sacrificados (excepto durante el Damage Step): puedes Invocar de Modo Especial en Posición de Defensa, esta carta desde tu mano así como 1 monstruo "Rikka" desde tu Deck, excepto "Rosaprímula el Dúo de Hadas Rikka", y además no puedes Invocar de Modo Especial por el resto de este turno, excepto monstruos Planta. Puedes seleccionar 1 monstruo Planta que controles; aumenta o reduce su Nivel en 2. Durante la Main Phase de tu adversario, puedes (Efecto Rápido): inmediatamente después de que se resuelva este efecto, Invocar Xyz 1 Monstruo Xyz Planta. Sólo puedes usar cada efecto de "Rosaprímula el Dúo de Hadas Rikka" una vez por turno.
  | ja_text            = このカード名の①②③の効果はそれぞれ１ターンに１度しか使用できない。<br />①：モンスターがリリースされた場合に発動できる。「六花双精プリムローズ」以外のデッキの「六花」モンスター１体と、手札のこのカードを守備表示で特殊召喚する。この効果の発動後、ターン終了時まで自分は植物族モンスターしか特殊召喚できない。<br />②：自分フィールドの植物族モンスター１体を対象として発動できる。そのモンスターのレベルを２つ上げるか下げる。<br />③：相手メインフェイズに発動できる。植物族Ｘモンスター１体のＸ召喚を行う。
  | ko_name            = 육화쌍정 프림로즈
  | ko_text            = 이 카드명의 ①②③의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 몬스터가 릴리스되었을 경우에 발동할 수 있다. "육화쌍정 프림로즈" 이외의 덱의 "육화" 몬스터 1장과, 패의 이 카드를 수비 표시로 특수 소환한다. 이 효과의 발동 후, 턴 종료시까지 자신은 식물족 몬스터밖에 특수 소환할 수 없다.<br />②: 자신 필드의 식물족 몬스터 1장을 대상으로 하고 발동할 수 있다. 그 몬스터의 레벨을 2개 올리거나 내린다.<br />③: 상대 메인 페이즈에 발동할 수 있다. 식물족 엑시즈 몬스터 1장의 엑시즈 소환을 실행한다.
  | tc_name            = 六花雙精報春薔薇
  | tc_text            = 此卡名的①②③效果1回合僅可各使用1次。<br />①：有怪獸被解放的情況下可以發動。將「六花雙精報春薔薇」以外的、牌組的1隻「六花」怪獸，和手牌的此卡以守備表示特殊召喚。此效果發動後，直至回合結束時為止自己僅可特殊召喚植物族怪獸。<br />②：以自己場上的1隻植物族怪獸為對象可以發動。該怪獸的等級上升或下降2。<br />③：在對手的主要階段可以發動。進行1隻植物族超量怪獸的超量召喚。
  | sc_name            = 六花双精报春蔷薇
  | sc_text            = 此卡名的①②③效果1回合仅可各使用1次。<br />①：有怪兽被解放的情况下可以发动。将“六花双精报春蔷薇”以外的、牌组的1只“六花”怪兽，和手牌的此卡以守备表示特殊召唤。此效果发动后，直至回合结束时为止自己仅可特殊召唤植物族怪兽。<br />②：以自己场上的1只植物族怪兽为对象可以发动。该怪兽的等级上升或下降2。<br />③：在对手的主要阶段可以发动。进行1只植物族超量怪兽的超量召唤。
  }}
