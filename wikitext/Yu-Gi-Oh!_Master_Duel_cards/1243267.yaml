title: Yomagna the Fire Phantom (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = DARK
  | types              = Pyro / Effect
  | level              = 10
  | atk                = 3300
  | def                = 0
  | text               = Cannot be Normal Summoned/Set. Must first be Special Summoned (from your hand) by shuffling 3 cards of the same type (Monster, Spell, or Trap) from your GY into the Deck/Extra Deck. If this card is Special Summoned: You can declare 1 Monster Type; this card becomes that Type until the end of this turn. During your Main Phase: You can Fusion Summon 1 Fusion Monster from your Extra Deck using monsters on either field, including this card. You can only use each effect of "Yomagna the Fire Phantom" once per turn.

  | fr_name            = Yomagna le Fantôme du Feu
  | fr_text            = Ni Invocable Normalement ni Posable Normalement. Doit d'abord être Invoquée Spécialement (depuis votre main) en mélangeant 3 cartes du même type (Monstre, Magie ou Piège) depuis votre Cimetière dans le Deck/Extra Deck. Si cette carte est Invoquée Spécialement : vous pouvez déclarer 1 Type de Monstre ; jusqu'à la fin de ce tour, cette carte devient ce Type. Durant votre Main Phase : vous pouvez Invoquer par Fusion 1 Monstre Fusion depuis votre Extra Deck, en utilisant des monstres (cette carte incluse) sur au moins l'un des Terrains. Vous ne pouvez utiliser chaque effet de "Yomagna le Fantôme du Feu" qu'une fois par tour.
  | de_name            = Yomagna das Feuerphantom
  | de_text            = Kann nicht als Normalbeschwörung beschworen/gesetzt werden. Muss erst als Spezialbeschwörung (von deiner Hand) beschworen werden, indem du 3 Karten desselben Typs (Monster, Zauber oder Falle) von deinem Friedhof ins Deck / Extra Deck mischst. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst 1 Monstertyp deklarieren; diese Karte wird bis zum Ende dieses Spielzugs zu jenem Typ. Während deiner Main Phase: Du kannst 1 Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du Monster von beliebigen Spielfeldseiten verwendest, darunter diese Karte. Du kannst jeden Effekt von „Yomagna das Feuerphantom“ nur einmal pro Spielzug verwenden.
  | it_name            = Yomagna lo Spettro del Fuoco
  | it_text            = Non può essere Evocato Normalmente/Posizionato. Deve prima essere Evocato Specialmente (dalla tua mano) mischiando 3 carte dello stesso tipo (Mostro, Magia o Trappola) dal tuo Cimitero nel Deck/Extra Deck. Se questa carta viene Evocata Specialmente: puoi dichiarare 1 Tipo di Mostro; questa carta diventa di quel Tipo fino alla fine di questo turno. Durante la tua Main Phase: puoi Evocare tramite Fusione 1 Mostro Fusione dal tuo Extra Deck utilizzando mostri su qualsiasi Terreno, compresa questa carta. Puoi utilizzare ogni effetto di "Yomagna lo Spettro del Fuoco" una sola volta per turno.
  | pt_name            = Yomagna, o Fantasma do Fogo
  | pt_text            = Não pode ser Invocado por Invocação-Normal/Baixado. Primeiro deve ser Invocado por Invocação-Especial (da sua mão) ao embaralhar 3 cards do mesmo tipo (Monstro, Magia ou Armadilha) do seu Cemitério no Deck/Deck Adicional. Se este card for Invocado por Invocação-Especial: você pode declarar 1 Tipo de Monstro; este card se torna desse Tipo até o final deste turno. Durante sua Fase Principal: você pode Invocar por Invocação-Fusão 1 Monstro de Fusão do seu Deck Adicional, usando monstros em qualquer campo, incluindo este card. Você só pode usar cada efeito de "Yomagna, o Fantasma do Fogo" uma vez por turno.
  | es_name            = Yomagna el Fantasma de Fuego
  | es_text            = No puede ser Invocado de Modo Normal/Colocado. Debe ser primero Invocado de Modo Especial (desde tu mano) barajando al Deck/Deck Extra 3 cartas del mismo tipo (Monstruo, Mágica o Trampa) en tu Cementerio. Si esta carta es Invocada de Modo Especial: puedes declarar 1 Tipo de Monstruo; esta carta se convierte en ese Tipo hasta el final de este turno. Durante tu Main Phase: puedes Invocar por Fusión 1 Monstruo de Fusión desde tu Deck Extra usando monstruos en cualquier Campo, incluyendo esta carta. Sólo puedes usar cada efecto de "Yomagna el Fantasma de Fuego" una vez por turno.
  | ja_text            = このカードは通常召喚できない。<br />自分の墓地から同じ種類（モンスター・魔法・罠）のカード３枚をデッキ・ＥＸデッキに戻した場合に特殊召喚できる。<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが特殊召喚した場合、種族を１つ宣言して発動できる。このカードはターン終了時まで宣言した種族になる。<br />②：自分メインフェイズに発動できる。このカードを含む自分・相手フィールドのモンスターを融合素材とし、融合モンスター１体を融合召喚する。
  | ko_name            = 화염 환성＝요마그아
  | ko_text            = 이 카드는 통상 소환할 수 없다.<br />같은 종류(몬스터 / 마법 / 함정)의 카드 3장을 자신 묘지에서 덱 / 엑스트라 덱으로 되돌렸을 경우에 특수 소환할 수 있다.<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 특수 소환했을 경우, 종족을 1개 선언하고 발동할 수 있다. 이 카드는 턴 종료시까지 선언한 종족이 된다.<br />②: 자신 메인 페이즈에 발동할 수 있다. 이 카드를 포함하는 자신 / 상대 필드의 몬스터를 융합 소재로 하고, 융합 몬스터 1장을 융합 소환한다.
  | tc_name            = 炎幻星 尤瑪古阿
  | tc_text            = 此卡不可通常召喚。<br />從自己墓地將3張相同種類（怪獸・魔法・陷阱）卡放回牌組・額外牌組的情況下可以特殊召喚。<br />此卡名的①②效果1回合僅可各使用1次。<br />①：此卡特殊召喚的情況下，宣言1個種族可以發動。此卡直至回合結束時為止變為所宣言的種族。<br />②：在自己的主要階段可以發動。將包含此卡在內的自己・對手場上的怪獸作為融合素材，將1隻融合怪獸融合召喚。
  | sc_name            = 炎幻星 尤玛古阿
  | sc_text            = 此卡不可通常召唤。<br />从自己墓地将3张相同种类（怪兽・魔法・陷阱）卡放回牌组・额外牌组的情况下可以特殊召唤。<br />此卡名的①②效果1回合仅可各使用1次。<br />①：此卡特殊召唤的情况下，宣言1个种族可以发动。此卡直至回合结束时为止变为所宣言的种族。<br />②：在自己的主要阶段可以发动。将包含此卡在内的自己・对手场上的怪兽作为融合素材，将1只融合怪兽融合召唤。
  }}
