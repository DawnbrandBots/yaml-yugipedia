title: Madolche Ticket (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity    = R
  | card_type = Spell
  | property  = Continuous
  | text      = If another "Madolche" card(s) in your face-up field or GY is added to your hand or shuffled into your Main Deck by card effect: Add 1 "Madolche" monster from your Deck to your hand, or if you control a Fairy "Madolche" monster, you can Special Summon that monster in Attack Position instead. You can only use this effect of "Madolche Ticket" once per turn.

  | fr_name   = Ticket Magidolce
  | fr_text   = Si une ou plusieurs autres cartes "Magidolce" dans votre Terrain face recto ou Cimetière sont ajoutées à votre main ou mélangées dans votre Main Deck par un effet de carte : ajoutez 1 monstre "Magidolce" depuis votre Deck à votre main, ou si vous contrôlez un monstre "Magidolce" Elfe, vous pouvez Invoquer Spécialement le monstre en Position d'Attaque à la place. Vous ne pouvez utiliser cet effet de "Ticket Magidolce" qu'une fois par tour.
  | de_name   = Magidolce-Eintrittskarte
  | de_text   = Falls eine oder mehr andere „Magidolce“-Karten durch einen Karteneffekt von deinem Friedhof oder offen von deiner Spielfeldseite deiner Hand hinzugefügt oder in dein Main Deck gemischt werden: Füge deiner Hand 1 „Magidolce“-Monster von deinem Deck hinzu oder falls du ein „Magidolce“-Fee-Monster kontrollierst, kannst du jenes Monster stattdessen als Spezialbeschwörung in die Angriffsposition beschwören. Du kannst diesen Effekt von „Magidolce-Eintrittskarte“ nur einmal pro Spielzug verwenden.
  | it_name   = Biglietto Magidolce
  | it_text   = Se una o più altre carte "Magidolce" nel tuo Terreno scoperto o Cimitero vengono aggiunte alla tua mano o mischiate nel tuo Main Deck dall'effetto di una carta: aggiungi 1 mostro "Magidolce" dal tuo Deck alla tua mano o, se controlli un mostro "Magidolce" Fata, puoi invece Evocare Specialmente quel mostro in Posizione di Attacco. Puoi utilizzare questo effetto di "Biglietto Magidolce" una sola volta per turno.
  | pt_name   = Bilhete Magidoce
  | pt_text   = Se um ou mais outros cards "Magidoce" no seu campo com a face para cima ou Cemitério forem adicionados à sua mão ou embaralhados no seu Deck Principal por um efeito de card: adicione 1 monstro "Magidoce" do seu Deck à sua mão ou, se você controlar um monstro Fada "Magidoce", em vez disso, você pode Invocar esse monstro por Invocação-Especial em Posição de Ataque. Você só pode usar este efeito de "Bilhete Magidoce" uma vez por turno.
  | es_name   = Boleto Magidulce
  | es_text   = Si otra u otras cartas "Magidulce" en tu Campo boca arriba o Cementerio son añadidas a tu mano o barajadas a tu Deck Principal por un efecto de carta: añade a tu mano 1 monstruo "Magidulce" en tu Deck o, si controlas un monstruo "Magidulce" Hada, puedes Invocar ese monstruo de Modo Especial en Posición de Ataque en su lugar. Sólo puedes usar este efecto de "Boleto Magidulce" una vez por turno.
  | ja_text   = このカード名の①の効果は１ターンに１度しか使用できない。<br />①：このカードが魔法＆罠ゾーンに存在する状態で、自分のフィールド（表側表示）・墓地の「マドルチェ」カードが効果で自分の手札・デッキに戻った場合に発動する。デッキから「マドルチェ」モンスター１体を手札に加える。自分フィールドに天使族の「マドルチェ」モンスターが存在する場合、手札に加えず攻撃表示で特殊召喚する事もできる。
  | ko_name   = 마돌체 티켓
  | ko_text   = 이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드가 마법 & 함정 존에 존재하는 상태에서, 자신의 필드(앞면 표시) / 묘지의 "마돌체" 카드가 효과로 자신의 패 / 덱으로 되돌아갔을 경우에 발동한다. 덱에서 "마돌체" 몬스터 1장을 패에 넣는다. 자신 필드에 천사족인 "마돌체" 몬스터가 존재할 경우, 패에 넣지 않고 공격 표시로 특수 소환할 수도 있다.
  | tc_name   = 魔法甜點・券
  | tc_text   = 此卡名的①效果，１回合僅限使用１次。<br />①：在我方場上・墓地的此卡以外的「魔法甜點」卡因效果回到我方手牌・牌組的狀況下發動。從牌組將１隻「魔法甜點」怪獸加入手牌。在我方場上存在天使族「魔法甜點」怪獸的狀況下，可不加入手牌以攻擊表示特殊召喚。
  | sc_name   = 魔幻甜点・邀请函
  | sc_text   = 我方场上、墓地中冠有“魔幻甜点”之名的卡牌因卡牌效果返回至我方手牌、牌组时，从牌组将１只冠有“魔幻甜点”之名的怪兽加入手牌。我方场上存在冠有“魔幻甜点”之名的天使族怪兽的场合，也可不加入手牌以攻击表示特殊召唤。“魔幻甜点券”的效果１回合只可使用１次。
  }}
