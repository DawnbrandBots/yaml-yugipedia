title: Witchcrafter Walpurgis (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = UR
  | card_type          = Spell
  | property           = Field
  | text               = During your Main Phase: You can add 1 "Witchcrafter" monster from your Deck to your hand, then discard 1 card. You can only use this effect of "Witchcrafter Walpurgis" once per turn. During your turn, if a "Witchcrafter" monster you control would discard to activate an effect, you can send 1 "Witchcrafter" Spell/Trap from your Deck to the GY instead, except "Witchcrafter Walpurgis".

  | fr_name            = Walpurgis Artisanesorcière
  | fr_text            = Durant votre Main Phase : vous pouvez ajouter 1 monstre "Artisanesorcière" depuis votre Deck à votre main, puis défaussez 1 carte. Vous ne pouvez utiliser cet effet de "Walpurgis Artisanesorcière" qu'une fois par tour. Durant votre tour, si un monstre "Artisanesorcière" que vous contrôlez va défausser pour activer un effet, vous pouvez envoyer 1 Magie/Piège "Artisanesorcière" ("Walpurgis Artisanesorcière" exclu) depuis votre Deck au Cimetière à la place.
  | de_name            = Hexwerker-Walpurgis
  | de_text            = Während deiner Main Phase: Du kannst deiner Hand 1 „Hexwerker“-Monster von deinem Deck hinzufügen, dann wirf 1 Karte ab. Du kannst diesen Effekt von „Hexwerker-Walpurgis“ nur einmal pro Spielzug verwenden. Während deines Spielzugs, falls du abwerfen würdest, um den Effekt eines „Hexwerker“-Monsters zu aktivieren, das du kontrollierst, kannst du stattdessen 1 „Hexwerker“-Zauber/Falle von deinem Deck auf den Friedhof legen, außer „Hexwerker-Walpurgis“.
  | it_name            = Valpurga Stregartigiana
  | it_text            = Durante la tua Main Phase: puoi aggiungere 1 mostro "Stregartigiana" dal tuo Deck alla tua mano, poi scartare 1 carta. Puoi utilizzare questo effetto di "Valpurga Stregartigiana" una sola volta per turno. Durante il tuo turno, se un mostro "Stregartigiana" che controlli sta per scartare per attivare un effetto, puoi invece mandare 1 Magia/Trappola "Stregartigiana" dal tuo Deck al Cimitero, eccetto "Valpurga Stregartigiana".
  | pt_name            = Valburga Fazticeira
  | pt_text            = Durante sua Fase Principal: você pode adicionar 1 monstro "Fazticeira" do seu Deck à sua mão e, depois, descarte 1 card. Você só pode usar este efeito de "Valburga Fazticeira" uma vez por turno. Durante o seu turno, se um monstro "Fazticeira" que você controla descartaria para ativar um efeito, em vez disso, você pode enviar 1 Magia/Armadilha "Fazticeira" do seu Deck para o Cemitério, exceto "Valburga Fazticeira".
  | es_name            = Walpurgis Artibruja
  | es_text            = Durante tu Main Phase: puedes añadir a tu mano 1 monstruo "Artibruja" en tu Deck, y después descarta 1 carta. Sólo puedes usar este efecto de "Walpurgis Artibruja" una vez por turno. Durante tu turno, si un monstruo "Artibruja" que controlas fuera a descartar para activar un efecto, puedes mandar al Cementerio 1 Mágica/Trampa "Artibruja" en tu Deck en su lugar, excepto "Walpurgis Artibruja".
  | ja_text            = このカード名の①の効果は１ターンに１度しか使用できない。<br />①：自分メインフェイズに発動できる。デッキから「ウィッチクラフト」モンスター１体を手札に加える。その後、自分の手札を１枚選んで捨てる。<br />②：自分ターンに、自分フィールドの「ウィッチクラフト」モンスターの効果を発動するために手札を捨てる場合、代わりにデッキから「魔女の聖夜行」以外の「ウィッチクラフト」魔法・罠カード１枚を墓地へ送る事ができる。
  | ko_name            = 위치크래프트 발푸르기스
  | ko_text            = 이 카드명의 ①의 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 자신 메인 페이즈에 발동할 수 있다. 덱에서 "위치크래프트" 몬스터 1장을 패에 넣는다. 그 후, 자신의 패를 1장 고르고 버린다.<br />②: 자신 턴에, 자신 필드의 "위치크래프트" 몬스터의 효과를 발동하기 위해 패를 버릴 경우, 대신에 덱에서 "위치크래프트 발푸르기스" 이외의 "위치크래프트" 마법 / 함정 카드 1장을 묘지로 보낼 수 있다.
  | tc_name            = 魔女工藝・瓦爾普吉斯夜行
  | tc_text            = 此卡名的①效果1回合僅可使用1次。<br />①：在自己的主要階段可以發動。從牌組將1隻「魔女工藝」怪獸加入手牌。然後，挑選自己的1張手牌捨棄。<br />②：在自己回合，為發動自己場上的「魔女工藝」怪獸的效果而要將手牌捨棄的情況下，作為代替可從牌組將「魔女工藝・瓦爾普吉斯夜行」以外的1張「魔女工藝」魔法・陷阱卡送至墓地。
  | sc_name            = 魔女工艺・瓦尔普吉斯夜行
  | sc_text            = 此卡名的①效果1回合仅可使用1次。<br />①：在自己的主要阶段可以发动。从牌组将1只“魔女工艺”怪兽加入手牌。然后，挑选自己的1张手牌舍弃。<br />②：在自己回合，为发动自己场上的“魔女工艺”怪兽的效果而要将手牌舍弃的情况下，作为代替可从牌组将“魔女工艺・瓦尔普吉斯夜行”以外的1张“魔女工艺”魔法・陷阱卡送至墓地。
  }}
