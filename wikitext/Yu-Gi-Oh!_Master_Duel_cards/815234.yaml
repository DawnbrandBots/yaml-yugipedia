  | fr_name   = Grenouille Licorne
  | fr_text   = Peut attaquer directement. Lorsque cette carte inflige des dommages de combat à votre adversaire par une attaque directe : vous pouvez cibler 1 Magie/Piège contrôlé par votre adversaire ; détruisez la cible. Vous devez contrôler un monstre "Grenouille" face recto ("Grenouille Licorne" exclu) pour activer et résoudre cet effet.
  | de_name   = Einhornfrosch
  | de_text   = Kann direkt angreifen. Wenn diese Karte deinem Gegner Kampfschaden durch einen direkten Angriff zufügt: Du kannst 1 Zauber/Falle wählen, den oder die dein Gegner kontrolliert; zerstöre jenes gewählte Ziel. Du musst ein offenes „Frosch“-Monster kontrollieren, außer „Einhornfrosch“, um diesen Effekt zu aktivieren und aufzulösen.
  | it_name   = UniRANA
  | it_text   = Può attaccare direttamente. Quando questa carta infligge danno da combattimento al tuo avversario con un attacco diretto: puoi scegliere come bersaglio 1 Magia/Trappola controllata dal tuo avversario; distruggi quel bersaglio. Devi controllare un mostro "RANA" scoperto diverso da "UniRANA" per attivare e risolvere questo effetto.
  | pt_name   = Unissapo
  | pt_text   = Pode atacar diretamente. Quando este card causar dano de batalha ao seu oponente em um ataque direto: você pode escolher 1 Magia/Armadilha que seu oponente controla; destrua o alvo. Você deve controlar um monstro "Sapo" com a face para cima que não seja "Unissapo" para ativar e resolver este efeito.
  | es_name   = UniRANA
  | es_text   = Puede atacar directamente. Cuando esta carta inflige daño de batalla a tu adversario por un ataque directo: puedes seleccionar 1 Mágica/Trampa que controle tu adversario; destruye ese objetivo. Debes controlar un monstruo "RANA" boca arriba que no sea "UniRANA" para activar y resolver este efecto.
  | ja_text   = ①：このカードは直接攻撃できる。<br />②：このカードが直接攻撃で相手に戦闘ダメージを与えた時、相手フィールドの魔法・罠カード１枚を対象として発動できる（この効果は自分フィールドに「貫ガエル」以外の「ガエル」モンスターが存在する場合に発動と処理ができる）。その相手のカードを破壊する。
  | ko_name   = 뿔 개구리
  | ko_text   = 이 카드는 상대 플레이어를 직접 공격할 수 있다. 이 카드가 직접 공격에 성공했을 때, 자신 필드 위에 "뿔 개구리" 이외의 "개구리"라는 이름이 붙은 몬스터가 존재할 경우, 상대 필드 위의 마법/함정 카드 1장을 파괴할 수 있다.
  | tc_name   = 貫青蛙
  | tc_text   = 此卡可直接攻擊對方玩家。此卡透過直接攻擊給予對方LP戰鬥傷害時，在我方場上存在「貫青蛙」以外冠有「青蛙」之名怪獸的狀況下，可選擇對方場上的１張魔法・陷阱卡破壞。
  | sc_name   = 贯青蛙
  | sc_text   = 此卡可直接攻击对手玩家。因此卡直接攻击而给予对手生命战斗伤害时，我方场上有除“贯青蛙”以外的冠有“青蛙”之名的怪兽存在的场合，可选择对手场上的１张魔法、陷阱卡破坏。
  }}
