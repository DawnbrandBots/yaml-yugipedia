title: Witchcrafter Seed (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = N
  | attribute          = WIND
  | types              = Spellcaster / Effect
  | level              = 4
  | atk                = 1300
  | def                = 1500
  | text               = If this card is Normal or Special Summoned, and you control "Regulus, the Prince of Endymion" or a "Witchcrafter" monster, except "Witchcrafter Seed": You can target 1 face-up card on the field; return it to the hand. You can banish this card from your GY; reveal any number of cards in your hand, including a Spell, shuffle them into the Deck, then draw cards equal to the number shuffled. You can only use each effect of "Witchcrafter Seed" once per turn.

  | fr_name            = Seed, Artisanesorcière
  | fr_text            = Si cette carte est Invoquée Normalement ou Spécialement, et que vous contrôlez "Regulus, le Prince d'Endymion" ou un monstre "Artisanesorcière" ("Seed, Artisanesorcière" exclu) : vous pouvez cibler 1 carte face recto sur le Terrain ; renvoyez-la à la main. Vous pouvez bannir cette carte depuis votre Cimetière ; révélez un nombre de votre choix de cartes (une Magie incluse) dans votre main, mélangez-les dans le Deck, puis piochez un nombre de cartes égal au nombre mélangé. Vous ne pouvez utiliser chaque effet de "Seed, Artisanesorcière" qu'une fois par tour.
  | de_name            = Hexwerkerin Seed
  | de_text            = Falls diese Karte als Normal- oder Spezialbeschwörung beschworen wird und du „Regulus, der Prinz von Endymion“ oder ein „Hexwerker“-Monster kontrollierst, außer „Hexwerkerin Seed“: Du kannst 1 offene Karte auf dem Spielfeld wählen; gib sie auf die Hand zurück. Du kannst diese Karte von deinem Friedhof verbannen; zeige eine beliebige Anzahl Karten in deiner Hand vor, darunter einen Zauber, mische sie ins Deck, dann ziehe Karten in Höhe der gemischten Anzahl. Du kannst jeden Effekt von „Hexwerkerin Seed“ nur einmal pro Spielzug verwenden.
  | it_name            = Stregartigiana Seme
  | it_text            = Se questa carta viene Evocata Normalmente o Specialmente, e tu controlli "Regulus, il Principe di Endymion" o un mostro "Stregartigiana", eccetto "Stregartigiana Seme": puoi scegliere come bersaglio 1 carta scoperta sul Terreno; falla ritornare nella mano. Puoi bandire questa carta dal tuo Cimitero; rivela un qualsiasi numero di carte nella tua mano, compresa una Magia, mischiale nel Deck, poi pesca carte pari al numero mischiato. Puoi utilizzare ogni effetto di "Stregartigiana Seme" una sola volta per turno.
  | pt_name            = Fazticeira Semente
  | pt_text            = Se este card for Invocado por Invocação-Normal ou Especial e você controlar "Regulus, o Príncipe de Endymion" ou um monstro "Fazticeira", exceto "Fazticeira Semente": você pode escolher 1 card com a face para cima no campo; devolva-o para a mão. Você pode banir este card do seu Cemitério; revele qualquer número de cards na sua mão, incluindo uma Magia, embaralhe-os no Deck e, depois, compre cards igual ao número embaralhado. Você só pode usar cada efeito de "Fazticeira Semente" uma vez por turno.
  | es_name            = Semilla Artibruja
  | es_text            = Si esta carta es Invocada de Modo Normal o Especial, y controlas "Regulus, el Príncipe de Endimión" o un monstruo "Artibruja", excepto "Semilla Artibruja": puedes seleccionar 1 carta boca arriba en el Campo; devuélvela a la mano. Puedes desterrar esta carta en tu Cementerio; muestra cualquier número de cartas en tu mano, incluyendo una Mágica, barájalas al Deck, y después roba cartas iguales al número barajado. Sólo puedes usar cada efecto de "Semilla Artibruja" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが召喚・特殊召喚した場合、自分フィールドに「ウィッチクラフト・シード」以外の「ウィッチクラフト」モンスターか「聖月の皇太子レグルス」が存在していれば、フィールドの表側表示カード１枚を対象として発動できる。そのカードを手札に戻す。<br />②：墓地のこのカードを除外して発動できる。魔法カードを含む手札のカードを任意の数だけ相手に見せ、デッキに戻す。その後、自分は戻した数だけドローする。
  | ko_name            = 위치크래프트 시드
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 일반 소환 / 특수 소환했을 경우, 자신 필드에 "위치크래프트 시드" 이외의 "위치크래프트" 몬스터나 "프린스 오브 엔디미온 레굴루스"가 존재하고 있으면, 필드의 앞면 표시 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 패로 되돌린다.<br />②: 묘지의 이 카드를 제외하고 발동할 수 있다. 마법 카드를 포함하는 패의 카드를 임의의 수만큼 상대에게 보여주고, 덱으로 되돌린다. 그 후, 자신은 되돌린 수만큼 드로우한다.
  | tc_name            = 魔女工藝・育種希德
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：此卡召喚・特殊召喚的情況下，如果自己場上存在「魔女工藝・育種希德」以外的「魔女工藝」怪獸或「恩底彌翁之聖月皇太子 雷格魯斯」，則以場上的1張表側表示卡為對象可以發動。將該卡放回手牌。<br />②：將墓地的此卡除外可以發動。將包含魔法卡在內的、手牌任意數量的卡出示給對手並放回牌組。然後，自己依放回的數量抽牌。
  | sc_name            = 魔女工艺・育种希德
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：此卡召唤・特殊召唤的情况下，如果自己场上存在“魔女工艺・育种希德”以外的“魔女工艺”怪兽或“恩底弥翁之圣月皇太子 雷格鲁斯”，则以场上的1张表侧表示卡为对象可以发动。将该卡放回手牌。<br />②：将墓地的此卡除外可以发动。将包含魔法卡在内的、手牌任意数量的卡出示给对手并放回牌组。然后，自己依放回的数量抽牌。
  }}
