  | text               = If this card is in your hand: You can target 1 "Witchcrafter" card in your GY, except "Witchcrafter Terracottan"; add it to your hand, and if you do, Special Summon this card, also you cannot Special Summon from the Extra Deck for the rest of this turn, except "Witchcrafter" monsters. During your Main Phase: You can Fusion Summon 1 "Witchcrafter" Fusion Monster from your Extra Deck, using monsters from your hand or field. You can only use each effect of "Witchcrafter Terracottan" once per turn.

  | fr_name            = Terracottan, Artisanesorcière
  | fr_text            = Si cette carte est dans votre main : vous pouvez cibler 1 carte "Artisanesorcière" ("Terracottan, Artisanesorcière" exclu) dans votre Cimetière ; ajoutez-la à votre main, et si vous le faites, Invoquez Spécialement cette carte, et aussi, vous ne pouvez pas Invoquer Spécialement (monstres "Artisanesorcière" exclus) depuis l'Extra Deck le reste de ce tour. Durant votre Main Phase : vous pouvez Invoquer par Fusion 1 Monstre Fusion "Artisanesorcière" depuis votre Extra Deck, en utilisant des monstres depuis votre main ou Terrain. Vous ne pouvez utiliser chaque effet de "Terracottan, Artisanesorcière" qu'une fois par tour.
  | de_name            = Hexwerkerin Terracottan
  | de_text            = Falls sich diese Karte in deiner Hand befindet: Du kannst 1 „Hexwerker“-Karte in deinem Friedhof wählen, außer „Hexwerkerin Terracottan“; füge sie deiner Hand hinzu und falls du dies tust, beschwöre diese Karte als Spezialbeschwörung, zusätzlich kannst du für den Rest dieses Spielzugs keine Spezialbeschwörungen vom Extra Deck durchführen, außer von „Hexwerker“-Monstern. Während deiner Main Phase: Du kannst 1 „Hexwerker“-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck beschwören, indem du Monster von deiner Hand oder Spielfeldseite verwendest. Du kannst jeden Effekt von „Hexwerkerin Terracottan“ nur einmal pro Spielzug verwenden.
  | it_name            = Stregartigiana Terracottan
  | it_text            = Se questa carta è nella tua mano: puoi scegliere come bersaglio 1 carta "Stregartigiana" nel tuo Cimitero, eccetto "Stregartigiana Terracottan"; aggiungila alla tua mano e, se lo fai, Evoca Specialmente questa carta, inoltre non puoi Evocare Specialmente dall'Extra Deck per il resto di questo turno, eccetto mostri "Stregartigiana". Durante la tua Main Phase: puoi Evocare tramite Fusione 1 Mostro Fusione "Stregartigiana" dal tuo Extra Deck, utilizzando mostri dalla tua mano o Terreno. Puoi utilizzare ogni effetto di "Stregartigiana Terracottan" una sola volta per turno.
  | pt_name            = Fazticeira Terracotan
  | pt_text            = Se este card estiver na sua mão: você pode escolher 1 card "Fazticeira" no seu Cemitério, exceto "Fazticeira Terracotan"; adicione-o à sua mão e, se isso acontecer, Invoque este card por Invocação-Especial e, além disso, você não pode Invocar por Invocação-Especial do Deck Adicional pelo resto deste turno, exceto monstros "Fazticeira". Durante sua Fase Principal: você pode Invocar por Invocação-Fusão 1 Monstro de Fusão "Fazticeira" do seu Deck Adicional, usando monstros da sua mão ou do campo. Você só pode usar cada efeito de "Fazticeira Terracotan" uma vez por turno.
  | es_name            = Terracotan Artibruja
  | es_text            = Si esta carta está en tu mano: puedes seleccionar 1 carta "Artibruja" en tu Cementerio, excepto "Terracotan Artibruja"; añádela a tu mano y, si lo haces, Invoca esta carta de Modo Especial, y además no puedes Invocar de Modo Especial desde el Deck Extra por el resto de este turno, excepto monstruos "Artibruja". Durante tu Main Phase: puedes Invocar por Fusión 1 Monstruo de Fusión "Artibruja" desde tu Deck Extra, usando monstruos en tu mano o Campo. Sólo puedes usar cada efecto de "Terracotan Artibruja" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードが手札に存在する場合、「ウィッチクラフト・テラコッタン」以外の自分の墓地の「ウィッチクラフト」カード１枚を対象として発動できる。そのカードを手札に加え、このカードを特殊召喚する。このターン、自分は「ウィッチクラフト」モンスターしかＥＸデッキから特殊召喚できない。<br />②：自分メインフェイズに発動できる。自分の手札・フィールドのモンスターを融合素材とし、「ウィッチクラフト」融合モンスター１体を融合召喚する。
  | ko_name            = 위치크래프트 테라코탄
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드가 패에 존재할 경우, "위치크래프트 테라코탄" 이외의 자신 묘지의 "위치크래프트" 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 패에 넣고, 이 카드를 특수 소환한다. 이 턴에, 자신은 "위치크래프트" 몬스터밖에 엑스트라 덱에서 특수 소환할 수 없다.<br />②: 자신 메인 페이즈에 발동할 수 있다. 자신의 패 / 필드의 몬스터를 융합 소재로 하고, "위치크래프트" 융합 몬스터 1장을 융합 소환한다.
  | tc_name            = 魔女工藝・陶俑魔像
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：此卡存在於手牌的情況下，以「魔女工藝・陶俑魔像」以外的、自己墓地的1張「魔女工藝」卡為對象可以發動。將該卡加入手牌，將此卡特殊召喚。此回合，自己從額外牌組僅可特殊召喚「魔女工藝」怪獸。<br />②：在自己的主要階段可以發動。將自己手牌・場上的怪獸作為融合素材，將1隻「魔女工藝」融合怪獸融合召喚。
  | sc_name            = 魔女工艺・陶俑魔像
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：此卡存在于手牌的情况下，以“魔女工艺・陶俑魔像”以外的、自己墓地的1张“魔女工艺”卡为对象可以发动。将该卡加入手牌，将此卡特殊召唤。此回合，自己从额外牌组仅可特殊召唤“魔女工艺”怪兽。<br />②：在自己的主要阶段可以发动。将自己手牌・场上的怪兽作为融合素材，将1只“魔女工艺”融合怪兽融合召唤。
  }}
