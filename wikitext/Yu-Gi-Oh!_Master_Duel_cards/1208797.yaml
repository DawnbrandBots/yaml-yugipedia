title: Ectoplasmic Fortification (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | card_type          = Spell
  | property           = Normal
  | text               = Activate 1 of these effects;<br />●If you control no monsters: Add 1 Level 6 Zombie monster or 1 "Call of the Forgotten" from your Deck to your hand.<br />●Zombie monsters you control gain 400 ATK, then you can draw cards equal to the number of "Call of the Haunted" you control.<br />You can only activate 1 "Ectoplasmic Fortification" per turn.

  | fr_name            = Fortification Ectoplasmique
  | fr_text            = Activez 1 de ces effets ;<br />●Si vous ne contrôlez aucun monstre : ajoutez 1 monstre Zombie de Niveau 6 ou 1 "Appel de l'Oublié" depuis votre Deck à votre main.<br />●Les monstres Zombie que vous contrôlez gagnent 400 ATK, puis vous pouvez piocher un nombre de cartes égal au nombre de "Appel de l'Être Hanté" que vous contrôlez.<br />Vous ne pouvez activer qu'1 "Fortification Ectoplasmique" par tour.
  | de_name            = Ektoplasmische Stärkung
  | de_text            = Aktiviere 1 dieser Effekte;<br />●Falls du keine Monster kontrollierst: Füge deiner Hand 1 Zombie-Monster der Stufe 6 oder 1 „Ruf der Vergessenen“ von deinem Deck hinzu.<br />●Zombie-Monster, die du kontrollierst, erhalten 400 ATK, dann kannst du Karten in Höhe der Anzahl der „Ruf der Gejagten“ ziehen, die du kontrollierst.<br />Du kannst nur 1 „Ektoplasmische Stärkung“ pro Spielzug aktivieren.
  | it_name            = Più Ectoplasma
  | it_text            = Attiva 1 di questi effetti;<br />●Se non controlli nessun mostro: aggiungi 1 mostro Zombie di Livello 6 o 1 "Richiamo del Dimenticato" dal tuo Deck alla tua mano.<br />●I mostri Zombie che controlli guadagnano 400 ATK, poi puoi pescare carte pari al numero di "Richiamo del Posseduto" che controlli.<br />Puoi attivare solo 1 "Più Ectoplasma" per turno.
  | pt_name            = Fortificação Ectoplásmica
  | pt_text            = Ative 1 desses efeitos;<br />●Se você não controlar nenhum monstro: adicione 1 monstro Zumbi de Nível 6 ou 1 "Chamado dos Esquecidos" do seu Deck à sua mão.<br />●Monstros Zumbi que você controla ganham 400 de ATK e, depois, você pode comprar cards igual ao número de "Chamado dos Assombrados" que você controla.<br />Você só pode ativar 1 "Fortificação Ectoplásmica" por turno.
  | es_name            = Fortificación Ectoplásmica
  | es_text            = Activa 1 de estos efectos;<br />●Si no controlas monstruos: añade a tu mano 1 monstruo Zombi de Nivel 6 o 1 "Llamada de los Olvidados" en tu Deck.<br />●Los monstruos Zombi que controlas ganan 400 ATK, y después puedes robar cartas iguales al número de "Llamada de los Condenados" que controlas.<br />Sólo puedes activar 1 "Fortificación Ectoplásmica" por turno.
  | ja_text            = このカード名のカードは１ターンに１枚しか発動できない。<br />①：以下の効果から１つを選択して発動できる。<br />●自分フィールドにモンスターが存在しない場合に発動できる。デッキからアンデット族・レベル６モンスター１体か「生ける屍の呼び声」１枚を手札に加える。<br />●自分フィールドの全てのアンデット族モンスターの攻撃力は４００アップする。その後、自分フィールドの「リビングデッドの呼び声」の数だけ自分はドローできる。
  | ko_name            = 영혼 플라즈마
  | ko_text            = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다.<br />①: 이하의 효과에서 1개를 선택하고 발동할 수 있다.<br />●자신 필드에 몬스터가 존재하지 않을 경우에 발동할 수 있다. 덱에서 언데드족 / 레벨 6 몬스터 1장이나 "살아있는 시체가 부르는 소리" 1장을 패에 넣는다.<br />●자신 필드의 모든 언데드족 몬스터의 공격력은 400 올린다. 그 후, 자신 필드의 "리빙 데드가 부르는 소리"의 수만큼 자신은 드로우할 수 있다.
  | tc_name            = 靈魂等離子
  | tc_text            = 此卡名的卡1回合僅可發動1張。<br />①：可從以下效果中選擇1個發動。<br />●自己場上不存在怪獸的情況下可以發動。從牌組將1隻不死族・等級6怪獸或1張「活屍的呼喚」加入手牌。<br />●自己場上所有的不死族怪獸的攻擊力上升400。然後，自己可依自己場上的「活死人的呼喚」的數量抽牌。
  | sc_name            = 灵魂等离子
  | sc_text            = 此卡名的卡1回合仅可发动1张。<br />①：可从以下效果中选择1个发动。<br />●自己场上不存在怪兽的情况下可以发动。从牌组将1只不死族・等级6怪兽或1张“活尸的呼唤”加入手牌。<br />●自己场上所有的不死族怪兽的攻击力上升400。然后，自己可依自己场上的“活死人的呼唤”的数量抽牌。
