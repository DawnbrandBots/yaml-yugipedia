title: Neos Fusion (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity    = UR
  | card_type = Spell
  | property  = Normal
  | text      = Send from your hand, Deck, or field to the GY, the Fusion Materials that are mentioned on a Fusion Monster that mentions exactly 2 monsters as material, including "Elemental HERO Neos", then Special Summon that Fusion Monster from your Extra Deck, ignoring its Summoning conditions. You cannot Special Summon for the rest of this turn after this card resolves. If a Fusion Monster(s) you control that mentions "Elemental HERO Neos" as material would be destroyed by battle or card effect, or shuffled into the Extra Deck by its own effect, you can banish this card from your GY instead.

  | fr_name   = Fusion Néos
  | fr_text   = Envoyez depuis votre main, Deck ou Terrain au Cimetière, les Matériels Fusion qui sont mentionnés sur un Monstre Fusion qui mentionne exactement 2 monstres comme Matériel ("Néos, HÉROS Élémentaire" inclus), puis Invoquez Spécialement le Monstre Fusion depuis votre Extra Deck, en ignorant ses conditions d'Invocation. Vous ne pouvez pas Invoquer Spécialement le reste de ce tour après la résolution de cette carte. Si un ou plusieurs Monstres Fusion que vous contrôlez qui mentionnent "Néos, HÉROS Élémentaire" comme Matériel vont être détruits au combat ou par un effet de carte, ou mélangés dans l'Extra Deck par leur propre effet, vous pouvez bannir cette carte depuis votre Cimetière à la place.
  | de_name   = Neos-Fusion
  | de_text   = Lege das Fusionsmaterial, das auf einem Fusionsmonster erwähnt wird, das genau 2 Monster als Material erwähnt, darunter „Elementar-HELD Neos“, von deiner Hand, deinem Deck oder deiner Spielfeldseite auf den Friedhof, dann beschwöre jenes Fusionsmonster als Spezialbeschwörung von deinem Extra Deck, ungeachtet seiner Beschwörungsbedingungen. Du kannst für den Rest dieses Spielzugs, nachdem diese Karte aufgelöst wurde, keine Spezialbeschwörungen durchführen. Falls ein oder mehr Fusionsmonster, die du kontrollierst und die „Elementar-HELD Neos“ als Material erwähnen, durch Kampf oder einen Karteneffekt zerstört oder durch ihren eigenen Effekt ins Extra Deck gemischt würden, kannst du stattdessen diese Karte von deinem Friedhof verbannen.
  | it_name   = Fusione Neos
  | it_text   = Manda dalla tua mano, Deck o Terreno al Cimitero i Materiali da Fusione che sono menzionati su un Mostro Fusione che menziona esattamente 2 mostri come materiale, compreso "Neos EROE Elementale", poi Evoca Specialmente quel Mostro Fusione dal tuo Extra Deck, ignorando le sue condizioni di Evocazione. Non puoi Evocare Specialmente per il resto di questo turno dopo che questa carta si è risolta. Se uno o più Mostri Fusione che controlli che menzionano "Neos EROE Elementale" come materiale stanno per essere distrutti in battaglia o dall'effetto di una carta, o mischiati nell'Extra Deck dal loro stesso effetto, puoi invece bandire questa carta dal tuo Cimitero.
  | pt_name   = Fusão Neos
  | pt_text   = Envie da sua mão, do Deck ou do campo para o Cemitério, as Matérias de Fusão mencionadas em um Monstro de Fusão que mencione exatamente 2 monstros como matéria, incluindo "Neos, o HERÓI do Elemento" e, depois, Invoque por Invocação-Especial esse Monstro de Fusão do seu Deck Adicional, ignorando suas condições de Invocação. Você não pode Invocar por Invocação-Especial pelo resto deste turno depois que este card resolver. Se um ou mais Monstros de Fusão que você controla que mencionem "Neos, o HERÓI do Elemento" como matéria seriam destruídos em batalha ou por um efeito de card, ou embaralhados no Deck Adicional por seu próprio efeito, em vez disso, você pode banir este card do seu Cemitério.
  | es_name   = Fusión Neos
  | es_text   = Manda al Cementerio los Materiales de Fusión en tu mano, Deck o Campo que sean mencionados en un Monstruo de Fusión que mencione exactamente 2 monstruos como material, incluyendo "HÉROE Elemental Neos", y después Invoca de Modo Especial ese Monstruo de Fusión desde tu Deck Extra, ignorando sus condiciones de Invocación. No puedes Invocar de Modo Especial por el resto de este turno después de que esta carta se resuelva. Si uno o más Monstruos de Fusión que controlas que mencionen "HÉROE Elemental Neos" como material fueran a ser destruidos en batalla o por el efecto de una carta, o barajados al Deck Extra por su propio efecto, puedes desterrar esta carta en tu Cementerio en su lugar.
  | ja_text   = ①：自分の手札・デッキ・フィールドから、融合モンスターによって決められた融合素材モンスターを墓地へ送り、「Ｅ・ＨＥＲＯ　ネオス」を含むモンスター２体のみを素材とするその融合モンスター１体を召喚条件を無視してＥＸデッキから特殊召喚する。このカードの発動後、ターン終了時まで自分はモンスターを特殊召喚できない。<br />②：「Ｅ・ＨＥＲＯ　ネオス」を融合素材とする自分フィールドの融合モンスターが戦闘・効果で破壊される場合、または自身の効果でＥＸデッキに戻る場合、代わりに墓地のこのカードを除外できる。
  | ko_name   = 네오스 퓨전
  | ko_text   = ①: 자신의 패 / 덱 / 필드에서, 융합 몬스터 카드에 기재된 융합 소재 몬스터를 묘지로 보내고, "엘리멘틀 히어로 네오스"를 포함하는 몬스터 2장만을 소재로 하는 그 융합 몬스터 1장을 소환 조건을 무시하여 엑스트라 덱에서 특수 소환한다. 이 카드의 발동 후, 턴 종료시까지 자신은 몬스터를 특수 소환할 수 없다.<br />②: "엘리멘틀 히어로 네오스"를 융합 소재로 하는 자신 필드의 융합 몬스터가 전투 / 효과로 파괴될 경우, 또는 자신의 효과로 엑스트라 덱으로 되돌아갈 경우, 대신에 묘지의 이 카드를 제외할 수 있다.
  | tc_name   = 新宇結合
  | tc_text   = ①：從我方手牌・牌組・場上，將根據融合怪獸卡決定的融合素材怪獸送至墓地，忽略召喚條件從額外牌組特殊召喚１隻僅將包含「元素－英雄 新宇俠」在內的２隻怪獸做為素材的該融合怪獸。此卡發動後，在回合結束前我方無法特殊召喚怪獸。<br />②：在我方場上的以「元素－英雄 新宇俠」做為融合素材的融合怪獸因戰鬥・效果被破壞的狀況下，或因自身效果回到額外牌組的狀況下，可將墓地的此卡除外作為替代。
  | sc_name   = 新宇结合
  | sc_text   = ①：从自己的手牌・牌组・场上，将由融合怪兽卡决定的融合素材怪兽送至墓地，将该１只仅以２只怪兽作为素材的、且素材包括“元素－英雄 新宇侠”在内的融合怪兽无视召唤条件，从额外牌组特殊召唤。此卡发动后，直至回合结束时为止，自己不可特殊召唤怪兽。<br />②：自己场上以“元素－英雄 新宇侠”作为融合素材的融合怪兽将被战斗・效果破坏的情况下，或因自身的效果放回额外牌组的情况下，可将墓地的此卡除外作为代替。
  }}
