title: Future Fusion Nova (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = UR
  | card_type          = Spell
  | property           = Continuous
  | text               = When this card is activated: Fusion Summon 1 LIGHT Machine Fusion Monster from your Extra Deck, using monsters from your Deck, including "Cyber Dragon", also for the rest of this turn after this effect resolves, you cannot Special Summon, except Machine monsters, and you cannot declare attacks, except with the Summoned monster. When this card leaves the field, destroy that monster. When that monster is destroyed, destroy this card. You can only activate 1 "Future Fusion Nova" per turn.

  | fr_name            = Nova Fusion du Futur
  | fr_text            = Lorsque cette carte est activée : Invoquez par Fusion 1 Monstre Fusion LUMIÈRE Machine depuis votre Extra Deck, en utilisant des monstres ("Cyber Dragon" inclus) depuis votre Deck, et aussi, le reste de ce tour après la résolution de cet effet, vous ne pouvez pas Invoquer Spécialement (monstres Machine exclus), et vous ne pouvez pas déclarer d'attaques (sauf avec le monstre Invoqué). Lorsque cette carte quitte le Terrain, détruisez le monstre. Lorsque le monstre est détruit, détruisez cette carte. Vous ne pouvez activer qu'1 "Nova Fusion du Futur" par tour.
  | de_name            = Zukunftsfusions-Nova
  | de_text            = Wenn diese Karte aktiviert wird: Beschwöre 1 LICHT Maschine-Fusionsmonster als Fusionsbeschwörung von deinem Extra Deck, indem du Monster von deinem Deck verwendest, darunter „Cyber Drache“, zusätzlich für den Rest dieses Spielzugs, nachdem dieser Effekt aufgelöst wurde, kannst du keine Spezialbeschwörungen durchführen, außer von Maschine-Monstern, und du kannst keine Angriffe deklarieren, außer mit dem beschworenen Monster. Wenn diese Karte das Spielfeld verlässt, zerstöre jenes Monster. Wenn jenes Monster zerstört wird, zerstöre diese Karte. Du kannst nur 1 „Zukunftsfusions-Nova“ pro Spielzug aktivieren.
  | it_name            = Nova Fusione Futura
  | it_text            = Quando questa carta viene attivata: Evoca tramite Fusione 1 Mostro Fusione LUCE Macchina dal tuo Extra Deck, utilizzando mostri dal tuo Deck, compreso "Cyber Drago", inoltre per il resto di questo turno dopo che questo effetto si è risolto, non puoi Evocare Specialmente, eccetto mostri Macchina, e non puoi dichiarare attacchi, eccetto con il mostro Evocato. Quando questa carta lascia il Terreno, distruggi quel mostro. Quando quel mostro viene distrutto, distruggi questa carta. Puoi attivare solo 1 "Nova Fusione Futura" per turno.
  | pt_name            = Nova Fusão Futura
  | pt_text            = Quando este card for ativado: Invoque por Invocação-Fusão 1 Monstro de Fusão Máquina de LUZ do seu Deck Adicional, usando monstros do seu Deck, incluindo "Dragão Cibernético" e, além disso, pelo resto deste turno depois que este efeito resolver, você não pode Invocar por Invocação-Especial, exceto monstros Máquina, e você não pode declarar ataques, exceto com o monstro Invocado. Quando este card deixar o campo, destrua esse monstro. Quando esse monstro for destruído, destrua este card. Você só pode ativar 1 "Nova Fusão Futura" por turno.
  | es_name            = Nova de Fusión Futura
  | es_text            = Cuando esta carta es activada: Invoca por Fusión 1 Monstruo de Fusión Máquina de LUZ desde tu Deck Extra, usando monstruos en tu Deck, incluyendo "Ciber Dragón", y además, por el resto de este turno después de que se resuelva este efecto, no puedes Invocar de Modo Especial, excepto monstruos Máquina, y no puedes declarar ataques, excepto con el monstruo Invocado. Cuando esta carta deja el Campo, destruye ese monstruo. Cuando ese monstruo es destruido, destruye esta carta. Sólo puedes activar 1 "Nova de Fusión Futura" por turno.
  | ja_text            = このカード名のカードは１ターンに１枚しか発動できない。<br />①：このカードの発動時の効果処理として、「サイバー・ドラゴン」を含む自分のデッキのモンスターを融合素材とし、機械族・光属性の融合モンスター１体を融合召喚する。このカードがフィールドから離れる時にそのモンスターは破壊される。そのモンスターが破壊される時にこのカードは破壊される。このカードの発動後、ターン終了時まで自分は、機械族モンスターしか特殊召喚できず、この効果で特殊召喚したモンスターでしか攻撃宣言できない。
  | ko_name            = 미래융합－퓨처 퓨전 노바
  | ko_text            = 이 카드명의 카드는 1턴에 1장밖에 발동할 수 없다.<br />①: 이 카드의 발동시의 효과 처리로서, "사이버 드래곤"을 포함하는 자신의 덱의 몬스터를 융합 소재로 하고, 기계족 / 빛 속성의 융합 몬스터 1장을 융합 소환한다. 이 카드가 필드에서 벗어날 때에 그 몬스터는 파괴된다. 그 몬스터가 파괴될 때에 이 카드는 파괴된다. 이 카드의 발동 후, 턴 종료시까지 자신은, 기계족 몬스터밖에 특수 소환할 수 없으며, 이 효과로 특수 소환한 몬스터로밖에 공격 선언할 수 없다.
  | tc_name            = 未來融合－永望結合・新星
  | tc_text            = 此卡名的卡1回合僅可發動1張。<br />①：作為此卡發動時的效果處理，將包含「電子龍」在內的、自己牌組的怪獸作為融合素材，將1隻機械族・光屬性融合怪獸融合召喚。此卡從場上離開時該怪獸將被破壞。該怪獸被破壞時將此卡破壞。此卡發動後，直至回合結束時為止，自己僅可特殊召喚機械族怪獸，僅可用以此效果特殊召喚的怪獸攻擊宣言。
  | sc_name            = 未来融合－永望结合・新星
  | sc_text            = 此卡名的卡1回合仅可发动1张。<br />①：作为此卡发动时的效果处理，将包含“电子龙”在内的、自己牌组的怪兽作为融合素材，将1只机械族・光属性融合怪兽融合召唤。此卡从场上离开时该怪兽将被破坏。该怪兽被破坏时将此卡破坏。此卡发动后，直至回合结束时为止，自己仅可特殊召唤机械族怪兽，仅可用以此效果特殊召唤的怪兽攻击宣言。
  }}
