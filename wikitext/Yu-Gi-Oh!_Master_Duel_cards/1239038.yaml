title: Wind Unicorn Parallel, the Dracoslayer (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = WIND
  | types              = Spellcaster / Pendulum / Effect
  | level              = 6
  | pendulum_scale     = 2
  | atk                = 2000
  | def                = 2000
  | pendulum_effect    = If you have a card in your other Pendulum Zone: You can activate 1 of these effects;<br />●Special Summon this card.<br />●Destroy this card, and if you do, Special Summon 1 Level 5 or lower Pendulum Monster Card from your Pendulum Zone.<br />You can only use this effect of "Wind Unicorn Parallel, the Dracoslayer" once per turn.
  | text               = While this Pendulum Summoned card is in your Monster Zone, your opponent cannot target it with card effects, also it cannot be destroyed by your opponent's card effects. (Quick Effect): You can target 1 Pendulum Monster Card you control and 1 card your opponent controls; return them to the hand. You can only use this effect of "Wind Unicorn Parallel, the Dracoslayer" once per turn.

  | fr_name            = Licorne du Vent Parallèle, le Dracossassin
  | fr_pendulum_effect = Si vous avez une carte dans votre autre Zone Pendule : vous pouvez activer 1 de ces effets ;<br />●Invoquez Spécialement cette carte.<br />●Détruisez cette carte, et si vous le faites, Invoquez Spécialement 1 Carte Monstre Pendule de max. Niveau 5 depuis votre Zone Pendule.<br />Vous ne pouvez utiliser cet effet de "Licorne du Vent Parallèle, le Dracossassin" qu'une fois par tour.
  | fr_text            = Tant que cette carte Invoquée par Pendulation est dans votre Zone Monstre, votre adversaire ne peut pas la cibler avec des effets de carte, et aussi, elle ne peut pas être détruite par des effets de carte de votre adversaire. (Effet Rapide) : vous pouvez cibler 1 Carte Monstre Pendule que vous contrôlez et 1 carte contrôlée par votre adversaire ; renvoyez-les à la main. Vous ne pouvez utiliser cet effet de "Licorne du Vent Parallèle, le Dracossassin" qu'une fois par tour.
  | de_name            = Wind-Einhorn Parallel, der Drachobezwinger
  | de_pendulum_effect = Falls du eine Karte in deiner anderen Pendelzone hast: Du kannst 1 dieser Effekte aktivieren;<br />●Beschwöre diese Karte als Spezialbeschwörung.<br />●Zerstöre diese Karte und falls du dies tust, beschwöre 1 Pendelmonsterkarte der Stufe 5 oder niedriger als Spezialbeschwörung von deiner Pendelzone.<br />Du kannst diesen Effekt von „Wind-Einhorn Parallel, der Drachobezwinger“ nur einmal pro Spielzug verwenden.
  | de_text            = Solange diese als Pendelbeschwörung beschworene Karte in deiner Monsterzone liegt, kann dein Gegner sie nicht als Ziel für Karteneffekte wählen, zusätzlich kann sie nicht durch Karteneffekte deines Gegners zerstört werden. (Schnelleffekt): Du kannst 1 Pendelmonsterkarte, die du kontrollierst, und 1 Karte, die dein Gegner kontrolliert, wählen; gib sie auf die Hand zurück. Du kannst diesen Effekt von „Wind-Einhorn Parallel, der Drachobezwinger“ nur einmal pro Spielzug verwenden.
  | it_name            = Parallelo Unicorno del Vento, il Dracoassassino
  | it_pendulum_effect = Se hai una carta nella tua altra Zona Pendulum: puoi attivare 1 di questi effetti;<br />●Evoca Specialmente questa carta.<br />●Distruggi questa carta e, se lo fai, Evoca Specialmente 1 Carta Mostro Pendulum di Livello 5 o inferiore dalla tua Zona Pendulum.<br />Puoi utilizzare questo effetto di "Parallelo Unicorno del Vento, il Dracoassassino" una sola volta per turno.
  | it_text            = Mentre questa carta Evocata Pendulum è nella tua Zona Mostri, il tuo avversario non può sceglierla come bersaglio con gli effetti delle carte, inoltre essa non può essere distrutta dagli effetti delle carte del tuo avversario. (Effetto Rapido): puoi scegliere come bersaglio 1 Carta Mostro Pendulum che controlli e 1 carta controllata dal tuo avversario; falle ritornare nella mano. Puoi utilizzare questo effetto di "Parallelo Unicorno del Vento, il Dracoassassino" una sola volta per turno.
  | pt_name            = Unicórnio do Vento Paralelo, o Dracossassino
  | pt_pendulum_effect = Se você tiver um card na sua outra Zona de Pêndulo: você pode ativar 1 desses efeitos;<br />●Invoque este card por Invocação-Especial.<br />●Destrua este card e, se isso acontecer, Invoque por Invocação-Especial 1 Card de Monstro Pêndulo de Nível 5 ou menos da sua Zona de Pêndulo.<br />Você só pode usar este efeito de "Unicórnio do Vento Paralelo, o Dracossassino" uma vez por turno.
  | pt_text            = Enquanto este card Invocado por Invocação-Pêndulo estiver na sua Zona de Monstros, seu oponente não pode escolhê-lo como alvo de efeitos de card e, além disso, ele não pode ser destruído pelos efeitos de card do seu oponente. (Efeito Rápido): você pode escolher 1 Card de Monstro Pêndulo que você controla e 1 card que seu oponente controla; devolva-os para a mão. Você só pode usar este efeito de "Unicórnio do Vento Paralelo, o Dracossassino" uma vez por turno.
  | es_name            = Unicornio de Viento Paralelo, el Dracoasesino
  | es_pendulum_effect = Si tienes una carta en tu otra Zona de Péndulo: puedes activar 1 de estos efectos;<br />●Invoca esta carta de Modo Especial.<br />●Destruye esta carta y, si lo haces, Invoca de Modo Especial 1 Carta de Monstruo de Péndulo de Nivel 5 o menor desde tu Zona de Péndulo.<br />Sólo puedes usar este efecto de "Unicornio de Viento Paralelo, el Dracoasesino" una vez por turno.
  | es_text            = Mientras esta carta Invocada por Péndulo esté en tu Zona de Monstruos, tu adversario no puede seleccionarla con efectos de cartas, y además no puede ser destruida por efectos de cartas de tu adversario. (Efecto Rápido): puedes seleccionar 1 Carta de Monstruo de Péndulo que controles y 1 carta que controle tu adversario; devuélvelas a la mano. Sólo puedes usar este efecto de "Unicornio de Viento Paralelo, el Dracoasesino" una vez por turno.
  | ja_pendulum_effect = このカード名のＰ効果は１ターンに１度しか使用できない。<br />①：もう片方の自分のＰゾーンにカードが存在する場合、以下の効果から１つを選択して発動できる。<br />●このカードを特殊召喚する。<br />●このカードを破壊し、自分のＰゾーンのレベル５以下のＰモンスターカード１枚を特殊召喚する。
  | ja_text            = このカード名の②のモンスター効果は１ターンに１度しか使用できない。<br />①：Ｐ召喚したこのカードがモンスターゾーンに存在する限り、このカードは相手の効果では破壊されず、相手はこのカードを効果の対象にできない。<br />②：自分・相手ターンに、自分フィールドのＰモンスターカード１枚と相手フィールドのカード１枚を対象として発動できる。そのカードを手札に戻す。
  | ko_name            = 룡검사 윈드유니콘P
  | ko_pendulum_effect = 이 카드명의 펜듈럼 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 다른 한쪽 자신의 펜듈럼 존에 카드가 존재할 경우, 이하의 효과에서 1개를 선택하고 발동할 수 있다.<br />●이 카드를 특수 소환한다.<br />●이 카드를 파괴하고, 자신의 펜듈럼 존의 레벨 5 이하의 펜듈럼 몬스터 카드 1장을 특수 소환한다.
  | ko_text            = 이 카드명의 ②의 몬스터 효과는 1턴에 1번밖에 사용할 수 없다.<br />①: 펜듈럼 소환한 이 카드가 몬스터 존에 존재하는 한, 이 카드는 상대 효과로는 파괴되지 않으며, 상대는 이 카드를 효과의 대상으로 할 수 없다.<br />②: 자신 / 상대 턴에, 자신 필드의 펜듈럼 몬스터 카드 1장과 상대 필드의 카드 1장을 대상으로 하고 발동할 수 있다. 그 카드를 패로 되돌린다.
  | tc_name            = 龍劍士 乘風獨角麒麟 別型
  | tc_pendulum_effect = 此卡名的鐘擺效果1回合僅可使用1次。<br />①：自己另一方的鐘擺區域有卡存在的情況下，可從以下效果中選擇1個發動。<br />●將此卡特殊召喚。<br />●將此卡破壞，將自己鐘擺區域的1張等級5以下的鐘擺怪獸卡特殊召喚。
  | tc_text            = 此卡名的②怪獸效果1回合僅可使用1次。<br />①：只要鐘擺召喚的此卡存在於怪獸區域，此卡不會因對手的效果被破壞，對手不可將此卡作為效果的對象。<br />②：在自己・對手回合中，以自己場上的1張鐘擺怪獸卡和對手場上的1張卡為對象可以發動。將該卡放回手牌。
  | sc_name            = 龙剑士 乘风独角麒麟 别型
  | sc_pendulum_effect = 此卡名的灵摆效果1回合仅可使用1次。<br />①：自己另一方的灵摆区域有卡存在的情况下，可从以下效果中选择1个发动。<br />●将此卡特殊召唤。<br />●将此卡破坏，将自己灵摆区域的1张等级5以下的灵摆怪兽卡特殊召唤。
  | sc_text            = 此卡名的②怪兽效果1回合仅可使用1次。<br />①：只要灵摆召唤的此卡存在于怪兽区域，此卡不会因对手的效果被破坏，对手不可将此卡作为效果的对象。<br />②：在自己・对手回合中，以自己场上的1张灵摆怪兽卡和对手场上的1张卡为对象可以发动。将该卡放回手牌。
  }}
