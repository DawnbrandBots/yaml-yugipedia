  | text      = Cannot be Special Summoned from the hand or Deck. Once per turn: You can discard 1 card and pay 1000 LP; this card gains 1000 ATK until the end of this turn. When this card in your possession is destroyed by your opponent's card effect and sent to your GY: Both players take damage equal to this card's ATK in the GY.
  | releases  = Legacy Pack

  | fr_name   = Saturne le Puissant
  | fr_text   = Non Invocable Spécialement depuis la main ou Deck. Une fois par tour : vous pouvez défausser 1 carte et payer 1000 LP ; jusqu'à la fin de ce tour, cette carte gagne 1000 ATK. Lorsque cette carte en votre possession est détruite par un effet de carte de votre adversaire et envoyée à votre Cimetière : chaque joueur reçoit des dommages égaux à l'ATK de cette carte dans le Cimetière.
  | de_name   = Der große Saturn
  | de_text   = Kann nicht als Spezialbeschwörung von der Hand oder dem Deck beschworen werden. Einmal pro Spielzug: Du kannst 1 Karte abwerfen und 1000 LP zahlen; diese Karte erhält bis zum Ende dieses Spielzugs 1000 ATK. Wenn diese Karte, die dir gehört, durch einen Karteneffekt deines Gegners zerstört und auf deinen Friedhof gelegt wird: Beide Spieler erhalten Schaden in Höhe der ATK dieser Karte im Friedhof.
  | it_name   = Saturno il Grande
  | it_text   = Non può essere Evocato Specialmente dalla mano o Deck. Una volta per turno: puoi scartare 1 carta e pagare 1000 LP; questa carta guadagna 1000 ATK fino alla fine di questo turno. Quando questa carta sotto il tuo comando viene distrutta dall'effetto di una carta del tuo avversario e mandata al tuo Cimitero: entrambi i giocatori subiscono danno pari all'ATK di questa carta nel Cimitero.
  | pt_name   = O Grande Saturno
  | pt_text   = Não pode ser Invocado por Invocação-Especial da mão ou do Deck. Uma vez por turno: você pode descartar 1 card e pagar 1000 PV; este card ganha 1000 de ATK até o final deste turno. Quando este card em sua posse for destruído por um efeito de card do seu oponente e enviado para o seu Cemitério: os dois duelistas sofrem dano igual ao ATK deste card no Cemitério.
  | es_name   = El Gran Saturno
  | es_text   = No puede ser Invocado de Modo Especial desde la mano o Deck. Una vez por turno: puedes descartar 1 carta y pagar 1000 LP; esta carta gana 1000 ATK hasta el final de este turno. Cuando esta carta en tu posesión es destruida por el efecto de una carta de tu adversario y mandada a tu Cementerio: ambos jugadores reciben daño igual al ATK de esta carta en el Cementerio.
  | ja_text   = このカードは手札・デッキからの特殊召喚はできない。<br />①：１ターンに１度、手札を１枚捨て、１０００ＬＰを払って発動できる。このカードの攻撃力はターン終了時まで１０００アップする。<br />②：このカードが相手の効果で破壊され墓地へ送られた場合に発動する。お互いにこのカードの元々の攻撃力分のダメージを受ける。
  | ko_name   = The big SATURN
  | ko_text   = 이 카드는 패 / 덱에서의 특수 소환은 할 수 없다.<br />①: 1턴에 1번, 패를 1장 버리고, 1000 LP를 지불하여 발동할 수 있다. 이 카드의 공격력은 턴 종료시까지 1000 올린다.<br />②: 이 카드가 상대 효과로 파괴되어 묘지로 보내졌을 경우에 발동한다. 양쪽 플레이어는 이 카드의 원래 공격력만큼의 데미지를 받는다.
  | tc_name   = The big SATURN
  | tc_text   = 此卡無法從手牌・牌組特殊召喚。１回合１次，可捨棄１張手牌、支付１０００LP發動。此卡的攻擊力在回合結束前提升１０００。此卡因對方卡的效果被破壞送至墓地時，給予雙方此卡原本攻擊力的傷害。
  | sc_name   = The big SATURN
  | sc_text   = 此卡不可进行从手牌、牌组的特殊召唤。１回合１次，可舍弃１张手牌并支付１０００LP点数发动。直至回合结束时，此卡的攻击力上升１０００点。此卡因对手卡的效果被破坏并送至墓地时，双方均受到此卡原本攻击力一半数值的伤害。
  }}
