  | text      = If this card is Special Summoned by "Clock Tower Prison": Destroy all monsters you control, except "Destiny HERO" monsters, also, after that, you can Special Summon up to 2 "Destiny HERO" monsters from your GY. After this card is Special Summoned, for the rest of this turn, "Destiny HERO" monsters you control cannot be destroyed, also you take no battle damage from battles involving them. The ATK/DEF of this card become the combined original ATK of all other "Destiny HERO" monsters you control.

  | fr_name   = Maître de l'Effroi - HÉROS de la Destinée
  | fr_text   = Si cette carte est Invoquée Spécialement par "Prison de la Tour de l'Horloge" : détruisez tous les monstres que vous contrôlez (monstres "HÉROS de la Destinée" exclus), et aussi, après ça, vous pouvez Invoquer Spécialement max. 2 monstres "HÉROS de la Destinée" depuis votre Cimetière. Après que cette carte est Invoquée Spécialement, le reste de ce tour, les monstres "HÉROS de la Destinée" que vous contrôlez ne peuvent pas être détruits, et aussi, vous ne recevez aucun dommage de combat de combats les impliquant. L'ATK/DEF de cette carte deviennent la somme des ATK d'origine de tous les autres monstres "HÉROS de la Destinée" que vous contrôlez.
  | de_name   = Schicksals-HELD - Dreadmaster
  | de_text   = Falls diese Karte durch „Gefängnisuhrturm“ als Spezialbeschwörung beschworen wird: Zerstöre alle Monster, die du kontrollierst, außer „Schicksals-HELD“-Monstern, zusätzlich kannst du danach bis zu 2 „Schicksals-HELD“-Monster als Spezialbeschwörung von deinem Friedhof beschwören. Nachdem diese Karte als Spezialbeschwörung beschworen wurde, für den Rest dieses Spielzugs, können „Schicksals-HELD“-Monster, die du kontrollierst, nicht zerstört werden, zusätzlich erhältst du keinen Kampfschaden aus Kämpfen, an denen sie beteiligt sind. Die ATK/DEF dieser Karte werden gleich den kombinierten Grund-ATK aller anderen „Schicksals-HELD“-Monster, die du kontrollierst.
  | it_name   = Maestro del Terrore - EROE del Destino
  | it_text   = Se questa carta viene Evocata Specialmente da "Prigione della Torre dell'Orologio": distruggi tutti i mostri che controlli, eccetto i mostri "EROE del Destino", inoltre, dopo averlo fatto, puoi Evocare Specialmente fino a 2 mostri "EROE del Destino" dal tuo Cimitero. Dopo che questa carta è stata Evocata Specialmente, per il resto di questo turno, i mostri "EROE del Destino" che controlli non possono essere distrutti, inoltre non subisci danni da combattimento da battaglie che li coinvolgono. L'ATK/DEF di questa carta diventano la somma degli ATK originali di tutti gli altri mostri "EROE del Destino" che controlli.
  | pt_name   = HERÓI do Destino - Mestre do Horror
  | pt_text   = Se este card for Invocado por Invocação-Especial por "Prisão da Torre do Relógio": destrua todos os monstros que você controla, exceto monstros "HERÓI do Destino" e, além disso, depois, você pode Invocar por Invocação-Especial até 2 monstros "HERÓI do Destino" do seu Cemitério. Depois que este card for Invocado por Invocação-Especial, pelo resto deste turno, monstros "HERÓI do Destino" que você controla não podem ser destruídos e, além disso, você não sofre dano de batalha das batalhas envolvendo eles. O ATK/DEF deste card se tornam o ATK original combinado de todos os outros monstros "HERÓI do Destino" que você controla.
  | es_name   = HÉROE del Destino - Dreadmaster
  | es_text   = Si esta carta es Invocada de Modo Especial por "Prisión de la Torre del Reloj": destruye todos los monstruos que controles, excepto los monstruos "HÉROE del Destino" y además, después de eso, puedes Invocar de Modo Especial hasta 2 monstruos "HÉROE del Destino" desde tu Cementerio. Después de que esta carta sea Invocada de Modo Especial, por el resto de este turno, los monstruos "HÉROE del Destino" que controles no pueden ser destruidos, y además no recibes daño de batalla de batallas que los involucren. El ATK/DEF de esta carta se convierten en el ATK original combinado de todos los demás monstruos "HÉROE del Destino" que controles.
  | ja_text   = ①：このカードが「幽獄の時計塔」の効果で特殊召喚した場合に発動する。以下を適用する。<br />●「Ｄ－ＨＥＲＯ」モンスターを除く、自分フィールドのモンスターを全て破壊する。<br />●自分の墓地から「Ｄ－ＨＥＲＯ」モンスターを２体まで特殊召喚できる。<br />②：このカードの特殊召喚時に適用する。このターン中、自分フィールドの「Ｄ－ＨＥＲＯ」モンスターは破壊されず、そのモンスターの戦闘で発生する自分への戦闘ダメージは０になる。<br />③：このカードの攻撃力・守備力は、自分フィールドの他の「Ｄ－ＨＥＲＯ」モンスターの元々の攻撃力の合計値になる。
  | ko_name   = 데스티니 히어로 드레드 가이
  | ko_text   = ①: 이 카드를 "유옥의 시계탑"의 효과로 특수 소환했을 경우에 발동한다. 이하를 적용한다.<br />●"데스티니 히어로" 몬스터가 아닌, 자신 필드의 몬스터를 전부 파괴한다.<br />●자신 묘지에서 "데스티니 히어로" 몬스터를 2장까지 특수 소환할 수 있다.<br />②: 이 카드의 특수 소환시에 적용한다. 이 턴 중에, 자신 필드의 "데스티니 히어로" 몬스터는 파괴되지 않으며, 그 몬스터의 전투로 발생하는 자신에게로의 전투 데미지는 0 이 된다.<br />③: 이 카드의 공격력 / 수비력은, 자신 필드의 다른 "데스티니 히어로" 몬스터의 원래 공격력의 합계치가 된다.
  | tc_name   = 命運－英雄 恐懼魔俠
  | tc_text   = 此卡透過「幽獄時鐘塔」的效果被特殊召喚時，將冠有「命運－英雄」之名怪獸以外的我方場上所有怪獸全部破壞。其後，從我方墓地特殊召喚最多２隻冠有「命運－英雄」之名的怪獸。此卡特殊召喚成功的回合，我方場上冠有「命運－英雄」之名的怪獸不會被破壞，該戰鬥對我方造成的戰鬥傷害變為０。此卡的攻擊力・守備力變為此卡以外的我方場上冠有「命運－英雄」之名怪獸的原本攻擊力的合計數值。
  | sc_name   = 命运－英雄 恐惧魔侠
  | sc_text   = ①：此卡以“幽狱时钟塔”的效果特殊召唤成功的情况下发动。将自己场上“命运－英雄”怪兽以外的怪兽全部破坏。可从自己的墓地挑选最多２只“命运－英雄”怪兽特殊召唤。<br />②：此卡特殊召唤成功的余下回合，自己场上的“命运－英雄”怪兽不会被破坏，因该怪兽的战斗对自己造成的战斗伤害变为０。<br />③：此卡的攻击力・守备力变为自己场上其他“命运－英雄”怪兽原本攻击力的合计数值。
  }}
