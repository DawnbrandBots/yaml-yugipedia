  | atk                = 1500
  | text               = 2+ monsters, including a Tuner<br />If this card is Link Summoned: You can Special Summon 1 Tuner from your Extra Deck in Defense Position, with a Level less than or equal to the total original Levels of the monsters used as Link Material. During your opponent's Main or Battle Phase (Quick Effect): You can banish this card you control; Special Summon 3 "Crystron Tokens" (Machine/WATER/Level 1/ATK 0/DEF 0), but they cannot be Tributed. You can only use each effect of "Crystron Halqifibrax Prism" once per turn.

  | fr_name            = Prisme Halqifibrax Crystron
  | fr_text            = 2+ monstres (un Syntoniseur inclus)<br />Si cette carte est Invoquée par Lien : vous pouvez Invoquer Spécialement 1 Syntoniseur depuis votre Extra Deck en Position de Défense, d'un Niveau inférieur ou égal à la somme des Niveaux d'origine des monstres utilisés comme Matériel Lien. Durant la Main ou Battle Phase de votre adversaire (Effet Rapide) : vous pouvez bannir cette carte que vous contrôlez ; Invoquez Spécialement 3 "Jeton Crystron" (Machine/EAU/Niveau 1/ATK 0/DEF 0), mais ils ne peuvent pas être Sacrifiés. Vous ne pouvez utiliser chaque effet de "Prisme Halqifibrax Crystron" qu'une fois par tour.
  | de_name            = Kristron Halqifibrax Prisma
  | de_text            = 2+ Monster, darunter ein Empfänger<br />Falls diese Karte als Linkbeschwörung beschworen wird: Du kannst 1 Empfänger mit einer Stufe, die kleiner oder gleich der Summe der Grund-Stufen der Monster ist, die als Linkmaterial verwendet wurden, als Spezialbeschwörung von deinem Extra Deck in die Verteidigungsposition beschwören. Während der Main oder Battle Phase deines Gegners (Schnelleffekt): Du kannst diese Karte verbannen, die du kontrollierst; beschwöre 3 „Kristron-Spielmarken“ (Maschine/WASSER/Stufe 1/ATK 0/DEF 0) als Spezialbeschwörung, aber sie können nicht als Tribut angeboten werden. Du kannst jeden Effekt von „Kristron Halqifibrax Prisma“ nur einmal pro Spielzug verwenden.
  | it_name            = Crystron Halqifibrax Prisma
  | it_text            = 2+ mostri, compreso un Tuner<br />Se questa carta viene Evocata Link: puoi Evocare Specialmente dal tuo Extra Deck in Posizione di Difesa 1 Tuner con un Livello pari o inferiore alla somma dei Livelli originali dei mostri utilizzati come Materiale Link. Durante la Main o Battle Phase del tuo avversario (Effetto Rapido): puoi bandire questa carta che controlli; Evoca Specialmente 3 "Segna-Crystron" (Macchina/ACQUA/Livello 1/ATK 0/DEF 0), ma essi non possono essere offerti come Tributo. Puoi utilizzare ogni effetto di "Crystron Halqifibrax Prisma" una sola volta per turno.
  | pt_name            = Prisma Cristron Halqifibrax
  | pt_text            = 2+ monstros, incluindo um Regulador<br />Se este card for Invocado por Invocação-Link: você pode Invocar por Invocação-Especial 1 Regulador do seu Deck Adicional em Posição de Defesa, com um Nível igual ou menor que à soma dos Níveis originais dos monstros usados como Matéria Link. Durante a Fase Principal ou de Batalha do seu oponente (Efeito Rápido): você pode banir este card que você controla; Invoque por Invocação-Especial 3 "Ficha de Cristron" (Máquina/ÁGUA/Nível 1/ATK 0/DEF 0), mas elas não podem ser oferecidas como Tributo. Você só pode usar cada efeito de "Prisma Cristron Halqifibrax" uma vez por turno.
  | es_name            = Prisma Cristron Halqifibrax
  | es_text            = 2+ monstruos, incluyendo un Cantante<br />Si esta carta es Invocada por Enlace: puedes Invocar de Modo Especial 1 Cantante desde tu Deck Extra en Posición de Defensa, con un Nivel igual o menor a los Niveles originales totales de los monstruos usados como Material de Enlace. Durante la Main o Battle Phase de tu adversario (Efecto Rápido): puedes desterrar esta carta que controlas; Invoca de Modo Especial 3 "Ficha Cristron" (Máquina/AGUA/Nivel 1/ATK 0/DEF 0), pero no pueden ser Sacrificadas. Sólo puedes usar cada efecto de "Prisma Cristron Halqifibrax" una vez por turno.
  | ja_text            = チューナーを含むモンスター２体以上<br />このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：このカードがＬ召喚した場合に発動できる。そのＬ素材としたモンスターの元々のレベルの合計以下のレベルを持つチューナー１体をＥＸデッキから守備表示で特殊召喚する。<br />②：相手のメインフェイズ及びバトルフェイズに、フィールドのこのカードを除外して発動できる。自分フィールドに「水晶機巧トークン」（機械族・水・星１・攻／守０）３体を特殊召喚する。このトークンはリリースできない。
  | ko_name            = 크리스트론－하리파이버P
  | ko_text            = 튜너를 포함하는 몬스터 2장 이상<br />이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 이 카드를 링크 소환했을 경우에 발동할 수 있다. 그 링크 소재로 한 몬스터의 원래의 레벨의 합계 이하의 레벨을 가지는 튜너 1장을 엑스트라 덱에서 수비 표시로 특수 소환한다.<br />②: 상대의 메인 페이즈 및 배틀 페이즈에, 필드의 이 카드를 제외하고 발동할 수 있다. 자신 필드에 "크리스트론 토큰"(기계족 / 물 / 레벨 1 / 공 0 / 수 0) 3장을 특수 소환한다. 이 토큰은 릴리스할 수 없다.
  | tc_name            = 水晶機巧－玻璃光纖 棱彩
  | tc_text            = 包含協調在內的怪獸2隻以上<br />此卡名的①②效果1回合僅可各使用1次。<br />①：此卡連結召喚的情況下可以發動。從額外牌組將1隻等級在作為該連結素材的怪獸的原本等級合計以下的協調以守備表示特殊召喚。<br />②：在對手的主要階段及戰鬥階段，將場上的此卡除外可以發動。將3隻「水晶機巧衍生物」（機械族・水・星1・攻/守0）特殊召喚至自己場上。此衍生物不可解放。
  | sc_name            = 水晶机巧－玻璃光纤 棱彩
  | sc_text            = 包含协调在内的怪兽2只以上<br />此卡名的①②效果1回合仅可各使用1次。<br />①：此卡连接召唤的情况下可以发动。从额外牌组将1只等级在作为该连接素材的怪兽的原本等级合计以下的协调以守备表示特殊召唤。<br />②：在对手的主要阶段及战斗阶段，将场上的此卡除外可以发动。将3只“水晶机巧衍生物”（机械族・水・星1・攻/守0）特殊召唤至自己场上。此衍生物不可解放。
  }}
