  | text               = 2 Tuners + 1 non-Tuner<br />Must be either Synchro Summoned, or Special Summoned (from your Extra Deck) by banishing 2 Tuners and 1 "Red Dragon Archfiend" from your GY. Cannot be destroyed by card effects. If this card is Special Summoned: You can add 1 card from your GY to your hand, and if you do, this card gains 2000 ATK. You can only use this effect of "Red Nova Dragon - Burning Soul" once per Duel, and only if you have Synchro Summoned "Red Dragon Archfiend".

  | fr_name            = Dragon Nova Rouge - Âme Enflammée
  | fr_text            = 2 Syntoniseurs + 1 non-Syntoniseur<br />Uniquement soit Invocable par Synchronisation soit Invocable Spécialement (depuis votre Extra Deck) en bannissant 2 Syntoniseurs et 1 "Dragon Rouge Archdémon" depuis votre Cimetière. Non destructible par des effets de carte. Si cette carte est Invoquée Spécialement : vous pouvez ajouter 1 carte depuis votre Cimetière à votre main, et si vous le faites, cette carte gagne 2000 ATK. Vous ne pouvez utiliser cet effet de "Dragon Nova Rouge - Âme Enflammée" qu'une fois par Duel, et que si vous avez Invoqué par Synchronisation "Dragon Rouge Archdémon".
  | de_name            = Roter Nova-Drache - Brennende Seele
  | de_text            = 2 Empfänger + 1 Nicht-Empfänger<br />Muss entweder als Synchrobeschwörung beschworen werden oder als Spezialbeschwörung (von deinem Extra Deck) beschworen werden, indem du 2 Empfänger und 1 „Rotdrachen-Erzunterweltler“ von deinem Friedhof verbannst. Kann nicht durch Karteneffekte zerstört werden. Falls diese Karte als Spezialbeschwörung beschworen wird: Du kannst deiner Hand 1 Karte von deinem Friedhof hinzufügen und falls du dies tust, erhält diese Karte 2000 ATK. Du kannst diesen Effekt von „Roter Nova-Drache - Brennende Seele“ nur einmal pro Duell verwenden und nur, falls du „Rotdrachen-Erzunterweltler“ als Synchrobeschwörung beschworen hast.
  | it_name            = Drago Nova Rossa - Anima Bruciante
  | it_text            = 2 Tuner + 1 non-Tuner<br />Deve essere Synchro Evocato, oppure Evocato Specialmente (dal tuo Extra Deck) bandendo 2 Tuner e 1 "Arcidemone Drago Rosso" dal tuo Cimitero. Non può essere distrutto dagli effetti delle carte. Se questa carta viene Evocata Specialmente: puoi aggiungere dal tuo Cimitero alla tua mano 1 carta e, se lo fai, questa carta guadagna 2000 ATK. Puoi utilizzare questo effetto di "Drago Nova Rossa - Anima Bruciante" una sola volta per Duello, e solo se hai Synchro Evocato "Arcidemone Drago Rosso".
  | pt_name            = Dragão Vermelho Nova - Alma Ardente
  | pt_text            = 2 Reguladores + 1 não-Regulador<br />Deve ser Invocado por Invocação-Sincro, ou por Invocação-Especial (do seu Deck Adicional) ao banir 2 Reguladores e 1 "Dragão Vermelho Arquidemônio" do seu Cemitério. Não pode ser destruído por efeitos de card. Se este card for Invocado por Invocação-Especial: você pode adicionar 1 card do seu Cemitério à sua mão e, se isso acontecer, este card ganha 2000 de ATK. Você só pode usar este efeito de "Dragão Vermelho Nova - Alma Ardente" uma vez por Duelo e apenas se tiver Invocado "Dragão Vermelho Arquidemônio" por Invocação-Sincro.
  | es_name            = Dragón de Nova Roja - Alma Ardiente
  | es_text            = 2 Cantantes + 1 no Cantante<br />Debe ser ya sea Invocado por Sincronía, o Invocado de Modo Especial (desde tu Deck Extra) desterrando 2 Cantantes y 1 "Dragón Rojo Archidemonio" en tu Cementerio. No puede ser destruido por efectos de cartas. Si esta carta es Invocada de Modo Especial: puedes añadir a tu mano 1 carta en tu Cementerio y, si lo haces, esta carta gana 2000 ATK. Sólo puedes usar este efecto de "Dragón de Nova Roja - Alma Ardiente" una vez por Duelo, y sólo si has Invocado por Sincronía "Dragón Rojo Archidemonio".
  | ja_text            = チューナー２体＋チューナー以外のモンスター１体<br />このカードはＳ召喚及び以下の方法でのみ特殊召喚できる。<br />●自分の墓地からチューナー２体と「レッド・デーモンズ・ドラゴン」１体を除外した場合にＥＸデッキから特殊召喚できる。<br />このカード名の①の効果は自分が「レッド・デーモンズ・ドラゴン」をＳ召喚したデュエル中に１度だけ使用できる。<br />①：このカードが特殊召喚した場合に発動できる。自分の墓地からカード１枚を手札に加え、このカードの攻撃力は２０００アップする。<br />②：フィールドのこのカードは効果では破壊されない。
  | ko_name            = 스카레드 노바 드래곤－버닝 소울
  | ko_text            = 튜너 2장 ＋ 튜너 이외의 몬스터 1장<br />이 카드는 싱크로 소환 및 이하의 방법으로만 특수 소환할 수 있다.<br />●자신 묘지에서 튜너 2장과 "레드 데몬즈 드래곤" 1장을 제외했을 경우에 엑스트라 덱에서 특수 소환할 수 있다.<br />이 카드명의 ①의 효과는 자신이 "레드 데몬즈 드래곤"을 싱크로 소환한 듀얼 중에 1번만 사용할 수 있다.<br />①: 이 카드를 특수 소환했을 경우에 발동할 수 있다. 자신 묘지에서 카드 1장을 패에 넣고, 이 카드의 공격력은 2000 올린다.<br />②: 필드의 이 카드는 효과로는 파괴되지 않는다.
  | tc_name            = 緋暗紅新星龍－燃燒之魂
  | tc_text            = 協調2隻＋協調以外的怪獸1隻<br />此卡僅可透過同步召喚及以下方法特殊召喚。<br />●從自己墓地將2隻協調和1隻「闇紅惡魔龍」除外的情況下，可從額外牌組特殊召喚。<br />此卡名的①效果在決鬥中僅可使用1次，且僅可在自己同步召喚過「闇紅惡魔龍」的決鬥中使用。<br />①：此卡特殊召喚的情況下可以發動。從自己墓地將1張卡加入手牌，此卡的攻擊力上升2000。<br />②：場上的此卡不會因效果被破壞。
  | sc_name            = 绯暗红新星龙－燃烧之魂
  | sc_text            = 协调2只＋协调以外的怪兽1只<br />此卡仅可通过同步召唤及以下方法特殊召唤。<br />●从自己墓地将2只协调和1只“暗红恶魔龙”除外的情况下，可从额外牌组特殊召唤。<br />此卡名的①效果在决斗中仅可使用1次，且仅可在自己同步召唤过“暗红恶魔龙”的决斗中使用。<br />①：此卡特殊召唤的情况下可以发动。从自己墓地将1张卡加入手牌，此卡的攻击力上升2000。<br />②：场上的此卡不会因效果被破坏。
