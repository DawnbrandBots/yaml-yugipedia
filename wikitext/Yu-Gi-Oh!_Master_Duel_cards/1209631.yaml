title: GMX Chairman Kimridge (Master Duel)
wikitext: |-
  {{Master Duel card
  | rarity             = SR
  | attribute          = LIGHT
  | types              = Psychic / Effect
  | level              = 4
  | atk                = 1000
  | def                = 900
  | text               = You can reveal this card in your hand; add 1 "GMX Applied Experiment #55" from your Deck or GY to your hand, and if you do, shuffle this card into the Deck. If this card is Special Summoned by a monster effect: You can target 2 cards in your GY, that are "GMX" cards and/or Dinosaur monsters; place them on top of your Deck in any order, then you can destroy 1 Attack Position monster your opponent controls. You can only use each effect of "GMX Chairman Kimridge" once per turn.

  | fr_name            = Kimridge, Directeur GMX
  | fr_text            = Vous pouvez révéler cette carte dans votre main ; ajoutez 1 "Expérience Appliquée #55 GMX" depuis votre Deck ou Cimetière à votre main, et si vous le faites, mélangez cette carte dans le Deck. Si cette carte est Invoquée Spécialement par un effet de monstre : vous pouvez cibler 2 cartes dans votre Cimetière, qui sont des cartes "GMX" et/ou des monstres Dinosaure ; placez-les au-dessus de votre Deck dans l'ordre de votre choix, puis vous pouvez détruire 1 monstre en Position d'Attaque contrôlé par votre adversaire. Vous ne pouvez utiliser chaque effet de "Kimridge, Directeur GMX" qu'une fois par tour.
  | de_name            = GMX-Vorsitzender Kimridge
  | de_text            = Du kannst diese Karte in deiner Hand vorzeigen; füge deiner Hand 1 „Angewandtes GMX-Experiment Nr. 55“ von deinem Deck oder Friedhof hinzu und falls du dies tust, mische diese Karte ins Deck. Falls diese Karte durch einen Monstereffekt als Spezialbeschwörung beschworen wird: Du kannst 2 Karten, die „GMX“-Karten und/oder Dinosaurier-Monster sind, in deinem Friedhof wählen; lege sie in beliebiger Reihenfolge auf dein Deck, dann kannst du 1 Monster in Angriffsposition zerstören, das dein Gegner kontrolliert. Du kannst jeden Effekt von „GMX-Vorsitzender Kimridge“ nur einmal pro Spielzug verwenden.
  | it_name            = GMX Professore Ordinario Kimridge
  | it_text            = Puoi rivelare questa carta nella tua mano; aggiungi 1 "GMX Esperimento Applicato #55" dal tuo Deck o Cimitero alla tua mano e, se lo fai, mischia questa carta nel Deck. Se questa carta viene Evocata Specialmente dall'effetto di un mostro: puoi scegliere come bersaglio 2 carte nel tuo Cimitero, che sono carte "GMX" e/o mostri Dinosauro; mettile in cima al tuo Deck in qualsiasi ordine, poi puoi distruggere 1 mostro in Posizione di Attacco controllato dal tuo avversario. Puoi utilizzare ogni effetto di "GMX Professore Ordinario Kimridge" una sola volta per turno.
  | pt_name            = Kimridge, o Professor da GMX
  | pt_text            = Você pode revelar este card na sua mão; adicione 1 "Experimento Aplicado GMX nº 55" do seu Deck ou Cemitério à sua mão e, se isso acontecer, embaralhe este card no Deck. Se este card for Invocado por Invocação-Especial por um efeito de monstro: você pode escolher 2 cards no seu Cemitério, que sejam cards "GMX" e/ou monstros Dinossauro; coloque-os no topo do seu Deck em qualquer ordem e, depois, você pode destruir 1 monstro em Posição de Ataque que seu oponente controla. Você só pode usar cada efeito de "Kimridge, o Professor da GMX" uma vez por turno.
  | es_name            = Kimridge, Director de GMX
  | es_text            = Puedes mostrar esta carta en tu mano; añade a tu mano 1 "Experimento Aplicado #55 de GMX" en tu Deck o Cementerio y, si lo haces, baraja esta carta al Deck. Si esta carta es Invocada de Modo Especial por un efecto de monstruo: puedes seleccionar 2 cartas en tu Cementerio, que sean cartas "GMX" y/o monstruos Dinosaurio; ponlas en la parte superior de tu Deck en cualquier orden, y después puedes destruir 1 monstruo en Posición de Ataque que controle tu adversario. Sólo puedes usar cada efecto de "Kimridge, Director de GMX" una vez por turno.
  | ja_text            = このカード名の①②の効果はそれぞれ１ターンに１度しか使用できない。<br />①：手札のこのカードを相手に見せて発動できる。自分のデッキ・墓地から「第５５次ＧＭＸ応用試験」１枚を手札に加え、このカードをデッキに戻す。<br />②：このカードがモンスターの効果で特殊召喚した場合、自分の墓地の「ＧＭＸ」カードか恐竜族モンスターを合計２枚対象として発動できる。そのカードを好きな順番でデッキの上に戻す。その後、相手フィールドの攻撃表示モンスター１体を破壊できる。
  | ko_name            = GMX 주임교수 킴릿지
  | ko_text            = 이 카드명의 ①②의 효과는 각각 1턴에 1번밖에 사용할 수 없다.<br />①: 패의 이 카드를 상대에게 보여주고 발동할 수 있다. 자신의 덱 / 묘지에서 "제55차 GMX(제노믹스) 응용시험" 1장을 패에 넣고, 이 카드를 덱으로 되돌린다.<br />②: 이 카드를 몬스터의 효과로 특수 소환했을 경우, 자신 묘지의 "GMX(제노믹스)" 카드나 공룡족 몬스터를 합계 2장 대상으로 하고 발동할 수 있다. 그 카드를 좋아하는 순서대로 덱 위로 되돌린다. 그 후, 상대 필드의 공격 표시 몬스터 1장을 파괴할 수 있다.
  | tc_name            = GMX主任教授 金里奇
  | tc_text            = 此卡名的①②效果1回合僅可各使用1次。<br />①：向對手出示手牌的此卡可以發動。從自己牌組・墓地將1張「第55次GMX應用實驗」加入手牌，將此卡放回牌組。<br />②：此卡以怪獸的效果特殊召喚的情況下，以自己墓地的合計2張「GMX」卡或恐龍族怪獸為對象可以發動。將該卡以喜歡的順序放回牌組上面。然後，可將對手場上的1隻攻擊表示怪獸破壞。
  | sc_name            = GMX主任教授 金里奇
  | sc_text            = 此卡名的①②效果1回合仅可各使用1次。<br />①：向对手出示手牌的此卡可以发动。从自己牌组・墓地将1张“第55次GMX应用实验”加入手牌，将此卡放回牌组。<br />②：此卡以怪兽的效果特殊召唤的情况下，以自己墓地的合计2张“GMX”卡或恐龙族怪兽为对象可以发动。将该卡以喜欢的顺序放回牌组上面。然后，可将对手场上的1只攻击表示怪兽破坏。
  }}
