  "'''Winged Kuriboh'''" (ハネクリボー ''Hane Kuribō'') is an [[archetype]] of [[LIGHT]] [[Fairy]] [[Monster Card|monsters]] used by [[Jaden Yuki]] in the ''[[Yu-Gi-Oh! GX]]'' anime and [[Yu-Gi-Oh! GX (manga)|manga]], as well as a sub-archetype of the "[[Kuriboh (archetype)|Kuriboh]]" archetype.

  ==Playing style==
  "Winged Kuriboh" members mainly have a common defensive playstyle nature much like with the "[[Kuriboh (archetype)|Kuriboh]]" archetype and are able to either prevent [[battle damage]], [[destroy]] monsters and/or inflict [[effect damage]] under certain circumstances. 

  The original "[[Winged Kuriboh]]" helps to prevent taking battle damage for the rest of the turn if it is destroyed though it can also be upgraded into "[[Winged Kuriboh LV10]]" with "[[Transcendent Wings]]" to be a surprise blowout card during the opponent's Battle Phase to destroy all of their Attack Position monsters and inflict damage equal to their combined original ATK.

  "[[Winged Kuriboh LV6]]", "[[Winged Kuriboh Sabatiel LV10]]" and the archetype's dedicated support [[Spell Card]] "[[Sabatiel - The Philosopher's Stone]]" support the "[[HERO]]" archetype's [[Fusion Monster|Fusion]]-based playstyle. The former is also treated as an "[[Elemental HERO]]" and a "[[Favorite]]" card which can Special Summon itself by banishing an "Elemental HERO" Fusion Monster or the original "Winged Kuriboh". It can Tribute itself, whenever the opponent declares an attack or activates a monster effect on the field, to destroy the opposing monster and inflict damage equal to its ATK. The "Sabatiel" cards are able to search "[[Fusion (archetype)|Fusion]]" Spells or "[[Polymerization (archetype)|Polymerization]]" Spells that "HERO" strategies are heavily reliant on while "Sabatiel LV10" can unexpectedly win games if the user has 1000 or less LP to Special Summon itself and inflict damage equal to the highest ATK among the opposing monsters.

  "[[Winged Kuriboh LV9]]" does not synergize with either archetype's playstyle groups.

