  ==Playing style==
  The playstyle of the "Sacred Beast" cards is significantly different to the original Sacred Beasts; while it remains similar to the original theme, it has a more consistent and powerful game plan by modern standards. The three "Sacred Beast" retrains of the original trio ("[[Infinity of the Sacred Beasts - Raviel, Lord of Phantasms|Infinity - Raviel]]", "[[Calamity of the Sacred Beasts - Hamon, Lord of Striking Thunder|Calamity - Hamon]]", "[[Inferno of the Sacred Beasts - Uria, Lord of Searing Flames| Inferno - Uria]]") now have a useful in-hand effect to search for a "Sacred Beast" card of their corresponding card type but must then discard 1 card. While still [[Nomi]] monsters, they must be Special Summoned with "Sacred Beast" effects. Of the "Sacred Beast" monsters besides the three "Sacred Beast" retrains, "[[Summoner of the Sacred Beasts]]" can help Special Summon these monsters with each of its effects that can be used while in the hand, field or GY while "[[Martyr of the Sacred Beasts]]" can place any "Sacred Beast" [[Continuous Spell Card]]/[[Continuous Trap Card|Trap]] or [[Field Spell Card|Field Spell]] from the Deck to the field face-up, then can Summon 2 more copies of itself if another "Sacred Beast" monster is on the field. If able to be Special Summoned, "Uria" and "Raviel" boast [[Quick Effects]] that lets them destroy a Spell/Trap and all of the opponent's monsters (at the cost of Tributing 2 other "Sacred Beast" monsters), respectively. Meanwhile, "Hamon" inflicts 1000 [[damage]] to the opponent if a monster is sent to their GY while protecting the user from taking damage for the turn should it be destroyed.

  Many "Sacred Beast" Spells and Traps focus on being able to search and/or easily Special Summon the "Sacred Beast" retrains. "[[Sacred Beasts Released]]" can search 3 "Sacred Beast" monsters then discard 2 cards while "[[Sacred Beasts Thunderclap]]" can place 2 more copies of itself from the hand, Deck or GY then can place the Field Spell "[[Fallen Paradise of the Sacred Beasts]]" from the Deck. By sending 3 cards of the same type from the hand or GY, "Fallen Paradise of the Sacred Beasts" can Special Summon a "Sacred Beast" monster thrice per turn; the copies of "Thunderclap" can be used for this effect. "Fallen Paradise" then allows the player to draw 2 cards to make up for the loss of card advantage. "[[Abyss of the Sacred Beasts]]" can place 2 more copies of itself from the hand, Deck or GY face-up on the field, allowing it to fulfill the requirements for either "Fallen Paradise of the Sacred Beasts" or its own effect of situationally changing an opponent's monster into face-down Defense Position. The Normal Trap "[[Sacred Beasts Combined Assault]]" can Special Summon a "Sacred Beast" monster from the hand or GY, then situationally negate the effects of a face-up card and destroy it. It can also Fusion Summon a "[[Phantasm]]" [[Fusion Monster]]; the most useful being "[[The Chaotic Phantasmal Sacred Beasts]]", which can negate the effects of up to three of the opponent's monsters per turn as a Quick Effect. Finally, the Quick-Play Spell "[[Shimmering Shatterer of the Sacred Beasts]], can either be used to negate an opponent's card activated in response to the activated effect of the user's "Sacred Beast" monster, search "[[Illusion Gate]]", or recycle "Sacred Beast" Traps to destroy an opponent's card. "Martyr", "Thunderclap" and "Abyss" can recover themselves from the GY to the player's hand (or to the bottom of the Deck in the case of "Abyss") during the opponent's End Phase, letting the player re-assemble their field on their next turn should "Fallen Paradise" be present.

  The "Sacred Beast" cards generally have minimal direct synergy with the original Sacred Beast series, but most of the cards can help Summon the original Sacred Beasts more easily. Other overlaps with the original series include "[[Awakening of the Sacred Beasts]]" which can be searched by "Inferno - Uria" or "Martyr of the Sacred Beasts", the three original Sacred Beasts being searchable with the secondary effect of "Sacred Beasts Released" and both playstyles are connected via the Fusion-based "Phantasm" support where any combination of the original Sacred Beasts and "Sacred Beast" cards (being Level 10 and are monsters which cannot be Normal Summoned/Set) can be used to Summon "Phantasm Emperor Trilojig" or "The Chaotic Phantasmal Sacred Beasts".

  === Other additions===
  The ability to Summon numerous "Sacred Beast" monsters easily allows the Deck to incorporate secondary engines and include various generic Extra Deck monsters due to having a small number of in-theme Extra Deck monsters and not having any restrictions of Summoning non-archetypal monsters.

  * With "Calamity of the Sacred Beasts - Hamon, Lord of Striking Thunder" and "Summoner of the Sacred Beasts" being [[Thunder]] monsters with in-hand effects, the archetype is capable of natively Summoning "[[Thunder Dragon Colossus]]" as an option to deter the opponent's ability to search. 

  * "[[Fiendsmith]]" can be a powerful complementary engine to use alongside "Sacred Beast" since the latter is capable of Summoning enough Fiend monsters to make use of "[[Reprodocus]]" to generate a LIGHT Fiend to bridge into the "Fiendsmith" engine. Most "Sacred Beast" card effects involve discarding, allowing the effect of the commonly ran LIGHT Fiend monster "[[Fabled Lurrie]]" to Special Summon itself from the GY to activate. Likewise, the "Fiendsmith" engine can also be a starter to get into "Sacred Beast" by Fusion Summoning "[[Aerial Eater]]" with "[[Fiendsmith's Sequence]]" which can send "Infinity of the Sacred Beasts - Raviel, Lord of Phantasms" to the GY to be retrieved later with "[[Constellar Ptolemy M7]]".

  === Sample combos ===
  {{Combo steps
  | opening = "[[Calamity of the Sacred Beasts - Hamon, Lord of Striking Thunder]]"
  | end = "[[Fiendsmith's Sequence]]" + "[[Thunder Dragon Colossus]]" + "[[D/D/D Wave High King Caesar]]" + "[[The Chaotic Phantasmal Sacred Beasts]]" + 3 cards in hand.
  | steps =
  # Activate the effect of "[[Calamity of the Sacred Beasts - Hamon, Lord of Striking Thunder]]" ("Calamity Hamon") to search for "[[Sacred Beasts Released]]", then discard "Calamity Hamon".
  # Activate "Sacred Beasts Released" to add "[[Infinity of the Sacred Beasts - Raviel, Lord of Phantasms]]" ("Infinity Raviel"), "[[Martyr of the Sacred Beasts]]" ("Martyr") and "[[Summoner of the Sacred Beasts]]" ("Summoner"), then discard the latter 2 cards.
  # Activate the effect of "Infinity Raviel" to add a 2nd copy of "Calamity Hamon" from the Deck, then discard "Infinity Raviel".
  # Activate the effect of "Summoner" by banishing it to Special Summon "Martyr" from the GY.
  # Activate the effect of "Martyr" to place "[[Sacred Beasts Thunderclap]]" ("Thunderclap") from the Deck to the [[Spell & Trap Zone]].
  # Activate the on-field of "Thunderclap" to place 2 more copies of itself from the hand, Deck or GY, then reveal "Calamity Hamon" in the hand to place "[[Fallen Paradise of the Sacred Beasts]]" ("Fallen Paradise").
  # Activate the on-field effect of "Fallen Paradise of the Sacred Beasts" to send the 3 copies of "Thunderclap" in the Spell & Trap Zones then Special Summon the banished copy of "Summoner".
  # Activate the effect of "Martyr" to Special Summon 2 more copies of itself from the hand, Deck or GY. Make sure that at least 1 copy of "Martyr" is Summoned to a [[Main Monster Zone]] directly underneath a vacant [[Extra Monster Zone]].
  # Use 2 copies of "Martyr" to [[Link Summon]] "[[Reprodocus]]", ensuring that the remaining "Martyr" is in the same column as "Reprodocus".
  # Activate the effect of "Reprodocus" to change the [[Attribute]] of that copy of "Martyr" to [[LIGHT]].
  # Use the copy of the now-LIGHT "Martyr" to Link Summon "[[Fiendsmith's Requiem]]" ("Requiem").
  # Activate the effect of "Requiem" to Special Summon "[[Lacrima the Crimson Tears]]" ("Lacrima") from the hand or Deck.
  # Activate the effect of "Lacrima the Crimson Tears" to send "[[Fiendsmith Engraver]]" ("Engraver") from the Deck to the GY.
  # Activate the effect of "Requiem" to equip itself to "Lacrima".
  # Send "Requiem" and "Lacrima the Crimson Tears" to Special Summon "[[Necroquip Princess]]" ("Necroquip").
  # Activate the effect of "Summoner" by discarding the 2nd copy of "Calamity Hamon" to Special Summon the 1st copy of "Calamity Hamon" from the GY.
  # Activate the effect of "Necroquip" to draw 1 card.
  # Activate the effect of "Fallen Paradise" to draw 2 cards.
  # Activate the effect of "Engraver" by returning "Requiem" to the Extra Deck to Special Summon itself back.
  # Use "Necroquip" and "Engraver" to Xyz Summon "[[D/D/D Wave High King Caesar]]". 
  # Use "Calamity Hamon" or "Summoner" and "Reprodocus" to Link Summon "[[Cross-Sheep]]".
  # Tribute "Summoner" or "Calamity Hamon" to Special Summon "[[Thunder Dragon Colossus]]" to a Main Monster Zone "Cross-Sheep" points to.
  # Activate the effect of "Cross-Sheep" to Special Summon "Lacrima".
  # Use "Lacrima" and "Cross-Sheep" to Link Summon "[[Fiendsmith's Sequence]]" ("Sequence").
  # Activate the effect of "Sequence" to Fusion Summon "[[The Chaotic Phantasmal Sacred Beasts]]" by shuffling "Infinity Raviel" and the 2 copies of "Calamity Hamon" from the GY into the Deck.
  }}

