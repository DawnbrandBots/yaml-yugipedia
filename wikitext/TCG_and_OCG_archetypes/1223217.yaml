  "'''Reindsurm'''" (リインゼルム ''Riinzerumu'') is an archetype of [[Insect]] [[Ritual Monster]]s with various [[Attribute]]s introduced in ''[[Immortal Phoenix]]''.

  ==Design==
  All members of this archetype are Insect monsters that have resemblance to [[Dragon|Dragons]]. It is implied that the Level 4 members are parasitic Insects who use Dragon's corpses to gestate and metamorphose into their stronger Level 8 forms. This is reference in their effects, the level 4 members using fallen Dragon monsters in the Graveyards as material for their effect to [[Ritual Summon]], and in the effect of Giriakarma (''see below'').

  ==Members==
  The archetype's monster lineup is composed of Level 4 and 8 Ritual Monsters. Each Level 8 "Reindsurm" monster has a corresponding Level 4 monster with an opposite Attribute (e.g. [[DARK]] and [[LIGHT]]) and equal [[DEF]]. The [[ATK]] of the Level 8 "Reindsurm" monsters is the sum of their corresponding Level 4 monster's ATK and DEF.

