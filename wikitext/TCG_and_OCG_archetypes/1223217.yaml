  ==Playing Style==
  All of the Level 4 "Reindsurm" have effects that trigger when they are sent to the [[Graveyard]] (except by battle). Thanks to "[[Reindsurm Gigalovendra]]" and "[[Javelin Beetle of the Alliance]]" having Quick Effects in hand that allow you to either discard to add, or Ritual Summon by Tributing respectively, this allows for the deck to make Turn 0 plays.

  Due to Insects and Reptiles having some synergy via the "[[Ragnaraika]]" archetype, "Reindsurm" can also be hybridized with them alongside "[[Mitsurugi]]"; allowing them to benefit off their mutual status as Ritual archetypes.

