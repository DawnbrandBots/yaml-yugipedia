  "'''Number'''", known as "'''Numbers'''" (ナンバーズ ''Nanbāzu'') in the ''[[OCG]]'', is an [[archetype]] of [[Spell Cards|Spells]]/[[Trap Cards|Traps]] that support "[[Number]]" [[Xyz Monster]]s.

  While it has only one support card ("[[Astraltopia]]"), this technically has the most members of any archetype, due to the monster archetype (「{{card name|Number|ja}}」) being part of it, which works out in a total of {{hardcoded query|{{#ask: [[Archseries::Number (Spell/Trap archetype)]] [[Concept:CG cards]]|format=count}}}} members: {{hardcoded query|{{#ask: [[Archseries::Number]] [[Primary type::Xyz Monster]] [[Concept:CG monsters]]|format=count}}}} Xyz Monsters, 4 [[Boss Duel]]-only [[Monster Token|Tokens]] Summoned by "[[Don Thousand/Spell B]]", "[[Numeral Hunter]]", and {{hardcoded query|{{#ask: [[Archseries::Number (Spell/Trap archetype)]] [[Concept:CG non-monster cards]]|format=count}}}} Spell/Trap Cards.

  However, "Astraltopia" specifically only searches the Spells and Traps, so its effective size is very small.

