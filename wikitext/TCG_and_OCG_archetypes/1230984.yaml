  "'''Bunnillin'''" (バニリン ''Banirin'') is an [[archetype]] released in in ''[[Immortal Phoenix]]''. It is focused on interacting with [[Normal Monster]]s, especially those that are Level 5 or higher and have 2000 or less original ATK/DEF.

  ==Etymology==
  "Bunnillin" is a portmanteau of "bunny" and "[[wikipedia:Vanillin|vanillin]]," the chemical compound that gives vanilla its taste and smell. "Bunnillin" ('''バニ'''リン) also shares the first two rōmaji with "vanilla" ('''バニ'''ラ). All the monsters in the "Bunnillin" archetype are based on rabbits/bunnies, and Normal Monsters, which this archetype supports, are frequently called '''Vanilla''' Monsters. The cards themselves also reference vanilla-flavored items, such as ''mocha'', ''extract'', and ''soft serve''.

