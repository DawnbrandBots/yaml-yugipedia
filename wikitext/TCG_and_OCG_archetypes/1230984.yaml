  "'''Bunnillin'''" (バニリン ''Banirin'') is an [[archetype]] released in in ''[[Immortal Phoenix]]''. It is focused on interacting with [[Normal Monster]]s, especially those that are Level 5 or higher and have 2000 or less original ATK/DEF.

  ==Etymology==
  "Bunnillin" is a portmanteau of "bunny" and "[[wikipedia:Vanillin|vanillin]]," the main chemical compound that gives vanilla its taste and smell. In Japanese, the connection is even more explicit, as it uses the exact same katakana (バニリン) as the word for "vanillin"; the first two katakana are also used for the word for "bunny" (バニー, ''banii''). All the monsters in the "Bunnillin" archetype are based on rabbits/bunnies, and Normal Monsters, which this archetype supports, are frequently called '''Vanilla''' Monsters.


  ==Members==
