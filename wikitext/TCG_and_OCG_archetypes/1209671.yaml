  "'''Dominus Purge'''" (ドミナス・パージ Dominasu Paaji) is an archetype that debuted in ''[[The Infinite Forbidden]]''. It is a sub-archetype of the "[[Dominus]]" archetype and currently only consists of one card, "[[Dominus Purge]]". It received its first support in ''[[Utility Selection]]''.

