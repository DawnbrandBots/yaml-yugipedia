  ==Design==
  The Cubic monsters are bizarre creatures with weird body proportions and shapes. 
  * The "Cubic Beasts" are slightly recognizable with "Garnex" and "Garoodia" looking like animals and "Gundil" looking like a stone building. 
  * The "Cubic Kings" are more abstract with some of their body parts looking extremely long while other parts are overly short. 
  * The "Cubic Lords" have the shared trait of a translucent cube as their midsection and clusters of cubes on their lower bodies.
  * The "Cubic Vessels" are black creatures with opposing designs, "Duza" has an upper body with arms and no legs (it also vaguely looks like "Indiora Doom Volt"), while "Pritima" is an egg like creature with legs but no upper body.  
  The basis for these monsters, "Vijam" is a teardrop-like creature (or seed) with wings, a head fringe, and a singular emotionless eye. This monster's eye and texture can be seen on various portions of the "Cubic Kings" and "Cubic Beasts", with the amount of portions (mostly) reflecting the number of "Vijams" needed to bring them out. The eyes also appear on the "Cubic Lords". A recurring design element on both their media depictions and their Spell/Trap support are orange energy cubes, tying into the [[Quantum Cube]] used by Aigami.   

  == Playing style ==
  The archetype is centered around swarming the field with "[[Vijam the Cubic Seed]]" and using it as material for stronger monsters, who benefit from having "Vjam" in the GY. It aims to Summon its boss monsters, which are [[unaffected]] by lower ATK monsters, and go for an [[OTK]].

  The "Cubic" monsters can be split into several sub-groups.

