  Their Spells and Traps often modulate the ATK of monsters or place [[Cubic Counter]]s on opposing monsters (which negate their effects and prevent attacks).
  * "[[Cubic Bodhi]]" sends a "Cubic" card to the GY on activation, can place a Cubic Counter on field by discarding, and perform a Fusion Summon when a Cubic" monster is Summoned.
  * "[[Cubic Causality]]" places a number of Cubic Counters on opponent's monsters equal to the number of Cubic monsters you control. It can banish itself to make it so that 1 specific "Cubic" monster you control can inflict damage to your opponent equal to the original ATK of the monster it destroyed by battle, but only if that opponents monster had a Cubic Counter on it.
  * "[[Cubic Wave]]" doubles the ATK of one of the controller's "Cubic" monsters and halves that of an opponent's monster. It can banish itself and any number of "Cubic" monsters from the GY, placing a number of Cubic Counters on opponent's monsters equal to the number of banished monsters.
  * "[[Cubic Karma]]" sends copies of "Vijam" from the Deck to the Graveyard, while also giving one of the controller's "Cubic" monsters, except "Vijam", 800 ATK per sent monster. It also halves the opponent's LP by sending itself to the Graveyard when "Vijam" is Special Summoned by a "Cubic" monster's effect during the opponent's turn, and can banish itself form the GY to search a "Cubic" monster.
  * "[[Unification of the Cubic Lords]]" is a Fusion Trap that enables the summoning of "Cubic" Fusion Monster with materials from hand/field. It can also banish itself from the Graveyard to enable the controller to Special Summon a Level 4 or lower "Cubic" monster from the hand or Deck, ignoring its summoning conditions and gives protection from destruction that turn.
  * "[[Cubic Mandala]]" lets the controller target the opponent's destroyed monsters in the Graveyard that were sent there that turn and Special Summon them to the opponent's field, whilst reducing their ATK to 0 and placing a Cubic Counter on each. The card also plays a key role in further locking down the opponent's other monster effects, negating any activated ones while the opponent controls the summoned monsters. 
  * "[[Cubic Rebirth]]" punishes the opponent for declaring direct attacks by Special Summoning their other copies of the attacking monster from their hand, Deck, and Graveyard, then striping those monsters of all their ATK and placing Cubic Counters on them. It then has a GY effect that Special Summons a Level 4 or lower "Cubic" monster from the hand or Deck, ignoring the summoning conditions.
  * "[[Cubic Ascension]]" punishes the opponent for declaring an attacks by Special Summoning "Vijam" from Deck and redirecting the attack to it. It can banish itself if the opponent's LP is at least 2000 higher, to Special Summon "Vijam" from your hand, Deck, or GY  or up to 3 copies of "Vijam" if only the opponent controls a monster.
  * "[[Cubic Dharma]]" you do take battle damage from attacks involving your "Cubic" monsters. Can send 1 "Cubic" card from the hand to the GY to draw 1 card. It can banish itself to recover a "Cubic" monster from GY.

  === External cards ===
  As the deck's key consistency cards ("Karma" / "Dharma" / "Unification") trigger their "Cubic" searching effects only when in Graveyard, the deck can benefit greatly from additional means of sending these cards to Graveyard.

  The "[[Horus]]" archetype can easily send these cards from hand to GY while maintaining advantage, they can also generate enough bodies to summon "[[Cross-Sheep]]" and then "[[Dark Magician of Destruction]]" (via "[[Imsety, Glory of Horus]]") in order to bring back a "Duza" to send an additional card. "Dark Magician of Destruction" can in turn search for "[[Magicians' Souls]]" - which can send the aformentioned "Cubic" Spell/Traps to GY in order to draw additional cards.

  If multiple "Duza" are present on the field, they can be used to make "[[Gear Gigant X]]", who can add a "Duza" to hand as fuel for "Crimson Nova".

  "[[Union Activation]]" can also increase the consistency of the deck, as it can add "Duza" through "[[V-Tiger Jet]]".

  === Weaknesses ===
  * The archetype is heavily oriented around battle: their boss monsters exclusively focus on ATK gain, battle, and effect damage.
  * Because the "Cubic Beasts", "Kings", and "Lords" all require multiple "Cubic" monsters in field/hand, the archetype is prone to bricking or dead hands.
  * Since the archetype is centered around having "Vijam" in the GY and Summoning from the GY, anti-GY floodgates like "[[Dimensional Fissure]]" and "[[Macro Cosmos]]" will largely shut off their archetype.
  * Any effects that prevent "Vijam" from being Summoned, such as "[[Psi-Blocker]]" and "[[Prohibition]]", can severely cripple the archetype. Though, if the "Cubic" player runs "[[Engraver of the Mark]]", such a move can backfire greatly.

