  == Design ==
  The monster's [[ATK]] and [[DEF]] stats are related to their [[Level|Levels]], the rules are the following:<br>
  ATK = 300 x Level + 600<br>
  DEF = 300 x Level<br>

  All monsters have 2 effects, one that is related to the hand and the other triggers if others card are / have been destroyed.<br>
  These effects are [[Hard once per turn]].

