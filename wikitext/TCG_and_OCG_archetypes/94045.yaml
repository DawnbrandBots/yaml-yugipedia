  The artwork for the Spells/Traps depict the watery imagery of the World of Darkness, with "[[Darkness|Darkness]]" itself showcasing a demonic skeleton figure akin to Nightshroud but with a fully open robe and no wings. The related Traps "[[Zero]]" and "[[Infinity (card)|Infinity]]" reference the creation of the universe: with "Zero" depicting a drop of water akin to the [https://en.wikipedia.org/wiki/Nun_(mythology)%5D primordial sea] in Egyptian mythology (and alluding to the World of Darkness); and "Infinity" depicting the [https://en.wikipedia.org/wiki/Milky_Way Milky Way] galaxy, referencing the [https://en.wikipedia.org/wiki/Big_Bang Big Bang] and expansion of the universe (and a possible allusion to the space theme of the [[Neo-Spacians]]). 

