  "'''Zubaba'''" (ズババ ''Zubaba'') is an [[archetype]] of mostly [[EARTH]] [[Warrior]] [[Monster Card|monsters]]. These cards are used by both [[Yuma Tsukumo]] and [[Astral]] in the ''[[Yu-Gi-Oh! ZEXAL]]'' anime, [[Yu-Gi-Oh! ZEXAL (manga)|manga]] and [[Yu-Gi-Oh! D Team ZEXAL|spin-off manga]].

  == Playing style ==
  {{Main|Utopia#Playing style}}

  Zubaba is played as part of a broader "[[Onomat]]"/"[[Utopia]]" [[Rank 4 Monster Cards|Rank 4]] strategy. Their modern support cards - consisting of "[[Zubababancho Gagagacoat]]", "[[Zubababa Knight]]", "[[Utopic Onomatopoeia]]", and "[[Onomatokage]]" - all belong to and support the other "Onomat" archetypes.

