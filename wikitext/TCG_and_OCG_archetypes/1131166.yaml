  ==Playstyle==
  The archetype can be split into three groups:
  * The low-Level monsters can be Special Summoned from the hand if "Mystical Space Typhoon" is in the controller's GY, or the opponent controls no Spells/Traps. With the exception of "Meghala" they each have an effect to search on Summon.
  * The high-Level monsters can be Special Summoned from the hand if any Quick-Play Spell is activated, or from the GY whenever "Mystical Space Typhoon" is activated (except "Krosea"). They generally have disruptive effects.
  * The Spells/Traps can be Set if destroyed by "Mystical Space Typhoon", allowing them to be re-used during the opponent's turn.
  ** The Quick-Play Spells can all add "Mystical Space Typhoon" from Deck/GY or use their unique effect.

  Usually, the "Radiant Typhoon" archetype aims to swarm monsters to Link Summon "[[Radiant Typhoon Varuroon, the Marine Eidolon]]" which after adding "Mystical Space Typhoon" to the hand from GY/Deck, it can place "[[Radiant Typhoon Mandate]]" if a Quick-Play Spell Card is activated, which can recycle Quick-Play Spells from the GY and can negate a face-up card their opponent controls when "Mystical Space Typhoon" is activated.

  Because the "Radiant Typhoon" archetype supports all Quick-Play Spells, it can synergize with other Quick-Play Spell centric archetypes, such as "[[Runick]]".

  ===Weaknesses===
  * Cards that prevent Spell Cards from being activated such as "[[Secret Village of the Spellcasters]]" can hinder "Radiant Typhoon" strategies completely. 
  ** While "[[Invader of Darkness]]" prevents the opponent from activating Quick-Play Spell Cards specifically, it is still a potent floodgate against "Radiant Typhoon".

  * Using "[[Cursed Seal of the Forbidden Spell]]" or "[[Solemn Accusation]]" against "Mystical Space Typhoon" (which either prevents activating said card for the rest of the Duel or has all copies of said card banished which cannot be retrieved by in-archetype methods, respectively) renders most of the archetype's strategies useless.

  * [[Hand trap]]s:

  ** The on-Summon effect of "Radiant Typhoon Krosea" is a key card effect to negate as this allows the deck to add 2 cards from the Deck or GY so "[[Ash Blossom & Joyous Spring]]", "[[Ghost Belle & Haunted Mansion]]", "[[Dominus Purge]]", "[[Effect Veiler]]", "[[Infinite Impermanence]]" and "[[Ghost Mourner & Moonlit Chill]]" can be useful.
  ** "[[Ghost Ogre & Snow Rabbit]]" can be used to deal with "Radiant Typhoon Mandate" provided that the monster negate effect of "[[Radiant Typhoon Varuroon, the Vibrant Vortex]]" has already being used. 

