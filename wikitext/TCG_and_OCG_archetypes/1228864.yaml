  "'''Celestigard'''" is a [[TCG-only|World Premiere]] [[archetype]] introduced in ''[[Immortal Phoenix]]''. It aims to use its [[Main Deck]] monsters of different [[Level]]s to [[Xyz Summon]] monsters that require 3 or more materials.<ref>{{Cite web| url = https://www.yugioh-card.com/en/products/imph/ | title = Immortal Phoenix | publisher = yugioh-card.com | date = September 21, 2026 | accessdate = September 21, 2026 | archive-url = https://web.archive.org/web/20260921212020/https://www.yugioh-card.com/en/products/imph/ | archive-date = September 21, 2026 | url-status = live }}</ref>

