  "'''Dominus'''" (ドミナス ''Dominasu'') is an [[archetype]] of primarily [[Normal Trap Card]]s that debutted in ''[[The Infinite Forbidden]]''.

  ==Design==
  "Dominus" Traps depict large colorful creatures accompanied by young girls with the same color scheme, the latter being monsters that support those Traps. In Japanese, the archetype's name is presented as standing for some form of "___ King", implying the large creatures are rulers of certain elements, while the Japanese name of "[[Dominusteer Rosepamela]]" and the concept art of "[[Dominus Impulse]]" labelling the respective girls as "Princess" (with the same descriptor) seems to indicate they serve those creatures.

  Effect-wise, the Traps all follow a very specific format: they can be [[activate]]d from the [[hand]] under a certain condition, but doing so prevents the player from activating the [[Monster effect|effects of monsters]] with certain [[Attribute]]s for the rest of the Duel. Their effects also have either a bonus if the player has a Trap in their [[Graveyard]] or a downside if they do not, somewhat discouraging their use in the first turn of the Duel.

