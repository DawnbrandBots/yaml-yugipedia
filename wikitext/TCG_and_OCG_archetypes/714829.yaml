  == Weakness ==
  * As the Deck relies heavily on [[Graveyard]] effects for its grind game, cards such as "[[Dimension Shifter]]", "[[D.D. Crow]]", or "[[Bystial]]" monsters can cut off the deck's resource loop.
  * While "Evil★Twin's Trouble Sunny" provides good interruption during the opponent's turn, mass removal cards such as "[[Raigeki]]" or "[[Lightning Storm]]" can prove troublesome for the deck. Even if the player Tributes "Sunny" in response to the activation, "Ki-sikil" and "Lil-la" Summoned by "Sunny's" effect will not activate (since they are removed during the [[Chain|Chain's]] resolution). This leaves the player completely vulnerable to the opponent's counterplay.
  ** "[[Muckraker From the Underworld]]" is relatively easy to Summon and can provide protection. "Muckraker" has a replacement effect that can protect any number of Fiend monsters from destruction by Tributing 1 Fiend monster instead; in response to the opponent's board wipe, the player can Tribute "Sunny" to Special Summon "Ki-sikil" and "Lil-la" from the GY, then have Muckraker Tribute one of the two as the board wipe effect resolves (after which the remaining "Twin" can still Summon the other from the GY to trigger its effect). 
  ** If using "Fiendsmith" cards, "[[Fiendsmith's Desirae]]" can negate board wipe effects on the field outright.

