  "'''Evil★Twin'''" (イビルツイン ''Ibiru Tsuin'') is an [[archetype]] of [[DARK]] and [[LIGHT]] [[Fiend]] [[monster]]s which debuted in ''[[Deck-Build Pack: Genesis Impactors]]''. They share members with the "[[Ki-sikil]]" and "[[Lil-la]]" archetypes, and are also supported by the "[[Live☆Twin]]" archetype.

  == Lore ==
  {{Main|The Valuable Book EX card storylines#No. 04: Live☆Twin & Evil★Twin|The Valuable Book EX 3 card storylines#"Live☆Twin" Livestream!|The Valuable Book EX 5 card storylines#No. 8: The Frustrations of the Live☆Twins & Evil★Twins}}

  == Etymology ==
  The name "Evil★Twin" is likely a reference to [[wikipedia:Evil twin (wireless networks)|evil twin wireless networks]], which are fraudulent Wi-Fi access point that appear to be legitimate but are actually set up to eavesdrop on wireless communications. Usually, the intent is to steal unsuspecting users' passwords by either by monitoring their connections or by luring users to fraudulent websites to carry out phishing scams.

  The "Evil★Twin" and "Live☆Twin" archetypes also have a [[wikipedia:Palindrome#Semordnilap|play on the words]] ''evil'' and ''live'', with the "Live☆" cards depicting the characters' online personas and the "Evil★" cards showing them in reality.

  == Design ==
  The "Evil★Twin" and "Live☆Twin" archetypes are inspired by [[wikipedia:VTuber|VTuber]] online entertainers. The "Live☆Twin" monsters are the online appearances of "Ki-sikil" and "Lil-la", where they are comedic entertainers, while the "Evil★Twin" monsters are the real appearances of "Ki-sikil" and "Lil-la", who are [[wikipedia:Gentleman thief|phantom thieves]]. The ''[[wikipedia:Chibi (slang)|chibi]]'' art styles of the "Live☆Twins" appear to be inspired by anime and cartoon shows such as ''[[wikipedia:Panty & Stocking with Garterbelt|Panty & Stocking with Garterbelt]]'' and ''[[wikipedia:Hi Hi Puffy AmiYumi|Hi Hi Puffy AmiYumi]]''.

  The individual names of "Ki-sikil" and "Lil-la" are a reference to "Ki-sikil-lil-la-ke", a Sumerian night-demon, who was possibly the origin of the name [[wikipedia:Lilith|Lilith]].
  "[[Evil★Twin's Trouble Sunny]]" depicts a rival entertainment duo to "Ki-sikil" and "Lil-la" named Luna and Sunny (with Sunny also appearing in her online persona in "[[Live☆Twin Sunny's Snitch]]".

