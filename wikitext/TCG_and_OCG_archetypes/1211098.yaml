  === Weaknesses ===
  * While "[[The Sun God of Darkness - The Winged Dragon of Ra]]" is unaffected by card effects, it is vulnerable to cards that stop the player from activating effects during the Battle Phase (as they affect the player not the monster); such as "[[Chaos Ancient Gear Giant]]" and "[[Sangenpai Transcendent Dragion]]".
  * "[[The Sun God Leading Down into Darkness]]", as well as the ATK boosting effect of "The Sun God of Darkness", and the recursion effects of "[[The Immortal Sun God]]" and each Main Deck monster, relies on having access to the [[GY]], so anti-[[GY]] floodgates like "[[Dimension Shifter]]" and "[[Macro Cosmos]]" will hurt the archetype.

  == Trivia ==
  * The background in the artworks of all this archetype's monsters (except "[[The Sun God of Darkness - The Winged Dragon of Ra]]") and in the alternate artwork of "[[The Winged Dragon of Ra - Immortal Phoenix]]" (which debuted in the same set as this archetype) depicts the [[Seal of Memories]].

