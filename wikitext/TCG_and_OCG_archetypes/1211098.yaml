  "'''Sun God'''" ({{Ruby|太|たい}}{{Ruby|陽|よう}}{{Ruby|神|しん}} ''Taiyōshin'') is an [[archetype]] based on the cards played by [[Dark Marik (manga)|Dark Marik]]/[[Yami Marik]] in the [[Yu-Gi-Oh! (manga)|''Yu-Gi-Oh!'' manga]] and [[Yu-Gi-Oh! (anime)|anime]]. Its name is based on Dark Marik's main monster, "[[The Winged Dragon of Ra]]", and its strategy is focused on Summoning its original versions, as well as its newest form: "[[The Sun God of Darkness - The Winged Dragon of Ra]]". Initially a series with "[[Sun God Unification]]" and "[[The True Sun God]]", it became a full archetype in ''[[Immortal Phoenix]]''.

  It is the second theme to revolve around "The Winged Dragon of Ra", with the first being the [[Ra (series)|Ra]] series, which relies on cards [[mention]]ing it in their texts. Despite their separate gameplay mechanics, they have incidental synergy due to "[[The True Sun God]]" and "[[The Sun God Leading Down into Darkness]]" both being a "Sun God" card that mentions "The Winged Dragon of Ra", and both being able to search the cards from their respective themes.

  == Design ==
  This archetype's monsters are retrains (both in visuals and effects) of monsters used by [[Dark Marik (manga)|Dark Marik]]. "[[The Sun God of Darkness - The Winged Dragon of Ra]]" specifically is based on the form "[[The Sun Dragon Ra]]" takes when merged with Dark Marik due to its [[Point-to-Point Transfer]] ability.

  Its Spells and Traps are based on scenes from the [[Yu-Gi-Oh! (manga)|''Yu-Gi-Oh!'' manga]], usually those involving "The Winged Dragon of Ra". Notably, "[[The Sun God's Protector - Egyptian God Slime]]" is based on "[[God Slime (manga)|God Slime]]", taking the appearance of "[[Slifer the Sky Dragon (manga)|Slifer the Sky Dragon]]" instead of "[[The God of the Obelisk]]".

