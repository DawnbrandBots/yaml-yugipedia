  == Playstyle ==
  Going first, "Sun God" is a mid-range archetype that aims to use "[[The Immortal Sun God]]": a card that can Summon the archetype's [[unaffected]] boss monster, "[[The Sun God of Darkness - The Winged Dragon of Ra]]", but sends it to the GY at the end of the turn. After "The Immortal Sun God" is sent to the GY by any means, each of the [[Main Deck]] monsters as well as "The Immortal Sun God" itself can recur themselves from the GY. When "The Immortal Sun God" is used on the first turn, "The Sun God of Darkness" and the various monsters Summoned for the combo can be used as material for [[Extra Deck]] Summons. When "The Immortal Sun God" is used on the opponent's turn, "The Sun God of Darkness" can be used as a difficult-to-remove monster with a Quick Effect to force the opponent to send monsters in selected zones to the GY. It is possible to use it on both turns if enough engine is drawn.

  Going second, the archetype focuses on breaking the opponent's board, then performing an [[OTK]] using the high ATK of "The Sun God of Darkness". Failing that, it can fall back on the recursion naturally found in-archetype.

  Note that "Sun God" contains no locks beyond "[[The Sun God's Steelcage - Lava Golem]]", making the archetype flexible and easy to pair. In particular, it can make [[Rank 10]] monsters by using "The Sun God of Darkness" + "[[The Sun God's Protector - Egyptian God Slime]]".

  === Cards ===
  "[[The Sun God Leading Down into Darkness]]" is one of the archetype's main playmakers, which can dump a "The Winged Dragon of Ra" card as cost and search any "Sun God" monster. The former effect helps enable "[[The Immortal Sun God]]", which can Summon a "The Winged Dragon of Ra" monster from GY or banishment, then if it is the original "Ra" it can be sent to the GY to Summon its retrain, "[[The Sun God of Darkness - The Winged Dragon of Ra]]".

  Every Main Deck monster in the archetype can be turned into a board breaker thanks to the archetype's [[Contact Fusion]], "[[The Sun God's Steelcage - Lava Golem]]", which can be fused with 1 "Sun God" monster and 2 monsters on either field, although doing so only allows for one more Special Summon, effectively disabling "The Immortal Sun God" that turn. In addition, each Main Deck monster either has a search effect ("[[The Sun God's Poet - Helpoemer|Helpoemer]]", "[[The Sun God's Destructor - Makyura|Makyura]]") or a hindering effect ("[[The Sun God's Terror Machine - Gil Garth|Gil Garth]]", "[[The Sun God's Torture Device - Viser Des Shock|Viser Des Shock]]"), ''and'' each monster can recover itself from the GY if "[[The Immortal Sun God]]" was used that turn.

  "[[The True Sun God]]" boosts consistency by searching "The Sun God Leading Down into Darkness", most of the other in-archetype Spells/Traps, or any of the older "Ra" support cards like "[[The Winged Dragon of Ra - Sphere Mode]]". "[[The Sun God's Protector - Egyptian God Slime]]" is a [[Trap Monster]] that can be Summoned the turn its set through the effect of "The Sun God's Destructor - Makyura", and can search any "Sun God" card while acting as a Level 10 body to enable [[Rank 10]] plays. "[[Sun God Domination]]" Summons monsters from both GYs to your field, acting as GY disruption and can be activated on the first turn for advantage if searched through "Makyura". In addition, if the original "[[The Winged Dragon of Ra]]" is on field, it can take control of all monsters the opponent controls.

