  "'''Heavy Metal'''" is an [[archetype]] based on the cards used by [[Bandit Keith]] in the [[Yu-Gi-Oh! (anime)|''Yu-Gi-Oh!'' anime]] and [[Yu-Gi-Oh! (manga)|manga]]. Its first member, "[[Heavy Metal Raiders]]", was released in ''[[Legendary Duelists: Ancient Millennium]]''/''[[Duelist Pack: Legend Duelist 2]]'', but its first support will only be released in ''[[Maze of Machines]]''.

  While most of its cards are yet to be fully revealed, the currently announced details show the archetype supports [[DARK]] [[Machine]] monsters. 

  As it supports DARK Machines, it ties in well cards of the other series used by Bandit Keith: [[Gun Dragon]] and [[Motor]].

