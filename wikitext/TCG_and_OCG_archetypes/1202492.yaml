  "'''Angelechy'''" is a [[TCG-only|World Premiere]] [[archetype]] of [[LIGHT]] and [[DARK]] [[Fairy]] [[Synchro Monster]]s introduced in ''[[Chaos Origins]]''.

  == Design ==
  This archetype is based on [[wikipedia:chess|chess]] pieces and tactics; specifically, its monsters take their Fairy [[Type]] from [[wikipedia:fairy chess|fairy chess]], the area of chess composition in which there are changes to the standard rules of chess to express ideas impossible in orthodox chess. The LIGHT monsters are white to represent white pieces, while the DARK monsters are black to represent black pieces. Enforcing the chess theme, most monsters have effects to banish an opponent's card based on the capturing patterns of their corresponding pieces, while its Spell/Traps have effects focused on placing its monsters in the [[Spell & Trap Zone]] as [[Continuous Spell]]s to simulate the back rank of a chessboard. The only white piece without such an effect is "[[Angelechy Enlisted]]", fitting the fact that the piece it is based on (the pawn) does not begin chess games on the back rank; instead, it has an effect that allows it to '[[wikipedia:Promotion (chess)|promote]]' to another piece when it successfully 'captures' an opponent's monster by replacing itself with a different member from the [[Extra Deck]].

