  == Playing style ==
  Most monsters in this archetype have [[Continuous Effect]]s that applies to one or both players while they are treated as Continuous Spells, thus acting as [[List of unofficial terms|floodgate]]s in most cases. Despite this, the theme seems to be meant to be played going second due to its most powerful combo enabler, "[[Angelechy Opening to e4]]", allowing the player to set up their board during the opponent's first [[Standby Phase]], which usually means being able to play before the opponent has the chance to make any or the most of their moves. Furthermore, all "Angelechy" monsters requires the opponent to control a monster (which is less likely when the player goes first) in order to use their [[Ignition Effect]]s, and the other "Angelechy" Traps have effects that can be activated from the [[Graveyard]], thus giving them a use even without the need to wait a turn after [[Set]]ting them (which can also be bypassed by "[[Angelechy Endgame Problem]]").

  The total lack of [[Main Deck]] monsters allows the archetype to be easily [[List of unofficial terms|splashed]] in any Deck that can afford the investment it needs in terms of [[Extra Deck]] space, but it inherently clashes with non-Synchro, non-LIGHT and/or DARK archetypes due to the [[List of unofficial terms|locks]] some of its cards put on the player. However, it is possible to sacrifice part of the engine and only keep the cards that do not lock the player whatsoever, which still allows a compact engine to be included virtually everywhere - even in Decks that restrain the player's monster effects, since the best effects of "Angelechy" monsters are treated as Spell effects - and gaining value from the card advantage it offers. Alternatively, a pure "Angelechy" Deck can be filled with any sort of engine able to perform a [[Level]] 8 Synchro 1-card combo, because "[[Witness of the Ancient]]" allows any of them to [[List of unofficial terms|bridge]] into the archetype via the generic "[[Glitch Clutch Nullgainer]]". The latter can also assist in an easy Summon of "[[Ultimaya Tzolkin]]", which can Summon either powerful monsters to add to the player's end board or "[[Ancient Fairy Dragon]]", which in turn can either switch between the two [[Field Spell]]s the archetype possess or bridge into any to Deck that can get started by a Field Spell.

