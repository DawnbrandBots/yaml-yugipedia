  === Weaknesses ===
  * Due to revolving around placing its monsters as Continuous Spells - which forces them to [[Continuous Spell#Must remain on-field to resolve on-field effect|remain on-field to resolve on-field effects]] - the archetype is extremely vulnerable to Spell/Trap removal, especially those that can get around "[[Angelechy Bastion]]" by [[banish]]ing instead of [[destroy]]ing them, such as "[[Cosmic Cyclone]]". They can also be negated by "[[Silent Insect]]".
  * While not truly a weakness so much as an incidental flaw, "Angelechy Opening to e4" specifically Summons a monster in the [[Extra Monster Zone]], making it unplayable in [[Genesys]]. The rest of the archetype remains playable and effective, but take note that it will lack its most powerful card.

