  "'''Harpie Lady'''" (ハーピィ・レディ ''Hāpyi Redi'') is a "[[Harpie]]" sub-[[archetype]] consisting of "[[Harpie Lady]]" and its different forms, used by [[Mai Valentine]] in the [[Yu-Gi-Oh! (anime)|''Yu-Gi-Oh!'' anime]] and [[Yu-Gi-Oh! (manga)|manga]]. While having members since the release of "Harpie Lady" and "[[Harpie Lady Sister]]", it would only become an archetype with the support in ''[[Immortal Phoenix]]''.

  Due to the common effect of "Harpie" monsters to change their names to "Harpie Lady" while on the field and in the Graveyard, this archetype's support effectively extends to far more cards than its formal members.

