  "'''The Winged Dragon of Ra'''", known as "'''The Winged Divine Dragon of Ra'''" (ラーの{{Ruby|翼|よく}}{{Ruby|神|しん}}{{Ruby|竜|りゅう}} ''Rā no Yokushinryū'') in Japanese, is a [[archetype]] consisting of "[[The Winged Dragon of Ra]]" and its different forms. Initially only supported in [[Speed Duel]]s by the [[Skill Card]] "[[Advent of Ra]]", it was later established as a proper ''[[TCG]]''/''[[OCG]]'' archetype in ''[[Immortal Phoenix]]''.

