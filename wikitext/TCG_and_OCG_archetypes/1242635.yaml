  "'''Void Ogre Dragon'''", known as "'''Purgatory Dragon Ogre Dragoon'''" ({{Ruby|煉|れん}}{{Ruby|獄|ごく}}{{Ruby|龍|りゅう}} オーガ・ドラグーン ''Rengokuryū Ōga Doragūn'') in Japanese, is a "[[Void]]" sub-[[archetype]] consisting of "[[Void Ogre Dragon]]" and its different forms, used by [[Kalin Kessler (manga)|Kalin Kessler]] in the [[Yu-Gi-Oh! 5D's (manga)|''Yu-Gi-Oh! 5D's'' manga]]. Its only current support is "[[Zero Gate of the Void]]".

